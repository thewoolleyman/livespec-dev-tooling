# pyproject.toml — livespec-dev-tooling.
#
# Authority for every rule expressed here is the live specification at
# livespec/SPECIFICATION/ (notably non-functional-requirements.md
# §"Toolchain pins", §"Shared content provenance", §"Linter rule set",
# §"Typechecker rule set", §"Code coverage thresholds") plus this
# library's own SPECIFICATION/ tree once seeded at Phase G.3 of epic
# li-fgqgnk.
#
# This file is HAND-AUTHORED (not generated from copier). The epic
# YAGNI'd templates/library/ until a second library variant appears;
# when it does, a future propose-change cycle MAY extract this file's
# common shape into a templates/library/pyproject.toml.jinja.
#
# Has a [build-system] section: livespec-dev-tooling IS installable
# (consumed by every livespec-governed repo via uv git source per
# livespec/SPECIFICATION/contracts.md §"Shared code sync —
# livespec-dev-tooling").

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "livespec-dev-tooling"
version = "0.50.3"
description = "Shared enforcement-suite library for livespec-governed projects: ruff/pyright/coverage gates, AST checks, CI-alignment checks, red-green-replay discipline. Python package plus composite Actions and reusable workflows."
requires-python = ">=3.10.16"
authors = [
    { name = "Chad Woolley", email = "thewoolleyman@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"

# NO [project.dependencies]: livespec-dev-tooling's checks shell out
# to project-local tools (ruff, pyright, pytest) via subprocess; they
# do not import third-party packages. The library is intentionally
# dependency-free at runtime so consumers pay zero transitive-pin
# cost when adding it to their [dependency-groups].dev table.

[tool.hatch.build.targets.wheel]
packages = ["livespec_dev_tooling"]

[dependency-groups]
# Every Python dev tool is uv-managed via this table (resolved into
# uv.lock; installed into a project-local .venv via
# `uv sync --all-groups`). Mise pins only the non-Python binaries
# in .mise.toml. Versions mirror livespec-core's pins exactly per
# livespec/SPECIFICATION/non-functional-requirements.md
# §"Shared content provenance".
dev = [
    "ruff==0.8.6",
    "pyright==1.1.391",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-icdiff==0.9",
    "pytest-xdist==3.8.0",
    "hypothesis==6.122.3",
    "hypothesis-jsonschema==0.23.1",
    "mutmut==3.2.3",
    "import-linter==2.1",
]

# ---------------------------------------------------------------------------
# livespec-dev-tooling self-application layout (li-asybpo).
#
# Per SPECIFICATION/constraints.md §"Self-application" + contracts.md
# §"Consumer configuration schema", `just check` runs every shared check
# against this library's OWN source tree. This block declares the flat
# package layout and the role keys this library needs.
#
# The fleet-check-coverage git-derived-universe change made the file-role
# checks walk this repo's first-party Python universe
# (`livespec_dev_tooling/**`) instead of no-opping: no_except_outside_io,
# no_raise_outside_io, public_api_result_typed, no_write_direct,
# no_lloc_soft_warnings, and newtype_domain_primitives now cover
# `livespec_dev_tooling/**` at Phase-0 WARN (they hard-fail once this repo
# is flipped to the hard gate in Phase 2), per contracts.md §"Role keys".
#
# `supervisor_entry_files` below declares the five CLI/supervisor files
# whose `main()` / `_write` helpers own legitimate stdout/stderr contracts
# (JSON payloads, CLI reports, streamed subprocess output) — the exact
# surface `no_write_direct` exempts. The remaining role keys (io_trees,
# commands_trees, dataclasses_tree, pure_trees, covered_trees) stay
# empty/null: this flat-layout library has no code in those roles.
# ---------------------------------------------------------------------------

[tool.livespec_dev_tooling]
source_trees = ["livespec_dev_tooling"]
target_dirs = ["livespec_dev_tooling"]
source_tree_prefixes = ["livespec_dev_tooling/"]
# Phase-2 flip (fleet-check-coverage epic livespec-i5ebqd): arm the file_lloc
# hard gate over this repo's whole git-derived first-party universe. Every
# first-party .py is <=250 LLOC after the decomposition, so >250 now hard-fails
# (severity increase only — no escape hatch).
file_lloc_hard_gate = true
plan_lifecycle_anchor = true
mirror_pairings = [
    { source_tree = "livespec_dev_tooling", test_tree = "tests/livespec_dev_tooling" },
]
# CLI/supervisor entry files whose `main()` / `_write` helpers own
# legitimate stdout/stderr contracts — the surface `no_write_direct`
# (and `no_except_outside_io`) exempt. Each write here is a JSON payload,
# a CLI report, an error diagnostic, or streamed subprocess output:
#   - canonical_checks.py           main() → JSON `{"slugs": [...]}` to stdout
#   - cross_repo/pin_autodiscovery.py  main() → discovered-pin JSON to stdout
#   - fleet/merged_branch_sweep.py  main() → sweep report to stdout + unresolvable/manifest errors to stderr
#   - parallel_check_dispatcher.py  _write() streams per-target subprocess output to stdout
#   - red_leg_scope.py              _write() emits the computed Red skip set to stdout
#   - cross_repo/justfile_canonical_reconcile.py  main() → `::notice::` annotations to stdout
#   - cross_repo/ci_yaml_canonical_reconcile.py  main() → in-place ci.yml matrix reconcile; `::notice::` / `::error::` annotations to stdout
#   - cross_repo/fabro_image_pin_rewrite.py  main() → in-place fabro docker pin rewrite; `::error::` on miss
#   - cross_repo/codex_acp_pin_rewrite.py  main() → in-place codex-acp Dockerfile ARG rewrite; `::error::` on miss
#   - cross_repo/pin_rewrite.py  main() → in-place legacy regex pin rewrites; `::error::` on miss
supervisor_entry_files = [
    "livespec_dev_tooling/canonical_checks.py",
    "livespec_dev_tooling/cross_repo/ci_yaml_canonical_reconcile.py",
    "livespec_dev_tooling/cross_repo/codex_acp_pin_rewrite.py",
    "livespec_dev_tooling/cross_repo/fabro_image_pin_rewrite.py",
    "livespec_dev_tooling/cross_repo/justfile_canonical_reconcile.py",
    "livespec_dev_tooling/cross_repo/pin_rewrite.py",
    "livespec_dev_tooling/cross_repo/pin_staleness.py",
    "livespec_dev_tooling/cross_repo/pin_autodiscovery.py",
    "livespec_dev_tooling/fleet/merged_branch_sweep.py",
    "livespec_dev_tooling/parallel_check_dispatcher.py",
    "livespec_dev_tooling/red_leg_scope.py",
]
# Integration-tier-or-above node-id prefix allowlist for the
# `heading_coverage` check's `scenarios.md` tier gate (per
# `SPECIFICATION/constraints.md` §"Heading taxonomy"): a `scenarios.md`
# registry entry whose mapped test node id begins with one of these
# prefixes is accepted as consumer/integration-tier coverage. This repo's
# consumer-tier check-runner suite lives under `tests/consumer/` (node-id
# prefix `tests.consumer`), so only that prefix is declared.
scenario_tiers = ["tests.consumer"]

# Repo-root-relative path prefixes the `tests_no_subprocess_spawn` check
# (`check-tests-no-subprocess-spawn`, epic 7us / work-item
# livespec-dev-tooling-4i5) exempts from its test-spawned-Python-subprocess
# scan. The check forbids `subprocess.run([sys.executable, ...])` (and
# python/python3-literal spawns) in `tests/` by default: such a child under
# `pytest --cov` self-instruments and races concurrent coverage runs under the
# parallel dispatcher (the 7us.6 flaky "No data to report" bug), and the spawn
# is materially slower than the in-process `main()` pattern
# (`monkeypatch.chdir(tmp_path)` + `capsys` + `rc = main()`).
#
# This list is the HONEST CURRENT STATE of the suite, NOT an endorsement of the
# pattern. Every entry is a test that today spawns a Python subprocess; it
# SHRINKS as gratuitous spawns are converted to in-process `main()` (the
# deferred 7us conversion follow-up, tracked separately). Entries that
# genuinely need a real subprocess (git / commit-refuse-hook / CLI-binary
# behavior) stay AND must scrub COVERAGE_PROCESS_START + COV_CORE_* from the
# child env so the child does not self-instrument.
subprocess_spawn_allowlist = [
    "tests/consumer/test_package_consumption.py",
    "tests/consumer/test_reusable_check_matrix.py",
    "tests/consumer/test_self_application_regression.py",
    "tests/consumer/test_semver_and_bump_shape.py",
    "tests/livespec_dev_tooling/agent_hooks/test_pretooluse_background_guard.py",
    "tests/livespec_dev_tooling/agent_hooks/test_subagent_stop_guard.py",
    "tests/livespec_dev_tooling/checks/test_all_declared.py",
    "tests/livespec_dev_tooling/checks/test_assert_never_exhaustiveness.py",
    "tests/livespec_dev_tooling/checks/test_branch_protection_alignment.py",
    "tests/livespec_dev_tooling/checks/test_check_coverage_incremental.py",
    "tests/livespec_dev_tooling/checks/test_check_mutation.py",
    "tests/livespec_dev_tooling/checks/test_check_tools.py",
    "tests/livespec_dev_tooling/checks/test_ci_matrix_completeness.py",
    "tests/livespec_dev_tooling/checks/test_claude_md_coverage.py",
    "tests/livespec_dev_tooling/checks/test_comment_line_anchors.py",
    "tests/livespec_dev_tooling/checks/test_commit_pairs_source_and_test.py",
    "tests/livespec_dev_tooling/checks/test_config_driven_checks.py",
    "tests/livespec_dev_tooling/checks/test_heading_coverage.py",
    "tests/livespec_dev_tooling/checks/test_keyword_only_args.py",
    "tests/livespec_dev_tooling/checks/test_master_ci_green.py",
    "tests/livespec_dev_tooling/checks/test_match_keyword_only.py",
    "tests/livespec_dev_tooling/checks/test_newtype_domain_primitives.py",
    "tests/livespec_dev_tooling/checks/test_no_direct_tool_invocation.py",
    "tests/livespec_dev_tooling/checks/test_no_except_outside_io.py",
    "tests/livespec_dev_tooling/checks/test_no_fmt_directives.py",
    "tests/livespec_dev_tooling/checks/test_no_raise_outside_io.py",
    "tests/livespec_dev_tooling/checks/test_no_write_direct.py",
    "tests/livespec_dev_tooling/checks/test_pbt_coverage_pure_modules.py",
    "tests/livespec_dev_tooling/checks/test_per_file_coverage.py",
    "tests/livespec_dev_tooling/checks/test_primary_checkout_commit_refuse_hook_installed.py",
    "tests/livespec_dev_tooling/checks/test_private_calls.py",
    "tests/livespec_dev_tooling/checks/test_public_api_result_typed.py",
