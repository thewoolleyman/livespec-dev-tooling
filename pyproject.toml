# pyproject.toml — livespec-dev-tooling.
#
# Authority for every rule expressed here is the live specification at
# livespec/SPECIFICATION/ (notably non-functional-requirements.md
# §"Toolchain pins", §"Shared content provenance", §"Linter rule set",
# §"Typechecker rule set", §"Code coverage thresholds") plus this
# library's own SPECIFICATION/ tree once seeded at Phase G.3 of epic
# li-fgqgnk.
#
# This file is HAND-AUTHORED (not generated from copier). The epic
# YAGNI'd templates/library/ until a second library variant appears;
# when it does, a future propose-change cycle MAY extract this file's
# common shape into a templates/library/pyproject.toml.jinja.
#
# Has a [build-system] section: livespec-dev-tooling IS installable
# (consumed by every livespec-governed repo via uv git source per
# livespec/SPECIFICATION/contracts.md §"Shared code sync —
# livespec-dev-tooling").

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "livespec-dev-tooling"
version = "1.8.2"
description = "Shared enforcement-suite library for livespec-governed projects: ruff/pyright/coverage gates, AST checks, CI-alignment checks, red-green-replay discipline. Python package plus composite Actions and reusable workflows."
requires-python = ">=3.10.16"
authors = [
    { name = "Chad Woolley", email = "thewoolleyman@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"

# NO [project.dependencies]: livespec-dev-tooling's checks shell out
# to project-local tools (ruff, pyright, pytest) via subprocess; they
# do not import third-party packages. The library is intentionally
# dependency-free at runtime so consumers pay zero transitive-pin
# cost when adding it to their [dependency-groups].dev table.

[tool.hatch.build.targets.wheel]
packages = ["livespec_dev_tooling"]

[dependency-groups]
# Every Python dev tool is uv-managed via this table (resolved into
# uv.lock; installed into a project-local .venv via
# `uv sync --all-groups`). Mise pins only the non-Python binaries
# in .mise.toml. Versions mirror livespec-core's pins exactly per
# livespec/SPECIFICATION/non-functional-requirements.md
# §"Shared content provenance".
dev = [
    "ruff==0.8.6",
    "pyright==1.1.391",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-icdiff==0.9",
    "pytest-xdist==3.8.0",
    "hypothesis==6.122.3",
    "hypothesis-jsonschema==0.23.1",
    "mutmut==3.2.3",
    "import-linter==2.1",
]

# ---------------------------------------------------------------------------
# livespec-dev-tooling self-application layout (li-asybpo).
#
# Per SPECIFICATION/constraints.md §"Self-application" + contracts.md
# §"Consumer configuration schema", `just check` runs every shared check
# against this library's OWN source tree. This block declares the flat
# package layout and the role keys this library needs.
#
# The fleet-check-coverage git-derived-universe change made the file-role
# checks walk this repo's first-party Python universe
# (`livespec_dev_tooling/**`) instead of no-opping: no_except_outside_io,
# no_raise_outside_io, public_api_result_typed, no_write_direct,
# no_lloc_soft_warnings, and newtype_domain_primitives now cover
# `livespec_dev_tooling/**` at Phase-0 WARN (they hard-fail once this repo
# is flipped to the hard gate in Phase 2), per contracts.md §"Role keys".
#
# `supervisor_entry_files` below declares this repo's CLI/supervisor entry
# files. Adding a path here grants it FOUR separate exemptions, so weigh
# all four before adding one:
#   - `no_write_direct` exempts the WHOLE FILE from the direct-write ban
#     (its `main()` / `_write` helpers own legitimate stdout/stderr
#     contracts: JSON payloads, CLI reports, streamed subprocess output).
#     Note this is a whole-file exemption, not a `main()`-scoped one: a
#     `print()` added anywhere in a listed file goes unflagged, which
#     matters most for a guard hook, where stdout is a live hook-protocol
#     channel rather than a report surface.
#   - `supervisor_discipline` exempts it from the `sys.exit` /
#     `raise SystemExit` confinement rule.
#   - `no_except_outside_io` treats a `main()` direct-child `try` in it as
#     the sole supervisor boundary where a MARKED broad catch is permitted.
#   - `public_api_result_typed` treats a supervisor entry point in it as
#     exempt from the Result-return rule — ratified member 4 of the
#     EXHAUSTIVE four-member exemption set in livespec v177
#     (`non-functional-requirements.md` §"ROP composition"). Bounded: it
#     exempts supervisor ENTRY POINTS, never every function in the file.
# `partition_completeness` also reads this key, but it is NOT in the list
# above and does NOT belong there: it is a STRUCTURAL meta-check recording
# which role claims each file, so it grants no exemption. Per contracts.md
# §"Role keys", the per-key consumer enumerations name behavioral consumers
# and exclude it and `source_trees_scoped_to_consumer` by rule.
# The remaining role keys split into two groups, and the split is load-bearing
# (livespec-dev-tooling-8o8e.1).
#
# `io_trees`, `commands_trees` and `covered_trees` stay a bare `[]`. They are
# EXEMPTION / SEVERITY PREDICATES: their consuming checks derive the file
# universe from `resolve_check_universe()` and read the key only to decide what
# is exempt, so an empty value makes those checks STRICTER, never blinder. With
# `io_trees` empty nothing is wholesale exempt from the catch-position and
# domain-raise checks — they inspect the whole `source_trees` universe.
#
# `pure_trees`, `dataclasses_tree` and `neutral_hook_body_path` are NO LONGER
# empty, and an empty value for them is no longer sanctioned. Their `[]` / `""`
# spelling carried two incompatible meanings — "does not apply here" versus
# "applies and is switched off" — so each now declares one of the four blessed
# variants (`not_applicable`, `superseded_by`, `unarmed_until`,
# `convention_not_adopted`), carrying its reason in the PARSED VALUE rather than
# in a comment no checker can read. A bare `[]` / `""` now parses to
# `LegacyAmbiguousEmpty` and WARNs; it becomes a hard `ConfigParseError` once
# every repo has migrated. See each declaration below.
# ---------------------------------------------------------------------------

[tool.livespec_dev_tooling]
source_trees = ["livespec_dev_tooling"]
target_dirs = ["livespec_dev_tooling"]
source_tree_prefixes = ["livespec_dev_tooling/"]
# Flat-layout library has no wholesale IO exemption tree.
io_trees = []
# Flat-layout library has no command-surface subtree.
commands_trees = []
# NOT APPLICABLE, not deferred: a flat-layout library has no pure-module subtree at all,
# so the mutation / PBT / public-api-result gates that read this role have nothing to scan
# here. Distinct from `livespec` and `livespec-overseer`, which have the same EMPTY value
# for the opposite reason (`unarmed_until = "livespec-mutreal.1"`) — telling those two
# states apart is the whole point of the union (livespec-dev-tooling-8o8e.1).
pure_trees = { not_applicable = "flat-layout library has no pure-module subtree" }
# Coverage/size checks derive this repo's first-party universe from git.
covered_trees = []
# NOT APPLICABLE: a flat-layout library has no dataclasses/schema tree for
# `check-newtype-domain-primitives` to police.
dataclasses_tree = { not_applicable = "flat-layout library has no dataclasses schema tree" }
# NOT APPLICABLE: this repo PRODUCES the canonical no-shadow-ledger body (it ships
# `CANONICAL_NO_SHADOW_LEDGER_BODY` and the installer) but INSTALLS no neutral hook body of
# its own — only the two Drivers do. There is no local file for
# `check-no-shadow-ledger-body-identical` to byte-compare.
neutral_hook_body_path = { not_applicable = "produces the canonical body but installs no neutral hook body" }
# Phase-2 flip (fleet-check-coverage epic livespec-i5ebqd): arm the file_lloc
# hard gate over this repo's whole git-derived first-party universe. Every
# first-party .py is <=250 LLOC after the decomposition, so >250 now hard-fails
# (severity increase only — no escape hatch).
file_lloc_hard_gate = true
plan_lifecycle_anchor = true
mirror_pairings = [
    { source_tree = "livespec_dev_tooling", test_tree = "tests/livespec_dev_tooling" },
]
# The surface OTHER governed repos consume, per SPECIFICATION v036
# §"Role keys". Read by `public_api_result_typed`, which cannot see a
# sibling's import from inside this checkout. TIGHTENING-ONLY: every entry
# ADDS a name to the Result-return rule's scope, and an omission removes
# nothing the repo-local oracle already sees. Measured against all eight
# siblings' masters rather than inherited; the CONSTANTS and CLASSES they
# import (`CANONICAL_NO_SHADOW_LEDGER_BODY`, `CliResult`, `HarnessConfig`,
# `FixturedSkill`, `CoverageGateError`) are deliberately absent — the rule
# reaches top-level FUNCTIONS.
#
# THREE MEASURED CROSS-REPO CONSUMPTIONS ARE DELIBERATELY NOT LISTED, and
# each omission is a FINDING rather than an oversight. All three are real —
# a sibling genuinely imports the name — but declaring them would assert a
# scope this check does not actually apply, which is the manufactured
# confidence the whole epic exists to remove:
#
#   - `fleet/_context.py`'s `resolve_owner`, imported by
#     `livespec-orchestrator-beads-fabro`'s `codex_yolo_gate.py` hook, and
#   - `testing/_cli_e2e_discovery.py`'s `discover_fixtures`, reached by four
#     siblings as `cli_e2e.discover_fixtures` through a re-export.
#     Both are PUBLIC names inside package-PRIVATE modules. This check skips
#     `_`-prefixed FILES wholesale, while v178 clause 0 disqualifies only a
#     `_`-prefixed NAME — so the file-level skip is wider than the ratified
#     rule, and a cross-repo consumer is reaching through it.
#   - `config.py`'s `iter_first_party_py_files`, imported by
#     `livespec-orchestrator-git-jsonl`'s test tree. config.py is not in the
#     check universe AT ALL: `is_generated` matches its own `# ... @generated`
#     prose, so it excludes itself. Filed as `livespec-dev-tooling-995m`.
cross_repo_public_api = [
    { file = "livespec_dev_tooling/canonical_checks.py", function = "canonical_check_slugs", reason = "product import: livespec's canonical_slugs_projection.py, copier_template_smoke_canonical.py and doctor/static/wiring_completeness_cross_repo.py" },
    { file = "livespec_dev_tooling/fleet/contract.py", function = "parse_manifest", reason = "product import: livespec-orchestrator-beads-fabro's .claude-plugin/hooks/codex_yolo_gate.py — the dx8l consumer" },
    { file = "livespec_dev_tooling/testing/cli_e2e.py", function = "test_workflow_full_round_trip", reason = "cross-repo test import: the e2e round-trip suites of both Drivers and both orchestrators" },
    { file = "livespec_dev_tooling/testing/cli_e2e.py", function = "assert_coverage", reason = "cross-repo test import: livespec-driver-codex's tests/e2e-cli/test_cli_e2e.py" },
]
# livespec v179 member 2 / SPECIFICATION v037: public `X | None` returns whose
# `None` models a legitimate ABSENCE rather than a failure. RELAXING-ONLY, so
# an EMPTY list is the STRICT end of this key — the opposite polarity from the
# five union role keys, where empty was the blinding value. Every entry needs a
# reason naming why the `None` is an absence, and both the structural `X | None`
# gate (bound 1) and the staleness detector (bound 3) HARD-FAIL in
# `public_api_result_typed`.
total_absence_returns = [
    { file = "livespec_dev_tooling/cross_repo/fabro_image_pin_rewrite.py", function = "tag_version_component", reason = "absence, not failure: a docker tag legitimately HAS no version component, so `None` is an ordinary answer every caller acts on. Converting it would force each caller to unwrap a Failure for a non-failure. Established four separate times across the rop-railway-enforcement thread: it sat in that triage's STRONGEST convert class (a hand-rolled `X | None` failure track) and was still not a conversion, which is what produced the standing rule to read every function a classification convicted." },
]
# CLI/supervisor entry files whose `main()` / `_write` helpers own
# legitimate stdout/stderr contracts — the surface `no_write_direct`
# (and `no_except_outside_io`) exempt. Each write here is a JSON payload,
# a CLI report, an error diagnostic, or streamed subprocess output:
#   - canonical_checks.py           main() → JSON `{"slugs": [...]}` to stdout
#   - cross_repo/pin_autodiscovery.py  main() → discovered-pin JSON to stdout
#   - fleet/merged_branch_sweep.py  main() → sweep report to stdout + unresolvable/manifest errors to stderr
#   - parallel_check_dispatcher.py  _write() streams per-target subprocess output to stdout
#   - red_leg_scope.py              _write() emits the computed Red skip set to stdout
#   - cross_repo/justfile_canonical_reconcile.py  main() → `::notice::` annotations to stdout
#   - cross_repo/ci_yaml_canonical_reconcile.py  main() → in-place ci.yml matrix reconcile; `::notice::` / `::error::` annotations to stdout
#   - cross_repo/fabro_image_pin_rewrite.py  main() → in-place fabro docker pin rewrite; `::error::` on miss
#   - cross_repo/codex_acp_pin_rewrite.py  main() → in-place codex-acp Dockerfile ARG rewrite; `::error::` on miss
#   - cross_repo/pin_rewrite.py  main() → in-place legacy regex pin rewrites; `::error::` on miss
#   - cross_repo/bump_pr_supersession.py  main() → JSON close plan for superseded bump PRs to stdout
#   - agent_hooks/pretooluse_background_guard.py  main() → sole fail-open hook boundary
#   - agent_hooks/subagent_stop_guard.py          main() → sole fail-open hook boundary
supervisor_entry_files = [
    # The PreToolUse guard hook is a supervisor entry artifact: its `main()`
    # carries the ONE fail-open boundary catch livespec
    # non-functional-requirements.md line 114 grants a hook, and the file owns
    # the hook-protocol stdout contract that `no_write_direct` otherwise bans.
    # Listing it here is what makes both exemptions legible; it is NOT in
    # `io_trees`, because the same clause forecloses exempting a hook tree
    # wholesale ("There is NO 'thin repo' exemption").
    ".claude/hooks/livespec_footgun_guard.py",
    "livespec_dev_tooling/agent_hooks/pretooluse_background_guard.py",
    "livespec_dev_tooling/agent_hooks/subagent_stop_guard.py",
    "livespec_dev_tooling/canonical_checks.py",
    "livespec_dev_tooling/cross_repo/ci_yaml_canonical_reconcile.py",
    "livespec_dev_tooling/cross_repo/codex_acp_pin_rewrite.py",
    "livespec_dev_tooling/cross_repo/fabro_image_pin_rewrite.py",
    "livespec_dev_tooling/cross_repo/justfile_canonical_reconcile.py",
    "livespec_dev_tooling/cross_repo/pin_rewrite.py",
    "livespec_dev_tooling/cross_repo/pin_staleness.py",
    "livespec_dev_tooling/cross_repo/pin_autodiscovery.py",
    "livespec_dev_tooling/cross_repo/bump_pr_supersession.py",
    "livespec_dev_tooling/fleet/merged_branch_sweep.py",
    "livespec_dev_tooling/parallel_check_dispatcher.py",
    "livespec_dev_tooling/red_leg_scope.py",
    # --- Class B: the nine remaining `main() -> int` supervisors, declared
    # ONE AT A TIME with a written reason, never as a batch. Each was checked
    # against ALL FOUR exemptions above rather than against the one that
    # motivated the entry.
    #
    # WHAT EVERY ONE OF THE NINE ACTUALLY NEEDS: exactly ONE — the
    # `public_api_result_typed` exemption for its `main() -> int`. MEASURED
    # per file: none carries a broad `except Exception`, so
    # `no_except_outside_io` is unused; only `dispatch_matrix_filter` writes
    # directly, so `no_write_direct` is unused by the other eight; and every
    # file's `raise SystemExit(main())` tail is ALREADY tolerated by
    # `supervisor_discipline` (it exempts that form outside the plugin-scripts
    # tree, `checks/supervisor_discipline.py:93`), so that exemption is unused
    # by all nine.
    #
    # SO THE COST IS REAL AND IS RECORDED RATHER THAN GLOSSED: each entry
    # grants three exemptions the file does not need today, which means a
    # LATER edit adding a broad catch or a stray `print()` to any of these
    # nine goes unflagged. That is a genuine widening of the unflagged
    # surface, accepted here because ratified livespec v177 member 4 grants
    # per FILE and there is no narrower spelling — not because the extra
    # three are harmless.
    #
    # WHAT QUALIFIES EACH: it is a genuine process entry artifact — a
    # `__main__` guard, a `main() -> int`, a `raise SystemExit(main())` tail,
    # and an invocation as a PROCESS rather than by import. That is exactly
    # the category member 4 admits, and it creates no new class.

    # `just check-local-memory-drift-audit`. Audits agent-memory drift and
    # returns the check exit code.
    "livespec_dev_tooling/checks/local_memory_drift_audit.py",
    # `just check-required-role-keys-declared`. The role-key declaration gate;
    # its `main()` is the check supervisor.
    "livespec_dev_tooling/checks/required_role_keys_declared.py",
    # `just` + the release-dispatch workflow. THE ONE ENTRY THAT ALSO NEEDS
    # `no_write_direct`: line 209 prints a `::warning::` workflow command that
    # the Actions runner parses from stdout, so stdout is a protocol channel
    # here rather than a report surface.
    "livespec_dev_tooling/fleet/dispatch_matrix_filter.py",
    # `just ensure-plugins` / `ensure-codex-plugins`. Reconciles marketplace
    # and plugin registration; `main()` returns the reconcile exit code.
    "livespec_dev_tooling/fleet/ensure_plugins.py",
    # `just` + `.github/workflows/ci.yml`. Installs the commit-refuse hooks;
    # `main()` is the installer supervisor.
    "livespec_dev_tooling/install_commit_refuse_hooks.py",
    # `just install-no-shadow-ledger`. Installs the neutral hook body.
    "livespec_dev_tooling/install_no_shadow_ledger.py",
    # `just` + `.github/workflows/ci.yml`. Installs the worktree pack.
    "livespec_dev_tooling/install_worktree_pack.py",
    # THE BAKED CLI. Not invoked from this repo's justfile at all: the base
    # image `COPY`s this one file to `/usr/local/bin/livespec-step-timer`
    # (`docker/fabro-sandbox/base/Dockerfile:106`) and 15 fleet-wide
    # references invoke that BINARY. Its `main` is the residual offender left
    # by PR #832, which narrowed the file's `__all__` to its boundary-crossing
    # surface; #832 deliberately did NOT bundle this declaration, so the
    # four-exemption judgement could be made here with the other eight.
    "livespec_dev_tooling/otel_step_timer.py",
    # `just` — the TDD commit ritual driver; `main()` returns the hook's
    # refuse/accept exit code.
    "livespec_dev_tooling/tdd_commit.py",
]
# Integration-tier-or-above node-id prefix allowlist for the
# `heading_coverage` check's `scenarios.md` tier gate (per
# `SPECIFICATION/constraints.md` §"Heading taxonomy"): a `scenarios.md`
# registry entry whose mapped test node id begins with one of these
# prefixes is accepted as consumer/integration-tier coverage. This repo's
# consumer-tier check-runner suite lives under `tests/consumer/` (node-id
# prefix `tests.consumer`), so only that prefix is declared.
scenario_tiers = ["tests.consumer"]

# Repo-root-relative path prefixes the `tests_no_subprocess_spawn` check
# (`check-tests-no-subprocess-spawn`, epic 7us / work-item
# livespec-dev-tooling-4i5) exempts from its test-spawned-Python-subprocess
# scan. The check forbids `subprocess.run([sys.executable, ...])` (and
# python/python3-literal spawns) in `tests/` by default: such a child under
# `pytest --cov` self-instruments and races concurrent coverage runs under the
# parallel dispatcher (the 7us.6 flaky "No data to report" bug), and the spawn
# is materially slower than the in-process `main()` pattern
# (`monkeypatch.chdir(tmp_path)` + `capsys` + `rc = main()`).
#
# This list is the HONEST CURRENT STATE of the suite, NOT an endorsement of the
# pattern. Every entry is a test that today spawns a Python subprocess; it
# SHRINKS as gratuitous spawns are converted to in-process `main()` (the
# deferred 7us conversion follow-up, tracked separately). Entries that
# genuinely need a real subprocess (git / commit-refuse-hook / CLI-binary
# behavior) stay AND must scrub COVERAGE_PROCESS_START + COV_CORE_* from the
# child env so the child does not self-instrument.
subprocess_spawn_allowlist = [
    "tests/consumer/test_package_consumption.py",
    "tests/consumer/test_reusable_check_matrix.py",
    "tests/consumer/test_self_application_regression.py",
