# ---------------------------------------------------------------------------
# Ruff — sole linter, formatter, import-sorter, complexity checker.
# Rule set mirrors livespec/pyproject.toml [tool.ruff] per
# livespec/SPECIFICATION/non-functional-requirements.md §"Linter rule set".
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["**/_vendor/**", "**/__pycache__/**", "mutants/**"]

[tool.ruff.lint]
# 28 categories: v011 baseline (11) + v012 additions (16) + BLE. Per
# livespec/SPECIFICATION/non-functional-requirements.md §"Linter rule set".
# BLE is what makes the sanctioned `# noqa: BLE001 — sole …` boundary markers
# live directives rather than RUF100-flagged dead ones: it polices catch
# BREADTH at the construct level, while `check-no-except-outside-io` polices
# catch POSITION. With BLE unselected the split has only one half.
select = [
    # ----- v011 baseline (11 categories) -----
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C90",   # mccabe complexity
    "N",     # pep8-naming
    "RUF",   # ruff-specific
    "PL",    # pylint
    "PTH",   # flake8-use-pathlib
    # ----- v012 additions (16 categories) -----
    "TRY",   # tryceratops — pairs with K10 domain-vs-bugs split
    "FBT",   # flake8-boolean-trap — reinforces K4 keyword-only discipline
    "PIE",   # flake8-pie — miscellaneous anti-patterns
    "SLF",   # flake8-self — bans cross-class _-prefixed access
    "LOG",   # flake8-logging — logging discipline
    "G",     # flake8-logging-format — kwargs-only in log calls
    "TID",   # flake8-tidy-imports — no relative imports + banned-imports
    "ERA",   # eradicate — bans commented-out code (LLM artifact)
    "ARG",   # flake8-unused-arguments
    "RSE",   # flake8-raise — `raise X` over `raise X()`; raise...from discipline
    "PT",    # flake8-pytest-style
    "FURB",  # refurb — modern-Python refactor hints
    "SLOT",  # flake8-slots
    "ISC",   # flake8-implicit-str-concat — complements pyright
    "T20",   # flake8-print — bans print/pprint
    "S",     # flake8-bandit — security anti-patterns
    # ----- catch-breadth (1 category) -----
    "BLE",   # flake8-blind-except — construct-level ban on broad catches
]
ignore = [
    "ISC001",  # implicit-str-concat on one line; conflicts with the formatter
]

[tool.ruff.lint.pylint]
max-args = 6
max-positional-args = 6
max-branches = 10
max-statements = 30

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"abc.ABC" = { msg = "use typing.Protocol" }
"abc.ABCMeta" = { msg = "use typing.Protocol" }
"abc.abstractmethod" = { msg = "use typing.Protocol" }
"pickle" = { msg = "arbitrary-code-execution surface on load(); use JSON / JSONC" }
"marshal" = { msg = "arbitrary-code-execution surface on load(); use JSON / JSONC" }
"shelve" = { msg = "arbitrary-code-execution surface on load(); use JSON / JSONC" }

[tool.ruff.lint.per-file-ignores]
# The PreToolUse guard hook was previously excluded from Ruff WHOLESALE via
# `extend-exclude`. That exclusion took the `BLE001` backstop down with it, and
# `check-no-except-outside-io` treats an inspected-but-ruff-excluded file as an
# error precisely because the position rule alone is half the pair. It is
# replaced by this NARROW ignore, so BLE001 stays live over the hook and its
# sole fail-open boundary catch is a real marked directive rather than a dead
# one. `PLR0911` alone is waived: `_check_segment` returns early once per
# footgun pattern, and collapsing those branches would reshape
# behavior-critical guard logic that has no test coverage. Same disposition,
# and same reasoning, as livespec-driver-claude's `C901` waiver on
# `no_shadow_ledger.py`.
".claude/hooks/livespec_footgun_guard.py" = ["PLR0911"]
# pytest conventions: bare assert, magic literals in assertions,
# subprocess.run with fixed argv lists, composite assertions,
# /tmp paths, token-suffixed variable names, long descriptive
# docstrings, many-arg pytest fixtures. Mirrors livespec-core's
# tests/ per-file-ignore set.
"tests/**.py" = [
    "S101", "PLR2004", "S603", "S607", "PT018", "S108", "S105", "TRY003", "E501", "PLR0913",
]
# Once G.4 migrates the enforcement-suite scripts, each check module
# will shell out to git, ruff, python via subprocess.run with fixed
# argv lists per the canonical-target invocation contract.
# S603/S607/S404 are over-strict for this documented pattern;
# S105 covers TRAILER-token constants.
"livespec_dev_tooling/checks/*.py" = ["S603", "S607", "S404", "S105"]
# Revise-workflow checks (per SPECIFICATION/contracts.md §"Shared check
# inventory" → "Revise-workflow checks") shell out to git via
# subprocess.run with fixed argv lists, exactly like the per-commit
# checks above; S603/S607/S404 are over-strict for that documented
# pattern, S105 covers any trailer/token-shaped constants.
"livespec_dev_tooling/workflow_checks/*.py" = ["S603", "S607", "S404", "S105"]
# The maintainer-only `vendor-update` tool shells out to `git clone`
# via subprocess.run with a fixed argv list (the same documented
# pattern as the check modules above); S603/S607/S404 are over-strict
# for that vendoring path. Relocated from livespec-core's
# dev-tooling/vendor_update.py (work-item livespec-9ixg) so the
# release→bump-pin automation can re-vendor in every consumer repo.
"livespec_dev_tooling/vendor_update.py" = ["S603", "S607", "S404"]
# The fleet-membership surface shells out to `gh`/`git` via
# subprocess.run with fixed argv lists (the same documented pattern as
# the check modules above); S105 covers the required-secret NAME
# constants (APP_ID / APP_PRIVATE_KEY — names only, never values).
"livespec_dev_tooling/fleet/*.py" = ["S603", "S607", "S404", "S105"]
# Agent-runtime hook scripts (per work-item livespec-dev-tooling-7us.2)
# shell out to `git`/`gh` via subprocess.run with fixed argv lists,
# exactly like the check modules above; S603/S607/S404 are over-strict
# for that documented pattern.
"livespec_dev_tooling/agent_hooks/*.py" = ["S603", "S607", "S404"]
# The CLI e2e harness's RealCliRunner shells out to the `claude` binary via
# subprocess.run with a fixed argv list (binary name + literal flags + the
# caller-supplied prompt as a single argv element, no shell). S603/S607/S404
# are over-strict for this documented user-surface-driver pattern, exactly as
# for the check modules above. The RealCliRunner (and its subprocess call) now
# lives in the extracted `_cli_e2e_driver` module.
"livespec_dev_tooling/testing/_cli_e2e_driver.py" = ["S603", "S607", "S404"]

# ---------------------------------------------------------------------------
# Pyright — strict + seven strict-plus diagnostics. Per
# livespec/SPECIFICATION/non-functional-requirements.md §"Typechecker rule set".
# ---------------------------------------------------------------------------

[tool.pyright]
include = ["livespec_dev_tooling"]
exclude = ["**/_vendor/**", "**/__pycache__/**"]
# The product modules `import structlog` (and `structlog.stdlib`) at
# top level after a runtime `sys.path.insert(0, _vendor)` shim that
# pyright does not execute. extraPaths makes pyright resolve those
# top-level vendor imports against `livespec_dev_tooling/_vendor`
# (the vendored structlog ships `py.typed`), exactly as livespec
# resolves its `_vendor` via the same mechanism. Without this, the
# unresolved `structlog`/`structlog.stdlib` imports cascade into
# hundreds of `reportUnknownMemberType` / `reportUnknownVariableType`
# errors on every `log: structlog.stdlib.BoundLogger` annotation
# (epic li-pyright-gate).
#
# The two `checks/` directory entries resolve the bare sibling-helper
# imports (`from _red_green_replay_modes import ...`) that the
# red-green-replay supervisor and its canonical-hook copy each perform
# after a runtime `sys.path.insert(.../<that dir>)` shim. The shim is
# invisible to static analysis; the extraPaths entries make the
# sibling `_red_green_replay_modes` module resolvable WITHOUT a new
# reportMissingTypeStubs (it is first-party, no stubs needed). This
# clears the `reportMissingImports` on the import plus the cascading
# `reportUnknownVariableType` on each imported name and the
# `reportUnusedFunction` on the sibling helpers (which only appeared
# unused because their sole importer was unresolved). Resolving the
# import the way livespec resolves its own sibling/vendor imports.
extraPaths = [
    "livespec_dev_tooling/_vendor",
    "livespec_dev_tooling/checks",
    "livespec_dev_tooling/checks/canonical_hook",
]
pythonVersion = "3.10"
typeCheckingMode = "strict"

reportUnusedCallResult = "error"
reportImplicitOverride = "error"
reportUninitializedInstanceVariable = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnnecessaryCast = "error"
reportUnnecessaryIsInstance = "error"
# Relaxed from "error" to "warning", mirroring livespec's documented
# [tool.pyright] precedent (li-xxjopf Step 3a): the in-tree implicit
# string concats are readable multi-line f-string / message assembly
# where the formatter-driven wrapping is intentional. The genuine
# typo-risk subset (single-line implicit concat) is already covered by
# ruff's ISC category — ISC001 is off only due to the formatter
# conflict; ISC002/ISC003 remain active.
reportImplicitStringConcatenation = "warning"
# Disabled, mirroring livespec's documented [tool.pyright] precedent
# (li-xxjopf Step 3b): the project's privacy model is PACKAGE-private,
# not module-private. Underscore-prefixed sibling helpers (e.g.
# `_red_green_replay_modes`, `_aggregate_modes`) exist precisely to be
# imported by their top-level check modules in the same directory —
# pyright's strict default treats `_x` as module-private and produces
# exclusively false positives on that intentional same-package access.
# Cross-class private access is independently enforced by ruff's SLF.
reportPrivateUsage = "none"

# ---------------------------------------------------------------------------
# Pytest — pytest-cov + pytest-icdiff wiring.
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--strict-config",
    # `--import-mode=importlib` lets paired tests share a basename
    # across mirror trees without pytest's legacy `prepend` mode
    # triggering same-basename module collisions.
    "--import-mode=importlib",
]
# `--strict-markers` requires every marker be registered. The `consumer`
# marker tags the consumer-tier check-runner suite under `tests/consumer/`
# (node-id prefix `tests.consumer`, also declared in
# `[tool.livespec_dev_tooling].scenario_tiers`) — the integration-tier
# coverage for `SPECIFICATION/scenarios.md` acceptance scenarios.
markers = [
    "consumer: consumer-tier check-runner test exercising a shipped check against a fixture project (scenarios.md coverage)",
]

# ---------------------------------------------------------------------------
# Coverage — 100% line + branch (per livespec/SPECIFICATION/
# non-functional-requirements.md §"Code coverage thresholds").
# ---------------------------------------------------------------------------

[tool.coverage.run]
branch = true
# Coverage uses an `omit`-only blocklist (no `source` allowlist).
# The tests/livespec_dev_tooling/checks/ suite invokes check
# scripts via `subprocess.run` with `cwd=tmp_path`; pytest-cov's
# pth-installed startup hook instruments those children, but a
# relative `source` list (e.g., `livespec_dev_tooling`) resolves
# against the subprocess's cwd (the tmp_path), which doesn't
# contain `livespec_dev_tooling/`, so the actual
# `<repo>/livespec_dev_tooling/checks/<name>.py` would be
# silently dropped from the report. Removing `source` entirely
# lets every imported module be measured, then the `omit` patterns
# below filter out everything that isn't first-party
# livespec-dev-tooling code. Same approach as livespec-core's
# pyproject.toml.
omit = [
    "*/_vendor/*",
    "*/.venv/*",
    "*/site-packages/*",
    "*/__pycache__/*",
    "/tmp/*",
    "/private/var/folders/*",
    "mutants/*",
]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "raise ImportError",
    "@overload",
    # Main guard — never executed via pytest; covered by the meta-
    # test pattern where applicable.
    "if __name__ == .__main__.:",
    # Vendored-path guard — `if str(X) not in sys.path: sys.path.insert(...)`.
    # Already in sys.path when tests run via pyproject.toml `pythonpath`
    # config; the sys.path.insert branch is structurally dead in tests.
    # Matches the livespec-core exclusion pattern.
    "sys.path.insert",
    # `case _:` arms are structurally unreachable by spec mandate:
    # every `match` statement terminates with `case _: assert_never(...)`.
    # The arm is therefore unreachable when the subject's declared
    # type is exhaustively handled by the prior arms.
    "case _:",
]
