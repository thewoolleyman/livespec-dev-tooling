# pyproject.toml — livespec-dev-tooling.
#
# Authority for every rule expressed here is the live specification at
# livespec/SPECIFICATION/ (notably non-functional-requirements.md
# §"Toolchain pins", §"Shared content provenance", §"Linter rule set",
# §"Typechecker rule set", §"Code coverage thresholds") plus this
# library's own SPECIFICATION/ tree once seeded at Phase G.3 of epic
# li-fgqgnk.
#
# This file is HAND-AUTHORED (not generated from copier). The epic
# YAGNI'd templates/library/ until a second library variant appears;
# when it does, a future propose-change cycle MAY extract this file's
# common shape into a templates/library/pyproject.toml.jinja.
#
# Has a [build-system] section: livespec-dev-tooling IS installable
# (consumed by every livespec-governed repo via uv git source per
# livespec/SPECIFICATION/contracts.md §"Shared code sync —
# livespec-dev-tooling").

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "livespec-dev-tooling"
version = "1.19.1"
description = "Shared enforcement-suite library for livespec-governed projects: ruff/pyright/coverage gates, AST checks, CI-alignment checks, red-green-replay discipline. Python package plus composite Actions and reusable workflows."
requires-python = ">=3.10.16"
authors = [
    { name = "Chad Woolley", email = "thewoolleyman@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"

# NO [project.dependencies]: livespec-dev-tooling's checks shell out
# to project-local tools (ruff, pyright, pytest) via subprocess; they
# do not import third-party packages. The library is intentionally
# dependency-free at runtime so consumers pay zero transitive-pin
# cost when adding it to their [dependency-groups].dev table.

[tool.hatch.build.targets.wheel]
packages = ["livespec_dev_tooling"]

[dependency-groups]
# Every Python dev tool is uv-managed via this table (resolved into
# uv.lock; installed into a project-local .venv via
# `uv sync --all-groups`). Mise pins only the non-Python binaries
# in .mise.toml. Versions mirror livespec-core's pins exactly per
# livespec/SPECIFICATION/non-functional-requirements.md
# §"Shared content provenance".
dev = [
    "ruff==0.8.6",
    "pyright==1.1.391",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
    "pytest-icdiff==0.9",
    "pytest-xdist==3.8.0",
    "hypothesis==6.122.3",
    "hypothesis-jsonschema==0.23.1",
    "mutmut==3.2.3",
    "import-linter==2.1",
]

# ---------------------------------------------------------------------------
# livespec-dev-tooling self-application layout (li-asybpo).
#
# Per SPECIFICATION/constraints.md §"Self-application" + contracts.md
# §"Consumer configuration schema", `just check` runs every shared check
# against this library's OWN source tree. This block declares the flat
# package layout and the role keys this library needs.
#
# The fleet-check-coverage git-derived-universe change made the file-role
# checks walk this repo's first-party Python universe
# (`livespec_dev_tooling/**`) instead of no-opping: no_except_outside_io,
# no_raise_outside_io, public_api_result_typed, no_write_direct,
# no_lloc_soft_warnings, and newtype_domain_primitives now cover
# `livespec_dev_tooling/**` at Phase-0 WARN (they hard-fail once this repo
# is flipped to the hard gate in Phase 2), per contracts.md §"Role keys".
#
# `supervisor_entry_files` below declares this repo's CLI/supervisor entry
# files. Adding a path here grants it FOUR separate exemptions, so weigh
# all four before adding one:
#   - `no_write_direct` exempts the WHOLE FILE from the direct-write ban
#     (its `main()` / `_write` helpers own legitimate stdout/stderr
#     contracts: JSON payloads, CLI reports, streamed subprocess output).
#     Note this is a whole-file exemption, not a `main()`-scoped one: a
#     `print()` added anywhere in a listed file goes unflagged, which
#     matters most for a guard hook, where stdout is a live hook-protocol
#     channel rather than a report surface.
#   - `supervisor_discipline` exempts it from the `sys.exit` /
#     `raise SystemExit` confinement rule.
#   - `no_except_outside_io` treats a `main()` direct-child `try` in it as
#     the sole supervisor boundary where a MARKED broad catch is permitted.
#   - `public_api_result_typed` treats a supervisor entry point in it as
#     exempt from the Result-return rule — ratified member 4 of the
#     EXHAUSTIVE four-member exemption set in livespec v177
#     (`non-functional-requirements.md` §"ROP composition"). Bounded: it
#     exempts supervisor ENTRY POINTS, never every function in the file.
# `partition_completeness` also reads this key, but it is NOT in the list
# above and does NOT belong there: it is a STRUCTURAL meta-check recording
# which role claims each file, so it grants no exemption. Per contracts.md
# §"Role keys", the per-key consumer enumerations name behavioral consumers
# and exclude it and `source_trees_scoped_to_consumer` by rule.
# The remaining role keys split into two groups, and the split is load-bearing
# (livespec-dev-tooling-8o8e.1).
#
# `io_trees`, `commands_trees` and `covered_trees` stay a bare `[]`. They are
# EXEMPTION / SEVERITY PREDICATES: their consuming checks derive the file
# universe from `resolve_check_universe()` and read the key only to decide what
# is exempt, so an empty value makes those checks STRICTER, never blinder. With
# `io_trees` empty nothing is wholesale exempt from the catch-position and
# domain-raise checks — they inspect the whole `source_trees` universe.
#
# `pure_trees`, `dataclasses_tree` and `neutral_hook_body_path` are NO LONGER
# empty, and an empty value for them is no longer sanctioned. Their `[]` / `""`
# spelling carried two incompatible meanings — "does not apply here" versus
# "applies and is switched off" — so each now declares one of the four blessed
# variants (`not_applicable`, `superseded_by`, `unarmed_until`,
# `convention_not_adopted`), carrying its reason in the PARSED VALUE rather than
# in a comment no checker can read. A bare `[]` / `""` now parses to
# `LegacyAmbiguousEmpty` and WARNs; it becomes a hard `ConfigParseError` once
# every repo has migrated. See each declaration below.
# ---------------------------------------------------------------------------

[tool.livespec_dev_tooling]
source_trees = ["livespec_dev_tooling"]
target_dirs = ["livespec_dev_tooling"]
source_tree_prefixes = ["livespec_dev_tooling/"]
# Flat-layout library has no wholesale IO exemption tree.
io_trees = []
# Flat-layout library has no command-surface subtree.
commands_trees = []
# NOT APPLICABLE, not deferred: a flat-layout library has no pure-module subtree at all,
# so the mutation / PBT / public-api-result gates that read this role have nothing to scan
# here. Distinct from `livespec` and `livespec-overseer`, which have the same EMPTY value
# for the opposite reason (`unarmed_until = "livespec-mutreal.1"`) — telling those two
# states apart is the whole point of the union (livespec-dev-tooling-8o8e.1).
pure_trees = { not_applicable = "flat-layout library has no pure-module subtree" }
# Coverage/size checks derive this repo's first-party universe from git.
covered_trees = []
# NOT APPLICABLE: a flat-layout library has no dataclasses/schema tree for
# `check-newtype-domain-primitives` to police.
dataclasses_tree = { not_applicable = "flat-layout library has no dataclasses schema tree" }
# NOT APPLICABLE: this repo PRODUCES the canonical no-shadow-ledger body (it ships
# `CANONICAL_NO_SHADOW_LEDGER_BODY` and the installer) but INSTALLS no neutral hook body of
# its own — only the two Drivers do. There is no local file for
# `check-no-shadow-ledger-body-identical` to byte-compare.
neutral_hook_body_path = { not_applicable = "produces the canonical body but installs no neutral hook body" }
# Phase-2 flip (fleet-check-coverage epic livespec-i5ebqd): arm the file_lloc
# hard gate over this repo's whole git-derived first-party universe. Every
# first-party .py is <=250 LLOC after the decomposition, so >250 now hard-fails
# (severity increase only — no escape hatch).
file_lloc_hard_gate = true
plan_lifecycle_anchor = true
mirror_pairings = [
    { source_tree = "livespec_dev_tooling", test_tree = "tests/livespec_dev_tooling" },
]
# The surface OTHER governed repos consume, per SPECIFICATION v036
# §"Role keys". Read by `public_api_result_typed`, which cannot see a
# sibling's import from inside this checkout. TIGHTENING-ONLY: every entry
# ADDS a name to the Result-return rule's scope, and an omission removes
# nothing the repo-local oracle already sees. Measured against all eight
# siblings' masters rather than inherited; the CONSTANTS and CLASSES they
# import (`CANONICAL_NO_SHADOW_LEDGER_BODY`, `CliResult`, `HarnessConfig`,
# `FixturedSkill`, `CoverageGateError`) are deliberately absent — the rule
# reaches top-level FUNCTIONS.
#
# THREE MEASURED CROSS-REPO CONSUMPTIONS ARE DELIBERATELY NOT LISTED, and
# each omission is a FINDING rather than an oversight. All three are real —
# a sibling genuinely imports the name — but declaring them would assert a
# scope this check does not actually apply, which is the manufactured
# confidence the whole epic exists to remove:
#
#   - `fleet/_context.py`'s `resolve_owner`, imported by
#     `livespec-orchestrator-beads-fabro`'s `codex_yolo_gate.py` hook, and
#   - `testing/_cli_e2e_discovery.py`'s `discover_fixtures`, reached by four
#     siblings as `cli_e2e.discover_fixtures` through a re-export.
#     Both are PUBLIC names inside package-PRIVATE modules. This check skips
#     `_`-prefixed FILES wholesale, while v178 clause 0 disqualifies only a
#     `_`-prefixed NAME — so the file-level skip is wider than the ratified
#     rule, and a cross-repo consumer is reaching through it.
#   - `config.py`'s `iter_first_party_py_files`, imported by
#     `livespec-orchestrator-git-jsonl`'s test tree. config.py is not in the
#     check universe AT ALL: `is_generated` matches its own `# ... @generated`
#     prose, so it excludes itself. Filed as `livespec-dev-tooling-995m`.
#
# THE NINE `checks/<slug>.py::main` ENTRIES BELOW WERE FOUND BY THE CENTRAL
# VANTAGE, NOT BY THIS CHECKOUT, and that is the whole argument for the row
# that found them. `_rows_public_api_conformance` read all nine members'
# master tarballs (0 skipped, 0 unparsed) and measured 12 consumption sites
# this repo's own oracle structurally cannot see. Filed as
# `livespec-dev-tooling-wdn7`; the record with every site is
# `plan/rop-railway-enforcement/5cai-fleet-measurement.md`.
#
# THEY ARE v178 CLAUSE-2 SYMBOL IMPORTS, NOT CLAUSE-3 PROCESS ENTRY POINTS,
# established by READING both consumers rather than inferring from the name
# `main`. Both do `from livespec_dev_tooling.checks import (all_declared, ...)`
# and then `assert all_declared.main() == 0` — they hold `main` as a callable
# and act on its return value IN-PROCESS. beads-fabro's file also carries
# `assert "python -m ...wrapper_shape" in justfile`, which is a STRING
# assertion ABOUT the justfile rather than an invocation. So this is NOT the
# known `main() -> int` exemption-scoped-to-a-LOCATION spec defect and must
# not be filed as it.
cross_repo_public_api = [
    { file = "livespec_dev_tooling/canonical_checks.py", function = "canonical_check_slugs", reason = "product import: livespec's canonical_slugs_projection.py, copier_template_smoke_canonical.py and doctor/static/wiring_completeness_cross_repo.py" },
    { file = "livespec_dev_tooling/fleet/contract.py", function = "parse_manifest", reason = "product import: livespec-orchestrator-beads-fabro's .claude-plugin/hooks/codex_yolo_gate.py — the dx8l consumer" },
    { file = "livespec_dev_tooling/testing/cli_e2e.py", function = "test_workflow_full_round_trip", reason = "cross-repo test import: the e2e round-trip suites of both Drivers and both orchestrators" },
    { file = "livespec_dev_tooling/testing/cli_e2e.py", function = "assert_coverage", reason = "cross-repo test import: livespec-driver-codex's tests/e2e-cli/test_cli_e2e.py" },
    { file = "livespec_dev_tooling/checks/all_declared.py", function = "main", reason = "cross-repo test import: livespec-orchestrator-beads-fabro's tests/test_phase1_mechanical_coverage.py and livespec-runtime's tests/livespec_runtime/test_phase1_mechanical_checks.py both import the submodule and assert `main() == 0` in-process" },
    { file = "livespec_dev_tooling/checks/assert_never_exhaustiveness.py", function = "main", reason = "cross-repo test import: livespec-runtime's tests/livespec_runtime/test_phase1_mechanical_checks.py asserts `main() == 0` in-process" },
    { file = "livespec_dev_tooling/checks/keyword_only_args.py", function = "main", reason = "cross-repo test import: livespec-orchestrator-beads-fabro's tests/test_phase1_mechanical_coverage.py and livespec-runtime's tests/livespec_runtime/test_phase1_mechanical_checks.py both assert `main() == 0` in-process" },
    { file = "livespec_dev_tooling/checks/main_guard.py", function = "main", reason = "cross-repo test import: livespec-orchestrator-beads-fabro's tests/test_phase1_mechanical_coverage.py asserts `main() == 0` in-process" },
    { file = "livespec_dev_tooling/checks/no_inheritance.py", function = "main", reason = "cross-repo test import: livespec-orchestrator-beads-fabro's tests/test_phase1_mechanical_coverage.py and livespec-runtime's tests/livespec_runtime/test_phase1_mechanical_checks.py both assert `main() == 0` in-process" },
    { file = "livespec_dev_tooling/checks/no_lloc_soft_warnings.py", function = "main", reason = "cross-repo test import: livespec-orchestrator-beads-fabro's tests/test_phase1_mechanical_coverage.py asserts `main() == 0` in-process" },
    { file = "livespec_dev_tooling/checks/no_write_direct.py", function = "main", reason = "cross-repo test import: livespec-orchestrator-beads-fabro's tests/test_phase1_mechanical_coverage.py asserts `main() == 0` in-process" },
    { file = "livespec_dev_tooling/checks/private_calls.py", function = "main", reason = "cross-repo test import: livespec-orchestrator-beads-fabro's tests/test_phase1_mechanical_coverage.py asserts `main() == 0` in-process" },
    # Arrived with the SHELL-QUALITY ROLLOUT, not with this repo: livespec-driver-codex
    # commit 7382f1f7 landed the consumer 2026-08-04T07:55:04Z, 24 minutes after this
    # repo's last green fleet-conformance run, so the gap opened in the fleet rather
    # than in any one PR. GUARD READ BEFORE DECLARING, which is what the oracle's hint
    # actually asks for: the consumer binds `rc = shell_quality.main()` and asserts on
    # the INT exit code. There is NO `if x is None` guard, so the hint's standing hazard
    # — a None-check silently becoming permanently False against a Result — does not
    # apply at this site. A future reader must not have to re-derive that.
    { file = "livespec_dev_tooling/checks/shell_quality.py", function = "main", reason = "cross-repo test import: livespec-driver-codex's tests/test_shell_quality_gate.py binds `rc = shell_quality.main()` in-process and asserts on the int exit code; no `is None` guard at the consumption site" },
    { file = "livespec_dev_tooling/checks/wrapper_shape.py", function = "main", reason = "cross-repo test import: livespec-orchestrator-beads-fabro's tests/test_phase1_mechanical_coverage.py imports the submodule and asserts `main() == 0` in-process; the `python -m` string assertion in the same file is ABOUT the justfile, not an invocation" },
]
# livespec v179 member 2 / SPECIFICATION v037: public `X | None` returns whose
# `None` models a legitimate ABSENCE rather than a failure. RELAXING-ONLY, so
# an EMPTY list is the STRICT end of this key — the opposite polarity from the
# five union role keys, where empty was the blinding value. Every entry needs a
# reason naming why the `None` is an absence, and both the structural `X | None`
# gate (bound 1) and the staleness detector (bound 3) HARD-FAIL in
# `public_api_result_typed`.
#
# ⛔ THE MECHANISM CANNOT CHECK THE JUDGEMENT, AND A CLEAN RUN IS NOT VALIDATION.
# `_declared_absence_returns._split` produces exactly two rejections: UNRESOLVED
# (the name is not a top-level function there) and NOT_ABSENCE_SHAPED (the
# annotation is not `X | None`). NEITHER ASKS WHETHER THE `None` IS REALLY AN
# ABSENCE. The reason is parsed for PRESENCE, never for truth. So "0 rejected"
# proves the annotation and the function exist and nothing more — `m50u`'s
# "a blessed payload nobody checks is a comment with better syntax
# highlighting", arriving in the declarations rather than the code.
#
# THE ONLY CHECK ACTUALLY AVAILABLE IS THE CALLERS' READING, and it is what
# `tag_version_component` was established on: does EVERY caller treat the `None`
# as an ordinary answer it acts on, rather than as a failure it reports or
# propagates? Each reason below carries that reading. Two further candidates
# were read and REJECTED for this key — see `_connection.py` in
# `plan/rop-railway-enforcement/qndn-75-triage.md`.
#
# THE RULE HAS TWO HALVES AND COUNTING ALONE IS NOT SUFFICIENT. An earlier
# revision of this comment stated only the first half; a sweep of every
# `X | None` in the triage then found TWO functions that satisfy it and are
# still conversions, so a future author applying the counting rule literally
# could declare one of them. Both halves, in order:
#
#  1. COUNT DISTINCT MEANINGS — not syntactic `return None` sites, and FOLLOW
#     any callee that itself collapses. `fleet/_context.py::resolve_owner` has
#     ONE return expression and THREE meanings (no origin remote, `git remote
#     get-url` failing, a non-github remote), because `_origin_remote_match`
#     merges them one level down. MORE THAN ONE -> CONVERT: no caller can tell
#     them apart, and at least one is normally a failure.
#
#  2. IF EXACTLY ONE, ASK WHOSE FAILURE THE CALLERS REPORT. A caller saying
#     "I cannot verify this" is reporting the FUNCTION's failure -> CONVERT.
#     `checks/_ci_matrix_parse.py::extract_check_recipe_body` collapses exactly
#     ONE condition (the justfile has no `check:` recipe) and is a CONVERSION,
#     because every caller emits `check_recipe_not_found` and says it cannot
#     verify. So does `fleet/_rows_pin_currency.py::open_bump_prs_for`, whose
#     single condition IS a read failure. A caller instead saying "the thing I
#     INSPECTED is non-conformant", or using the `None` as pure control flow,
#     is a caller acting on an answer -> DECLARE.
#
# PART 2 DECIDES EVERY ONE-CONDITION CASE, which is the only population this
# key can ever admit. `tag_version_component` passes both: one condition (the
# tag has no version component), and no caller reports anything on it.
total_absence_returns = [
    { file = "livespec_dev_tooling/cross_repo/fabro_image_pin_rewrite.py", function = "tag_version_component", reason = "absence, not failure: a docker tag legitimately HAS no version component, so `None` is an ordinary answer every caller acts on. Converting it would force each caller to unwrap a Failure for a non-failure. Established four separate times across the rop-railway-enforcement thread: it sat in that triage's STRONGEST convert class (a hand-rolled `X | None` failure track) and was still not a conversion, which is what produced the standing rule to read every function a classification convicted." },
    { file = "livespec_dev_tooling/checks/_role_key_gate.py", function = "role_absence_exit_code", reason = "absence of a GATE DECISION, not a failure. CALLERS READ (all five: check_mutation, newtype_domain_primitives, no_shadow_ledger_body_identical, pbt_coverage_pure_modules, public_api_result_typed) — every one is `gate_exit = role_absence_exit_code(...)` then `if gate_exit is not None: return gate_exit`, so `None` is pure control flow meaning 'no gate fired, carry on'. ONE condition collapses onto it: `role_absence(role=role)` is None, i.e. the role is not declared-absent. The failure and violation channels are the INT, not the None — an undeclared key returns 1 and a declared-absent role returns 0, both loud. A Result here would put 'carry on' on the failure track, which is the common path." },
    { file = "livespec_dev_tooling/fleet/_bump_pr_list.py", function = "persisting_bump_pr_number", reason = "absence of a QUALIFYING OPEN BUMP PR, not a failure to look for one. PART 1 — ONE meaning, and the callee chain was followed: the single condition is `no PR in open_prs matches (source_repo, latest)`. `open_prs` is a plain `list`, never `None`, because `open_bump_prs_for`'s read failure was lifted onto its own `IOResult` track by the pin-walker conversion; before that lift this `None` DID carry an inherited second meaning, which is exactly why the count is stated here rather than assumed. The only callee, `denotes_same_release`, returns `bool` and its `False` is likewise an answer (its docstring rules that a pin with no version anchor reads STALE, fail-toward-visible), so nothing collapses one level down. PART 2 — BOTH callers act on the answer and neither reports this function's failure. `_rows_pin_currency._staleness_class_outcome` and `_rows_files._pin_outcome` each use `None` as pure control flow to emit the ORDINARY stale-pin finding (a verdict about the INSPECTED member), and each has a SEPARATE `I cannot verify` channel one level up — the `IOFailure` arm rendering `bump_pr_class_undecidable_clause`. That separation is the whole test: the cannot-verify report already exists and is not this `None`. It is also the MAJORITY answer (most stale pins have no open bump PR at all), so a `Result` here would put the common path on the failure track — the `sanctioned_marker_flavor` argument, reached independently." },
    { file = "livespec_dev_tooling/checks/_no_except_outside_io_markers.py", function = "sanctioned_marker_flavor", reason = "absence of a MARKER, not a failure to look for one. ONE condition collapses onto it: the clause-line span holds no sanctioned marker comment. There is no error path — `_clause_colon_line` floors to the node's own line via `min(..., default=...)` rather than failing, so a malformed parse still yields an answer. CALLERS READ (no_except_outside_io.py:222 and :251): `None` makes the caller append an offense — but that offense is a finding ABOUT THE SCANNED SOURCE (this broad handler carries no marker), which is the check's own verdict, NOT a report that this function could not do its job. ⛔ THE DISTINCTION IS LOAD-BEARING and a literal reading of 'any caller reports a violation on the None' would get it backwards: contrast `extract_check_recipe_body`, whose callers emit `check_recipe_not_found` and say they CANNOT VERIFY — that is a caller reporting its own inability, and it earned CONVERT. Converting this one would put the MAJORITY answer (most handlers are unmarked) on the failure track." },
]
# livespec v183 condition 3 — the one thing each variant of a SANCTIONED
# rendering-boundary union means. ONE ENTRY PER VARIANT, because condition 3 is
# a claim about EVERY variant and a single reason attached to the union would be
# a claim whose subject is narrower than the property it asserts.
#
# ⛔ WHAT THIS KEY IS NOT. It is not an exemption. Conditions 1 and 2 stay
# COMPUTED and are re-derived from source on every run by
# `checks/_declarable_unions`; nothing about declarability is stored here. This
# key carries ONLY the semantic claim no AST can decide, and the enumeration of
# variants below is the claim's SCOPE — diffed against `_context.py` every run,
# so ADDING a variant BREAKS this declaration rather than inheriting it.
#
# ⛔ AND IT DOES NOT REACH CONDITION 1. Two rows returning `RowOutcome`
# (`reconcile_beads_dir_perms`, `reconcile_beads_metadata_present`) call a
# filesystem primitive DIRECTLY and stay convicted despite this declaration —
# measured, not assumed. A declaration that could only relieve would be
# indistinguishable from a blind one.
#
# ▶️ MAINTAINER: READ `RowPass`'s MEANING BELOW BEFORE TRUSTING THIS ENTRY. Bound
# 2 exists to surface a variant carrying two meanings, and running the exercise
# surfaced a real question about that variant. It is written out rather than
# smoothed over, and withdrawing these three lines re-convicts all 19 relieved
# functions at the next run.
single_meaning_variants = [
    { file = "livespec_dev_tooling/fleet/_context.py", union = "RowOutcome", variant = "RowPass", meaning = "this member does not VIOLATE this obligation row. ⚠️ THE ONE PLACE THIS DECLARATION IS ARGUABLE, STATED RATHER THAN HIDDEN: RowPass carries a sub-case — the row does not APPLY to this member — and the two are told apart by a DISTINCT VALUE, a note carrying `EXCLUDED_NOTE_PREFIX`, constructed only via `row_excluded()`. v183 condition 3 sanctions distinct VALUES in terms ('MUST be distinct variants or distinct values'), and what it forbids is a variant 'disambiguated by which lane is reading it'. That is NOT the case here and the codebase says why at the constant's definition: it lives beside the union rather than privately in `_lanes.py` precisely so BOTH engines render the same value the same way, and both readers (`_lanes.py`, `local_reconcile.py`) derive 'inapplicable' from the same shared constant. Inapplicability and UNEVALUABILITY are separately distinct — the latter is `RowSkip`, and `row_excluded`'s docstring refuses to spell inapplicability as a skip for a stated reason. The residual a reviewer should weigh: `RowPass`'s own docstring says 'satisfies', `row_excluded`'s says 'does not APPLY', and `wire_fleet_member.py` / `_adopter_lane.py` read the variant without consulting the prefix at all." },
    { file = "livespec_dev_tooling/fleet/_context.py", union = "RowOutcome", variant = "RowFinding", meaning = "this member DEFINITIVELY violates this obligation row. One meaning across every consumer. The `severity` field is a distinct VALUE governing ESCALATION (whether the finding gates a run) and never the verdict: a `severity=\"warning\"` finding is still a violation, which is exactly the gap the pin-currency rows demonstrated when correct findings fired on every stale member and gated nothing." },
    { file = "livespec_dev_tooling/fleet/_context.py", union = "RowOutcome", variant = "RowSkip", meaning = "this row could not be definitively EVALUATED for this member — can't-read is not absent. One meaning across every consumer, and it is deliberately NOT the carrier for inapplicability: `row_excluded()` returns a RowPass instead, because the central lane feeds every skip into `blind_rows`, which fails the run with no lever — so spelling inapplicability as a skip would red master fleet-wide for a condition that is not a failure at all." },
]
# CLI/supervisor entry files whose `main()` / `_write` helpers own
