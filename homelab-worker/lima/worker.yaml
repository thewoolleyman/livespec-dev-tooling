# Lima VM template for a homelab worker node (one VM per host, named
# <host>-homelab-worker by start-homelab-worker-node-container.sh, which also
# supplies vmType, CPUs, memory and disk from the host's declaration).
#
# Ubuntu 24.04 arm64 (kernel 6.8): AppArmor, pod user namespaces with idmapped
# mounts (Linux >= 6.3), cgroup v2. The worker's storage stays on the VM's own
# disk, so no macOS directory is mounted into the guest.
images:
  - location: "https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
mounts: []
# The worker is a home-LAN node: Lima's bridged network (socket_vmnet, a
# documented host prerequisite) puts lima0 on the host's LAN, and the start
# task sets the host's declared static address on it (spec v143).
networks:
  - lima: bridged
containerd:
  system: false
  user: false
# The worker container runs under rootful Docker in the VM; AppArmor userspace
# loads the workload profile. The data disk (<host>-homelab-worker-data, XFS)
# is attached by the start task and mounted by Lima at /mnt/lima-<disk>.
provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      if ! command -v docker >/dev/null 2>&1; then
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y docker.io apparmor apparmor-utils xfsprogs
      fi
      systemctl enable --now docker
