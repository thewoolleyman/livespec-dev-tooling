# lefthook.yml — livespec-dev-tooling git hook configuration.
#
# Authority: livespec/SPECIFICATION/contracts.md
#   §"Pre-commit step ordering" (v219), mirrored by this repository's
#   own non-functional-requirements.md §"Hooks and CI" (v056) —
#   pre-commit runs, in order, 00-install-worktree-pack,
#   01-lint-autofix-staged, 02-commit-pairs-source-and-test,
#   03-check-pre-commit; commit-msg runs no-commit-on-master then
#   red-green-replay (v034 D3); pre-push runs 00-install-worktree-pack
#   then 01-check-pre-push (the full aggregate).
#
# Why the installer runs FIRST in both hooks: the worktree-discipline
# pack this repository ships is gitignored-and-installed, so a worktree
# created by a raw `git worktree add`, or one predating a pin bump,
# would otherwise reach the gate with the pack absent or stale and fail
# `worktree_pack_absent` after the whole aggregate ran. The installer is
# idempotent, writes only ignored files, installs from the package this
# checkout resolves, and the byte-identity verifier in the aggregate
# still asserts the result. It must run before any gate member that
# reads the pack, and the aggregate runs its members alphabetically, so
# it lives here rather than inside a member.
#
# Authority: livespec/SPECIFICATION/non-functional-requirements.md
#   §"Toolchain pins" — `run:` fields MUST delegate to `just <target>`
#   and MUST NOT shell out to underlying tools directly (the spec's
#   lefthook-must-delegate-to-just rule; once the corresponding check
#   migrates from livespec-core in Phase G.4 of epic li-fgqgnk, it
#   enforces this mechanically here too).
#
# Activation: `just bootstrap` installs the canonical git-hook-wrapper
# into .git/hooks/{pre-commit,pre-push,commit-msg}. The wrapper invokes
# `mise exec lefthook -- lefthook run <hook-name> "$@"` so the gate
# fires regardless of shell config and commit-msg argv[1] (the
# commit-message file path) reaches the red-green-replay hook.
#
# Bootstrap order: at Phase G.2 the just targets check-commit-pairs-
# source-and-test, check-red-green-replay, and lint-autofix-staged are
# stubs (no migrated checks yet); they become real once Phase G.4
# migrates the corresponding scripts from livespec-core/dev-tooling/.

pre-commit:
  commands:
    00-install-worktree-pack:
      run: just install-worktree-pack
    01-lint-autofix-staged:
      run: just lint-autofix-staged
    02-commit-pairs-source-and-test:
      run: just check-commit-pairs-source-and-test
    03-check-pre-commit:
      run: just check-pre-commit

commit-msg:
  commands:
    00-no-commit-on-master:
      run: |
        branch=$(git rev-parse --abbrev-ref HEAD)
        if [ "$branch" = "master" ]; then
          printf 'ERROR: direct commits to master are forbidden; create a feature branch first\n' >&2
          printf 'Hint: git checkout -b <branch-name>\n' >&2
          exit 1
        fi
    01-red-green-replay:
      run: just check-red-green-replay {1}

pre-push:
  commands:
    00-install-worktree-pack:
      run: just install-worktree-pack
    01-check-pre-push:
      run: just check-pre-push
