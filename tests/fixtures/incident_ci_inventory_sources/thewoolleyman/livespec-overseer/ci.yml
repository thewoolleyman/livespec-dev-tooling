# Per-target matrix CI for livespec-overseer.
#
# Authority: livespec/SPECIFICATION/non-functional-requirements.md
#   §"CI as a merge gate (branch protection)" — PR gate ≡ master gate:
#   the set of GATING checks a pull_request must pass is IDENTICAL to
#   the set that runs on a push to master. There is NO zero-.py
#   subsetting: every gating job runs its real steps unconditionally on
#   both events (a PR may run ADDITIONAL checks, never FEWER). The
#   retired `setup`/`detect-py-changes` skip — which let a doc-only PR
#   run fewer checks than master and reddened master on 2026-09-04 — is
#   gone, and check-ci-gate-parity fails CI if any gating job reintroduces
#   a `py_changed`-conditioned skip.
#
# Authority: livespec/SPECIFICATION/non-functional-requirements.md
#   §"Toolchain pins" — direct tool invocations (ruff, pyright,
#   pytest, python3) in `run:` lines are forbidden; every step
#   delegates to `just <target>`.
#
# Starter scaffold: the Python-code matrix carries only the tool-
# backed checks (lint, format, types, coverage). The metadata matrix
# is empty. As Phase G.4 of epic li-fgqgnk migrates livespec-core's
# dev-tooling/checks/ scripts into overseer/checks/,
# add the corresponding `check-<slug>` target to the appropriate
# matrix and to branch protection's required-status-checks list.
#
# The check matrices + check-doctor-static run in the SAME baked image the
# Fabro sandbox uses, so "green in CI" and "green in sandbox" are the same
# environment (livespec plan/fabro-ci-image-factoring).
#
# RUNNER ROUTING — FAILS CLOSED TO HOSTED CAPACITY.
#
# runs-on resolves from the repo variable CI_RUNNER_LABELS, defaulting to
# '["ubuntu-latest"]' when it is absent or empty. That default is the
# merge-gate safety property, not a convenience: livespec
# SPECIFICATION/non-functional-requirements.md §"Self-hosted CI runner host
# requirements" → "Availability MUST NOT become a merge dependency" requires a
# route back to hosted capacity that needs no specification revision, because a
# single all-green gate is the sole required check. ci-green needs the
# matrices, so a matrix job routed to self-hosted capacity that is not there
# does not FAIL — it sits in `queued`, ci-green never reports, and every merge
# waits on a check that will not arrive. Defaulting to the self-hosted label
# made exactly that outcome the behavior of an absent variable.
#
# To route gating jobs to a conforming self-hosted host, SET CI_RUNNER_LABELS
# to that host's label. To return them to hosted capacity, unset it or set it
# to '["ubuntu-latest"]'. Both directions are repo-variable edits; neither
# needs a specification revision.
#
# The fallback literal is repeated inline at each runs-on rather than
# single-sourced through a job output, and every copy (the runs-on values plus
# LIVESPEC_CI_LANE below) MUST stay in lockstep. The repetition is deliberate:
# the fleet's self-hosted routing guard parses runs-on values STATICALLY, so
# routing hidden behind `needs.<job>.outputs.*` would read as "this workflow
# has no self-hosted job" and silently disable the forbidden-trigger check.
#
# export-telemetry and ci-green stay ubuntu-latest — the gate must stay
# reportable host-down and the telemetry secret must never reach the runner.
#
# CI_RUNNER_LABELS was set to self-hosted (2026-08-13) as part of livespec
# plan/fleet-ci-runner-pool's fleet-wide rollout (epic livespec-s43svm.1),
# proving this repo's self-hosted routing on a real pull_request event before
# folding into the standing self-hosted rotation.

name: CI

# uv occasionally fails when the PyPI file CDN (files.pythonhosted.org)
# drops a wheel download mid-stream ("broken pipe"). UV_HTTP_RETRIES
# makes uv retry the fetch in-process instead of failing the job.
# Combined with the ~/.cache/uv actions/cache step (keyed on uv.lock)
# every uv-sync job uses below, an unchanged lock installs from cache
# and never contacts PyPI at all.
#
# mise reaches the SAME class of CDN (GitHub releases) for its tool binaries
# and can fail identically. mise's own default is `http_retries = 0`, i.e.
# one attempt and no retry, so MISE_HTTP_RETRIES applies the same lesson
# proactively here, mirroring the fix already landed in livespec and
# livespec-dev-tooling after it reddened master in both. mise paces the
# retries itself; the knob is the count.
env:
  UV_HTTP_RETRIES: "5"
  MISE_HTTP_RETRIES: "5"
  # uv's own concurrent-downloads default is 50 in-flight fetches PER uv
  # invocation (docs.astral.sh/uv/reference/settings/#concurrent-downloads).
  # The self-hosted pool runs many job slots concurrently on ONE host, so a
  # cold-cache moment (fresh slots, or a lockfile bump) can open thousands of
  # simultaneous connections to files.pythonhosted.org from a single shared
  # uplink -- the cause of the "operation timed out" PyPI fetch failures that
  # have red-flagged gating CI on the pool (livespec-s43svm.13, and the
  # recurrence livespec-s43svm.31 that brought this variable here). Capping
  # per-job concurrency on the self-hosted lane trades a little per-job fetch
  # latency for bounding the HOST-WIDE aggregate connection count; the hosted
  # lane's fully-isolated, independent-network-path runners never see this
  # contention, so it stays at uv's own default there. UV_HTTP_TIMEOUT is
  # bumped alongside it on the self-hosted lane, since a still-congested
  # transfer is more likely to need longer than the 30s default even at
  # reduced concurrency.
  #
  # The `|| '["ubuntu-latest"]'` default carries the same fail-closed property
  # as the runs-on fallbacks in this file and MUST stay in lockstep with them.
  UV_CONCURRENT_DOWNLOADS: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '50' || '4' }}
  UV_HTTP_TIMEOUT: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '30' || '60' }}
  # Test-parallelism lane signal read by the justfile's `test_nprocs`
  # (plan/fabro-ci-image-factoring cont.5). RUNNER_ENVIRONMENT does NOT
  # propagate into container jobs, so derive the lane from the routing
  # variable here: an ubuntu label → `hosted` → pytest -n auto; a
  # self-hosted label → `local` → -n 25%-of-cores (overridable per host via
  # LIVESPEC_TEST_PARALLELISM).
  #
  # The `|| '["ubuntu-latest"]'` default carries the same fail-closed property
  # as the runs-on fallbacks below and MUST stay in lockstep with them. Without
  # it an absent variable yields contains('', 'ubuntu') == false → `local`, so
  # the lane signal would claim self-hosted on jobs that are in fact routed to
  # hosted capacity.
  LIVESPEC_CI_LANE: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && 'hosted' || 'local' }}

# merge_group is deliberately ABSENT: no merge queue is configured for this
# repo (verified live — zero rulesets, required_merge_queue: null; branch
# protection requires only ci-green). Keeping the vestigial trigger would be
# exactly the routing hole the trusted-event audit forbids, since merge_group
# is not a fork-gated event and the matrices below are self-hosted. Re-add it
# WITH hosted routing only if a merge queue is adopted.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  check-python:
    name: ${{ matrix.target }}
    # Hosted by default; set the CI_RUNNER_LABELS repo variable to a conforming
    # self-hosted host's label to route here instead. The container is the SAME
    # tag the Fabro sandbox runs — that sameness collapses the green-in-CI /
    # red-in-sandbox drift this epic exists to remove, on either lane.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.205.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # Batched-CI shape (work-item livespec-dev-tooling-yilyxr.9,
          # porting dev-tooling PR #1469): tool-backed slugs must be
          # LITERAL matrix members (check-tool-backed-check-completeness)
          # and every cheap .py-scanning target moved to the single
          # check-python-batch job below. The coverage PAIR left this
          # matrix entirely (work-item livespec-dev-tooling-yilyxr.8,
          # porting dev-tooling PRs #1504 + #1511): it now runs as the
          # dedicated check-per-file-coverage producer / check-coverage
          # consumer chain below, which runs the suite ONCE, not twice.
          - check-lint
          - check-format
          - check-types
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 0: this job runs the pytest suite, and
          # tests/test_release_please_pyproject_guard.py diffs HEAD against
          # its PARENT. A depth-1 checkout leaves HEAD parentless, so git
          # renders pyproject.toml as a whole-file addition and the guard
          # reports a false clobber on every release commit (overseer-94f4).
          # Skipping the guard when shallow would instead make it unfirable,
          # because every job that runs the suite checks out shallow -- so
          # the depth is the fix, not a depth-awareness skip.
          fetch-depth: 0

      # GitHub-hosted routing keeps the baked `container:` image, so the
      # workspace is checked out as the runner uid (1001) on the host while
      # every step runs git as ROOT inside the container — git then refuses
      # with "detected dubious ownership" (exit 128). actions/checkout adds its
      # own safe.directory but scopes it to a temporary HOME it discards, and
      # resolve_repo_root() (config.py) strips all GIT_* env before shelling
      # git, so an env-var safe.directory is invisible to it. Write it to the
      # global gitconfig ($HOME/.gitconfig, HOME=/github/home) instead so EVERY
      # git call — including the env-scrubbed resolve_repo_root — reads it.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      # Tools are baked into the image; `mise install` is a near-no-op that just
      # confirms the pinned versions. A fresh container does not TRUST the repo
      # .mise.toml, so `mise trust` is required for the shims to resolve.
      # (Replaces the mise-action install + the actions/cache uv restore — the
      # local runner's persistent ~/.cache/uv is the cache now.)
      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: just ${{ matrix.target }}
        run: |
          # pyright (check-types) shells out to `npm`; under the container-hooks
          # HOME the mise npm shim busy-loops (no node registered for that HOME).
          # Put the image's real node/npm — derived from the shim's own location,
          # never a hardcoded image path — ahead of the shim on PATH. Harmless
          # for the non-npm targets.
          shims_dir="$(dirname "$(command -v npm)")"
          node_bin="$(cd "$shims_dir/../installs/node/latest/bin" 2>/dev/null && pwd || ls -d "$shims_dir/../installs/node"/*/bin 2>/dev/null | head -1)"
          [ -n "$node_bin" ] && export PATH="$node_bin:$PATH"
          just ${{ matrix.target }}

  # Coverage-pair PRODUCER (work-item livespec-dev-tooling-yilyxr.8, porting
  # dev-tooling PRs #1504 + #1511). Direction is fixed by this repo's own
  # scripts, not by convention: scripts/check-per-file-coverage.sh
  # unconditionally runs `pytest --cov` with COVERAGE_FILE unset and leaves
  # the repo-root `.coverage` behind, while scripts/check-coverage.sh branches
  # on `[[ -f .coverage ]]` and only runs the suite when the file is ABSENT.
  # So per-file is the producer and coverage is the consumer, the same way
  # `just check` already dedups them locally. Before this job existed both
  # legs ran the full suite on separate runners; now the suite runs ONCE.
  check-per-file-coverage:
    name: check-per-file-coverage
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.205.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      # No coverage-reuse token is exported here (overseer-bnutz7). Both jobs
      # resolve the provenance id themselves through
      # scripts/coverage-reuse-id.sh, which reads GITHUB_RUN_ID and
      # GITHUB_RUN_ATTEMPT — values the runner already injects into every job,
      # identical across the pair and different on a re-run. Exporting a token
      # here as well would create a second source of truth for one value.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth 0: this job runs the pytest suite, and
          # tests/test_release_please_pyproject_guard.py diffs HEAD against
          # its PARENT. A depth-1 checkout leaves HEAD parentless, so git
          # renders pyproject.toml as a whole-file addition and the guard
          # reports a false clobber on every release commit (overseer-94f4).
          # Skipping the guard when shallow would instead make it unfirable,
          # because every job that runs the suite checks out shallow -- so
          # the depth is the fix, not a depth-awareness skip.
          fetch-depth: 0

      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: just check-per-file-coverage
        run: |
          # The full suite spawns `node` in some tests; under the
          # container-hooks HOME the mise node/npm shims busy-loop or miss (no
          # node registered for that HOME), so put the image's real node bin —
          # derived from the shim's own location, never a hardcoded image path
          # — ahead of the shims on PATH. Its ABSENCE from dev-tooling's
          # equivalent job broke that repo's master with
          # `FileNotFoundError: 'node'`, which is why PR #1511 exists.
          shims_dir="$(dirname "$(command -v npm)")"
          node_bin="$(cd "$shims_dir/../installs/node/latest/bin" 2>/dev/null && pwd || ls -d "$shims_dir/../installs/node"/*/bin 2>/dev/null | head -1)"
          [ -n "$node_bin" ] && export PATH="$node_bin:$PATH"
          just check-per-file-coverage

      - name: Publish the flake-retry records for the host-side reader
        if: ${{ !cancelled() }}
        uses: thewoolleyman/livespec-dev-tooling/.github/actions/publish-flake-retries@v1.205.0

      # include-hidden-files is REQUIRED: upload-artifact@v4 excludes dotfiles
      # by default and both handoff files are dotfiles; without it the upload
      # silently ships nothing and the consumer falls back to a full duplicate
      # suite run.
      - name: Publish coverage data and provenance marker for the check-coverage consumer
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            .coverage
            .livespec-coverage-reuse-token
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Coverage-pair CONSUMER. Kept as a single-entry matrix (NOT a plain job)
  # because check-coverage is a tool-backed slug and
  # check-tool-backed-check-completeness requires every tool-backed slug to be
  # a LITERAL matrix.target member. `needs` the producer so the downloaded
  # `.coverage` and its provenance marker are both present, and
  # check-coverage.sh takes its consume-once branch (read + delete, no suite
  # run) only when the received marker equals the id this job computes for
  # itself. Paths inside the data file match because both jobs run in the same
  # container workspace mount. If the download or the marker ever regresses,
  # the script's fallback runs the suite standalone — slower, never
  # wrong.
  check-coverage:
    name: ${{ matrix.target }}
    needs: check-per-file-coverage
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.205.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      # Like the producer, this job exports no reuse token: it recomputes the
      # same provenance id from GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT and
      # compares it against the marker it received (see that job's comment).
    strategy:
      matrix:
        target:
          - check-coverage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: Download the producer's coverage data and provenance marker
        uses: actions/download-artifact@v4
        with:
          name: coverage-data

      - name: just ${{ matrix.target }}
        run: |
          # Node-PATH shim for the standalone-fallback branch only: the normal
          # path reads the downloaded `.coverage` without spawning anything,
          # but a missing artifact falls back to the full suite, which spawns
          # `node` in some tests (see the producer job).
          shims_dir="$(dirname "$(command -v npm)")"
          node_bin="$(cd "$shims_dir/../installs/node/latest/bin" 2>/dev/null && pwd || ls -d "$shims_dir/../installs/node"/*/bin 2>/dev/null | head -1)"
          [ -n "$node_bin" ] && export PATH="$node_bin:$PATH"
          # The consumer must CONSUME the producer's artifact, not silently fall
          # back to a duplicate suite run (overseer-hgq4wi.26): a green job that
          # took the fallback branch is the defect this assertion exists to
          # catch. The script's two branch messages are the discriminator, so
          # this literal is coupled to them — overseer-bnutz7 changed the
          # wording when the id stopped being aggregate-local, and the test
          # test_check_coverage_messages_do_not_assert_unproven_provenance
          # guards what those messages may claim.
          just ${{ matrix.target }} > coverage-consumer.log 2>&1 || { cat coverage-consumer.log; exit 1; }
          cat coverage-consumer.log
          grep -q 'reading current .coverage from matching provenance marker' coverage-consumer.log || {
            echo '::error::check-coverage did not take the consume-once branch; the coverage-data handoff is broken' >&2
            exit 1
          }

  # Metadata matrix runs unconditionally to preserve the repo-metadata
  # safety net. Populate as Phase G.4 migrates claude-md-coverage,
  # heading-coverage, no-direct-tool-invocation, check-tools, and
  # similar repo-metadata checks.
  #
  # `check-aggregate-completeness` is wired here so wiring-drift fails
  # CI directly, not just locally — added in epic li-univck Phase 3.3
  # (work-item li-runwir) alongside the v0.4.0 self-host wiring. The
  # full canonical aggregate is NOT yet in CI; broadening CI coverage
  # to the remaining 35 canonical slugs is a follow-up scope decision.
  # Batched cheap .py-scanning checks (work-item livespec-dev-tooling-yilyxr.9,
  # porting dev-tooling PR #1469): one container setup for 23 sub-minute
  # targets. Failures are COLLECTED (matrix fail-fast:false parity); each
  # target is a literal `just <slug>` line (ci-matrix-completeness assertion
  # a) and the job is gating (assertion b: in ci-green.needs).
  check-python-batch:
    name: check-python-batch
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.205.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: Run the batched python checks
        # LLOC soft-band lever ARMED here, not only in the release workflows.
        # A PR that pushes a file into the 201-250 band without an owner marker
        # previously passed its own CI and redded the release lane on the next
        # cut, with no signal to its author -- twice: overseer-hgq4wi.9
        # (_registry_store.py) and again 2026-08-20 (_supervisor_prompts.py, five
        # failed cuts over three hours). Marked files PASS, so arming this costs
        # nothing for ordinary work; the only failing case is a NEW unowned
        # crossing, which is exactly the case that must not reach master.
        env:
          LIVESPEC_FAIL_IF_LLOC_SOFT_WARNINGS_EXIST: "true"
        run: |
          failed=""
          just check-private-calls || failed="$failed check-private-calls"
          just check-global-writes || failed="$failed check-global-writes"
          just check-self-hosted-uv-lane || failed="$failed check-self-hosted-uv-lane"
          just check-supervisor-discipline || failed="$failed check-supervisor-discipline"
          just check-no-raise-outside-io || failed="$failed check-no-raise-outside-io"
          just check-no-except-outside-io || failed="$failed check-no-except-outside-io"
          just check-no-fmt-directives || failed="$failed check-no-fmt-directives"
          just check-public-api-result-typed || failed="$failed check-public-api-result-typed"
          just check-main-guard || failed="$failed check-main-guard"
          just check-wrapper-shape || failed="$failed check-wrapper-shape"
          just check-keyword-only-args || failed="$failed check-keyword-only-args"
          just check-match-keyword-only || failed="$failed check-match-keyword-only"
          just check-no-inheritance || failed="$failed check-no-inheritance"
          just check-assert-never-exhaustiveness || failed="$failed check-assert-never-exhaustiveness"
          just check-newtype-domain-primitives || failed="$failed check-newtype-domain-primitives"
          just check-all-declared || failed="$failed check-all-declared"
          just check-no-write-direct || failed="$failed check-no-write-direct"
          just check-pbt-coverage-pure-modules || failed="$failed check-pbt-coverage-pure-modules"
          just check-check-mutation || failed="$failed check-check-mutation"
          just check-file-lloc || failed="$failed check-file-lloc"
          just check-no-lloc-soft-warnings || failed="$failed check-no-lloc-soft-warnings"
          just check-rop-pipeline-shape || failed="$failed check-rop-pipeline-shape"
          just check-tests-mirror-pairing || failed="$failed check-tests-mirror-pairing"
          just check-tests-no-subprocess-spawn || failed="$failed check-tests-no-subprocess-spawn"
          if [ -n "$failed" ]; then
            echo "Failed targets:$failed"
            exit 1
          fi

  check-metadata:
    name: ${{ matrix.target }}
    # Self-hosted in the baked image, same rationale as check-python above.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.205.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # Batched-CI shape (work-item livespec-dev-tooling-yilyxr.9):
          # only the pytest-spawning, variable-duration targets keep
          # their own matrix leg; the cheap repo-metadata targets moved
          # to the single check-metadata-batch job below.
          - check-red-green-replay
          - check-check-coverage-incremental
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for ALL matrix entries: the
          # check-red-green-replay range validation enumerates
          # origin/master..HEAD and needs origin/master plus the merge
          # base in the clone — a fetch-depth: 1 checkout would make
          # the base unresolvable and fail the check actionably (it
          # never silently passes). Cheap for this repo; harmless for
          # the other metadata entries.
          fetch-depth: 0

      # Trust the workspace for git under hosted routing: the baked container
      # runs git as ROOT over a uid-1001 checkout → "dubious ownership" (exit
      # 128) otherwise. Written to the global gitconfig (HOME=/github/home) so
      # even resolve_repo_root() — which strips all GIT_* env before shelling
      # git (config.py) — reads it. See check-python for the full rationale.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      # Self-hosted lane only: the self-hosted runner reuses a persistent
      # `_work/<repo>/<repo>` checkout across jobs, unlike the hosted lane's
      # always-fresh clone. On that reused tree, actions/checkout's fetch for
      # a PR merge ref is a SHALLOW `--depth=1` fetch of ONLY that one commit
      # (`+<merge-sha>:refs/remotes/pull/N/merge`), despite `fetch-depth: 0`
      # above requesting full history. This has TWO distinct symptoms, both
      # observed live:
      #
      # 1. `refs/remotes/origin/*` is never (re-)established, leaving
      #    `origin/master` unresolvable and failing check-red-green-replay's
      #    `origin/master..HEAD` range enumeration (`range base origin/master
      #    is not resolvable`).
      # 2. On a `pull_request` event, HEAD is a GitHub-synthesized MERGE
      #    commit with two parents (current master, and the PR branch tip).
      #    The shallow fetch brings the merge commit's OWN object (parent
      #    SHAs included in its header), but never fetches the PR branch
      #    tip's own commit object. With one parent locally absent, git
      #    cannot walk that side of the graph — so `git rev-list --no-merges
      #    origin/master..HEAD` (which red_green_replay.py uses) treats the
      #    merge commit as if it were NOT a merge and lists it in the range,
      #    misreporting a "commits touching product impl .py without a valid
      #    TDD trailer shape" violation for a commit that introduced no such
      #    diff at all — reproduced locally: `git cat-file -p <merge-sha>`
      #    shows two parents in the header, but `git cat-file -t
      #    <pr-branch-tip-sha>` fails ("could not get object info") until the
      #    repo is unshallowed.
      #
      # `git fetch --unshallow` fixes BOTH: it fetches full history for the
      # remote's configured refspec (which resolves `origin/master`) AND
      # brings in every object the shallow boundary elided (which resolves
      # the merge commit's absent parent). The explicit `origin master` fetch
      # is kept as a belt-and-suspenders fallback in case a differently
      # configured checkout's default refspec ever doesn't cover master.
      # `--unshallow` errors on an already-complete repository, so it is
      # guarded by `--is-shallow-repository`. Hosted's fresh, always-shallow
      # -free clone never hits either symptom, so this step is a cheap no-op
      # there (the guard short-circuits, and the explicit fetch is idempotent
      # on an already-current `origin/master`).
      #
      # Ported from livespec's own ci.yml (PR #2261) via livespec-driver-codex
      # PR #437 (livespec plan/fleet-ci-runner-pool epic livespec-s43svm.1),
      # where it was proven live 2026-08-13.
      - name: Ensure full history is available (self-hosted reused _work dir)
        if: env.LIVESPEC_CI_LANE == 'local'
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow origin
          fi
          git fetch origin master:refs/remotes/origin/master

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: just ${{ matrix.target }}
        env:
          # Arm the CI-matrix drift guard (epic livespec-cf4bcu slice 5):
          # now that this repo's matrix + ci-green are complete, flip
          # check-ci-matrix-completeness from warn (exit 0) to FAIL
          # (exit 4), so any future canonical slug wired into `just check`
          # but dropped from CI reddens this leg instead of silently
          # warning. Harmless for the other metadata legs — they do not
          # read this var.
          LIVESPEC_FAIL_IF_CI_MATRIX_GAPS_EXIST: "true"
        run: just ${{ matrix.target }}

  # livespec core's doctor STATIC phase (reference-discipline + out-of-band
  # invariants), wired fleet-wide per livespec epic livespec-6jfq. core ships
  # the checker (doctor_static.py — self-contained, bare python3); this job
  # checks core out at the tag THIS repo pins (.livespec.jsonc compat.pinned)
  # and points the recipe at it via LIVESPEC_CORE_PLUGIN_ROOT. Its OWN job
  # (not the matrix) because it needs a second checkout — livespec core —
  # that no other target does.
  check-doctor-static:
    name: check-doctor-static
    # Self-hosted in the baked image. The livespec-core checkout below is a
    # fresh PUBLIC clone INSIDE the container (no host mount — containment
    # preserved).
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.205.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Trust the workspace for git under hosted routing: the baked container
      # runs git as ROOT over a uid-1001 checkout → "dubious ownership" (exit
      # 128) otherwise. Written to the global gitconfig (HOME=/github/home) so
      # even resolve_repo_root() — which strips all GIT_* env before shelling
      # git (config.py) — reads it. See check-python for the full rationale.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Resolve pinned livespec core ref (.livespec.jsonc compat.pinned)
        id: corepin
        run: |
          pinned="$(grep -oE '"pinned"[[:space:]]*:[[:space:]]*"[^"]*"' .livespec.jsonc | head -1 | sed -E 's/.*:[[:space:]]*"([^"]*)".*/\1/')"
          echo "ref=${pinned:-master}" >> "$GITHUB_OUTPUT"

      - name: Checkout livespec core at the pinned ref
        uses: actions/checkout@v4
        with:
          repository: thewoolleyman/livespec
          ref: ${{ steps.corepin.outputs.ref }}
          path: .livespec-core

      - name: just check-doctor-static
        run: |
          # In a container job, github.workspace (context) may be the HOST path;
          # $GITHUB_WORKSPACE (env) is the in-container mount, so derive the core
          # plugin root from it to stay container-correct.
          export LIVESPEC_CORE_PLUGIN_ROOT="${GITHUB_WORKSPACE}/.livespec-core/.claude-plugin"
          just check-doctor-static

  # Closed-loop CI telemetry: export this run's per-job timings to Honeycomb
  # (dataset github-ci) and FAIL if Honeycomb does not accept them. The run
  # that produced the data confirms its own telemetry landed — so a broken
  # pipeline can't die silently (it reddens master CI and fires the existing
  # failure notification). Master/merge_group ONLY (never PRs, so PR feedback
  # stays fast); runs even when checks fail (!cancelled) so failed runs are
  # observable too; excludes itself (still in_progress → no completedAt). See
  # livespec/SPECIFICATION/non-functional-requirements.md §"CI telemetry export".
  # Batched cheap repo-metadata checks (work-item livespec-dev-tooling-yilyxr.9,
  # porting dev-tooling PR #1469): one container setup for 31 sub-minute
  # targets. Failures are COLLECTED; every target is a literal `just <slug>`
  # line (ci-matrix-completeness assertion a) and the job is gating
  # (assertion b: in ci-green.needs). The commit-refuse hook and worktree
  # pack install UNCONDITIONALLY because
  # check-primary-checkout-commit-refuse-hook-installed and
  # check-shell-quality live in this batch (livespec-dev-tooling-9ywf /
  # y6e2 explain why the pack must be materialized).
  check-metadata-batch:
    name: check-metadata-batch
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.205.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: Install commit-refuse hook (satisfy invariant)
        run: just install-commit-refuse-hooks

      - name: Install canonical worktree pack (satisfy invariant)
        run: just install-worktree-pack

      - name: Run the batched metadata checks
        env:
          LIVESPEC_FAIL_IF_CI_MATRIX_GAPS_EXIST: "true"
          # ci_gate_parity's warn→fail lever, armed as this repo retires its
          # zero-.py gate skip (livespec plan pr-gate-master-parity R3,
          # livespec-citqsd). With it set the check exits 4 — not a WARNING —
          # if any gating job (one in ci-green.needs) reintroduces a
          # `py_changed`-conditioned skip, so a regression to a doc-only-weaker
          # PR gate reddens CI here rather than passing silently. Relocated from
          # the check-per-file-coverage step the v1.43.0 bump wired it into,
          # where its `|| failed=` result was collected but never inspected, so
          # a lever-set exit 4 was swallowed; this batch's trailing
          # `if [ -n "$failed" ]` propagation is what actually fails the job.
          LIVESPEC_FAIL_IF_CI_GATE_PARITY_GAPS_EXIST: "true"
        run: |
          failed=""
          just check-aggregate-completeness || failed="$failed check-aggregate-completeness"
          just check-ci-single-container-image || failed="$failed check-ci-single-container-image"
          just check-codex-hook-reconcilable || failed="$failed check-codex-hook-reconcilable"
          just check-delegated-gate-check-suite || failed="$failed check-delegated-gate-check-suite"
          just check-delegated-job-authority-skip || failed="$failed check-delegated-job-authority-skip"
          just check-handoff-dispatch-routing || failed="$failed check-handoff-dispatch-routing"
          just check-heading-coverage-debt-register || failed="$failed check-heading-coverage-debt-register"
          just check-hook-trees-not-io-exempt || failed="$failed check-hook-trees-not-io-exempt"
          just check-local-memory-drift-audit || failed="$failed check-local-memory-drift-audit"
          just check-marketplace-ref-release-only || failed="$failed check-marketplace-ref-release-only"
          just check-no-direct-destructive-cli || failed="$failed check-no-direct-destructive-cli"
          just check-no-shadow-ledger-body-identical || failed="$failed check-no-shadow-ledger-body-identical"
          just check-no-shadow-ledger-body-typechecks || failed="$failed check-no-shadow-ledger-body-typechecks"
          just check-plan-anchor-declared || failed="$failed check-plan-anchor-declared"
          just check-plan-no-live-handoff-file || failed="$failed check-plan-no-live-handoff-file"
          just check-plan-no-tombstone || failed="$failed check-plan-no-tombstone"
          just check-primary-checkout-commit-refuse-hook-installed || failed="$failed check-primary-checkout-commit-refuse-hook-installed"
          just check-claude-md-coverage || failed="$failed check-claude-md-coverage"
          just check-heading-coverage || failed="$failed check-heading-coverage"
          just check-required-role-keys-declared || failed="$failed check-required-role-keys-declared"
          just check-rule-26-keep-out || failed="$failed check-rule-26-keep-out"
          just check-self-hosted-routing || failed="$failed check-self-hosted-routing"
          just check-source-trees-scoped-to-consumer || failed="$failed check-source-trees-scoped-to-consumer"
          just check-vendor-manifest || failed="$failed check-vendor-manifest"
          just check-no-direct-tool-invocation || failed="$failed check-no-direct-tool-invocation"
          just check-tool-backed-check-completeness || failed="$failed check-tool-backed-check-completeness"
          just check-agents-ai-references-resolve || failed="$failed check-agents-ai-references-resolve"
          just check-canonical-recipe-fidelity || failed="$failed check-canonical-recipe-fidelity"
          just check-check-tools || failed="$failed check-check-tools"
          just check-plugin-manifest-lockstep || failed="$failed check-plugin-manifest-lockstep"
          just check-full-autonomy-config-conformance || failed="$failed check-full-autonomy-config-conformance"
          just check-plan-anchor-metadata || failed="$failed check-plan-anchor-metadata"
          just check-codex-plugin-runnable-launcher || failed="$failed check-codex-plugin-runnable-launcher"
          just check-codex-skill-picker || failed="$failed check-codex-skill-picker"
          just check-claude-idle-canary || failed="$failed check-claude-idle-canary"
          just check-instruction-surface-budget || failed="$failed check-instruction-surface-budget"
          just check-spec-governance-default-block || failed="$failed check-spec-governance-default-block"
          just check-tmp-supervisor-discipline || failed="$failed check-tmp-supervisor-discipline"
          just check-report-only-artifact-producers || failed="$failed check-report-only-artifact-producers"
          just check-ci-matrix-completeness || failed="$failed check-ci-matrix-completeness"
          just check-ci-gate-parity || failed="$failed check-ci-gate-parity"
          just check-comment-line-anchors || failed="$failed check-comment-line-anchors"
          just check-commit-pairs-source-and-test || failed="$failed check-commit-pairs-source-and-test"
          just check-fleet-marketplace-relative-sources || failed="$failed check-fleet-marketplace-relative-sources"
          just check-no-todo-registry || failed="$failed check-no-todo-registry"
          just check-no-workflow-edits || failed="$failed check-no-workflow-edits"
          # Bound here by overseer-hgq4wi.18, alongside its sibling above.
          # THE HOLE THIS CLOSES IS STRUCTURAL, NOT REALIZED, and that is
          # recorded deliberately: the factory lane DOES run local hooks
          # (the dispatcher installs lefthook in its sandbox), and the
          # unhooked bot lane has never been observed touching
          # SPECIFICATION/ -- it rewrites pins. No instance of an unhooked
          # lane reaching SPECIFICATION/ has been measured. Binding removes
          # the dependence on that premise staying true; saying so here
          # keeps the binding from reading, later, as evidence the hole was
          # realized.
          just check-no-factory-spec-edits || failed="$failed check-no-factory-spec-edits"
          just check-partition-completeness || failed="$failed check-partition-completeness"
          just check-plugin-resolution || failed="$failed check-plugin-resolution"
          just check-shell-quality || failed="$failed check-shell-quality"
          just check-skill-invocation-paths || failed="$failed check-skill-invocation-paths"
          just check-prose-release-hygiene || failed="$failed check-prose-release-hygiene"
          if [ -n "$failed" ]; then
            echo "Failed targets:$failed"
            exit 1
          fi

  # The released incident CI entrance, ported from livespec-dev-tooling's
  # incident-ci job (plan expedited-incident-response-flag, epic
  # livespec-dev-tooling-bqnzcm; this repository adopts expedited incident mode
  # under the maintainer's 2026-11-12 ruling). It installs the LATEST RELEASED
  # livespec-dev-tooling into its own venv and runs the entrance from THAT
  # interpreter with `-I`, never from the candidate tree. With no
  # `<!-- livespec-incident-ci` block in the PR body (read through an
  # authenticated forge read, never the event payload), or on a push, it
  # selects nothing and exits 0: the complete normal graph is the gate. With a
  # block, the released plan/run/aggregate rechecks the observer's /current and
  # /admitted answers and publishes an aggregate listing every omitted member.
  # The observer inputs are the variable LIVESPEC_INCIDENT_OBSERVER_URL and the
  # read-only query secret LIVESPEC_INCIDENT_OBSERVER_QUERY_TOKEN; until both
  # exist an incident PR is REFUSED with that named cause and a non-incident PR
  # is unaffected. Its `omitted` output is not yet consumed by any job here:
  # the omission guards on the coverage and spec jobs are a follow-up.
  incident-ci:
    timeout-minutes: 90
    name: incident-ci
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.205.0
    permissions:
      contents: read
      pull-requests: read
    outputs:
      omitted: ${{ steps.entrance.outputs.omitted }}
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      LIVESPEC_DEV_TOOLING_REPOSITORY: thewoolleyman/livespec-dev-tooling
    steps:
      # The PR-body prefilter runs FIRST and needs no checkout, so an ordinary
      # pull request or a push finishes in about a minute: every heavier step
      # below runs only when the body carries a livespec-incident-ci block.
      # The test is ANCHORED to the block's opening line: a PR description
      # that merely MENTIONS the marker selects nothing. The released entrance
      # does the real parse; this is only the prefilter.
      - name: Select incident work from an authenticated PR read
        id: select
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          block=absent
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
            body="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""')"
            if grep -qE '^<!-- livespec-incident-ci[[:space:]]*$' <<< "$body"; then
              block=present
            fi
          fi
          if [ "$block" = present ]; then
            echo "incident-ci: PR #${PR_NUMBER} carries a livespec-incident-ci block; running the released entrance"
          else
            reason="no livespec-incident-ci block in the PR body"
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
              reason="${GITHUB_EVENT_NAME} event: the normal complete policy is the gate"
            fi
            echo "incident-ci: selected nothing (${reason}); no check executed by this job"
            printf '## incident-ci\n\nselected nothing (%s); no check executed by this job.\n' "$reason" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "block=${block}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.select.outputs.block == 'present'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare workspace (git trust, mise trust + install, uv sync)
        if: steps.select.outputs.block == 'present'
        run: |
          git config --global --add safe.directory '*'
          mise trust
          mise install
          uv sync --all-groups

      - name: Install commit-refuse hook (satisfy invariant)
        if: steps.select.outputs.block == 'present'
        run: just install-commit-refuse-hooks

      - name: Install canonical worktree pack (satisfy invariant)
        if: steps.select.outputs.block == 'present'
        run: just install-worktree-pack

      # The release is resolved from livespec-dev-tooling's forge releases,
      # never from this repository's candidate tree, and installed into a venv
      # OUTSIDE the workspace. The last check proves the released module
      # resolves from that venv.
      - name: Install the latest released livespec-dev-tooling (never the candidate tree)
        id: released
        if: steps.select.outputs.block == 'present'
        shell: bash
        run: |
          tag="$(gh api "repos/${LIVESPEC_DEV_TOOLING_REPOSITORY}/releases/latest" --jq .tag_name)"
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::could not resolve the latest release tag of ${LIVESPEC_DEV_TOOLING_REPOSITORY} (got '${tag}')"; exit 1 ;;
          esac
          venv="${RUNNER_TEMP}/released-dev-tooling"
          uv venv --python "$(cat .python-version)" "$venv"
          uv pip install --python "${venv}/bin/python" \
            "livespec-dev-tooling @ git+https://github.com/${LIVESPEC_DEV_TOOLING_REPOSITORY}@${tag}"
          resolved="$("${venv}/bin/python" -I -c 'import livespec_dev_tooling as m; print(m.__file__)')"
          case "$resolved" in
            "${venv}"/*) echo "released livespec-dev-tooling ${tag} resolves from ${resolved}" ;;
            *) echo "::error::released module resolved from ${resolved}, not from ${venv}"; exit 1 ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "python=${venv}/bin/python" >> "$GITHUB_OUTPUT"

      - name: Run the released incident CI entrance (plan, run, aggregate)
        id: entrance
        if: steps.select.outputs.block == 'present'
        shell: bash
        env:
          RELEASED_PYTHON: ${{ steps.released.outputs.python }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LIVESPEC_INCIDENT_OBSERVER_URL: ${{ vars.LIVESPEC_INCIDENT_OBSERVER_URL }}
          LIVESPEC_INCIDENT_OBSERVER_CONNECT_ADDR: ${{ vars.LIVESPEC_INCIDENT_OBSERVER_CONNECT_ADDR }}
          LIVESPEC_INCIDENT_OBSERVER_QUERY_TOKEN: ${{ secrets.LIVESPEC_INCIDENT_OBSERVER_QUERY_TOKEN }}
        run: |
          if [ -z "$LIVESPEC_INCIDENT_OBSERVER_URL" ] || [ -z "$LIVESPEC_INCIDENT_OBSERVER_QUERY_TOKEN" ]; then
            echo "::error::incident PR refused: the repository configures neither LIVESPEC_INCIDENT_OBSERVER_URL (variable) nor LIVESPEC_INCIDENT_OBSERVER_QUERY_TOKEN (secret) completely; the released entrance cannot recheck /current and /admitted without them"
            exit 1
          fi
          export GITHUB_PR_NUMBER="$PR_NUMBER" GITHUB_PR_HEAD_SHA="$PR_HEAD_SHA"
          entrance=("$RELEASED_PYTHON" -I -m livespec_dev_tooling.incident_ci_process)
          if ! plan="$("${entrance[@]}" plan --repo "$PWD")"; then
            echo "::error::released plan refused: ${plan}"
            exit 1
          fi
          mode="$(printf '%s' "$plan" | "$RELEASED_PYTHON" -I -c 'import json, sys; print(json.load(sys.stdin)["mode"])')"
          if [ "$mode" != "expedited-repair" ]; then
            note="PR #${PR_NUMBER} is unexpedited: the released plan selected the '${mode}' mode, so the retained livespec-incident-ci block is ignored, both incident flags are off, and the complete normal policy runs; no check executed by this job"
            echo "::notice::incident-ci: ${note}"
            printf '## incident-ci\n\n%s.\n' "$note" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          targets=()
          while IFS= read -r name; do
            targets+=(--target "$name")
          done < <(printf '%s' "$plan" | "$RELEASED_PYTHON" -I -c 'import json, sys; print("\n".join(json.load(sys.stdin)["selected"]))')
          run_code=0
          "${entrance[@]}" run --repo "$PWD" --report tmp/incident-ci/outcomes.jsonl "${targets[@]}" || run_code=$?
          echo "released run exited ${run_code}; publishing the aggregate"
          if ! aggregate="$("${entrance[@]}" aggregate --repo "$PWD" --reports tmp/incident-ci)"; then
            echo "::error::released aggregate did not pass: ${aggregate}"
            exit 1
          fi
          echo "$aggregate"
          omitted="$(printf '%s' "$aggregate" | "$RELEASED_PYTHON" -I -c 'import json, sys; print(json.dumps(sorted(d["name"] for d in json.load(sys.stdin)["deferred"] if d["reason"] in ("incident-policy:coverage", "incident-policy:spec"))))')"
          echo "omitted=${omitted}" >> "$GITHUB_OUTPUT"

      - name: Publish the incident CI outcome records
        if: ${{ always() && steps.select.outputs.block == 'present' }}
        uses: actions/upload-artifact@v4
        with:
          name: incident-ci-outcomes
          path: tmp/incident-ci
          if-no-files-found: ignore
          retention-days: 7

  export-telemetry:
    name: export-telemetry
    needs: [check-python, check-per-file-coverage, check-coverage, check-python-batch, check-metadata, check-metadata-batch, incident-ci]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export CI run telemetry to Honeycomb (closed-loop verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HONEYCOMB_GITHUB_CI_INGEST_KEY_LIVESPEC: ${{ secrets.HONEYCOMB_GITHUB_CI_INGEST_KEY_LIVESPEC }}
        run: bash .github/scripts/export-ci-telemetry.sh

  # fleet-ci-aggregate-coverage (epic livespec-cf4bcu) slice 5: the single
  # all-green gate job. It `needs:` every check-bearing job and fails if any
  # dependency failed or was cancelled — a pure GitHub-expression gate (no
  # external action, no direct tool invocation, so it satisfies
  # livespec/SPECIFICATION/non-functional-requirements.md §"Toolchain pins").
  # Branch protection requires ONLY this context, so one stable name gates the
  # whole matrix and never churns as checks are added. The `if: always()` +
  # skip-tolerant predicate treats a SKIPPED dependency as not-a-failure (only
  # `failure`/`cancelled` fail the gate); with the zero-.py gate skip retired,
  # every gating job now runs its real steps on both a push and a
  # pull_request — PR gate ≡ master gate — so no gating dependency skips on a
  # doc-only PR any more. check-doctor-static is its OWN job here (not a
  # check-metadata matrix entry, unlike livespec-core), so it is listed
  # explicitly. export-telemetry is push/merge_group-only and NOT a gate, so it
  # is intentionally absent from `needs:`.
  ci-green:
    name: ci-green
    needs: [check-python, check-per-file-coverage, check-coverage, check-python-batch, check-metadata, check-metadata-batch, check-doctor-static, incident-ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required checks passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
