# Per-target matrix CI for livespec-orchestrator-beads-fabro.
#
# Generated from livespec/templates/impl-plugin/.github/workflows/
# ci.yml.jinja at copier-copy time; re-sync via `copier update --vcs-ref=master` when
# livespec publishes a new release.
#
# Authority: livespec/SPECIFICATION/non-functional-requirements.md
#   §"CI as a merge gate (branch protection)" — PR gate ≡ master gate:
#   every gating job runs identically on a `pull_request` and on a `push`
#   to master. There is NO change-detection gate. The retired zero-.py
#   subsetting (a `setup`/`detect-py-changes` job exporting `py_changed`,
#   on which the Python-code jobs conditioned their real steps so a
#   doc-only PR skipped them) was the seam that let a workflow-only PR
#   merge green and redden master on 2026-09-04; check-ci-gate-parity
#   (armed to fail in check-metadata-batch below) now reddens any
#   regression that reintroduces a py_changed-conditioned gating job.
#
# Authority: livespec/SPECIFICATION/non-functional-requirements.md
#   §"Toolchain pins" — direct tool invocations (ruff, pyright,
#   pytest, python3) in `run:` lines are forbidden; every step
#   delegates to `just <target>`.
#
# Starter scaffold: the Python-code matrix carries only the tool-
# backed checks (lint, format, types, coverage). The metadata matrix
# is empty. As livespec-orchestrator-beads-fabro populates dev-tooling/checks/
# scripts, add the corresponding `check-<slug>` targets to the
# appropriate matrix and to branch protection's required-status-
# checks list.

name: CI

# uv occasionally fails when the PyPI file CDN (files.pythonhosted.org)
# drops a wheel download mid-stream ("broken pipe"). UV_HTTP_RETRIES
# makes uv retry the fetch in-process instead of failing the job.
# There is no actions/cache step for uv: each job's container image
# carries the uv cache, and the uid-1000 legs point UV_CACHE_DIR at the
# node's warm uv seed when it is writable (bd-ib-rpit5z, below).
#
# mise reaches the SAME class of CDN (GitHub releases) for its tool binaries
# and fails identically. mise's own default is `http_retries = 0` — one
# attempt, no retry — so the lesson already learned for uv above has to be
# spelled out again here.
env:
  UV_HTTP_RETRIES: "5"
  MISE_HTTP_RETRIES: "5"
  # Lane-selected uv fetch bounds, required of every workflow that routes
  # through CI_RUNNER_LABELS (livespec-dev-tooling's self_hosted_uv_lane
  # check; the fleet form every routed member carries). The self-hosted pool
  # runs many job slots on ONE host behind one uplink, so per-job download
  # concurrency is capped there and the transfer timeout raised; the hosted
  # lane keeps uv's own defaults. Missed by the routing change (livespec-ifwnqj.1)
  # because a ci.yml-only pull request skips the python-batch job that runs
  # the check, and it fired on the first master push instead.
  UV_CONCURRENT_DOWNLOADS: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '50' || '4' }}
  UV_HTTP_TIMEOUT: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '30' || '60' }}

# merge_group is deliberately ABSENT: no merge queue is configured for this
# repo (verified live — zero rulesets, required_merge_queue: null; branch
# protection requires only the ci-green context). Keeping the vestigial trigger
# would leave a dead event in the trigger set. Re-add it only if a merge queue
# is actually adopted.
on:
  pull_request:
  push:
    branches: [master]

# RUNNER ROUTING — the fleet's flippable form, like the other nine members.
#
# Every check job's `runs-on` reads the repository variable CI_RUNNER_LABELS
# and falls back to GitHub-hosted `ubuntu-latest` when it is unset;
# `export-telemetry` and `ci-green` stay hosted so the gate reporter never
# depends on the self-hosted pool (the same convention every routed
# member's ci.yml follows). The variable
# points at this repo's PowerEdge scale set (`livespec-orchestrator-k3s`,
# livespec-dev-tooling ci-runner/k3s/phase2/arc/values-livespec-orchestrator-beads-fabro.yaml)
# and is written only through livespec-dev-tooling's guarded
# ci-runner/set-ci-runner-labels.sh, which refuses unless the fork-PR
# approval tier is at its strictest setting.
#
# Until 2026-09-04 this file was plain `runs-on: ubuntu-latest` by a recorded
# caution: this repo also hosts the fleet's operator-triggered live
# golden-master tier (acceptance-live-golden-master.yml, a separate workflow
# on a separate `livespec-orchestrator`-labeled runner), and routing CI here
# was called a "two-trust-tier" decision. The maintainer settled it in
# session on 2026-09-04 (livespec plan ci-runner-pod-lifecycle-reliability,
# epic livespec-ifwnqj, the ~16:15Z scope event, Carrier G1): the exposure is
# the same as every other member's, and this file's triggers are
# `pull_request` + `push` exactly like livespec's, so livespec-dev-tooling's
# self_hosted_routing guard (which fires only when a workflow both names the
# `local-ci` label and uses an automation trigger) does not bear on it. The
# fallback here is `ubuntu-latest`, not `local-ci`, for that reason.
#
# The baked `container:` image below is orthogonal to routing: it gives the
# check jobs the SAME environment the Fabro sandbox runs, so "green in CI" and
# "green in sandbox" mean the same thing (livespec plan/fabro-ci-image-factoring).

# B' master-push concurrency (livespec-dev-tooling SPECIFICATION/constraints.md
# §"CI matrix shape", v182; bd-ib-5o5ibo; the same shape as
# livespec-dev-tooling-qzw2gf). Every push to refs/heads/master joins ONE group with
# cancel-in-progress false: the run in progress always completes, and when a newer
# master push joins, GitHub cancels the older run still PENDING in the group, so only
# the newest pending run is kept. A dropped run is never its commit's verdict. Every
# other run groups by its own run_id and is never held: pull requests,
# `chore(master): release` commits, the incident recovery principal's
# `Revert complete incident PR #` commits, and every push in which ANY commit carries a
# `Factory-Override:` trailer, which covers the expedited-incident trailer (a superset, so
# no expedited run is ever dropped). This repository calls no master-health reconciler,
# which the allowance requires.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/master' && !startsWith(github.event.head_commit.message, 'chore(master): release') && !startsWith(github.event.head_commit.message, 'Revert complete incident PR #') && !contains(join(github.event.commits.*.message, ' '), 'Factory-Override:')) && 'master-push' || github.run_id }}
  cancel-in-progress: false

jobs:
  check-python:
    name: ${{ matrix.target }} (${{ matrix.uid }})
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.205.0
    env:
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        # bd-ib-sfa2: every target runs under BOTH uids, and BOTH are
        # required — the nonroot leg HERE, on every pull request and master
        # push, and the root leg in `ci-root-uid.yml`, on master every three
        # hours (bd-ib-xufdwx, plan ci-runtime-and-cost, maintainer direction
        # 2026-11-03: "root and non root . is overkill. move one to
        # dschrduled master job"). Nonroot stays on pull requests because it
        # is the production-shaped uid: the janitor and factory workers run
        # non-root. A red scheduled root run is filed as a breakage work item
        # (bd-ib-pgbr52), so a root-only divergence is found on master after
        # merge rather than before it. Before this dimension existed the whole matrix ran as
        # root, so CI STRUCTURALLY COULD NOT exhibit a non-root divergence —
        # which is how `_dispatcher_janitor_lock.py:133` stayed uncovered for
        # every non-root runner while CI reported green on the same SHA, and
        # the janitor (which runs NON-ROOT in a fresh checkout) was red on
        # master for weeks.
        #
        # NO divergence-detection machinery is needed, and that is deliberate:
        # the existing 100% coverage gate ALREADY converts divergence into a
        # failure. A line reachable only as root is unreachable in the non-root
        # leg, which then misses 100% and fails; a line reachable only as
        # non-root fails the root leg identically. So divergence cannot survive
        # two independently-gated legs — no comparison step, no report-diffing,
        # no second invariant that could drift from the first. Moving the root
        # leg to a schedule changes WHEN it gates, not WHETHER: each uid is
        # still gated at 100% on its own.
        #
        # THIS ARGUMENT DEPENDS ON THE COVERAGE FAIL-UNDER REMAINING 100%
        # (`pyproject.toml [tool.coverage.report] fail_under = 100`, which
        # carries the reciprocal note). Lower it and this reasoning lapses:
        # explicit divergence detection would then become necessary, because a
        # line missing in exactly one leg could sit under the threshold in both.
        #
        # Both uids run the FULL target list rather than a curated
        # "targets that can diverge" subset. A hand-enumerated subset would be
        # a drift-prone allowlist that silently stops covering new targets —
        # the defect class of `bd-ib-d9gf`. Uniformity costs runner minutes and
        # buys the absence of a list nobody would remember to update.
        uid:
          - nonroot
        target:
          # Batched-CI shape (work-item livespec-dev-tooling-yilyxr.9,
          # porting dev-tooling PR #1469): tool-backed slugs must be
          # LITERAL matrix members (check-tool-backed-check-completeness)
          # and the cheap .py-scanning targets moved to
          # check-python-batch below, which keeps the SAME uid matrix (here
          # and in ci-root-uid.yml) so the bd-ib-sfa2 both-uids invariant
          # holds for every target
          # (slug drift stays policed by ci-matrix-completeness). The
          # coverage PAIR left this matrix entirely (work-item
          # livespec-dev-tooling-yilyxr.8, porting dev-tooling PRs #1504
          # + #1511) for the producer/consumer chain below — which keeps
          # the uid dimension, so bd-ib-sfa2's argument is untouched.
          - check-lint
          - check-format
          - check-types
    steps:
      # Per-step `if:` (not job-level) so each matrix entry still reports a
      # status check named `${{ matrix.target }} (${{ matrix.uid }})`. With
      # job-level `if:`, a skipped matrix collapses to one `check-python`
      # status and the per-target detail is lost from the checks list.
      #
      # This is now readability, NOT a gating requirement: branch protection
      # requires only the aggregate `ci-green` context, which `needs:` this job
      # and fails when ANY matrix leg fails. That is also why adding the `uid`
      # dimension — which renames every check context — needs no
      # branch-protection change.

      - name: Checkout
        uses: actions/checkout@v4

      # The baked container runs git as ROOT over a uid-1001 checkout, so every
      # post-checkout git call fails "detected dubious ownership" (exit 128)
      # without this. actions/checkout adds its own safe.directory but scopes it
      # to a temporary HOME it discards, and resolve_repo_root() (config.py)
      # strips all GIT_* env before shelling git — so an env-var GIT_CONFIG_*
      # approach is invisible to it. It MUST be the --global write to
      # $HOME/.gitconfig (HOME=/github/home) so EVERY git call reads it.
      # Tools are baked into the image; `mise install` is a near-no-op that just
      # confirms the pinned versions. A fresh container does not TRUST the repo
      # .mise.toml, so `mise trust` is required for the shims to resolve.
      # (Replaces the mise-action install + the actions/cache uv restore — the
      # container image is the cache now.)
      # bd-ib-hik3mz: ONE step, not three. Every step of a k3s job pays
      # about 1 s of container-hook launch; same commands, same order, and the
      # step shell is -e, so the first failing command still fails the step.
      - name: Prepare workspace (git trust, mise trust + install, uv sync)
        run: |
          git config --global --add safe.directory '*'
          mise trust
          mise install
          uv sync --all-groups

      # bd-ib-sfa2, the NARROW ROUTE (maintainer-decided 2026-07-21).
      #
      # /root is mode 0700 and the ENTIRE baked toolchain lives beneath it —
      # mise itself is /root/.local/bin/mise and there is NO copy anywhere else
      # on the filesystem, so `find / -xdev -name mise -not -path '/root/*'`
      # returns nothing. An unprivileged uid therefore cannot reach the
      # toolchain at all. Env overrides alone CANNOT fix this: they change
      # where mise WRITES, not where it IS. Opening /root to 0755 lets uid 1000
      # reuse the BAKED toolchain read-only, with no image change and no
      # toolchain install.
      #
      # LIMITATION — this must travel WITH the capability and never alone:
      # this is a PARTIAL replica. It reproduces "uid 1000 with access to
      # root's toolchain", NOT "uid 1000 as the janitor sees the world". Any
      # divergence that depends on /root genuinely being 0700 stays invisible
      # to it. The faithful alternative relocates the toolchain to a
      # world-readable path in livespec-dev-tooling's docker/fabro-sandbox/base
      # layer, at the cost of a fleet-wide rebuild, republish, and pin bump;
      # it was weighed and declined, and remains the upgrade path if a
      # /root-mode-dependent divergence ever surfaces.
      #
      # Runs AFTER `uv sync` on purpose: root creates .venv, so the chown must
      # follow it or uid 1000 inherits a venv it cannot write.
      - name: Prepare non-root leg (open baked toolchain to uid 1000)
        if: matrix.uid == 'nonroot'
        run: |
          # NO `set -euo pipefail` here. The container job's default shell is
          # `sh -e {0}` — dash, not bash — where `-o pipefail` is an illegal
          # option and the whole step dies with exit 2 before doing any work.
          # The `-e` in the default shell already supplies errexit, so nothing
          # is lost. Verified in the image: `sh -e -c 'false; echo X'` exits 1
          # without printing.
          chmod 0755 /root
          # bd-ib-uuatg4: touch ONLY entries that lack the permission. A blanket
          # `chmod -R` rewrites every mode even when unchanged, so overlayfs copies
          # up the image's whole 462 MB mise/uv tree (177-216 s measured in
          # python-v1.168.0, where 1 of 11,437 entries lacked o+r). Same end state.
          find /root/.config /root/.local \( ! -perm -o+r -o \( -type d ! -perm -o+x \) \) -exec chmod a+rX {} +
          # HOME deliberately NOT under /tmp: that would put the venue inside
          # the `/tmp/*` coverage omit glob (pyproject.toml) and trip
          # livespec-impl-beads-1l6's regression guard.
          mkdir -p /home/ci
          # bd-ib-vnmph2: give uid 1000 ownership with a targeted pass, as
          # bd-ib-uuatg4 did for modes: change ONLY the entries uid 1000 does not
          # already own. find visits its starting points too, so /home/ci and the
          # workspace root themselves are covered. -h changes a symlink itself,
          # as chown -R does, and never follows one out of the tree.
          find /home/ci "$GITHUB_WORKSPACE" \( ! -user 1000 -o ! -group 1000 \) -exec chown -h 1000:1000 {} +
          # The root-side safe.directory trust was written to /github/home,
          # which uid 1000 does not read (its HOME is /home/ci). Without this,
          # every git call from a check fails "detected dubious ownership".
          setpriv --reuid=1000 --regid=1000 --clear-groups \
            env HOME=/home/ci git config --global --add safe.directory '*'
          # bd-ib-rpit5z: point the uid-1000 uv invocations at the pool's warm
          # seed /__w/_warm/uv when uid 1000 can write every directory in it, and
          # otherwise fall back to the private cold cache with a warning, never a
          # job failure. The seed is no longer root-owned hardlinks into the fleet
          # generation (livespec-dev-tooling-hmv2bo made it a private reflink copy
          # per work volume), and hosted runners have no seed at all.
          nonroot_uv_cache=/home/ci/.cache/uv
          if [ -d /__w/_warm/uv ]; then
            # The provisioner seeds the volume as root (`cp -a --reflink`), so the
            # seed arrives root-owned and uid 1000 cannot write it (measured on
            # livespec-orchestrator-beads-fabro#4453, 2026-11-05). It is this
            # pod's OWN reflink copy, reachable from no other pod (hook template,
            # header item 2), so handing it to uid 1000 cannot touch the fleet
            # generation. The pass is targeted: it changes only entries uid 1000
            # does not already own, and it is metadata only.
            find /__w/_warm/uv \( ! -user 1000 -o ! -group 1000 \) -exec chown -h 1000:1000 {} + || true
            unwritable=$(setpriv --reuid=1000 --regid=1000 --clear-groups \
              find /__w/_warm/uv -type d ! -writable -print -quit 2>&1) || unwritable="${unwritable:-find exited non-zero}"
            if [ -z "$unwritable" ]; then
              nonroot_uv_cache=/__w/_warm/uv
            else
              echo "::warning::bd-ib-rpit5z: uid 1000 cannot write the warm uv seed (${unwritable}); this leg uses the cold private cache"
            fi
          fi
          echo "NONROOT_UV_CACHE_DIR=${nonroot_uv_cache}" >> "$GITHUB_ENV"

      # No `--cov` or fail-under override here: this leg runs the SAME recipe
      # under a different uid, which is the whole point. Nothing about it is
      # advisory, warn-only, or gated behind an env lever — a failure here
      # fails the job, and `ci-green` (the sole required context) fails if any
      # matrix leg fails.
      # UV_CACHE_DIR for every uid-1000 invocation is NONROOT_UV_CACHE_DIR,
      # which the prepare step sets to the warm seed /__w/_warm/uv when uid 1000
      # can write it, and otherwise to a private cold cache under /home/ci. On
      # 2026-09-04 the seed was root-owned hardlinks into the fleet generation
      # and uv as uid 1000 could not initialize it ("Failed to initialize cache",
      # master runs 33903087096 / 33903145604). Since livespec-dev-tooling-hmv2bo
      # the seed is a private reflink copy per work volume. bd-ib-rpit5z
      # (plan ci-cache-optimization, lever 4) points the nonroot legs back at it.
      - name: just ${{ matrix.target }} (uid 1000)
        if: matrix.uid == 'nonroot'
        run: |
          setpriv --reuid=1000 --regid=1000 --clear-groups \
            env HOME=/home/ci \
                UV_CACHE_DIR="$NONROOT_UV_CACHE_DIR" \
                MISE_DATA_DIR=/root/.local/share/mise \
                MISE_GLOBAL_CONFIG_FILE=/root/.config/mise/config.toml \
                MISE_NOT_FOUND_AUTO_INSTALL=0 \
                MISE_TRUSTED_CONFIG_PATHS="$GITHUB_WORKSPACE" \
                PATH=/root/.local/share/mise/shims:/root/.local/bin:/usr/local/bin:/usr/bin:/bin \
                GITHUB_TOKEN="$GITHUB_TOKEN" \
                GH_TOKEN="$GH_TOKEN" \
              just ${{ matrix.target }}

  # Coverage-pair PRODUCER (work-item livespec-dev-tooling-yilyxr.8, porting
  # dev-tooling PRs #1504 + #1511). Direction is fixed by this repo's own
  # scripts, not by convention: dev-tooling/just-check-per-file-coverage.sh
  # unconditionally runs `pytest --cov` with COVERAGE_FILE unset and leaves the
  # repo-root `.coverage` behind, while dev-tooling/just-check-coverage.sh
  # branches on `[[ -f .coverage ]]` and only runs the suite when the file is
  # ABSENT. So per-file is the producer and coverage is the consumer, the same
  # way `just check` already dedups them locally. Before this chain existed
  # both legs ran the full suite on separate runners, under BOTH uids — four
  # suite runs per CI run; now it is two.
  #
  # THE uid DIMENSION IS LOAD-BEARING HERE AND IS KEPT, split across two
  # workflows: nonroot here, root in ci-root-uid.yml (bd-ib-xufdwx). bd-ib-sfa2's argument
  # (see check-python) is that the 100% coverage gate itself converts a
  # root/non-root divergence into a failure, because a line reachable only
  # under one uid misses 100% under the other. That argument lives in THESE
  # two targets, so collapsing them to a single uid would silently retire it.
  # Each uid produces its OWN `.coverage` under its own artifact name, and the
  # consumer leg for a uid reads only the artifact its own uid produced — so
  # the two legs stay independently gated exactly as before.
  # bd-ib-m26pql: per-file coverage as PARALLEL SHARDS. The suite was the PR
  # critical path (check-per-file-coverage nonroot: median 35.0 min, p90 63.4,
  # n=39 since 2026-11-04T20Z) because every pod runs at most
  # LIVESPEC_TEST_PARALLELISM=3 xdist workers. Each shard runs a disjoint
  # round-robin quarter of the tracked test files (dev-tooling/just-coverage-shard.sh)
  # and only RECORDS coverage; check-per-file-coverage below `needs` every shard,
  # combines their data, and runs the unchanged canonical per-file verifier.
  # The shard count is 4: at most 4 churn slots per PR, well inside the free
  # slots on poweredge-xubuntu (15 of 21 free at 05:05Z 2026-11-05). Raising it
  # means editing both the `shard` list and the count passed to the recipe.
  # In ci-green's needs, so a failed shard fails the gate directly. Root-uid
  # coverage (ci-root-uid.yml) is unchanged and still runs the whole suite.
  check-per-file-coverage-shard:
    name: check-per-file-coverage-shard (${{ matrix.uid }}, ${{ matrix.shard }}/4)
    runs-on: ${{ fromJSON(vars.CI_COVERAGE_RUNNER_LABELS || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.205.0
    env:
      # Lane-selected uv bounds from THIS job's routing (see the top-level env).
      UV_CONCURRENT_DOWNLOADS: ${{ contains(vars.CI_COVERAGE_RUNNER_LABELS || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '50' || '4' }}
      UV_HTTP_TIMEOUT: ${{ contains(vars.CI_COVERAGE_RUNNER_LABELS || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '30' || '60' }}
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        uid:
          - nonroot
        shard: [1, 2, 3, 4]
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare workspace (git trust, mise trust + install, uv sync)
        run: |
          git config --global --add safe.directory '*'
          mise trust
          mise install
          uv sync --all-groups

      # Same narrow non-root route as check-per-file-coverage below.
      - name: Prepare non-root leg (open baked toolchain to uid 1000)
        if: matrix.uid == 'nonroot'
        run: |
          chmod 0755 /root
          find /root/.config /root/.local \( ! -perm -o+r -o \( -type d ! -perm -o+x \) \) -exec chmod a+rX {} +
          mkdir -p /home/ci
          # bd-ib-vnmph2: give uid 1000 ownership with a targeted pass, as
          # bd-ib-uuatg4 did for modes: change ONLY the entries uid 1000 does not
          # already own. find visits its starting points too, so /home/ci and the
          # workspace root themselves are covered. -h changes a symlink itself,
          # as chown -R does, and never follows one out of the tree.
          find /home/ci "$GITHUB_WORKSPACE" \( ! -user 1000 -o ! -group 1000 \) -exec chown -h 1000:1000 {} +
          setpriv --reuid=1000 --regid=1000 --clear-groups \
            env HOME=/home/ci git config --global --add safe.directory '*'
          # bd-ib-rpit5z: point the uid-1000 uv invocations at the pool's warm
          # seed /__w/_warm/uv when uid 1000 can write every directory in it, and
          # otherwise fall back to the private cold cache with a warning, never a
          # job failure. The seed is no longer root-owned hardlinks into the fleet
          # generation (livespec-dev-tooling-hmv2bo made it a private reflink copy
          # per work volume), and hosted runners have no seed at all.
          nonroot_uv_cache=/home/ci/.cache/uv
          if [ -d /__w/_warm/uv ]; then
            # The provisioner seeds the volume as root (`cp -a --reflink`), so the
            # seed arrives root-owned and uid 1000 cannot write it (measured on
            # livespec-orchestrator-beads-fabro#4453, 2026-11-05). It is this
            # pod's OWN reflink copy, reachable from no other pod (hook template,
            # header item 2), so handing it to uid 1000 cannot touch the fleet
            # generation. The pass is targeted: it changes only entries uid 1000
            # does not already own, and it is metadata only.
            find /__w/_warm/uv \( ! -user 1000 -o ! -group 1000 \) -exec chown -h 1000:1000 {} + || true
            unwritable=$(setpriv --reuid=1000 --regid=1000 --clear-groups \
              find /__w/_warm/uv -type d ! -writable -print -quit 2>&1) || unwritable="${unwritable:-find exited non-zero}"
            if [ -z "$unwritable" ]; then
              nonroot_uv_cache=/__w/_warm/uv
            else
              echo "::warning::bd-ib-rpit5z: uid 1000 cannot write the warm uv seed (${unwritable}); this leg uses the cold private cache"
            fi
          fi
          echo "NONROOT_UV_CACHE_DIR=${nonroot_uv_cache}" >> "$GITHUB_ENV"

      - name: just coverage-shard ${{ matrix.shard }} 4 (uid 1000)
        if: matrix.uid == 'nonroot'
        run: |
          setpriv --reuid=1000 --regid=1000 --clear-groups \
            env HOME=/home/ci \
                UV_CACHE_DIR="$NONROOT_UV_CACHE_DIR" \
                MISE_DATA_DIR=/root/.local/share/mise \
                MISE_GLOBAL_CONFIG_FILE=/root/.config/mise/config.toml \
