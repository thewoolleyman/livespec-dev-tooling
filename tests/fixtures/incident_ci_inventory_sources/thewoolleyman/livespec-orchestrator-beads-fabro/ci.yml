      - name: Publish the flake-retry records for the host-side reader
        if: ${{ !cancelled() }}
        uses: thewoolleyman/livespec-dev-tooling/.github/actions/publish-flake-retries@v1.205.0
        with:
          suffix: shard-${{ matrix.uid }}-${{ matrix.shard }}

      # include-hidden-files is REQUIRED: the data file is a dotfile.
      - name: Publish this shard's coverage data for check-per-file-coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.uid }}-${{ matrix.shard }}
          path: .coverage-shards/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  check-per-file-coverage:
    name: check-per-file-coverage (${{ matrix.uid }})
    # bd-ib-m26pql: combines the shards' coverage instead of running the suite.
    needs: [check-per-file-coverage-shard]
    # bd-ib-uxv5al: the coverage pair routes through its OWN variable so it can
    # stay on k3s while CI_RUNNER_LABELS sends every other job to hosted runners
    # (a hosted runner ran this suite at 55+ min against a 17.5 min k3s median).
    # Unset, it falls through to CI_RUNNER_LABELS, so nothing moves.
    runs-on: ${{ fromJSON(vars.CI_COVERAGE_RUNNER_LABELS || vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
