# reusable-release-dispatch.yml — fan-out dispatcher for sibling releases.
#
# Authority: SPECIFICATION/contracts.md §"Cross-repo coordination
#   automation surface" — specifically the §"reusable-release-dispatch.yml"
#   subsection (inputs/outputs/behavior), §"Sibling discovery"
#   (gh search by `livespec-sibling` topic), §"`repository_dispatch`
#   payload contract" (event_type + client_payload shape), §"GitHub
#   App auth model" (App-token over GITHUB_TOKEN, three required
#   permissions, `actions/create-github-app-token@v1`), and
#   §"Soft-fail semantics" (404 from any sibling does NOT fail the
#   dispatch loop).
#
# Dispatch model: invoked by each sibling's own `release-dispatch.yml`
# shim on `on: release: types: [published]`. The shim passes through
# `source_repo`, `tag`, and `release_url` plus `secrets: inherit`; this
# workflow then reads the member list from livespec core's
# .livespec-fleet-manifest.jsonc (fetched from livespec master at run time, per
# livespec SPECIFICATION/non-functional-requirements.md §"Fleet
# membership contract" — the `livespec-sibling` topic is demoted to a
# discovery safety net enforced by the fleet-conformance check),
# excludes the publishing repo, and fires one `repository_dispatch`
# per remaining member.
#
# Preflight as a PER-MEMBER FILTER (livespec-f73t Slice 2b): the
# fleet-preflight job runs the central fleet-conformance check BEFORE
# any dispatch goes out; a member failing its own obligations is
# EXCLUDED from the dispatch matrix and named loudly (annotation +
# step summary with its failing rows), while every conformant member
# still receives its dispatch. Structural failures (conformance crash,
# missing/malformed verdict artifact, manifest/verdict drift) stay
# job-red and halt the whole fan-out, fail-closed. No-circular-gating
# holds: every conformance finding is fixable by wire-fleet-member / a
# member-repo PR / a manifest PR on livespec — none of which depend on
# a dev-tooling release or on this fan-out running.
#
# Consumers invoke this workflow from their own `release-dispatch.yml`
# shim via
# `uses: thewoolleyman/livespec-dev-tooling/.github/workflows/reusable-release-dispatch.yml@vX.Y.Z`
# (with `with: { source_repo: ..., tag: ..., release_url: ... }` and
# `secrets: inherit`).
#
# Inputs:
#   source_repo (required) — publishing repository's short name
#     (e.g., `livespec-runtime`). Excluded from the dispatch fan-out
#     so a release does not echo back to itself.
#   tag (required) — published release tag (e.g., `v0.3.0`). Threaded
#     into each `repository_dispatch` payload.
#   release_url (required) — GitHub release page URL; included in the
#     dispatch payload for downstream PR-description traceability.
#
# Outputs: none. Each dispatched sibling reports its own bump-PR
#   workflow status via its own CI; this dispatcher only emits a
#   workflow annotation per soft-failed sibling.
#
# Secrets (inherited via `secrets: inherit` from the consumer shim):
#   APP_ID — GitHub App's numeric ID (org/user-level secret).
#   APP_PRIVATE_KEY — GitHub App's private key PEM. Tokens minted via
#     `actions/create-github-app-token@v1` carry the App's three
#     required permissions (`contents: write`, `pull-requests: write`,
#     `metadata: read`) per the spec §"GitHub App auth model".
#
# Soft-fail semantics: a 404 from any sibling dispatch surfaces as a
#   GitHub workflow annotation (`::warning`) and does NOT fail the
#   workflow. Other 4xx/5xx responses fail the matrix entry for that
#   sibling but do not cascade — `fail-fast: false` keeps every other
#   sibling reachable.

name: reusable-release-dispatch

on:
  workflow_call:
    inputs:
      source_repo:
        description: Short name of the publishing repository (excluded from the dispatch fan-out).
        required: true
        type: string
      tag:
        description: Published release tag (threaded into every repository_dispatch payload).
        required: true
        type: string
      release_url:
        description: GitHub release page URL (included in payload for traceability).
        required: true
        type: string
    secrets:
      APP_ID:
        description: GitHub App numeric ID for the bump-PR App.
        required: true
      APP_PRIVATE_KEY:
        description: GitHub App private key PEM for the bump-PR App.
        required: true

jobs:
  discover-siblings:
    name: discover-siblings
    runs-on: ubuntu-latest
    outputs:
      siblings: ${{ steps.discover.outputs.siblings }}
    steps:
      - name: Read fleet manifest from livespec master
        id: discover
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # Per livespec §"Fleet membership contract", the fan-out MUST
          # read the manifest fetched from livespec master at run time
          # (topic search demoted to the conformance check's discovery
          # safety net). livespec is PUBLIC, so fetch the raw file from
          # raw.githubusercontent.com — no auth, always the raw bytes.
          # This deliberately replaces an authenticated `gh api
          # .../contents -H Accept: raw` read that, under this workflow's
          # App installation token, returned content lacking the
          # fleet/members keys on the first post-`members`->`fleet` rename
          # fan-out (livespec-2rab: jq saw `null` though the identical
          # pipeline worked with a normal token and the prior release
          # fan-out succeeded). The raw read removes the token/media-type
          # variable entirely. The manifest carries full-line // comments
          # only, so a line-wise strip yields plain JSON for jq.
          manifest=$(curl -fsSL \
            "https://raw.githubusercontent.com/$OWNER/livespec/master/.livespec-fleet-manifest.jsonc" \
            | grep -v '^[[:space:]]*//')
          # Exclude the publishing repo from the dispatch fan-out so the
          # release does not echo back to itself. Keep the {name: ...}
          # element shape the dispatch matrix consumes. Read the fleet
          # array from the `fleet` key, falling back to the legacy
          # `members` key (the required-key rename migration seam). On a
          # parse failure, echo the fetched head so the next regression is
          # diagnosable from the run log instead of a bare jq null error.
          if ! siblings=$(echo "$manifest" | jq -ce \
            "[(.fleet // .members)[].repo | select(. != \"$SOURCE_REPO\") | {name: .}]"); then
            echo "::error::fleet manifest did not parse into a fleet/members array — fetched head:" >&2
            echo "$manifest" | head -20 >&2
            exit 1
          fi
          echo "siblings=$siblings" >> "$GITHUB_OUTPUT"
          echo "::notice::manifest lists $(echo "$siblings" | jq 'length') member(s) (excluding $SOURCE_REPO)"

  # PREFLIGHT AS A PER-MEMBER FILTER (livespec-f73t Slice 2b): the
  # central fleet-conformance check still runs BEFORE any dispatch goes
  # out, but a member failing its own obligations is now EXCLUDED from
  # the dispatch matrix (loudly — a `::warning::` annotation plus a
  # step-summary row naming its failing rows, per the livespec-bmxs
  # silent-omission hazard) instead of halting propagation to every
  # conformant member. Blocking is PER-MEMBER: exclusion is how a
  # covered member's failure blocks it (no lever, no warn-only mode).
  # STRUCTURAL failures stay job-red and halt the whole fan-out,
  # fail-closed: a conformance exit other than 0/4, a missing or
  # malformed verdict artifact, or a sibling with no verdict entry.
  # Wiring fixes never depend on this fan-out (no-circular-gating):
  # wire-fleet-member is operator-run, shim PRs land via member CI,
  # manifest changes land via livespec.
  fleet-preflight:
    name: fleet-conformance preflight (per-member filter)
    runs-on: ubuntu-latest
    needs: [discover-siblings]
    outputs:
      filtered_siblings: ${{ steps.filter.outputs.filtered_siblings }}
    steps:
      - name: Checkout livespec-dev-tooling master
        uses: actions/checkout@v5
        with:
          # workflow_call runs in the CALLER repo's context; the check
          # ships from livespec-dev-tooling, so check out that repo
          # explicitly at master.
          repository: ${{ github.repository_owner }}/livespec-dev-tooling
          ref: master

      - name: Mint App installation token (fleet-wide reads)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Install pinned binaries via mise
        uses: jdx/mise-action@v4

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: just check-fleet-conformance (per-member verdicts)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LIVESPEC_RUN_FLEET_CONFORMANCE: "true"
        run: |
          # Exit 0: all members conformant. Exit 4 with a verdict
          # artifact THAT NAMES A NON-CONFORMANT MEMBER: per-member
          # findings — the filter step below excludes those members
          # (livespec-f73t: a FILTER on the sibling set, not a GATE on
          # the whole job).
          #
          # Exit 4 with an ALL-CONFORMANT artifact is a finding
          # attributable to NO member — the discovery sweep's
          # unregistered fleet-shaped repo, or a blind row. Those never
          # enter a member's verdict, so the filter would exclude nobody
          # and demote the finding to a log line. That is the fail-loud
          # regression livespec-dev-tooling-jeqp closes: such an exit 4
          # is STRUCTURAL and stays red, exactly as the pre-filter gate
          # did. Anything else, or exit 4 with no artifact, is likewise
          # structural. Fail closed, no lever.
          ec=0
          just check-fleet-conformance --emit-member-verdicts member-verdicts.json || ec=$?
          if [ "$ec" -eq 0 ]; then exit 0; fi
          if [ "$ec" -eq 4 ] && [ -s member-verdicts.json ] \
             && jq -e 'any(.[]; .conformant == false)' member-verdicts.json >/dev/null; then
            echo "::notice::conformance reported per-member findings; the dispatch matrix will be filtered (each excluded member is annotated by the filter step)"
            exit 0
          fi
          exit "$ec"

      - name: Filter dispatch matrix by per-member verdicts
        id: filter
        env:
          SIBLINGS: ${{ needs.discover-siblings.outputs.siblings }}
        run: |
          set -euo pipefail
          printf '%s' "$SIBLINGS" > discovered-siblings.json
          just filter-dispatch-matrix \
            --verdicts member-verdicts.json \
            --siblings discovered-siblings.json \
            --filtered-out filtered-siblings.json \
            --exclusions-out exclusions.json
          echo "filtered_siblings=$(jq -c . filtered-siblings.json)" >> "$GITHUB_OUTPUT"
          if [ "$(jq 'length' exclusions.json)" -gt 0 ]; then
            {
              echo "## Release-dispatch exclusions (non-conformant members)"
              jq -r '.[] | "- **\(.member)** — failing rows: \(.failing_rows | join(", "))"' exclusions.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  dispatch:
    name: dispatch ${{ matrix.sibling.name }}
    needs: [discover-siblings, fleet-preflight]
    if: needs.fleet-preflight.outputs.filtered_siblings != '[]' && needs.fleet-preflight.outputs.filtered_siblings != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sibling: ${{ fromJSON(needs.fleet-preflight.outputs.filtered_siblings) }}
    steps:
      - name: Mint App token (contents+PRs write for dispatch)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.sibling.name }}

      - name: gh api repository_dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          SIBLING: ${{ matrix.sibling.name }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          TAG: ${{ inputs.tag }}
          RELEASE_URL: ${{ inputs.release_url }}
        run: |
          set -uo pipefail
          # Payload shape per §"`repository_dispatch` payload contract" —
          # event_type fixed at "sibling-released"; client_payload carries
          # source_repo, tag, release_url.
          payload=$(jq -nc \
            --arg source_repo "$SOURCE_REPO" \
            --arg tag "$TAG" \
            --arg release_url "$RELEASE_URL" \
            '{event_type: "sibling-released", client_payload: {source_repo: $source_repo, tag: $tag, release_url: $release_url}}')
          http_status=$(echo "$payload" | gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$OWNER/$SIBLING/dispatches" \
            --input - \
            -i 2>&1 | head -1 | awk '{print $2}' || true)
          # gh's --input - / --silent combo doesn't surface http status on
          # the happy path; we capture the first response header line above
          # and inspect it. On any failure path, fall back to a second call
          # to inspect the explicit status code.
          rc=$?
          if [[ "$rc" -ne 0 ]]; then
            # Soft-fail per §"Soft-fail semantics": a 404 (App not
            # installed on this sibling, repo missing) annotates only.
            # Other 4xx/5xx fail this matrix entry but do not cascade
            # to other siblings (fail-fast: false on the matrix).
            if [[ "$http_status" == "404" ]]; then
              echo "::warning::sibling $SIBLING returned 404 (App not installed?); soft-fail per spec §Soft-fail semantics"
              exit 0
            fi
            echo "::error::sibling $SIBLING repository_dispatch failed (http_status=$http_status, rc=$rc)"
            exit 1
          fi
          echo "::notice::dispatched sibling-released to $SIBLING (tag=$TAG)"
