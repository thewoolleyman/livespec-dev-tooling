# Per-target matrix CI for livespec-dev-tooling.
#
# Authority: livespec/SPECIFICATION/contracts.md
#   §"Pre-commit step ordering" (c)-(d) — zero-py subsetting:
#   master pushes + merge_group events always run the full aggregate
#   (merge-queue safety net); pull_request events skip Python-code
#   checks when the changeset contains zero .py files.
#
# Authority: livespec/SPECIFICATION/non-functional-requirements.md
#   §"Toolchain pins" — direct tool invocations (ruff, pyright,
#   pytest, python3) in `run:` lines are forbidden; every step
#   delegates to `just <target>`.
#
# The Python-code matrix carries the tool-backed checks (lint,
# format, types, coverage). The metadata matrix carries the
# repo-metadata checks (aggregate-completeness, the primary-checkout
# commit-refuse-hook gate, and the tool-backed-check completeness
# meta-check). As Phase G.4 of epic li-fgqgnk migrates livespec-core's
# dev-tooling/checks/ scripts into livespec_dev_tooling/checks/,
# add the corresponding `check-<slug>` target to the appropriate
# matrix and to branch protection's required-status-checks list.

name: CI

# uv occasionally fails when the PyPI file CDN (files.pythonhosted.org)
# drops a wheel download mid-stream ("broken pipe"). UV_HTTP_RETRIES
# makes uv retry the fetch in-process instead of failing the job.
# Combined with the ~/.cache/uv actions/cache step (keyed on uv.lock)
# every uv-sync job uses below, an unchanged lock installs from cache
# and never contacts PyPI at all.
env:
  UV_HTTP_RETRIES: "5"

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

jobs:
  setup:
    name: detect-py-changes
    runs-on: ubuntu-latest
    outputs:
      py_changed: ${{ steps.detect.outputs.py_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need the base ref reachable for the PR diff below.
          fetch-depth: 0

      - name: Detect Python file changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Full-depth fetch (checkout already set fetch-depth: 0) — a
            # shallow `--depth=1` fetch doesn't bring in commits prior to
            # the base ref tip, so `git diff origin/${BASE_REF}...HEAD`
            # would intermittently fail with "no merge base" when the
            # local clone's history didn't reach the divergence point.
            # Keep `|| true` as a fallback: when fetch fails (auth,
            # network) we still try the diff against whatever
            # origin/${BASE_REF} ref the checkout already populated.
            git fetch origin "$BASE_REF" || true
            changeset=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            if echo "$changeset" | grep -qE '\.py$'; then
              echo "py_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "py_changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "py_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # `setup` is the change-detection GATE only — it deliberately does
      # NO uv pre-warm. The check-python matrix jobs `needs: setup`, so
      # any work here sits on the critical path before the matrix can
      # start. Each check-python job already restores ~/.cache/uv itself
      # (keyed on uv.lock, with the `uv-${{ runner.os }}-` prefix
      # restore-key) and runs its own `uv sync`; check-metadata /
      # check-fleet-conformance don't `needs: setup` and likewise carry
      # their own restore. So on the common unchanged-lock run the cache
      # already exists and every job restores it in parallel with no PyPI
      # fetch. A serial pre-warm here would only help the first run after
      # a lock change — already bounded to the delta wheels by the prefix
      # restore-key — so it is not worth taxing every run's wall-clock.
      # See livespec-dev-tooling-7us.10 (archive/research/justcheck-performance).

  check-python:
    name: ${{ matrix.target }}
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - check-lint
          - check-format
          - check-coverage
          - check-types
    steps:
      # Per-step `if:` (not job-level) so each matrix entry still
      # reports a status check named `${{ matrix.target }}`.
      - name: Skip when no .py changes
        if: needs.setup.outputs.py_changed != 'true'
        run: echo "::notice::skipped ${{ matrix.target }} — no .py changes in this PR"

      - name: Checkout
        if: needs.setup.outputs.py_changed == 'true'
        uses: actions/checkout@v4

      - name: Install pinned binaries via mise
        if: needs.setup.outputs.py_changed == 'true'
        uses: jdx/mise-action@v2

      - name: Restore uv download cache
        if: needs.setup.outputs.py_changed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install Python dev deps via uv
        if: needs.setup.outputs.py_changed == 'true'
        run: uv sync --all-groups

      - name: just ${{ matrix.target }}
        if: needs.setup.outputs.py_changed == 'true'
        run: just ${{ matrix.target }}

  # Central fleet-membership conformance check (livespec v108 §"Fleet
  # membership contract") — its own job (not a matrix entry) so the
  # run lever and the App token are scoped to it alone. The App
  # installation token makes contents / topics / installation-coverage
  # readable across every fleet member; the admin-scoped rows (secret
  # names, branch protection) skip gracefully under this token and are
  # covered by operator-local `just check` runs (admin gh auth) and by
  # the scheduled fleet-conformance.yml + release fan-out preflight.
  check-fleet-conformance:
    name: check-fleet-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mint App installation token (fleet-wide reads)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Install pinned binaries via mise
        uses: jdx/mise-action@v2

      - name: Restore uv download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: just check-fleet-conformance
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LIVESPEC_RUN_FLEET_CONFORMANCE: "true"
        run: just check-fleet-conformance

  # Metadata matrix runs unconditionally to preserve the repo-metadata
  # safety net. check-aggregate-completeness is the wiring-completeness
  # gate added in epic li-univck Phase 1.4 (work-item li-ldtv03) —
  # verifies the justfile `check:` aggregate wires every canonical
  # slug emitted by `python -m livespec_dev_tooling.canonical_checks`
  # in alphabetical order. check-fabro-image-pin-lockstep fails when
  # any tool version baked into docker/fabro-sandbox/Dockerfile (ARG
  # pins) drifts from .mise.toml / .python-version — it runs
  # unconditionally because pin drift is repo-metadata, reachable
  # from zero-.py changesets. check-no-direct-destructive-cli greps the
  # agent-facing trees for direct destructive-default CLI invocations
  # (livespec/SPECIFICATION/non-functional-requirements.md
  # §"Destructive-default CLI wrapping") so a violation fails CI.
  # check-red-green-replay (no-arg) validates the COMMIT RANGE
  # origin/master..HEAD — every non-merge commit touching product impl
  # .py must carry EITHER the TDD-Red-*/TDD-Green-* pair shape OR the
  # TDD-Suite-Green-* green-verified shape, regardless of subject
  # prefix (work-item livespec-dev-tooling-eld + the 2026-06-11
  # green-verified correction). It runs unconditionally: on zero-.py
  # PRs the range carries no product .py and trivially passes; on
  # master pushes the range is empty.
  check-metadata:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - check-aggregate-completeness
          - check-fabro-image-pin-lockstep
          - check-no-direct-destructive-cli
          - check-partition-completeness
          - check-primary-checkout-commit-refuse-hook-installed
          - check-red-green-replay
          - check-tool-backed-check-completeness
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for ALL matrix entries: the
          # check-red-green-replay range validation enumerates
          # origin/master..HEAD and needs origin/master plus the merge
          # base in the clone — a fetch-depth: 1 checkout would make
          # the base unresolvable and fail the check actionably (it
          # never silently passes). Cheap for this repo; harmless for
          # the other metadata entries.
          fetch-depth: 0

      # The primary-checkout-commit-refuse-hook-installed check
      # verifies the canonical livespec commit-refuse hook is
      # installed at `.git/hooks/pre-commit` AND `.git/hooks/pre-push`
      # per livespec/SPECIFICATION/non-functional-requirements.md
      # §"Primary-checkout commit-refuse hook" and §"Commit-refuse
      # hook bootstrap procedure". `actions/checkout` clones a fresh
      # working tree with no bootstrap step run; invoking the canonical
      # installer module here satisfies the invariant — the installer is
      # the single source of truth for the structural body (it needs only
      # the stdlib + the in-package vendored structlog, so it runs on the
      # runner's system python3 before the mise/uv setup steps below).
      # Only the check-primary-checkout-commit-refuse-hook-installed
      # matrix entry needs this — other check-metadata entries are
      # unaffected by hook installation.
      - name: Install canonical commit-refuse hook (satisfy invariant)
        if: matrix.target == 'check-primary-checkout-commit-refuse-hook-installed'
        run: python3 -m livespec_dev_tooling.install_commit_refuse_hooks

      - name: Install pinned binaries via mise
        uses: jdx/mise-action@v2

      - name: Restore uv download cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: just ${{ matrix.target }}
        run: just ${{ matrix.target }}

  # Closed-loop CI-telemetry export — mirrors the reference landed in
  # livespec CORE (PR #477, commit b1e875d). Runs only on master pushes
  # and merge_group events (never PRs, so it adds no PR-feedback latency).
  # `needs:` lists EVERY top-level job above so the export runs after the
  # whole matrix; `gh run view` then reads ALL jobs that ran in the run
  # (including each reusable-workflow job) and emits one `ci.run` root span
  # plus one `ci.job.<name>` child per completed job to Honeycomb. The job
  # FAILS if Honeycomb does not accept the spans — a broken telemetry
  # pipeline cannot die silently. `!cancelled()` lets the export run even
  # when an upstream check failed (so red runs are captured too).
  export-telemetry:
    name: export-telemetry
    needs: [setup, check-python, check-fleet-conformance, check-metadata]
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'merge_group') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export CI run telemetry to Honeycomb (closed-loop verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HONEYCOMB_GITHUB_CI_INGEST_KEY_LIVESPEC: ${{ secrets.HONEYCOMB_GITHUB_CI_INGEST_KEY_LIVESPEC }}
        run: bash .github/scripts/export-ci-telemetry.sh
