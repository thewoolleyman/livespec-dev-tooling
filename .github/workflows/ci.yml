# Per-target matrix CI for livespec-dev-tooling.
#
# Authority: livespec/SPECIFICATION/contracts.md
#   §"Pre-commit step ordering" (c)-(d) — zero-py subsetting:
#   master pushes always run the full aggregate; pull_request events
#   skip Python-code checks when the changeset contains zero .py
#   files. (The merge_group arm of this rule is inert here — no merge
#   queue is configured for this repo, so the trigger was dropped; see
#   the `on:` block below.)
#
# Authority: livespec/SPECIFICATION/non-functional-requirements.md
#   §"Toolchain pins" — direct tool invocations (ruff, pyright,
#   pytest, python3) in `run:` lines are forbidden; every step
#   delegates to `just <target>`.
#
# The Python-code matrix carries the tool-backed checks (lint,
# format, types, coverage). The metadata matrix carries the
# repo-metadata checks (aggregate-completeness, the primary-checkout
# commit-refuse-hook gate, and the tool-backed-check completeness
# meta-check). As Phase G.4 of epic li-fgqgnk migrates livespec-core's
# dev-tooling/checks/ scripts into livespec_dev_tooling/checks/,
# add the corresponding `check-<slug>` target to the appropriate
# matrix and to branch protection's required-status-checks list.
#
# The two check matrices run in the SAME baked image the Fabro sandbox uses,
# on the local self-hosted runner — so "green in CI" and "green in sandbox"
# are the same environment (livespec plan/fabro-ci-image-factoring). Their
# runs-on resolves from the repo variable CI_RUNNER_LABELS, defaulting inline
# to ubuntu-latest when it is unset, per SPECIFICATION/constraints.md
# §"CI matrix shape". setup, check-fleet-conformance, export-telemetry and
# ci-green stay ubuntu-latest — see each job for why.
#
# The fallback literal is repeated inline at each runs-on rather than resolved
# once into a job output, because check-self-hosted-routing parses runs-on
# values STATICALLY: routing hidden behind `needs.<job>.outputs.*` is invisible
# to it. The fallback MUST name hosted capacity so that deleting or emptying
# the variable leaves the merge gate on capacity that is always present.
#
# Reverting to hosted is MANUAL: set CI_RUNNER_LABELS back to
# '["ubuntu-latest"]' (or delete it). There is deliberately no automatic
# health-probe failover. The two-probe router this repo used to carry
# (reusable-ci-runner-router.yml + .github/actions/ci-runner-health) was
# retired because it cannot work against ARC scale sets: ARC gha-runner-scale-set
# runners register with an EMPTY label array, so a label-subset probe never
# matches them, and the sets run min-runners 0, so an idle set has zero
# registered runners by design. See livespec-s43svm.23.

name: CI

# uv occasionally fails when the PyPI file CDN (files.pythonhosted.org)
# drops a wheel download mid-stream ("broken pipe"). UV_HTTP_RETRIES
# makes uv retry the fetch in-process instead of failing the job. On the
# self-hosted lane the moved jobs' `uv sync` hits the runner's persistent
# ~/.cache/uv (NOT actions/cache, which this cutover deleted from them), so
# an unchanged lock installs from cache and never contacts PyPI at all.
#
# mise reaches the SAME class of CDN (GitHub releases) for its tool binaries
# and fails identically — observed 2026-08-13 on `shellcheck`, which reddened
# this repo's own master. mise's own default is `http_retries = 0` — one
# attempt, no retry — so the lesson already learned for uv above had to be
# spelled out again here.
env:
  UV_HTTP_RETRIES: "5"
  MISE_HTTP_RETRIES: "5"
  # uv's own concurrent-downloads default is 50 in-flight fetches PER uv
  # invocation (docs.astral.sh/uv/reference/settings/#concurrent-downloads).
  # The self-hosted pool runs many job slots concurrently on ONE host, so a
  # cold-cache moment (fresh slots, or a lockfile bump) can open thousands of
  # simultaneous connections to files.pythonhosted.org from a single shared
  # uplink -- the cause of the "operation timed out" PyPI fetch failures that
  # have red-flagged gating CI on the pool (livespec-s43svm.13, and the
  # recurrence livespec-s43svm.31 that brought this variable here). Capping
  # per-job concurrency on the self-hosted lane trades a little per-job fetch
  # latency for bounding the HOST-WIDE aggregate connection count; the hosted
  # lane's fully-isolated, independent-network-path runners never see this
  # contention, so it stays at uv's own default there. UV_HTTP_TIMEOUT is
  # bumped alongside it on the self-hosted lane, since a still-congested
  # transfer is more likely to need longer than the 30s default even at
  # reduced concurrency.
  #
  # The `|| '["ubuntu-latest"]'` default carries the same fail-closed property
  # as the runs-on fallbacks in this file and MUST stay in lockstep with them.
  UV_CONCURRENT_DOWNLOADS: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '50' || '4' }}
  UV_HTTP_TIMEOUT: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && '30' || '60' }}
# merge_group is deliberately ABSENT: no merge queue is configured for this
# repo (verified live — zero rulesets, required_merge_queue: null; branch
# protection requires only ci-green). Keeping the vestigial trigger would be
# exactly the routing hole the trusted-event audit forbids, since merge_group
# is not a fork-gated event and the matrices below are self-hosted. Re-add it
# WITH hosted routing only if a merge queue is adopted.
on:
  pull_request:
  push:
    branches: [master]

jobs:
  setup:
    name: detect-py-changes
    runs-on: ubuntu-latest
    outputs:
      py_changed: ${{ steps.detect.outputs.py_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Need the base ref reachable for the PR diff below.
          fetch-depth: 0

      - name: Detect Python file changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Full-depth fetch (checkout already set fetch-depth: 0) — a
            # shallow `--depth=1` fetch doesn't bring in commits prior to
            # the base ref tip, so `git diff origin/${BASE_REF}...HEAD`
            # would intermittently fail with "no merge base" when the
            # local clone's history didn't reach the divergence point.
            # Keep `|| true` as a fallback: when fetch fails (auth,
            # network) we still try the diff against whatever
            # origin/${BASE_REF} ref the checkout already populated.
            git fetch origin "$BASE_REF" || true
            changeset=$(git diff --name-only "origin/${BASE_REF}...HEAD")
            if echo "$changeset" | grep -qE '\.py$'; then
              echo "py_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "py_changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "py_changed=true" >> "$GITHUB_OUTPUT"
          fi

      # `setup` is the change-detection GATE only — it deliberately does
      # NO uv pre-warm. The check-python matrix jobs `needs: setup`, so
      # any work here sits on the critical path before the matrix can
      # start. Each check-python job already restores ~/.cache/uv itself
      # (keyed on uv.lock, with the `uv-${{ runner.os }}-` prefix
      # restore-key) and runs its own `uv sync`; check-metadata /
      # check-fleet-conformance don't `needs: setup` and likewise carry
      # their own restore. So on the common unchanged-lock run the cache
      # already exists and every job restores it in parallel with no PyPI
      # fetch. A serial pre-warm here would only help the first run after
      # a lock change — already bounded to the delta wheels by the prefix
      # restore-key — so it is not worth taxing every run's wall-clock.
      # See livespec-dev-tooling-7us.10 (archive/research/justcheck-performance).

  check-python:
    name: ${{ matrix.target }}
    needs: setup
    # The variable holds exactly one complete hosted or self-hosted label
    # set. GitHub does not fall back when a self-hosted label set has no match.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.33.0
    env:
      # RUNNER_ENVIRONMENT does not propagate into container jobs. Keep the
      # parallelism policy derived from the same variable the routing reads.
      LIVESPEC_CI_LANE: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && 'hosted' || 'local' }}
      # The image installs the pinned tools under /root (build-time HOME), but
      # container-hooks run steps with a DIFFERENT HOME — so mise's default data
      # dir ($HOME/.local/share/mise) is empty and `mise install` would RE-fetch
      # every tool. At matrix scale that means dozens of concurrent UNauthed
      # GitHub-API installs, which blow the anonymous rate limit and red the run
      # (proven live on livespec's cutover). Point mise at the baked data dir so
      # `mise install` is a true no-op — no downloads, no API calls.
      MISE_DATA_DIR: /root/.local/share/mise
      # A missing shim must fail fast, never busy-loop on auto-install.
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      # Authenticate any residual GitHub-API call with the per-run,
      # auto-revoked, read-scoped Actions token (github.token — NOT a Kind-2
      # secret). MISE_DATA_DIR already makes mise call nothing; this is
      # defense-in-depth against anonymous API limits.
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      # Batched-CI shape (work-item livespec-dev-tooling-yilyxr.2): only the
      # WALL-TIME-DOMINANT targets keep their own matrix leg (each runs its
      # own suite / full pyright pass); every cheap .py-scanning target moved
      # to the single check-python-batch job below, which pays the ~20s
      # container setup ONCE instead of per target. Honeycomb baseline: the
      # per-job setup tax across the fleet's one-job-per-check matrices was
      # ~2,237 CI-hours per 14d, dominated by sub-second checks.
      matrix:
        target:
          # The coverage pair moved to its own producer/consumer job chain
          # below (work-item livespec-dev-tooling-yilyxr.2 extension):
          # check-per-file-coverage runs the suite once and hands its
          # .coverage to check-coverage, halving the pair's CI compute.
          - check-types
          # check-lint / check-format are sub-minute, but the armed
          # check-tool-backed-check-completeness meta-check requires every
          # tool-backed slug to be a LITERAL matrix member (proven live on
          # this branch's first run: failure_mode=missing_from_ci for
          # exactly these two when they rode the batch), so they keep
          # their own legs.
          - check-lint
          - check-format
    steps:
      # Per-step `if:` (not job-level) so each matrix entry still
      # reports a status check named `${{ matrix.target }}`.
      - name: Skip when no .py changes
        if: needs.setup.outputs.py_changed != 'true'
        run: echo "::notice::skipped ${{ matrix.target }} — no .py changes in this PR"

      - name: Checkout
        if: needs.setup.outputs.py_changed == 'true'
        uses: actions/checkout@v5

      # Hosted routing keeps the baked container but checks out as runner uid
      # 1001 while steps run git as ROOT → "dubious ownership" (exit 128). Trust
      # the workspace globally (HOME survives config.py's GIT_* scrub). No-op self-hosted.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        if: needs.setup.outputs.py_changed == 'true'
        run: git config --global --add safe.directory '*'

      # Tools are baked into the image; `mise install` is a near-no-op that just
      # confirms the pinned versions. A fresh container does not TRUST the repo
      # .mise.toml, so `mise trust` is required for the shims to resolve.
      # (Replaces the GitHub-hosted mise-action install + the actions/cache uv
      # restore — the local runner's persistent ~/.cache/uv is the cache now.)
      - name: mise trust + install (baked tools — install is a near-no-op)
        if: needs.setup.outputs.py_changed == 'true'
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        if: needs.setup.outputs.py_changed == 'true'
        run: uv sync --all-groups

      - name: just ${{ matrix.target }}
        if: needs.setup.outputs.py_changed == 'true'
        run: |
          # pyright (check-types) shells out to `npm`; under the container-hooks
          # HOME the mise npm shim busy-loops (no node registered for that HOME).
          # Put the image's real node/npm — derived from the shim's own location,
          # never a hardcoded image path — ahead of the shim on PATH. Harmless
          # for the non-npm targets.
          shims_dir="$(dirname "$(command -v npm)")"
          node_bin="$(cd "$shims_dir/../installs/node/latest/bin" 2>/dev/null && pwd || ls -d "$shims_dir/../installs/node"/*/bin 2>/dev/null | head -1)"
          [ -n "$node_bin" ] && export PATH="$node_bin:$PATH"
          just ${{ matrix.target }}

  # Coverage-pair producer (work-item livespec-dev-tooling-yilyxr.2 extension,
  # unblocking yilyxr.1's CI-side metric): runs the ONE clean suite pass and
  # publishes the repo-root .coverage it produces. The consumer job below
  # (check-coverage) downloads it and reads it instead of running the suite a
  # second time — the same consume-once dedup `just check` already does
  # locally (scripts/just/check-coverage.sh), now effective in CI where the
  # two jobs used to run the full suite independently on separate runners.
  check-per-file-coverage:
    name: check-per-file-coverage
    needs: setup
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.33.0
    env:
      LIVESPEC_CI_LANE: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && 'hosted' || 'local' }}
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Per-step `if:` (not job-level) so the job still reports its status
      # check name when skipped — same pattern as the check-python matrix.
      - name: Skip when no .py changes
        if: needs.setup.outputs.py_changed != 'true'
        run: echo "::notice::skipped check-per-file-coverage — no .py changes in this PR"

      - name: Checkout
        if: needs.setup.outputs.py_changed == 'true'
        uses: actions/checkout@v5

      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        if: needs.setup.outputs.py_changed == 'true'
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        if: needs.setup.outputs.py_changed == 'true'
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        if: needs.setup.outputs.py_changed == 'true'
        run: uv sync --all-groups

      - name: just check-per-file-coverage
        if: needs.setup.outputs.py_changed == 'true'
        run: |
          # The full suite spawns `node` in some tests; under the
          # container-hooks HOME the mise node/npm shims busy-loop or miss
          # (no node registered for that HOME), so put the image's real
          # node bin — derived from the shim's own location — ahead of the
          # shims on PATH. Same block as the check-python matrix legs; its
          # absence here failed the suite with FileNotFoundError: 'node'
          # on the first post-#1504 master run.
          shims_dir="$(dirname "$(command -v npm)")"
          node_bin="$(cd "$shims_dir/../installs/node/latest/bin" 2>/dev/null && pwd || ls -d "$shims_dir/../installs/node"/*/bin 2>/dev/null | head -1)"
          [ -n "$node_bin" ] && export PATH="$node_bin:$PATH"
          just check-per-file-coverage

      # include-hidden-files is REQUIRED: upload-artifact@v4 excludes
      # dotfiles by default and .coverage is one; without it the upload
      # silently ships nothing and the consumer falls back to a full
      # duplicate suite run.
      - name: Publish .coverage for the check-coverage consumer
        if: needs.setup.outputs.py_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: .coverage
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # Coverage-pair consumer. Kept as a single-entry matrix (NOT a plain job)
  # because check-coverage is a tool-backed slug and
  # check-tool-backed-check-completeness requires every tool-backed slug to
  # be a LITERAL matrix.target member. `needs` the producer so the
  # downloaded .coverage is present and scripts/just/check-coverage.sh takes
  # its consume-once branch (read + delete, no suite run). Paths inside the
  # data file match because both jobs run in the same container workspace
  # mount. If the download ever regresses, the script's fallback branch runs
  # the clean suite standalone — slower, never wrong.
  check-coverage:
    name: ${{ matrix.target }}
    needs: [setup, check-per-file-coverage]
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.33.0
    env:
      LIVESPEC_CI_LANE: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && 'hosted' || 'local' }}
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      matrix:
        target:
          - check-coverage
    steps:
      - name: Skip when no .py changes
        if: needs.setup.outputs.py_changed != 'true'
        run: echo "::notice::skipped ${{ matrix.target }} — no .py changes in this PR"

      - name: Checkout
        if: needs.setup.outputs.py_changed == 'true'
        uses: actions/checkout@v5

      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        if: needs.setup.outputs.py_changed == 'true'
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        if: needs.setup.outputs.py_changed == 'true'
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        if: needs.setup.outputs.py_changed == 'true'
        run: uv sync --all-groups

      - name: Download the producer's .coverage
        if: needs.setup.outputs.py_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: coverage-data

      - name: just ${{ matrix.target }}
        if: needs.setup.outputs.py_changed == 'true'
        run: |
          # Node-PATH shim for the standalone-fallback branch only: the
          # normal path reads the downloaded .coverage without spawning
          # anything, but a missing artifact falls back to the full suite,
          # which spawns `node` in some tests (see the producer job).
          shims_dir="$(dirname "$(command -v npm)")"
          node_bin="$(cd "$shims_dir/../installs/node/latest/bin" 2>/dev/null && pwd || ls -d "$shims_dir/../installs/node"/*/bin 2>/dev/null | head -1)"
          [ -n "$node_bin" ] && export PATH="$node_bin:$PATH"
          just ${{ matrix.target }}

  # Central fleet-membership conformance check (livespec v108 §"Fleet
  # membership contract") — its own job (not a matrix entry) so the
  # run lever and the App token are scoped to it alone. The App
  # installation token makes contents / topics / installation-coverage
  # readable across every fleet member (its `ghs_` prefix claims the
  # `central-app` vantage, so the app-installation row evaluates here);
  # the admin-scoped rows (secret names, branch protection) are
  # out-of-vantage under this token and are enforced by the admin
  # world-gate lane (`just check-fleet-conformance-admin`) at pre-push
  # under the operator's own admin gh credentials.
  # Batched cheap .py-scanning checks (work-item livespec-dev-tooling-yilyxr.2):
  # one container setup for 24 sub-minute targets that each previously
  # paid it alone as a matrix leg. Failures are COLLECTED, not fail-fast,
  # preserving the old matrix's fail-fast:false all-targets report; each
  # target is invoked as a literal `just <slug>` line so
  # check-ci-matrix-completeness assertion (a) attributes every canonical
  # slug to this job, and the job runs `just` so assertion (b) requires it
  # in ci-green.needs. The wall-time-dominant targets stay in check-python.
  check-python-batch:
    name: check-python-batch
    needs: setup
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.33.0
    env:
      LIVESPEC_CI_LANE: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && 'hosted' || 'local' }}
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Skip when no .py changes
        if: needs.setup.outputs.py_changed != 'true'
        run: echo "::notice::skipped check-python-batch — no .py changes in this PR"

      - name: Checkout
        if: needs.setup.outputs.py_changed == 'true'
        uses: actions/checkout@v5

      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        if: needs.setup.outputs.py_changed == 'true'
        run: git config --global --add safe.directory '*'

      - name: mise trust + install (baked tools — install is a near-no-op)
        if: needs.setup.outputs.py_changed == 'true'
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        if: needs.setup.outputs.py_changed == 'true'
        run: uv sync --all-groups

      - name: Run the batched python checks
        if: needs.setup.outputs.py_changed == 'true'
        run: |
          failed=""
          just check-all-declared || failed="$failed check-all-declared"
          just check-assert-never-exhaustiveness || failed="$failed check-assert-never-exhaustiveness"
          just check-check-mutation || failed="$failed check-check-mutation"
          just check-file-lloc || failed="$failed check-file-lloc"
          just check-global-writes || failed="$failed check-global-writes"
          just check-keyword-only-args || failed="$failed check-keyword-only-args"
          just check-local-memory-drift-audit || failed="$failed check-local-memory-drift-audit"
          just check-main-guard || failed="$failed check-main-guard"
          just check-match-keyword-only || failed="$failed check-match-keyword-only"
          just check-newtype-domain-primitives || failed="$failed check-newtype-domain-primitives"
          just check-no-except-outside-io || failed="$failed check-no-except-outside-io"
          just check-no-inheritance || failed="$failed check-no-inheritance"
          just check-no-lloc-soft-warnings || failed="$failed check-no-lloc-soft-warnings"
          just check-no-raise-outside-io || failed="$failed check-no-raise-outside-io"
          just check-no-write-direct || failed="$failed check-no-write-direct"
          just check-pbt-coverage-pure-modules || failed="$failed check-pbt-coverage-pure-modules"
          just check-private-calls || failed="$failed check-private-calls"
          just check-public-api-result-typed || failed="$failed check-public-api-result-typed"
          just check-required-role-keys-declared || failed="$failed check-required-role-keys-declared"
          just check-rop-pipeline-shape || failed="$failed check-rop-pipeline-shape"
          just check-supervisor-discipline || failed="$failed check-supervisor-discipline"
          just check-tests-mirror-pairing || failed="$failed check-tests-mirror-pairing"
          just check-tests-no-subprocess-spawn || failed="$failed check-tests-no-subprocess-spawn"
          just check-wrapper-shape || failed="$failed check-wrapper-shape"
          if [ -n "$failed" ]; then
            echo "Failed targets:$failed"
            exit 1
          fi

  check-fleet-conformance:
    name: check-fleet-conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Wait for App installation rate budget and mint token (fleet-wide reads)
        id: app-token
        uses: ./.github/actions/github-rate-budget-token
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          min-core-remaining: "500"
          min-graphql-remaining: "1"

      - name: Install pinned binaries via mise
        uses: jdx/mise-action@v4

      - name: Restore uv download cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      # `--member-ci` declares this as the MEMBER leg: every member is still
      # evaluated and reported, but only THIS repo's violations affect the exit
      # status, per the 2026-07-21 ruling that a non-conforming member must fail
      # only its own CI. The fleet-level legs — the scheduled fleet-conformance.yml
      # sweep and the release fan-out preflight — deliberately omit the flag and
      # fail on ANY member, which is where a cross-member red belongs. Fleet view
      # is the DEFAULT so a new fleet-level caller that forgets to declare its
      # surface fails loudly rather than silently shrinking to a one-repo gate.
      # Not a severity lever: no obligation is relaxed and no row stops being
      # evaluated. `blind_rows` still fails here.
      - name: just check-fleet-conformance
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LIVESPEC_RUN_FLEET_CONFORMANCE: "true"
        run: just check-fleet-conformance --member-ci

  # Metadata matrix runs unconditionally to preserve the repo-metadata
  # safety net. check-aggregate-completeness is the wiring-completeness
  # gate added in epic li-univck Phase 1.4 (work-item li-ldtv03) —
  # verifies the justfile `check:` aggregate wires every canonical
  # slug emitted by `python -m livespec_dev_tooling.canonical_checks`
  # in alphabetical order. check-canonical-recipe-fidelity is the
  # anti-fork guard — it verifies every canonical `check-<slug>:` recipe
  # BODY invokes the pinned shared module
  # `python -m livespec_dev_tooling.checks.<module>`, closing the gap
  # check-aggregate-completeness (targets-array membership) and
  # check-tool-backed-check-completeness (four tool slugs) leave open;
  # it runs unconditionally because a repointed recipe is a
  # justfile-only, zero-.py changeset. check-fabro-image-pin-lockstep fails when
  # any tool version baked into docker/fabro-sandbox/Dockerfile (ARG
  # pins) drifts from .mise.toml / .python-version — it runs
  # unconditionally because pin drift is repo-metadata, reachable
  # from zero-.py changesets. check-no-direct-destructive-cli greps the
  # agent-facing trees for direct destructive-default CLI invocations
  # (livespec/SPECIFICATION/non-functional-requirements.md
  # §"Destructive-default CLI wrapping") so a violation fails CI.
  # check-red-green-replay (no-arg) validates the COMMIT RANGE
  # origin/master..HEAD — every non-merge commit touching product impl
  # .py must carry EITHER the TDD-Red-*/TDD-Green-* pair shape OR the
  # TDD-Suite-Green-* green-verified shape, regardless of subject
  # prefix (work-item livespec-dev-tooling-eld + the 2026-06-11
  # green-verified correction). It runs unconditionally: on zero-.py
  # PRs the range carries no product .py and trivially passes; on
  # master pushes the range is empty.
  check-metadata:
    name: ${{ matrix.target }}
    # The same single variable routes every ordinary gating target.
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.33.0
    env:
      LIVESPEC_CI_LANE: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && 'hosted' || 'local' }}
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        target:
          # Batched-CI shape (work-item livespec-dev-tooling-yilyxr.2): only
          # the two pytest-spawning, variable-duration metadata targets keep
          # their own matrix leg; every cheap repo-metadata target moved to
          # the single check-metadata-batch job below (one setup, not ~30).
          - check-red-green-replay
          - check-check-coverage-incremental
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history for ALL matrix entries: the
          # check-red-green-replay range validation enumerates
          # origin/master..HEAD and needs origin/master plus the merge
          # base in the clone — a fetch-depth: 1 checkout would make
          # the base unresolvable and fail the check actionably (it
          # never silently passes). Cheap for this repo; harmless for
          # the other metadata entries.
          fetch-depth: 0

      # Hosted routing keeps the baked container but checks out as runner uid
      # 1001 while steps run git as ROOT → "dubious ownership" (exit 128). Trust
      # the workspace globally (HOME survives config.py's GIT_* scrub). No-op self-hosted.
      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'


      # Tools are baked into the image; `mise install` is a near-no-op. A fresh
      # container does not TRUST the repo .mise.toml, so `mise trust` is required
      # for the shims to resolve. (Replaces the mise-action install + the
      # actions/cache uv restore — the runner's persistent ~/.cache/uv is the
      # cache now.)
      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: just ${{ matrix.target }}
        env:
          # Arm the CI-matrix drift guard (epic livespec-cf4bcu slice 5):
          # now that this repo's matrices + ci-green are complete, flip
          # check-ci-matrix-completeness from warn (exit 0) to FAIL (exit 4),
          # so any future canonical slug wired into `just check` but dropped
          # from CI reddens this leg instead of silently warning.
          # ⚠️ IT IS NOT HARMLESS FOR THE OTHER METADATA LEGS, and this comment
          # asserted that it was. Any leg that SPAWNS check-ci-matrix-completeness
          # reads this var transitively — `check-check-coverage-incremental` does,
          # whenever a change touches `ci_matrix_completeness.py` and its test file
          # enters the selection. That flipped 17 tests asserting exit 0 into exit 4
          # in CI while they passed locally. The tests now clear it explicitly
          # (`_AMBIENT_SEVERITY_VARS`); do not restore the "harmless" claim.
          LIVESPEC_FAIL_IF_CI_MATRIX_GAPS_EXIST: "true"
          # Arm the formatter-suppression guard (check-no-fmt-directives, a
          # check-metadata leg): flip it from warn (exit 0) to FAIL (exit 1)
          # so a `# fmt: off`/`on`/`skip` counter-shave in this mechanism
          # package's own first-party code reddens CI instead of silently
          # warning. This repo is clean, so the leg still exits 0; every
          # OTHER repo stays warn-only until it arms this lever in its own
          # PR. Harmless for the other metadata legs — they do not read it.
          LIVESPEC_FAIL_IF_FMT_DIRECTIVES_EXIST: "true"
        run: just ${{ matrix.target }}

  # Batched cheap repo-metadata checks (work-item livespec-dev-tooling-yilyxr.2):
  # one container setup for 30 sub-minute targets that each previously paid
  # it alone as a matrix leg. Failures are COLLECTED (matrix fail-fast:false
  # parity); every target is a literal `just <slug>` line so
  # check-ci-matrix-completeness assertion (a) sees each canonical slug, and
  # the job is gating so (b) requires it in ci-green.needs. The hook and
  # worktree-pack installers run UNCONDITIONALLY here because
  # check-primary-checkout-commit-refuse-hook-installed and
  # check-shell-quality both live in this batch (see the vacuous-pass record
  # of livespec-dev-tooling-9ywf for why the pack must be materialized).
  check-metadata-batch:
    name: check-metadata-batch
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    container:
      image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-v1.33.0
    env:
      LIVESPEC_CI_LANE: ${{ contains(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]', 'ubuntu') && 'hosted' || 'local' }}
      MISE_DATA_DIR: /root/.local/share/mise
      MISE_NOT_FOUND_AUTO_INSTALL: "0"
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: several batch members diff against origin/master
          # or read git metadata; cheap for this repo.
          fetch-depth: 0

      - name: Trust workspace for git (hosted container root-vs-checkout uid)
        run: git config --global --add safe.directory '*'

      - name: Install canonical commit-refuse hook (satisfy invariant)
        run: python3 -m livespec_dev_tooling.install_commit_refuse_hooks

      - name: Install canonical worktree pack (satisfy invariant)
        run: python3 -m livespec_dev_tooling.install_worktree_pack

      - name: mise trust + install (baked tools — install is a near-no-op)
        run: |
          mise trust
          mise install

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: Run the batched metadata checks
        env:
          # Same severity levers as the check-metadata matrix leg; see that
          # job's comment for the transitive-read caveat.
          LIVESPEC_FAIL_IF_CI_MATRIX_GAPS_EXIST: "true"
          LIVESPEC_FAIL_IF_FMT_DIRECTIVES_EXIST: "true"
        run: |
          failed=""
          just check-aggregate-completeness || failed="$failed check-aggregate-completeness"
          just check-agents-ai-references-resolve || failed="$failed check-agents-ai-references-resolve"
          just check-canonical-recipe-fidelity || failed="$failed check-canonical-recipe-fidelity"
          just check-check-tools || failed="$failed check-check-tools"
          just check-ci-matrix-completeness || failed="$failed check-ci-matrix-completeness"
          just check-claude-md-coverage || failed="$failed check-claude-md-coverage"
          just check-comment-line-anchors || failed="$failed check-comment-line-anchors"
          just check-commit-pairs-source-and-test || failed="$failed check-commit-pairs-source-and-test"
          just check-fabro-image-pin-lockstep || failed="$failed check-fabro-image-pin-lockstep"
          just check-fleet-marketplace-relative-sources || failed="$failed check-fleet-marketplace-relative-sources"
          just check-handoff-dispatch-routing || failed="$failed check-handoff-dispatch-routing"
          just check-heading-coverage || failed="$failed check-heading-coverage"
          just check-hook-trees-not-io-exempt || failed="$failed check-hook-trees-not-io-exempt"
          just check-no-direct-destructive-cli || failed="$failed check-no-direct-destructive-cli"
          just check-no-direct-tool-invocation || failed="$failed check-no-direct-tool-invocation"
          just check-no-fmt-directives || failed="$failed check-no-fmt-directives"
          just check-no-shadow-ledger-body-identical || failed="$failed check-no-shadow-ledger-body-identical"
          just check-no-shadow-ledger-body-typechecks || failed="$failed check-no-shadow-ledger-body-typechecks"
          just check-no-todo-registry || failed="$failed check-no-todo-registry"
          just check-partition-completeness || failed="$failed check-partition-completeness"
          just check-plan-anchor-declared || failed="$failed check-plan-anchor-declared"
          just check-plan-no-tombstone || failed="$failed check-plan-no-tombstone"
          just check-plugin-resolution || failed="$failed check-plugin-resolution"
          just check-primary-checkout-commit-refuse-hook-installed || failed="$failed check-primary-checkout-commit-refuse-hook-installed"
          just check-self-hosted-routing || failed="$failed check-self-hosted-routing"
          just check-self-hosted-uv-lane || failed="$failed check-self-hosted-uv-lane"
          just check-shell-quality || failed="$failed check-shell-quality"
          just check-skill-invocation-paths || failed="$failed check-skill-invocation-paths"
          just check-source-trees-scoped-to-consumer || failed="$failed check-source-trees-scoped-to-consumer"
          just check-tool-backed-check-completeness || failed="$failed check-tool-backed-check-completeness"
          just check-vendor-manifest || failed="$failed check-vendor-manifest"
          if [ -n "$failed" ]; then
            echo "Failed targets:$failed"
            exit 1
          fi

  # Closed-loop CI-telemetry export — mirrors the reference landed in
  # livespec CORE (PR #477, commit b1e875d). Runs only on master pushes
  # (never PRs, so it adds no PR-feedback latency; the merge_group arm went
  # away with that trigger — no merge queue is configured).
  # `needs:` lists EVERY top-level job above so the export runs after the
  # whole matrix; `gh run view` then reads ALL jobs that ran in the run
  # (including each reusable-workflow job) and emits one `ci.run` root span
  # plus one `ci.job.<name>` child per completed job to Honeycomb. The job
  # FAILS if Honeycomb does not accept the spans — a broken telemetry
  # pipeline cannot die silently. `!cancelled()` lets the export run even
  # when an upstream check failed (so red runs are captured too).
  export-telemetry:
    name: export-telemetry
    needs: [setup, check-python, check-per-file-coverage, check-coverage, check-python-batch, check-fleet-conformance, check-metadata, check-metadata-batch]
    if: ${{ !cancelled() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Export CI run telemetry to Honeycomb (closed-loop verified)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HONEYCOMB_GITHUB_CI_INGEST_KEY_LIVESPEC: ${{ secrets.HONEYCOMB_GITHUB_CI_INGEST_KEY_LIVESPEC }}
        run: bash .github/scripts/export-ci-telemetry.sh

  # fleet-ci-aggregate-coverage (epic livespec-cf4bcu) slice 5: the single
  # all-green gate job. It `needs:` every check-bearing job and fails if any
  # dependency failed or was cancelled — a pure GitHub-expression gate (no
  # external action, no direct tool invocation, so it satisfies
  # non-functional-requirements.md §"Toolchain pins"). Branch protection
  # requires ONLY this context, so one stable name gates the whole matrix and
  # never churns as checks are added. A SKIPPED dependency (e.g. the entire
  # check-python matrix on a zero-.py PR) is not a failure, so ci-green stays
  # green then. setup (detect-py-changes) and export-telemetry are NOT gates,
  # so they are intentionally absent from `needs:`.
  ci-green:
    name: ci-green
    needs: [check-python, check-per-file-coverage, check-coverage, check-python-batch, check-fleet-conformance, check-metadata, check-metadata-batch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required checks passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
