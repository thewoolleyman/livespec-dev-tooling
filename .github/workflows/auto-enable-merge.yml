# Auto-enable-merge workflow — set --auto --rebase on PRs from the
# user-or-agent identity allowlist, when not draft and not flagged
# do-not-merge. Eliminates the "agent opened a PR but forgot to
# `gh pr merge --auto --rebase` the user" failure mode (li-8f3,
# supersedes li-abl; original PR #78 reverted because GITHUB_TOKEN
# could not enable auto-merge — see li-8f3 description for the
# full diagnosis).
#
# Auth model:
#   - Uses a GitHub App installation token instead of GITHUB_TOKEN.
#   - actions/create-github-app-token@v3 mints a fresh token at
#     runtime (lasts ~1 hour, discarded after the run).
#   - The App's private key has no calendar expiration, so this
#     workflow never silently breaks on token expiry.
#   - Required repo secrets: APP_ID, APP_PRIVATE_KEY (managed via
#     `gh secret set`).
#
# Why an App instead of GITHUB_TOKEN: the GraphQL
# `enablePullRequestAutoMerge` mutation requires admin-level repo
# access that `github-actions[bot]` lacks regardless of declared
# `permissions:` scopes. Apps installed on the repo are granted
# the access by the install grant itself.
#
# Enable paths (ANY one qualifies), each still subject to the
# draft-skip and do-not-merge opt-out below:
#   - Author in the human allowlist:
#       - thewoolleyman — the user's own PRs and PRs opened by agents
#         acting via the user's PAT (Claude Code, etc., where the PR
#         author == the PAT owner).
#   - The fleet's OWN release-please App (author login
#     `livespec-pr-bot[bot]`) on a head branch whose name starts with
#     `release-please--`. The branch-shape guard scopes the App path to
#     release PRs, so the App cannot auto-enable-merge any other PR it
#     might author.
#
# Explicit opt-out paths (apply to BOTH enable paths):
#   - `--draft` PRs are skipped (the trigger only fires on
#     ready-for-review state).
#   - PRs labelled `do-not-merge` are skipped.
#
# Out of scope by design:
#   - EXTERNAL bot PRs (dependabot, future renovate) — author neither
#     in the human allowlist nor the fleet's release-please App.
#   - Future collaborator PRs — same gate.
#   - The codex-acp FRESHNESS-BUMP PR — and this exclusion is
#     LOAD-BEARING, not incidental. See below.
#
# DO NOT WIDEN THE ALLOWLIST WITHOUT READING THIS.
#
# The codex-acp factory gate (SPECIFICATION/contracts.md §"codex-acp
# factory gate") is fail-closed ONLY because nothing here enables
# auto-merge on its bump PR. That bump PR is opened by
# reusable-pin-freshness.yml with an App token, so its author is
# `livespec-pr-bot[bot]` and its head branch is
# `chore/freshness-bump-*` — which matches NEITHER enable path above:
# not the human allowlist, and not the App path (which is scoped to
# `release-please--*` branches). It therefore stays open until the LIVE
# golden-master gate proves the new codex-acp version works and turns
# auto-merge on itself.
#
# So: adding the bump PR's author to the human allowlist, or relaxing
# the `release-please--` branch-shape guard on the App path, would let
# an UNVERIFIED codex-acp version merge on green CI alone, silently
# defeating the factory gate. The gate is not a required check (it
# cannot be — GitHub scopes required checks to the base branch, which
# would deadlock every unrelated PR), so this exclusion is the only
# thing holding the property.
#
# Verified live 2026-07-14: a hand-made throwaway PR authored by
# `thewoolleyman` DID get auto-merge from the human-allowlist path and
# merged on green CI while the gate's own status was `failure` —
# exactly the bypass described above. It was harmless there (the PR was
# a doc change, and the real bump PR takes the App path), but it is the
# precise footgun this note exists to prevent.
#
# Why the release-please App path exists: across 2026-06-30..2026-07-03
# the fleet's release train stalled in all six repos — release-please's
# App-authored release PRs were never in the author allowlist, so
# auto-merge was never enabled and the release PRs silently parked. The
# branch-shape-guarded App path closes that gap (livespec-c1k9).

name: Auto-enable merge

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
      - unlabeled

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Per-PR concurrency: a synchronize-then-unlabeled burst on the
  # same PR collapses to one effective run.
  group: auto-enable-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  enable-auto-merge:
    runs-on: ubuntu-latest
    # Composed gate: NOT draft AND do-not-merge label absent AND
    # (author in human allowlist OR the fleet's release-please App on a
    # release-please-- head branch). All continuation lines share one
    # indent so the `>-` fold yields a single-line expression.
    if: >-
      github.event.pull_request.draft == false
      && !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
      && (
      contains(fromJSON('["thewoolleyman"]'), github.event.pull_request.user.login)
      || (github.event.pull_request.user.login == 'livespec-pr-bot[bot]'
      && startsWith(github.event.pull_request.head.ref, 'release-please--'))
      )
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: "Enable auto-merge (rebase) on PR #${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          # `gh pr merge --auto` is idempotent — re-running on a PR
          # that already has auto-merge set returns 0.
          if gh pr merge "$PR" --repo "$REPO" --auto --rebase; then
            echo "Auto-merge enabled on PR #$PR (rebase strategy)"
          else
            echo "::error::failed to enable auto-merge on PR #$PR"
            exit 1
          fi
