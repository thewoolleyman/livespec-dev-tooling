# reusable-release-lane-watch.yml — periodic release-LANE health backstop.
#
# Authority: livespec plan/fleet-delivery-lane-visibility (epic
#   livespec-n33rwg), carrier R1 depth half; slice
#   livespec-dev-tooling-37p0. Lifted from livespec-overseer's
#   release-lane-watch.yml (overseer-hgq4wi.15) so every publishing repo
#   consumes ONE implementation instead of forking it.
#
# Motivating incident: the overseer's own release lane failed 139 of 157
# runs between 2026-07-26 and 2026-08-20, including one unbroken block of
# 123 consecutive failed cuts across SIXTEEN DAYS, and nothing reported
# it. Separately, livespec's `Release tag` failed five consecutive
# published cuts (v0.34.2..v0.37.0) while every release published anyway.
#
# WHY A CADENCE AND NOT AN EDGE: at an 88.5% failure rate a
# transition-triggered alert is silent through most of the failure,
# because most of the lane's life IS the failure. This job reports STATE
# on a schedule instead — "currently failing, N cuts, since T".
#
# WHAT IT DOES (Option B, livespec-n33rwg.5): it reconciles ONE durable
# `release-lane-red` issue per repo — opening or updating it while any
# watched lane is failing or unmeasurable, and closing it on recovery — so
# the DURABLE issue is the report, read by needs-attention-internal Signal 9
# Shape C, rather than a transient red run nobody reads. The lane set is
# supplied by the CALLER and is never hardcoded here: the fleet is
# non-uniform, and only two repos ship a `release-tag.yml` at all.
#
# EXIT CODES ARE THREE-VALUED ON PURPOSE, and both non-zero values red the
# job: 1 means at least one lane is FAILING, 2 means at least one CANNOT BE
# MEASURED or the issue write did not land (the forge was unreachable,
# unauthorized, or unparsable). The job status still reflects lane health
# even though the durable signal is now the issue; a watcher that cannot
# measure must never be mistaken for one reporting healthy.

name: reusable-release-lane-watch

on:
  workflow_call:
    inputs:
      workflows:
        description: >-
          Whitespace-separated workflow FILE NAMES in the CALLER's repo to
          watch, e.g. "release-tag.yml release-readiness.yml". Supplied by
          the caller because the fleet is non-uniform — deriving a
          fleet-wide default here would watch lanes that do not exist and
          miss the ones that do.
        required: true
        type: string
      min_consecutive:
        description: >-
          Consecutive failures before the lane is reported. Defaults to 2:
          a SINGLE failed cut is indistinguishable from a flake, and a
          watcher that cries wolf on one transient is muted within a day.
        required: false
        type: number
        default: 2

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  watch:
    name: release-lane-watch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the caller repo
        uses: actions/checkout@v5

      - name: Checkout livespec-dev-tooling support modules
        uses: actions/checkout@v5
        with:
          repository: thewoolleyman/livespec-dev-tooling
          path: .livespec-dev-tooling
          fetch-depth: 1

      - name: Reconcile the release-lane-red issue against the watched lanes
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOWS: ${{ inputs.workflows }}
        run: |
          set -uo pipefail
          export PYTHONPATH=.livespec-dev-tooling
          # Option B (livespec-n33rwg.5): release_lane_issue_runner surveys every
          # watched lane, then opens / updates / closes the ONE per-repo durable
          # release-lane-red issue and returns the sibling THREE-VALUED worst exit
          # (0 healthy / 1 failing / 2 cannot-measure-or-write-did-not-land), so
          # the job status still reflects lane health while the durable signal is
          # the issue. `issues: write` above is what lets this run write it. The
          # transient failure threshold stays the detector's default (2) inside
          # notice_text; the min_consecutive input is retained for a future run
          # that plumbs it through. WORKFLOWS is intentionally unquoted so each
          # whitespace-separated lane name becomes a separate argv token.
          python3 -m livespec_dev_tooling.cross_repo.release_lane_issue_runner ${WORKFLOWS}
