# reusable-check-matrix.yml — reusable workflow for the shared check suite.
#
# Authority: SPECIFICATION/contracts.md §"Reusable workflows wire contract".
#
# Consumers invoke this workflow from their own ci.yml via
# `uses: thewoolleyman/livespec-dev-tooling/.github/workflows/reusable-check-matrix.yml@vX.Y.Z`
# (with `with: { checks: '["slug1", "slug2", ...]' }`).
#
# Strategy: matrix over the `checks` input array; each matrix entry
# runs the `setup` + `run-check` composite Actions in sequence, so each
# check reports its own status check name to GitHub for branch-
# protection alignment.
#
# Inputs:
#   checks (required) — JSON-array string of check slugs (e.g.,
#     '["no_inheritance", "heading_coverage", "claude_md_coverage"]').
#     The consumer is responsible for choosing the subset of shared
#     checks relevant to their repo's source layout.
#   ref (optional, default refs/heads/master) — git ref of
#     livespec-dev-tooling to consume Actions from. Pinned via the
#     consumer's `uses:` reference (typically vX.Y.Z); included here
#     for non-tag-pinned local-fork experimentation only.
#   incident-omitted (optional, default '[]') and incident-ci-result
#     (optional, default '') — the expedited incident inputs (work-item
#     livespec-dev-tooling-hlxbsv). A caller wires them ONLY from its
#     incident-ci job, exactly as:
#       incident-omitted: ${{ needs.incident-ci.result == 'success' && needs.incident-ci.outputs.omitted || '[]' }}
#       incident-ci-result: ${{ needs.incident-ci.result }}
#     and that job must `needs:` an incident-ci job the workflow defines.
#     `python -m livespec_dev_tooling.incident_matrix_omission --check-callers`
#     parses a repository's workflows (yaml.safe_load) and checks every call
#     site of this matrix per job. The decision below applies the same rule to
#     the CALLING workflow only, which `github.workflow_ref` names (in a called
#     workflow the github context is the caller's). It reads that file at the
#     pull request's BASE commit, the trusted revision (merged code that passed
#     review and the workflow-edit gates; the head and the merge commit carry
#     the PR author's edits), and requires the copy GitHub ran, the merge
#     commit in the consumer checkout, to equal it. Every call site in it must
#     pass, because the matrix cannot tell which job called it. Anything else
#     (a literal list, a repository variable, a raw output, an oddly spelled
#     key, a missing needs, a PR that edits its calling workflow) omits
#     nothing. That one read goes through the sanctioned budgeted_gh.gh_read
#     with the caller's token, which needs contents: read.
#
#     When the list is anything but '[]' on a pull_request event, each leg
#     resolves the LATEST RELEASE of livespec-dev-tooling (the same
#     releases/latest read the incident-ci job of this repository's own
#     ci.yml installs from), checks out refs/tags/<that tag> into
#     .livespec-dev-tooling-released (a same-named branch cannot win),
#     prepares a throwaway venv holding only the decision's hash-pinned
#     dependencies (python3 -m livespec_dev_tooling.incident_matrix_venv), and
#     runs the decision from there with that venv's interpreter:
#     never from the consumer's tree, and never from the `ref` input (whose
#     default is unreleased master, so the `uses:` pin does not pin the
#     Actions checkout). A change that widens what can be omitted therefore
#     reaches no consumer until it is released. The decision omits a leg
#     only when ALL of these hold, and otherwise the leg runs its check:
#     - the event is pull_request (a push, pull_request_target, merge_group
#       or any other event never reaches it, and the module repeats the
#       test), so a master push runs every requested check whatever labels,
#       markers or input it receives (SPECIFICATION/contracts.md, the
#       expedited incident execution contract);
#     - the input is a JSON array of strings (anything else FAILS the leg
#       before any report; membership is never a substring test);
#     - the leg's slug is a module slug run-check can run, naming a coverage
#       or spec member in the module's OMITTABLE_MEMBERS allowlist (a listed
#       check-lint is refused with a warning and runs);
#     - incident-ci-result is success, the event payload's pull request
#       carries the expedited-incident-response label, its head repository
#       is this repository (a fork omits nothing), and the caller's wiring
#       passes the rule above.
#     An omitted leg prints a ::notice annotation and reports
#     omitted-by-incident-policy in its step summary, and it concludes
#     success under its usual check-run name. A caller's protected
#     aggregate MUST therefore re-report the omitted members, as this
#     repository's ci-green does.

name: livespec-dev-tooling check matrix

on:
  workflow_call:
    inputs:
      checks:
        description: JSON-array string of check slugs to run.
        required: true
        type: string
      ref:
        description: livespec-dev-tooling git ref to consume Actions from.
        required: false
        type: string
        default: master
      incident-omitted:
        description: JSON-array string of the incident controller members the caller's passed incident aggregate omits; honored on pull_request events, for coverage and spec members, only.
        required: false
        type: string
        default: '[]'
      incident-ci-result:
        description: The caller's incident-ci job result; an omission needs success.
        required: false
        type: string
        default: ''

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(inputs.checks) }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v5

      - name: Checkout livespec-dev-tooling Actions
        uses: actions/checkout@v5
        with:
          repository: thewoolleyman/livespec-dev-tooling
          ref: ${{ inputs.ref }}
          path: .livespec-dev-tooling-actions

      # Expedited incident PRs only, and only when the caller passes a list.
      # The pull_request test is the master-push guard: on every other event
      # these three steps are skipped, `omit` stays unset, and the leg runs
      # its check. The decision runs from the latest RELEASE, never from the
      # consumer's tree or from the `ref` input.
      - name: Resolve the latest livespec-dev-tooling release for the incident decision
        id: release
        if: ${{ github.event_name == 'pull_request' && inputs.incident-omitted != '[]' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/thewoolleyman/livespec-dev-tooling/releases/latest --jq .tag_name)"
          if ! [[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
            echo "::error::could not resolve the latest livespec-dev-tooling release tag"
            exit 1
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Checkout the released livespec-dev-tooling incident decision
        if: ${{ github.event_name == 'pull_request' && inputs.incident-omitted != '[]' }}
        uses: actions/checkout@v5
        with:
          repository: thewoolleyman/livespec-dev-tooling
          ref: refs/tags/${{ steps.release.outputs.tag }}
          path: .livespec-dev-tooling-released
          persist-credentials: false

      - name: Decide incident omission for this leg
        id: incident
        if: ${{ github.event_name == 'pull_request' && inputs.incident-omitted != '[]' }}
        shell: bash
        working-directory: .livespec-dev-tooling-released
        env:
          GH_TOKEN: ${{ github.token }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          INCIDENT_OMITTED: ${{ inputs.incident-omitted }}
          INCIDENT_CI_RESULT: ${{ inputs.incident-ci-result }}
          MATRIX_CHECK: ${{ matrix.check }}
        run: |
          python3 -m livespec_dev_tooling.incident_matrix_venv "$RUNNER_TEMP/incident-decision"
          "$RUNNER_TEMP/incident-decision/bin/python" -m livespec_dev_tooling.incident_matrix_omission

      # A member the decision omits is reported here instead of being run,
      # never skipped silently.
      - name: omitted-by-incident-policy (per the caller's incident CI aggregate)
        if: ${{ github.event_name == 'pull_request' && steps.incident.outputs.omit == 'true' }}
        shell: bash
        env:
          MEMBER: ${{ matrix.check }}
        run: |
          echo "omitted-by-incident-policy: ${MEMBER} was not executed. The caller's passed incident CI aggregate defers it for this pull request head." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Setup toolchain
        if: ${{ !(github.event_name == 'pull_request' && steps.incident.outputs.omit == 'true') }}
        uses: ./.livespec-dev-tooling-actions/.github/actions/setup

      - name: Run check
        if: ${{ !(github.event_name == 'pull_request' && steps.incident.outputs.omit == 'true') }}
        uses: ./.livespec-dev-tooling-actions/.github/actions/run-check
        with:
          check-name: ${{ matrix.check }}
