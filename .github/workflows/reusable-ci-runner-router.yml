name: Reusable CI runner router

on:
  workflow_call:
    inputs:
      local-runner-labels:
        description: JSON array of the self-hosted labels a healthy runner must carry.
        required: true
        type: string
      failover-mode:
        description: auto (default), hosted (maintenance), or local (break-glass).
        required: false
        default: auto
        type: string
      trusted:
        description: Whether this event is allowed to run caller code on local CI.
        required: true
        type: boolean
      recovery-wait-seconds:
        description: Seconds between two healthy observations before returning to local capacity.
        required: false
        default: 30
        type: number
    outputs:
      runs_on:
        description: JSON accepted by a downstream job's fromJSON(runs-on) expression.
        value: ${{ jobs.select.outputs.runs_on }}
      lane:
        description: hosted or local, for resource and parallelism policy.
        value: ${{ jobs.select.outputs.lane }}
      reason:
        description: Auditable, credential-free selector result.
        value: ${{ jobs.select.outputs.reason }}

jobs:
  select:
    # This is intentionally always hosted: it is the escape hatch when the
    # local pool is unavailable, and it must never itself queue on that pool.
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      runs_on: ${{ steps.decide.outputs.runs_on }}
      lane: ${{ steps.decide.outputs.lane }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - id: first-probe
        if: inputs.trusted && inputs.failover-mode == 'auto'
        uses: $/.github/actions/ci-runner-health
        with:
          github-token: ${{ github.token }}
          runner-labels: ${{ inputs.local-runner-labels }}

      - name: Confirm recovery before returning to local capacity
        if: inputs.trusted && inputs.failover-mode == 'auto' && steps.first-probe.outputs.healthy == 'true'
        run: sleep "${{ inputs.recovery-wait-seconds }}"

      - id: second-probe
        if: inputs.trusted && inputs.failover-mode == 'auto' && steps.first-probe.outputs.healthy == 'true'
        uses: $/.github/actions/ci-runner-health
        with:
          github-token: ${{ github.token }}
          runner-labels: ${{ inputs.local-runner-labels }}

      - id: decide
        name: Emit failover decision and audit summary
        env:
          LOCAL_RUNNER_LABELS: ${{ inputs.local-runner-labels }}
          MODE: ${{ inputs.failover-mode }}
          TRUSTED: ${{ inputs.trusted }}
          FIRST_HEALTH: ${{ steps.first-probe.outputs.healthy }}
          FIRST_DETAIL: ${{ steps.first-probe.outputs.detail }}
          SECOND_HEALTH: ${{ steps.second-probe.outputs.healthy }}
          SECOND_DETAIL: ${{ steps.second-probe.outputs.detail }}
        run: |
          set -euo pipefail
          runs_on='["ubuntu-latest"]'
          lane='hosted'
          reason='invalid-failover-mode'
          case "$MODE" in
            auto)
              if [ "$TRUSTED" != 'true' ]; then
                reason='forced-hosted-untrusted-event'
              elif [ "$FIRST_HEALTH" != 'true' ]; then
                reason="automatic-failover-${FIRST_DETAIL:-first-probe-unavailable}"
              elif [ "$SECOND_HEALTH" != 'true' ]; then
                reason="automatic-failover-${SECOND_DETAIL:-recovery-not-stable}"
              else
                runs_on="$LOCAL_RUNNER_LABELS"
                lane='local'
                reason='automatic-local-two-healthy-probes'
              fi
              ;;
            hosted)
              reason='manual-hosted-override'
              ;;
            local)
              if [ "$TRUSTED" = 'true' ]; then
                runs_on="$LOCAL_RUNNER_LABELS"
                lane='local'
                reason='manual-local-break-glass'
              else
                reason='forced-hosted-untrusted-event'
              fi
              ;;
          esac
          {
            echo "runs_on=$runs_on"
            echo "lane=$lane"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"
          {
            echo '### CI runner routing'
            echo "- Decision: \`$lane\` (\`$reason\`)"
            echo "- First bounded probe: \`${FIRST_HEALTH:-not-run}\` (${FIRST_DETAIL:-not-run})"
            echo "- Second bounded probe: \`${SECOND_HEALTH:-not-run}\` (${SECOND_DETAIL:-not-run})"
            echo '- API budget: at most two read-only runner-list requests per automatic run.'
          } >> "$GITHUB_STEP_SUMMARY"
