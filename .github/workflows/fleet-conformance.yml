# fleet-conformance.yml — scheduled central fleet-membership sweep.
#
# Authority: livespec SPECIFICATION/non-functional-requirements.md
#   §"Fleet membership contract" — the conformance check "runs on a
#   schedule AND as the preflight of the dev-tooling release
#   fan-out". In the fan-out context the preflight is a per-member
#   FILTER (blocking only on structural failure), per this repo's
#   contracts.md §"reusable-release-dispatch.yml". This workflow is
#   the schedule leg; the preflight leg is the fleet-preflight job in
#   reusable-release-dispatch.yml; the per-PR leg is ci.yml's
#   check-fleet-conformance job.
#
# Token model: the livespec GitHub App installation token (same
# identity as the other cross-repo workflows, per livespec
# contracts.md §"GitHub App auth model") makes member contents,
# topics, and the installation-coverage row readable fleet-wide.
# Admin-scoped rows (secret names, branch protection) are NOT run under
# this token. They are declared `vantage: admin` on the obligation table
# and reported as OUT-OF-VANTAGE here, naming the lane that does enforce
# them: `just check-fleet-conformance-admin`
# (livespec_dev_tooling/fleet/fleet_conformance_admin.py), the world-gate
# lane wired into the `just check` aggregate and so run at pre-push under
# the operator's own admin `gh` credentials.
#
# This comment previously claimed operator-local `just check` runs covered
# those rows. It did not: `just check` does not set
# LIVESPEC_RUN_FLEET_CONFORMANCE, so it skipped the sweep entirely, and
# the rows were enforced in ZERO contexts. The admin lane is the fix; do
# not restore the old claim.
#
# A scheduled red here is still always a definitive finding, never a
# permissions artifact — out-of-vantage rows are not asserted at all, so
# they can neither pass nor fail this run.

name: Fleet conformance

on:
  schedule:
    - cron: '30 13 * * *'  # daily, after the 13:00 UTC pin-freshness sweep
  workflow_dispatch: {}

jobs:
  fleet-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mint App installation token (fleet-wide reads)
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Install pinned binaries via mise
        uses: jdx/mise-action@v2

      - name: Install Python dev deps via uv
        run: uv sync --all-groups

      - name: just check-fleet-conformance
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          LIVESPEC_RUN_FLEET_CONFORMANCE: "true"
        run: just check-fleet-conformance
