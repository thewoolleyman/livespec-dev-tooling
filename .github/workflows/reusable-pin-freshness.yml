# reusable-pin-freshness.yml — periodic safety-net pin-staleness scan.
#
# Authority: SPECIFICATION/contracts.md §"Cross-repo coordination
#   automation surface" — specifically the §"reusable-pin-freshness.yml"
#   subsection (inputs/behavior including the `staleness_threshold_releases`
#   default of 1), §"Pin-freshness threshold defaults" (the daily
#   cadence recommendation), §"Pin autodiscovery rules" (the covered
#   formats, including the external-source codex-acp Dockerfile ARG),
#   §"PR commit-message convention" (`chore(deps):` prefix), §"GitHub
#   App auth model" (App-token auth, `statuses: write`), §"codex-acp
#   factory gate" (the external-source pin's dispatch + no-auto-merge
#   PR), and §"Fallback to known-good pin" (no force-push past failing
#   checks).
#
# Dispatch model: invoked by each sibling's own `pin-freshness.yml`
# shim on `on: schedule: cron: ...` (consumer-owned cadence; spec
# recommends daily at 13:00 UTC). The shim threads
# `staleness_threshold_releases` (defaulting to 1) and `secrets:
# inherit`; this workflow runs pin-autodiscovery (all sources),
# queries each discovered FLEET source's latest release tag via `gh
# release view --json tagName`, and opens a bump PR per stale
# `(source_repo, current_pin, latest_tag)` triple. The external-source
# codex-acp Dockerfile ARG record has no fleet release: its latest
# version is queried from the npm registry (`npm view
# @agentclientprotocol/codex-acp version`), it is stale on ANY difference,
# and its bump PR is opened WITHOUT auto-merge and factory-gated via a
# `codex-acp-golden-master` repository_dispatch at the orchestrator
# (per §"codex-acp factory gate").
#
# Consumers invoke this workflow from their own `pin-freshness.yml`
# shim via
# `uses: thewoolleyman/livespec-dev-tooling/.github/workflows/reusable-pin-freshness.yml@vX.Y.Z`
# (with optional `with: { staleness_threshold_releases: N }` override
# and `secrets: inherit`).
#
# Inputs:
#   staleness_threshold_releases (optional, default `1`) — the number
#     of intermediate releases beyond which a pin is considered stale
#     and a bump PR is opened. Default of 1 means any pin one or more
#     releases behind the latest tag triggers a PR per spec
#     §"Pin-freshness threshold defaults".
#
# Outputs: none. Each opened PR is the surface; CI status against the
#   new pin is the consumer's own existing branch-protection gates.
#
# Secrets (inherited via `secrets: inherit` from the consumer shim):
#   APP_ID — GitHub App's numeric ID.
#   APP_PRIVATE_KEY — GitHub App's private key PEM.
#
# Bump-PR body extraction (per li-b4yiuv): the bump-PR-opening tail —
# create branch, rewrite matching pins per format, optional
# vendor-update, commit + push, open auto-merge PR — is
# extracted into the shared composite Action at
# `.github/actions/bump-pin-rewrite`, which the sibling
# `reusable-bump-pin-from-dispatch.yml` workflow also consumes. The
# two workflows previously duplicated the rewrite step body inline,
# pre-flagged in this header before the extraction landed.
#
# Fallback per §"Fallback to known-good pin": this workflow MUST NOT
#   force-push past the consumer's failing CI; it runs no consumer
#   checks itself, so the failure surfaces on the PR's own status
#   checks per the spec's manual-pin path.

name: reusable-pin-freshness

on:
  workflow_call:
    inputs:
      staleness_threshold_releases:
        description: Number of releases behind latest before a bump PR is opened.
        required: false
        type: number
        default: 1
    secrets:
      APP_ID:
        description: GitHub App numeric ID for the bump-PR App.
        required: true
      APP_PRIVATE_KEY:
        description: GitHub App private key PEM for the bump-PR App.
        required: true

jobs:
  scan:
    name: scan-pin-freshness
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.evaluate.outputs.stale }}
    steps:
      - name: Mint App token (read-only for scan)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout consumer repo
        uses: actions/checkout@v5

      - name: Checkout livespec-dev-tooling support modules
        uses: actions/checkout@v5
        with:
          repository: thewoolleyman/livespec-dev-tooling
          path: .livespec-dev-tooling
          fetch-depth: 1

      - name: Install pinned binaries via mise
        uses: jdx/mise-action@v4

      - name: Install Python deps via uv
        run: uv sync --all-groups

      - name: Run pin-autodiscovery (all sources)
        id: autodiscover
        run: |
          set -euo pipefail
          records=$(uv run --project .livespec-dev-tooling python -m \
            livespec_dev_tooling.cross_repo.pin_autodiscovery --root .)
          echo "::group::pin-autodiscovery records (all sources)"
          echo "$records"
          echo "::endgroup::"
          {
            echo 'records<<JSONEOF'
            echo "$records"
            echo 'JSONEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Query latest tag per discovered source and evaluate staleness
        id: evaluate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          RECORDS: ${{ steps.autodiscover.outputs.records }}
          STALENESS_THRESHOLD: ${{ inputs.staleness_threshold_releases }}
        run: |
          set -euo pipefail
          # Check a `(source_repo, current_pin, latest_tag)` triple for EVERY
          # DISTINCT pin, per SPECIFICATION/contracts.md §"Reusable workflow
          # inventory". Multiple records can share a source_repo (e.g., the same
          # source pinned in both pyproject.toml and .vendor.jsonc, or the fabro
          # image pinned in a Fabro workflow.toml AND in several per-job
          # `container:` blocks) — and those records may hold DIFFERENT values.
          #
          # This previously collapsed each source to `.[0].current_value`, so a
          # source whose first record happened to be FRESH emitted nothing even
          # when its other pins were stale — the safety net went blind exactly
          # where drift hides (livespec-dev-tooling-p73). The selection now comes
          # from the tested `pin_staleness` module rather than inline jq.
          #
          # Resolved from the master support checkout (`--project
          # .livespec-dev-tooling`), NOT the consumer's environment, per the
          # TOOL-vs-DATA split documented in
          # `.github/actions/bump-pin-rewrite/action.yml`: a module whose
          # behavior should not be version-matched to the consumer is a TOOL and
          # must come from the support checkout, "because a consumer's pinned
          # release predates the fix and would not carry it". `pin_staleness`
          # takes its input as DATA on $RECORDS and merely computes the distinct
          # pins, so nothing about it should track the consumer's pin. This
          # invocation previously used a bare `uv run` while the other three in
          # this workflow (lines ~115, ~214, ~278) all used the support checkout
          # — an oversight in the p73 change, since the later ews change added
          # the second `pin_staleness` call with the correct form
          # (livespec-dev-tooling-3tu). Consumer-env resolution coupled the scan
          # to the consumer having livespec-dev-tooling >= v0.49.3 importable
          # from its OWN environment; a consumer below that (or with no
          # livespec-dev-tooling Python dependency at all) would have died on
          # ModuleNotFoundError under `set -euo pipefail`, taking the whole
          # freshness scan down with it.
          pins=$(RECORDS="$RECORDS" uv run --project .livespec-dev-tooling python -m \
            livespec_dev_tooling.cross_repo.pin_staleness)
          stale=()
          emitted_sources=""
          while IFS=$'\t' read -r source current; do
            [ -n "$source" ] || continue
            # One bump entry per source_repo is sufficient AND necessary: the
            # rewrite step below updates EVERY record for that source, and the
            # bump branch is named on (source, tag), so a second entry for the
            # same source would collide on the branch name. Skipping only once a
            # source has ALREADY produced a stale entry means a fresh pin never
            # suppresses a stale sibling pin, whatever order they arrive in.
            case " $emitted_sources " in *" $source "*) continue ;; esac
            # External-source codex-acp Dockerfile ARG pin (per
            # SPECIFICATION/contracts.md §"Pin autodiscovery rules"): its latest
            # version comes from the npm registry — the `latest` dist-tag of the
            # same @agentclientprotocol/codex-acp package the base Dockerfile bakes
            # from — NOT a fleet release tag, and it is stale on ANY difference
            # (the ordinal staleness_threshold_releases measure does not apply to
            # a non-fleet source). Because a bump changes the baked Codex
            # adapter, the resulting PR is factory-gated (§"codex-acp factory
            # gate"): the stale entry carries no_auto_merge=true, so the
            # open-bump-pr job opens its PR WITHOUT auto-merge and fires the
            # golden-master dispatch.
            if [[ "$source" == "agentclientprotocol/codex-acp" ]]; then
              latest=$(npm view @agentclientprotocol/codex-acp version 2>/dev/null || true)
              if [[ -z "$latest" ]]; then
                echo "::warning::could not query npm latest for @agentclientprotocol/codex-acp; skipping"
                continue
              fi
              if [[ "$current" == "$latest" ]]; then
                echo "::notice::codex-acp pinned at $current, already current (npm latest)"
                continue
              fi
              echo "::notice::codex-acp stale: current=$current latest=$latest (npm; any-diff, factory-gated)"
              stale+=("$(jq -nc --arg source_repo "$source" --arg tag "$latest" '{source_repo: $source_repo, tag: $tag, no_auto_merge: "true"}')")
              emitted_sources="$emitted_sources $source"
              continue
            fi
            latest=$(gh release view --repo "$OWNER/$source" --json tagName -q .tagName 2>/dev/null || true)
            if [[ -z "$latest" ]]; then
              echo "::warning::could not query latest release for $OWNER/$source (no releases yet, App missing, or repo not found); skipping"
              continue
            fi
            # Currency test: does the pin already name THIS release? Answered by
            # the TESTED `pin_staleness` module comparing the VERSION each tag
            # denotes, NOT by raw string equality on the tag bytes.
            #
            # The raw `[[ "$current" == "$latest" ]]` this replaces was correct
            # only for pin formats whose value IS a bare release tag. The
            # `fabro_sandbox_docker_image` format's value is a LAYER-PREFIXED
            # image tag (`python-v0.51.4`) over the bare release version
            # (`v0.51.4`), so `current` and `latest` were never equal even when
            # they named the same release, and that pin was reported stale BY
            # CONSTRUCTION on every sweep, forever — an unclosable bump-PR loop
            # (livespec-dev-tooling-clrk). The observed sweep line was
            # `livespec-dev-tooling stale: current=python-v0.50.8 latest=v0.50.8`
            # while the unprefixed `livespec` and `livespec-runtime` pins in the
            # SAME run evaluated correctly, isolating it to the prefixed format.
            #
            # The rewrite half (`fabro_image_pin_rewrite`) already knew this
            # grammar; only the comparison half did not. The module now consumes
            # that ONE definition rather than a second copy in this shell — a
            # bash prefix-strip here would recreate exactly the two-copies split
            # that let the halves disagree in the first place.
            #
            # NOTE this is the FLEET-RELEASE path only. The codex-acp branch
            # above deliberately keeps its own raw equality: it compares an npm
            # package version, not a fleet release tag, and its contract is
            # "stale on ANY difference" (§"codex-acp factory gate").
            currency=$(uv run --project .livespec-dev-tooling python -m \
              livespec_dev_tooling.cross_repo.pin_staleness \
              --is-current "$current" "$latest")
            # Fail LOUDLY on anything but the two expected tokens, so a broken
            # tool can never be silently read as a verdict.
            if ! [[ "$currency" =~ ^(true|false)$ ]]; then
              echo "::error::currency verdict for $source is not a bare true/false: [$currency]"
              exit 1
            fi
            if [[ "$currency" == "true" ]]; then
              echo "::notice::$source pinned at $current, already current"
              continue
            fi
            # Staleness measure: rough proxy via tag-list ordinal
            # distance. The exact ordinal is not load-bearing — the
            # spec mandates "at least staleness_threshold_releases
            # ahead". With default 1, any tag mismatch qualifies.
            # Higher thresholds let a consumer tolerate brief drift
            # windows without noise.
            #
            # Computed by the TESTED `pin_staleness` module, not inline shell.
            # The previous form piped the release list into an awk that `exit`ed
            # at the match with a `|| echo` fallback. The early exit SIGPIPEd
            # `gh`; under `pipefail` that made the PIPELINE non-zero, so the
            # fallback ALSO ran and the substitution captured TWO values
            # ("9\n1"). The `(( ))` below then syntax-errored, evaluated FALSE,
            # and SILENTLY dropped a stale source — and because the early exit
            # only fires when the tag IS found, it broke exactly the stale case
            # this scan exists to catch, while still reporting success
            # (livespec-dev-tooling-ews). The module reads stdin to EOF, so
            # there is no early exit to SIGPIPE, and prints one bare integer.
            ordinal_distance=$(gh release list --repo "$OWNER/$source" --limit 100 \
              --json tagName -q '.[].tagName' \
              | uv run --project .livespec-dev-tooling python -m \
                  livespec_dev_tooling.cross_repo.pin_staleness \
                  --ordinal-distance "$current" "$STALENESS_THRESHOLD")
            # Fail LOUDLY on a non-integer rather than letting `(( ))` swallow
            # it as false — a silent false is what hid the original defect.
            if ! [[ "$ordinal_distance" =~ ^[0-9]+$ ]]; then
              echo "::error::ordinal distance for $source is not a single integer: [$ordinal_distance]"
              exit 1
            fi
            if (( ordinal_distance >= STALENESS_THRESHOLD )); then
              echo "::notice::$source stale: current=$current latest=$latest distance=$ordinal_distance"
              stale+=("$(jq -nc --arg source_repo "$source" --arg tag "$latest" '{source_repo: $source_repo, tag: $tag, no_auto_merge: "false"}')")
              emitted_sources="$emitted_sources $source"
            fi
          done < <(echo "$pins" | jq -r '.[] | [.source_repo, .current_value] | @tsv')
          if [[ ${#stale[@]} -eq 0 ]]; then
            echo "stale=[]" >> "$GITHUB_OUTPUT"
          else
            joined=$(printf '%s\n' "${stale[@]}" | jq -cs '.')
            echo "stale=$joined" >> "$GITHUB_OUTPUT"
          fi

  open-bump-pr:
    name: open-bump-pr ${{ matrix.target.source_repo }}
    needs: scan
    if: needs.scan.outputs.stale != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.scan.outputs.stale) }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout consumer repo with App token
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Checkout livespec-dev-tooling support modules
        uses: actions/checkout@v5
        with:
          repository: thewoolleyman/livespec-dev-tooling
          path: .livespec-dev-tooling
          fetch-depth: 1

      - name: Install pinned binaries via mise
        uses: jdx/mise-action@v4

      - name: Install Python deps via uv
        run: uv sync --all-groups

      - name: Re-run pin-autodiscovery for ${{ matrix.target.source_repo }}
        id: autodiscover
        env:
          SOURCE_REPO: ${{ matrix.target.source_repo }}
        run: |
          set -euo pipefail
          records=$(uv run --project .livespec-dev-tooling python -m \
            livespec_dev_tooling.cross_repo.pin_autodiscovery \
            --root . --source-repo "$SOURCE_REPO")
          {
            echo 'records<<JSONEOF'
            echo "$records"
            echo 'JSONEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Compose PR body
        id: pr_body
        env:
          SOURCE_REPO: ${{ matrix.target.source_repo }}
          TAG: ${{ matrix.target.tag }}
        run: |
          set -euo pipefail
          body=$(printf 'Automated freshness bump of %s pin to %s.\n\nOpened by the cross-repo coordination automation surface per `livespec-dev-tooling/SPECIFICATION/contracts.md` §"reusable-pin-freshness.yml" — periodic safety-net scan caught a stale pin.\n' \
            "$SOURCE_REPO" "$TAG")
          {
            echo 'body<<BODYEOF'
            echo "$body"
            echo 'BODYEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Rewrite pins + commit + open auto-merge PR
        # `id` is load-bearing: the codex-acp gate steps below gate on this
        # step's `changed` output (livespec-dev-tooling-bmf). On the no-op
        # path the composite pushes no branch and opens no PR, so a
        # follow-up step that looks the PR up by branch name must not run.
        id: bump
        # Per the `Checkout livespec-dev-tooling support modules` step
        # above: this repo is checked out at `.livespec-dev-tooling/`,
        # which is where the composite Action source lives. The `./`
        # path is relative to the caller's GITHUB_WORKSPACE per
        # GitHub-Actions semantics for reusable workflows, NOT the
        # reusable workflow's own repo — hence the explicit subpath.
        uses: ./.livespec-dev-tooling/.github/actions/bump-pin-rewrite
        with:
          source_repo: ${{ matrix.target.source_repo }}
          tag: ${{ matrix.target.tag }}
          records: ${{ steps.autodiscover.outputs.records }}
          branch_prefix: chore/freshness-bump
          pr_body: ${{ steps.pr_body.outputs.body }}
          app_token: ${{ steps.app-token.outputs.token }}
          app_slug: ${{ steps.app-token.outputs.app-slug }}
          # Per SPECIFICATION/contracts.md §"codex-acp factory gate": the
          # codex-acp bump PR is opened WITHOUT auto-merge (its stale entry
          # carries no_auto_merge='true'); every fleet-release target carries
          # 'false' and keeps the standard `--auto --rebase` enablement.
          no_auto_merge: ${{ matrix.target.no_auto_merge }}

      # Codex-acp factory-gate dispatch (per SPECIFICATION/contracts.md
      # §"codex-acp factory gate" + §"`repository_dispatch` payload contract").
      # After the composite opens the codex-acp bump PR WITHOUT auto-merge, fire
      # a `codex-acp-golden-master` repository_dispatch at the orchestrator,
      # carrying the new version and the bump PR's head SHA + number. The
      # orchestrator runs its live golden-master gate against the new codex-acp
      # version and posts a commit status back (context `codex-acp-golden-master`,
      # via the App's `statuses: write` per §"GitHub App auth model"); on success
      # it enables the PR's auto-merge. The dispatch needs a token scoped to the
      # orchestrator repository, minted separately from this repo's App token.
      - name: Mint orchestrator-scoped App token (codex-acp gate dispatch)
        id: orch-app-token
        if: ${{ matrix.target.source_repo == 'agentclientprotocol/codex-acp' && steps.bump.outputs.changed == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: livespec-orchestrator-beads-fabro

      - name: Dispatch codex-acp golden-master factory gate
        # Gated on `changed` as well as the source: on the composite's no-op
        # path no branch was pushed and no PR opened, so the `gh pr view
        # "$BRANCH"` lookup below would fail under `set -euo pipefail` —
        # re-reddening the sweep at a confusing point right after
        # livespec-dev-tooling-bmf stopped it failing at the commit.
        if: ${{ matrix.target.source_repo == 'agentclientprotocol/codex-acp' && steps.bump.outputs.changed == 'true' }}
        env:
          THIS_REPO_TOKEN: ${{ steps.app-token.outputs.token }}
          ORCH_TOKEN: ${{ steps.orch-app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          CODEX_ACP_VERSION: ${{ matrix.target.tag }}
          # The composite created branch `<prefix>-<source_repo>-<tag>` with
          # prefix `chore/freshness-bump`; reconstruct it verbatim to look up
          # the just-opened bump PR's number + head SHA.
          BRANCH: chore/freshness-bump-${{ matrix.target.source_repo }}-${{ matrix.target.tag }}
        run: |
          set -euo pipefail
          # Look up the bump PR (this repository) with THIS repo's App token, then
          # fire the dispatch at the orchestrator with the orchestrator-scoped
          # token. Payload shape per §"`repository_dispatch` payload contract" —
          # event_type fixed at "codex-acp-golden-master"; client_payload carries
          # the bare npm codex_acp_version, the bump PR head_sha + pr_number, and
          # the literal source_repo "livespec-dev-tooling" (the repo the PR lives
          # in, where the gate posts its status callback).
          pr_json=$(GH_TOKEN="$THIS_REPO_TOKEN" gh pr view "$BRANCH" \
            --json number,headRefOid)
          pr_number=$(echo "$pr_json" | jq -r '.number')
          head_sha=$(echo "$pr_json" | jq -r '.headRefOid')
          payload=$(jq -nc \
            --arg codex_acp_version "$CODEX_ACP_VERSION" \
            --arg head_sha "$head_sha" \
            --argjson pr_number "$pr_number" \
            '{event_type: "codex-acp-golden-master", client_payload: {codex_acp_version: $codex_acp_version, head_sha: $head_sha, pr_number: $pr_number, source_repo: "livespec-dev-tooling"}}')
          echo "$payload" | GH_TOKEN="$ORCH_TOKEN" gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$OWNER/livespec-orchestrator-beads-fabro/dispatches" \
            --input -
          echo "::notice::dispatched codex-acp-golden-master (version=$CODEX_ACP_VERSION pr=$pr_number head_sha=$head_sha)"
