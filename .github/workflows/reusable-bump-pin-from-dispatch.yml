# reusable-bump-pin-from-dispatch.yml — per-consumer bump-pin handler.
#
# Authority: SPECIFICATION/contracts.md §"Cross-repo coordination
#   automation surface" — specifically the
#   §"reusable-bump-pin-from-dispatch.yml" subsection (inputs/behavior
#   including the .vendor.jsonc re-vendoring clause and the zero-pin
#   no-op clause), §"Pin autodiscovery rules" (the four pin formats
#   and the hyphen-to-underscore normalization for `.vendor.jsonc`
#   matching), §"PR commit-message convention" (`chore(deps): bump
#   <source_repo> pin to <tag>`), §"GitHub App auth model"
#   (App-token via `actions/create-github-app-token@v1`), and
#   §"Fallback to known-good pin" (no force-push past failing checks).
#
# Dispatch model: invoked by each sibling's own
# `bump-pin-from-dispatch.yml` shim on
# `on: repository_dispatch: types: [sibling-released]`. The shim
# unwraps `client_payload.source_repo`, `client_payload.tag`, and
# `client_payload.release_url` and threads them as inputs, plus
# `secrets: inherit`; this workflow then walks the consumer repo via
# `python -m livespec_dev_tooling.cross_repo.pin_autodiscovery`,
# delegates the matching-pin rewrite + commit + auto-merge-PR-open
# body to the shared composite Action at
# `.github/actions/bump-pin-rewrite` (also consumed by the sibling
# `reusable-pin-freshness.yml` periodic safety-net workflow per
# li-b4yiuv's extraction).
#
# Consumers invoke this workflow from their own
# `bump-pin-from-dispatch.yml` shim via
# `uses: thewoolleyman/livespec-dev-tooling/.github/workflows/reusable-bump-pin-from-dispatch.yml@vX.Y.Z`
# (with `with: { source_repo: ${{ github.event.client_payload.source_repo }}, ... }`
# and `secrets: inherit`).
#
# Inputs:
#   source_repo (required) — the publishing repository's short name,
#     extracted from `client_payload.source_repo`.
#   tag (required) — the published release tag, extracted from
#     `client_payload.tag`. Every matching pin is rewritten to this
#     value. No consumer checks run here — see the Outputs note below.
#   release_url (optional, default "") — included in the PR body for
#     traceability per §"PR commit-message convention".
#
# Outputs: none. The opened PR is the surface; CI status against the
#   new pin is the consumer's own existing branch-protection gates.
#
# Secrets (inherited via `secrets: inherit` from the consumer shim):
#   APP_ID — GitHub App's numeric ID.
#   APP_PRIVATE_KEY — GitHub App's private key PEM. The minted token
#     authors the commit + opens the PR; per §"GitHub App auth model"
#     this is REQUIRED (not GITHUB_TOKEN) so the bump commit re-runs
#     CI on the PR head SHA without hitting the workflow-recursion
#     ceiling.
#
# Zero-pin no-op clause per §"reusable-bump-pin-from-dispatch.yml":
#   when autodiscovery surfaces zero matching pins (the consumer does
#   not depend on `source_repo`), the workflow exits 0 with a
#   `::notice` annotation explaining the no-op. This is the standard
#   condition for a sibling that's discoverable via the topic but
#   doesn't actually consume the publishing repo.
#
# Fallback per §"Fallback to known-good pin": this workflow MUST NOT
#   force-push past the consumer's failing CI; it runs no consumer
#   checks itself, so the failure surfaces on the PR's own status
#   checks and the human contributor handles resolution per the
#   spec's manual-pin path.

name: reusable-bump-pin-from-dispatch

on:
  workflow_call:
    inputs:
      source_repo:
        description: Publishing repository short name (from client_payload.source_repo).
        required: true
        type: string
      tag:
        description: Published release tag (from client_payload.tag) — rewritten into every matching pin.
        required: true
        type: string
      release_url:
        description: GitHub release page URL (from client_payload.release_url) — included in PR body.
        required: false
        type: string
        default: ""
    secrets:
      APP_ID:
        description: GitHub App numeric ID for the bump-PR App.
        required: true
      APP_PRIVATE_KEY:
        description: GitHub App private key PEM for the bump-PR App.
        required: true

jobs:
  bump-pin:
    name: bump-pin
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout consumer repo with App token
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Stale-SHA rerun guard
        # Per SPECIFICATION/contracts.md §"Retry semantics (rerun vs fresh
        # dispatch)": `gh run rerun` re-executes the original event payload;
        # `actions/checkout` maps the event-pinned `github.sha` onto the
        # branch ref, so a rerun can never observe commits merged after the
        # event. When the consumer's default branch has moved since the
        # original dispatch, a rerun builds a stale SHA that also produces
        # BEHIND bump PRs — both are wrong. Refuse fast and embed the exact
        # fresh-dispatch command so the operator can issue the correct retry.
        # Flake reruns where the branch is unmoved proceed normally.
        # Same fail-loud-with-remedy pattern as the 8ml stray-gitlink guard.
        if: ${{ github.run_attempt > 1 }}
        env:
          EVENT_SHA: ${{ github.sha }}
          SOURCE_REPO: ${{ inputs.source_repo }}
          TAG: ${{ inputs.tag }}
          RELEASE_URL: ${{ inputs.release_url }}
        run: |
          set -euo pipefail
          # Query the live remote HEAD so we see commits merged after the
          # original event (git ls-remote is a live query, never cached).
          live_head=$(git ls-remote origin HEAD | awk '{print $1}')
          if [[ "$live_head" == "$EVENT_SHA" ]]; then
            echo "Stale-SHA rerun guard: branch unmoved (live HEAD == event SHA ${EVENT_SHA}); flake retry — proceeding normally."
            exit 0
          fi
          echo "::error::Stale-SHA rerun detected: the consumer's default branch has moved since the original dispatch."
          echo "::error::  Event-pinned SHA (what the rerun checks out): ${EVENT_SHA}"
          echo "::error::  Live default-branch HEAD:                      ${live_head}"
          echo "::error::A rerun always builds the original event SHA and cannot observe post-event commits."
          echo "::error::Building a stale HEAD also produces BEHIND bump PRs. Issue a fresh dispatch instead:"
          echo "::error::  gh api repos/${GITHUB_REPOSITORY}/dispatches \\"
          echo "::error::    -f event_type=sibling-released \\"
          echo "::error::    -f 'client_payload[source_repo]=${SOURCE_REPO}' \\"
          echo "::error::    -f 'client_payload[tag]=${TAG}' \\"
          echo "::error::    -f 'client_payload[release_url]=${RELEASE_URL}'"
          exit 1

      - name: Checkout livespec-dev-tooling support modules
        uses: actions/checkout@v4
        with:
          repository: thewoolleyman/livespec-dev-tooling
          path: .livespec-dev-tooling
          fetch-depth: 1

      - name: Install pinned binaries via mise
        uses: jdx/mise-action@v2

      - name: Install Python deps via uv
        run: uv sync --all-groups

      - name: Run pin-autodiscovery for ${{ inputs.source_repo }}
        id: autodiscover
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          set -euo pipefail
          records=$(uv run --project .livespec-dev-tooling python -m \
            livespec_dev_tooling.cross_repo.pin_autodiscovery \
            --root . --source-repo "$SOURCE_REPO")
          echo "::group::pin-autodiscovery records"
          echo "$records"
          echo "::endgroup::"
          count=$(echo "$records" | jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo 'records<<JSONEOF'
            echo "$records"
            echo 'JSONEOF'
          } >> "$GITHUB_OUTPUT"

      - name: No-op when zero matching pins
        if: steps.autodiscover.outputs.count == '0'
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
        run: |
          echo "::notice::no pins for $SOURCE_REPO found in this consumer; nothing to bump (spec §reusable-bump-pin-from-dispatch.yml no-op clause)"

      - name: Compose PR body
        if: steps.autodiscover.outputs.count != '0'
        id: pr_body
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          TAG: ${{ inputs.tag }}
          RELEASE_URL: ${{ inputs.release_url }}
        run: |
          set -euo pipefail
          # Per §"PR commit-message convention": title carries the
          # `chore(deps): bump ...` form (the composite Action sets
          # it). Body carries the release_url for traceability.
          body=$(printf 'Automated bump of %s pin to %s.\n\nRelease: %s\n\nOpened by the cross-repo coordination automation surface per `livespec-dev-tooling/SPECIFICATION/contracts.md` §"Cross-repo coordination automation surface".\n' \
            "$SOURCE_REPO" "$TAG" "$RELEASE_URL")
          {
            echo 'body<<BODYEOF'
            echo "$body"
            echo 'BODYEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Rewrite pins + commit + open auto-merge PR
        if: steps.autodiscover.outputs.count != '0'
        # Per the `Checkout livespec-dev-tooling support modules` step
        # above: this repo is checked out at `.livespec-dev-tooling/`,
        # which is where the composite Action source lives. The `./`
        # path is relative to the caller's GITHUB_WORKSPACE per
        # GitHub-Actions semantics for reusable workflows, NOT the
        # reusable workflow's own repo — hence the explicit subpath.
        uses: ./.livespec-dev-tooling/.github/actions/bump-pin-rewrite
        with:
          source_repo: ${{ inputs.source_repo }}
          tag: ${{ inputs.tag }}
          records: ${{ steps.autodiscover.outputs.records }}
          branch_prefix: chore/bump
          pr_body: ${{ steps.pr_body.outputs.body }}
          app_token: ${{ steps.app-token.outputs.token }}
          app_slug: ${{ steps.app-token.outputs.app-slug }}
