# fabro-sandbox-image.yml — build + publish the family Fabro sandbox image.
#
# This repo OWNS the family Fabro C-mode sandbox image (the family
# toolchain as a container), built as a FIVE-layer TREE under
# docker/fabro-sandbox/<layer>/Dockerfile:
#
#   base                     toolchain only — mise/just/lefthook/node/gh
#    +- python               + uv + CPython                  <- CI pulls
#    |   +- python-agent     + bubblewrap + both ACP adapters
#    |                                            <- Fabro sandbox pulls
#    +- python-rust          + the Rust toolchain            <- CI pulls
#        +- python-rust-agent + bubblewrap + both ACP adapters
#                                                 <- Fabro sandbox pulls
#
# The agent-only payload (bubblewrap + the two ACP adapters) sits in the
# leaf `agent` layer rather than in `base`, so a CI job pulls only the
# toolchain it actually uses (~42% less) while still running BYTE-
# IDENTICAL toolchain layers to the Fabro sandbox — one image chain, no
# separate slim CI image and therefore no CI-vs-sandbox drift. The single
# docker/fabro-sandbox/agent/Dockerfile is built TWICE, once atop each of
# python and python-rust, via its value-less PARENT_IMAGE build-arg.
#
# Each layer is a separately-published image whose `FROM` pins the exact
# DIGEST of the layer just built (hermetic — never a floating tag). Three
# triggers:
#
#   - pull_request touching image-affecting paths: build the whole tree
#     WITHOUT publishing to GHCR — the layers are pushed to an EPHEMERAL
#     in-job `localhost:5000` registry so the `FROM`-by-digest chain
#     resolves, validating that every layer still builds.
#   - push to master touching the same paths: build + publish the
#     immutable per-commit tags `base-sha-<short>` / `python-sha-<short>`
#     / `python-agent-sha-<short>` / `python-rust-sha-<short>` /
#     `python-rust-agent-sha-<short>`.
#   - release published: build + publish the immutable semver tags
#     `base-v<X.Y.Z>` / `python-v<X.Y.Z>` / `python-agent-v<X.Y.Z>` /
#     `python-rust-v<X.Y.Z>` / `python-rust-agent-v<X.Y.Z>`
#     (release-please authenticates via the livespec App installation
#     token, so its releases DO fire this event). `paths` filters do not
#     apply to release events, so EVERY release gets semver-tagged layer
#     images; `just check-fabro-image-pin-lockstep` guarantees the baked
#     pins match the released tree's .mise.toml / .python-version.
#
# NO mutable `latest` tag is published (flavor: latest=false): consumers
# pin an immutable layer-prefixed sha-* or v* tag.
#
# Auth: the default Actions GITHUB_TOKEN with packages:write suffices —
# the images publish to this repo's own GHCR namespace
# (ghcr.io/<owner>/livespec-fabro-sandbox) and nothing downstream
# triggers off the publish.

name: Fabro sandbox image

on:
  pull_request:
    paths:
      - "docker/fabro-sandbox/**"
      - ".github/workflows/fabro-sandbox-image.yml"
      - ".mise.toml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [master]
    paths:
      - "docker/fabro-sandbox/**"
      - ".github/workflows/fabro-sandbox-image.yml"
      - ".mise.toml"
      - ".python-version"
      - "pyproject.toml"
      - "uv.lock"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: fabro-sandbox-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build-fabro-sandbox-image
    runs-on: ubuntu-latest
    # Ephemeral registry so the FROM-by-digest chain resolves on PRs
    # (where nothing is pushed to GHCR). BuildKit treats localhost as an
    # insecure HTTP registry by default; the buildx builder reaches it via
    # `network=host`.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a PR the layers go to the ephemeral localhost registry (never
      # GHCR); on master push / release they go to the published GHCR repo.
      # Either way `push: true`, so the FROM-by-digest chain always
      # resolves against a real registry.
      - name: Resolve target registry image
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "image=localhost:5000/livespec-fabro-sandbox" >> "$GITHUB_OUTPUT"
          else
            echo "image=ghcr.io/${{ github.repository_owner }}/livespec-fabro-sandbox" >> "$GITHUB_OUTPUT"
          fi

      # ---- base layer ----
      - name: Compute base tags
        id: meta_base
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.target.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=base-sha-
            type=semver,pattern=v{{version}},prefix=base-

      - name: Build + push base
        id: build_base
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/fabro-sandbox/base/Dockerfile
          push: true
          provenance: false
          tags: ${{ steps.meta_base.outputs.tags }}
          labels: ${{ steps.meta_base.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      # ---- python layer (FROM the base digest just built) ----
      - name: Compute python tags
        id: meta_python
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.target.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=python-sha-
            type=semver,pattern=v{{version}},prefix=python-

      - name: Build + push python
        id: build_python
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/fabro-sandbox/python/Dockerfile
          push: true
          provenance: false
          build-args: |
            BASE_IMAGE=${{ steps.target.outputs.image }}@${{ steps.build_base.outputs.digest }}
          tags: ${{ steps.meta_python.outputs.tags }}
          labels: ${{ steps.meta_python.outputs.labels }}
          cache-from: type=gha,scope=python
          cache-to: type=gha,scope=python,mode=max

      # ---- python-agent layer (FROM the python digest just built) ----
      - name: Compute python-agent tags
        id: meta_python_agent
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.target.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=python-agent-sha-
            type=semver,pattern=v{{version}},prefix=python-agent-

      - name: Build + push python-agent
        id: build_python_agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/fabro-sandbox/agent/Dockerfile
          push: true
          provenance: false
          build-args: |
            PARENT_IMAGE=${{ steps.target.outputs.image }}@${{ steps.build_python.outputs.digest }}
          tags: ${{ steps.meta_python_agent.outputs.tags }}
          labels: ${{ steps.meta_python_agent.outputs.labels }}
          cache-from: type=gha,scope=python-agent
          cache-to: type=gha,scope=python-agent,mode=max

      # ---- python-rust layer (FROM the python digest just built) ----
      - name: Compute python-rust tags
        id: meta_python_rust
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.target.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=python-rust-sha-
            type=semver,pattern=v{{version}},prefix=python-rust-

      - name: Build + push python-rust
        id: build_python_rust
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/fabro-sandbox/python-rust/Dockerfile
          push: true
          provenance: false
          build-args: |
            PYTHON_IMAGE=${{ steps.target.outputs.image }}@${{ steps.build_python.outputs.digest }}
          tags: ${{ steps.meta_python_rust.outputs.tags }}
          labels: ${{ steps.meta_python_rust.outputs.labels }}
          cache-from: type=gha,scope=python-rust
          cache-to: type=gha,scope=python-rust,mode=max

      # ---- python-rust-agent layer (FROM the python-rust digest just built) ----
      - name: Compute python-rust-agent tags
        id: meta_python_rust_agent
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.target.outputs.image }}
          flavor: latest=false
          tags: |
            type=sha,prefix=python-rust-agent-sha-
            type=semver,pattern=v{{version}},prefix=python-rust-agent-

      - name: Build + push python-rust-agent
        id: build_python_rust_agent
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/fabro-sandbox/agent/Dockerfile
          push: true
          provenance: false
          build-args: |
            PARENT_IMAGE=${{ steps.target.outputs.image }}@${{ steps.build_python_rust.outputs.digest }}
          tags: ${{ steps.meta_python_rust_agent.outputs.tags }}
          labels: ${{ steps.meta_python_rust_agent.outputs.labels }}
          cache-from: type=gha,scope=python-rust-agent
          cache-to: type=gha,scope=python-rust-agent,mode=max

  # ---------------------------------------------------------------------------
  # Producer-side self-reconcile of this repository's OWN self-sourced pins.
  #
  # Authority: SPECIFICATION/contracts.md §"Self-hosting".
  #
  # This library is a sibling consumer of its own coordination surface, but the
  # release fan-out (`reusable-release-dispatch.yml`) deliberately EXCLUDES the
  # publishing repository from its dispatch matrix so a release does not echo
  # back to itself. Consequently no `sibling-released` dispatch announcing THIS
  # library's own release ever arrives here, and a SELF-SOURCED pin — one whose
  # source repo is this library — is structurally unreachable by the dispatch
  # path that reconciles every other pin. Two formats are self-sourced today and
  # this job reconciles BOTH:
  #
  #   - `fabro_sandbox_docker_image` — the `container: image:` tag in this
  #     repo's own `.github/workflows/ci.yml`, whose source repo is HARDCODED to
  #     `livespec-dev-tooling` (the repository that builds and releases it).
  #   - `github_workflow_uses_ref` — this repo's own `uses:` refs into its own
  #     reusable workflows (the consumer shims `release-dispatch.yml`,
  #     `bump-pin-from-dispatch.yml`, `pin-freshness.yml`, `release-park.yml`),
  #     whose source repo derives to this library from the `<repo>` segment.
  #
  # The pin set is DISCOVERED by the shipped autodiscovery walk rather than
  # enumerated here, so a newly-added self-sourced pin is picked up without
  # editing this workflow (and the enumeration above cannot rot into a lie).
  #
  # `needs: build` is load-bearing, not cosmetic: per §"Self-hosting" the image
  # tag MUST NOT be rewritten before the released image exists, or CI gets
  # pinned to a tag nothing ever pushed. Depending on the build job makes that
  # ordering hold STRUCTURALLY rather than by hope. (A `uses:` ref carries no
  # such constraint — its tag exists the moment the release is published — but
  # both formats share this job, so both simply wait.)
  #
  # This cannot recurse: the composite Action commits with the `chore(deps):`
  # convention, and a `chore:` commit cuts no release
  # (§"PR commit-message convention").
  # ---------------------------------------------------------------------------
  self-reconcile-pins:
    name: self-reconcile-pins
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      # Branch from the CURRENT default-branch tip, not the release-tagged
      # commit. The release commit is normally the tip, but if master has moved
      # since, rewriting against the stale tree would open a bump PR that is
      # BEHIND and may conflict. The pins being reconciled are a property of
      # current master, so master is the correct base.
      - name: Checkout master with App token
        uses: actions/checkout@v5
        with:
          ref: master
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      # The shared `bump-pin-rewrite` composite Action resolves its rewrite
      # modules via `uv run --project .livespec-dev-tooling` — the caller-side
      # support checkout every CONSUMER of the dispatch path materializes. Self-
      # hosting is the same shape with the same repo on both ends, so we
      # materialize it identically rather than special-casing the Action. The
      # Action git-excludes this path, so it never lands in the bump commit.
      - name: Checkout livespec-dev-tooling support modules
        uses: actions/checkout@v5
        with:
          repository: thewoolleyman/livespec-dev-tooling
          path: .livespec-dev-tooling
          fetch-depth: 1

      - name: Install pinned binaries via mise
        uses: jdx/mise-action@v4

      - name: Install Python deps via uv
        run: uv sync --all-groups

      - name: Run pin-autodiscovery for self-sourced pins
        id: autodiscover
        run: |
          set -euo pipefail
          records=$(uv run --project .livespec-dev-tooling python -m \
            livespec_dev_tooling.cross_repo.pin_autodiscovery \
            --root . --source-repo livespec-dev-tooling)
          echo "::group::self-sourced pin-autodiscovery records"
          echo "$records"
          echo "::endgroup::"
          count=$(echo "$records" | jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          {
            echo 'records<<JSONEOF'
            echo "$records"
            echo 'JSONEOF'
          } >> "$GITHUB_OUTPUT"

      - name: No-op when zero self-sourced pins
        if: steps.autodiscover.outputs.count == '0'
        run: |
          echo "::notice::no self-sourced pins discovered; nothing to reconcile (spec §\"Self-hosting\")"

      - name: Compose PR body
        if: steps.autodiscover.outputs.count != '0'
        id: pr_body
        env:
          TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          set -euo pipefail
          body=$(printf 'Automated producer-side reconcile of this repository'"'"'s OWN self-sourced pins to %s.\n\nRelease: %s\n\nThe release fan-out excludes the publishing repository from its dispatch matrix, so these pins are unreachable by the `sibling-released` path that reconciles every other pin. They are reconciled here instead, per `SPECIFICATION/contracts.md` §"Self-hosting".\n' \
            "$TAG" "$RELEASE_URL")
          {
            echo 'body<<BODYEOF'
            echo "$body"
            echo 'BODYEOF'
          } >> "$GITHUB_OUTPUT"

      # Reuses the SAME rewrite machinery as the dispatch path, per
      # §"Self-hosting" — notably the prefix-preserving
      # `fabro_image_pin_rewrite`, which rewrites only the trailing `vX.Y.Z` and
      # preserves the `python-` / `python-rust-` layer prefix. That is why the
      # bare release tag is the correct `tag` input for BOTH formats at once.
      - name: Rewrite self-sourced pins + commit + open auto-merge PR
        if: steps.autodiscover.outputs.count != '0'
        uses: ./.github/actions/bump-pin-rewrite
        with:
          source_repo: livespec-dev-tooling
          tag: ${{ github.event.release.tag_name }}
          records: ${{ steps.autodiscover.outputs.records }}
          branch_prefix: chore/self-bump
          pr_body: ${{ steps.pr_body.outputs.body }}
          app_token: ${{ steps.app-token.outputs.token }}
          app_slug: ${{ steps.app-token.outputs.app-slug }}
