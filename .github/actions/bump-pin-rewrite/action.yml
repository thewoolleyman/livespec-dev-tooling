# bump-pin-rewrite composite Action — shared pin-rewrite + auto-merge-PR body.
#
# Authority: SPECIFICATION/contracts.md §"Composite Actions wire contract"
#   and §"Cross-repo coordination automation surface".
#
# Performs the duplicated tail of both reusable bump-PR workflows
# (reusable-bump-pin-from-dispatch.yml, reusable-pin-freshness.yml):
#   1. Configure git identity from the supplied App slug.
#   2. Create a bump branch named `<branch_prefix>-<source_repo>-<tag>`.
#   3. Rewrite every matching pin in `records` to `tag` per
#      SPECIFICATION/contracts.md §"Pin autodiscovery rules" — one case
#      per `pin_format` value, identical to the pre-extraction inline
#      step block in both reusable workflows.
#   4. When any record carries `pin_format == "vendor_jsonc"`, invoke
#      the consumer's `just vendor-update <lib>` recipe so re-vendoring
#      lands atomically in the same commit per
#      §"reusable-bump-pin-from-dispatch.yml" .vendor.jsonc clause.
#   5. Commit with the `chore(deps): bump <source_repo> pin to <tag>`
#      message per §"PR commit-message convention" and push the branch.
#   6. Open the bump PR with the supplied title and body, then enable
#      `--auto --rebase` per
#      SPECIFICATION/non-functional-requirements.md §"Commit and merge
#      discipline". The auto-merge-enable failure surfaces as a
#      `::error::` per li-u7any4 (no swallowed warnings).
#
# This Action deliberately does NOT run the consumer's `just check`:
# per SPECIFICATION/contracts.md §"Fallback to known-good pin", the
# authoritative gate is the consumer's OWN CI / branch-protection
# status checks on the opened auto-merge PR — NOT an in-Action check
# run in this incomplete CI environment (which lacks the consumer's
# installed plugin, its `.livespec-core` checkout, and its installed
# hooks, so a faithful `just check` is not reconstructable here). The
# `--auto` merge defers until the consumer's required checks pass; a
# failure surfaces on the PR's status checks and the human contributor
# handles resolution per the spec's manual-pin path. This is why no
# commit-refuse-hook install step precedes the commit: nothing in this
# Action runs the byte-identity verifier that step existed to satisfy.
#
# Secrets cannot be passed to composite Actions directly; the App token
# and App slug arrive as inputs from the calling reusable workflow,
# which has already minted both via `actions/create-github-app-token@v3`
# at a job-scope step.
#
# Inputs:
#   source_repo (required) — publishing repository's short name, used
#     in branch naming, commit message, and PR title.
#   tag (required) — published release tag — every matching pin gets
#     rewritten to this value into the bump commit.
#   records (required) — JSON-encoded autodiscovery records array (the
#     `records` GITHUB_OUTPUT from the caller's autodiscovery step).
#     Each record is `{pin_format, file_path, pin_key, current_value,
#     source_repo}` per
#     `livespec_dev_tooling.cross_repo.pin_autodiscovery`'s contract.
#   branch_prefix (required) — branch-name prefix; the actual branch is
#     `<branch_prefix>-<source_repo>-<tag>`. Callers use
#     `chore/bump` (dispatch path) or `chore/freshness-bump`
#     (cron-freshness path) to disambiguate the two surfaces.
#   pr_body (required) — Markdown body for the bump PR. The caller
#     templates this with its own provenance line (release_url for the
#     dispatch path; "periodic safety-net scan caught a stale pin" for
#     the freshness path).
#   app_token (required) — minted GitHub App installation token from
#     the caller's `actions/create-github-app-token@v3` step. Used for
#     both git commit/push auth and `gh pr create`/`gh pr merge`.
#   app_slug (required) — the App's slug from the same mint step. Used
#     for the git committer identity (`<slug>[bot]`).

name: bump-pin-rewrite
description: Shared pin-rewrite + commit + auto-merge-PR body for the two reusable bump-PR workflows.

inputs:
  source_repo:
    description: Publishing repository short name (used in branch naming, commit message, and PR title).
    required: true
  tag:
    description: Published release tag — every matching pin gets rewritten to this value into the bump commit.
    required: true
  records:
    description: JSON-encoded autodiscovery records array from the caller's pin-autodiscovery step.
    required: true
  branch_prefix:
    description: Branch-name prefix (e.g., `chore/bump` or `chore/freshness-bump`); branch becomes `<prefix>-<source_repo>-<tag>`.
    required: true
  pr_body:
    description: Markdown body for the bump PR.
    required: true
  app_token:
    description: Minted GitHub App installation token (from the caller's `actions/create-github-app-token@v3` step).
    required: true
  app_slug:
    description: GitHub App slug (from the same mint step) — used for the git committer identity.
    required: true
  no_auto_merge:
    description: >-
      When 'true', open the bump PR WITHOUT enabling auto-merge (the codex-acp
      factory-gate path per SPECIFICATION/contracts.md §"codex-acp factory gate":
      the PR merges only once the orchestrator's live golden-master gate posts a
      green status and enables auto-merge). Defaults to 'false' — the standard
      fleet-release bump path keeps `--auto --rebase` enablement.
    required: false
    default: 'false'

outputs:
  changed:
    description: >
      'true' when the pin rewrite produced a change that was committed, pushed,
      and opened as a bump PR; 'false' when the rewrite produced no change and
      this Action no-opped (livespec-dev-tooling-bmf). A caller with a follow-up
      step that requires the bump PR to exist — e.g. the codex-acp
      golden-master gate dispatch, which looks the PR up by branch name — MUST
      gate that step on this output, because on the 'false' path no branch was
      pushed and no PR was opened.
    value: ${{ steps.commit.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Configure git identity
      shell: bash
      env:
        APP_SLUG: ${{ inputs.app_slug }}
      run: |
        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

    - name: Create bump branch
      id: branch
      shell: bash
      env:
        SOURCE_REPO: ${{ inputs.source_repo }}
        TAG: ${{ inputs.tag }}
        BRANCH_PREFIX: ${{ inputs.branch_prefix }}
      run: |
        set -euo pipefail
        branch="${BRANCH_PREFIX}-${SOURCE_REPO}-${TAG}"
        git checkout -b "$branch"
        echo "name=$branch" >> "$GITHUB_OUTPUT"

    - name: Rewrite matching pins to new tag
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        RECORDS: ${{ inputs.records }}
      run: |
        set -euo pipefail
        # Per spec §"Pin autodiscovery rules", the rewrite is per-format:
        #   - livespec_jsonc_compat_pinned: `compat.pinned` targeted rewrite
        #   - pyproject_toml_uv_sources: regex on the `tag = "X"` field
        #   - vendor_jsonc: `upstream_ref` targeted rewrite
        #   - github_workflow_uses_ref: `uses: <key>@<ref>` targeted rewrite
        #   - fabro_sandbox_docker_image: `docker = "<key>:<tag>"` (Fabro
        #     workflow.toml) or `image: <key>:<tag>` under a job `container:`
        #     block (.github/workflows) targeted rewrite — one record, and so
        #     one invocation, per matching line
        #   - codex_acp_docker_arg: `ARG CODEX_ACP_VERSION=<value>` bare-value rewrite
        echo "$RECORDS" | jq -c '.[]' | while read -r rec; do
          fmt=$(echo "$rec" | jq -r '.pin_format')
          file=$(echo "$rec" | jq -r '.file_path')
          key=$(echo "$rec" | jq -r '.pin_key')
          current=$(echo "$rec" | jq -r '.current_value')
          case "$fmt" in
            livespec_jsonc_compat_pinned)
              PIN_FORMAT="$fmt" PIN_FILE="$file" PIN_KEY="$key" PIN_CURRENT="$current" PIN_TAG="$TAG" \
                uv run --project .livespec-dev-tooling python -m livespec_dev_tooling.cross_repo.pin_rewrite
              ;;
            pyproject_toml_uv_sources)
              PIN_FORMAT="$fmt" PIN_FILE="$file" PIN_KEY="$key" PIN_CURRENT="$current" PIN_TAG="$TAG" \
                uv run --project .livespec-dev-tooling python -m livespec_dev_tooling.cross_repo.pin_rewrite
              ;;
            vendor_jsonc)
              PIN_FORMAT="$fmt" PIN_FILE="$file" PIN_KEY="$key" PIN_CURRENT="$current" PIN_TAG="$TAG" \
                uv run --project .livespec-dev-tooling python -m livespec_dev_tooling.cross_repo.pin_rewrite
              ;;
            github_workflow_uses_ref)
              PIN_FORMAT="$fmt" PIN_FILE="$file" PIN_KEY="$key" PIN_CURRENT="$current" PIN_TAG="$TAG" \
                uv run --project .livespec-dev-tooling python -m livespec_dev_tooling.cross_repo.pin_rewrite
              ;;
            fabro_sandbox_docker_image)
              # Prefix-preserving rewrite (livespec-3lev.4): since the layer
              # split, the fabro-sandbox pin carries a <layer>- prefix
              # (python-/python-rust-) over the vX.Y.Z release. A bare-$TAG
              # rewrite would drop that prefix and break the pin on the next
              # release, so the tag rewrite lives in the typed, unit-tested
              # livespec_dev_tooling.cross_repo.fabro_image_pin_rewrite module
              # (behavioral coverage the inline heredoc never had) — it rewrites
              # only the version and preserves the prefix. `.livespec-dev-tooling`
              # is the caller-side support checkout (see the Reconcile step).
              PIN_FILE="$file" PIN_KEY="$key" PIN_CURRENT="$current" PIN_TAG="$TAG" \
                uv run --project .livespec-dev-tooling python -m livespec_dev_tooling.cross_repo.fabro_image_pin_rewrite
              ;;
            codex_acp_docker_arg)
              # External-source (npm) bare-value ARG pin: rewrite the
              # `ARG CODEX_ACP_VERSION=<version>` line in the base-layer
              # Dockerfile via the typed, unit-tested
              # livespec_dev_tooling.cross_repo.codex_acp_pin_rewrite module
              # (behavioral coverage the inline heredoc never had). Per
              # SPECIFICATION/contracts.md §"codex-acp factory gate" this pin's
              # source is the external npm package @zed-industries/codex-acp, so
              # a bump is factory-gated (the caller opens the PR with
              # no_auto_merge='true'). `.livespec-dev-tooling` is the caller-side
              # support checkout (see the Reconcile step).
              PIN_FILE="$file" PIN_KEY="$key" PIN_CURRENT="$current" PIN_TAG="$TAG" \
                uv run --project .livespec-dev-tooling python -m livespec_dev_tooling.cross_repo.codex_acp_pin_rewrite
              ;;
            unrecognized)
              echo "::warning::skipping unrecognized pin in $file"
              ;;
            *)
              echo "::error::unhandled pin_format '$fmt' for $file (pin_key=$key)"
              exit 1
              ;;
          esac
        done

    - name: Re-vendor when .vendor.jsonc carries the source
      shell: bash
      env:
        SOURCE_REPO: ${{ inputs.source_repo }}
        RECORDS: ${{ inputs.records }}
      run: |
        set -euo pipefail
        # Per §"reusable-bump-pin-from-dispatch.yml": when
        # `.vendor.jsonc` carries an entry for the normalized form of
        # `source_repo`, invoke `just vendor-update <lib>` so the
        # re-vendoring lands atomically in the same commit. The
        # normalized name is the `pin_key` of the `vendor_jsonc`
        # record (already hyphen-to-underscore normalized).
        vendor_keys=$(echo "$RECORDS" | jq -r '.[] | select(.pin_format == "vendor_jsonc") | .pin_key')
        if [[ -z "$vendor_keys" ]]; then
          echo "::notice::no .vendor.jsonc entry for $SOURCE_REPO; skipping vendor-update"
          exit 0
        fi
        for lib in $vendor_keys; do
          echo "::notice::running just vendor-update $lib"
          just vendor-update "$lib"
        done

    - name: Refresh uv.lock for bumped pyproject pins
      shell: bash
      env:
        RECORDS: ${{ inputs.records }}
      run: |
        set -euo pipefail
        # Per livespec-glv6: the calling reusable workflow runs
        # `uv sync --all-groups` BEFORE this Action rewrites the pin, so
        # that sync re-locks uv.lock against the PRE-bump pyproject tag.
        # Without re-locking AFTER the rewrite, the committed uv.lock lags
        # the bumped pin by one release (the lock keeps the prior tag while
        # pyproject advances). Re-lock each bumped uv-sources package so the
        # committed lock matches the pin it ships beside; `--refresh-package`
        # defeats a stale uv git-ref cache that would otherwise re-resolve
        # the just-pushed tag to the previously-cached ref. Only
        # `pyproject_toml_uv_sources` pins touch uv.lock — `compat.pinned`,
        # `.vendor.jsonc`, and workflow `uses:` refs do not.
        pkgs=$(echo "$RECORDS" | jq -r '.[] | select(.pin_format == "pyproject_toml_uv_sources") | .pin_key')
        if [[ -z "$pkgs" ]]; then
          echo "::notice::no [tool.uv.sources] pin among the bumped records; uv.lock unaffected"
          exit 0
        fi
        refresh_args=()
        for pkg in $pkgs; do
          refresh_args+=(--refresh-package "$pkg")
        done
        echo "::notice::refreshing uv.lock for: ${pkgs//$'\n'/ }"
        uv lock "${refresh_args[@]}"
        # Re-SYNC the consumer's venv against the just-relocked pin. The
        # calling reusable workflow syncs BEFORE the rewrite, so without
        # this the venv still holds the PRE-bump livespec-dev-tooling for
        # the rest of this job — and every step below that resolves
        # canonical data or runs a `just` recipe out of the consumer's own
        # environment (the canonical-slug capture, the canonical-slugs
        # projection re-stamp) would read the OLD version's answer while
        # the committed pin says the new one.
        uv sync --all-groups

    - name: Reconcile canonical tool pins
      if: ${{ inputs.source_repo == 'livespec-dev-tooling' }}
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
      run: |
        set -euo pipefail
        # The support checkout is executable TOOLING and can be newer than the
        # source release. Fetch the exact released tag so pin DATA comes from
        # the artifact being fanned out, then delegate the structured rewrite
        # to the typed/tested module shipped by the support checkout.
        mise_file=".mise.toml"
        if [[ ! -f "$mise_file" ]]; then
          echo "::error::consumer .mise.toml not found; cannot project the released shellcheck pin for check-shell-quality"
          exit 1
        fi
        released_mise=$(mktemp)
        trap 'rm -f "$released_mise"' EXIT
        git -C .livespec-dev-tooling fetch --depth=1 origin "refs/tags/${TAG}"
        git -C .livespec-dev-tooling show FETCH_HEAD:.mise.toml > "$released_mise"
        RELEASED_MISE_FILE="$released_mise" CONSUMER_MISE_FILE="$mise_file" \
          uv run --project .livespec-dev-tooling python -m \
          livespec_dev_tooling.cross_repo.tool_pin_projection

    - name: Reconcile canonical check wiring
      shell: bash
      run: |
        set -euo pipefail
        # When the bumped livespec-dev-tooling release adds a new module
        # under livespec_dev_tooling/checks/, the live canonical slug set
        # grows. Consumers that already run check-aggregate-completeness
        # must adopt that new slug in the same bump commit, or the bump PR
        # is guaranteed to fail before the new check can propagate.
        #
        # The reconcile logic lives in the typed, unit-tested module
        # livespec_dev_tooling.cross_repo.justfile_canonical_reconcile
        # (extracted from a former inline heredoc so the recipe-presence
        # guard is testable). That guard now recognizes a canonical slug's
        # recipe in ANY header form — bare `check-<slug>:`, variadic
        # `check-<slug> *args:`, or named-param — not just the bare form, so
        # a hand-defined parameterized recipe (e.g. both Driver repos'
        # `check-red-green-replay *args:`) is never re-appended as a
        # duplicate that breaks the consumer's `just` parse. The module
        # reads the justfile in cwd, the canonical set from $CANONICAL_JSON,
        # and emits the same `::notice::` annotations this step always did.
        #
        # TOOL vs DATA — the distinction that keeps this reconcile honest.
        # The canonical slug set is a FILESYSTEM WALK of whatever
        # livespec_dev_tooling.checks package is RUNNING. The support
        # checkout .livespec-dev-tooling/ is this repo at MASTER (the
        # calling workflow checks it out with no `ref:`), which is ahead of
        # every consumer's pin — so resolving the canonical DATA there
        # injected slugs the consumer's PINNED aggregate-completeness gate
        # does not recognize, landing them interleaved inside its canonical
        # block and reddening the bump PR by construction
        # (`out_of_order_canonical_slugs`). The canonical DATA therefore
        # comes from the CONSUMER's own environment — plain `uv run`, no
        # --project — so the reconcile and the gate derive the set from the
        # SAME version and agree BY CONSTRUCTION at whatever the consumer
        # pins. The reconcile MODULE below is the TOOL, not the data: it is
        # deliberately still run from the master support checkout, because a
        # consumer's pinned release predates the fix and would not carry it.
        #
        # The aggregate-slug guard makes the consumer-env resolution safe:
        # a repo that wires check-aggregate-completeness runs
        # `uv run python -m livespec_dev_tooling.checks.aggregate_completeness`
        # as its own recipe, so livespec_dev_tooling is importable from its
        # environment by construction. A repo that does not is skipped here
        # exactly as the module itself would skip it.
        if [[ ! -f justfile ]]; then
          echo "::notice::no justfile found; skipping canonical check wiring reconcile"
          exit 0
        fi
        if ! grep -q 'check-aggregate-completeness' justfile; then
          echo "::notice::consumer does not carry check-aggregate-completeness; skipping canonical check wiring reconcile"
          exit 0
        fi
        canonical_json=$(uv run python -m livespec_dev_tooling.canonical_checks --json)
        CANONICAL_JSON="$canonical_json" uv run --project .livespec-dev-tooling python -m livespec_dev_tooling.cross_repo.justfile_canonical_reconcile

    - name: Reconcile canonical CI matrix wiring
      shell: bash
      run: |
        set -euo pipefail
        # The ci.yml half of the reconcile above. check-ci-matrix-completeness
        # asserts the canonical slugs CI RUNS are a SUPERSET of the canonical
        # slugs the justfile `check:` aggregate WIRES. The step above just grew
        # that aggregate — which is precisely what makes the consumer's
        # hand-maintained strategy.matrix.target list short the new entries.
        # Reconciling the justfile ALONE therefore traded one guaranteed-red
        # bump PR for another, on a different check with the same root cause.
        #
        # Same TOOL-vs-DATA split as the step above: the canonical set is DATA
        # captured from the CONSUMER's own environment (plain `uv run`), while
        # the reconcile MODULE is the TOOL, run from the master support checkout
        # because the consumer's pinned release predates it. The module inserts
        # each newly-adopted canonical slug, in alphabetical position, into the
        # matrix target list that already carries check-aggregate-completeness,
        # subtracting the world-gate checks that ci_matrix_completeness itself
        # subtracts and skipping any slug CI already runs elsewhere. If a
        # consumer has slugs to adopt but NO such matrix, the module emits an
        # `::error::` naming the exact lines to add and exits non-zero — failing
        # this job rather than opening a PR that is red by construction.
        if [[ ! -f justfile ]]; then
          echo "::notice::no justfile found; skipping canonical CI matrix reconcile"
          exit 0
        fi
        if ! grep -q 'check-aggregate-completeness' justfile; then
          echo "::notice::consumer does not carry check-aggregate-completeness; skipping canonical CI matrix reconcile"
          exit 0
        fi
        canonical_json=$(uv run python -m livespec_dev_tooling.canonical_checks --json)
        CANONICAL_JSON="$canonical_json" uv run --project .livespec-dev-tooling python -m livespec_dev_tooling.cross_repo.ci_yaml_canonical_reconcile

    - name: Assert ShellCheck pin is gated
      if: ${{ inputs.source_repo == 'livespec-dev-tooling' }}
      shell: bash
      run: |
        set -euo pipefail
        # Contract declaration for the ShellCheck rollout: any consumer that
        # receives the released ShellCheck tool pin from livespec-dev-tooling
        # must also carry the check-shell-quality gate in the same bump commit.
        # Sentinel-less consumers used to skip both canonical reconcile steps
        # with notices and still commit the pin; this invariant fails closed
        # after reconcile has had its chance to wire the check.
        uv run --project .livespec-dev-tooling python -m livespec_dev_tooling.cross_repo.shellcheck_pin_gate

    - name: Re-stamp canonical-slugs projection
      shell: bash
      run: |
        set -euo pipefail
        # Per livespec-y9lb: the "Reconcile canonical check wiring" step
        # above may add a newly-released canonical slug to the justfile
        # `check:` aggregate. A repo that also carries the copier-template
        # projection (`templates/orchestrator-plugin/canonical-slugs.yml`,
        # regenerated by `just stamp-canonical-slugs`) MUST re-stamp it in
        # the SAME bump commit, or the committed projection drifts from the
        # source of truth and reddens master on
        # `check-canonical-slugs-projection` and `check-copier-template-smoke`
        # until hand-repaired (observed on the v0.36.0 bump; repaired ad-hoc
        # via livespec PR #1008).
        #
        # The stamp runs the consumer's OWN `stamp-canonical-slugs` recipe —
        # the identical generator its `check-canonical-slugs-projection`
        # verifier runs on the same branch — so the written projection and
        # the verifier's expectation agree by construction, whatever
        # dev-tooling version the consumer resolves.
        #
        # Fail-soft: only the copier-template-carrying repo exposes this
        # recipe; every other consumer skips with a notice. Delegates to the
        # task runner (`just`), never the underlying generator directly, per
        # the single-source-of-truth task-runner discipline.
        if [[ -f justfile ]] && grep -qE '^stamp-canonical-slugs:' justfile; then
          just stamp-canonical-slugs
          echo "::notice::re-stamped canonical-slugs projection"
        else
          echo "::notice::consumer has no stamp-canonical-slugs recipe; skipping projection re-stamp"
        fi

    - name: Commit + push bump branch
      id: commit
      shell: bash
      env:
        SOURCE_REPO: ${{ inputs.source_repo }}
        TAG: ${{ inputs.tag }}
        BRANCH: ${{ steps.branch.outputs.name }}
      run: |
        set -euo pipefail
        # Per §"PR commit-message convention": `chore(deps):` prefix is
        # REQUIRED so release-please does NOT cut a version bump from
        # this commit (which would trigger another round of bump PRs in
        # every sibling — the cycle the convention prevents).
        # The calling reusable workflow checks out livespec-dev-tooling
        # support modules to ./.livespec-dev-tooling — a nested git repo
        # inside the consumer work tree. A blind `git add -A` would stage it
        # as a stray gitlink (mode 160000) with no .gitmodules entry,
        # polluting the consumer's master (livespec-dev-tooling-8ml; observed
        # on the v0.12.0 fan-out). Exclude it locally (ephemeral, never
        # committed) so it is never staged.
        printf '%s\n' '/.livespec-dev-tooling/' >> "$(git rev-parse --git-dir)/info/exclude"
        git add -A
        # Defense-in-depth: refuse to commit any staged gitlink (mode
        # 160000). The family uses no submodules, so a staged gitlink can
        # only be a stray nested-checkout footgun. Fail loud rather than
        # silently pollute a consumer's master (livespec-dev-tooling-8ml).
        if git diff --cached --raw | awk '{ print $2 }' | grep -q '^160000$'; then
          echo "::error::refusing to commit a stray gitlink (mode 160000) — a nested checkout leaked into the bump commit" >&2
          git diff --cached --raw | awk '$2 == "160000" { print "  stray gitlink: " $NF }' >&2
          exit 1
        fi
        # A rewrite that produced NO change is a no-op, not an error
        # (livespec-dev-tooling-bmf). Without this guard `git add -A` stages
        # nothing, `git commit` exits non-zero with "nothing to commit,
        # working tree clean", and the `set -e` above fails the whole step —
        # reporting a no-op as a hard failure and leaving the fleet's only
        # pin-propagation backstop permanently red, so its status carries no
        # information.
        #
        # Detected BEFORE the commit rather than by suffixing the commit with
        # `|| true`: that would ALSO swallow a genuine commit failure,
        # converting this false positive into the false-NEGATIVE class
        # tracked as livespec-dev-tooling-ews (a stale pin silently never
        # flagged). `git diff --cached --quiet` exits 0 exactly when nothing
        # is staged, so "nothing to do" and "the commit failed" stay
        # distinguishable.
        #
        # The notice below states ONLY what this step establishes — that the
        # rewrite changed nothing. It deliberately does NOT claim the pin is
        # already current: a pin whose tag format differs from the release
        # tag it is compared against (e.g. the `python-`-prefixed Fabro
        # sandbox image tag `python-vX.Y.Z` compared against the bare release
        # tag `vX.Y.Z`) is reported stale by the staleness comparison for
        # every sweep, and then rewrites to nothing. This guard stops that
        # from surfacing as a build failure; it does NOT fix the comparison,
        # which is tracked separately as the prefixed-tag comparison defect.
        if git diff --cached --quiet; then
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "::notice::pin rewrite for ${SOURCE_REPO} to ${TAG} produced no change; nothing to commit — skipping bump branch push and PR"
          exit 0
        fi
        echo "changed=true" >> "$GITHUB_OUTPUT"
        git commit -m "chore(deps): bump ${SOURCE_REPO} pin to ${TAG}"
        git push -u origin "$BRANCH"

    - name: Open auto-merge PR
      # Skipped on the no-op path (livespec-dev-tooling-bmf): when the rewrite
      # produced no change the commit step pushed no branch and made no
      # commit, so there is nothing to open a PR from and `gh pr create` would
      # fail against a missing branch.
      if: ${{ steps.commit.outputs.changed == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.app_token }}
        SOURCE_REPO: ${{ inputs.source_repo }}
        TAG: ${{ inputs.tag }}
        PR_BODY: ${{ inputs.pr_body }}
        BRANCH: ${{ steps.branch.outputs.name }}
        NO_AUTO_MERGE: ${{ inputs.no_auto_merge }}
        RECORDS: ${{ inputs.records }}
      run: |
        set -euo pipefail
        # `-e` is deliberate and matches the eight other steps in this Action
        # (livespec-dev-tooling-7m1). It was previously absent here alone, which
        # left a failing `gh pr create` below unhandled: execution fell through
        # to the auto-merge enablement, where it either got MASKED (a PR for the
        # branch already existed, so `gh pr merge` succeeded and the step
        # reported success despite creation having failed) or MISDIAGNOSED (the
        # `::error::` blamed auto-merge and pointed the reader at the
        # allow_auto_merge / branch-protection causes listed below, none of which
        # were the actual fault). Keeping `-e` does NOT interfere with the
        # `if merge_err=$(...)` capture idiom this step depends on: POSIX exempts
        # commands in an `if` condition from `-e`, so the else-branch still runs
        # and still yields the captured stderr.
        #
        # Per livespec-dev-tooling SPECIFICATION/non-functional-requirements.md
        # §"Commit and merge discipline": merge strategy MUST be
        # rebase-merge so Conventional Commits subjects land intact on
        # master (release-please reads them). Hence `--rebase`, not
        # `--squash`.
        #
        # Per li-u7any4: the prior `gh pr merge ... --auto --squash ||
        # echo "::warning::..."` pattern swallowed the merge-enablement
        # failure, leaving bump PRs open with `autoMergeRequest: null`.
        # The fix mirrors the canonical
        # livespec/.github/workflows/auto-enable-merge.yml pattern:
        # capture stderr, surface the failure as `::error::`, and exit
        # non-zero so the workflow run summary makes the diagnostic
        # actionable instead of vanishing into a warning buried among
        # Node-20-deprecation noise.
        #
        # Common causes of merge-enablement failure for the consumer to
        # investigate when this step fails:
        #   - Repo `allow_auto_merge` setting is `false`
        #     (Settings > General > Pull Requests > Allow auto-merge).
        #   - Branch-protection rules / rulesets on the base branch do
        #     not require status checks, which `--auto` needs to defer
        #     the merge until checks pass.
        gh pr create \
          --title "chore(deps): bump ${SOURCE_REPO} pin to ${TAG}" \
          --body "$PR_BODY" \
          --head "$BRANCH" \
          --base master

        open_prs=$(gh pr list --state open --limit 100 --json number,headRefName,title)
        close_plan=$(OPEN_PRS="$open_prs" RECORDS="$RECORDS" CONSUMER="${GITHUB_REPOSITORY#*/}" \
          uv run --project .livespec-dev-tooling python -m livespec_dev_tooling.cross_repo.bump_pr_supersession)
        close_count=$(echo "$close_plan" | jq 'length')
        if [[ "$close_count" == "0" ]]; then
          echo "::notice::no superseded bump PRs to close for ${SOURCE_REPO} ${TAG}"
        else
          echo "::notice::closing ${close_count} superseded bump PR(s) for ${SOURCE_REPO}"
          closed_current=false
          while read -r decision; do
            number=$(echo "$decision" | jq -r '.number')
            branch=$(echo "$decision" | jq -r '.branch')
            comment=$(echo "$decision" | jq -r '.comment')
            if [[ "$branch" == "$BRANCH" ]]; then
              closed_current=true
            fi
            gh pr close "$number" --comment "$comment" --delete-branch
          done < <(echo "$close_plan" | jq -c '.[]')
          if [[ "$closed_current" == "true" ]]; then
            echo "::notice::the just-opened PR for ${BRANCH} was superseded and closed; skipping auto-merge enablement"
            exit 0
          fi
        fi

        # Per SPECIFICATION/contracts.md §"codex-acp factory gate": the
        # codex-acp bump PR is opened WITHOUT auto-merge (no_auto_merge=true) so
        # it cannot merge on its own — the orchestrator's live golden-master
        # gate enables auto-merge only after a green run. Every other
        # (fleet-release) bump PR keeps the standard `--auto --rebase`
        # enablement below.
        if [[ "$NO_AUTO_MERGE" == "true" ]]; then
          echo "::notice::opened PR for ${BRANCH} WITHOUT auto-merge (codex-acp factory-gate path); the golden-master gate enables merge on a green run"
          exit 0
        fi
        if merge_err=$(gh pr merge "$BRANCH" --repo "$GITHUB_REPOSITORY" --auto --rebase 2>&1); then
          echo "Auto-merge enabled on PR for ${BRANCH} (rebase strategy)"
        else
          echo "::error::failed to enable auto-merge on PR for ${BRANCH}: ${merge_err}"
          exit 1
        fi
