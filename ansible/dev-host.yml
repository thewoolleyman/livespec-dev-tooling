---
# The maintainer's dev host, migrated from the `vps-info` repository.
#
# This machine is also the Ansible control node, so it manages itself over a
# local connection: a run needs no ssh credential toward it and no inbound
# reachability to it.
#
# Order matters in one place, and it is expressed as a role dependency rather
# than by position here, so a play that runs one role alone still gets it: the
# VNC desktop precedes the two desktop applications that need its display.
#
# The VS Code web editor (roles code_serve_web and code_pwa_proxy) was RETIRED
# on 2026-10-16 by the maintainer: the service is shut down and will not be
# restarted, so this play no longer converges it.

# Each role is tagged so an operator can converge a subset. That matters here
# because this host carries services with very different interruption costs --
# a timer is free to restart, a desktop session is not -- and because a
# failure in one role's package step must not be able to withhold the other
# seventeen.
- name: Dev host services
  hosts: dev_hosts
  gather_facts: true
  roles:
    - role: arq_root_snapshot
      tags: [arq_root_snapshot]
    - role: arq_docker_volume_snapshot
      tags: [arq_docker_volume_snapshot]
    - role: arq_smb_source
      tags: [arq_smb_source]
    - role: restic_backup
      tags: [restic_backup]
    - role: vnc_desktop
      tags: [vnc_desktop]
    - role: onepassword_desktop
      tags: [onepassword_desktop]
    - role: claude_desktop
      tags: [claude_desktop]
    - role: btop_loop
      tags: [btop_loop]
    - role: fpart
      tags: [fpart]
    - role: ssh_hardening
      tags: [ssh_hardening]
    - role: keyring_quota
      tags: [keyring_quota]
    - role: tmux_config
      tags: [tmux_config]
    - role: claude_code_hooks
      tags: [claude_code_hooks]
    - role: claude_ntfy
      tags: [claude_ntfy]
    - role: codex_config
      tags: [codex_config]
    - role: honeycomb_mcp
      tags: [honeycomb_mcp]
    - role: honeycomb_trigger_recipients_check
      tags: [honeycomb_trigger_recipients_check]
    - role: otel_collector
      tags: [otel_collector]
    - role: pressure_telemetry
      tags: [pressure_telemetry]
    # The pinned Fabro CLIENT builds a Dispatcher running natively here execs
    # through a committed `dispatcher.factories.<name>.bin`, staged from a
    # digest-verified control-node source and never by hand. See
    # SPECIFICATION/non-functional-requirements.md §"Dev host Fabro client
    # builds" and the role's HOST_VARS.md.
    - role: fabro_client
      tags: [fabro_client]
    - role: dev_host_retention
      tags: [dev_host_retention]
    # The host-wide bound on how many fleet gate test runs execute at once
    # here. The limit is ONE committed value (`local_gate_slots_limit`) and
    # removing it returns the host to no limit; see the role's HOST_VARS.md and
    # SPECIFICATION/non-functional-requirements.md section "Local gate
    # concurrency limit".
    - role: local_gate_slots
      tags: [local_gate_slots]
    # On this VPS, proactive compaction could repeatedly chase an unreachable
    # fragmentation target and burn a core; the role leaves on-demand paths
    # alone. See its managed drop-in for the host measurement and rationale.
    - role: dev_host_compaction
      tags: [dev_host_compaction]
    # The independent released incident observer (livespec-dev-tooling-w7n3ad):
    # loopback listener first, then the tailnet front that publishes it from
    # this host's tailscale_serve_mappings. Both run under the credential
    # wrapper; see roles/incident_observer/README.md.
    - role: incident_observer
      tags: [incident_observer]
    - role: tailscale_serve
      tags: [tailscale_serve]
