---
# The maintainer's dev host, migrated from the `vps-info` repository.
#
# This machine is also the Ansible control node, so it manages itself over a
# local connection: a run needs no ssh credential toward it and no inbound
# reachability to it.
#
# Order matters in two places, and both are expressed as role dependencies
# rather than by position here, so a play that runs one role alone still gets
# them: the editor backend precedes its progressive-web-app proxy, and the VNC
# desktop precedes the two desktop applications that need its display.

# Each role is tagged so an operator can converge a subset. That matters here
# because this host carries services with very different interruption costs --
# a timer is free to restart, the editor backend is not -- and because a
# failure in one role's package step must not be able to withhold the other
# seventeen.
- name: Dev host services
  hosts: vps
  gather_facts: true
  roles:
    - role: arq_root_snapshot
      tags: [arq_root_snapshot]
    - role: arq_docker_volume_snapshot
      tags: [arq_docker_volume_snapshot]
    - role: arq_smb_source
      tags: [arq_smb_source]
    - role: restic_backup
      tags: [restic_backup]
    - role: vnc_desktop
      tags: [vnc_desktop]
    - role: onepassword_desktop
      tags: [onepassword_desktop]
    - role: claude_desktop
      tags: [claude_desktop]
    - role: btop_loop
      tags: [btop_loop]
    - role: code_serve_web
      tags: [code_serve_web]
    - role: code_pwa_proxy
      tags: [code_pwa_proxy]
    - role: ssh_hardening
      tags: [ssh_hardening]
    - role: keyring_quota
      tags: [keyring_quota]
    - role: tmux_config
      tags: [tmux_config]
    - role: claude_code_hooks
      tags: [claude_code_hooks]
    - role: claude_ntfy
      tags: [claude_ntfy]
    - role: codex_config
      tags: [codex_config]
    - role: honeycomb_mcp
      tags: [honeycomb_mcp]
    - role: honeycomb_trigger_recipients_check
      tags: [honeycomb_trigger_recipients_check]
