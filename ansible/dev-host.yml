---
# The maintainer's dev host, migrated from the `vps-info` repository.
#
# This machine is also the Ansible control node, so it manages itself over a
# local connection: a run needs no ssh credential toward it and no inbound
# reachability to it.
#
# Order matters in one place, and it is expressed as a role dependency rather
# than by position here, so a play that runs one role alone still gets it: the
# VNC desktop precedes the two desktop applications that need its display.
#
# The VS Code web editor remains installed under drift control, but the
# maintainer's hold is the role default: both units are disabled and stopped.

# Each role is tagged so an operator can converge a subset. That matters here
# because this host carries services with very different interruption costs --
# a timer is free to restart, a desktop session is not -- and because a
# failure in one role's package step must not be able to withhold the other
# seventeen.
- name: Dev host services
  hosts: "{{ dev_host_group | default('dev_hosts') }}"
  gather_facts: true
  roles:
    - role: arq_root_snapshot
      tags: [arq_root_snapshot]
    - role: arq_docker_volume_snapshot
      tags: [arq_docker_volume_snapshot]
    - role: arq_smb_source
      tags: [arq_smb_source]
    - role: restic_backup
      tags: [restic_backup]
    - role: vnc_desktop
      tags: [vnc_desktop]
    - role: onepassword_desktop
      tags: [onepassword_desktop]
    - role: claude_desktop
      tags: [claude_desktop]
    - role: vps_editor_stack
      tags: [vps_editor_stack]
    - role: btop_loop
      tags: [btop_loop]
    - role: fpart
      tags: [fpart]
    - role: ssh_hardening
      tags: [ssh_hardening]
    - role: authorized_keys_managed
      tags: [authorized_keys_managed]
    - role: keyring_quota
      tags: [keyring_quota]
    - role: tmux_config
      tags: [tmux_config]
    # Out-of-band stuck-dialog watchdog (plan remote-control-retirement, fwtuxo).
    - role: seat_dialog_watchdog
      tags: [seat_dialog_watchdog]
    # The git credential helper shim every fleet clone here names in its
    # .git/config (livespec-orslcm Pillar 3). Clones whose committed
    # .livespec.jsonc remaps to the livespec-ai org App mint through their
    # credential_wrapper; see roles/fleet_git_credential_helper/HOST_VARS.md.
    - role: fleet_git_credential_helper
      tags: [fleet_git_credential_helper]
    - role: claude_code_hooks
      tags: [claude_code_hooks]
    - role: claude_ntfy
      tags: [claude_ntfy]
    - role: codex_config
      tags: [codex_config]
    - role: honeycomb_mcp
      tags: [honeycomb_mcp]
    # The OnFailure= alert template the roles below name. It runs first so
    # their alert-unit checks find it installed.
    - role: host_unit_alert
      tags: [host_unit_alert]
    - role: honeycomb_trigger_recipients_check
      tags: [honeycomb_trigger_recipients_check]
    - role: otel_collector
      tags: [otel_collector]
    - role: pressure_telemetry
      tags: [pressure_telemetry]
    # The token-spend reporting scripts are committed here and copied from this
    # checkout on every explicit converge.  Keeping the source with the role
    # means the vps never receives a hand-edited script.
    - role: token_spend_report
      tags: [token_spend_report]
    # The pinned Fabro CLIENT builds a Dispatcher running natively here execs
    # through a committed `dispatcher.factories.<name>.bin`, staged from a
    # digest-verified control-node source and never by hand. See
    # SPECIFICATION/non-functional-requirements.md §"Dev host Fabro client
    # builds" and the role's HOST_VARS.md.
    - role: fabro_client
      tags: [fabro_client]
    - role: dev_host_retention
      tags: [dev_host_retention]
    # The host-wide bound on how many fleet gate test runs execute at once
    # here. The limit is ONE committed value (`local_gate_slots_limit`) and
    # removing it returns the host to no limit; see the role's HOST_VARS.md and
    # SPECIFICATION/non-functional-requirements.md section "Local gate
    # concurrency limit".
    - role: local_gate_slots
      tags: [local_gate_slots]
    # The RAM-backed /tmp capped and Claude Code's per-session temp trees moved
    # to disk, memory slices for dispatcher loops and local gates, and a bound
    # on reconcile-runs (the 2026-11-13 memory overload). A plain converge changes
    # nothing running; the live move is the never-tagged
    # `dev_host_memory_bounds_cutover`. See the role's HOST_VARS.md.
    - role: dev_host_memory_bounds
      tags: [dev_host_memory_bounds]
    # On this VPS, proactive compaction could repeatedly chase an unreachable
    # fragmentation target and burn a core; the role leaves on-demand paths
    # alone. See its managed drop-in for the host measurement and rationale.
    - role: dev_host_compaction
      tags: [dev_host_compaction]
    # The flake-retry filer consumes retry records under the governed checkout
    # using the existing host credential wrapper. Its sibling timer makes a
    # reader that stops completing visible rather than silently stale.
    - role: flake_retry_filer
      tags: [flake_retry_filer]
    # The livespec reconcile-runs timer, one sweep over every tenant this host
    # dispatches for (livespec-dev-tooling-oxwre7). The unit text is
    # livespec-orchestrator-beads-fabro's, read from this host's checkout; see
    # roles/reconcile_runs/HOST_VARS.md.
    - role: reconcile_runs
      tags: [reconcile_runs]
    # The breakage pass timer (livespec-orchestrator-beads-fabro bd-ib-voazyv):
    # one pass per watched repository, run under its committed credential
    # wrapper, verdict lines to the journal. It needs reconcile_runs's tenant
    # wrapper and starts nothing until `breakage_pass_enabled` is true; see
    # roles/breakage_pass/HOST_VARS.md.
    - role: breakage_pass
      tags: [breakage_pass]
    # The independent released incident observer (livespec-dev-tooling-w7n3ad):
    # loopback listener first, then the tailnet front that publishes it from
    # this host's tailscale_serve_mappings. Both run under the credential
    # wrapper; see roles/incident_observer/README.md.
    - role: incident_observer
      vars:
        # The publisher workflow's commit on master that production approves
        # (livespec-dev-tooling-bqnzcm.4). Non-empty provisions the CI identity
        # policy and publishes POST /ci/publish on the funnel port.
        incident_observer_ci_publisher_shas:
          - f08e94d9e533a6b6d5cd8c3c8bcaf6930581cb21
      tags: [incident_observer]
    - role: tailscale_serve
      tags: [tailscale_serve]
    # The control node's trust in every ci_pool host's tailnet ssh host key,
    # from the keys pinned in each host's host_vars (role
    # controller_known_hosts), so a rebuilt control node can reach the pool.
    - role: controller_known_hosts
      tags: [controller_known_hosts]
