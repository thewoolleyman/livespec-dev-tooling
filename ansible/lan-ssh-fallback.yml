---
# The direct-LAN OpenSSH fallback between the home-lab hosts (role
# lan_ssh_fallback; read its HOST_VARS.md). Plays name inventory GROUPS only.
#
# Read the drift report first, then converge. To converge ONE home-lab host
# (the documented first apply), name it in `lan_ssh_fallback_only` rather than
# using --limit: the key plays must still reach every home-lab host and the
# control node, because every host's authorized keys and pinned known_hosts are
# rendered from all of them.
#   just ansible-drift ansible/lan-ssh-fallback.yml
#   just ansible-apply ansible/lan-ssh-fallback.yml -e lan_ssh_fallback_only=<host>
#   just ansible-apply ansible/lan-ssh-fallback.yml

- name: LAN fallback - keys on every home-lab host
  hosts: home_lab
  gather_facts: false
  tasks:
    - name: Ensure and read the fallback's keys
      ansible.builtin.include_role:
        name: lan_ssh_fallback
        tasks_from: keys.yml

- name: LAN fallback - the control node's key
  hosts: dev_hosts
  gather_facts: false
  tasks:
    - name: Read the control node's public key
      ansible.builtin.include_role:
        name: lan_ssh_fallback
        tasks_from: control_node_key.yml

- name: LAN fallback - OpenSSH on each home-lab host, one at a time
  hosts: home_lab
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  any_errors_fatal: true
  tasks:
    - name: Refuse a one-host target that is not a home-lab host
      ansible.builtin.assert:
        that:
          - lan_ssh_fallback_only | default('') in [''] + groups['home_lab']
        fail_msg: "lan_ssh_fallback_only={{ lan_ssh_fallback_only | default('') }} is not in home_lab"
    - name: Install and verify the fallback server
      ansible.builtin.include_role:
        name: lan_ssh_fallback
        tasks_from: server.yml
      when: lan_ssh_fallback_only | default('') in ['', inventory_hostname]

- name: LAN fallback - client aliases and pinned keys
  hosts: home_lab:dev_hosts
  gather_facts: false
  tasks:
    - name: Install the client side
      ansible.builtin.include_role:
        name: lan_ssh_fallback
        tasks_from: client.yml

- name: LAN fallback - prove every path
  hosts: home_lab:dev_hosts
  gather_facts: false
  tasks:
    - name: Log in through every alias
      ansible.builtin.include_role:
        name: lan_ssh_fallback
        tasks_from: verify.yml
