---
# ONE additional factory-namespace credential, delivered exactly like the fleet's
# in main.yml. Included once per entry of `factory_kubeconfig_extra_credentials`,
# which supplies `factory_kubeconfig_extra`.
#
# WHY A SECOND CREDENTIAL AT ALL: the mi-homelab organisation's Fabro instance
# runs its Kubernetes sandboxes in its own namespace, `factory-mi-homelab`
# (ci-runner/k3s/phase2/factory-mi-homelab/), under a launcher that reaches only
# that namespace, so it cannot use the fleet's `factory` credential and the
# fleet's credential cannot reach its pods (plan kubernetes-sandbox-backend,
# bd-ib-nmuyjc; work-item bd-ib-yetegc).
#
# THE REFRESH TOOL IS SHARED; ONLY ITS ENV-FILE DIFFERS. refresh-factory-kubeconfig
# sources $FACTORY_REFRESH_ENV for the remote path and installs to
# $FACTORY_KUBECONFIG, so a plugin whose process environment names THIS entry's
# env-file and destination re-fetches THIS credential on a 401, never the fleet's.

- name: Read an additional rendered factory kubeconfig from the control-plane node
  ansible.builtin.slurp:
    src: "{{ factory_kubeconfig_extra.remote_path }}"
  become: true
  delegate_to: "{{ factory_kubeconfig_remote_host }}"
  register: factory_kubeconfig_extra_rendered
  changed_when: false
  no_log: true

- name: Refuse an additional fetched file that is not a kubeconfig
  ansible.builtin.assert:
    that:
      - "'kind: Config' in (factory_kubeconfig_extra_rendered.content | b64decode)"
      - "'server:' in (factory_kubeconfig_extra_rendered.content | b64decode)"
    fail_msg: >-
      {{ factory_kubeconfig_remote_host }}:{{ factory_kubeconfig_extra.remote_path }}
      is not a kubeconfig — refusing to overwrite {{ factory_kubeconfig_extra.dest }}
    success_msg: fetched content is a kubeconfig

- name: Install an additional credential's refresh env-file
  ansible.builtin.copy:
    content: |
      FACTORY_REMOTE_HOST={{ factory_kubeconfig_remote_host }}
      FACTORY_REMOTE_KUBECONFIG={{ factory_kubeconfig_extra.remote_path }}
      FACTORY_SSH_USER={{ factory_kubeconfig_ssh_user }}
      FACTORY_GROUP={{ factory_kubeconfig_group }}
    dest: "{{ factory_kubeconfig_extra.refresh_env }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install an additional factory kubeconfig
  ansible.builtin.copy:
    content: "{{ factory_kubeconfig_extra_rendered.content | b64decode }}"
    dest: "{{ factory_kubeconfig_extra.dest }}"
    owner: root
    group: "{{ factory_kubeconfig_group }}"
    mode: "0640"
  become: true
  no_log: true
