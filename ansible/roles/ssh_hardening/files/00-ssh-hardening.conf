# SSH hardening for the public OpenSSH daemon on vps.perch-rudd.ts.net.
# Deployed by vps-info: services/ssh-hardening/install.sh.
#
# Why: the host has a routable public IP (66.94.121.15) with no ufw, so the
# OpenSSH daemon is internet-facing. Disabling password auth removes the
# brute-force / credential-stuffing surface and shrinks pre-auth exposure.
# Access remains via SSH key on the public path AND Tailscale SSH on the
# tailnet path (governed by tailscale-admin/policy.hujson).
#
# Ordering: Ubuntu cloud images ship /etc/ssh/sshd_config.d/50-cloud-init.conf
# with `PasswordAuthentication yes`. sshd uses the FIRST obtained value for each
# keyword, and the `Include /etc/ssh/sshd_config.d/*.conf` glob expands in
# lexical order, so this file is named `00-` to be read before `50-` and win.
# Do NOT rename it to a number >= 50.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
