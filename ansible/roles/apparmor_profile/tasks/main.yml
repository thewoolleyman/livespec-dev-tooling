---
# apparmor_profile — the AppArmor profiles every ci_pool node's kernel carries.
#
#   * ci-runner-workflow fixes the stacked-label signal/ptrace denial for the
#     pods that NAME it (hook-generated workflow pods, factory sandbox pods).
#   * cri-containerd.apparmor.d is containerd's own default profile with the same
#     fix, held at node level for every pod that names NO profile. Kernel
#     7.0.0-43 stacks every non-privileged container's label, so without it a
#     gate Job cannot signal its own children (livespec-dev-tooling-ddy5xu; the
#     file's header carries the measurement and the upstream commit).
#
# Replaces the KERNEL HALF of
# ci-runner/k3s/phase2/apparmor/install-apparmor-profile.sh. The other half —
# converging the arc-hook-pod-template ConfigMap — is a CLUSTER object and stays
# with the manifests; the server's boot converge owns it for the whole pool.
#
# NODE-LOCAL: an AppArmor profile is kernel state on the machine that runs the
# pod. Dropping the file in /etc/apparmor.d/ is what makes the load survive a
# reboot, because the distribution's apparmor unit parses that directory at boot.
#
# THE READER IS THE KERNEL, NOT THE FILE. A file that matches git says nothing
# about the policy a pod is confined by: containerd loads its own default
# profile whenever none of that name is loaded, and a file can be installed and
# never parsed. So the role compares what the kernel holds with what the
# installed file compiles to, loads on any difference, and fails if the two
# still differ afterwards. `apparmor_parser -Q -K -S <file> | sha256sum` equals
# the loaded profile's `raw_sha256` (measured 2026-11-12 on two loaded profiles
# of the dev host; the final assert fails loudly on a host where it does not).
# No k3s restart: `apparmor_parser -r` replaces a loaded profile in place.

- name: Locate apparmor_parser
  # `stat` and not a `command -v` probe: the command module runs an executable
  # directly with no shell, so `command -v` would look for a binary of that name
  # and always fail. stat is also check-mode-safe by construction, which a
  # registered command is not.
  ansible.builtin.stat:
    path: "{{ item }}"
  register: apparmor_profile_parser
  become: true
  loop: "{{ apparmor_profile_parser_paths }}"

- name: Refuse a host with no apparmor_parser
  # The parser writes kernel state, so a host without it cannot load the
  # profile at all and there is nothing for this role to do but say so.
  ansible.builtin.assert:
    that:
      - apparmor_profile_parser.results | selectattr('stat.exists') | list | length > 0
    fail_msg: >-
      apparmor_parser is at none of
      {{ apparmor_profile_parser_paths | join(', ') }}; this host cannot load a profile
    success_msg: >-
      apparmor_parser:
      {{ apparmor_profile_parser.results | selectattr('stat.exists') | map(attribute='item') | first }}

- name: Record the apparmor_parser this host has
  ansible.builtin.set_fact:
    apparmor_profile_parser_path: >-
      {{ apparmor_profile_parser.results | selectattr('stat.exists') | map(attribute='item') | first }}

- name: Install the AppArmor profiles
  ansible.builtin.copy:
    src: "{{ apparmor_profile_src_dir }}/{{ item }}"
    dest: "{{ apparmor_profile_dest_dir }}/{{ item }}"
    owner: "{{ apparmor_profile_owner }}"
    group: "{{ apparmor_profile_group }}"
    mode: "0644"
  become: true
  register: apparmor_profile_installed
  loop: "{{ apparmor_profile_names }}"

- name: Probe the policy the kernel holds against the installed files
  # A READ that carries the drift verdict: the load below is a command, so it is
  # skipped under --check, and without this computed `changed_when` a drift
  # report would print `skipping` over a real pending load (the node_taints
  # lesson, livespec-dev-tooling-ewjby3). Under --check the file is not written,
  # so a pending install also counts as a pending load.
  #
  # It prints three words: the sha256 of the loaded policy, the sha256 the
  # installed file compiles to, and the loaded profile's mode. `-` stands for a
  # value that does not exist yet. `-Q` keeps the parser from touching the
  # kernel and `-K` from reading a cache, so this writes nothing.
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      loaded=- expected=- mode=-
      for dir in "{{ apparmor_profile_loaded_dir }}/{{ item.item }}".[0-9]*; do
        if [ -r "${dir}/raw_sha256" ]; then
          loaded="$(cat "${dir}/raw_sha256")"
          mode="$(cat "${dir}/mode")"
        fi
      done
      if [ -r "{{ apparmor_profile_dest_dir }}/{{ item.item }}" ]; then
        expected="$("{{ apparmor_profile_parser_path }}" -Q -K -S \
          "{{ apparmor_profile_dest_dir }}/{{ item.item }}" | sha256sum | cut -d' ' -f1)"
      fi
      printf '%s %s %s\n' "${loaded}" "${expected}" "${mode}"
  become: true
  register: apparmor_profile_probe
  check_mode: false
  changed_when: >-
    ansible_check_mode
    and (item.changed
         or apparmor_profile_probe.stdout.split()[0] != apparmor_profile_probe.stdout.split()[1])
  loop: "{{ apparmor_profile_installed.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Load each profile the kernel does not hold as installed
  # -r replaces an already-loaded profile of the same name in place, so the
  # containers it confines pick the new rules up with no restart. -W refreshes
  # the parser's cache, which is what the boot-time load reads.
  ansible.builtin.command:
    argv:
      - "{{ apparmor_profile_parser_path }}"
      - -r
      - -W
      - "{{ apparmor_profile_dest_dir }}/{{ item.item.item }}"
  become: true
  changed_when: true
  when: item.stdout.split()[0] != item.stdout.split()[1]
  loop: "{{ apparmor_profile_probe.results }}"
  loop_control:
    label: "{{ item.item.item }}"

- name: Read back the policy the kernel holds
  # The same read as the probe, after the load, so it stays out of --check.
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -euo pipefail
      loaded=- mode=-
      for dir in "{{ apparmor_profile_loaded_dir }}/{{ item }}".[0-9]*; do
        if [ -r "${dir}/raw_sha256" ]; then
          loaded="$(cat "${dir}/raw_sha256")"
          mode="$(cat "${dir}/mode")"
        fi
      done
      expected="$("{{ apparmor_profile_parser_path }}" -Q -K -S \
        "{{ apparmor_profile_dest_dir }}/{{ item }}" | sha256sum | cut -d' ' -f1)"
      printf '%s %s %s\n' "${loaded}" "${expected}" "${mode}"
  become: true
  register: apparmor_profile_after
  changed_when: false
  when: not ansible_check_mode
  loop: "{{ apparmor_profile_names }}"

- name: Refuse a profile the kernel does not hold as installed, in enforce mode
  # Fail loudly rather than leaving a half-installed node: a pod confined by a
  # different policy than this tree claims, or by one in complain mode, is the
  # silent outcome this role exists to rule out.
  ansible.builtin.assert:
    that:
      - item.stdout.split()[0] == item.stdout.split()[1]
      - item.stdout.split()[2] == 'enforce'
    fail_msg: >-
      {{ item.item }}: the kernel holds policy {{ item.stdout.split()[0] }} in mode
      {{ item.stdout.split()[2] }}, but the installed file compiles to
      {{ item.stdout.split()[1] }} and must be enforced
    success_msg: "{{ item.item }} is loaded as installed, in enforce mode"
  when: not ansible_check_mode
  loop: "{{ apparmor_profile_after.results }}"
  loop_control:
    label: "{{ item.item }}"
