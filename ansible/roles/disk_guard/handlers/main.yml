---
- name: Restart the disk-guard timers
  # A running timer keeps its loaded schedule, so a changed .timer needs a
  # restart to take effect. Restarting these is not disruptive: both services
  # are oneshot, so the worst case is one skipped interval on a fifteen-minute
  # or daily cycle. A changed .service or a changed script needs no restart —
  # the next fire re-reads both.
  #
  # The `when` is the same check-mode guard the arming task carries: under
  # --check the notifying template wrote nothing, so a timer this host does not
  # already have cannot be restarted, and failing here would blame the host for
  # the dry run's own emptiness.
  ansible.builtin.systemd_service:
    name: "{{ disk_guard_timer.item }}"
    state: restarted
    daemon_reload: true
  become: true
  when: not ansible_check_mode or disk_guard_timer.stat.exists
  loop: "{{ disk_guard_timer_state.results }}"
  loop_control:
    loop_var: disk_guard_timer
    label: "{{ disk_guard_timer.item }}"
