---
# Keep the hand-installed hourly fstrim cron off the dev host.
#
# Measured 2026-11-02 (plan dev-host-disk-retention): `/etc/cron.hourly/fstrim`
# ran `fstrim /` every hour. It was hand-installed on 2026-01-06, owned by no
# package and managed by no role. One run took 10 min 57 s in uninterruptible
# IO wait, discarded about 85 GiB, and raised IO pressure from :17 to :45 past
# every hour, about 2.4-3.2 TiB of discards a day on a 678 G disk. It was
# redundant: `/` is mounted with `discard`, which trims freed blocks as they
# are freed, and systemd's weekly `fstrim.timer` sweeps whatever that misses.
# The maintainer approved removing it ("ok remove it").
#
# Kept as its own tasks file so the absence can be checked against a scratch
# path without touching the host's cron directory.

- name: Remove the hand-installed hourly fstrim cron
  ansible.builtin.file:
    path: "{{ dev_host_retention_retired_fstrim_cron }}"
    state: absent
  become: true
