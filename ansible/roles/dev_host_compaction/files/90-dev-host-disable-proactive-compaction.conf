# Dev VPS: disable proactive memory compaction.
#
# Measurement, 2026-11-02: with 30.6 GiB free, 53.7 GiB available, and no
# memory PSI pressure, kcompactd0 consumed about 106% of one CPU while
# vm.compaction_proactiveness was the kernel-default 20.  The daemon migrated
# about 45 MiB/s trying to reach a fragmentation target that pinned or
# unmovable pages could not meet, so that proactive pass could not converge.
#
# A value of 0 disables only that proactive pass.  The on-demand compaction
# (kswapd/kcompactd at watermark pressure, and direct compaction) is left as it
# was.  The observed cost is a possible small increase in madvise-THP fallbacks
# (about three per day before this setting), in exchange for returning the
# episodically consumed CPU and memory-bus bandwidth to co-tenants.
vm.compaction_proactiveness = 0
