# Managed by Ansible's dev_host_compaction role.
#
# WHY THIS IS ZERO: on vmi3006760 (kernel 6.17) at 2026-11-02 18:42Z,
# kcompactd0 used 106% of one core over a 10-second sample despite 30.6 GiB
# free memory, 53.7 GiB available memory, and no memory-pressure stalls. At
# the default proactiveness of 20, it migrated about 45 MiB/s while chasing a
# fragmentation-score target that pinned or unmovable pages could not satisfy.
# The pass therefore could not converge and had already accrued 12 h 20 m CPU
# over 14 days. Zero disables only that proactive pass.
#
# On-demand compaction is unchanged: kswapd and kcompactd at watermark pressure,
# plus direct compaction, retain their kernel defaults. The cost is a possible
# small increase in madvise-THP fallbacks, observed at about three per day.
vm.compaction_proactiveness = 0
