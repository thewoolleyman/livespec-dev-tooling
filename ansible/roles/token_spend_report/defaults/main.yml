---
# The token-spend collector is user-scoped tooling.  Its source is the
# `vps-info` repository (services/token-spend-report/), pinned below by commit
# sha and by a SHA-256 per file; the role copies exactly those bytes to the vps
# and refuses on any mismatch.  The scripts are not carried in this repository:
# its Python gates reject them as written.
token_spend_report_user: ubuntu
token_spend_report_group: ubuntu
token_spend_report_root: /home/ubuntu/token-spend-report
token_spend_report_scripts_dir: "{{ token_spend_report_root }}/scripts"

# The CONTROL NODE's clone of vps-info.  vps-info is private, so the bytes are
# read from this clone at the pinned commit, never from a floating branch and
# never over an unauthenticated URL.
token_spend_report_source_checkout: "{{ lookup('ansible.builtin.env', 'HOME') }}/workspace/vps-info"
token_spend_report_source_path: services/token-spend-report
# vps-info master after PR 97 (rebase-merged 2026-11-19), read on origin.
token_spend_report_source_sha: 12cf60f0d6bd0d7a85baef52c55741128778722f
token_spend_report_scripts:
  attribution.py: b6a4d38afe5718d03f7b24fa00e9d0fee3146b29072bf58b5c02725b40a18463
  build_board.py: 4c0e12da89501618f42f586ffb8884ecb2dea5dbb743cc6b05b18693686177b0
  emit_factory.py: 5d8e6a2d5df5e6f4e8c60fc60befbf89d4f31f41d41f2120c9e82a567dcda0c3
  emit_nodes.py: 2e14b60fea5e832406ffa9a2a5a64abdab49680797c8508eda42bae5c0577ff1
  emit_spend.py: 0917f2af3f8b39c15e0af76061bcd6b17f6d9821202aa9e09724ec7f24283886
  hcq.py: ba7dd698f446f40860d86b6e9669dae36dd3e5174bb264abf0f07bc8d583ea99
  spend_staleness.py: 0c2613177569b5a427d0232f40a608c5cf54833dde41306d7d2e1a5db8cede54
  tenant_watch.py: f6390c770cf9dbe699c66ef07744f096bf76b12b4995630bf656d0bb86285c67
  quota_triggers.py: 95a682e18d3e2542a9e6784432ea33fbb566409cf86ff7f36c46ebefaa2fc4b3
  quota_triggers_check.py: be1a4e975dbfef1f5b841b8aeea3be2cacbc0388c62f1f1896c48cd20388fb01
  emit_spend_key.py: 8e4c20de17774767a235c337b2c293057ada24c488bd350e8276a099cfe29b22
  build_triggers.py: decd28ef27940bbbe6be95269eda2dfded31a55fd1f8c0a886ab4ac6192803fd

# The Honeycomb trigger set (livespec-dev-tooling-caejh2).  A oneshot user unit PUTs
# the triggers quota_triggers.py defines; it has no [Install] section and no timer, so
# nothing runs it on a clock.  The role starts it only when one of the scripts it runs
# changed in this apply (the PUT is idempotent by trigger name), then reads the live
# triggers back with quota_triggers_check.py and fails on any difference.  The
# credential is supplied by the wrapper below and is never written to the unit or here.
token_spend_report_env_wrapper: /usr/local/bin/with-livespec-env.sh
token_spend_report_python: /usr/bin/python3
token_spend_report_triggers_unit: token-spend-quota-triggers.service
token_spend_report_triggers_unit_dir: "/home/{{ token_spend_report_user }}/.config/systemd/user"
token_spend_report_triggers_apply_scripts:
  - quota_triggers.py
  - build_triggers.py
  - emit_spend_key.py
