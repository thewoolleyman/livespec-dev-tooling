---
# See defaults/main.yml for what this role forces and why it is root scope.

- name: Create the Claude Code managed-policy directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - "{{ claude_distributed_sendmessage_policy_dir }}"
    - "{{ claude_distributed_sendmessage_dropin_dir }}"

- name: Replace the retired pane-input guard with an allow-all stub
  # The guard blocked typing into Claude panes. Retired by maintainer ruling
  # 2026-11-14: typing into a pane is sometimes necessary, so SendMessage is
  # guidance, not a block, and the drop-in below no longer wires it. The path
  # must NOT be deleted: a session started before this apply keeps the old
  # managed hook cached, and `python3 <missing file>` exits 2, which BLOCKS
  # every Bash call in that session (it did, on hetzner-xubuntu, 2026-11-14).
  # The stub admits everything.
  ansible.builtin.copy:
    src: _vendor/retired-pane-input-guard.py
    dest: "{{ claude_distributed_sendmessage_guard_dest }}"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Write the managed-settings drop-in
  # A drop-in, not /etc/claude-code/managed-settings.json, so another managed
  # policy on the host can own its own file. This role owns this file whole.
  ansible.builtin.copy:
    content: "{{ claude_distributed_sendmessage_settings | to_nice_json(indent=2) }}\n"
    dest: "{{ claude_distributed_sendmessage_dropin }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Carry the SendMessage rule in the managed CLAUDE.md
  # Managed memory loads into every session before user and project CLAUDE.md.
  # A marked block, so the file can carry other managed guidance beside it.
  ansible.builtin.blockinfile:
    path: "{{ claude_distributed_sendmessage_memory }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "<!-- {mark} ANSIBLE MANAGED claude_distributed_sendmessage -->"
    block: "{{ lookup('ansible.builtin.file', 'managed-memory.md') }}"
  become: true

- name: Export the seat no-stall environment for login shells
  ansible.builtin.copy:
    content: |
      # ANSIBLE MANAGED by claude_distributed_sendmessage: no permission prompt may
      # stall a Claude Code seat (see the role defaults for the measurement).
      {% for k, v in claude_distributed_sendmessage_seat_env.items() %}
      export {{ k }}={{ v }}
      {% endfor %}
    dest: "{{ claude_distributed_sendmessage_profile_snippet }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Ensure each shell rc's directory exists (zsh is absent on bash-only hosts)
  ansible.builtin.file:
    path: "{{ item | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  loop: "{{ claude_distributed_sendmessage_shell_rcs }}"

- name: Export the seat no-stall environment from every shell's always-read rc
  # profile.d covers login shells only; a herdr pane's shell is often not one.
  ansible.builtin.blockinfile:
    path: "{{ item }}"
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} ANSIBLE MANAGED claude_distributed_sendmessage seat no-stall"
    block: |
      {% for k, v in claude_distributed_sendmessage_seat_env.items() %}
      export {{ k }}={{ v }}
      {% endfor %}
  become: true
  loop: "{{ claude_distributed_sendmessage_shell_rcs }}"

- name: Export the seat no-stall environment to the systemd user manager
  ansible.builtin.copy:
    content: |
      # ANSIBLE MANAGED by claude_distributed_sendmessage: seat no-stall.
      {% for k, v in claude_distributed_sendmessage_seat_env.items() %}
      {{ k }}={{ v }}
      {% endfor %}
    dest: "{{ claude_distributed_sendmessage_environment_d }}"
    owner: root
    group: root
    mode: "0644"
  become: true
