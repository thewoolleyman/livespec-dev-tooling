---
# The committed phase-2 tree this role distributes. Referenced rather than
# copied into the role's own files/: the shipped config.yaml and
# config.agent.yaml are the source of truth for the cluster's k3s settings, and
# a second copy under roles/ would be a second thing to drift.
k3s_config_phase2_dir: "{{ role_path }}/../../../ci-runner/k3s/phase2"
# The node's role, from the inventory. install-node.sh read it from the node's
# phase0-bare-metal profile; the inventory is where that fact lives now.
k3s_config_cluster_role: "{{ cluster_role }}"
k3s_config_dest: /etc/rancher/k3s/config.yaml
# The node's committed phase0 profile — the ONE source of its taints. Read on
# the CONTROLLER, because the profile lives in this repository and not on the
# node. Deliberately the same path AND the same read as ../../node_taints,
# which reconciles the LIVE taint: two different reads of one profile is how a
# retired taint came back on gmktec (livespec-dev-tooling-yapwva).
k3s_config_profiles_dir: "{{ role_path }}/../../../ci-runner/k3s/phase0-bare-metal/profiles"
k3s_config_profile: "{{ k3s_config_profiles_dir }}/{{ inventory_hostname }}.env"
# k3s merges every file in this directory over config.yaml above, on every
# start. The per-node taint is RENDERED here rather than committed into the
# shared phase2 config.agent.yaml which every agent receives: a taint belongs to
# ONE node, and the rebuild recipe forbids a procedure that embeds a value
# belonging to one node.
k3s_config_drop_in_dir: /etc/rancher/k3s/config.yaml.d
k3s_config_node_taint_drop_in: /etc/rancher/k3s/config.yaml.d/10-node-taint.yaml
# THIS NODE's kubelet arguments, APPENDED to the fleet's shared list rather than
# replacing it. The shared ci-runner/k3s/phase2/k3s-config/config.agent.yaml
# every agent receives declares `kubelet-arg` with `max-pods=200`; this file's
# template emits `kubelet-arg+`, which is the only form k3s's multi-file merge
# appends with. Numbered 20- so it merges after the taint drop-in; the two touch
# different keys, so the order is cosmetic rather than load-bearing, and the
# number is stated so a third per-node file has somewhere obvious to go.
#
# WHERE THE VALUES COME FROM, AND WHY PER-NODE. The profile's KUBELET_ARGS. A
# node's reservations are measured against the OTHER workloads on that one
# machine, so they belong to no other node and cannot live in the shared file.
# The arithmetic and the resulting pod-allocatable figures are recorded in
# ../HOST_VARS.md, beside the role that renders them.
k3s_config_kubelet_args_drop_in: /etc/rancher/k3s/config.yaml.d/20-kubelet-args.yaml
# The node's data directory, from the profile's NODE_DATA_DIR, and the systemd
# drop-in that refuses to start the agent before the volume holding it is
# mounted. `--data-dir` itself is in the unit's ExecStart from the install — it
# is a BUILD-TIME fact, and moving a populated data directory is a rebuild rather
# than a converge — so what this role owns is the ORDERING, not the path.
k3s_config_agent_unit_drop_in_dir: /etc/systemd/system/k3s-agent.service.d
k3s_config_data_dir_drop_in: 10-requires-data-dir-mount.conf
# The unit get.k3s.io writes from INSTALL_K3S_EXEC, and the expression that
# takes `--node-taint` back out of its ExecStart.
#
# WHY THE EXPRESSION IS A VARIABLE AND A PLAIN SCALAR. `ansible.builtin.replace`
# compiles it with re.MULTILINE and nothing else, so the repo's own test applies
# these exact bytes to a unit in get.k3s.io's shape and proves what a converge
# does. A quoted scalar would process escapes on the way in, and a test that had
# to un-escape it would be free to un-escape it differently.
#
# WHAT IT MATCHES. The installer's `quote_indent` emits one TAB-indented
# single-quoted argument per line with a trailing ` \`, so a flag and its value
# are two consecutive lines; the pair is matched and removed together, once per
# declared record. `(?!--)` on the value is the guard that matters: without it a
# malformed `--node-taint` with no value would consume the NEXT flag's line and
# leave that flag's value behind as a bare positional argument — a node that
# registers unlabelled and silently stops matching every phase2 nodeSelector.
k3s_config_agent_unit: /etc/systemd/system/k3s-agent.service
k3s_config_agent_unit_node_taint_regexp: ^[ \t]*'?--node-taint'?[ \t]*\\?\n[ \t]*'?(?!--)[^'\s]+'?[ \t]*\\?\n
# A SERVER path. An agent deploys no packaged component, so it gets neither the
# directory nor the marker — and any marker an earlier server-config run left on
# it is removed.
k3s_config_manifests_dir: /var/lib/rancher/k3s/server/manifests
k3s_config_skip_marker: /var/lib/rancher/k3s/server/manifests/local-storage.yaml.skip
# The bound and cadence k3s-runtime-ready.sh owns: a k3s (re)start on this
# hardware reaches a serving containerd in single-digit seconds, and the one
# measured failure needed five.
k3s_config_wait_seconds: 120
k3s_config_poll_seconds: 2
k3s_config_containerd_socket: /run/k3s/containerd/containerd.sock

# k3s's own data directory, used when a node's profile leaves NODE_DATA_DIR
# empty. The kubelet's configuration drop-in directory is under it.
k3s_config_default_data_dir: /var/lib/rancher/k3s
# Whether the kubelet kills only the process that exceeds a container's memory
# limit (true) or the container's whole cgroup (false, the kubelet default on
# cgroup v2). See HOST_VARS.md, "Single-process OOM kill" (bd-ib-3kdjct).
k3s_config_single_process_oom_kill: true
k3s_config_single_process_oom_kill_drop_in: 50-single-process-oom-kill.conf

# The systemd CPUWeight= (1 to 10000) this node's k3s unit runs with —
# k3s-agent.service on an agent, k3s.service on the server. Empty, the default,
# manages no weight and removes a drop-in an earlier converge wrote, so the unit
# falls back to systemd's default of 100. Set per host in host_vars; see
# HOST_VARS.md. Applied by a daemon-reload, never a restart.
k3s_config_cpu_weight: ""
k3s_config_cpu_weight_drop_in: 50-cpu-weight.conf
k3s_config_cpu_weight_unit_drop_in_dir: >-
  /etc/systemd/system/{{ 'k3s-agent' if k3s_config_cluster_role == 'agent' else 'k3s' }}.service.d

# The systemd CPUWeight= (1 to 10000) of system.slice ITSELF on this node: the
# share system.slice holds at the cgroup root against kubepods.slice, which
# kubelet's systemd cgroup driver weights from allocatable CPU (2813 on a
# 72-CPU node). k3s_config_cpu_weight above cannot move that share, because a
# unit's weight only orders units inside system.slice. Empty, the default,
# manages no weight and removes a drop-in an earlier converge wrote, so the
# slice falls back to systemd's default of 100. Set per host in host_vars; see
# HOST_VARS.md, "system.slice CPU weight" (livespec-dev-tooling-cetudy).
# Applied by a daemon-reload, never a restart.
k3s_config_system_slice_cpu_weight: ""
k3s_config_system_slice_cpu_weight_drop_in: 50-cpu-weight.conf
k3s_config_system_slice_drop_in_dir: /etc/systemd/system/system.slice.d

# How many CoreDNS replicas the cluster runs. k3s ships its CoreDNS Deployment
# (the packaged `coredns` addon) with ONE replica, and its manifest sets no
# `replicas` field, so a count set here is not reset by k3s's own re-apply.
# Two, because one pod on a CPU-starved poweredge-xubuntu took cluster DNS down
# for CI on 2026-11-05 (livespec-dev-tooling-s2aqob). The Deployment's own
# topologySpreadConstraints (kubernetes.io/hostname, maxSkew 1, DoNotSchedule)
# place the second replica on a different node. Revert: set this to 1 and
# re-apply.
k3s_config_coredns_replicas: 2
k3s_config_admin_kubeconfig: /etc/rancher/k3s/k3s.yaml
