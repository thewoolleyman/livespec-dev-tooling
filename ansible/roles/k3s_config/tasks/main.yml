---
# k3s_config — this node's k3s START CONFIGURATION: the shared
# /etc/rancher/k3s/config.yaml selected by its cluster role, the per-node
# drop-ins rendered from its committed profile (its node taints, its own kubelet
# arguments, and the mount its data directory needs before the agent may start),
# and the server's packaged-manifest skip marker.
#
# EVERY PER-NODE FACT OF THE START CONFIGURATION COMES OUT OF ONE FILE — the
# node's committed phase0 profile — and is RENDERED rather than left in the unit
# the installer wrote. That is the whole lesson of livespec-dev-tooling-yapwva:
# a fact baked into `k3s-agent.service`'s ExecStart at join time goes stale the
# day the profile changes, and the node re-registers off the stale copy.
#
# Replaces ci-runner/k3s/phase2/k3s-config/install-k3s-config.sh.
#
# THE AGENT'S NODE TAINTS ARE PART OF THAT CONFIGURATION, and this role owns
# them because they are START state. ../node_taints owns the LIVE taint on a
# registered node — a different fact, reconciled through kubectl — and the two
# read the same profile with the same expression on purpose. See the
# node-taint tasks below for the defect that split them
# (livespec-dev-tooling-yapwva).
#
# WHY TWO SOURCE FILES AND NOT ONE TEMPLATE WITH CONDITIONAL KEYS. config.yaml
# carries three keys an agent does not merely ignore: `disable`, which names a
# packaged component only a server deploys, so `--disable` is not in the agent's
# flag set at all and k3s-agent exits `flag provided but not defined: -disable`;
# `write-kubeconfig-mode`, the mode of an admin kubeconfig an agent never
# writes; and `tls-san`, subject alternative names for an API server an agent
# does not run. The two files state that boundary as data rather than as
# conditionals inside one template, exactly as the shell did.
#
# TAKES EFFECT ON THE NEXT k3s START. Nothing here restarts k3s or k3s-agent: a
# restart kills every running CI job on the pool. To REACH that next start on an
# AGENT — the gap that left this node's rendered reservations an opinion for
# nearly a day on 2026-10-13 — apply `restart-k3s-agent.yml` with that host's own
# confirmation; it refuses a node carrying any pod a DaemonSet does not own
# (livespec-dev-tooling-mbj3kz).

- name: Refuse a node whose cluster role is neither server nor agent
  ansible.builtin.assert:
    that:
      - k3s_config_cluster_role in ['server', 'agent']
    fail_msg: >-
      cluster_role must be 'server' or 'agent', got '{{ k3s_config_cluster_role }}'
    success_msg: "cluster role: {{ k3s_config_cluster_role }}"

- name: Create the k3s configuration directory
  # Explicit, because --check cannot see past a missing parent: with the
  # directory absent the copy below reports a would-be change and then fails
  # only on a real apply.
  ansible.builtin.file:
    path: "{{ k3s_config_dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install this node's k3s configuration
  ansible.builtin.copy:
    src: >-
      {{ k3s_config_phase2_dir }}/k3s-config/{{
        'config.yaml' if k3s_config_cluster_role == 'server' else 'config.agent.yaml'
      }}
    dest: "{{ k3s_config_dest }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  notify: Settle the agent k3s runtime

- name: Read this agent's profile NODE_TAINTS
  # The SAME read as ../../node_taints' first task, filter chain included, and
  # that identity is load-bearing: that role reconciles the taint the node
  # carries NOW, this one renders the taint the node STARTS with, and the two
  # must never disagree about what the profile said. regex_findall | first, NOT
  # regex_search(..., '\1'): with a group argument regex_search returns a LIST.
  # A missing or empty NODE_TAINTS yields '' — the OPEN state, not an error.
  ansible.builtin.set_fact:
    k3s_config_node_taints_declared: >-
      {{ lookup('ansible.builtin.file', k3s_config_profile)
      | regex_findall('^NODE_TAINTS=(.*)$', multiline=True) | first | default('') }}
  when: k3s_config_cluster_role == 'agent'

- name: Derive the node-taint records this agent starts with
  # A NODE_TAINTS value is space-separated `key=value:Effect` records, so
  # `.split()` on whitespace IS the record list, and `to_json` renders it as the
  # YAML flow sequence k3s reads. The empty profile yields `[]`.
  ansible.builtin.set_fact:
    k3s_config_node_taint_records: "{{ k3s_config_node_taints_declared.split() | to_json }}"
  when: k3s_config_cluster_role == 'agent'

- name: Create the k3s configuration drop-in directory on the agent
  # Explicit for the same reason as the parent above: --check cannot see past a
  # missing parent, so the render below would report a would-be change and then
  # fail only on a real apply.
  ansible.builtin.file:
    path: "{{ k3s_config_drop_in_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: k3s_config_cluster_role == 'agent'

- name: Render this agent's node taints from its committed profile
  # THE POINT OF THIS ROLE'S NODE-TAINT HALF. `provision-k3s.sh` writes every
  # NODE_TAINTS record into the k3s install command, so the taint lands in
  # k3s-agent.service's ExecStart at JOIN TIME and goes stale the day the
  # profile changes. k3s applies a taint at REGISTRATION, and a control-plane
  # reboot recreates the cluster's objects, so the agent re-registers off that
  # stale unit: poweredge-xubuntu rebooted 2026-10-12 03:56Z and gmktec-xubuntu
  # was still `node-role/ci=pending` at 04:24Z with `NODE_TAINTS=` committed
  # since R5 (livespec-dev-tooling-yapwva). Rendering the records into a file
  # k3s reads on every start — and stripping the flag out of the unit below —
  # makes the profile the only source. TAKES EFFECT ON THE NEXT k3s START, like
  # everything else here; nothing in this role restarts k3s-agent.
  ansible.builtin.template:
    src: node-taint.yaml.j2
    dest: "{{ k3s_config_node_taint_drop_in }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  when: k3s_config_cluster_role == 'agent'
  notify: Settle the agent k3s runtime

- name: Read this agent's profile KUBELET_ARGS and NODE_DATA_DIR
  # The same read shape as the taint above, on the same file: this role renders
  # every per-node fact of the k3s START CONFIGURATION, and all of them come out
  # of the one committed profile. A missing or empty key yields '' — a node with
  # no second workload to reserve against, and a node on k3s's own default data
  # directory — and both tasks below are gated on non-empty rather than rendering
  # a file that says nothing.
  ansible.builtin.set_fact:
    k3s_config_kubelet_args: >-
      {{ lookup('ansible.builtin.file', k3s_config_profile)
      | regex_findall('^KUBELET_ARGS=(.*)$', multiline=True) | first | default('') }}
    k3s_config_node_data_dir: >-
      {{ lookup('ansible.builtin.file', k3s_config_profile)
      | regex_findall('^NODE_DATA_DIR=(.*)$', multiline=True) | first | default('') }}
  when: k3s_config_cluster_role == 'agent'

- name: Derive the kubelet argument records this agent appends
  # Space-separated records, so `.split()` on whitespace IS the record list and
  # `to_json` renders it as the YAML flow sequence k3s reads.
  ansible.builtin.set_fact:
    k3s_config_kubelet_arg_records: "{{ k3s_config_kubelet_args.split() | to_json }}"
  when:
    - k3s_config_cluster_role == 'agent'
    - k3s_config_kubelet_args | length > 0

- name: Render this agent's own kubelet arguments from its committed profile
  # THE COEXISTENCE BUDGET, AS CONFIGURATION. On a node that is also a Fabro
  # factory host, the kubelet must hold back what the Docker sandbox slice, the
  # Fabro servers and the page cache need, or the first node-pressure eviction
  # takes a running dispatch with it. The records are the profile's;
  # ../../docker_sandbox_slice/HOST_VARS.md carries the arithmetic, the resulting
  # pod-allocatable figures and the condition under which they are revisited.
  #
  # APPENDS rather than replaces — the template emits `kubelet-arg+`, which is the
  # only form k3s's multi-file merge appends with. See the template's own header
  # for what the plain key would silently drop.
  #
  # TAKES EFFECT ON THE NEXT k3s START, like everything else in this role.
  ansible.builtin.template:
    src: kubelet-args.yaml.j2
    dest: "{{ k3s_config_kubelet_args_drop_in }}"
    owner: root
    group: root
    mode: "0600"
  become: true
  when:
    - k3s_config_cluster_role == 'agent'
    - k3s_config_kubelet_args | length > 0
  notify: Settle the agent k3s runtime

- name: Create the agent unit's drop-in directory
  # Explicit, because --check cannot see past a missing parent: with the
  # directory absent the render below reports a would-be change and then fails
  # only on a real apply.
  ansible.builtin.file:
    path: "{{ k3s_config_agent_unit_drop_in_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when:
    - k3s_config_cluster_role == 'agent'
    - k3s_config_node_data_dir | length > 0

- name: Order the agent after the volume holding its data directory
  # A node whose profile names NODE_DATA_DIR keeps k3s's data — the containerd
  # store above all — off the root filesystem. `--data-dir` is in the unit's
  # ExecStart from the install, so k3s uses that path from its first start; if
  # the volume is not mounted then, k3s creates the directory on the root
  # filesystem and the mount HIDES it, silently. The template's header records
  # the 2026-09-07 incident that is the same shape.
  #
  # The tier-carrying nodes get the equivalent ordering from the storage_layout
  # role's own drop-in, which a node with no tier does not run — which is why
  # this one is rendered from the profile instead.
  ansible.builtin.template:
    src: data-dir-mount.conf.j2
    dest: "{{ k3s_config_agent_unit_drop_in_dir }}/{{ k3s_config_data_dir_drop_in }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: k3s_config_data_dir_ordering
  when:
    - k3s_config_cluster_role == 'agent'
    - k3s_config_node_data_dir | length > 0

- name: Drop --node-taint out of the agent unit's start command
  # THE STALE CARRIER, REMOVED. The rendered file above is only an opinion while
  # the unit still carries a `--node-taint` from join time; k3s would still
  # apply what ExecStart names at the next registration. This takes the argument
  # pair out, so the profile is the single source. See the expression's own
  # comment in ../defaults/main.yml for what it matches and why its value guard
  # is load-bearing.
  #
  # `replace` and not `lineinfile`: the flag and its value are two consecutive
  # lines that must go TOGETHER, and a line-wise edit that removed one of them
  # would leave the other as a bare positional argument.
  ansible.builtin.replace:
    path: "{{ k3s_config_agent_unit }}"
    regexp: "{{ k3s_config_agent_unit_node_taint_regexp }}"
    replace: ""
  become: true
  register: k3s_config_agent_unit_taint_strip
  when: k3s_config_cluster_role == 'agent'

- name: Make systemd re-read the agent unit this pass rewrote
  # daemon_reload ONLY. No `state:` — this role must never restart k3s-agent,
  # which would kill every CI job running on the node; the rewritten unit takes
  # effect at the next start, exactly like the config files above. Reached only
  # when this pass actually edited something, so a converged node reloads
  # nothing.
  #
  # ONE RELOAD FOR BOTH EDITS THIS ROLE CAN MAKE TO THE AGENT UNIT — the
  # `--node-taint` strip and the data-directory ordering drop-in. Two reload
  # tasks would be two answers to one question, and systemd needs telling once
  # per pass however many files changed.
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when:
    - k3s_config_cluster_role == 'agent'
    - k3s_config_agent_unit_taint_strip.changed or k3s_config_data_dir_ordering.changed

- name: Create the packaged-manifest directory on the server
  # 0700 as the shell installed it. This is under /var/lib/rancher/k3s/server/
  # on disk, NOT the tmpfs datastore, so the marker below is reboot-durable.
  ansible.builtin.file:
    path: "{{ k3s_config_manifests_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  when: k3s_config_cluster_role == 'server'

- name: Write the bundled local-storage skip marker on the server
  # The second of two enforcement points for one disable: `disable:
  # [local-storage]` in the config file, and this marker, which is k3s's
  # documented per-manifest opt-out and holds independently of how config-file
  # and command-line --disable values are merged. Both are written so the
  # fleet-owned provisioner can never be overwritten by the bundled copy.
  #
  # The timestamps are preserved so a re-run is a no-op: a bare `state: touch`
  # reports changed on every pass and would make this role permanently dirty.
  ansible.builtin.file:
    path: "{{ k3s_config_skip_marker }}"
    state: touch
    owner: root
    group: root
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  become: true
  when: k3s_config_cluster_role == 'server'

- name: Remove a server-only skip marker from an agent
  # Left by an earlier run that installed the server config here. An agent
  # deploys no packaged component, so there is nothing for it to disable.
  ansible.builtin.file:
    path: "{{ k3s_config_skip_marker }}"
    state: absent
  become: true
  when: k3s_config_cluster_role == 'agent'
