---
# fabro_server — the host-direct Fabro dark-factory server and web console.
#
# Replaces fabro-hosts services/fabro-server/{install.sh,render-unit.sh,
# render-settings.sh} and their hosts/<host>.env values files.
#
# THE ROLE ACTS ON ONE INSTANCE PER INVOCATION. A host runs more than one
# Fabro server, because Fabro holds exactly one GitHub integration per server
# and the mi-homelab organisation's App is private to that organisation, so it
# cannot share the fleet server. The playbook therefore loops the role over
# the host's instance list rather than the role looping internally, which
# keeps every task's `when`, `notify` and handler scoped to a single unit:
#
#     - name: Install every Fabro instance on this host
#       ansible.builtin.include_role:
#         name: fabro_server
#       loop: "{{ fabro_server_instances }}"
#       loop_control:
#         loop_var: fabro_server_instance
#         label: "{{ fabro_server_instance.unit_name }}"
#
# ADDING A THIRD INSTANCE. Append one more mapping to that host's
# `fabro_server_instances` in host_vars, with a `unit_name`, `home_dir` and
# `port` no other instance on the host uses; the role asserts all three are
# unique before it touches anything. Nothing in the role changes. Four pieces
# of out-of-band state must exist first, none of which this role creates:
# the instance's <home_dir>/storage/server.env, its settings.toml, its GitHub
# App private key in the instance's own Fabro vault, and a `tailscale serve`
# mapping for the new port in the tailscale-admin repository. The Fabro
# binary at <host_home>/.fabro/bin/fabro is shared and needs nothing new —
# unless the instance names a `binary_path` of its own, which is a fifth
# piece of out-of-band state UNLESS the instance also names a
# `binary_source`: the role never builds a binary, but it will install one it
# is told to copy from the control node.

# The host's instances. Supplied per host in host_vars; see HOST_VARS.md for
# the five that exist today. The role reads this list only to prove the
# instances do not collide with one another.
fabro_server_instances: []

# The single instance this invocation installs, set by the playbook's
# loop_var. Empty here so the role fails its own preflight assert with a
# readable message rather than a Jinja error when a caller forgets it.
#
# Every axis below must be spelled explicitly in each instance mapping:
#
#   unit_name           systemd unit stem, e.g. fabro-server-mi-homelab
#   home_dir            per-instance state root: storage/, settings.toml
#   port                loopback bind, and the verifier's probe target
#   canonical_host      tailnet name:port; the verifier's Host: header
#   cli_target_url      loopback on every host; auth.json is keyed by it
#   max_concurrent_runs the sole machine-wide capacity control
#   github_app_id       which factory bot this instance publishes as
#   otel_dropin         present | absent | unmanaged; see below
#
# Six further axes are OPTIONAL and default, because omitting one cannot
# make two instances collide — it only preserves prior behaviour:
#
#   binary_path         the Fabro binary this instance's unit starts.
#                       Defaults to <host_home>/.fabro/bin/fabro, the binary
#                       every instance shared when it was the only one there
#                       could be. An instance names its own to run a
#                       DIFFERENT BUILD from its siblings, which is what a
#                       cutover rehearsal is: hp's candidate instance carries
#                       the build production moves onto, beside the fleet
#                       instance still carrying the current one. The role
#                       never builds it; the preflight stats the path this
#                       axis resolves to, so a declared-but-absent binary is
#                       refused before anything is written.
#
#   home_env            the unit's Environment=HOME. Defaults to
#                       <host_home>. Independent of home_dir on purpose:
#                       home_dir is the state root the server is POINTED at
#                       with --storage-dir and --config, while this is the
#                       HOME its process and its CLI resolve ~/.fabro
#                       against. The fleet instance keeps the account's home
#                       and puts its state in <home>/.fabro; the candidate
#                       instance sets both to its own root, which is how it
#                       was hand-installed on 2026-10-08 and what this axis
#                       exists to express rather than tolerate.
#
#   binary_source       an ABSOLUTE CONTROL-NODE path holding the build this
#   binary_sha256       instance should run, and the sha256 that file must
#                       hash to. Declared together or not at all; both
#                       default to the empty string, which means the role
#                       leaves whatever is at binary_path exactly as it finds
#                       it — the behaviour every instance had before the pair
#                       existed. Where binary_path says which build the unit
#                       STARTS, these say whether the role PUTS one there.
#
#                       Declared, the role checks the control-node file's
#                       digest BEFORE touching the host, and then — only if
#                       the host's copy is not already that build — stages a
#                       copy beside binary_path, keeps the outgoing binary
#                       under a name carrying its own sha256 prefix, and
#                       renames the staged copy into place. A replacement
#                       notifies the restart handler, which still refuses by
#                       default and, wherever it does not, is still gated by
#                       the carrying-runs refusal. Either way replacing a
#                       binary never interrupts a factory that is carrying
#                       runs: a rename leaves the inode a running process
#                       execs untouched. HOST_VARS.md has the whole sequence.
#
#                       The role STILL never builds a binary. What it will do
#                       is carry one the operator has already staged, which
#                       is what makes a by-hand copy to a factory host
#                       unnecessary rather than merely discouraged.
#
#   environments        the instance's sandbox environment CATALOG: a list of
#                       entries, each spelling an id, a docker image, a cpu
#                       count and a memory size. Defaults to the empty list,
#                       which leaves whatever the instance's server holds
#                       exactly as it finds it.
#
#                       This axis is unlike every other one here, because a
#                       sandbox environment is not a file this role renders.
#                       On this engine it is SERVER-MANAGED state: it lives in
#                       the instance's own store, is written through
#                       GET/POST /api/v1/environments and
#                       GET/PUT /api/v1/environments/{id}, and a workflow.toml
#                       [environments.*] table is never selected. So the only
#                       way version control reaches a catalog is a request the
#                       converge makes, authenticated with the FABRO_DEV_TOKEN
#                       the instance's own server.env already carries.
#
#                       Measured 2026-10-11: hp's fabro-server-candidate held
#                       only the server's seeded `default` environment
#                       (buildpack-deps:noble, 2 CPU, 4GB), so the canary run
#                       dispatched to it was prepared in that image and failed
#                       with `mise: not found`. The axis is how the factory's
#                       own environment stops being something somebody has to
#                       remember to POST by hand.
#
#   service_state       running (default) | stopped. `stopped` means the
#                       instance's unit, drop-in, settings.toml and state
#                       directory are all KEPT on the host but the unit is
#                       stopped and disabled, the restart handler never
#                       fires for it, and the running-server verification is
#                       skipped. It is how an instance is parked in version
#                       control — a project on hold — rather than deleted
#                       from the list (which would leave its unit running,
#                       unmanaged, on the host). Bring it back by flipping
#                       the word to running and re-applying. The stop is
#                       refused while the instance is carrying active runs,
#                       by the same quiet-server guard that gates a restart.
#
# render-unit.sh defaulted three of these (unit_name to fabro-server,
# home_dir to $HOME/.fabro, port to 32276) so that the two pre-instance
# values files needed no edit. That compatibility debt is deliberately NOT
# carried over. The template's own header records why it is a hazard: an
# instance that relied on the defaults would silently share the fleet
# server's state directory. Requiring all three spelled out costs three lines
# per instance in host_vars and removes that failure class entirely.
fabro_server_instance: {}

# --- per-host axes, identical across the instances on one host -------------
#
# Left undefined on purpose. The shell renderer exited 3 on an unset name;
# leaving these undefined is the same refusal, raised by Ansible before any
# file is written. Supply them in host_vars — see HOST_VARS.md.
#
#   fabro_server_host_user       service account: ubuntu on vps, cwoolley on hp
#   fabro_server_host_group      follows the account
#   fabro_server_host_home       follows the account; every ~/.fabro path with it
#   fabro_server_host_checkout   the stable primary checkout the server runs in

# --- the checkout's remote, the one per-host axis that DOES default --------
#
# The git remote the checkout above is cloned from on a host that has none,
# and the ref that clone is left on. These default where the four axes above
# refuse, because they are OPTIONAL rather than required: an omitted remote
# cannot make two instances collide or point a unit at the wrong state — it
# only keeps the behaviour every host had before the axis existed.
#
# WHY THE ROLE CLONES AT ALL, having refused to create every other piece of
# out-of-band state. Each of those stands in for a step only an operator can
# take: a SESSION_SECRET Fabro itself generates, a GitHub App key held in the
# instance's own vault, a `tailscale serve` mapping that lives in another
# repository, a binary this role will never build. A git clone is none of
# those — it is derivable from one URL — and on a factory host that has no
# checkout the refusal below left exactly one way through: a hand clone, which
# the fleet host guard denies. The checkout is PROVISIONING, not out-of-band
# state.
#
# EMPTY is the only safe default, for the same reason binary_source's is: it
# is the one value that means "touch nothing", and touching nothing is what
# every host did before the axis existed. A host that declares nothing here is
# refused by the checkout preflight exactly as it was.
fabro_server_host_checkout_remote: ""

# Read ONLY by a clone. `HEAD` is git's own word for "whatever the remote says
# its default branch is", so this default names no branch of its own — a
# hard-coded `master` would be this repository's guess about another
# repository's naming, wrong silently on the day that guess stops holding.
# Changing it cannot move a live factory off its branch: an existing checkout
# is never reset, so nothing re-reads this once the directory is there.
fabro_server_host_checkout_ref: HEAD

# The verifier's retry budget, in ~1s attempts. render-unit.sh REQUIRED this
# with no default, so a values file that forgot it was refused. A role
# default is safer than that refusal, but only if the default is 300 and not
# the verifier script's own 60: cold SlateDB warmup under host load can
# exceed 60s, which fails ExecStartPost, which makes Restart=always kill a
# half-booted server — a crash loop that does not recover. Observed on vps
# 2026-08-17. All four instances set 300 today; 300 is the value that makes
# a forgotten variable harmless instead of latent.
fabro_server_web_verify_attempts: 300

# --- restart policy --------------------------------------------------------
#
# THE ROLE DOES NOT RESTART A FABRO SERVER UNLESS THIS IS TRUE.
#
# install.sh restarted unconditionally, guarded by require_quiet_server:
# it asked the instance's own /api/v1/health, and if the server answered, ran
# `fabro --json ps` as the service account and exited 3 while any run was
# active. That guard is preserved below as a preflight assert, but a guard
# alone is not enough here. A handler fires at the end of a play, minutes
# after the check that cleared it, and a Fabro run admitted in between would
# be killed by the restart. Anything the orchestrator dispatches during a
# converge run lands in exactly that window.
#
# So the safe default is that a changed unit file is written and left to take
# effect at the next restart the operator chooses, with Ansible reporting the
# instance as changed. Set this true for a deliberate, attended restart of a
# quiet server; the preflight then re-checks that it really is quiet.
fabro_server_restart_allowed: false

# --- an attended stop or restart that ACCEPTS run loss ---------------------
#
# The carrying-runs refusal below protects in-flight work, and on a busy factory
# it can never pass: other sessions' dispatchers admit new runs during the
# play's preflight, so "re-run when the instance is quiet" does not converge.
# Measured on hp-xubuntu 2026-10-12: three attended restarts in a row refused
# with 2-3 runs admitted after the instance had been emptied. Without this key
# the role had no way to stop or restart a busy instance at all, and the fleet
# host guard forbids doing it by hand.
#
# Setting this true, together with fabro_server_restart_allowed (or
# service_state: stopped), is the operator's explicit acceptance that every run
# the instance is carrying is killed. The probe still runs and reports the
# count; only the refusal is waived. Never set it in host_vars: it is a
# per-invocation decision (-e fabro_server_interrupt_runs_allowed=true).
fabro_server_interrupt_runs_allowed: false

# --- where a refused restart is REMEMBERED ---------------------------------
#
# A REFUSAL THAT CANNOT BE REDEEMED IS NOT A DEFERRAL. The comment above says a
# changed unit file is "left to take effect at the next restart the operator
# chooses". That was not true of the role as it stood: the notification lived
# only in the run's own handler queue, so the next run — the one the operator
# makes with -e fabro_server_restart_allowed=true, exactly as HOST_VARS.md
# tells them to — arrived with nothing to act on and restarted nothing.
#
# Measured on hp-xubuntu 2026-10-11 (work-item livespec-dev-tooling-vmeiv6):
# pass 1 installed the v0.382 carrier at the candidate's binary_path and
# changed its unit with the flag false, and reported the instance NOT
# restarted. Pass 2 with the flag true cleared the carrying-runs refusal,
# changed nothing, never notified the handler, and left the candidate serving
# 0.378.0-nightly.0 with 72 hours of uptime. Nothing errored, which is what
# made it survive: the second run's output is indistinguishable from a
# converged host's.
#
# So the deferral is written to a FILE on the host, one per instance, and a
# later run reads it. This is the mechanism docker_sandbox_slice already uses
# for the same shape (a setting that takes effect only on a restart, recorded
# as pending and applied by an operator-selected run); the difference is that
# this marker is PER INSTANCE, because a host runs several Fabro servers and a
# marker naming only the host would not say which of them owes the restart.
#
# The directory is the role's; the file inside it is named for the instance's
# unit, resolved as fabro_server_restart_pending_marker in tasks/main.yml.
# /var/lib rather than /run: this must survive a reboot. A deferral that a
# reboot forgot would be worse than none, because a reboot STARTS the instance
# from its new unit file and so silently resolves some deferrals and not
# others, leaving no way to tell which.
fabro_server_restart_pending_dir: /var/lib/fabro-server/restart-pending

# --- settings.toml ---------------------------------------------------------
#
# False means the settings template is rendered in permanent check mode and
# only reports drift; true means it is written. Read the long comment on that
# task in tasks/main.yml before setting this true on any host: vps's live
# settings.toml is hand-maintained and holds its explicit
# max_concurrent_runs = 10.
fabro_server_manage_settings: false

# 0600 is the mode the newer instances carry. vps's fleet settings.toml is
# currently 0664 on a shared box carrying dozens of user sessions, so the
# drift report will flag that too; that is a real finding, not noise.
fabro_server_settings_mode: "0600"

# --- otel.conf, an OPEN DECISION -------------------------------------------
#
# Per-instance, three-valued, and deliberately not a boolean:
#
#   present    install the OTLP drop-in
#   absent     remove it — this instance is decided NOT to export
#   unmanaged  no decision has been made; leave whatever is on the host
#
# fabro-hosts' README records an unresolved call: installing the shipped set
# on vps "newly adds OTLP export … a behavior change, not a transcription —
# make that call deliberately". THIS ROLE DOES NOT MAKE THAT CALL. Measuring
# all four instances on 2026-09-09 narrows it further than the README's
# host-level statement: the drop-in is present on hp's two instances and on
# vps's mi-homelab instance, and absent on exactly one — vps's fleet
# `fabro-server`. So HOST_VARS.md sets `present` on three and `unmanaged` on
# that one, and the open decision is now a single word in one place.
#
# A boolean could not express this. `false` would mean "decided against OTLP
# on vps", which nobody decided, and would make the role actively delete the
# drop-in anywhere it was flipped. `unmanaged` says undecided and does
# nothing. Note that `absent` really does remove the file: setting it on an
# hp instance would strip working telemetry.
fabro_server_otel_dropin_default: unmanaged

# --- the catalog entry a NEW environment is derived from -------------------
#
# A create or replace request to /api/v1/environments requires EVERY field the
# server's build knows and refuses ANY field it does not, and an `environments`
# declaration names only four of them. The rest — the provider, the network
# policy, the lifecycle, the labels, the environment variables — are carried
# from a catalog entry the server itself returned, which is the one body shape
# that cannot be wrong about a schema this repository cannot know. hp runs two
# instances on two different Fabro builds on purpose, so "cannot know" is the
# normal case rather than a hypothetical.
#
# For an environment the catalog already holds, that entry IS its own base. For
# one it does not hold yet, this names the entry to derive from: `default`, the
# environment every Fabro server seeds, so a factory host always has one. It is
# not a per-instance axis because an instance that needed a different base would
# be declaring a second environment, which the axis already expresses.
fabro_server_environment_template_id: default

# --- shared, host-invariant destinations -----------------------------------
fabro_server_libexec_dir: /usr/local/libexec
fabro_server_unit_dir: /etc/systemd/system

# Where the docker_engine role's guarded install keeps its state, and so where
# its commit marker `confirmed` appears. The service account is put in the
# docker group only on a host with no such directory (its Docker predates the
# guard) or with the marker present: before the commit point that guard refuses
# a host on which any account is in the group. Kept equal to
# docker_engine_state_root in roles/docker_engine/defaults/main.yml.
fabro_server_docker_engine_state_root: /var/lib/docker-engine-guard
