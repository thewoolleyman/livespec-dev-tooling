# Installed as /etc/systemd/system/fabro-server.service.d/otel.conf.
#
# Host-invariant: the endpoint is the docker bridge gateway, which is
# 172.17.0.1 on both current factories. Present on hp since the telemetry
# track landed; NOT present on vps as of 2026-08-19.
[Service]
Environment=OTEL_EXPORTER_OTLP_ENDPOINT=http://172.17.0.1:4318
Environment=OTEL_EXPORTER_OTLP_PROTOCOL=http/json
Environment=OTEL_SERVICE_NAME=fabro
