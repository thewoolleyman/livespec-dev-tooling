---
# The one restart in the role, and it refuses by default.
#
# `systemctl restart` on a Fabro server kills whatever it is carrying. Both
# hosts run live factories, so this handler is gated on an explicit
# fabro_server_restart_allowed, and the preflight in tasks/main.yml re-checks
# that the instance has no active runs before that flag is honoured.
#
# The unit name comes from a fact rather than from the handler's own scope, so
# tasks/main.yml flushes handlers inside each loop iteration. Without that
# flush, two instances notifying this one handler would collapse into a single
# restart carrying the last iteration's unit name.

- name: Restart the Fabro instance
  listen: Fabro instance files changed
  ansible.builtin.systemd_service:
    name: "{{ fabro_server_unit_name }}.service"
    state: restarted
    daemon_reload: true
  become: true
  # Registered so the handler below can clear the marker on the strength of
  # THIS handler's own result rather than by re-deriving its conditions. Two
  # copies of a restart gate is precisely the drift that would let the marker
  # be deleted on a run that did not restart.
  register: fabro_server_restart_applied
  when:
    # Both halves matter. The first is the live-factory refusal; the second is
    # the check-mode guard, because under `--check` the unit file this handler
    # was notified about was never written, and systemd cannot restart a unit
    # that is not on disk.
    - fabro_server_restart_allowed | bool
    - not ansible_check_mode or fabro_server_unit_file.stat.exists
    # A parked instance (service_state: stopped) is never restarted by a
    # files-changed notify: its files are written for the day it comes back,
    # and the supervise step has already stopped and disabled it.
    - fabro_server_service_state == 'running'

- name: Clear the restart-pending marker this restart satisfied
  listen: Fabro instance files changed
  # The restart above is the ONLY thing that clears the marker, so a deferral
  # outlives every run that does not apply it — which is the property that
  # makes the marker worth writing at all.
  #
  # Gated on the restart's own `changed`, NOT on a second copy of its
  # conditions and NOT on `skipped`. `changed` is unambiguous in both
  # directions: a handler that restarted reports true, and one skipped by its
  # `when` reports false. `skipped` is not — it is ABSENT on a task that ran,
  # so any `default()` for it has to be wrong in one of the two cases, and the
  # case it would be wrong in is "the restart happened", where the marker
  # would survive a restart that had already satisfied it and leave the
  # instance permanently owing one.
  ansible.builtin.file:
    path: "{{ fabro_server_restart_pending_marker }}"
    state: absent
  become: true
  when: fabro_server_restart_applied.changed | default(false)

- name: Record that this instance's restart is deferred
  listen: Fabro instance files changed
  # THE DURABLE HALF OF THE REFUSAL, and the reason the handler below is no
  # longer the whole story. A message in the play recap reaches the operator
  # watching THIS run; it reaches nothing at all on the next one, and the next
  # one is where the deferral has to be readable — HOST_VARS.md tells the
  # operator to re-run with fabro_server_restart_allowed true, and that run can
  # only act on what the host still holds.
  #
  # The content is deliberately CONSTANT for an instance — no timestamp, no
  # list of what changed — exactly as docker_sandbox_slice's marker is. Two
  # consecutive refused runs then write identical bytes, so the second reports
  # no change and the marker reads as one standing deferral rather than as a
  # fresh event per converge. What changed on which run belongs in the recap
  # message below, which is per-run by nature; a marker that churned would be
  # a marker nobody could diff.
  ansible.builtin.copy:
    content: |
      {{ fabro_server_unit_name }} on {{ inventory_hostname }} OWES A RESTART.

      Files this role manages for this instance — its systemd unit, its OTLP
      drop-in, its settings.toml, or the Fabro binary at
      {{ fabro_server_binary_path }} — describe a server that is not the one
      currently running. The run that changed them had
      fabro_server_restart_allowed false, so nothing was restarted and the
      instance keeps serving its current runs under the OLD configuration.

      To apply it: re-run this role against this instance with
      -e fabro_server_restart_allowed=true, inside a window in which the
      instance carries no active runs. That run re-checks the carrying-runs
      refusal, restarts the instance, and deletes this file.

      Nothing else deletes it. Every further run with
      fabro_server_restart_allowed false rewrites these same bytes and leaves
      the deferral standing, so this file is present for exactly as long as
      the restart is owed.
    dest: "{{ fabro_server_restart_pending_marker }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    # The mirror image of the restart above: this is the record of the restart
    # that did NOT happen, so it is owed on exactly the runs the restart is
    # refused on. A marker written on a run that restarted would be a marker
    # that means nothing by the second converge.
    - not (fabro_server_restart_allowed | bool)
    # Not owed for a parked instance, for the same reason the restart is not:
    # there is no running server describing a configuration other than its
    # files, so there is no drift to carry forward.
    - fabro_server_service_state == 'running'

- name: Say which instance was left needing a restart
  listen: Fabro instance files changed
  # A changed unit file that is not applied is not a no-op — the host now
  # holds a file describing a server that is not the one running. Naming it is
  # what stops that becoming invisible drift of the kind this whole migration
  # exists to end.
  ansible.builtin.debug:
    msg: >-
      {{ fabro_server_unit_name }} on {{ inventory_hostname }}: this instance's
      restart is STILL PENDING and was NOT performed, because
      fabro_server_restart_allowed is false. The instance keeps serving its
      current runs under the OLD configuration until someone restarts it.
      The deferral is recorded at {{ fabro_server_restart_pending_marker }} and
      is kept by every further run with the flag false, so it is not lost with
      this run. Quiesce the instance and re-run with
      -e fabro_server_restart_allowed=true, which reads that file, re-checks
      the carrying-runs refusal, restarts the instance and removes it.
  when:
    - not (fabro_server_restart_allowed | bool)
    # Not owed for a parked instance: there is no running server left
    # describing a configuration other than its files.
    - fabro_server_service_state == 'running'
