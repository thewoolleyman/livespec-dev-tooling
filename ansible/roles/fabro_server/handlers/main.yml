---
# The one restart in the role, and it refuses by default.
#
# `systemctl restart` on a Fabro server kills whatever it is carrying. Both
# hosts run live factories, so this handler is gated on an explicit
# fabro_server_restart_allowed, and the preflight in tasks/main.yml re-checks
# that the instance has no active runs before that flag is honoured.
#
# The unit name comes from a fact rather than from the handler's own scope, so
# tasks/main.yml flushes handlers inside each loop iteration. Without that
# flush, two instances notifying this one handler would collapse into a single
# restart carrying the last iteration's unit name.

- name: Restart the Fabro instance
  listen: Fabro instance files changed
  ansible.builtin.systemd_service:
    name: "{{ fabro_server_unit_name }}.service"
    state: restarted
    daemon_reload: true
  become: true
  when:
    # Both halves matter. The first is the live-factory refusal; the second is
    # the check-mode guard, because under `--check` the unit file this handler
    # was notified about was never written, and systemd cannot restart a unit
    # that is not on disk.
    - fabro_server_restart_allowed | bool
    - not ansible_check_mode or fabro_server_unit_file.stat.exists
    # A parked instance (service_state: stopped) is never restarted by a
    # files-changed notify: its files are written for the day it comes back,
    # and the supervise step has already stopped and disabled it.
    - fabro_server_service_state == 'running'

- name: Record that this instance's restart is still pending
  listen: Fabro instance files changed
  # THE DEFERRAL, WRITTEN DOWN. The debug handler below says the same thing to
  # whoever is watching the play; this says it to whoever runs the NEXT play,
  # which is the person who can act on it. Measured on hp-xubuntu 2026-10-11:
  # without this file the re-run HOST_VARS.md asks for found nothing changed,
  # notified no handler, and left the candidate instance serving the build it
  # had before the carrier was installed.
  #
  # The content is deliberately constant — no timestamp, no digest — so a
  # second refusing run before the window opens rewrites identical bytes and
  # reports no change. A marker that reported changed on every converge would
  # be indistinguishable from a fresh deferral.
  ansible.builtin.copy:
    content: |
      {{ fabro_server_unit_name }} on this host is running configuration or a
      Fabro build other than the one its files now describe. An Ansible run
      changed those files and did NOT restart the instance, because
      fabro_server_restart_allowed was false.

      Apply the restart by re-running the play for this host with
      -e fabro_server_restart_allowed=true, after quiescing this instance: the
      carrying-runs refusal halts the play while the instance has active runs,
      and the restart kills whatever it is carrying. Nothing but that restart
      removes this file.
    dest: "{{ fabro_server_restart_pending_marker }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    # Only a run that REFUSED the restart records one as owed. A marker written
    # beside a restart that actually happened is a deferral the next permitting
    # run would apply against an instance that needs nothing.
    - not (fabro_server_restart_allowed | bool)
    # Not owed for a parked instance, for the same reason the debug below is
    # not: there is no running server left describing a configuration other
    # than its files, so there is no restart to carry forward.
    - fabro_server_service_state == 'running'

- name: Say which instance was left needing a restart
  listen: Fabro instance files changed
  # A changed unit file that is not applied is not a no-op — the host now
  # holds a file describing a server that is not the one running. Naming it is
  # what stops that becoming invisible drift of the kind this whole migration
  # exists to end.
  ansible.builtin.debug:
    msg: >-
      {{ fabro_server_unit_name }} on {{ inventory_hostname }}: files changed
      but the running server was NOT restarted, because
      fabro_server_restart_allowed is false. The instance keeps serving its
      current runs under the OLD configuration until someone restarts it.
      Quiesce the instance and re-run with -e fabro_server_restart_allowed=true,
      or restart it by hand.
  when:
    - not (fabro_server_restart_allowed | bool)
    # Not owed for a parked instance: there is no running server left
    # describing a configuration other than its files.
    - fabro_server_service_state == 'running'
