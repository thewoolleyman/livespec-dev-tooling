---
# fabro_server — install and supervise ONE Fabro dark-factory instance.
#
# R4.S8 of livespec plan k3s-on-gmktec-for-vps-usage (epic livespec-sab5gn),
# work-item livespec-sab5gn.4. Replaces fabro-hosts
# services/fabro-server/install.sh together with the two renderers it drove,
# render-unit.sh and render-settings.sh, and the four hosts/<host>.env values
# files those read. Live values move to host_vars; see HOST_VARS.md.
#
# WHAT THIS ROLE IS ALLOWED TO DO. It writes the shared verifier, one unit
# file, and one OTLP drop-in, then makes sure the unit is enabled and running.
# It also INSTALLS the instance's Fabro binary — but only for an instance that
# declares binary_source and binary_sha256, and only from a control-node file
# that really hashes to that digest. It still never BUILDS one, and an
# instance that declares neither axis leaves whatever the host holds exactly
# as it found it. It does NOT restart a running server unless told it may,
# does NOT write settings.toml unless told to, does NOT kill any process, and
# does not create any of the other pieces of out-of-band state the instance
# needs. Every one of those refusals is a preflight assert below rather than a
# mid-run failure, because this service is the orchestrator's own server: on
# both hosts it is carrying live Fabro runs while this role runs against it.
#
# THE HOST GUARD DOES NOT MIGRATE. install.sh refused to apply one host's
# values on another, comparing the values file's canonical host against both
# `hostname -s` and the tailnet label from `tailscale status`. It needed both
# because the two names differ on vps: the OS hostname is the provider's VM id
# `vmi3006760` while the canonical host is built from the tailnet name `vps`.
# Under Ansible that guard is inventory targeting — a host's values reach only
# that host because they are that host's host_vars — so it is deliberately not
# reimplemented as a task. The vmi3006760/vps split survives only as this
# note and as the inventory entry's name, which is the tailnet label.
#
# THERE IS NO fabro_server_system_hostname VARIABLE, AND THAT IS ON PURPOSE.
# fabro-hosts' services/storage-reclaim/hosts/vps.env carries a note, dated
# 2026-08-22 and still on master, saying "services/fabro-server/install.sh
# still derives it, so it cannot currently run on vps". That claim has since
# rotted. As committed today install.sh derives `expected` from the canonical
# host but then accepts EITHER name:
#
#   [[ "${expected}" == "${os_name}" || ( -n "${tailnet_name}" && "${expected}" == "${tailnet_name}" ) ]]
#
# On vps that is vps == vmi3006760 (false) OR vps == vps (true), so the guard
# passes. The installer's own comment dates the fix 2026-08-23, one day after
# the note was written. The reclaim services record the system hostname as its
# own value because the env file they SHIP is read back at runtime by a script
# on the host; nothing in this role reads a hostname at all, so recording one
# here would be a variable no task consumes. The real value is in
# HOST_VARS.md as documentation.

- name: Resolve this instance's axes
  # Facts rather than block vars, because the restart handler resolves its
  # unit name in the host's variable context and cannot see a block's scope.
  # These are overwritten at the top of every loop iteration, so they always
  # describe the instance being installed. They do persist past the last
  # iteration holding that instance's values; nothing downstream reads them.
  ansible.builtin.set_fact:
    fabro_server_unit_name: "{{ fabro_server_instance.unit_name }}"
    fabro_server_home_dir: "{{ fabro_server_instance.home_dir }}"
    fabro_server_port: "{{ fabro_server_instance.port }}"
    fabro_server_canonical_host: "{{ fabro_server_instance.canonical_host }}"
    fabro_server_cli_target_url: "{{ fabro_server_instance.cli_target_url }}"
    fabro_server_max_concurrent_runs: "{{ fabro_server_instance.max_concurrent_runs }}"
    fabro_server_github_app_id: "{{ fabro_server_instance.github_app_id }}"
    fabro_server_otel_dropin: "{{ fabro_server_instance.otel_dropin | default(fabro_server_otel_dropin_default) }}"
    # OPTIONAL, and the one axis that defaults: an instance is `running`
    # unless its mapping says `stopped`. Defaulting is safe here where it was
    # a hazard for unit_name/home_dir/port, because an omitted value cannot
    # make two instances share state — it only keeps the behaviour every
    # instance had before the axis existed.
    fabro_server_service_state: "{{ fabro_server_instance.service_state | default('running') }}"
    # OPTIONAL for the same reason, and defaulting to exactly what the template
    # used to spell inline: the Fabro binary the unit starts, and the HOME it
    # runs with. An instance that names neither renders the bytes the template
    # rendered before these axes existed. An instance that names both — hp's
    # cutover candidate, carrying its own build against its own state root —
    # needs no second role and no hand-installed unit.
    fabro_server_binary_path: "{{ fabro_server_instance.binary_path | default(fabro_server_host_home ~ '/.fabro/bin/fabro') }}"
    fabro_server_home_env: "{{ fabro_server_instance.home_env | default(fabro_server_host_home) }}"
    # OPTIONAL, both, and both EMPTY by default — which is the word for "this
    # instance's binary is not managed from the control node". Where
    # binary_path says which build the unit STARTS, these two say whether the
    # role PUTS one there: a control-node path to copy from, and the sha256
    # that path must hash to. Empty is the only safe default because it is the
    # one value that means "touch nothing", and touching nothing is what every
    # instance did before the pair existed. The two are one decision and are
    # refused apart; see the assert below.
    fabro_server_binary_source: "{{ fabro_server_instance.binary_source | default('') }}"
    fabro_server_binary_sha256: "{{ fabro_server_instance.binary_sha256 | default('') }}"
    # OPTIONAL, and EMPTY by default — the word for "this instance's sandbox
    # environment catalog is not declared here". Unlike every axis above it,
    # this one names SERVER-MANAGED state rather than a file or a unit
    # setting: a sandbox environment lives in the instance's own store and is
    # written through its /api/v1/environments API, so the empty list is also
    # the only default that leaves the catalog of an instance predating the
    # axis exactly as its server holds it.
    fabro_server_environments: "{{ fabro_server_instance.environments | default([]) }}"
    # OPTIONAL, and EMPTY by default, for the same reason: the vault entries
    # this instance must hold, each created only when the vault lacks its name
    # and never overwritten (tasks/vault.yml). An entry spells `name`, `type`
    # (`token` or `file`), an optional `description`, and EITHER
    # `from_controller_env` — the control-node variable the value is read from,
    # for a real credential — OR `value`, for a committed non-secret
    # placeholder.
    fabro_server_vault_secrets: "{{ fabro_server_instance.vault_secrets | default([]) }}"
    # OPTIONAL, and EMPTY by default — the word for "this instance launches no
    # third-party sandbox-driver plugin". A mapping from a provider kind to the
    # plugin Fabro launches for it, rendered as one
    # `[server.sandbox.providers.<kind>]` table each in settings.toml. Empty
    # renders settings.toml exactly as it rendered before the axis existed,
    # which is what every instance predating it needs.
    fabro_server_sandbox_providers: "{{ fabro_server_instance.sandbox_providers | default({}) }}"

- name: Refuse an instance mapping that does not spell every axis
  # render-unit.sh exited 3 naming the one variable a values file had missed.
  # This is that message, raised once for the whole mapping and before any
  # host state is read, rather than as a Jinja undefined error part-way
  # through rendering a unit file.
  ansible.builtin.assert:
    that:
      - fabro_server_instance | length > 0
      - _fabro_server_required_keys | difference(fabro_server_instance.keys() | list) | length == 0
    fail_msg: >-
      This instance mapping is incomplete. Every one of
      {{ _fabro_server_required_keys | join(', ') }} must be spelled out in the
      host's fabro_server_instances entry; missing
      {{ _fabro_server_required_keys | difference(fabro_server_instance.keys() | list) | join(', ') | default('the whole mapping', true) }}.
      See roles/fabro_server/HOST_VARS.md.
    success_msg: instance mapping is complete
  vars:
    _fabro_server_required_keys:
      - unit_name
      - home_dir
      - port
      - canonical_host
      - cli_target_url
      - max_concurrent_runs
      - github_app_id
      - otel_dropin

- name: Refuse two instances on this host that would share a unit, a state directory or a port
  # fabro-hosts proved this from the render, in install.test.sh, because the
  # shell installer only ever saw one values file at a time and could not.
  # Ansible sees the whole host's list, so the proof moves from a repo-side
  # test to the play that does the installing. A collision here is not a
  # cosmetic clash: two units sharing a home_dir share a SlateDB store.
  ansible.builtin.assert:
    that:
      - (fabro_server_instances | map(attribute='unit_name', default='') | list | unique | length) == (fabro_server_instances | length)
      - (fabro_server_instances | map(attribute='home_dir', default='') | list | unique | length) == (fabro_server_instances | length)
      - (fabro_server_instances | map(attribute='port', default='') | list | unique | length) == (fabro_server_instances | length)
    fail_msg: >-
      Two entries in this host's fabro_server_instances share a unit_name, a
      home_dir or a port. Each instance needs all three to itself.
    success_msg: this host's instances are distinct
  when: fabro_server_instances | length > 1

- name: Refuse an unrecognised otel drop-in disposition
  # A three-valued word rather than a boolean, so that "nobody has decided"
  # is expressible and is not silently the same as "decided against". A typo
  # would read as false under a boolean and quietly remove a live drop-in.
  ansible.builtin.assert:
    that:
      - fabro_server_otel_dropin in ['present', 'absent', 'unmanaged']
    fail_msg: >-
      otel_dropin for {{ fabro_server_unit_name }} is
      '{{ fabro_server_otel_dropin }}'; it must be present, absent or unmanaged.
    success_msg: otel drop-in disposition is understood

- name: Refuse an unrecognised service_state disposition
  # Two words, not a boolean, for the same reason as otel_dropin: a typo must
  # fail loudly here rather than read as "not stopped" and start a parked
  # instance, or read as "not running" and stop a live factory.
  ansible.builtin.assert:
    that:
      - fabro_server_service_state in ['running', 'stopped']
    fail_msg: >-
      service_state for {{ fabro_server_unit_name }} is
      '{{ fabro_server_service_state }}'; it must be running or stopped.
    success_msg: service_state disposition is understood

- name: Refuse an instance that does not spell both halves of the binary-install pair
  ansible.builtin.assert:
    that:
      # The two axes are one decision, and either half alone is a hazard
      # rather than a partial feature. A source with no digest installs
      # whatever the control node happens to hold at that path today — the
      # "a build placed by hand" failure this pair exists to end, re-expressed
      # one layer up. A digest with no source names a build nothing reads.
      - (fabro_server_binary_source | length > 0) == (fabro_server_binary_sha256 | length > 0)
      # Absolute, because the alternative failure is quiet rather than loud:
      # ansible.builtin.copy resolves a RELATIVE src against the role's own
      # files/ directory, so a relative source would look for the build inside
      # this repository and fail naming a path the operator never wrote.
      - fabro_server_binary_source | length == 0 or fabro_server_binary_source[:1] == '/'
    fail_msg: >-
      binary_source and binary_sha256 for {{ fabro_server_unit_name }} must be
      declared together, and binary_source must be an absolute control-node
      path. This instance declares binary_source
      '{{ fabro_server_binary_source }}' and binary_sha256
      '{{ fabro_server_binary_sha256 }}'. Declaring NEITHER is the normal case
      and leaves the host's binary alone.
    success_msg: this instance's binary-install pair is either absent or complete

- name: Refuse an environment declaration that does not spell every field
  # A PREFLIGHT, like every other refusal in this file, and for a sharper
  # reason than most: a declaration missing a field reaches the environments
  # API as a body the server refuses outright — every field of a create or
  # replace request is required and an unknown one is rejected — so an
  # incomplete declaration would present as a 422 part-way through a converge
  # rather than as a refusal before the host is read.
  #
  # The memory grammar is Fabro's own: an integer and one of its size units.
  # It is checked here because the alternative is a 422 naming a serde type,
  # and because the unit decides what the server STORES — note that Fabro
  # re-renders a stored size in the largest decimal unit that divides it
  # exactly, so a value spelled some other way (a binary unit, or 8000MB for
  # 8GB) converges but is reported as changed on every subsequent run.
  # Declare the size the way Fabro renders it.
  ansible.builtin.assert:
    that:
      - (_fabro_server_environment_fields
        if (item.provider | default('docker')) in ['docker', 'daytona']
        else (_fabro_server_environment_fields | reject('equalto', 'image') | list))
        | difference(item.keys() | list) | length == 0
      - item.id | default('') | length > 0
      - (item.image | default('') | length > 0)
        if (item.provider | default('docker')) in ['docker', 'daytona']
        else (item.image is not defined)
      - (item.cpu | default(0) | int) > 0
      - item.memory | default('') is match('^[0-9]+(B|KB|MB|GB|TB|KiB|MiB|GiB|TiB)$')
    fail_msg: >-
      This declared environment of {{ fabro_server_unit_name }} is incomplete or
      malformed. Every one of {{ _fabro_server_environment_fields | join(', ') }}
      must be spelled out: a non-empty id to write it in the catalog under, a
      non-empty docker image, a cpu count above zero, and a memory size that is
      an integer followed by one of B, KB, MB, GB, TB, KiB, MiB, GiB or TiB.
      An entry whose provider is a registered plugin kind (anything but docker or
      daytona) must declare NO image: Petri builds that provider's sandboxes from
      the provider's own process_spec and refuses a run whose environment names
      an image ("is a registered provider; `image` applies to `docker` and
      `daytona` only").
      This entry declares {{ item | dict2items | map(attribute='key') | sort | join(', ') }}.
      See roles/fabro_server/HOST_VARS.md.
    success_msg: this environment declaration is complete
  vars:
    _fabro_server_environment_fields:
      - id
      - image
      - cpu
      - memory
  loop: "{{ fabro_server_environments }}"
  loop_control:
    label: "{{ item.id | default('an entry with no id') }}"

- name: Refuse a sandbox provider declaration Fabro would refuse or could not verify
  # A PREFLIGHT, like every refusal in this file. Fabro rejects plugin fields on
  # its three bundled kinds, so a bundled kind here is a typo for one of them;
  # a relative path resolves against whatever directory the server happens to
  # start in; and a plugin without a sha256 is launched unverified, which a
  # release build of Fabro refuses at the first run that selects it rather
  # than at start. Each is refused here, before the host is read.
  ansible.builtin.assert:
    that:
      - item.key not in ['local', 'docker', 'daytona']
      - item.key is match('^[a-z][a-z0-9-]*$')
      - item.value.path | default('') is match('^/')
      - item.value.sha256 | default('') is match('^[0-9a-f]{64}$')
      - item.value.args | default([]) is sequence and item.value.args | default([]) is not string
      - item.value.inherit_env | default([]) is sequence and item.value.inherit_env | default([]) is not string
      - item.value.host_address is not defined
      - item.value.process_spec is not defined or item.value.process_spec.image | default('') | length > 0
      - item.value.process_spec is not defined or item.value.process_spec.cpu_cores | default(0) | int > 0
      - item.value.process_spec is not defined or item.value.process_spec.memory_mb | default(0) | int > 0
    fail_msg: >-
      The sandbox provider '{{ item.key }}' declared for
      {{ fabro_server_unit_name }} is malformed. A provider kind is a lower-case
      name that is not one of Fabro's bundled kinds (local, docker, daytona); its
      plugin needs an absolute `path` and the 64-hex-digit `sha256` Fabro
      verifies it against; `args` and `inherit_env`, when present, are lists;
      `host_address` is no longer accepted (a registered provider's sandboxes
      have no route back to the host, and Fabro rejects the key); and a
      `process_spec`, when present, names an `image` and a positive
      `cpu_cores` and `memory_mb`.
      See roles/fabro_server/HOST_VARS.md.
    success_msg: this sandbox provider declaration is well formed
  loop: "{{ fabro_server_sandbox_providers | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Refuse an environment whose provider this instance does not declare
  # An environment that names a plugin provider the instance's settings.toml
  # does not configure is written to the catalog without complaint and fails
  # only when a run selects it, as an unconfigured-plugin error mid-dispatch.
  # The provider is OPTIONAL and defaults to docker, the only provider every
  # declaration before this axis used.
  ansible.builtin.assert:
    that:
      - (item.provider | default('docker')) in (['docker'] + (fabro_server_sandbox_providers.keys() | list))
    fail_msg: >-
      The declared environment {{ item.id | default('with no id') }} of
      {{ fabro_server_unit_name }} names provider
      '{{ item.provider | default('docker') }}', which is neither docker nor a
      kind this instance declares under sandbox_providers
      ({{ fabro_server_sandbox_providers.keys() | list | join(', ') or 'none' }}).
    success_msg: this environment's provider is one the instance configures
  loop: "{{ fabro_server_environments }}"
  loop_control:
    label: "{{ item.id | default('an entry with no id') }}"

- name: Refuse two declared environments that share an id
  # The catalog is keyed by id, so two entries carrying one id are two
  # declarations of which only the last would survive — and SILENTLY, because
  # each write succeeds on its own. This is the environments-list analogue of
  # the instance-list refusal above, and it runs for the same reason: the role
  # can see the whole list, so the proof belongs in the play that does the
  # writing rather than in a repo-side test.
  ansible.builtin.assert:
    that:
      - (fabro_server_environments | map(attribute='id') | list | unique | length) == (fabro_server_environments | length)
    fail_msg: >-
      Two of {{ fabro_server_unit_name }}'s declared environments share an id.
      Each declared environment needs an id of its own; the catalog keyed by
      that id is the one thing two entries cannot share.
    success_msg: this instance's declared environments are distinct
  when: fabro_server_environments | length > 1

# --- preflight: the out-of-band state this role refuses to create ----------
#
# install.sh's require_inputs, minus the two source files it checked for,
# which are now role files and cannot be missing. Every check below stands in
# for a manual step documented in fabro-hosts' README. They are grouped at the
# top on purpose: the shell discovered a missing binary after it had already
# written the unit file, and the point of moving them here is that a host with
# unfinished prerequisites is left exactly as it was found.
#
# check_mode: false on each probe, because these are reads. Without it a
# `--check` drift report would skip its own preconditions and report on a host
# it never actually inspected.

- name: Read the control node's copy of the binary this instance installs
  # On the CONTROL NODE, which is the whole point of the axis: the carrier
  # build is staged there once and the operator stops copying binaries to
  # factory hosts by hand. delegate_to keeps this one read local even though
  # every other task in this file speaks to the factory host, and become is
  # explicitly false because the staged build belongs to the operator's own
  # account, not to root.
  ansible.builtin.stat:
    path: "{{ fabro_server_binary_source }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: fabro_server_binary_source_stat
  check_mode: false
  when: fabro_server_binary_source | length > 0

- name: Refuse a control-node binary that is absent or does not hash to its declared digest
  # Before the factory host is read, let alone written. The digest is the only
  # thing standing between "the role installs the build version control names"
  # and "the role installs whatever is at that path today", and that path is
  # inside a mutable state tree under a home directory — exactly the kind of
  # thing that changes underneath a declaration without anyone editing it.
  ansible.builtin.assert:
    that:
      - fabro_server_binary_source_stat.stat.exists
      - fabro_server_binary_source_stat.stat.checksum == fabro_server_binary_sha256
    fail_msg: >-
      {{ fabro_server_binary_source }} on the control node is missing, or its
      sha256 is not the {{ fabro_server_binary_sha256 }} this instance
      declares. Nothing on {{ inventory_hostname }} has been read or changed.
      Stage the build again, or declare the digest it really has — never the
      other way round.
    success_msg: the control node's copy of this instance's binary matches its declared digest
  when: fabro_server_binary_source | length > 0

- name: Look for the Fabro binary this instance starts
  # The instance's OWN binary, which is the host's shared one unless the
  # instance named another. Probing the shared path for an instance that names
  # its own would clear the preflight against a build the unit never starts —
  # a check that passes by reading the wrong file.
  #
  # sha256 rather than stat's default sha1, because this digest is compared
  # against the one version control declares and that declaration is a sha256.
  ansible.builtin.stat:
    path: "{{ fabro_server_binary_path }}"
    checksum_algorithm: sha256
  become: true
  register: fabro_server_binary
  check_mode: false

- name: Decide whether this instance's binary must be replaced
  # ONE place answers "is this instance's binary managed from the control
  # node, and is the host's copy already that build", and the three install
  # tasks plus the refusal below all read it. An instance that names no source
  # is never replaced, whatever the host holds.
  #
  # `| default('')` carries the first-install case: a stat of a path with no
  # file at it reports exists false and omits checksum entirely rather than
  # reporting an empty one, so an undefined digest reads as "not the declared
  # build" and the install proceeds.
  ansible.builtin.set_fact:
    fabro_server_binary_replace: >-
      {{ fabro_server_binary_source | length > 0
      and fabro_server_binary.stat.checksum | default('') != fabro_server_binary_sha256 }}
  check_mode: false

- name: Refuse a host with no built Fabro binary
  # Skipped for exactly one instance: the one whose binary this run is about
  # to install. Everywhere else the refusal is unchanged, because an instance
  # that declares no source still owns its binary out of band.
  ansible.builtin.assert:
    that:
      - fabro_server_binary.stat.exists
      - fabro_server_binary.stat.executable
    fail_msg: >-
      {{ fabro_server_binary_path }} is missing or not executable, and this
      instance is not installing one — it declares no binary_source, or it
      declares a source the host already holds. This role never BUILDS a
      binary. Build it in the pinned factory-integration worktree —
      `cargo clean --release -p fabro-spa` then
      `cargo dev build --release -p fabro-cli`, the targeted clean being
      required because Cargo will not otherwise refresh the gitignored SPA
      assets — then either replace the binary atomically per the
      livespec-orchestrator-beads-fabro runbook, or stage it on the control
      node and declare binary_source plus binary_sha256 on this instance.
      Every instance that does not name its own binary_path shares the host's
      {{ fabro_server_host_home }}/.fabro/bin/fabro; only its state is
      per-instance.
    success_msg: this instance's Fabro binary is present and executable
  when: not (fabro_server_binary_replace | bool)

- name: Look for the checkout this instance runs in
  ansible.builtin.stat:
    path: "{{ fabro_server_host_checkout }}"
  become: true
  register: fabro_server_checkout
  check_mode: false

- name: Clone this host's checkout from the remote it declares
  # The ONE piece of state in this block the role creates rather than refuses,
  # and the reason is in defaults/main.yml beside the axis: every other
  # refusal here stands in for a step only an operator can take, while a git
  # clone is derivable from one URL. On a factory host that has no checkout
  # the refusal below left exactly one way through — a hand clone, which the
  # fleet host guard denies.
  #
  # BOTH GUARDS ARE LOAD-BEARING, AND THEY GUARD DIFFERENT THINGS. The `when`
  # is the DECISION: clone only where there is nothing to lose. `update: false`
  # is the CONSEQUENCE of that decision ever being wrong — ansible.builtin.git
  # DEFAULTS to update: true, which resets the working tree HARD onto
  # `version`, and the directory this names is the WorkingDirectory of a server
  # that is carrying live Fabro runs while this role runs against it. One is a
  # condition; the other is what happens if the condition is wrong, and a live
  # factory's uncommitted work is not a thing to leave to a single condition.
  #
  # As the service user, because that account is the one the server runs as. A
  # root-owned checkout is one the factory cannot write to, and nothing later
  # in this role would fix the ownership.
  #
  # NOT `check_mode: false`, unlike every probe around it. The probes disable
  # it because a drift report that skipped its own reads would report on a host
  # it never inspected; this task WRITES, so leaving check mode alone is what
  # makes `just ansible-drift` REPORT the clone instead of performing it.
  ansible.builtin.git:
    repo: "{{ fabro_server_host_checkout_remote }}"
    dest: "{{ fabro_server_host_checkout }}"
    version: "{{ fabro_server_host_checkout_ref }}"
    update: false
  become: true
  become_user: "{{ fabro_server_host_user }}"
  register: fabro_server_checkout_clone
  when:
    # Undeclared is the normal case and means "this host's checkout is not
    # provisioned from here"; the refusal below is then unchanged.
    - fabro_server_host_checkout_remote | length > 0
    # A checkout that is already there is LEFT EXACTLY AS IT IS FOUND. A live
    # factory's checkout carries uncommitted work and a branch somebody chose.
    - not fabro_server_checkout.stat.exists

- name: Refuse an instance whose checkout is missing
  ansible.builtin.assert:
    that:
      - fabro_server_checkout.stat.exists
      - fabro_server_checkout.stat.isdir
    fail_msg: >-
      {{ fabro_server_host_checkout }} is not a directory. The server runs
      from the stable primary checkout, never a disposable worktree; clone it
      before applying this role, or declare
      fabro_server_host_checkout_remote on this host and let the role clone
      it.
    success_msg: the instance's checkout is present
  when:
    # Skipped for exactly one run: the one that has just cloned this checkout.
    # The stat above predates that clone and still reports the directory
    # absent, and under --check nothing was written at all — so a refusal
    # reading only that register would fail the drift read of the very host
    # the remote axis was added for, and an operator cannot apply a play whose
    # drift report they are forbidden to obtain. A clone that FAILED never
    # reaches here: ansible.builtin.git aborts the play.
    - not (fabro_server_checkout_clone.changed | default(false))

# --- the instance's state root, its server.env, and Docker access ------------
#
# A factory host that has never run this instance has none of these, and each
# used to be a refusal whose only way through was a step by hand: start the
# server once to create its state directory and server.env, and add the service
# account to the docker group. The fleet host guard denies both, and the plan
# assertion "nothing on that host is set up by hand beyond the role's documented
# out-of-band state" forbids them, so the role takes them. On a host that
# already has them every task below is a no-op.

- name: Create this instance's state root, storage directory and binary directory
  # Owned by the service account. The mode only ADDS the owner's bits and never
  # removes any: an existing directory keeps the mode it has — hp-xubuntu's
  # parked mi-homelab instance holds 0700 on both, measured 2026-10-18, and a
  # literal 0755 would have loosened them — while a new one is created under
  # the usual umask, 0755. The binary directory is here because the staged copy
  # below writes beside binary_path, and ansible.builtin.copy refuses a
  # destination whose parent does not exist.
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ fabro_server_host_user }}"
    group: "{{ fabro_server_host_group }}"
    mode: u+rwx
  become: true
  loop:
    - "{{ fabro_server_home_dir }}"
    - "{{ fabro_server_home_dir }}/storage"
    - "{{ fabro_server_binary_path | dirname }}"

- name: Generate the instance's server.env when it has none
  # Fabro's own formats (fabro-util session_secret.rs and dev_token.rs at the
  # carrier commit adeefec): SESSION_SECRET is 32 random bytes as 64 hex
  # characters, FABRO_DEV_TOKEN is `fabro_dev_` plus 32 random bytes as 64 hex
  # characters. Both are generated ON THE HOST, so neither value ever reaches
  # the controller, a variable, a module argument or the process table: the
  # argv below carries only the program and the path.
  #
  # `creates:` makes it idempotent and is what keeps an existing file — and so
  # a running server's dev token, which the Dispatcher and the environment
  # catalog requests authenticate with — untouched. O_EXCL makes the same
  # promise a second time, at the moment of the write. Under `--check` the
  # command module honours `creates:`, so a drift read of a fresh host reports
  # the generation as a would-be change and writes nothing.
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os, secrets, sys
        fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
        with os.fdopen(fd, "w") as handle:
            handle.write("SESSION_SECRET=" + secrets.token_hex(32) + "\n")
            handle.write("FABRO_DEV_TOKEN=fabro_dev_" + secrets.token_hex(32) + "\n")
      - "{{ fabro_server_home_dir }}/storage/server.env"
    creates: "{{ fabro_server_home_dir }}/storage/server.env"
  become: true
  become_user: "{{ fabro_server_host_user }}"
  register: fabro_server_env_generate

- name: Look for the Docker engine guard's state root and its commit marker
  # The docker_engine role refuses a host on which ANY account is in the docker
  # group until its guarded install reaches the commit point, and on a host it
  # rolled back the group already exists with nobody in it (gmktec-xubuntu,
  # 2026-10-18). So the group existing is not the question; the guard having
  # committed is. A host whose Docker predates the guard (hp-xubuntu, vps) has
  # no state root at all, and there the group is all that is required.
  ansible.builtin.stat:
    path: "{{ item }}"
  become: true
  register: fabro_server_docker_guard
  check_mode: false
  loop:
    - "{{ fabro_server_docker_engine_state_root }}"
    - "{{ fabro_server_docker_engine_state_root }}/confirmed"

- name: Read the docker group
  ansible.builtin.command:
    argv: [getent, group, docker]
  register: fabro_server_docker_group
  changed_when: false
  failed_when: fabro_server_docker_group.rc not in [0, 2]
  check_mode: false

- name: Decide whether this host's Docker is ready for the service account
  ansible.builtin.set_fact:
    fabro_server_docker_ready: >-
      {{ fabro_server_docker_group.rc == 0
      and (not fabro_server_docker_guard.results[0].stat.exists
           or fabro_server_docker_guard.results[1].stat.exists) }}
  check_mode: false

- name: Refuse a running instance on a host whose Docker is not ready
  # Every sandbox this instance launches is a container, so a server without
  # Docker access fails every run at its first stage. Refused here, before the
  # unit is installed, rather than discovered at the canary.
  ansible.builtin.assert:
    that:
      - fabro_server_docker_ready | bool
    fail_msg: >-
      {{ inventory_hostname }} has no docker group, or its guarded Docker
      install has not committed ({{ fabro_server_docker_engine_state_root }}/confirmed
      is absent). Converge ansible/docker-engine.yml on this host first; this
      role adds {{ fabro_server_host_user }} to the docker group only after
      that guard has committed.
    success_msg: this host's Docker is ready for the service account
  when: fabro_server_service_state == 'running'

- name: Put the service account in the docker group
  # append: true, so no other supplementary group is touched. A no-op on every
  # host whose account is already a member (hp-xubuntu and vps, 2026-10-18).
  ansible.builtin.user:
    name: "{{ fabro_server_host_user }}"
    groups: [docker]
    append: true
  become: true
  when: fabro_server_docker_ready | bool

- name: Look for the instance's generated server environment file
  ansible.builtin.stat:
    path: "{{ fabro_server_home_dir }}/storage/server.env"
  become: true
  register: fabro_server_env_file
  check_mode: false

- name: Refuse an instance with no generated server environment file
  ansible.builtin.assert:
    that:
      - fabro_server_env_file.stat.exists
    fail_msg: >-
      {{ fabro_server_home_dir }}/storage/server.env does not exist, and the
      task above that generates it did not create it. It holds this instance's
      SESSION_SECRET and FABRO_DEV_TOKEN at mode 0600; read that task's output.
    success_msg: the instance's server.env exists
  # Skipped for exactly one run: a dry run of a host whose server.env the task
  # above would generate. Under --check it wrote nothing, so the stat still
  # reports the file absent, and refusing would forbid the drift read of the
  # very host the generation exists for.
  when: not (ansible_check_mode and fabro_server_env_generate.changed)

- name: Probe for the variable names the instance's server.env must carry
  # A grep on the host rather than a slurp back to the controller: the file
  # holds two live secrets, and presence is the only thing being established.
  # The argv carries the variable NAME and the path, never a value, and
  # `grep -q` prints nothing on either outcome. no_log is belt-and-braces on
  # a task whose subject is a secret file; the names survive it because the
  # assert below reads `item` out of the registered results, which no_log
  # suppresses from display without suppressing from the play.
  ansible.builtin.command:
    argv:
      - grep
      - -qE
      - "^{{ item }}=.+"
      - "{{ fabro_server_home_dir }}/storage/server.env"
  become: true
  register: fabro_server_secret_probe
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true
  loop:
    - SESSION_SECRET
    - FABRO_DEV_TOKEN
  when: not (ansible_check_mode and fabro_server_env_generate.changed)

- name: Refuse an instance whose server.env is missing a required variable
  ansible.builtin.assert:
    that:
      - fabro_server_secret_probe.results | rejectattr('rc', 'eq', 0) | list | length == 0
    fail_msg: >-
      {{ fabro_server_home_dir }}/storage/server.env is missing
      {{ fabro_server_secret_probe.results | rejectattr('rc', 'eq', 0) | map(attribute='item') | join(' and ') }}.
      The unit loads that file with EnvironmentFile=, so a server started
      without it has no browser auth. Regenerate the file rather than editing
      one in by hand.
    success_msg: the instance's server.env carries both required variables
  when: not (ansible_check_mode and fabro_server_env_generate.changed)

# TWO PRECONDITIONS HAVE NO CHECK, AND FAKING ONE WOULD BE WORSE THAN NONE.
#
# The `tailscale serve` mapping that publishes this instance's loopback port
# on the tailnet is owned by the tailscale-admin repository, deliberately: the
# mapping is a tailnet fact, not a host-provisioning one. install.sh "neither
# creates nor verifies it" and neither does this role. It is not observable
# from here in any honest way — `tailscale serve status` would answer for the
# node's whole configuration, which this role has no business asserting on,
# and a probe of the published URL would test the tailnet rather than the
# host. Its absence shows up as a console that answers on loopback and not on
# the canonical host.
#
# The GitHub App private key lives inside the instance's own Fabro vault. An
# instance that declares it under `vault_secrets` has it created there from the
# control node's environment once the server answers (tasks/vault.yml), and only
# its NAME is ever checked. An instance that does not declare it owns it out of
# band, and its absence shows up the first time the instance acts as its App.

- name: Probe for the curl the installed verifier runs at every unit start
  # install.sh required curl and jq. Only curl survives: it is what
  # fabro-server-verify-web calls from ExecStartPost on every single start, so
  # its absence would turn every restart into a crash loop. jq was the
  # installer's own JSON reader and Ansible does not need one.
  ansible.builtin.command:
    argv: [curl, --version]
  register: fabro_server_curl
  changed_when: false
  failed_when: fabro_server_curl.rc != 0
  check_mode: false

- name: Ask systemd whether this instance is already supervised
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ fabro_server_unit_name }}.service"]
  become: true
  register: fabro_server_is_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ask the instance's own health endpoint whether something is serving its port
  # The instance's own loopback port, not whichever server the CLI's default
  # target happens to name. Read-only, and it feeds both guards below.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ fabro_server_port }}/api/v1/health"
    timeout: 2
  register: fabro_server_health
  failed_when: false
  changed_when: false
  check_mode: false

- name: Refuse a port served by something systemd is not supervising
  # install.sh's stop_legacy_daemon, as a refusal rather than a kill. The
  # shell read the pid from <home_dir>/storage/server.json and sent SIGTERM,
  # but only after proving /proc/<pid>/exe shared an inode with the trusted
  # binary or one of its `fabro.*` siblings. Ansible has no faithful way to
  # express that inode comparison, and the comparison is the entire reason the
  # kill was safe — so the role names the situation and stops. Killing a
  # process holding a factory's port is an operator's decision, not a
  # converge step.
  ansible.builtin.assert:
    that:
      - not (fabro_server_health.status | default(-1) == 200 and fabro_server_is_active.stdout | trim != 'active')
    fail_msg: >-
      Something is serving http://127.0.0.1:{{ fabro_server_port }} while
      {{ fabro_server_unit_name }}.service is
      '{{ fabro_server_is_active.stdout | trim }}' — almost certainly an
      unsupervised Fabro daemon predating systemd management. Stop it by hand
      before re-running: read .pid from
      {{ fabro_server_home_dir }}/storage/server.json, confirm
      `readlink -f /proc/<pid>/exe` resolves to this instance's
      {{ fabro_server_binary_path }}, then send it SIGTERM and wait for it to
      exit. This role does not kill processes.
    success_msg: nothing unsupervised is holding this instance's port

- name: Resolve where this instance's deferred restart is recorded
  # Its own fact rather than a line in "Resolve this instance's axes", because
  # it is not an axis: nothing in host_vars names it and no instance may
  # override it. The path is the role's directory plus the instance's unit
  # name, which is the one identifier the role has already refused to let two
  # instances share — so two instances can never collide on one marker.
  ansible.builtin.set_fact:
    fabro_server_restart_pending_marker: "{{ fabro_server_restart_pending_dir }}/{{ fabro_server_unit_name }}"
  check_mode: false

- name: Look for a restart this instance deferred on an earlier run
  # The read half of the marker. `check_mode: false` because it is read-only
  # and a dry run that could not see a standing deferral would report this
  # instance as converged when it is not.
  ansible.builtin.stat:
    path: "{{ fabro_server_restart_pending_marker }}"
  become: true
  register: fabro_server_restart_marker
  check_mode: false

- name: Read the main PID of the server this instance is already running
  # The INCUMBENT process, read BEFORE the install section below replaces
  # anything. That ordering is the whole point: once the rename has happened,
  # the question "is the running server the one binary_path names" can no
  # longer be asked of this run — the path already holds the new build.
  #
  # Deliberately distinct from the MainPID read in the verify section at the
  # end of this file, which reads the pid AFTER any restart. Reusing one read
  # for both would answer one of the two questions wrongly.
  ansible.builtin.command:
    argv: [systemctl, show, -p, MainPID, --value, "{{ fabro_server_unit_name }}.service"]
  become: true
  register: fabro_server_incumbent_pid
  changed_when: false
  failed_when: false
  check_mode: false

- name: Read the file the running server actually executes
  # /proc/<pid>/exe, read as a LINK rather than followed, because the link's
  # own text is the evidence. systemd started the process from a path; if the
  # role has since renamed a new build over that path, the kernel reports the
  # target as "<path> (deleted)" — which is not equal to binary_path, and that
  # inequality is precisely "the running server executes a file other than
  # binary_path". If instead the server was started from some OTHER path (hp's
  # candidate was, before it had a binary_path of its own), the target is that
  # other path and the inequality says so just as plainly. One comparison
  # covers both, which is why this is a link read and not a digest compare.
  #
  # Comparing the RAW link target is also why this is not `readlink -f`: full
  # resolution is what loses the "(deleted)" case, which is the one the
  # measured hp-xubuntu failure presents as. The cost is that a binary_path
  # which is itself a SYMLINK would read as stale on every run, because the
  # kernel reports the resolved file and not the link systemd was given. No
  # instance uses one today — the install path below renames a regular file
  # onto binary_path, and the preflight stats it as a regular executable — and
  # if one ever does, this comparison is the thing to revisit rather than the
  # marker.

  ansible.builtin.stat:
    path: "/proc/{{ fabro_server_incumbent_pid.stdout | trim }}/exe"
    follow: false
  become: true
  register: fabro_server_incumbent_exe
  check_mode: false
  when: fabro_server_incumbent_pid.stdout | default('') | trim not in ['', '0']

- name: Decide whether this instance carries a restart into this run
  # ONE place answers "does this instance owe a restart that THIS run did not
  # itself cause", and the claim below plus the handlers all read it.
  #
  # Both defaults fail toward NOT restarting, which is the only safe direction
  # for a gate whose true branch kills a live factory. An unreadable
  # /proc/<pid>/exe — the task above skipped because the unit reported pid 0,
  # or a process that exited between the two reads — defaults the comparison
  # to binary_path itself, so it compares equal and the instance is reported
  # as carrying nothing. A restart that really was owed is then re-detected on
  # the next run from the marker, which outlives the ambiguity; a restart
  # INVENTED from an unreadable probe would kill runs on a converged host, and
  # nothing would re-create what it destroyed.
  ansible.builtin.set_fact:
    fabro_server_restart_deferred: "{{ fabro_server_restart_marker.stat.exists }}"
    fabro_server_binary_stale: >-
      {{ (fabro_server_incumbent_exe.stat.lnk_target | default(fabro_server_binary_path))
      != fabro_server_binary_path }}
  check_mode: false

- name: Claim a restart this instance carried over from an earlier run
  # THE TASK THAT MAKES A DEFERRAL REDEEMABLE. Handlers run only when
  # something notifies them, and on the run the operator makes to APPLY a
  # deferred restart nothing changes — the files were already written by the
  # run that deferred it. So without this task the whole handler group is
  # unreachable on exactly the run that is supposed to act. That is the defect
  # measured on hp-xubuntu 2026-10-11: pass 2 with the flag true cleared the
  # carrying-runs refusal, changed nothing, notified nothing, and restarted
  # nothing, while reporting success.
  #
  # `changed_when` on a debug task is the mechanism Ansible gives for raising
  # a notification from a COMPUTED condition rather than from a file write.
  # The message is not decoration: it is the only per-run account of WHY the
  # instance owes a restart, which the marker deliberately does not carry.
  #
  # Note what this task does NOT do. It does not restart, and it does not
  # decide whether a restart is allowed. It raises the same event a changed
  # file raises, and the handlers then apply exactly the same gates —
  # including the carrying-runs refusal immediately below, which runs before
  # any handler does.
  ansible.builtin.debug:
    msg: >-
      {{ fabro_server_unit_name }} on {{ inventory_hostname }} carries a
      restart into this run.
      {{ 'An earlier run recorded one at ' ~ fabro_server_restart_pending_marker ~ '.'
         if fabro_server_restart_deferred | bool else '' }}
      {{ 'The running server executes '
         ~ (fabro_server_incumbent_exe.stat.lnk_target | default('an unreadable path'))
         ~ ' rather than ' ~ fabro_server_binary_path ~ '.'
         if fabro_server_binary_stale | bool else '' }}
  changed_when: fabro_server_restart_deferred | bool or fabro_server_binary_stale | bool
  notify: Fabro instance files changed
  # `changed_when` decides whether the NOTIFICATION is raised; it does not stop
  # Ansible rendering a message it has already been handed. Without this gate
  # the fixed opening sentence above printed on every run — measured on
  # hp-xubuntu 2026-10-11 for all three instances while none owed a restart,
  # where it reads as a restart of a factory that is carrying live runs. So the
  # gate is on the task itself: this task's only effects are that sentence and
  # that notification, and a run which owes nothing must produce neither.
  #
  # Deliberately the SAME condition `changed_when` carries, and both halves of
  # it are load-bearing. The marker is the deferral an earlier run recorded; a
  # stale binary is a running server executing a file other than the one at its
  # binary_path, which leaves no marker — it is what the /proc/<pid>/exe probe
  # above exists to find. A gate reading only the marker would be silent on
  # exactly the instance that probe was added for.
  when: fabro_server_restart_deferred | bool or fabro_server_binary_stale | bool

- name: Log this instance's own CLI in with the instance's dev token
  # The probe below runs the instance's CLI, which needs a login for this
  # server in the host user's auth store. `fabro install` writes that login;
  # this role writes server.env itself and never runs install, so on a server
  # it brought up from nothing the probe answered "Authentication required"
  # (rc 4). Measured 2026-10-18 on gmktec-xubuntu's first restart-allowed
  # converge.
  #
  # The entry is merged into the auth store in the shape `fabro auth login
  # --dev-token` writes (`servers.<url>` = kind, logged_in_at, token). The
  # token is read from server.env inside the host-side interpreter, so it is in
  # no argv and never in Ansible's variables; an entry already carrying the
  # instance's current token is left untouched and reports no change.
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import datetime, json, os, tempfile
        url = os.environ["FABRO_SERVER"]
        store = os.path.join(os.environ["HOME"], ".fabro", "auth.json")
        with open(os.environ["FABRO_SERVER_ENV_FILE"], encoding="utf-8") as env:
            token = [line.split("=", 1)[1].strip() for line in env if line.startswith("FABRO_DEV_TOKEN=")][-1]
        data = {"servers": {}}
        if os.path.exists(store):
            with open(store, encoding="utf-8") as current:
                data = json.load(current)
        entry = data.setdefault("servers", {}).get(url) or {}
        if entry.get("kind") == "dev-token" and entry.get("token") == token:
            print("unchanged")
            raise SystemExit(0)
        now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
        data["servers"][url] = {"kind": "dev-token", "logged_in_at": now, "token": token}
        os.makedirs(os.path.dirname(store), mode=0o700, exist_ok=True)
        handle, staged = tempfile.mkstemp(dir=os.path.dirname(store))
        with os.fdopen(handle, "w", encoding="utf-8") as out:
            json.dump(data, out, indent=2)
        os.chmod(staged, 0o600)
        os.replace(staged, store)
        print("changed")
  become: true
  become_user: "{{ fabro_server_host_user }}"
  environment:
    HOME: "{{ fabro_server_home_env }}"
    FABRO_SERVER: "http://127.0.0.1:{{ fabro_server_port }}"
    FABRO_SERVER_ENV_FILE: "{{ fabro_server_home_dir }}/storage/server.env"
  register: fabro_server_cli_login
  changed_when: fabro_server_cli_login.stdout == 'changed'
  when:
    - (fabro_server_restart_allowed | bool) or fabro_server_service_state == 'stopped'
    - fabro_server_health.status | default(-1) == 200

- name: Ask this instance whether any Fabro run is active
  # install.sh's require_quiet_server, and it runs only when a restart is
  # actually on the table. FABRO_SERVER pins the probe to THIS instance; the
  # CLI's default target is whatever settings.toml names, which on a
  # two-instance host is the other server half the time. The instance's own
  # binary and HOME, not the host's: a cutover candidate's server speaks to
  # its own build's CLI, and a probe that cannot read `ps` would clear the
  # quiet-server guard against a factory that is carrying runs.
  ansible.builtin.command:
    argv: ["{{ fabro_server_binary_path }}", --json, ps]
  become: true
  become_user: "{{ fabro_server_host_user }}"
  environment:
    HOME: "{{ fabro_server_home_env }}"
    FABRO_SERVER: "http://127.0.0.1:{{ fabro_server_port }}"
  register: fabro_server_ps
  changed_when: false
  check_mode: false
  when:
    # A restart on the table, OR a stop: parking an instance
    # (service_state: stopped) interrupts whatever it is carrying exactly as a
    # restart would, so it is gated by the same probe and the same refusal.
    - (fabro_server_restart_allowed | bool) or fabro_server_service_state == 'stopped'
    - fabro_server_health.status | default(-1) == 200

- name: Refuse to restart or stop a factory that is carrying runs
  # Necessary but not sufficient, and the gap is why fabro_server_restart_allowed
  # defaults to false rather than this check standing alone: a run admitted
  # between this assert and the handler at the end of the play would still be
  # killed. Nothing inside Ansible closes that window. Quiescing the instance
  # first — `fabro` admission paused, or the dispatcher stopped — is what
  # makes an attended restart, or a stop, safe.
  ansible.builtin.assert:
    that:
      - (fabro_server_ps.stdout | from_json | length) == 0
    fail_msg: >-
      {{ fabro_server_unit_name }} has
      {{ fabro_server_ps.stdout | from_json | length }} active run(s);
      refusing to interrupt them. Re-run when the instance is quiet. For a
      restart, leaving fabro_server_restart_allowed false installs the files
      and defers the restart; for a stop (service_state: stopped) there is no
      deferral — the instance stays running until it is quiet.
    success_msg: this instance has no active runs
  when:
    - not (fabro_server_ps.skipped | default(false))
    # The operator's explicit, per-invocation acceptance of run loss; see
    # fabro_server_interrupt_runs_allowed in defaults/main.yml.
    - not (fabro_server_interrupt_runs_allowed | bool)

- name: Report the runs an accepted interruption will kill
  ansible.builtin.debug:
    msg: >-
      {{ fabro_server_unit_name }} is carrying
      {{ fabro_server_ps.stdout | from_json | length }} active run(s); the
      operator set fabro_server_interrupt_runs_allowed, so they are killed.
  when:
    - not (fabro_server_ps.skipped | default(false))
    - fabro_server_interrupt_runs_allowed | bool

# --- install ---------------------------------------------------------------
#
# THE BINARY GOES FIRST, AND IT GOES IN THREE STEPS. Every refusal above has
# already run — including, wherever a restart is on the table at all, the
# carrying-runs one — so by here the role is allowed to change this instance.
# Note what the exception means rather than hides: with the default
# fabro_server_restart_allowed false, the carrying-runs probe is skipped and a
# binary IS replaced under a busy factory. That is safe and deliberate.
# Renaming over a path does not touch the inode a running process already
# execs, so the server keeps serving its runs from the old build and the
# handler says out loud that it was not restarted.
#
# The three steps are stage, keep, rename, and the split
# is not ceremony: binary_path is the file a running server's ExecStart
# named and the file Restart=always re-execs, so a partial write there is a
# factory that cannot start. Nothing becomes live until the rename, which is
# rename(2) within one directory.
#
# All three are gated on the single decision fact, so a converged host skips
# them and the role stays idempotent — and, because only the rename notifies,
# a dry run cannot produce a phantom restart of a live factory out of a copy
# it never performed.

- name: Stage this instance's binary beside the one it replaces
  # The owner, group and mode are set HERE, once, because rename(2) carries
  # them onto binary_path unchanged. A mechanism that wrote binary_path
  # directly would need a second chown, and a missing one is invisible until
  # systemd fails to exec the file.
  ansible.builtin.copy:
    src: "{{ fabro_server_binary_source }}"
    dest: "{{ fabro_server_binary_path }}.incoming"
    owner: "{{ fabro_server_host_user }}"
    group: "{{ fabro_server_host_group }}"
    mode: "0755"
  become: true
  when: fabro_server_binary_replace | bool

- name: Keep the outgoing binary beside the one that replaces it
  # Named for the sha256 of the build it HOLDS, not for the time it was kept.
  # The point of keeping it is to be able to say which build a rollback
  # returns to, and `fabro --version` cannot be asked of a file that is no
  # longer the one the unit starts — so the digest has to be in the name.
  #
  # Skipped where there is nothing to keep, which is a real host state: an
  # instance whose binary_path holds no file yet is precisely the one this
  # pair of axes exists to provision.
  ansible.builtin.copy:
    src: "{{ fabro_server_binary_path }}"
    dest: "{{ fabro_server_binary_path }}.{{ fabro_server_binary.stat.checksum[:12] }}.bak"
    remote_src: true
    owner: "{{ fabro_server_host_user }}"
    group: "{{ fabro_server_host_group }}"
    mode: "0755"
  become: true
  when:
    - fabro_server_binary_replace | bool
    - fabro_server_binary.stat.exists

- name: Rename the staged copy onto this instance's binary path
  # The one step that changes which build the instance will start, and the
  # only one that notifies. A `command` rather than a module because rename(2)
  # within a directory is exactly the semantics wanted and no module spells
  # it; changed_when is true because reaching this task at all means the
  # staged build is not the one the host held.
  ansible.builtin.command:
    argv:
      - mv
      - -f
      - "{{ fabro_server_binary_path }}.incoming"
      - "{{ fabro_server_binary_path }}"
  become: true
  changed_when: true
  when: fabro_server_binary_replace | bool
  notify: Fabro instance files changed

- name: Create the shared libexec directory
  # The shell created it with `install -d` on every run. Ansible needs it as
  # its own task for the same reason the gates_kubeconfig role does: with the
  # directory absent, `--check` reports the copy below as a would-be change
  # and then fails only on a real apply.
  ansible.builtin.file:
    path: "{{ fabro_server_libexec_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create the directory this host's restart-pending markers live in
  # Same reason the libexec directory above is its own task, and the same
  # reason docker_sandbox_slice owns the directory its marker lives in:
  # `--check` cannot see past an absent parent, so the marker write would be
  # reported as a would-be change on every dry run and then fail only on a
  # real apply. Owning it here is what makes a first apply on a fresh host
  # succeed. One directory per host, shared by every instance; the file inside
  # it is per instance.
  ansible.builtin.file:
    path: "{{ fabro_server_restart_pending_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the shared web-console verifier
  # One copy per host, shared by every instance, because the unit supplies
  # FABRO_CANONICAL_HOST and FABRO_BASE_URL per instance. fabro-hosts proved
  # with a negative control that the variable is load-bearing and the fork is
  # not: the unmodified vps verifier exits 0 against hp when the variable is
  # set and 1 when it is not. Copied byte-for-byte, so it stays identical to
  # what both hosts run today (sha256 06763080…).
  ansible.builtin.copy:
    src: fabro-server-verify-web
    dest: "{{ fabro_server_libexec_dir }}/fabro-server-verify-web"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Look for the unit file before this role would write it
  # Registered so the systemd tasks below can tell "this instance is already
  # installed" from "this instance does not exist yet". Under `--check` the
  # template task writes nothing, so systemd would be asked to act on a unit
  # that is not on disk and would fail with "Could not find the requested
  # service" — the role reporting a fault it created itself, on precisely the
  # host where the operator most needs the dry run to complete and say the
  # instance is missing.
  ansible.builtin.stat:
    path: "{{ fabro_server_unit_dir }}/{{ fabro_server_unit_name }}.service"
  become: true
  register: fabro_server_unit_file
  check_mode: false

- name: Install the instance's systemd unit
  # render-unit.sh plus `install -m 0644`, in one task. The renderer's
  # unsubstituted-placeholder guard is not reimplemented: it exited 4 when an
  # @NAME@ survived, and Ansible raises AnsibleUndefinedVariable on the first
  # unset name before writing anything, which is the same refusal for free.
  ansible.builtin.template:
    src: fabro-server.service.j2
    dest: "{{ fabro_server_unit_dir }}/{{ fabro_server_unit_name }}.service"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Fabro instance files changed

- name: Remove the superseded verify-timeout drop-in
  # A hand-made drop-in that predates the unit carrying
  # FABRO_WEB_VERIFY_ATTEMPTS itself. install.sh deleted it on every run and
  # so does this, unconditionally: leaving it would be harmless today but it
  # is a second place the crash-loop budget can be set, and the whole reason
  # the value moved into the template is that a live-only override does not
  # survive a rebuild. Live as of 2026-09-09 on vps's fleet instance only.
  ansible.builtin.file:
    path: "{{ fabro_server_unit_dir }}/{{ fabro_server_unit_name }}.service.d/verify-timeout-override.conf"
    state: absent
  become: true
  notify: Fabro instance files changed

- name: Create the instance's drop-in directory
  # install.sh created this unconditionally; here it is created only where a
  # drop-in is actually going into it. An empty .d directory means nothing to
  # systemd, and the removal of the legacy verify-timeout drop-in above works
  # whether or not the directory exists, so the unconditional version would
  # only leave empty directories on instances that hold no drop-in.
  ansible.builtin.file:
    path: "{{ fabro_server_unit_dir }}/{{ fabro_server_unit_name }}.service.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: fabro_server_otel_dropin == 'present'

- name: Install the OTLP drop-in
  # Copied byte-for-byte from fabro-hosts, header comment and all, including
  # its now-inaccurate claim to be installed as fabro-server.service.d/ —
  # true of the fleet instance only. Byte-identity with what three of the four
  # live instances already carry (sha256 02caac32…) is worth more than a
  # corrected comment, because it keeps this task silent on those three and
  # makes any diff it does report a real one.
  ansible.builtin.copy:
    src: otel.conf
    dest: "{{ fabro_server_unit_dir }}/{{ fabro_server_unit_name }}.service.d/otel.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: fabro_server_otel_dropin == 'present'
  notify: Fabro instance files changed

- name: Remove the OTLP drop-in
  # Reached only where an instance is explicitly decided AGAINST exporting.
  # It really does delete the file; see the defaults for why the undecided
  # case is a third word rather than this one.
  ansible.builtin.file:
    path: "{{ fabro_server_unit_dir }}/{{ fabro_server_unit_name }}.service.d/otel.conf"
    state: absent
  become: true
  when: fabro_server_otel_dropin == 'absent'
  notify: Fabro instance files changed

- name: Note that this instance's OTLP export is nobody's decision yet
  ansible.builtin.debug:
    msg: >-
      {{ fabro_server_unit_name }} on {{ inventory_hostname }}: otel_dropin is
      unmanaged, so this role leaves the drop-in exactly as it found it.
      fabro-hosts' README records the open call — installing the shipped
      drop-in newly adds OTLP export, which is a behaviour change and not a
      transcription. Resolve it by setting otel_dropin to present or absent in
      this host's host_vars.
  when: fabro_server_otel_dropin == 'unmanaged'

# --- settings.toml: report by default, write only on request ---------------
#
# install.sh deliberately rendered nothing here, and fabro-hosts' README gives
# the load-bearing reason: vps's live settings.toml is HAND-MAINTAINED and is
# where its explicit max_concurrent_runs = 10 lives. A role that wrote it
# would overwrite the fleet's fallback factory's real configuration.
#
# But shipping the renderer and never running it is what caused the defect it
# exists for. hp ran max_concurrent_runs=5 against vps's 10, invisibly, for
# weeks, because hp's settings.toml had no [server.scheduler] table at all and
# an absent table does not read as absent — it reads as the built-in default,
# with no warning anywhere. A checker existed; a repair did not.
#
# The middle option is the one the README itself asks for and could not build:
# "it should carry a --dry-run-style diff against the live file before it
# writes anything". That is Ansible's check mode, and it can be pinned to a
# single task. So the reporting task below runs in check mode ALWAYS — not
# only under `--check` — with diff forced on regardless of the command line.
# A converge run therefore prints the exact drift between what version control
# says the instance's settings should be and what the host actually holds,
# every time, and writes nothing. Setting fabro_server_manage_settings true
# swaps in the writing task, which is a separate deliberate act.
#
# Two tasks rather than one with a templated check_mode, because a check-mode
# task still fires its notify: a phantom "change" that was never written would
# restart a live factory. Mutually exclusive `when`s make that impossible.

- name: Report drift between the instance's settings.toml and version control
  ansible.builtin.template:
    src: settings.toml.j2
    dest: "{{ fabro_server_home_dir }}/settings.toml"
    owner: "{{ fabro_server_host_user }}"
    group: "{{ fabro_server_host_group }}"
    mode: "{{ fabro_server_settings_mode }}"
  become: true
  check_mode: true
  diff: true
  register: fabro_server_settings_drift
  when: not (fabro_server_manage_settings | bool)

- name: Name the settings drift in the run output
  ansible.builtin.debug:
    msg: >-
      {{ fabro_server_unit_name }} on {{ inventory_hostname }}:
      {{ fabro_server_home_dir }}/settings.toml differs from what this role
      would render. Nothing was written. The diff above is the whole finding;
      apply it by hand, or set fabro_server_manage_settings true for a
      deliberate write. Remember that a resolved value can come from the file
      or from a built-in default, so read the diff for absent TABLES and not
      only for changed numbers.
  when:
    - not (fabro_server_manage_settings | bool)
    - fabro_server_settings_drift is changed

- name: Install the instance's settings.toml
  # Reached only when an operator has asked for it. Fabro reads settings.toml
  # at start, so a change here needs a restart to take effect; the notify
  # carries that, and fabro_server_restart_allowed still governs whether the
  # restart actually happens.
  ansible.builtin.template:
    src: settings.toml.j2
    dest: "{{ fabro_server_home_dir }}/settings.toml"
    owner: "{{ fabro_server_host_user }}"
    group: "{{ fabro_server_host_group }}"
    mode: "{{ fabro_server_settings_mode }}"
  become: true
  diff: true
  when: fabro_server_manage_settings | bool
  notify: Fabro instance files changed

# --- supervise -------------------------------------------------------------

- name: Enable the instance and make sure it is running
  # `systemctl enable --now`, with the reload the shell ran separately. Note
  # that `state: started` is not `restarted`: it starts a stopped unit and
  # leaves a running one alone. Picking up a changed unit file is the
  # handler's job, and the handler is the thing that can refuse.
  #
  # The `when` is the check-mode guard, and it is deliberately NOT
  # `check_mode: false` — that would enable and START a live Fabro server
  # during a run that promised to change nothing. Where the unit is already
  # installed the task runs under `--check` and reports genuine enable/start
  # drift; where the instance is absent it is skipped, and the would-be file
  # additions above are what tell the operator it is not there. The rule this
  # follows: a read-only probe gets `check_mode: false` so it RUNS, a task
  # that would mutate a live host gets a `when` so it is SKIPPED.
  ansible.builtin.systemd_service:
    name: "{{ fabro_server_unit_name }}.service"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when:
    - fabro_server_service_state == 'running'
    - not ansible_check_mode or fabro_server_unit_file.stat.exists

- name: Stop and disable an instance that version control parks
  # The other half of service_state. `stopped` is a deliberate, recorded
  # decision — a project on hold — and this is the only task that acts on it:
  # the unit is stopped and disabled so it does not return at boot, while the
  # unit file, drop-in, settings.toml and state directory written above are
  # all left in place. Re-applying with the word flipped to running is the
  # whole procedure for bringing it back. The quiet-server refusal above has
  # already run for this instance, so a stop here never interrupts a run.
  #
  # Same check-mode shape as the start: a `when`, not `check_mode: false`,
  # so a dry run reports the stop as a would-be change and never performs it.
  ansible.builtin.systemd_service:
    name: "{{ fabro_server_unit_name }}.service"
    enabled: false
    state: stopped
    daemon_reload: true
  become: true
  when:
    - fabro_server_service_state == 'stopped'
    - not ansible_check_mode or fabro_server_unit_file.stat.exists

- name: Apply any pending restart for this instance before verifying it
  # Handlers otherwise run at the END of the play, by which time the loop has
  # moved on and the facts at the top of this file describe the LAST instance.
  # Two instances notifying one handler would then dedupe into a single
  # restart of the wrong unit. Flushing inside each iteration keeps the
  # handler pinned to the instance that notified it, and it also puts the
  # restart before the verification below rather than after the whole play.
  ansible.builtin.meta: flush_handlers

# --- verify ----------------------------------------------------------------

- name: Verify the instance's web console and its JavaScript bundle
  # install.sh's post-install probe, kept. It is the only check that a binary
  # built without embedded SPA assets fails, and a bare curl cannot replace
  # it: Fabro 404s a request lacking the canonical Host header and
  # `Accept: text/html`, so a naive probe reads a healthy server as down.
  #
  # FABRO_WEB_VERIFY_ATTEMPTS is deliberately not passed, exactly as the shell
  # did not pass it, leaving the verifier's own 60-attempt budget. The 300 in
  # the unit covers a cold SlateDB warmup during ExecStartPost; by the time
  # systemd reports the unit active that warmup is already done, so a long
  # budget here would only make a genuinely broken server take five minutes to
  # say so.
  #
  # This task and the two below it are POST-INSTALL VERIFICATION, not probes,
  # so they are deliberately left to skip under `--check`: they exercise a
  # verifier and a running process that a dry run did not install or restart.
  # Adding `check_mode: false` here would verify the OLD server and report it
  # as though it were the new one.
  ansible.builtin.command:
    argv: ["{{ fabro_server_libexec_dir }}/fabro-server-verify-web"]
  become: true
  environment:
    FABRO_BASE_URL: "http://127.0.0.1:{{ fabro_server_port }}"
    FABRO_CANONICAL_HOST: "{{ fabro_server_canonical_host }}"
  changed_when: false
  # A parked instance (service_state: stopped) has no server to verify; the
  # three verification tasks would otherwise fail on the very state this
  # role just produced on purpose.
  when: fabro_server_service_state == 'running'

- name: Read the running instance's main PID
  ansible.builtin.command:
    argv: [systemctl, show, -p, MainPID, --value, "{{ fabro_server_unit_name }}.service"]
  become: true
  register: fabro_server_main_pid
  changed_when: false
  when: fabro_server_service_state == 'running'

- name: Read the working directory the running instance actually has
  ansible.builtin.stat:
    path: "/proc/{{ fabro_server_main_pid.stdout | trim }}/cwd"
    follow: false
  become: true
  register: fabro_server_running_cwd
  when:
    - not ansible_check_mode
    - not (fabro_server_main_pid.skipped | default(false))
    - fabro_server_main_pid.stdout | default('') | trim not in ['', '0']

- name: Refuse an instance running from anywhere but its declared checkout
  # install.sh's exit 7. The failure it catches is a server started from a
  # disposable worktree, which works until the worktree is reaped.
  ansible.builtin.assert:
    that:
      - fabro_server_running_cwd.stat.lnk_source == fabro_server_host_checkout
    fail_msg: >-
      {{ fabro_server_unit_name }} is running in
      {{ fabro_server_running_cwd.stat.lnk_source | default('an unreadable directory') }},
      not {{ fabro_server_host_checkout }}. The server must run from the
      stable primary checkout; a disposable worktree disappears underneath it.
    success_msg: this instance is running in its declared checkout
  when:
    - not ansible_check_mode
    - not (fabro_server_running_cwd.skipped | default(false))

# --- the instance's sandbox environment catalog ----------------------------
#
# LAST in the file, after the unit is installed, any restart has been flushed
# and the console has verified, because every task in the included file speaks
# to the RUNNING SERVER rather than to the filesystem. An instance that declares
# no environments reaches none of it.

- name: Resolve this instance's environments API
  # Its own task rather than a line in "Resolve this instance's axes", because it
  # is not an axis: nothing in host_vars names it and no instance may override
  # it. THIS INSTANCE'S OWN LOOPBACK PORT is the whole content of the fact — the
  # catalog of a host that runs several servers belongs to exactly one of them,
  # and a request sent to whichever server the CLI's default target names would
  # write the wrong instance's catalog.
  ansible.builtin.set_fact:
    fabro_server_environments_url: "http://127.0.0.1:{{ fabro_server_port }}/api/v1/environments"
  check_mode: false

- name: Ask this instance's health endpoint again before reading its catalog
  # The health read at the top of this file predates the install, the restart and
  # the verification above. Writing a catalog is an API call, so the question
  # that gates it is whether the server is answering NOW — which on a first apply
  # it is, and was not when the earlier read ran.
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ fabro_server_port }}/api/v1/health"
    timeout: 2
  register: fabro_server_catalog_health
  failed_when: false
  changed_when: false
  check_mode: false
  when:
    - (fabro_server_environments | length > 0) or (fabro_server_vault_secrets | length > 0)
    - fabro_server_service_state == 'running'

- name: Create the vault entries this instance declares and lacks
  # Before the environment catalog, because a sandbox environment is no use to
  # an instance that cannot yet act as its GitHub App.
  ansible.builtin.include_tasks: vault.yml
  when:
    - fabro_server_vault_secrets | length > 0
    - fabro_server_service_state == 'running'
    - fabro_server_catalog_health.status | default(-1) == 200

- name: Note that this instance's declared vault entries were not reached
  ansible.builtin.debug:
    msg: >-
      {{ fabro_server_unit_name }} on {{ inventory_hostname }} declares
      {{ fabro_server_vault_secrets | length }} vault entr(ies), and its server
      did not answer http://127.0.0.1:{{ fabro_server_port }}/api/v1/health, so
      its vault was neither read nor written. Expected on a dry run against an
      instance this role has not installed yet.
  when:
    - fabro_server_vault_secrets | length > 0
    - fabro_server_service_state == 'running'
    - fabro_server_catalog_health.status | default(-1) != 200

- name: Create or update each sandbox environment this instance declares
  # `loop_var` rather than Ansible's `item`, because the included file is read by
  # an operator who cannot see this loop from there, and because `item` inside a
  # nested include is the classic way one loop's value is read as another's.
  ansible.builtin.include_tasks: environment.yml
  loop: "{{ fabro_server_environments }}"
  loop_control:
    loop_var: fabro_server_environment
    label: "{{ fabro_server_environment.id }}"
  when:
    - fabro_server_service_state == 'running'
    - fabro_server_catalog_health.status | default(-1) == 200

- name: Note that this instance's declared environments were not reached
  # A SILENT SKIP IS THE ONE OUTCOME THIS SECTION MUST NOT HAVE. The catalog work
  # is gated on a server that answers, and under `--check` against an instance
  # whose unit this role has not installed yet there is none — so the gate is
  # right and the silence is not. Naming it keeps a drift report that could not
  # read a catalog distinguishable from one that read it and found it converged.
  ansible.builtin.debug:
    msg: >-
      {{ fabro_server_unit_name }} on {{ inventory_hostname }} declares
      {{ fabro_server_environments | length }} sandbox environment(s), and its
      server did not answer
      http://127.0.0.1:{{ fabro_server_port }}/api/v1/health, so its catalog was
      neither read nor written. On a dry run against an instance this role has
      not installed yet that is expected; on an apply it means the server is
      down, and the environments the factory dispatches into are whatever its
      store already holds.
  when:
    - fabro_server_environments | length > 0
    - fabro_server_service_state == 'running'
    - fabro_server_catalog_health.status | default(-1) != 200
