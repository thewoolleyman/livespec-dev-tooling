---
# otel_collector -- install the dev host's collector configuration from the
# collector repository's merged branch and put the service on it.
#
# Applied from the control node by the committed drift and apply commands
# (see ../../README.md). There is deliberately no checkout on the target for
# the running service to read.

- name: Look for the collector binary the unit runs
  ansible.builtin.stat:
    path: "{{ otel_collector_binary }}"
    get_checksum: false
  become: true
  register: otel_collector_binary_stat
  check_mode: false

- name: Refuse a host that does not already carry the collector binary
  ansible.builtin.assert:
    that:
      - otel_collector_binary_stat.stat.exists
      - otel_collector_binary_stat.stat.executable | default(false)
    fail_msg: >-
      {{ otel_collector_binary }} is not an executable file. The pinned
      download belongs to the collector repository's own installers; install
      it there, then re-run this converge.
    success_msg: the collector binary is present

- name: Create the directory the managed collector files live in
  ansible.builtin.file:
    path: "{{ otel_collector_etc_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Look for the collector's ingest-key environment file
  # Only its existence is read here. The values reach the process through the
  # unit's EnvironmentFile and nowhere else; this role never writes, reads back
  # or prints one.
  ansible.builtin.stat:
    path: "{{ otel_collector_environment_path }}"
    get_checksum: false
  become: true
  register: otel_collector_environment_stat
  check_mode: false

- name: Refuse a host whose ingest-key environment file is missing
  ansible.builtin.assert:
    that:
      - otel_collector_environment_stat.stat.exists
      - otel_collector_environment_stat.stat.isreg
    fail_msg: >-
      {{ otel_collector_environment_path }} is not a regular file. It carries
      the Honeycomb ingest keys the collector configuration reads, and placing
      a secret is the operator's step, not this converge's. See
      ansible/README.md for the one-time root-only placement, then re-run.
    success_msg: the collector's environment file is present

- name: Read the merged collector configuration on the control node
  # A control-node lookup rather than a download on the target, so the apply
  # and the `--check --diff` drift report compare the SAME bytes: the dry run
  # then reports the real difference between what is merged and what the
  # service is running, instead of whatever a target-side fetch found.
  ansible.builtin.set_fact:
    otel_collector_merged_config: >-
      {{ lookup('ansible.builtin.url', otel_collector_config_url, split_lines=false) }}

- name: Refuse a fetch that did not answer with a collector configuration
  ansible.builtin.assert:
    that:
      - otel_collector_merged_config is search('(?m)^receivers:')
      - otel_collector_merged_config is search('(?m)^exporters:')
      - otel_collector_merged_config is search('(?m)^service:')
    fail_msg: >-
      {{ otel_collector_config_url }} did not answer with a collector
      configuration. Nothing has been written and the running service is
      untouched.
    success_msg: the merged configuration names receivers, exporters and a service

- name: Name the environment keys the merged configuration reads
  # Derived from the configuration itself rather than listed here, so the
  # preflight below cannot go stale when the collector repository adds or drops
  # one. `[$][{]` and `[}]` are character classes to keep the pattern free of
  # backslash escapes.
  ansible.builtin.set_fact:
    otel_collector_required_environment_keys: >-
      {{ otel_collector_merged_config
         | regex_findall('[$][{]env:([A-Za-z_][A-Za-z0-9_]*)[}]') | unique | sort }}

- name: Look for each environment key the merged configuration reads
  # A read, never a write: `grep --quiet` prints nothing, so no value can reach
  # the run's output. It runs under `--check` too, because a drift report that
  # skipped it would report a host as ready whose collector would not start.
  ansible.builtin.command:
    argv:
      - grep
      - --quiet
      - --regexp
      - "^{{ item }}="
      - "{{ otel_collector_environment_path }}"
  become: true
  loop: "{{ otel_collector_required_environment_keys }}"
  register: otel_collector_environment_keys_read
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse an environment file missing a key the merged configuration reads
  ansible.builtin.assert:
    that:
      - otel_collector_environment_keys_read.results | rejectattr('rc', 'equalto', 0) | length == 0
    fail_msg: >-
      {{ otel_collector_environment_path }} does not set
      {{ otel_collector_environment_keys_read.results | rejectattr('rc', 'equalto', 0)
         | map(attribute='item') | join(', ') }}. The merged collector
      configuration reads those as ${env:...} and the collector refuses to
      start without them, so nothing has been written and the running service
      is untouched.
    success_msg: the environment file sets every key the merged configuration reads

- name: Install the merged collector configuration
  ansible.builtin.copy:
    content: "{{ otel_collector_merged_config }}"
    dest: "{{ otel_collector_config_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart the collector onto its managed configuration

- name: Look for a unit systemd already knows
  # Read before the write below, so the handlers and the service task can tell
  # a host this role has already converged from one where a `--check` run has
  # written nothing and systemd therefore knows no such unit.
  ansible.builtin.stat:
    path: "{{ otel_collector_unit_path }}"
    get_checksum: false
  become: true
  register: otel_collector_unit_stat
  check_mode: false

- name: Install the collector's unit
  ansible.builtin.template:
    src: otel-collector.service.j2
    dest: "{{ otel_collector_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd for the collector unit
    - Restart the collector onto its managed configuration

- name: Reload and restart now, before the service is managed
  ansible.builtin.meta: flush_handlers

- name: Keep the collector enabled and running
  # `started`, never `restarted`: this starts a collector that is down and
  # leaves a running one alone. Putting a CHANGED configuration into the
  # running process is the handler's job, so a converge that changed nothing
  # interrupts nothing.
  ansible.builtin.systemd_service:
    name: "{{ otel_collector_unit_name }}"
    enabled: true
    state: started
  become: true
  # Same guard as the handlers: under `--check` on a host this role has never
  # converged, the unit was deliberately not written, so systemd knows nothing
  # to enable and the task would fail on the dry run's own omission.
  when: not ansible_check_mode or otel_collector_unit_stat.stat.exists
