---
# otel_collector -- install a host's collector configuration from the collector
# repository's merged branch and put the service on it.
#
# Applied from the control node by the committed drift and apply commands (see
# ../../README.md). There is deliberately no checkout on the target for the
# running service to read.
#
# THE ORDER OF THIS FILE IS PART OF THE CONTRACT. Every precondition is refused
# ahead of every write, so a host that cannot be converged is left exactly as it
# was found rather than half converged — a state a re-run cannot distinguish from
# a fresh host, and the one an operator reading a failed apply has least to go on
# about. A missing ingest key discovered after the service account exists, or a
# missing cluster identity discovered after the binary is installed, has already
# changed the host.

# --- the commit every fetch below is made at -------------------------------

- name: Resolve the collector ref to the commit every fetch is made at
  # `git ls-remote` reads the repository directly, so it sees a merge the moment
  # it lands. raw.githubusercontent.com caches a BRANCH name for five minutes, and
  # a fetch by name inside that window installs the pre-merge copy and reports
  # `changed=0` -- a green converge that reads as "already converged", which the
  # drift run cannot catch because it reads through the same cache. A commit URL
  # is immutable. The peeled tag is listed first so an annotated tag resolves to
  # the commit it points at rather than to the tag object. Run on the control
  # node, because the fetches themselves are control-node lookups; under
  # `--check` too, because a dry run has to read the same commit an apply would.
  ansible.builtin.command:
    argv:
      - git
      - ls-remote
      - --
      - "{{ otel_collector_repository_url }}"
      - "refs/tags/{{ otel_collector_config_ref }}^{}"
      - "refs/tags/{{ otel_collector_config_ref }}"
      - "refs/heads/{{ otel_collector_config_ref }}"
  delegate_to: localhost
  become: false
  environment:
    GIT_TERMINAL_PROMPT: "0"
  register: otel_collector_ref_listing
  changed_when: false
  check_mode: false
  retries: 3
  delay: 5
  until: otel_collector_ref_listing.rc == 0
  when: not (otel_collector_config_ref is match('^[0-9a-f]{40}$'))

- name: Take a collector ref that is already a full commit sha as the commit
  # A host pinned to a sha keeps working unchanged, with no network read.
  ansible.builtin.set_fact:
    otel_collector_config_commit: "{{ otel_collector_config_ref }}"
  when: otel_collector_config_ref is match('^[0-9a-f]{40}$')

- name: Name the commit the collector ref resolves to
  # Plain Jinja on purpose. A ref git does not know leaves the commit empty, and
  # the refusal below says so before anything is fetched or written.
  ansible.builtin.set_fact:
    otel_collector_config_commit: >-
      {%- set found = {} -%}
      {%- for line in otel_collector_ref_listing.stdout_lines -%}
      {%- set _ = found.update({line.split()[1]: line.split()[0]}) -%}
      {%- endfor -%}
      {{ found.get('refs/tags/' ~ otel_collector_config_ref ~ '^{}')
         or found.get('refs/tags/' ~ otel_collector_config_ref)
         or found.get('refs/heads/' ~ otel_collector_config_ref)
         or '' }}
  when: not (otel_collector_config_ref is match('^[0-9a-f]{40}$'))

- name: Refuse a collector ref that did not resolve to a commit
  ansible.builtin.assert:
    that:
      - otel_collector_config_commit is match('^[0-9a-f]{40}$')
    fail_msg: >-
      otel_collector_config_ref {{ otel_collector_config_ref }} did not resolve
      to a commit in {{ otel_collector_repository_url }}. It must name a branch,
      a tag or a full 40-character commit sha. Nothing has been written and the
      running service is untouched.
    success_msg: >-
      the collector ref {{ otel_collector_config_ref }} resolves to commit
      {{ otel_collector_config_commit }}

# --- the preconditions, all of them, before anything is written -------------

- name: Look for the collector binary the unit runs
  ansible.builtin.stat:
    path: "{{ otel_collector_binary }}"
    get_checksum: false
  become: true
  register: otel_collector_binary_stat
  check_mode: false

- name: Refuse a host that does not already carry the collector binary
  ansible.builtin.assert:
    that:
      - otel_collector_binary_stat.stat.exists
      - otel_collector_binary_stat.stat.executable | default(false)
    fail_msg: >-
      {{ otel_collector_binary }} is not an executable file. On this host the
      pinned download belongs to the collector repository's own installers;
      install it there, then re-run this converge. A host this role installs the
      binary on instead declares otel_collector_manage_install.
    success_msg: the collector binary is present
  # Withheld where the role installs the binary itself: on a pool node rebuilt
  # from empty storage the binary is legitimately absent at the first apply, and
  # the fleet host guard refuses the hand-run installer that would have placed
  # it — so a refusal here would be a refusal with no remedy.
  when: not (otel_collector_manage_install | bool)

- name: Refuse to render an ingest key from an unset control-node variable
  # The append below reads each named key from the CONTROL NODE's environment,
  # where the credential wrapper projects it. Without this refusal that append
  # writes `KEY=` — and a collector started on an empty ingest key runs, exports
  # nothing, and is a SILENT node, which is the one failure a dead-man trigger
  # cannot tell from a node that is merely quiet.
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', item) | length > 0
    fail_msg: >-
      otel_collector_env_from_controller names {{ item }}, which the control
      node's environment does not set. Run the apply under the credential
      wrapper (/usr/local/bin/with-livespec-env.sh -- just ansible-apply ...).
      Nothing has been written.
    success_msg: "{{ item }} is available on the control node"
  loop: "{{ otel_collector_env_from_controller }}"

- name: Look for each further environment file the unit reads
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  become: true
  loop: "{{ otel_collector_extra_environment_files }}"
  register: otel_collector_extra_environment_stat
  check_mode: false

- name: Refuse a host missing a further environment file the unit reads
  ansible.builtin.assert:
    that:
      - otel_collector_extra_environment_stat.results
        | rejectattr('stat.exists') | list | length == 0
    fail_msg: >-
      {{ otel_collector_extra_environment_stat.results | rejectattr('stat.exists')
         | map(attribute='item') | join(', ') }} is named in this host's unit and
      is not there. Such a file carries facts about the NODE — its name, its
      ingest endpoint — and the collector repository's own installer owns it.
      Nothing has been written and the running service is untouched.
    success_msg: every further environment file the unit reads is present

# --- what a host that owns its own binary installs --------------------------

- name: Create the service account and install the pinned collector binary
  ansible.builtin.include_tasks: binary.yml
  when: otel_collector_manage_install | bool

# --- the managed files ------------------------------------------------------

- name: Create the directory the managed collector files live in
  ansible.builtin.file:
    path: "{{ otel_collector_etc_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Name the ingest keys this host's environment file already sets
  # A read, never a write: `grep --quiet` prints nothing, so no value can reach
  # the run's output. It runs under `--check` too, because the append below has
  # to reach the same decision on a drift report that it would on an apply.
  ansible.builtin.command:
    argv:
      - grep
      - --quiet
      - --regexp
      - "^{{ item }}="
      - "{{ otel_collector_environment_path }}"
  become: true
  loop: "{{ otel_collector_env_from_controller }}"
  register: otel_collector_controller_keys_read
  changed_when: false
  failed_when: false
  check_mode: false

- name: Name the ingest keys the append would add
  # A check run leaves the environment file unchanged, but its later preflight
  # must evaluate the same key set an apply's append would have supplied.
  ansible.builtin.set_fact:
    otel_collector_appended_environment_keys: >-
      {{ otel_collector_controller_keys_read.results | default([])
         | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}

- name: Append each ingest key this host's environment file does not already set
  # APPENDS, rather than creating the file only when it is absent. The factory
  # host's file already carries the agent-activity keys, so a create-only render
  # would leave the livespec ingest key off the one host that HAS a file — and
  # that host's collector would start, export to one dataset, and report nothing
  # to the other, which reads downstream as a node nobody instrumented.
  #
  # It never REWRITES a key the file already sets. The loop is exactly the set of
  # keys the read above could not find, and no `regexp:` is given — so
  # `lineinfile` has no matching line to replace and appends. A key an operator
  # placed by hand therefore stays as placed, whatever the control node currently
  # carries. `create: true` places the file 0600 root:root on a host with none.
  ansible.builtin.lineinfile:
    path: "{{ otel_collector_environment_path }}"
    line: "{{ item }}={{ lookup('ansible.builtin.env', item) }}"
    insertafter: EOF
    create: true
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  loop: "{{ otel_collector_appended_environment_keys }}"
  # The planned fact lets check mode account for its simulated append; retain
  # the probe-backed guard here so a set key can never be rewritten.
  when: >-
    item in (
      otel_collector_controller_keys_read.results
      | rejectattr('rc', 'equalto', 0)
      | map(attribute='item')
      | list
    )
  register: otel_collector_environment_appended

- name: Look for the collector's ingest-key environment file
  # Only its existence is read here. The values reach the process through the
  # unit's EnvironmentFile and nowhere else; the role writes it only through the
  # append above, and never reads one back.
  ansible.builtin.stat:
    path: "{{ otel_collector_environment_path }}"
    get_checksum: false
  become: true
  register: otel_collector_environment_stat
  check_mode: false

- name: Refuse a host whose ingest-key environment file is missing
  ansible.builtin.assert:
    that:
      - otel_collector_environment_stat.stat.exists
      - otel_collector_environment_stat.stat.isreg
    fail_msg: >-
      {{ otel_collector_environment_path }} is not a regular file. It carries
      the Honeycomb ingest keys the collector configuration reads, and placing a
      secret is the operator's step, not this converge's. See ansible/README.md
      for the one-time root-only placement, or name the key in
      otel_collector_env_from_controller so the role appends it.
    success_msg: the collector's environment file is present
  # Skipped for one run only: a dry run of a host whose file the append above
  # would have created, which under `--check` wrote nothing.
  when: not (ansible_check_mode and (otel_collector_environment_appended.changed | default(false)))

- name: Read the merged collector configuration on the control node
  # A control-node lookup rather than a download on the target, so the apply
  # and the `--check --diff` drift report compare the SAME bytes: the dry run
  # then reports the real difference between what is merged and what the
  # service is running, instead of whatever a target-side fetch found.
  ansible.builtin.set_fact:
    otel_collector_merged_config: >-
      {{ lookup('ansible.builtin.url', otel_collector_config_url, split_lines=false) }}

- name: Refuse a fetch that did not answer with a collector configuration
  ansible.builtin.assert:
    that:
      - otel_collector_merged_config is search('(?m)^receivers:')
      - otel_collector_merged_config is search('(?m)^exporters:')
      - otel_collector_merged_config is search('(?m)^service:')
    fail_msg: >-
      {{ otel_collector_config_url }} did not answer with a collector
      configuration. Nothing has been written and the running service is
      untouched.
    success_msg: the merged configuration names receivers, exporters and a service

- name: Name the environment keys the merged configuration reads
  # Derived from the configuration itself rather than listed here, so the
  # preflight below cannot go stale when the collector repository adds or drops
  # one. `[$][{]` and `[}]` are character classes to keep the pattern free of
  # backslash escapes. A `${env:KEY:-fallback}` is deliberately NOT matched: the
  # configuration carries its own default for that one, so the host owes no entry.
  ansible.builtin.set_fact:
    otel_collector_required_environment_keys: >-
      {{ otel_collector_merged_config
         | regex_findall('[$][{]env:([A-Za-z_][A-Za-z0-9_]*)[}]') | unique | sort }}

- name: Name the environment files the unit reads
  # ALL of them, because systemd merges them: a key set in a further file is a
  # key the collector process has, so a preflight reading only the last one would
  # refuse a host whose configuration is perfectly satisfiable — and the remedy
  # it named would be to duplicate a value that is already there.
  ansible.builtin.set_fact:
    otel_collector_environment_files: >-
      {{ otel_collector_extra_environment_files + [otel_collector_environment_path] }}

- name: Look for each environment key the merged configuration reads
  # A read, never a write: `grep --quiet` prints nothing, so no value can reach
  # the run's output. It runs under `--check` too, because a drift report that
  # skipped it would report a host as ready whose collector would not start.
  ansible.builtin.command:
    argv:
      - grep
      - --quiet
      - --regexp
      - "^{{ item.0 }}="
      - "{{ item.1 }}"
  become: true
  loop: >-
    {{ otel_collector_required_environment_keys
       | product(otel_collector_environment_files) | list }}
  register: otel_collector_environment_keys_read
  changed_when: false
  failed_when: false
  check_mode: false

- name: Name the environment keys no file the unit reads sets
  ansible.builtin.set_fact:
    otel_collector_missing_environment_keys: >-
      {{ otel_collector_required_environment_keys
         | difference(
             (otel_collector_environment_keys_read.results
              | selectattr('rc', 'equalto', 0)
              | map(attribute='item') | map('first') | list)
             + (otel_collector_appended_environment_keys if ansible_check_mode else [])
           ) }}

- name: Refuse an environment file set missing a key the merged configuration reads
  ansible.builtin.assert:
    that:
      - otel_collector_missing_environment_keys | length == 0
    fail_msg: >-
      none of {{ otel_collector_environment_files | join(', ') }} sets
      {{ otel_collector_missing_environment_keys | join(', ') }}. The merged
      collector configuration reads those as ${env:...} with no fallback and the
      collector refuses to start without them, so nothing further has been
      written and the running service is untouched.
    success_msg: the environment files set every key the merged configuration reads

- name: Install the merged collector configuration
  ansible.builtin.copy:
    content: "{{ otel_collector_merged_config }}"
    dest: "{{ otel_collector_config_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart the collector onto its managed configuration

- name: Look for a unit systemd already knows
  # Read before the write below, so the handlers and the service task can tell
  # a host this role has already converged from one where a `--check` run has
  # written nothing and systemd therefore knows no such unit.
  ansible.builtin.stat:
    path: "{{ otel_collector_unit_path }}"
    get_checksum: false
  become: true
  register: otel_collector_unit_stat
  check_mode: false

- name: Install the collector's unit
  ansible.builtin.template:
    src: otel-collector.service.j2
    dest: "{{ otel_collector_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Reload systemd for the managed collector units
    - Restart the collector onto its managed configuration

- name: Create the collector cluster identity directory
  ansible.builtin.file:
    path: "{{ otel_collector_identity_lib_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: otel_collector_cluster_identity | bool

- name: Read the merged collector cluster identity RBAC manifest
  ansible.builtin.set_fact:
    otel_collector_merged_identity_rbac: >-
      {{ lookup('ansible.builtin.url', otel_collector_identity_rbac_url, split_lines=false) }}
  when: otel_collector_cluster_identity | bool

- name: Install the collector cluster identity RBAC manifest
  ansible.builtin.copy:
    content: "{{ otel_collector_merged_identity_rbac }}"
    dest: "{{ otel_collector_identity_rbac_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: otel_collector_cluster_identity | bool
  notify:
    - Run the collector cluster identity
    - Restart the collector onto its managed configuration

- name: Read the merged collector cluster identity render script
  ansible.builtin.set_fact:
    otel_collector_merged_identity_render_script: >-
      {{ lookup('ansible.builtin.url', otel_collector_identity_render_script_url, split_lines=false) }}
  when: otel_collector_cluster_identity | bool

- name: Install the collector cluster identity render script
  ansible.builtin.copy:
    content: "{{ otel_collector_merged_identity_render_script }}"
    dest: "{{ otel_collector_identity_render_script_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  when: otel_collector_cluster_identity | bool
  notify:
    - Run the collector cluster identity
    - Restart the collector onto its managed configuration

- name: Look for the collector cluster identity unit systemd already knows
  ansible.builtin.stat:
    path: "{{ otel_collector_identity_unit_path }}"
    get_checksum: false
  become: true
  register: otel_collector_identity_unit_stat
  check_mode: false
  when: otel_collector_cluster_identity | bool

- name: Read the merged collector cluster identity unit
  ansible.builtin.set_fact:
    otel_collector_merged_identity_unit: >-
      {{ lookup('ansible.builtin.url', otel_collector_identity_unit_url, split_lines=false) }}
  when: otel_collector_cluster_identity | bool

- name: Install the collector cluster identity unit
  ansible.builtin.copy:
    content: "{{ otel_collector_merged_identity_unit }}"
    dest: "{{ otel_collector_identity_unit_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  when: otel_collector_cluster_identity | bool
  notify:
    - Reload systemd for the managed collector units
    - Run the collector cluster identity
    - Restart the collector onto its managed configuration

- name: Reload and restart now, before the service is managed
  ansible.builtin.meta: flush_handlers

- name: Keep the collector cluster identity enabled
  ansible.builtin.systemd_service:
    name: "{{ otel_collector_identity_unit_name }}"
    enabled: true
  become: true
  when:
    - otel_collector_cluster_identity | bool
    - not ansible_check_mode or otel_collector_identity_unit_stat.stat.exists

- name: Look for the scoped cluster identity the collector authenticates with
  ansible.builtin.stat:
    path: "{{ otel_collector_kubeconfig_path }}"
    get_checksum: false
  become: true
  register: otel_collector_kubeconfig_stat
  check_mode: false
  when: otel_collector_kubeconfig_path | length > 0

- name: Refuse a host whose scoped cluster identity is missing
  ansible.builtin.assert:
    that:
      - otel_collector_kubeconfig_stat.stat.exists
      - otel_collector_kubeconfig_stat.stat.isreg
    fail_msg: >-
      {{ otel_collector_kubeconfig_path }} is not a regular file after the
      collector cluster identity converged. It carries the read-only
      ServiceAccount identity this collector reads every kubelet with; absent it
      the unit starts, fails to authenticate, and reports nothing about any node.
    success_msg: the scoped cluster identity is present
  when:
    - otel_collector_kubeconfig_path | length > 0
    # Under --check the three identity files are only planned, so a fresh host
    # cannot have the rendered kubeconfig yet. Report those pending changes
    # instead of failing on output the dry run deliberately did not create.
    - not ansible_check_mode or not (otel_collector_cluster_identity | bool)

- name: Keep the collector enabled and running
  # `started`, never `restarted`: this starts a collector that is down and
  # leaves a running one alone. Putting a CHANGED configuration into the
  # running process is the handler's job, so a converge that changed nothing
  # interrupts nothing.
  ansible.builtin.systemd_service:
    name: "{{ otel_collector_unit_name }}"
    enabled: true
    state: started
  become: true
  # Same guard as the handlers: under `--check` on a host this role has never
  # converged, the unit was deliberately not written, so systemd knows nothing
  # to enable and the task would fail on the dry run's own omission.
  when: not ansible_check_mode or otel_collector_unit_stat.stat.exists
