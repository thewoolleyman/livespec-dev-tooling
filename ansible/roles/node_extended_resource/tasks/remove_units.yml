---
# The agent cleanup install-reapply-unit.sh performs before it refuses, and that
# install-node.sh's remove_stale_server_only_units performs alongside it. The
# TIMER goes before the SERVICE it triggers, so nothing fires between the two.

- name: Check whether the server-only churn-slot units are present
  ansible.builtin.stat:
    path: "{{ node_extended_resource_unit_dir }}/{{ item }}"
  register: node_extended_resource_stale
  become: true
  loop:
    - "{{ node_extended_resource_timer }}"
    - "{{ node_extended_resource_service }}"

- name: Disable and stop the server-only churn-slot units
  ansible.builtin.systemd_service:
    name: "{{ item.item }}"
    enabled: false
    state: stopped
  become: true
  loop: "{{ node_extended_resource_stale.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Remove the server-only churn-slot unit files
  ansible.builtin.file:
    path: "{{ node_extended_resource_unit_dir }}/{{ item.item }}"
    state: absent
  become: true
  loop: "{{ node_extended_resource_stale.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  notify: Reload systemd for the churn-slot units

- name: Publish the removal before clearing the failed state
  ansible.builtin.meta: flush_handlers

- name: Read the failed state of the removed units
  # Deleting a unit file and reloading does NOT take the unit out of `systemctl
  # list-units --state=failed`: systemd keeps the failed state in the manager
  # and reports the deleted unit as `not-found failed` until reset-failed runs
  # or the host reboots. Measured on gmktec-xubuntu 2026-09-07.
  #
  # check_mode: false because a skipped read would leave the clear below with
  # nothing to act on and silently drop a repair this role owes the host.
  # noqa: command-instead-of-module — the systemd module cannot address a
  # unit whose FILE is gone but whose failed state the manager still holds:
  # it reads LoadState=not-found and errors "Could not find the requested
  # service". That state is exactly what this reads, so there is no module
  # for it. check_mode: false so the clear below is not silently dropped
  # from a dry run's plan.
  ansible.builtin.command: systemctl is-failed {{ item }}
  register: node_extended_resource_failed
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  loop:
    - "{{ node_extended_resource_timer }}"
    - "{{ node_extended_resource_service }}"

- name: Clear the residual failed state
  # Only for a unit that IS failed: reset-failed on a unit the manager no longer
  # knows is itself an error, and running it unconditionally would report a
  # change on every pass.
  ansible.builtin.command: systemctl reset-failed {{ item.item }}
  become: true
  loop: "{{ node_extended_resource_failed.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stdout | default('') == 'failed'
  changed_when: true
