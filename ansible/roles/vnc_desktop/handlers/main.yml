---
- name: Restart vnc-desktop
  # Gated, not unconditional. See vnc_desktop_restart in defaults/main.yml for
  # what a restart costs. With the flag false the notification still fires and
  # the handler still runs; it simply reports skipped, which leaves a visible
  # record that the running session is now behind the files on disk.
  ansible.builtin.systemd_service:
    name: vnc-desktop.service
    state: restarted
    daemon_reload: true
  become: true
  when:
    - vnc_desktop_restart | bool
    - not ansible_check_mode or vnc_desktop_unit_stat.stat.exists

- name: Update the desktop database
  ansible.builtin.command:
    cmd: update-desktop-database {{ vnc_desktop_applications_dir }}
  become: true
  changed_when: true
