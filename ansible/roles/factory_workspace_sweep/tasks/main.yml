- name: Create the live workspace sweep install directory
  ansible.builtin.file:
    path: "{{ factory_workspace_sweep_lib_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when: factory_workspace_sweep_enabled | bool

- name: Install the live workspace sweep programs
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ factory_workspace_sweep_lib_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
    validate: python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" %s
  become: true
  loop:
    - factory_workspace_sweep.py
    - factory_workspace_manifest.py
  when: factory_workspace_sweep_enabled | bool

- name: Install the controller-built manifest configuration
  ansible.builtin.template:
    src: factory-workspace-manifest.json.j2
    dest: "{{ factory_workspace_sweep_lib_dir }}/manifest-config.json"
    owner: root
    group: root
    mode: "0600"
  become: true
  when: factory_workspace_sweep_enabled | bool

- name: Install the live workspace sweep service
  ansible.builtin.template:
    src: livespec-factory-workspace-sweep.service.j2
    dest: "{{ factory_workspace_sweep_unit_dir }}/{{ factory_workspace_sweep_service }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart the live workspace sweep timer
  when: factory_workspace_sweep_enabled | bool

- name: Install the live workspace sweep timer
  ansible.builtin.template:
    src: livespec-factory-workspace-sweep.timer.j2
    dest: "{{ factory_workspace_sweep_unit_dir }}/{{ factory_workspace_sweep_timer }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart the live workspace sweep timer
  when: factory_workspace_sweep_enabled | bool

- name: Enable the live workspace sweep timer
  ansible.builtin.systemd:
    name: "{{ factory_workspace_sweep_timer }}"
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when: factory_workspace_sweep_enabled | bool
