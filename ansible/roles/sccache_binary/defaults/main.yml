---
# Bump the version and the checksum together. The checksum is the one published
# as the release's own .sha256 asset (read 2026-09-04), not a digest computed
# from a file already downloaded — that would only prove the download was
# internally consistent, which is true of any tampered file.
sccache_binary_version: 0.17.0
sccache_binary_sha256: 67c4a96dd237c1f518f6b36083f270f9976d516f1e57fce891755ea782e50006
sccache_binary_asset: sccache-v0.17.0-x86_64-unknown-linux-musl
sccache_binary_url: >-
  https://github.com/mozilla/sccache/releases/download/v0.17.0/sccache-v0.17.0-x86_64-unknown-linux-musl.tar.gz
# The directory arc/hook-pod-template.yaml mounts READ-ONLY into every job
# container at /opt/ci-runner/bin. Shared with cache_telemetry.
sccache_binary_bin_dir: /usr/local/lib/ci-runner-k3s/bin
sccache_binary_dest: /usr/local/lib/ci-runner-k3s/bin/sccache
sccache_binary_stage_dir: /var/tmp/sccache-install
