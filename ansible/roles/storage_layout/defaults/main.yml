---
storage_layout_phase2_dir: "{{ role_path }}/../../../ci-runner/k3s/phase2"
# WHY LABELS AND NOT UUIDs, and the per-role filesystem types, are recorded ONCE
# in files/ci-tiers.fstab beside the lines they explain.
storage_layout_label_cache: ci-cache
storage_layout_label_containerd: ci-containerd
storage_layout_label_workvols: ci-workvols
storage_layout_cache_mount: /var/cache/ci-runner
storage_layout_containerd_src: /var/cache/ci-runner/k3s-containerd
storage_layout_workvols_src: /var/cache/ci-runner/k3s-storage
storage_layout_containerd_dir: /var/lib/rancher/k3s/agent/containerd
storage_layout_storage_dir: /var/lib/rancher/k3s/storage
# THE FIVE MANAGED FSTAB LINES, byte-exact — READ from the one committed
# fragment rather than composed here, so that this role and
# ci-runner/k3s/phase0-bare-metal/base-os-install.sh are no longer two
# generators of the same text that a non-gating manual exit test was all that
# held together. The fragment carries the WHY for every field.
#
# A list of LINES and not of {path, line} records: the mountpoint is field 2 of
# an fstab line, so `storage_layout_fstab_paths` derives it rather than a second
# copy of it being carried alongside. Comment and blank lines are dropped here,
# which is why no consumer has to know the fragment has a header.
storage_layout_fstab_fragment: "{{ role_path }}/files/ci-tiers.fstab"
storage_layout_fstab: >-
  {{ lookup('ansible.builtin.file', storage_layout_fstab_fragment).splitlines()
     | map('trim') | reject('match', '^(#|$)') | list }}
storage_layout_fstab_paths: >-
  {{ storage_layout_fstab | map('split') | map(attribute=1) | list }}
storage_layout_dropin_dir: /etc/systemd/system/k3s.service.d
storage_layout_dropin_name: 10-requires-storage-mounts.conf
# The one entry that says a containerd store is a STORE. containerd's metadata
# database is created before anything can use the store, and everything the
# kubelet needs is keyed to it; a grpc socket directory or the half-written
# content store a failed `ctr pull` leaves behind is not a store.
storage_layout_containerd_store_marker: io.containerd.metadata.v1.bolt
# The k3s units, both names: the unit an AGENT runs is k3s-agent.service, and a
# check naming only the server's would silently never fire on an agent.
storage_layout_k3s_units:
  - k3s.service
  - k3s-agent.service
# OFF BY DEFAULT, AND DELIBERATELY SO. Setting this true lets the role stop the
# node's k3s unit, rsync a live containerd or local-path store onto its tier and
# restart the unit — the one-time bootstrap the shell installer performs on a
# node whose k3s is already running on the root filesystem. It is a live
# migration on a running CI pool, so it is opt-in per run rather than something
# a routine converge can reach.
storage_layout_allow_live_migration: false
