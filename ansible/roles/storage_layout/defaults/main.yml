---
storage_layout_phase2_dir: "{{ role_path }}/../../../ci-runner/k3s/phase2"
# WHY LABELS AND NOT UUIDs: the node's tiers are moving media. A filesystem UUID
# is minted by every mkfs, so a UUID-keyed fstab has to change on every media
# move and the git copy of the layout can never match the host's. A LABEL is
# chosen by us and is the same on any medium. ext4 labels hold 16 bytes and XFS
# labels 12, so the names stay short.
storage_layout_label_cache: ci-cache
storage_layout_label_containerd: ci-containerd
storage_layout_label_workvols: ci-workvols
# PER-ROLE FILESYSTEM TYPE, which must agree with migrate-tier.sh's role_fstype:
# the cache and containerd tiers are ext4; workvols is XFS with reflink=1 since
# 2026-09-06, so the warm uv-cache seed can be a `cp --reflink` that gives every
# job its own inodes.
storage_layout_fstype_cache: ext4
storage_layout_fstype_containerd: ext4
storage_layout_fstype_workvols: xfs
storage_layout_cache_mount: /var/cache/ci-runner
storage_layout_containerd_src: /var/cache/ci-runner/k3s-containerd
storage_layout_workvols_src: /var/cache/ci-runner/k3s-storage
storage_layout_containerd_dir: /var/lib/rancher/k3s/agent/containerd
storage_layout_storage_dir: /var/lib/rancher/k3s/storage
# THE FIVE MANAGED FSTAB LINES, byte-exact. Composed from the labels and paths
# above rather than written out, so a path is stated once; the rendered text is
# identical to what install-storage-layout.sh's ensure_line writes.
#
# Each BIND requires ITS OWN SOURCE mount and not merely the cache volume:
# otherwise systemd may bind the empty mountpoint directory before the tier
# volume lands on it, and k3s would run on the cache volume — or on / —
# silently, since every path exists either way.
storage_layout_fstab:
  - path: "{{ storage_layout_cache_mount }}"
    line: >-
      LABEL={{ storage_layout_label_cache }} {{ storage_layout_cache_mount }}
      {{ storage_layout_fstype_cache }} defaults,noatime 0 2
  - path: "{{ storage_layout_containerd_src }}"
    line: >-
      LABEL={{ storage_layout_label_containerd }} {{ storage_layout_containerd_src }}
      {{ storage_layout_fstype_containerd }}
      defaults,noatime,x-systemd.requires-mounts-for={{ storage_layout_cache_mount }} 0 2
  - path: "{{ storage_layout_workvols_src }}"
    line: >-
      LABEL={{ storage_layout_label_workvols }} {{ storage_layout_workvols_src }}
      {{ storage_layout_fstype_workvols }}
      defaults,noatime,x-systemd.requires-mounts-for={{ storage_layout_cache_mount }} 0 2
  - path: "{{ storage_layout_containerd_dir }}"
    line: >-
      {{ storage_layout_containerd_src }} {{ storage_layout_containerd_dir }} none
      bind,x-systemd.requires-mounts-for={{ storage_layout_containerd_src }} 0 0
  - path: "{{ storage_layout_storage_dir }}"
    line: >-
      {{ storage_layout_workvols_src }} {{ storage_layout_storage_dir }} none
      bind,x-systemd.requires-mounts-for={{ storage_layout_workvols_src }} 0 0
storage_layout_dropin_dir: /etc/systemd/system/k3s.service.d
storage_layout_dropin_name: 10-requires-storage-mounts.conf
# The one entry that says a containerd store is a STORE. containerd's metadata
# database is created before anything can use the store, and everything the
# kubelet needs is keyed to it; a grpc socket directory or the half-written
# content store a failed `ctr pull` leaves behind is not a store.
storage_layout_containerd_store_marker: io.containerd.metadata.v1.bolt
# The k3s units, both names: the unit an AGENT runs is k3s-agent.service, and a
# check naming only the server's would silently never fire on an agent.
storage_layout_k3s_units:
  - k3s.service
  - k3s-agent.service
# OFF BY DEFAULT, AND DELIBERATELY SO. Setting this true lets the role stop the
# node's k3s unit, rsync a live containerd or local-path store onto its tier and
# restart the unit — the one-time bootstrap the shell installer performs on a
# node whose k3s is already running on the root filesystem. It is a live
# migration on a running CI pool, so it is opt-in per run rather than something
# a routine converge can reach.
storage_layout_allow_live_migration: false
