---
# gates_kubeconfig — this host's cluster access for the delegated pre-push gate.
#
# R4.S8 of livespec plan k3s-on-gmktec-for-vps-usage (epic livespec-sab5gn),
# work-item livespec-sab5gn.1. Replaces vps-info services/gates-kubeconfig/
# install.sh, which was merged in thewoolleyman/vps-info#64 and never run.
#
# WHAT THE CREDENTIAL GRANTS. It authenticates as the `gates` namespace's
# `gate-submitter` ServiceAccount: create/get/list/watch on jobs and pods plus
# get on pods/log, in that namespace only. No delete, nothing on secrets,
# nothing cluster-scoped. The Role is this repo's
# ci-runner/k3s/phase2/gates/gates-rbac.yaml; the host holds only the token.

- name: Install kubectl pinned to the cluster's k3s minor
  # The checksum is the PUBLISHED one fetched from its own URL, not a digest
  # computed from the file just downloaded — that would only prove the
  # download was internally consistent, which is true of any tampered file.
  ansible.builtin.get_url:
    url: >-
      https://dl.k8s.io/release/{{ gates_kubeconfig_kubectl_version }}/bin/linux/{{ _gates_kubeconfig_arch }}/kubectl
    checksum: >-
      sha256:https://dl.k8s.io/release/{{ gates_kubeconfig_kubectl_version }}/bin/linux/{{ _gates_kubeconfig_arch }}/kubectl.sha256
    dest: "{{ gates_kubeconfig_bin_dir }}/kubectl"
    owner: root
    group: root
    mode: "0755"
  become: true
  vars:
    _gates_kubeconfig_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else ansible_facts['architecture'] }}"

- name: Install the gates-credential scripts
  # These stay as shell because they are RUNTIME tools, not provisioning:
  # with-gates-kubeconfig re-fetches on a 401 in the middle of a gate run,
  # long after any playbook has exited. The role owns their installation;
  # it does not own their behaviour.
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ gates_kubeconfig_bin_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - refresh-gates-kubeconfig
    - with-gates-kubeconfig

- name: Read the rendered gates kubeconfig from the control-plane node
  # The shell installer needed `sudo -u <invoking user> sudo` here, because the
  # ssh key that reaches poweredge belongs to the invoking user while the
  # destination needs root. Ansible has no such problem: the read happens on
  # poweredge under its own become, and the write happens here under ours.
  ansible.builtin.slurp:
    src: "{{ gates_kubeconfig_remote_path }}"
  become: true
  delegate_to: "{{ gates_kubeconfig_remote_host }}"
  register: gates_kubeconfig_rendered
  changed_when: false
  no_log: true

- name: Refuse a fetched file that is not a kubeconfig
  # A truthful-looking but malformed answer is worse than a failure, because it
  # would overwrite a good credential with a useless one.
  ansible.builtin.assert:
    that:
      - "'kind: Config' in (gates_kubeconfig_rendered.content | b64decode)"
      - "'server:' in (gates_kubeconfig_rendered.content | b64decode)"
    fail_msg: >-
      {{ gates_kubeconfig_remote_host }}:{{ gates_kubeconfig_remote_path }} is not a
      kubeconfig — refusing to overwrite {{ gates_kubeconfig_dest }}
    success_msg: fetched content is a kubeconfig

- name: Create the credential directory
  # `--check` cannot see this: with the directory absent, the copy below is
  # reported as a would-be change and fails only on a real apply. The shell
  # installer created it inside refresh-gates-kubeconfig; the role owns it
  # here so a first apply on a fresh host succeeds.
  ansible.builtin.file:
    path: "{{ gates_kubeconfig_dest | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Create the group that may read the gates credential
  # A DEDICATED group, never an existing one. The credential is a bearer token
  # for the gates namespace, so widening it to a group the host already uses for
  # something else would hand that token to every present and future member of
  # that group. `system: true` keeps the GID out of the human range.
  ansible.builtin.group:
    name: "{{ gates_kubeconfig_group }}"
    system: true
    state: present
  become: true

- name: Put this host's login user in the gate-client group
  # The login user is who PUSHES, so it is the identity that has to be able to
  # READ the credential — the same account whose tailnet ssh key the refresh
  # fetch drops to. Before this, the credential was root:root 0600 while pushes
  # ran as `ubuntu`, so the gate client could not read the file it was supposed
  # to authenticate with (plan research/005 section 8).
  #
  # `append: true` is load-bearing: this role owns ONE of that user's groups,
  # not the set. A bare `groups:` would silently REMOVE every other membership
  # the account holds — `sudo` among them on an Ubuntu cloud image, which is
  # also what the wrapper's `sudo -n refresh-gates-kubeconfig` depends on.
  ansible.builtin.user:
    name: "{{ gates_kubeconfig_ssh_user }}"
    groups: "{{ gates_kubeconfig_group }}"
    append: true
  become: true

- name: Install the refresh tool's ssh-identity and group env-file
  # The runtime refresh tool runs as root at gate time, and root has no tailnet
  # identity, so it drops the ssh FETCH to gates_kubeconfig_ssh_user via sudo -u.
  # It also has to reproduce the credential's OWNERSHIP when it replaces the
  # file, so the gate-client group rides the same env-file. Both are pool facts,
  # delivered here rather than baked into the shipped script. Not no_log and mode
  # 0644 on purpose: it carries a username and a group name, never a secret —
  # the credential itself is the 0640 file below.
  ansible.builtin.copy:
    content: |
      # Written by the gates_kubeconfig Ansible role. Read by
      # refresh-gates-kubeconfig at runtime. Carries no secret.
      GATES_SSH_USER={{ gates_kubeconfig_ssh_user }}
      GATES_GROUP={{ gates_kubeconfig_group }}
    dest: "{{ gates_kubeconfig_ssh_env }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Install the gates kubeconfig
  # no_log because the content is a bearer token. It must never reach a diff,
  # a log line, or a terminal.
  #
  # ROOT-OWNED, GATE-CLIENT-GROUP-READABLE, 0640 — never world-readable, and
  # never root-only either. Root-only is what shipped first and it made the
  # credential unusable from the VPS: the pushing user is `ubuntu`, not root, so
  # the gate client could not read the file at all. The WRITE stays root's; a
  # group member reads the token and cannot replace it.
  ansible.builtin.copy:
    content: "{{ gates_kubeconfig_rendered.content | b64decode }}"
    dest: "{{ gates_kubeconfig_dest }}"
    owner: root
    group: "{{ gates_kubeconfig_group }}"
    mode: "0640"
  become: true
  no_log: true
