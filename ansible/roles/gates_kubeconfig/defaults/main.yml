---
# The cluster's k3s minor. kubectl is supported within one minor of the API
# server, but pinning to the cluster's own minor removes the question. Bump
# this when the cluster's k3s minor moves; a mismatch is a silent-skew class
# of defect, not a loud one.
gates_kubeconfig_kubectl_version: v1.36.2
gates_kubeconfig_bin_dir: /usr/local/bin
gates_kubeconfig_dest: /etc/ci-runner/gates.kubeconfig
# The control-plane node that renders the credential on every boot.
# The k3s server is resolved from the inventory, never named here: the ci_pool
# member whose cluster_role is server (livespec-dev-tooling-prdxxe).
gates_kubeconfig_remote_host: >-
  {{ groups['ci_pool'] | map('extract', hostvars)
     | selectattr('cluster_role', 'defined')
     | selectattr('cluster_role', 'equalto', 'server')
     | map(attribute='inventory_hostname') | first }}
gates_kubeconfig_remote_path: /etc/ci-runner/gates.kubeconfig
# The LOCAL login user whose tailnet ssh key reaches the control-plane node. The
# runtime refresh tool runs as root under the gate's boot re-injection, and root
# on this host has no tailnet identity, so it drops the FETCH to this user via
# `sudo -u` (the WRITE stays root). This is a pool fact, delivered to the tool in
# an env-file rather than baked into it; `ubuntu` is the fleet's usual account.
gates_kubeconfig_ssh_user: ubuntu
# Where the tool reads gates_kubeconfig_ssh_user from at runtime. Must match the
# GATES_SSH_ENV default the shipped refresh-gates-kubeconfig reads.
gates_kubeconfig_ssh_env: /etc/ci-runner/gates-refresh.env
# The group that may READ the credential. The credential is a bearer token, so it
# is never world-readable; a dedicated group is what lets the pushing login user
# read it without owning it and without handing the token to every member of a
# group the host already uses for something else. The WRITE stays root's — the
# runtime refresh tool reaches it through the wrapper's `sudo -n`. Must match the
# GATES_GROUP default the shipped refresh-gates-kubeconfig reads.
gates_kubeconfig_group: gates-client
