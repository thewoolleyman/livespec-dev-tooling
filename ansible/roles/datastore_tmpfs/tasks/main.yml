---
# datastore_tmpfs — the tmpfs mount unit for the k3s datastore (embedded etcd
# since livespec-dev-tooling-qy2nzf; kine/SQLite before it), ENABLED for the
# next boot and NEVER started. A size change in the committed unit is applied to
# an already-mounted tmpfs by `mount -o remount`, which keeps its contents (see
# the remount block below); the unit itself is never stopped or restarted.
#
# Replaces ci-runner/k3s/phase2/datastore-tmpfs/install-datastore-tmpfs.sh.
#
# WHY NEVER STARTED HERE: the mount goes OVER
# /var/lib/rancher/k3s/server/db. Starting it while k3s is RUNNING would hide
# the live datastore from under a running SQLite — data-loss-shaped and
# unrecoverable for that session. Activation is a reboot, or a deliberate
# cutover with k3s stopped. This role only enables, which is why the mount task
# below carries `enabled: true` and no `state:`.
#
# SERVER-ONLY: an agent holds no k3s datastore of either kind. The play, not
# this role, decides that — an agent simply never runs it.

- name: Read the state of the reconstruct-on-boot units
  ansible.builtin.service_facts:

- name: Refuse a host that cannot rebuild an empty cluster
  # The pre-gate, and it is not caution-by-habit: with a volatile datastore the
  # cluster is EMPTY at every boot, so the units that reinject the GitHub App
  # secret and converge the stack are what make the next boot a working pool
  # rather than a dead one.
  ansible.builtin.assert:
    that:
      - ansible_facts['services'][item] is defined
      - ansible_facts['services'][item]['status'] == 'enabled'
    fail_msg: >-
      {{ item }} is not enabled. Install and enable the reconstruct-on-boot units
      before making the datastore volatile.
    success_msg: "{{ item }}: enabled"
  loop: "{{ datastore_tmpfs_required_units }}"

- name: Check whether the datastore mount unit is already installed
  # Read BEFORE the task that writes it: under --check the unit file is only
  # would-be written, and an unguarded enable would fail with "Could not find
  # the requested service" and blame the host.
  ansible.builtin.stat:
    path: "{{ datastore_tmpfs_unit_dir }}/{{ datastore_tmpfs_mount_unit }}"
  register: datastore_tmpfs_unit_present
  become: true

- name: Install the datastore tmpfs mount unit
  ansible.builtin.copy:
    src: "{{ datastore_tmpfs_phase2_dir }}/datastore-tmpfs/{{ datastore_tmpfs_mount_unit }}"
    dest: "{{ datastore_tmpfs_unit_dir }}/{{ datastore_tmpfs_mount_unit }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd for the datastore tmpfs

- name: Create the k3s drop-in directory
  # Explicit, because --check cannot see past a missing parent.
  ansible.builtin.file:
    path: "{{ datastore_tmpfs_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the k3s drop-in that requires the datastore mount
  # Only a host with a volatile datastore gets this. The directory under the
  # mount is not a usable fallback, so k3s must not start on it — it fails loud
  # instead. Read this drop-in before any rollback: with it in place,
  # `systemctl start k3s` pulls the mount back in.
  ansible.builtin.copy:
    src: "{{ datastore_tmpfs_phase2_dir }}/datastore-tmpfs/{{ datastore_tmpfs_dropin_name }}"
    dest: "{{ datastore_tmpfs_dropin_dir }}/{{ datastore_tmpfs_dropin_name }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd for the datastore tmpfs

- name: Publish a changed unit before enabling it
  ansible.builtin.meta: flush_handlers

# A CHANGED SIZE REACHES THE MOUNTED TMPFS BY REMOUNT, NEVER BY A UNIT RESTART.
# A daemon-reload (the handler above) does not remount an active mount, so a size
# change in the committed unit would otherwise wait for the next boot. Stopping
# or restarting the unit would unmount the tmpfs and empty the datastore, and the
# k3s drop-in's RequiresMountsFor= would stop k3s with it. `mount -o remount,
# size=` changes only the ceiling and keeps every file (livespec-dev-tooling-qy2nzf,
# coordinator ruling 2026-11-11). Nothing here notifies a handler.
- name: Read the mounted datastore tmpfs and its size
  ansible.builtin.command:
    argv: [findmnt, -bno, "FSTYPE,SIZE", --mountpoint, "{{ datastore_tmpfs_mount_point }}"]
  register: datastore_tmpfs_mounted
  check_mode: false
  changed_when: false
  failed_when: datastore_tmpfs_mounted.rc not in [0, 1]
  become: true

- name: Derive whether the mounted tmpfs needs the committed size
  ansible.builtin.set_fact:
    datastore_tmpfs_size_bytes: "{{ datastore_tmpfs_size | human_to_bytes }}"
    datastore_tmpfs_resize_needed: >-
      {{ datastore_tmpfs_mounted.rc == 0
         and (datastore_tmpfs_mounted.stdout.split() | first) == 'tmpfs'
         and (datastore_tmpfs_mounted.stdout.split() | last | int) != (datastore_tmpfs_size | human_to_bytes | int) }}

- name: Read the datastore file before the remount
  ansible.builtin.stat:
    path: "{{ datastore_tmpfs_mount_point }}/state.db"
    get_checksum: false
  register: datastore_tmpfs_state_before
  check_mode: false
  become: true
  when: datastore_tmpfs_resize_needed | bool

- name: Report the remount a check run would apply
  ansible.builtin.debug:
    msg: >-
      Would remount {{ datastore_tmpfs_mount_point }} from
      {{ datastore_tmpfs_mounted.stdout.split() | last }} bytes to size={{ datastore_tmpfs_size }}
      ({{ datastore_tmpfs_size_bytes }} bytes) with `mount -o remount`; the mount unit is
      neither stopped nor restarted.
  changed_when: true
  when: datastore_tmpfs_resize_needed | bool and ansible_check_mode

- name: Remount the datastore tmpfs at the committed size, keeping its contents
  ansible.builtin.command:
    argv: [mount, -o, "remount,size={{ datastore_tmpfs_size }}", "{{ datastore_tmpfs_mount_point }}"]
  changed_when: true
  become: true
  when: datastore_tmpfs_resize_needed | bool and not ansible_check_mode

- name: Read the remounted tmpfs size and the datastore file back
  ansible.builtin.command:
    argv: [findmnt, -bno, "FSTYPE,SIZE", --mountpoint, "{{ datastore_tmpfs_mount_point }}"]
  register: datastore_tmpfs_remounted
  check_mode: false
  changed_when: false
  become: true
  when: datastore_tmpfs_resize_needed | bool and not ansible_check_mode

- name: Read the datastore file after the remount
  ansible.builtin.stat:
    path: "{{ datastore_tmpfs_mount_point }}/state.db"
    get_checksum: false
  register: datastore_tmpfs_state_after
  check_mode: false
  become: true
  when: datastore_tmpfs_resize_needed | bool and not ansible_check_mode

- name: Refuse a remount that did not take the size or did not keep the datastore
  ansible.builtin.assert:
    that:
      - (datastore_tmpfs_remounted.stdout.split() | first) == 'tmpfs'
      - (datastore_tmpfs_remounted.stdout.split() | last | int) == (datastore_tmpfs_size_bytes | int)
      - (not datastore_tmpfs_state_before.stat.exists) or datastore_tmpfs_state_after.stat.exists
      - >-
        (not datastore_tmpfs_state_before.stat.exists)
        or datastore_tmpfs_state_after.stat.inode == datastore_tmpfs_state_before.stat.inode
    fail_msg: >-
      The remount of {{ datastore_tmpfs_mount_point }} read back
      '{{ datastore_tmpfs_remounted.stdout }}' against {{ datastore_tmpfs_size_bytes }} bytes, or
      state.db did not survive it (before: {{ datastore_tmpfs_state_before.stat | default({}) }}).
    success_msg: >-
      {{ datastore_tmpfs_mount_point }} is tmpfs at {{ datastore_tmpfs_remounted.stdout.split() | last }}
      bytes; state.db kept inode {{ datastore_tmpfs_state_after.stat.inode | default('n/a') }}
      ({{ datastore_tmpfs_state_before.stat.size | default('absent') }} bytes before,
      {{ datastore_tmpfs_state_after.stat.size | default('absent') }} after)
  when: datastore_tmpfs_resize_needed | bool and not ansible_check_mode

- name: Enable the datastore mount for the next boot
  # `enabled: true` and NO `state:`. Anything that started this mount now would
  # hide a running k3s's live datastore.
  ansible.builtin.systemd_service:
    name: "{{ datastore_tmpfs_mount_unit }}"
    enabled: true
  become: true
  when: not ansible_check_mode or datastore_tmpfs_unit_present.stat.exists
