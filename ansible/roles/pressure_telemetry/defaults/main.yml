---
# Pressure Stall Information is a kernel interface, so every execution target
# runs the same definition. The one per-host value is the list of cgroup paths,
# relative to /sys/fs/cgroup, whose cpu.pressure is also exported. Empty means
# the host emits only its host pressure datapoints.
pressure_telemetry_cgroups: []
pressure_telemetry_lib_dir: /usr/local/lib/livespec
pressure_telemetry_unit_dir: /etc/systemd/system
pressure_telemetry_script_dest: "{{ pressure_telemetry_lib_dir }}/pressure-telemetry.sh"
pressure_telemetry_service_name: livespec-pressure-telemetry.service
pressure_telemetry_timer_name: livespec-pressure-telemetry.timer
