---
# breakage_pass -- one service and one timer per watched repository, each running
# the orchestrator's `dispatcher.py breakage-pass` under the repository's
# committed credential wrapper. See HOST_VARS.md.
#
# breakage_pass_enabled true installs and arms the units for the listed
# repositories. false is the revert: every breakage pass timer is stopped and
# disabled and every breakage pass unit file removed, as is any unit of a
# repository dropped from the list. The runner script and the state directory are
# left in place.

- name: Refuse an incomplete breakage pass configuration
  ansible.builtin.assert:
    that:
      - breakage_pass_plugin_root | string | length > 0
      - breakage_pass_runner_bin | string | length > 0
      - breakage_pass_orchestrator_checkout | string | length > 0
      - breakage_pass_shared_checkout | string | length > 0
      - breakage_pass_beads_metadata_source | string | length > 0
      - breakage_pass_branch | string | length > 0
      - breakage_pass_state_dir | string | length > 0
      - breakage_pass_interval_minutes | int > 0
      - breakage_pass_interval_minutes | int + ((breakage_pass_timeout_seconds | int + breakage_pass_stop_timeout_seconds | int) / 60) <= 30
      - breakage_pass_repos | selectattr('name', 'undefined') | list | length == 0
      - breakage_pass_repos | selectattr('repo', 'undefined') | list | length == 0
      - "'staleness' not in (breakage_pass_repos | map(attribute='name') | list)"
    fail_msg: >-
      The breakage pass needs a plugin root, the dedicated orchestrator clone, the
      shared checkout it must not be and its branch, a runner path, a state directory,
      and a repository list whose entries carry a name and a repo. The interval
      plus the pass timeout plus the stop timeout must stay within 30 minutes,
      the schedule the Definition of Done sets.
    success_msg: breakage pass configuration is complete

- name: Refuse a plugin root under a versioned plugin cache
  ansible.builtin.assert:
    that:
      - "'/.claude/plugins/cache/' not in breakage_pass_plugin_root"
      - not breakage_pass_plugin_root.startswith('/tmp')
      - not breakage_pass_state_dir.startswith('/tmp')
      - not breakage_pass_runner_bin.startswith('/tmp')
      - not breakage_pass_orchestrator_checkout.startswith('/tmp')
    fail_msg: >-
      The plugin root, the dedicated clone, the runner and the state directory must be stable paths.
      A plugin-cache path names one build and a /tmp path does not survive a
      reboot.
    success_msg: every breakage pass path is stable

- name: Refuse a dedicated clone that is, holds or sits inside the shared checkout
  # The factory's dispatcher launches from the shared workspace checkout. A
  # fast-forward under a running launcher is unsafe, so the pass never reads, syncs
  # or runs from that tree: not as its own clone and not as a watched repository.
  vars:
    breakage_pass_dedicated_norm: "{{ breakage_pass_orchestrator_checkout | regex_replace('/+$', '') }}"
    breakage_pass_shared_norm: "{{ breakage_pass_shared_checkout | regex_replace('/+$', '') }}"
  ansible.builtin.assert:
    that:
      - breakage_pass_dedicated_norm != breakage_pass_shared_norm
      - not (breakage_pass_dedicated_norm ~ '/').startswith(breakage_pass_shared_norm ~ '/')
      - not (breakage_pass_shared_norm ~ '/').startswith(breakage_pass_dedicated_norm ~ '/')
      - >-
        breakage_pass_repos | map(attribute='repo') | map('regex_replace', '/+$', '')
        | select('equalto', breakage_pass_shared_norm) | list | length == 0
    fail_msg: >-
      The dedicated orchestrator clone ({{ breakage_pass_orchestrator_checkout }}) must
      be its own directory, neither the shared checkout ({{ breakage_pass_shared_checkout }})
      nor inside or around it, and no watched repository may be the shared checkout.
      The factory's dispatcher launches from that tree and the pass fast-forwards the
      trees it reads.
    success_msg: the dedicated clone is separate from the shared checkout

- name: Install and arm the breakage pass units
  when: breakage_pass_enabled | bool
  block:
    - name: Check that the tenant credential wrapper is installed
      ansible.builtin.stat:
        path: "{{ breakage_pass_tenant_wrap_bin }}"
      register: breakage_pass_tenant_wrap
      become: true
      check_mode: false

    - name: Refuse to install without the tenant credential wrapper
      ansible.builtin.assert:
        that: breakage_pass_tenant_wrap.stat.exists and breakage_pass_tenant_wrap.stat.executable
        fail_msg: >-
          {{ breakage_pass_tenant_wrap_bin }} is not an executable file. Converge
          role reconcile_runs first; a pass files ledger items and must run under the
          repository's committed credential wrapper, never a bare family wrapper.
        success_msg: the tenant credential wrapper is installed

    # The dedicated clone. Created here, before the inputs below are checked, and never
    # re-cloned: `creates:` makes a second run change nothing. Read the origin URL
    # from the shared checkout when no host variable names one, refuse a URL that
    # carries credentials, and clone as the pass's user so the host's own gh or ssh
    # access is what authenticates, never anything embedded here.
    - name: Read the origin URL of the shared checkout
      ansible.builtin.command:
        argv: [git, -C, "{{ breakage_pass_shared_checkout }}", config, --get, remote.origin.url]
      register: breakage_pass_shared_origin
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ breakage_pass_user }}"
      check_mode: false
      when: breakage_pass_orchestrator_origin_url | length == 0

    - name: Settle the dedicated clone's origin URL
      ansible.builtin.set_fact:
        breakage_pass_clone_url: >-
          {{ breakage_pass_orchestrator_origin_url
             if (breakage_pass_orchestrator_origin_url | length > 0)
             else (breakage_pass_shared_origin.stdout | default('') | trim) }}

    - name: Refuse a missing or credential-bearing origin URL
      ansible.builtin.assert:
        that:
          - breakage_pass_clone_url | length > 0
          - not (breakage_pass_clone_url is match('^[A-Za-z][A-Za-z0-9+.-]*://[^/@:]+:[^/@]*@'))
        fail_msg: >-
          The dedicated clone has no usable origin URL. Set breakage_pass_orchestrator_origin_url,
          or make {{ breakage_pass_shared_checkout }} a checkout with an origin remote. A URL that
          embeds a password or token is refused: the host's gh credential helper or ssh key
          authenticates the clone.
        success_msg: the dedicated clone's origin URL carries no credentials

    - name: Check whether the dedicated clone exists
      ansible.builtin.stat:
        path: "{{ breakage_pass_orchestrator_checkout }}/.git"
      register: breakage_pass_clone_stat
      become: true
      check_mode: false

    - name: Create the dedicated clone's parent directory
      ansible.builtin.file:
        path: "{{ breakage_pass_orchestrator_checkout | dirname }}"
        state: directory
        owner: "{{ breakage_pass_user }}"
        group: "{{ breakage_pass_group }}"
        mode: "0755"
      become: true

    - name: Clone the orchestrator for the breakage pass
      block:
        - name: Clone from origin
          ansible.builtin.command:
            argv: [git, clone, --quiet, "{{ breakage_pass_clone_url }}", "{{ breakage_pass_orchestrator_checkout }}"]
            creates: "{{ breakage_pass_orchestrator_checkout }}/.git"
          environment:
            GIT_TERMINAL_PROMPT: "0"
          become: true
          become_user: "{{ breakage_pass_user }}"
      rescue:
        - name: Name the clone failure
          ansible.builtin.fail:
            msg: >-
              Could not clone {{ breakage_pass_clone_url }} into
              {{ breakage_pass_orchestrator_checkout }} as {{ breakage_pass_user }}. The clone uses
              the access that user already has (gh auth git-credential for https, or an ssh key);
              it never embeds credentials. Check `gh auth status` and network access as that user,
              then converge again.

    - name: Check the clone's gitignored beads metadata
      ansible.builtin.stat:
        path: "{{ breakage_pass_orchestrator_checkout }}/.beads/metadata.json"
      register: breakage_pass_clone_metadata
      become: true
      check_mode: false

    - name: Read the beads metadata source
      ansible.builtin.slurp:
        src: "{{ breakage_pass_beads_metadata_source }}"
      register: breakage_pass_metadata_source
      failed_when: false
      become: true
      check_mode: false
      when: not breakage_pass_clone_metadata.stat.exists

    - name: Refuse a missing or secret-bearing beads metadata source
      ansible.builtin.assert:
        that:
          - breakage_pass_metadata_source.content is defined
          - >-
            (breakage_pass_metadata_source.content | default('e30=') | b64decode | from_json).keys()
            | select('search', '(?i)pass|token|secret|key') | list | length == 0
        fail_msg: >-
          The clone has no .beads/metadata.json (it is gitignored) and
          {{ breakage_pass_beads_metadata_source }} cannot supply one: it is missing, or it
          holds a key naming a secret. Without it `bd` answers "no beads database found" and a
          pass could not dedupe or file. Do not run `bd init`; provision the file, then converge
          again.
        success_msg: the beads metadata source is present and holds no secret
      when: not breakage_pass_clone_metadata.stat.exists

    - name: Keep the clone's .beads directory private, creating it if the clone has none
      ansible.builtin.file:
        path: "{{ breakage_pass_orchestrator_checkout }}/.beads"
        state: directory
        mode: "0700"
      become: true
      when: not ansible_check_mode or breakage_pass_clone_stat.stat.exists

    - name: Provision the clone's beads metadata from the source, never overwriting
      ansible.builtin.copy:
        src: "{{ breakage_pass_beads_metadata_source }}"
        dest: "{{ breakage_pass_orchestrator_checkout }}/.beads/metadata.json"
        remote_src: true
        force: false
        owner: "{{ breakage_pass_user }}"
        group: "{{ breakage_pass_group }}"
        mode: "0600"
      become: true
      when:
        - not breakage_pass_clone_metadata.stat.exists
        - not ansible_check_mode or breakage_pass_clone_stat.stat.exists

    - name: Check each watched repository's checkout, config and the dispatcher
      ansible.builtin.stat:
        path: "{{ item.1 }}"
      loop: >-
        {{ breakage_pass_repos | map(attribute='name')
           | zip(breakage_pass_repos | map(attribute='repo')) | list
           + breakage_pass_repos | map(attribute='name')
           | zip(breakage_pass_repos | map(attribute='repo') | map('regex_replace', '$', '/.livespec.jsonc')) | list
           + [['(dispatcher)', breakage_pass_plugin_root ~ '/scripts/bin/dispatcher.py']] }}
      loop_control:
        label: "{{ item.0 }}: {{ item.1 }}"
      register: breakage_pass_inputs
      become: true
      check_mode: false

    - name: Refuse a timer whose inputs are missing
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir if item.item.1 in (breakage_pass_repos | map(attribute='repo')) else true
        fail_msg: >-
          {{ item.item.0 }}: {{ item.item.1 }} is missing or not usable. A pass whose
          checkout, .livespec.jsonc or dispatcher.py is absent fails every run.
          Provision it before converging this role.
        success_msg: "{{ item.item.0 }}: {{ item.item.1 }} is present"
      loop: "{{ breakage_pass_inputs.results }}"
      loop_control:
        label: "{{ item.item.0 }}: {{ item.item.1 }}"
      # Under --check the dedicated clone is only planned, so its inputs cannot exist yet.
      when: >-
        not (ansible_check_mode and not breakage_pass_clone_stat.stat.exists
             and (item.item.1 | string).startswith(breakage_pass_orchestrator_checkout))

    # The same script the units run, in its --resolve mode, from role reconcile_runs's
    # copy of it, so nothing is installed yet. It reads each repository's committed
    # credential_wrapper exactly as a pass will and refuses one that is malformed.
    - name: Resolve each repository's committed credential wrapper as its pass will
      ansible.builtin.script:
        cmd: "{{ role_path }}/../reconcile_runs/files/livespec-tenant-wrap.sh --resolve"
        chdir: "{{ item.repo }}"
      environment:
        TW_FAMILY_WRAPPER: "{{ breakage_pass_family_wrapper }}"
        TW_REPO: "{{ item.repo }}"
      loop: "{{ breakage_pass_repos }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        not (ansible_check_mode and not breakage_pass_clone_stat.stat.exists
             and (item.repo | string).startswith(breakage_pass_orchestrator_checkout))
      register: breakage_pass_wrap_resolved
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ breakage_pass_user }}"
      check_mode: false

    - name: Refuse a repository whose committed credential wrapper a pass could not run
      ansible.builtin.assert:
        that: item.rc == 0
        fail_msg: >-
          {{ item.item.name }}: {{ (item.stderr | default('') | trim) or (item.stdout | default('') | trim) }}.
          Every pass of this repository would exit 78 without running. Fix its
          committed .livespec.jsonc credential_wrapper, or provision the wrapper it
          names, before converging this role.
        success_msg: "{{ item.item.name }}: {{ item.stdout_lines | default([]) | join(' ') }}"
      loop: "{{ breakage_pass_wrap_resolved.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.skipped is not defined

    - name: Check that the staleness check is installed
      ansible.builtin.stat:
        path: "{{ breakage_pass_staleness_bin }}"
      register: breakage_pass_staleness_installed
      become: true
      check_mode: false

    - name: Refuse to install without the staleness check
      ansible.builtin.assert:
        that: breakage_pass_staleness_installed.stat.exists and breakage_pass_staleness_installed.stat.executable
        fail_msg: >-
          {{ breakage_pass_staleness_bin }} is not an executable file. Converge role
          reconcile_runs first; this role reuses its staleness check.
        success_msg: the staleness check is installed

    - name: Check the staleness unit's OnFailure= alert unit
      ansible.builtin.stat:
        path: >-
          {{ breakage_pass_unit_dir }}/{{ breakage_pass_staleness_on_failure
             | regex_replace('@.*$', '@') }}.service
      register: breakage_pass_alert_unit
      become: true
      check_mode: false
      when: breakage_pass_staleness_on_failure | length > 0

    - name: Refuse an OnFailure= target that is not installed
      ansible.builtin.assert:
        that: breakage_pass_alert_unit.stat.exists
        fail_msg: >-
          breakage_pass_staleness_on_failure names {{ breakage_pass_staleness_on_failure }},
          but {{ breakage_pass_unit_dir }}/{{ breakage_pass_staleness_on_failure
          | regex_replace('@.*$', '@') }}.service is not installed. A staleness
          check whose alert unit is missing fails with nobody told.
        success_msg: the staleness alert unit is installed
      when: breakage_pass_staleness_on_failure | length > 0

    - name: Create the breakage pass state directory
      ansible.builtin.file:
        path: "{{ breakage_pass_state_dir }}"
        state: directory
        owner: "{{ breakage_pass_user }}"
        group: "{{ breakage_pass_group }}"
        mode: "0750"
      become: true

    - name: Install the breakage pass runner
      ansible.builtin.copy:
        src: livespec-breakage-pass
        dest: "{{ breakage_pass_runner_bin }}"
        owner: "{{ breakage_pass_unit_owner }}"
        group: "{{ breakage_pass_unit_group }}"
        mode: "0755"
      become: true

    - name: Install the breakage pass service units
      ansible.builtin.template:
        src: breakage-pass.service.j2
        dest: "{{ breakage_pass_unit_dir }}/livespec-breakage-pass-{{ item.name }}.service"
        owner: "{{ breakage_pass_unit_owner }}"
        group: "{{ breakage_pass_unit_group }}"
        mode: "0644"
      become: true
      loop: "{{ breakage_pass_repos }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install the breakage pass timer units
      ansible.builtin.template:
        src: breakage-pass.timer.j2
        dest: "{{ breakage_pass_unit_dir }}/livespec-breakage-pass-{{ item.name }}.timer"
        owner: "{{ breakage_pass_unit_owner }}"
        group: "{{ breakage_pass_unit_group }}"
        mode: "0644"
      become: true
      loop: "{{ breakage_pass_repos }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Seed each success marker on a new install
      # So the staleness check never reports a newly installed repository missing
      # before its first pass. An existing marker is never refreshed.
      ansible.builtin.command:
        argv: [touch, "{{ breakage_pass_state_dir }}/{{ item.name }}.last-success"]
        creates: "{{ breakage_pass_state_dir }}/{{ item.name }}.last-success"
      become: true
      become_user: "{{ breakage_pass_user }}"
      loop: "{{ breakage_pass_repos }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Install the breakage pass staleness units
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ breakage_pass_unit_dir }}/{{ item.dest }}"
        owner: "{{ breakage_pass_unit_owner }}"
        group: "{{ breakage_pass_unit_group }}"
        mode: "0644"
      become: true
      loop:
        - src: breakage-pass-staleness.service.j2
          dest: "{{ breakage_pass_staleness_unit }}.service"
        - src: breakage-pass-staleness.timer.j2
          dest: "{{ breakage_pass_staleness_unit }}.timer"
      loop_control:
        label: "{{ item.dest }}"

    - name: Reload systemd so the breakage pass units are known
      ansible.builtin.systemd_service:
        daemon_reload: true
      become: true
      when: breakage_pass_manage_systemd | bool

    - name: Check which breakage pass timer units are installed
      # Read BEFORE any timer is armed. Under --check the templates above write
      # nothing, so arming a not-yet-existing timer would fail with systemd's "Could
      # not find the requested service", a fault the role invented rather than found.
      ansible.builtin.stat:
        path: "{{ breakage_pass_unit_dir }}/{{ item }}.timer"
      loop: "{{ (breakage_pass_repos | map(attribute='name') | map('regex_replace', '^', 'livespec-breakage-pass-') | list) + [breakage_pass_staleness_unit] }}"
      register: breakage_pass_timer_units
      become: true
      check_mode: false

    - name: Set the breakage pass timers to the hold
      # enabled true starts every timer; false leaves each installed, disabled and
      # stopped, so a converge on a host that has not been cleared starts nothing.
      # The staleness timer follows the same switch. It does not remove a unit file
      # or stop a pass already running, and a repository dropped from
      # breakage_pass_repos keeps its timer: see HOST_VARS.md "Revert".
      ansible.builtin.systemd_service:
        name: "{{ item.item }}.timer"
        enabled: "{{ breakage_pass_enabled | bool }}"
        state: "{{ 'started' if breakage_pass_enabled | bool else 'stopped' }}"
      become: true
      when: (breakage_pass_manage_systemd | bool) and (not ansible_check_mode or item.stat.exists)
      loop: "{{ breakage_pass_timer_units.results }}"
      loop_control:
        label: "{{ item.item }}"

# --- Revert ---
# Runs on every converge. Enabled, it removes only the units of a repository that
# is no longer listed; disabled, it removes them all. A second run finds nothing.

- name: Find the installed breakage pass units
  ansible.builtin.find:
    paths: "{{ breakage_pass_unit_dir }}"
    patterns:
      - "livespec-breakage-pass-*.service"
      - "livespec-breakage-pass-*.timer"
  register: breakage_pass_installed
  become: true
  check_mode: false

- name: Work out which breakage pass units are no longer wanted
  ansible.builtin.set_fact:
    breakage_pass_unwanted: >-
      {{ breakage_pass_installed.files | map(attribute='path') | map('basename')
         | reject('in', breakage_pass_wanted) | list }}
  vars:
    breakage_pass_wanted: >-
      {{ ((breakage_pass_repos | map(attribute='name') | map('regex_replace', '^', 'livespec-breakage-pass-') | map('regex_replace', '$', '.service') | list)
          + (breakage_pass_repos | map(attribute='name') | map('regex_replace', '^', 'livespec-breakage-pass-') | map('regex_replace', '$', '.timer') | list)
          + [breakage_pass_staleness_unit ~ '.service', breakage_pass_staleness_unit ~ '.timer'])
         if breakage_pass_enabled | bool else [] }}

- name: Stop and disable the breakage pass timers that are no longer wanted
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  become: true
  when: (breakage_pass_manage_systemd | bool) and item.endswith('.timer')
  loop: "{{ breakage_pass_unwanted }}"

- name: Remove the breakage pass unit files that are no longer wanted
  ansible.builtin.file:
    path: "{{ breakage_pass_unit_dir }}/{{ item }}"
    state: absent
  become: true
  loop: "{{ breakage_pass_unwanted }}"

- name: Reload systemd after removing breakage pass units
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  when: (breakage_pass_manage_systemd | bool) and (breakage_pass_unwanted | length > 0)
