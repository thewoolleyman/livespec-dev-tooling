---
# incident_observer — converge a dev host to a running independent incident
# observer (docs/incident-observer-service.md). livespec-dev-tooling-w7n3ad.
#
# ORDER IS THE CONTRACT. The service authenticates its installation at every
# start and exits 2 before binding a socket when any piece is wrong, so each
# piece is written before the one that names it: account → directories → venv
# at the released tag → reader clone → reference clone → secrets → controller.json
# → manifest (hashes controller.json and every executable) → an isolated load of
# the whole installation AS THE CONTROLLER ACCOUNT → unit → start → a probe that
# the listener refuses an unauthenticated read.
#
# SECRETS. The three secret files are written from the CONTROL NODE's environment
# under no_log, the shape otel_collector uses for its ingest key: run the apply
# through /usr/local/bin/with-livespec-env.sh, which projects the livespec
# 1Password environment. A bare apply refuses at the preflight and names the
# variable. No value is read back, printed or compared in the run output.
#
# CHECK MODE. On a host this role has never reached, `--check` writes nothing,
# so the venv, the clones and the unit do not exist; every step that needs one
# is guarded on the pre-read `incident_observer_installed` and says so, rather
# than failing on the dry run's own omission (the otel_collector guard).

# DISPATCH. This file holds two includes and nothing else. The converge body is
# tasks/converge.yml. Production reaches it directly. The scratch instance
# reaches it only through tasks/scratch_apply.yml, which takes
# tasks/scratch_preflight.yml first. Every include is DYNAMIC (`include_tasks`),
# and `--start-at-task` can only follow static includes, so no converge or
# preflight task can be started at directly: a run either begins at one of these
# two includes, or finds nothing to run (livespec-dev-tooling-32qdja).

- name: Converge the scratch instance only through its refusals
  # Whenever ANY scratch-identifying variable is set, in any spelling: the
  # preflight's first assert then refuses scratch variables without scratch
  # mode, so `-e incident_observer_scratch=false` on the scratch playbook
  # cannot fall through to production's path.
  ansible.builtin.include_tasks: scratch_apply.yml
  when: >-
    incident_observer_scratch | bool
    or incident_observer_scratch_name is defined
    or incident_observer_target_branch | default('', true) | length > 0

- name: Converge the production instance
  ansible.builtin.include_tasks: converge.yml
  when: >-
    not (incident_observer_scratch | bool)
    and incident_observer_scratch_name is not defined
    and incident_observer_target_branch | default('', true) | length == 0
