---
# The committed teardown of the scratch-branch incident observer instance
# (ansible/incident-observer-scratch-teardown.yml, which loads vars/scratch.yml
# and includes this file). livespec-dev-tooling-32qdja.
#
# It runs on the PRODUCTION host, so it first takes the same refusals as the
# apply (tasks/scratch_preflight.yml): a name that is one safe segment, the
# layout that name fixes, and no path that is, sits inside or contains one of
# production's. Then it stops and disables the scratch observer and its
# reference fetch timer, removes their unit files, the timer's stamp, the
# scratch controller.json and the scratch manifest, and reads back that every
# production file it could reach, and the listing of production's state
# directory, are byte-identical to what they were before it started. It never
# stops, restarts or writes production, and never notifies a handler.
#
# The scratch root (receipts and reference clone) is the evidence store a Proof
# of Done may still cite, so it is kept unless
# `incident_observer_scratch_teardown_purge` is true. A purge removes only
# `<production home>/scratch-<name>`, spelled from the validated name, never
# from a path variable an override could point elsewhere.

- name: Take the scratch instance's refusals before stopping or removing anything
  ansible.builtin.include_tasks: scratch_preflight.yml

- name: Name what the teardown removes and every production path it reads back
  ansible.builtin.set_fact:
    incident_observer_scratch_removed:
      - "{{ incident_observer_unit_path }}"
      - "{{ incident_observer_fetch_service_path }}"
      - "{{ incident_observer_fetch_timer_path }}"
      - "/var/lib/systemd/timers/stamp-{{ incident_observer_fetch_unit_name }}.timer"
      - "{{ incident_observer_config_path }}"
      - "{{ incident_observer_manifest_path }}"
    incident_observer_production_files: >-
      {{ [incident_observer_production.incident_observer_unit_path,
          incident_observer_production.incident_observer_config_path,
          incident_observer_production.incident_observer_manifest_path,
          incident_observer_production.incident_observer_fetch_service_path,
          incident_observer_production.incident_observer_fetch_timer_path,
          incident_observer_production.incident_observer_recovery_app_path,
          incident_observer_production.incident_observer_reader_env_path]
         + (incident_observer_production.incident_observer_secrets | map(attribute='path') | list) }}
    incident_observer_production_directories:
      - "{{ incident_observer_production.incident_observer_home }}"
      - "{{ incident_observer_production.incident_observer_state_dir }}"
      - "{{ incident_observer_production.incident_observer_reference_dir }}"
      - "{{ incident_observer_production.incident_observer_etc_dir }}"
      - "{{ incident_observer_production.incident_observer_venv }}"
    # Production remains live while a scratch instance is removed.  Its
    # receipts and recovery journal are its append-only evidence, not teardown
    # output, so compare the rest of the state directory byte-for-byte.
    incident_observer_production_live_state_pattern: >-
      {{ '^' ~ (incident_observer_production.incident_observer_state_dir | regex_escape)
         ~ '/(?:[^/]+[.]json|recovery-journal(?:-contexts)?(?:/|$))' }}

- name: Read production's files and directories before the teardown
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  become: true
  loop: "{{ incident_observer_production_files + incident_observer_production_directories }}"
  register: incident_observer_production_before
  check_mode: false

- name: List production's state directory before the teardown
  # The receipts and the recovery journal: every file, with its checksum.
  ansible.builtin.find:
    paths: "{{ incident_observer_production.incident_observer_state_dir }}"
    recurse: true
    hidden: true
    file_type: any
    get_checksum: true
  become: true
  register: incident_observer_production_state_before
  check_mode: false

- name: Look for the scratch observer's unit and its fetch timer
  ansible.builtin.stat:
    path: "{{ item }}"
    get_checksum: false
  become: true
  loop:
    - "{{ incident_observer_unit_path }}"
    - "{{ incident_observer_fetch_timer_path }}"
  register: incident_observer_scratch_units
  check_mode: false

- name: Stop and disable the scratch observer
  ansible.builtin.systemd_service:
    name: "{{ incident_observer_unit_name }}"
    state: stopped
    enabled: false
  become: true
  when: incident_observer_scratch_units.results[0].stat.exists

- name: Stop and disable the scratch reference fetch timer
  ansible.builtin.systemd_service:
    name: "{{ incident_observer_fetch_unit_name }}.timer"
    state: stopped
    enabled: false
  become: true
  when: incident_observer_scratch_units.results[1].stat.exists

- name: Stop a scratch reference fetch the timer already started
  ansible.builtin.systemd_service:
    name: "{{ incident_observer_fetch_unit_name }}.service"
    state: stopped
  become: true
  when: incident_observer_scratch_units.results[1].stat.exists

- name: Remove the scratch unit files, timer stamp, controller.json and manifest
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop: "{{ incident_observer_scratch_removed }}"

- name: Reload systemd so it forgets the removed scratch units
  # Unconditional: a reload is idempotent, and a rerun after a teardown that
  # stopped half-way still leaves systemd naming no scratch unit.
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true

- name: Clear any failed state systemd still holds for the scratch units
  # A scratch unit that ended `failed` otherwise lingers as `not-found failed`
  # in `systemctl list-units --all`. `reset-failed` exits non-zero for a unit
  # it does not know, which is the expected case after a clean stop.
  ansible.builtin.command:
    argv:
      - systemctl
      - reset-failed
      - "{{ incident_observer_unit_name }}.service"
      - "{{ incident_observer_fetch_unit_name }}.service"
      - "{{ incident_observer_fetch_unit_name }}.timer"
  become: true
  changed_when: false
  failed_when: false

- name: Remove the scratch evidence store only when asked
  # The path is spelled from production's home and the validated name, never
  # from incident_observer_scratch_root: the preflight proved the two equal,
  # and an override can reach a variable but not this expression.
  ansible.builtin.file:
    path: "{{ incident_observer_production.incident_observer_home }}/scratch-{{ incident_observer_scratch_name }}"
    state: absent
  become: true
  when: incident_observer_scratch_teardown_purge | bool

- name: Read production's files and directories after the teardown
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  become: true
  loop: "{{ incident_observer_production_files + incident_observer_production_directories }}"
  register: incident_observer_production_after
  check_mode: false

- name: List production's state directory after the teardown
  ansible.builtin.find:
    paths: "{{ incident_observer_production.incident_observer_state_dir }}"
    recurse: true
    hidden: true
    file_type: any
    get_checksum: true
  become: true
  register: incident_observer_production_state_after
  check_mode: false

- name: Refuse a teardown that moved a byte of production
  ansible.builtin.assert:
    that:
      - >-
        incident_observer_production_after.results
        | map(attribute='stat.checksum', default='') | list
        == incident_observer_production_before.results
        | map(attribute='stat.checksum', default='') | list
      - >-
        incident_observer_production_after.results
        | map(attribute='stat.exists') | list
        == incident_observer_production_before.results
        | map(attribute='stat.exists') | list
      - >-
        incident_observer_production_state_after.files
        | rejectattr('path', 'match', incident_observer_production_live_state_pattern)
        | sort(attribute='path') | map(attribute='path') | list
        == incident_observer_production_state_before.files
        | rejectattr('path', 'match', incident_observer_production_live_state_pattern)
        | sort(attribute='path') | map(attribute='path') | list
      - >-
        incident_observer_production_state_after.files
        | rejectattr('path', 'match', incident_observer_production_live_state_pattern)
        | sort(attribute='path') | map(attribute='checksum', default='') | list
        == incident_observer_production_state_before.files
        | rejectattr('path', 'match', incident_observer_production_live_state_pattern)
        | sort(attribute='path') | map(attribute='checksum', default='') | list
    fail_msg: >-
      production's files ({{ incident_observer_production_files | join(', ') }}),
      directories or state listing changed during the scratch teardown; read
      them and the production unit now.
    success_msg: >-
      production's unit, configuration, manifest, credentials, fetch units and
      state directory listing are byte-identical
