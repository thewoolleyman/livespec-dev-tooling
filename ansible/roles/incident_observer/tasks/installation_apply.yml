---
# A further production installation's apply: its refusals, then the shared
# converge body. Reached only through tasks/main.yml's dynamic include, so
# neither half can be started at with `--start-at-task`, and the converge body
# runs only once every refusal has passed. livespec-dev-tooling-lqp2qx.

- name: Take the installation's refusals before writing anything
  ansible.builtin.import_tasks: installation_preflight.yml

- name: Converge the installation now that its refusals have passed
  ansible.builtin.include_tasks: converge.yml
