---
# incident_observer — the independent released incident observer service
# (docs/incident-observer-service.md), converged onto one dev host behind its
# tailnet TLS front. livespec-dev-tooling-w7n3ad. See README.md.
#
# Every value here is a fleet default. The one value that genuinely varies by
# machine — which login account is the CANDIDATE account the controller must
# differ from — lives in host_vars (HOST_VARS.md).

# --- the release the installation serves ------------------------------------
# The normally released livespec-dev-tooling tag. Installed from the release
# tag on GitHub into the venv below, never from a checkout on the host; the
# manifest's `release` must equal `v` + the installed distribution version and
# `revision` is this tag's commit, read from the reference clone. The release
# declares the packages its vendored runtime imports from outside itself
# (v1.183.1 is the first that does), so the role installs the release and
# nothing beside it.
incident_observer_release: v1.205.0
incident_observer_release_repo: https://github.com/thewoolleyman/livespec-dev-tooling.git
# The repository the observer serves (controller.json `repository`).
incident_observer_repository: thewoolleyman/livespec-dev-tooling
# The ONE branch the observer binds, watches and recovers, with the recovery
# principal it drives (controller.json's optional `target_branch`). Empty
# leaves the key out of controller.json, so the installation serves master and
# the rendered file is byte-identical to one written before the key existed.
# Name a scratch branch only for a proof installation: every observer route and
# the principal then refuse master (livespec-dev-tooling-thhgeg).
incident_observer_target_branch: ""
# The required master leaf jobs the manifest names: the observer acts on the
# first FAILING `workflow_job` callback whose name is in this list. It is every
# leaf job and matrix leg `ci-green` needs in `.github/workflows/ci.yml`, spelled
# as the `workflow_job` event reports it (a job's `name:`, or one entry per
# `matrix.target` leg for a job named `${{ matrix.target }}`; measured on master
# run 42316488005, 2026-11-06), so the revert fires at the first failing leaf
# instead of when the aggregate concludes after the whole run
# (livespec-dev-tooling-hudte3). `ci-green` itself, the one status check
# master's protection requires, stays last as the backstop for a run the
# aggregate fails through a conclusion no leaf callback acts on (a cancelled
# leg). `tests/livespec_dev_tooling/test_incident_observer_job_universe.py`
# fails and names the job when this list and `ci-green`'s `needs:` drift.
incident_observer_required_jobs:
  - check-types
  - check-lint
  - check-format
  - check-per-file-coverage
  - check-coverage
  - check-python-batch
  - check-fleet-conformance
  - check-red-green-replay
  - check-check-coverage-incremental
  - check-metadata-batch
  - incident-ci
  - ci-green

# --- the canonical reader ---------------------------------------------------
# The orchestrator plugin release whose `incident_authority.py` is the canonical
# `read-current` reader (docs/incident-observer-service.md). Cloned at this tag,
# root-owned, next to the venv. Its tenant credential is NOT provisioned here.
incident_observer_reader_release: v0.315.1
incident_observer_reader_repo: https://github.com/thewoolleyman/livespec-orchestrator-beads-fabro.git
incident_observer_reader_script_relative: .claude-plugin/scripts/bin/incident_authority.py

# --- accounts ---------------------------------------------------------------
# The dedicated controller account, distinct from every candidate and factory
# account. Owns its configuration, manifest, secrets, state and reference clone.
incident_observer_user: livespec-incident
incident_observer_group: livespec-incident
# The CANDIDATE account (controller.json `candidate_uid` is its uid, read with
# getent at apply). The loader refuses a candidate uid equal to its own euid.
# Declared per host: see HOST_VARS.md.
incident_observer_candidate_user: ""

# --- layout -----------------------------------------------------------------
incident_observer_python: /usr/bin/python3
incident_observer_install_dir: /opt/livespec-incident
incident_observer_venv: /opt/livespec-incident/venv
incident_observer_bin_dir: /opt/livespec-incident/bin
incident_observer_reader_dir: /opt/livespec-incident/reader
incident_observer_etc_dir: /etc/livespec-incident
incident_observer_config_path: /etc/livespec-incident/controller.json
incident_observer_manifest_path: /etc/livespec-incident/released-installation.json
# The three distinct secrets, each >= 32 bytes, mode 0600, owned by the
# controller account. The role writes each from the CONTROL NODE's environment
# — the named variable, projected by /usr/local/bin/with-livespec-env.sh from
# the livespec 1Password environment — and never from a value in this tree.
incident_observer_secrets:
  - name: webhook
    path: /etc/livespec-incident/webhook-secret
    env: LIVESPEC_INCIDENT_WEBHOOK_SECRET
  - name: control
    path: /etc/livespec-incident/control-secret
    env: LIVESPEC_INCIDENT_CONTROL_SECRET
  - name: query
    path: /etc/livespec-incident/query-secret
    env: LIVESPEC_INCIDENT_QUERY_SECRET
incident_observer_secret_min_bytes: 32
# The canonical reader's tenant credential: the SAME BEADS_DOLT_PASSWORD the
# credential wrapper projects on the control node, written at apply (no_log)
# as a systemd environment file the unit loads, so the reader runs with
# credential projection inside the controller's own account — the shape
# docs/incident-observer-service.md allows under NoNewPrivileges. The tenant's
# host and port are not declared here: the reference clone's committed
# `.beads/config.yaml` carries them (the dolt-server on this host, loopback),
# and the role renders the clone's gitignored `.beads/metadata.json` pointer
# from that file, because `bd` resolves its workspace from the pointer and
# answers `no beads database found` to a clone that has only `config.yaml`
# (the first `POST /arm`, 2026-11-06). The pointer's `project_id` is the
# tenant's server-stable id, the one every fleet clone's pointer carries and
# the one `bd init --server` regenerates (AGENTS.md §"Beads runtime
# prerequisites"); it names no secret.
# The recovery principal's GitHub App credential: a DEDICATED recovery App,
# distinct from the factory/publishing bot (GITHUB_APP_ID / GITHUB_PRIVATE_KEY),
# whose installation is the only bypass actor on master's ruleset (GO-1 in the
# plan's note 006). The principal reads it from this file beside controller.json
# (incident_recovery_principal_service.py); the observer process and its reader
# never hold it. Written at apply, under no_log, only when the credential
# wrapper projects BOTH variables on the control node; until then the principal
# refuses every forge operation as `recovery-app-credential-absent`.
incident_observer_recovery_app_path: /etc/livespec-incident/recovery-app.json
incident_observer_recovery_app_id_env: LIVESPEC_RECOVERY_APP_ID
incident_observer_recovery_app_key_env: LIVESPEC_RECOVERY_APP_PRIVATE_KEY
incident_observer_reader_env_path: /etc/livespec-incident/reader.env
incident_observer_reader_env_var: BEADS_DOLT_PASSWORD
incident_observer_tenant_project_id: c8dcb5d9-1d1c-47d9-a1e5-f856e60b9544
# --- CI identity policy (livespec-dev-tooling-bqnzcm.4) ----------------------
# The protected policy POST /ci/publish verifies a publishing job against
# (docs/incident-ci-identity.md). The role renders it per installation with
# files/render_ci_identity_policy.py from that installation's inventory entry
# (repository, repository_id, owner_id), so no owner is spelled here, and binds
# it into the released-installation manifest by path and digest.
#
# The approved commits of the incident CI publisher,
# .github/workflows/reusable-incident-ci-publish.yml in the publisher
# repository. EMPTY provisions no policy, and removes one an earlier apply
# installed: the controller then answers every publication with
# identity-not-provisioned and the run is recorded unpublished. A commit is
# listed only once it is on that repository's master, because the token's
# job_workflow_sha names it and a pull request's own commit is rewritten by
# rebase-merge. Rolling the publisher: list the old and the new commit, move the
# callers' pin, then drop the old one.
incident_observer_ci_publisher_shas: []
# The repository that ships the publisher is the first inventory entry, whose
# installation every variable above describes; the stable repository and owner
# ids are this installation's own inventory entry. Both are read where the policy
# is rendered (tasks/converge.yml), never spelled here.
# The OIDC audience the publisher requests and this installation pins. The
# caller sets the same value as its LIVESPEC_INCIDENT_CI_AUDIENCE variable.
incident_observer_ci_audience: "livespec-incident-observer:{{ incident_observer_repository }}"
incident_observer_ci_identity_policy_path: /etc/livespec-incident/ci-identity.json
# The forge's signing keys, fetched at every apply. A forge key rotation is
# remedied by re-applying the role (README, "Rotating the CI issuer keys").
incident_observer_ci_jwks_url: https://token.actions.githubusercontent.com/.well-known/jwks
incident_observer_ci_jwks_path: /etc/livespec-incident/ci-issuer-jwks.json
# The crypto executable the controller verifies signatures with, pinned by digest.
incident_observer_ci_crypto_path: /usr/bin/openssl
incident_observer_ci_identity_enabled: >-
  {{ (incident_observer_ci_publisher_shas | length > 0)
     and not (incident_observer_scratch | bool)
     and incident_observer_scratch_name is not defined }}
# The controller account's home. The private state directory (0700) and the
# independent reference clone are siblings beneath it; the loader refuses a
# state directory inside the clone and a package inside the clone.
incident_observer_home: /var/lib/livespec-incident
incident_observer_state_dir: /var/lib/livespec-incident/receipts
incident_observer_reference_dir: /var/lib/livespec-incident/reference
# The loopback port the listener binds; the tailnet front proxies to it.
incident_observer_port: 8765
# The public routes, each an EXACT path the role publishes through a
# path-scoped Tailscale Funnel on this port, proxied to the same path on
# production's loopback listener; `/` is never published, and every other
# route stays tailnet-only on the `tailscale serve` mapping the host declares.
# Funnel admits ports 443, 8443 and 10000 only, and 8443 is already served on
# the dev host.
#   - POST /callback: GitHub's webhook delivery must reach it.
#   - POST /ordinary-action: the master-health reconciler runs on
#     GitHub-hosted runners, which cannot reach the tailnet, and asks this
#     route who owns its next step. It is a read-only query route: the query
#     token is checked before the body is read, and a missing or wrong token
#     gets 403 (maintainer ruling, option A, livespec-dev-tooling-jpfdcx,
#     2026-11-10).
#   - POST /ci/publish: the incident CI publisher runs on GitHub-hosted runners
#     and publishes an expedited pull request's PASSED aggregate. Its guard is
#     the job's forge-signed OIDC identity token, verified against the pinned
#     CI identity policy before any state is read or written; an unverified
#     publication is refused with no side effect (legacy-coordinator-agent's
#     ruling on livespec-dev-tooling-bqnzcm.4, 2026-11-13). Exactly this path:
#     no prefix and no wildcard.
# An apply refuses when any declared path is left unpublished after it
# publishes, and whenever the funnel port publishes a path not in this list.
incident_observer_funnel_https_port: 10000
incident_observer_funnel_paths:
  - /callback
  - /ordinary-action
  - /ci/publish

# --- the production installation inventory --------------------------------------
# One entry per repository a production observer installation serves
# (SPECIFICATION/contracts.md, the per-repository installation paragraph,
# livespec-dev-tooling-lqp2qx). livespec-dev-tooling is the FIRST entry and is
# the installation every variable above describes: ansible/dev-host.yml
# converges it, byte-identical to the role before this inventory existed, and
# its entry repeats the values above exactly (a test holds them equal). Every
# OTHER entry is converged one at a time by ansible/incident-observer-installation.yml
# with `-e incident_observer_installation_name=<name>`, where <name> is the
# repository without its owner. Its layout is derived from that name in
# vars/installation.yml: controller-<name>.json, released-installation-<name>.json,
# installation-<name>/{receipts,reference}, units livespec-incident-observer-<name>
# and livespec-incident-reference-fetch-<name>, reader-<name>.env. Its public
# routes are published on the one funnel port at /<name>/callback and
# /<name>/ordinary-action, each proxied to the same route on its own listener.
# The audit's controller reader (livespec_dev_tooling) holds its committed list
# of served repositories equal to this inventory's `repository` values.
#   repository        owner/name the installation serves (controller.json `repository`)
#   repository_id     GitHub's numeric id of that repository (survives a transfer)
#   owner_id          GitHub's numeric id of its owner (changes with a transfer); the
#                     CI identity policy keys on both, never on the owner's login
#   required_jobs     that repository's required master leaf jobs, `ci-green` last
#   port              its loopback listener port, distinct from every other entry's
#                     and from the scratch instance's
#   tenant_project_id its work-item tenant's server-stable project id (the
#                     reference clone's `.beads/metadata.json` pointer)
#   reader_env_var    the control-node environment variable that carries THAT
#                     tenant's credential; an apply refuses when it is not projected
incident_observer_installations:
  - repository: thewoolleyman/livespec-dev-tooling
    repository_id: 1245319543
    owner_id: 158
    required_jobs:
      - check-types
      - check-lint
      - check-format
      - check-per-file-coverage
      - check-coverage
      - check-python-batch
      - check-fleet-conformance
      - check-red-green-replay
      - check-check-coverage-incremental
      - check-metadata-batch
      - incident-ci
      - ci-green
    port: 8765
    tenant_project_id: c8dcb5d9-1d1c-47d9-a1e5-f856e60b9544
    reader_env_var: BEADS_DOLT_PASSWORD
  # The three repositories the maintainer's 2026-11-12 ruling adopts besides
  # livespec-dev-tooling (epic livespec-dev-tooling-bqnzcm). Each required_jobs
  # list is that repository's own `ci-green` needs on master, spelled as the
  # workflow_job event reports them (a matrix job once per leg), with incident-ci
  # before ci-green as livespec-dev-tooling's own list has it (incident-ci reaches
  # the orchestrator and overseer with livespec-orchestrator-beads-fabro#5092 and
  # livespec-overseer#2963; livespec's release-gate-pre-tag is skipped on master
  # and reports once under that name). Each tenant id is that repository's
  # `.beads/metadata.json` project_id. The reader credential: the credential
  # wrapper projects ONE BEADS_DOLT_PASSWORD, the same from every checkout
  # (measured 2026-11-12), and the TENANT it opens is chosen by the reference
  # clone's committed `.beads/config.yaml` (dolt.server-user, dolt.database),
  # rendered into the clone's pointer. The apply proves that credential opens the
  # served tenant before it serves (tasks/converge.yml), so a later per-tenant
  # password cannot silently cross.
  - repository: thewoolleyman/livespec
    repository_id: 1215509712
    owner_id: 158
    required_jobs:
      - check-lint
      - check-format
      - check-types
      - check-per-file-coverage
      - check-coverage
      - check-python-batch
      - check-red-green-replay
      - check-doctor-static
      - check-copier-template-smoke
      - check-metadata-batch
      - release-gate-pre-tag
      - incident-ci
      - ci-green
    port: 8770
    tenant_project_id: a2a7f557-5359-45a6-9246-786a87ea7d18
    reader_env_var: BEADS_DOLT_PASSWORD
  - repository: thewoolleyman/livespec-orchestrator-beads-fabro
    repository_id: 1262632932
    owner_id: 158
    required_jobs:
      - check-lint (nonroot)
      - check-format (nonroot)
      - check-types (nonroot)
      - check-per-file-coverage-shard (nonroot, 1/4)
      - check-per-file-coverage-shard (nonroot, 2/4)
      - check-per-file-coverage-shard (nonroot, 3/4)
      - check-per-file-coverage-shard (nonroot, 4/4)
      - check-per-file-coverage (nonroot)
      - check-coverage (nonroot)
      - check-python-batch (nonroot)
      - check-doctor-static
      - check-red-green-replay
      - check-check-coverage-incremental
      - check-metadata-batch
      - e2e-cli
      - acceptance
      - check-factory-provenance
      - check-fleet-materialized-workflow-toml-size
      - incident-ci
      - ci-green
    port: 8771
    tenant_project_id: 6a35844e-3c68-4ea6-bca0-703c27007af3
    reader_env_var: BEADS_DOLT_PASSWORD
  - repository: thewoolleyman/livespec-overseer
    repository_id: 1307110964
    owner_id: 158
    required_jobs:
      - check-lint
      - check-format
      - check-types
      - check-per-file-coverage
      - check-coverage
      - check-python-batch
      - check-red-green-replay
      - check-check-coverage-incremental
      - check-metadata-batch
      - check-doctor-static
      - incident-ci
      - ci-green
    port: 8772
    tenant_project_id: 7d389f16-2acc-4fb8-9668-863646408a77
    reader_env_var: BEADS_DOLT_PASSWORD
# The routes every installation publishes: livespec-dev-tooling's at exactly
# these paths (incident_observer_funnel_paths above), every other installation's
# under /<name>.
incident_observer_installation_routes:
  - /callback
  - /ordinary-action
  - /ci/publish

# --- units ------------------------------------------------------------------
incident_observer_unit_name: livespec-incident-observer
incident_observer_unit_path: /etc/systemd/system/livespec-incident-observer.service
# A fetch timer keeps the reference clone's objects current for the inverse,
# running as the controller account; the apply never fetches on its own.
incident_observer_fetch_unit_name: livespec-incident-reference-fetch
incident_observer_fetch_service_path: /etc/systemd/system/livespec-incident-reference-fetch.service
incident_observer_fetch_timer_path: /etc/systemd/system/livespec-incident-reference-fetch.timer
incident_observer_fetch_interval: 5min

# --- the scratch-branch instance ----------------------------------------------
# False for production. ansible/incident-observer-scratch.yml sets it, with the
# instance's own paths, port, unit names and target branch, from
# vars/scratch.yml; this role then converges a SECOND observer beside
# production that shares production's venv, reader clone and secret files
# read-only and writes none of them, and publishes no funnel. The committed
# teardown is ansible/incident-observer-scratch-teardown.yml
# (tasks/scratch_teardown.yml). livespec-dev-tooling-32qdja; README.md
# §"The scratch-branch instance".
incident_observer_scratch: false
