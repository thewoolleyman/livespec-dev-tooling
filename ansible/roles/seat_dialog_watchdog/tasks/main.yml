---
- name: Stop the seat dialog watchdog when switched off
  ansible.builtin.systemd:
    name: "{{ seat_dialog_watchdog_unit }}"
    state: stopped
    enabled: false
  failed_when: false
  when: not seat_dialog_watchdog_enabled

- name: Measure the digest of the watchdog script this role ships
  # Read on the CONTROLLER before anything is sent to the host. ansible.builtin.copy can
  # only verify a SHA-1 checksum in flight, and the fleet pin is SHA-256, so the comparison
  # happens here (the btop_loop pattern). Passing the sha256 pin to copy's `checksum:` failed
  # the vps apply on 2026-11-21 while check mode, which skips that comparison, passed.
  ansible.builtin.stat:
    path: "{{ role_path }}/files/seat-dialog-watchdog"
    checksum_algorithm: sha256
  become: false
  delegate_to: localhost
  register: seat_dialog_watchdog_source_stat
  when: seat_dialog_watchdog_enabled

- name: Assert the shipped watchdog script matches the fleet's pinned digest
  ansible.builtin.assert:
    that: seat_dialog_watchdog_source_stat.stat.checksum == seat_dialog_watchdog_pinned_sha256
    fail_msg: >-
      the watchdog script has diverged from the fleet's pinned digest.
      want {{ seat_dialog_watchdog_pinned_sha256 }}, got {{ seat_dialog_watchdog_source_stat.stat.checksum }}.
      Re-record the digest in livespec-dev-tooling and hetzner-xubuntu-info together.
  when: seat_dialog_watchdog_enabled

- name: Install the seat dialog watchdog program
  ansible.builtin.copy:
    src: seat-dialog-watchdog
    dest: "{{ seat_dialog_watchdog_command }}"
    owner: root
    group: root
    mode: "0755"
  when: seat_dialog_watchdog_enabled
  notify: Restart the seat dialog watchdog

- name: Install the seat dialog watchdog unit
  ansible.builtin.template:
    src: seat-dialog-watchdog.service.j2
    dest: "/etc/systemd/system/{{ seat_dialog_watchdog_unit }}"
    owner: root
    group: root
    mode: "0644"
  when: seat_dialog_watchdog_enabled
  notify: Restart the seat dialog watchdog

- name: Enable and start the seat dialog watchdog
  ansible.builtin.systemd:
    name: "{{ seat_dialog_watchdog_unit }}"
    enabled: true
    state: started
    daemon_reload: true
  when: seat_dialog_watchdog_enabled and not ansible_check_mode
