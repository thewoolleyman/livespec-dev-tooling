---
# The disposable acceptance VM as the docker_engine play's only target.
#
# Used ONLY with this play and this VM:
#   ansible-playbook -i ansible/roles/docker_engine/acceptance/inventory.yml \
#     ansible/docker-engine.yml
# It is never merged into the fleet inventory. The VM is the one `vm.sh`
# boots on the control node: SSH on 127.0.0.1:2229 and the LLM-health stub
# on 127.0.0.1:2280, both forwarded by QEMU's user-mode network.
#
# Every probe and must-stay-running variable points at the stubs
# `baseline.sh` installs, so the acceptance driver can make each probe fail
# by stopping the matching stub (FAULTS.md, P-05 to P-07).
all:
  children:
    docker_engine_hosts:
      hosts:
        guard-vm:
          ansible_host: 127.0.0.1
          ansible_port: 2229
          ansible_user: guard
          ansible_become: true
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/docker-engine-guard-vm/id_ed25519"
          ansible_ssh_common_args: >-
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

          docker_engine_must_stay_running:
            - local-homelab-llama-server.service
          docker_engine_llm_health_url: http://127.0.0.1:2280/health

          # The VM has no Tailscale and no LAN fallback, so both controller
          # probes open a NEW plain SSH session to the guest. They still
          # prove what matters for the role: that a fresh connection reaches
          # the host after the change.
          docker_engine_tailscale_ssh_argv: &vm_new_session
            - ssh
            - -i
            - "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/docker-engine-guard-vm/id_ed25519"
            - -p
            - "2229"
            - -o
            - BatchMode=yes
            - -o
            - ConnectTimeout=15
            - -o
            - ControlMaster=no
            - -o
            - ControlPath=none
            - -o
            - StrictHostKeyChecking=no
            - -o
            - UserKnownHostsFile=/dev/null
            - guard@127.0.0.1
            - "true"
          docker_engine_lan_fallback_ssh_argv: *vm_new_session

          # The guest's own apt and dpkg configuration, read from the
          # pristine baseline by `sha256sum` (refreshed whenever `baseline`
          # is rebuilt).
          docker_engine_dpkg_config_digests:
            /etc/dpkg/dpkg.cfg: fead43b89af3ea5691c48f32d7fe1ba0f7ab229fb5d230f612d76fe8e6f5a015
            /etc/apt/apt.conf.d/01-vendor-ubuntu: 364d5eeac5475b7dddfd629899ea88b91ed8d8e8e319c29bb9dbd6772e87ed55
            /etc/apt/apt.conf.d/01autoremove: 35b4360d9126e5e5efc1ce42cea8a957ba42921de749ad8502922d536c9f385c
            /etc/apt/apt.conf.d/10periodic: 82d9ce0d3f5d2c66945d8a1267445e9955409d1ef3cb9934107adccb46bf5f6a
            /etc/apt/apt.conf.d/15update-stamp: 174cdb519fd06372847e23c20db869b2ff4b593252c0d2a6274d770eae2d92c9
            /etc/apt/apt.conf.d/20apt-esm-hook.conf: f7ab45bab1355711fcd031d78299cc3c7767654e7bf3f66a716ee3f2eae93733
            /etc/apt/apt.conf.d/20archive: 4a569793b6a530904ff0dfd160bbc069c8a5b247d72f5756d62e6aeb31eabfdc
            /etc/apt/apt.conf.d/20auto-upgrades: b81a3a01864d5ed7f8d023f3fa86d65087ad6b85706d399dc229a60b1c784807
            /etc/apt/apt.conf.d/20packagekit: b4b98908ac8561a4823b23c724e65cc4c98f2067eb961a80816b3d15427522b4
            /etc/apt/apt.conf.d/20snapd.conf: 4f1a710936d83d53caa575af269db4311d7b461bdb1bb94ced5b1d331b0886ac
            /etc/apt/apt.conf.d/50appstream: 8e89df0e4cfa24c7db4a165e776f40af7e0477f0d290bea4334edf6655db72bd
            /etc/apt/apt.conf.d/50command-not-found: 3a6f9f5244e49bee66ce65101fb73e16ba90f7a6cbd19befeefdf2c63209e2f1
            /etc/apt/apt.conf.d/50unattended-upgrades: 88fb5cc2a1bbe749468213f6a9d351a8b668760d8a4c94eef5ad7f4723f19a6e
