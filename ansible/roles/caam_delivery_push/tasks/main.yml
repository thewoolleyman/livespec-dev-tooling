---
- name: Refuse a role holder without a pinned livespec-overseer commit
  ansible.builtin.assert:
    that:
      - caam_delivery_push_ref is match('^[0-9a-f]{40}$')
    fail_msg: >-
      caam_delivery_push_ref must be a full 40-hex commit sha declared in
      group_vars/caam_role_holder.yml. Nothing has been changed.
    quiet: true

- name: Read the checkout's uncommitted changes
  ansible.builtin.command:
    argv: [git, -C, "{{ caam_delivery_push_checkout }}", status, --porcelain]
  register: caam_delivery_push_status
  changed_when: false

- name: Refuse a checkout with uncommitted changes
  ansible.builtin.assert:
    that:
      - caam_delivery_push_status.stdout | length == 0
    fail_msg: >-
      {{ caam_delivery_push_checkout }} has uncommitted changes; the role never
      overwrites them. Nothing has been changed.
    quiet: true

- name: Refuse a caam checksum that is not a full sha256
  ansible.builtin.assert:
    that:
      - caam_delivery_push_caam_sha256 is match('^[0-9a-f]{64}$')
    fail_msg: >-
      caam_delivery_push_caam_sha256 must be the full 64-hex sha256 of the pinned caam
      release asset. Nothing has been changed.
    quiet: true

- name: Look for an installed caam binary
  ansible.builtin.stat:
    path: "{{ caam_delivery_push_caam_dest | expanduser }}"
  register: caam_delivery_push_caam_file

- name: Read the installed caam version
  ansible.builtin.command:
    argv: ["{{ caam_delivery_push_caam_dest | expanduser }}", --version]
  register: caam_delivery_push_caam_installed
  changed_when: false
  failed_when: false
  when: caam_delivery_push_caam_file.stat.exists

- name: Install the pinned caam binary
  when: >-
    not caam_delivery_push_caam_file.stat.exists
    or caam_delivery_push_caam_version not in (caam_delivery_push_caam_installed.stdout | default(''))
  block:
    - name: Create the caam binary's directory
      ansible.builtin.file:
        path: "{{ caam_delivery_push_caam_dest | expanduser | dirname }}"
        state: directory
        mode: "0755"

    - name: Download the pinned caam binary, verified against its sha256
      ansible.builtin.get_url:
        url: "{{ caam_delivery_push_caam_url }}"
        dest: "{{ caam_delivery_push_caam_dest | expanduser }}"
        checksum: "sha256:{{ caam_delivery_push_caam_sha256 }}"
        mode: "0755"
        force: true

    - name: Read the installed caam version after the install
      ansible.builtin.command:
        argv: ["{{ caam_delivery_push_caam_dest | expanduser }}", --version]
      register: caam_delivery_push_caam_after
      changed_when: false

    - name: Refuse an installed caam that does not report the pinned version
      ansible.builtin.assert:
        that:
          - caam_delivery_push_caam_version in caam_delivery_push_caam_after.stdout
        fail_msg: >-
          The caam installed at {{ caam_delivery_push_caam_dest }} does not report version
          {{ caam_delivery_push_caam_version }}.
        quiet: true

- name: Read the checkout's commit
  ansible.builtin.command:
    argv: [git, -C, "{{ caam_delivery_push_checkout }}", rev-parse, HEAD]
  register: caam_delivery_push_head_before
  changed_when: false

- name: Ask whether the checkout already contains the pinned commit
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ caam_delivery_push_checkout }}"
      - merge-base
      - --is-ancestor
      - "{{ caam_delivery_push_ref }}"
      - HEAD
  register: caam_delivery_push_contained
  changed_when: false
  failed_when: false

- name: Move the checkout to the pinned commit
  when: caam_delivery_push_contained.rc != 0
  block:
    - name: Fetch the checkout's remote
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ caam_delivery_push_checkout }}"
          - fetch
          - --quiet
          - "{{ caam_delivery_push_remote }}"
      changed_when: false

    - name: Fast-forward the checkout to the pinned commit
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ caam_delivery_push_checkout }}"
          - merge
          - --ff-only
          - --quiet
          - "{{ caam_delivery_push_ref }}"
      changed_when: true

- name: Read the checkout's commit after the converge
  ansible.builtin.command:
    argv: [git, -C, "{{ caam_delivery_push_checkout }}", rev-parse, HEAD]
  register: caam_delivery_push_head_after
  changed_when: false

- name: Read the commit the push service was last installed from
  ansible.builtin.command:
    argv: [cat, "{{ caam_delivery_push_stamp | expanduser }}"]
  register: caam_delivery_push_installed
  changed_when: false
  failed_when: false

- name: Install the push service from the checkout's commit
  when: >-
    caam_delivery_push_installed.rc != 0
    or caam_delivery_push_installed.stdout | trim != caam_delivery_push_head_after.stdout
  block:
    - name: Install and restart the push service
      ansible.builtin.command:
        argv: "{{ caam_delivery_push_install_command }}"
        chdir: "{{ caam_delivery_push_checkout }}"
      changed_when: true

    - name: Create the install stamp's directory
      ansible.builtin.file:
        path: "{{ caam_delivery_push_stamp | expanduser | dirname }}"
        state: directory
        mode: "0700"

    - name: Record the commit the push service was installed from
      ansible.builtin.copy:
        dest: "{{ caam_delivery_push_stamp | expanduser }}"
        content: "{{ caam_delivery_push_head_after.stdout }}\n"
        mode: "0600"

- name: Read the push service's state
  ansible.builtin.command:
    argv: "{{ caam_delivery_push_active_command }}"
  register: caam_delivery_push_active
  changed_when: false
  failed_when: caam_delivery_push_active.stdout | trim != 'active'

- name: Read the deployed sweep's sha256
  ansible.builtin.stat:
    path: "{{ caam_delivery_push_checkout }}/{{ caam_delivery_push_readback_path }}"
    checksum_algorithm: sha256
  register: caam_delivery_push_deployed

- name: Read the pinned commit's sweep sha256
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      git -C {{ caam_delivery_push_checkout | quote }} show
      {{ (caam_delivery_push_ref ~ ':' ~ caam_delivery_push_readback_path) | quote }}
      | sha256sum | cut -d' ' -f1
    executable: /bin/bash
  register: caam_delivery_push_pinned
  changed_when: false

- name: Report the read-back
  ansible.builtin.debug:
    msg: >-
      caam-delivery-push read-back: head={{ caam_delivery_push_head_after.stdout }}
      pinned={{ caam_delivery_push_ref }}
      sweep_sha256={{ caam_delivery_push_deployed.stat.checksum | default('missing') }}
      pinned_sweep_sha256={{ caam_delivery_push_pinned.stdout | trim }}
      unit={{ caam_delivery_push_active.stdout | trim }}

- name: Refuse a deployed sweep that differs from the pinned commit's
  ansible.builtin.assert:
    that:
      - caam_delivery_push_deployed.stat.exists
      - caam_delivery_push_deployed.stat.checksum == caam_delivery_push_pinned.stdout | trim
    fail_msg: >-
      The deployed {{ caam_delivery_push_readback_path }} differs from commit
      {{ caam_delivery_push_ref }}'s.
    quiet: true
  when: caam_delivery_push_head_after.stdout == caam_delivery_push_ref
