---
# The pinned Fabro client builds this host's inventory declares.
#
# THE SPLIT IS THE OBLIGATION, not a tidiness choice. The section requires that
# the role "MUST first validate every `fabro_client_builds` entry, and before it
# writes anything on the host for any entry it MUST refuse". A per-entry
# validate-then-write loop would satisfy neither half: entry two's refusal would
# arrive after entry one's build was already live, and the host would be left in
# a state no inventory describes. So every refusal lives in `validate.yml` and
# every write in `install.yml`, and the order between the two files IS the
# clause.
#
# A host whose inventory declares neither builds nor a PATH client converges this
# role as a no-op.  A PATH-client declaration beside an empty build list is NOT
# a no-op: it has to be refused because its target cannot name a declared build.

- name: Stage declared Fabro client builds and point the host PATH client at one
  when: fabro_client_builds | length > 0 or fabro_client_path_client is defined
  block:
    - name: Validate every declared Fabro client build before anything is written
      ansible.builtin.include_tasks: validate.yml
      when: fabro_client_builds | length > 0

    - name: Validate the declared Fabro PATH client before anything is written
      ansible.builtin.include_tasks: path_client_validate.yml
      when: fabro_client_path_client is defined

    - name: Install every declared Fabro client build
      ansible.builtin.include_tasks: install.yml
      when: fabro_client_builds | length > 0

    - name: Point the host PATH client at its declared Fabro client build
      ansible.builtin.include_tasks: path_client_install.yml
      when: fabro_client_path_client is defined
