---
# ci_converge_unit — the self-contained artifact tree the boot converge applies,
# and the unit that applies it on the next boot.
#
# Replaces ci-runner/k3s/phase2/reconstruct/install-converge-unit.sh.
#
# WHY THE WHOLE ARTIFACT SET AND NOT JUST THE ONE SCRIPT: converge-ci-stack.sh
# is boot-critical and it APPLIES a tree of repository YAML and scripts. The
# live host carries NO repository checkout, so a boot unit cannot read them from
# a working tree. Copying the set into /usr/local/lib/ci-runner-k3s/ makes the
# converge self-contained and boot-durable with no checkout present; the
# repository stays the source of truth and this role is the refresh step.
#
# THIS ROLE DISTRIBUTES AND APPLIES CHANGED INPUTS. Everything under the tree is
# Kubernetes-declarative — Kueue queues, ARC values, manifests, kustomizations —
# and stays that way. The converge script's own cluster control flow is
# deliberately untouched by this conversion. Once the role refreshes any of
# those inputs, it starts the committed unit and waits for it before the apply
# returns. When the tree is already current, it does neither, which preserves
# the no-change result of a second apply.
#
# NOT copied here: patch-node-churn-capacity.sh. Converge step 1b runs it from
# this same directory, but node_extended_resource owns that file — one owner per
# file. Its absence is warned about at the end of this role, as the shell warned.

- name: Resolve the glob-derived members of the installed tree
  # The three sets the shell installer resolves with a shell glob. Resolving
  # them here rather than listing them keeps a new per-repo queue or scale set
  # travelling with no edit to this role. values-EXAMPLE-repo.yaml is excluded
  # because it is an authoring template, never a live release.
  ansible.builtin.set_fact:
    ci_converge_unit_glob_files: >-
      {{ (query('ansible.builtin.fileglob', ci_converge_unit_phase2_dir ~ '/arc/values-*.yaml')
          | reject('search', 'values-EXAMPLE-repo\.yaml$')
          | map('regex_replace', '^.*/', 'arc/') | list)
         + (query('ansible.builtin.fileglob', ci_converge_unit_phase2_dir ~ '/kueue/core/*.yaml')
            | map('regex_replace', '^.*/', 'kueue/core/') | list)
         + (query('ansible.builtin.fileglob', ci_converge_unit_phase2_dir ~ '/kueue/cluster-queue-*.yaml')
            | map('regex_replace', '^.*/', 'kueue/') | list) }}

- name: Create the installed artifact tree
  ansible.builtin.file:
    path: "{{ (ci_converge_unit_lib_dir ~ '/' ~ item) | regex_replace('/$', '') }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  loop: "{{ ci_converge_unit_directories }}"
  loop_control:
    label: "{{ item | default('(root)', true) }}"

- name: Copy the named members of the installed tree
  ansible.builtin.copy:
    src: "{{ ci_converge_unit_phase2_dir }}/{{ item.src }}"
    dest: "{{ ci_converge_unit_lib_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  become: true
  loop: "{{ ci_converge_unit_files }}"
  loop_control:
    label: "{{ item.dest }}"
  register: ci_converge_unit_named_members

- name: Copy the glob-derived members of the installed tree
  # All 0644: every one of them is a manifest or a values file the converge
  # applies, never something it executes.
  ansible.builtin.copy:
    src: "{{ ci_converge_unit_phase2_dir }}/{{ item }}"
    dest: "{{ ci_converge_unit_lib_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ ci_converge_unit_glob_files | sort }}"
  register: ci_converge_unit_glob_members

- name: Pull the pinned ARC Helm charts into the installed artifact tree
  # The ONE member of the installed set that is FETCHED rather than copied out of
  # this repository — see the defaults' note on why the charts are pulled at apply
  # time rather than vendored or left to the boot converge. `creates:` is what
  # makes it idempotent: a routine re-apply with the pinned tarball already on
  # the host skips the network entirely, so this stays as cheap as the copies
  # above and an apply on a host with no route to the registry still converges.
  ansible.builtin.command:
    argv:
      - "{{ ci_converge_unit_helm_bin }}"
      - pull
      - "{{ ci_converge_unit_arc_chart_registry }}/{{ item }}"
      - --version
      - "{{ ci_converge_unit_arc_chart_version }}"
      - --destination
      - "{{ ci_converge_unit_lib_dir }}/arc/charts"
    creates: >-
      {{ ci_converge_unit_lib_dir }}/arc/charts/{{ item }}-{{ ci_converge_unit_arc_chart_version }}.tgz
  become: true
  loop: "{{ ci_converge_unit_arc_charts }}"
  register: ci_converge_unit_arc_charts_pulled

- name: Copy every ci_pool node's committed profile into the installed tree
  # The boot converge's step 10f reconciles each pool node's FACTORY label from
  # its committed profile (livespec-dev-tooling-izlx4g), and the host carries no
  # checkout — so the WHOLE pool's profiles have to be here, not just this
  # node's. The reconcile runs on the server and decides for every member, which
  # is what makes this the one role that installs more than one node's copy;
  # ../../node_extended_resource installs THIS node's own copy, flat, for its
  # churn-slot timer, and the subdirectory keeps the two from owning one path.
  #
  # 0644: the profiles are committed, non-secret per-node facts the converge
  # READS. They are the same bytes the repository holds, so the boot path and an
  # apply cannot disagree about any node's posture.
  ansible.builtin.copy:
    src: "{{ ci_converge_unit_profiles_dir }}/{{ item }}.env"
    dest: "{{ ci_converge_unit_lib_dir }}/profiles/{{ item }}.env"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ ci_converge_unit_pool_profiles }}"
  register: ci_converge_unit_profiles_copied

- name: Copy the Kueue webhook probe's RBAC manifest
  # The ONE member of the installed set that comes from outside phase2/.
  ansible.builtin.copy:
    src: "{{ ci_converge_unit_observability_dir }}/kueue-webhook-probe-rbac.yaml"
    dest: "{{ ci_converge_unit_lib_dir }}/observability/kueue-webhook-probe-rbac.yaml"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: ci_converge_unit_observability_manifest

- name: Check whether the converge unit is already installed
  # Read BEFORE the task that writes it: under --check the unit file is only
  # would-be written, and an unguarded enable would fail with "Could not find
  # the requested service" and blame the host.
  ansible.builtin.stat:
    path: "{{ ci_converge_unit_unit_dir }}/{{ ci_converge_unit_service }}"
  register: ci_converge_unit_present
  become: true

- name: Install the converge unit
  ansible.builtin.copy:
    src: "{{ ci_converge_unit_phase2_dir }}/reconstruct/{{ ci_converge_unit_service }}"
    dest: "{{ ci_converge_unit_unit_dir }}/{{ ci_converge_unit_service }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd for the converge unit
  register: ci_converge_unit_installed

- name: Publish a changed unit before enabling it
  ansible.builtin.meta: flush_handlers

- name: Enable the converge unit for the next boot
  # Starting remains in the changed-input block below: an unchanged tree must
  # leave this oneshot alone so a second apply reports no change.
  ansible.builtin.systemd_service:
    name: "{{ ci_converge_unit_service }}"
    enabled: true
  become: true
  when: not ansible_check_mode or ci_converge_unit_present.stat.exists
  register: ci_converge_unit_enabled

- name: Read whether the churn-slot reapply unit is in place
  ansible.builtin.service_facts:

- name: Read whether the churn-slot patch script is in place
  ansible.builtin.stat:
    path: "{{ ci_converge_unit_lib_dir }}/{{ ci_converge_unit_reapply_script }}"
  register: ci_converge_unit_reapply_script_present
  become: true

- name: Warn when converge step 1b cannot assert the churn-slot capacity
  # A WARNING and not a failure, exactly as the shell had it: a converge without
  # the reapply unit still builds the cluster stack, and says so itself at step
  # 1b. node_extended_resource owns both of these.
  ansible.builtin.debug:
    msg: >-
      WARN: {{ ci_converge_unit_reapply_service }} is
      '{{ ansible_facts['services'][ci_converge_unit_reapply_service]['status'] | default('absent') }}'
      or {{ ci_converge_unit_lib_dir }}/{{ ci_converge_unit_reapply_script }} is missing —
      converge step 1b cannot assert the churn-slot capacity. Run the
      node_extended_resource role on this host.
  when: >-
    ansible_facts['services'][ci_converge_unit_reapply_service]['status'] | default('absent') != 'enabled'
    or not ci_converge_unit_reapply_script_present.stat.exists

- name: Decide whether the installed CI stack inputs changed
  # Every result here is an artifact consumed by converge-ci-stack.service (or
  # its unit). A normal apply only starts the live converge after at least one
  # changed; this is the idempotence boundary that makes a second unchanged
  # `just ansible-apply ansible/ci-pool.yml` report no change.
  ansible.builtin.set_fact:
    ci_converge_unit_inputs_changed: >-
      {{ ci_converge_unit_named_members.changed
         or ci_converge_unit_glob_members.changed
         or ci_converge_unit_arc_charts_pulled.changed
         or ci_converge_unit_profiles_copied.changed
         or ci_converge_unit_observability_manifest.changed
         or ci_converge_unit_installed.changed
         or ci_converge_unit_enabled.changed }}
  changed_when: false

- name: Run the CI stack converge after changed inputs
  # Never under --check: there is no dry form of applying the stack. On a real
  # apply, this follows the copies and unit enable above, so the unit reads the
  # exact committed tree this run installed.
  when:
    - ci_converge_unit_inputs_changed | bool
    - not ansible_check_mode
  block:
    - name: Start the converge unit
      # A oneshot's start job completes when ExecStart exits, so this normally
      # returns only once the converge has finished. failed_when: false because
      # the outcome is read from the unit's own Result below, which names a
      # timeout or an exit code instead of a bare non-zero from systemctl.
      ansible.builtin.systemd_service:
        name: "{{ ci_converge_unit_service }}"
        state: started
      register: ci_converge_unit_converge_start
      failed_when: false
      become: true

    - name: Wait for the converge to exit
      # Covers a converge already running when the start was asked for (the
      # module then starts nothing) and a start job that returned early. A
      # oneshot without RemainAfterExit ends inactive (or failed), never active.
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - --property=ActiveState
          - --property=Result
          - --property=ExecMainStatus
          - "{{ ci_converge_unit_service }}"
      register: ci_converge_unit_converge_state
      until: >-
        (ci_converge_unit_converge_state.stdout
         | regex_findall('^ActiveState=(.*)$', multiline=True) | first | default(''))
        not in ['activating', 'active', 'deactivating', 'reloading']
      retries: >-
        {{ (ci_converge_unit_converge_wait_seconds | int
            / ci_converge_unit_converge_poll_seconds | int) | round | int }}
      delay: "{{ ci_converge_unit_converge_poll_seconds }}"
      changed_when: false
      failed_when: false
      become: true

    - name: Read the converge's result
      ansible.builtin.set_fact:
        ci_converge_unit_converge_result: >-
          {{ ci_converge_unit_converge_state.stdout
          | regex_findall('^Result=(.*)$', multiline=True) | first | default('') }}
        ci_converge_unit_converge_exit: >-
          {{ ci_converge_unit_converge_state.stdout
          | regex_findall('^ExecMainStatus=(.*)$', multiline=True) | first | default('') }}

    - name: Report the converge's result
      ansible.builtin.debug:
        msg: >-
          {{ ci_converge_unit_service }} ran now on {{ inventory_hostname }}:
          Result={{ ci_converge_unit_converge_result }}
          ExecMainStatus={{ ci_converge_unit_converge_exit }}
          (start: {{ ci_converge_unit_converge_start.msg | default('ok') }})

    - name: Read the failed converge journal tail
      # The systemd result says WHAT failed; the final journal lines say WHY.
      # Capture them in this same apply so failure is actionable without a
      # separate, prohibited by-hand host start or inspection step.
      ansible.builtin.command:
        argv:
          - journalctl
          - --unit
          - "{{ ci_converge_unit_service }}"
          - --lines
          - "{{ ci_converge_unit_journal_tail_lines }}"
          - --no-pager
      register: ci_converge_unit_journal_tail
      changed_when: false
      failed_when: false
      become: true
      when: ci_converge_unit_converge_result != 'success'

    - name: Refuse a converge that did not succeed
      ansible.builtin.assert:
        that:
          - ci_converge_unit_converge_result == 'success'
        fail_msg: >-
          {{ ci_converge_unit_service }} ended with Result={{ ci_converge_unit_converge_result }}
          (ExecMainStatus={{ ci_converge_unit_converge_exit }}) on {{ inventory_hostname }}.
          Journal tail:
          {{ ci_converge_unit_journal_tail.stdout | default('(journal unavailable)') }}
          The stack is partly applied; the converge is idempotent, so fix the cause
          and re-run the committed ci-pool apply.
        success_msg: "{{ ci_converge_unit_service }}: success"
