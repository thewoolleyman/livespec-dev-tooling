---
ci_converge_unit_phase2_dir: "{{ role_path }}/../../../ci-runner/k3s/phase2"
# The ONE file in the installed set that comes from outside phase2/.
ci_converge_unit_observability_dir: "{{ role_path }}/../../../ci-runner/observability"
# The committed phase0 profiles of the WHOLE pool, which the boot converge's
# step 10f reads every node's declared FACTORY_NODE out of
# (livespec-dev-tooling-izlx4g). The same directory ../../node_labels,
# ../../node_taints and ../../k3s_config read; THIS role is the only one that
# installs more than one node's copy, because the reconcile runs on the server
# and decides for every pool member.
#
# RESOLVED FROM THE INVENTORY GROUP, never listed: a machine is bound in
# ansible/inventory/legacy.yml and in host_vars and nowhere else
# (livespec-dev-tooling-prdxxe), so a node added to `ci_pool` travels onto the
# boot path with no edit here — and a hand-written roster would be a node the
# boot reconcile cannot see.
ci_converge_unit_profiles_dir: "{{ role_path }}/../../../ci-runner/k3s/phase0-bare-metal/profiles"
ci_converge_unit_pool_profiles: "{{ groups['ci_pool'] | default([]) | sort }}"
ci_converge_unit_lib_dir: /usr/local/lib/ci-runner-k3s
ci_converge_unit_unit_dir: /etc/systemd/system
ci_converge_unit_service: converge-ci-stack.service
# Every directory install-converge-unit.sh creates, all 0755. Listed rather than
# left to the copies, because --check cannot see past a missing parent.
ci_converge_unit_directories:
  - ""
  - arc
  - arc/charts
  - kueue
  - kueue/core
  - local-path-provisioner
  - warm-cache
  - warm-cache/pypi-proxy
  - warm-cache/registry-mirror
  - crates-proxy
  - sccache
  - observability
  - gates
  - factory
  # The mi-homelab organisation's own factory namespace (bd-ib-yetegc).
  - factory-mi-homelab
  - node-status-credential
  # The pool's committed phase0 profiles, read by the boot converge's step 10f
  # (livespec-dev-tooling-izlx4g). A SUBDIRECTORY and not the lib dir itself:
  # ../../node_extended_resource already installs THIS node's own profile there
  # as `<node>.env`, and one file may have one owner.
  - profiles
# The named members of the installed tree, with the mode each is installed
# under. The three GLOBS the shell uses — arc/values-*.yaml minus the EXAMPLE
# template, kueue/core/*.yaml, kueue/cluster-queue-*.yaml — are resolved at run
# time in tasks/main.yml rather than enumerated here, so a new per-repo queue or
# scale set travels with no edit to this role, exactly as it travels with no
# edit to the installer.
ci_converge_unit_files:
  - src: reconstruct/converge-ci-stack.sh
    dest: converge-ci-stack.sh
    mode: "0755"
  - src: reconstruct/render-sa-kubeconfig.sh
    dest: render-sa-kubeconfig.sh
    mode: "0755"
  # The per-node FACTORY-label reconcile the boot converge's step 10f runs
  # (livespec-dev-tooling-izlx4g). It must be installed BESIDE converge-ci-stack.sh,
  # which resolves it from its own SCRIPT_DIR — and the `profiles` directory
  # below must carry the pool's profiles it reads, or the step warns and the
  # factory label stays lost at every reboot, silently, exactly as it was on
  # 2026-10-16.
  - src: reconstruct/converge-factory-node-labels.sh
    dest: converge-factory-node-labels.sh
    mode: "0755"
  - src: arc/converge-hook-pod-template.sh
    dest: arc/converge-hook-pod-template.sh
    mode: "0755"
  - src: arc/hook-pod-template.yaml
    dest: arc/hook-pod-template.yaml
    mode: "0644"
  - src: kueue/resource-flavor.yaml
    dest: kueue/resource-flavor.yaml
    mode: "0644"
  - src: local-path-provisioner/local-path-provisioner.yaml
    dest: local-path-provisioner/local-path-provisioner.yaml
    mode: "0644"
  - src: warm-cache/converge-warm-cache.sh
    dest: warm-cache/converge-warm-cache.sh
    mode: "0755"
  - src: warm-cache/warm-cache-cronjob.yaml
    dest: warm-cache/warm-cache-cronjob.yaml
    mode: "0644"
  # 0644 and not 0755: this is a ConfigMap PAYLOAD executed inside the populator
  # pod, never on the host.
  - src: warm-cache/warm-cache-populate.sh
    dest: warm-cache/warm-cache-populate.sh
    mode: "0644"
  - src: warm-cache/verify-uv-cache.py
    dest: warm-cache/verify-uv-cache.py
    mode: "0644"
  - src: warm-cache/uv_cache_layout.py
    dest: warm-cache/uv_cache_layout.py
    mode: "0644"
  - src: warm-cache/pypi-proxy/pypi-proxy.yaml
    dest: warm-cache/pypi-proxy/pypi-proxy.yaml
    mode: "0644"
  # The ghcr pull-through registry mirror (livespec-dev-tooling-y1t5): its
  # apply-bearing converge and the manifest that converge applies. converge-ci-stack.sh
  # calls converge-registry-mirror.sh at boot, so it MUST be installed here — its
  # absence is exactly the silent-at-reboot loss the boot-converge reachability
  # test guards.
  - src: warm-cache/registry-mirror/converge-registry-mirror.sh
    dest: warm-cache/registry-mirror/converge-registry-mirror.sh
    mode: "0755"
  - src: warm-cache/registry-mirror/registry-mirror.yaml
    dest: warm-cache/registry-mirror/registry-mirror.yaml
    mode: "0644"
  - src: crates-proxy/converge-crates-proxy.sh
    dest: crates-proxy/converge-crates-proxy.sh
    mode: "0755"
  - src: crates-proxy/crates-proxy.yaml
    dest: crates-proxy/crates-proxy.yaml
    mode: "0644"
  - src: sccache/converge-sccache-redis.sh
    dest: sccache/converge-sccache-redis.sh
    mode: "0755"
  - src: sccache/sccache-redis.yaml
    dest: sccache/sccache-redis.yaml
    mode: "0644"
  - src: gates/gates-rbac.yaml
    dest: gates/gates-rbac.yaml
    mode: "0644"
  # The delegated-gate SOURCE path (R4.S4): the apply-bearing converge that
  # creates the bare mirrors and applies the in-cluster git daemon, the daemon
  # manifest it applies, and the refs sweep the converge and its hourly timer
  # run. converge-ci-stack.sh calls converge-gates-mirror.sh at boot, so all
  # three MUST be installed here (git-daemon.yaml is applied BY the mirror
  # converge, not by converge-ci-stack.sh directly).
  - src: gates/converge-gates-mirror.sh
    dest: gates/converge-gates-mirror.sh
    mode: "0755"
  - src: gates/git-daemon.yaml
    dest: gates/git-daemon.yaml
    mode: "0644"
  - src: gates/prune-gate-refs.sh
    dest: gates/prune-gate-refs.sh
    mode: "0755"
  # Shipped, never applied: the template carries placeholder markers and is not
  # a valid manifest until render-gate-job.sh substitutes them, so the converge
  # must NOT kubectl apply it. The gate client renders and submits; the converge
  # only puts them on the host.
  - src: gates/gate-job-template.yaml
    dest: gates/gate-job-template.yaml
    mode: "0644"
  - src: gates/render-gate-job.sh
    dest: gates/render-gate-job.sh
    mode: "0755"
  # The `factory` namespace's artifacts, applied as a DIRECTORY by the boot
  # converge's step 10e (livespec-dev-tooling-f5e6vl). Both files must be here:
  # the step applies the whole directory, so an installed tree carrying only one
  # of them would apply a Namespace with no quota — and an absent quota raises
  # nothing, it just admits, which is the one bound the maintainer's 2026-10-13
  # ruling leaves on what factory runs take from the CI pool.
  - src: factory/factory-namespace.yaml
    dest: factory/factory-namespace.yaml
    mode: "0644"
  - src: factory/factory-rbac.yaml
    dest: factory/factory-rbac.yaml
    mode: "0644"
  # The mi-homelab organisation's own factory namespace, quota, NetworkPolicy and
  # launcher RBAC (plan kubernetes-sandbox-backend, bd-ib-nmuyjc).
  - src: factory-mi-homelab/factory-mi-homelab.yaml
    dest: factory-mi-homelab/factory-mi-homelab.yaml
    mode: "0644"
  # The per-node node-status RBAC template the boot converge's step 10d re-applies
  # for each AGENT node (livespec-dev-tooling-yj25uj). The converge runs from this
  # installed tree with no checkout present, so a template it reads relative to
  # itself MUST be here: without it every agent's churn-slot timer stays on a
  # credential the post-reboot API server rejects, which is exactly the
  # silent-at-reboot loss the registry-mirror note above records. Shipped, never
  # executed — it carries NODE_NAME_PLACEHOLDER and the converge substitutes it.
  - src: node-status-credential/node-status-patch-rbac.yaml
    dest: node-status-credential/node-status-patch-rbac.yaml
    mode: "0644"
# The two ARC Helm charts the boot converge installs, PULLED HERE at apply time
# instead of fetched from the upstream OCI registry at boot (2026-10-12, item
# livespec-dev-tooling-tb2az6).
#
# WHY APPLY TIME AND NOT BOOT TIME: converge steps 6 and 7 used to `helm upgrade
# --install` straight from ghcr.io, so two pulls from someone else's registry sat
# on the path of an unattended reboot of the fleet's only k3s server. A transient
# failure of either left the cluster with no ARC controller and no listeners —
# no CI for the whole fleet — and the oneshot unit never retried. Pulling here
# moves the network dependency to a moment when an operator is present and the
# failure is loud, and `/usr/local/lib/ci-runner-k3s/` is ordinary disk that
# survives the reboot the tmpfs datastore does not.
#
# WHY PULLED AND NOT VENDORED, unlike the Kueue release manifest beside the
# overlay: these are upstream chart BINARIES. The host is where they are needed
# and the host keeps them; the repository stays the source of truth for the
# VERSION, which is exactly what this pin is.
ci_converge_unit_helm_bin: /usr/local/bin/helm
ci_converge_unit_arc_chart_registry: oci://ghcr.io/actions/actions-runner-controller-charts
# Co-maintained with ARC_CHART_VERSION in reconstruct/converge-ci-stack.sh, which
# resolves the tarball names from it and FAIL-CLOSES on a chart this role never
# pulled. Bump them together.
ci_converge_unit_arc_chart_version: "0.14.2"
ci_converge_unit_arc_charts:
  - gha-runner-scale-set-controller
  - gha-runner-scale-set
# The reapply unit converge step 1b needs. Its absence is a WARNING, not a
# failure: a converge without it still builds the cluster stack and says so.
ci_converge_unit_reapply_service: reapply-node-extended-resource.service
ci_converge_unit_reapply_script: patch-node-churn-capacity.sh
# OFF BY DEFAULT, AND DELIBERATELY SO. Setting this true (`-e
# ci_converge_unit_run_now=true` on ONE apply) makes the role START
# converge-ci-stack.service once the tree is installed and the unit enabled,
# wait for the oneshot to exit and fail unless it succeeded. The converge applies
# the WHOLE cluster stack, so it is opt-in per run rather than something a
# routine converge can reach; left false, the unit runs at the next boot only.
ci_converge_unit_run_now: false
# How long to wait for a converge that is still running when the start returns
# (one already started by boot, or a start job that returned early), probed
# every ci_converge_unit_run_now_poll_seconds.
ci_converge_unit_run_now_wait_seconds: 1800
ci_converge_unit_run_now_poll_seconds: 5
