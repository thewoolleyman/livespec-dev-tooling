---
# rule26_kill_matrix: launch, or remove, one rule-26 mutation kill matrix of
# livespec-orchestrator-beads-fabro as a cluster Job (plan
# fleet-mutation-testing-rule-26, livespec-dev-tooling-fqnbtd;
# ci-runner/k3s/phase2/rule26/README.md).
#
# WHY A ROLE. A hand `kubectl apply` is a hand change to a fleet host, which the
# fleet host guard refuses: a deploy is a git change plus the committed apply,
# run from the control node over committed source. This role is that apply.
# The manifest is rendered on the control node by the committed
# render-kill-matrix-job.sh from the committed template, so the only inputs are
# the playbook variables: the orchestrator SHA, the engine SHA, the worker count,
# the run id and the node.
#
# UNDER --check the diff below still RUNS (check_mode: false; `kubectl diff`
# writes nothing) and reports a pending launch as `changed`, so
# `just ansible-drift ansible/rule26-kill-matrix.yml -e ...` shows it.
#
# A FIRST RUN HAS NO NAMESPACE, and `kubectl diff` of the manifest's namespaced
# objects then fails (rc 2, `namespaces "rule26" not found`; measured from the
# control node 2026-11-10). So the namespace is looked up first: when it is
# absent the launch is drift by definition, the diff is skipped, and the apply
# creates the Namespace, the node's PVC and the Job, in the manifest's order.
#
# REVERT: -e rule26_kill_matrix_state=absent deletes the `rule26` namespace,
# every PVC included. To stop one run and keep the PVCs, pass
# -e rule26_kill_matrix_state=job-absent -e rule26_kill_matrix_run=<id>.

- name: Refuse to run anywhere but the k3s server
  ansible.builtin.assert:
    that:
      - cluster_role == 'server'

- name: Launch the kill-matrix Job
  when: rule26_kill_matrix_state == 'present'
  block:
    - name: Fail unless the run's inputs are full commits, a worker count and a run id
      ansible.builtin.assert:
        that:
          - rule26_kill_matrix_orchestrator_sha is match('^[0-9a-f]{40}$')
          - rule26_kill_matrix_engine_sha is match('^[0-9a-f]{40}$')
          - (rule26_kill_matrix_workers | string) is match('^[1-9][0-9]*$')
          - rule26_kill_matrix_run is match('^[a-z0-9-]{1,40}$')
          - rule26_kill_matrix_node is match('^[a-z0-9]([a-z0-9.-]{0,61}[a-z0-9])?$')
        fail_msg: >-
          pass -e rule26_kill_matrix_orchestrator_sha=<40-hex>
          -e rule26_kill_matrix_engine_sha=<40-hex>
          -e rule26_kill_matrix_run=<lowercase id> -e rule26_kill_matrix_node=<k3s node name> [-e rule26_kill_matrix_workers=N]

    - name: Render the committed Job manifest on the control node
      ansible.builtin.command:
        argv:
          - "{{ rule26_kill_matrix_renderer }}"
          - --orchestrator-sha
          - "{{ rule26_kill_matrix_orchestrator_sha }}"
          - --engine-sha
          - "{{ rule26_kill_matrix_engine_sha }}"
          - --workers
          - "{{ rule26_kill_matrix_workers | string }}"
          - --run
          - "{{ rule26_kill_matrix_run }}"
          - --node
          - "{{ rule26_kill_matrix_node }}"
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false
      register: rule26_kill_matrix_manifest

    - name: Find whether the kill-matrix namespace exists yet
      ansible.builtin.command:
        argv: [kubectl, get, namespace, "{{ rule26_kill_matrix_namespace }}", --ignore-not-found, -o, name]
      environment:
        KUBECONFIG: "{{ rule26_kill_matrix_kubeconfig }}"
      become: true
      check_mode: false
      changed_when: false
      register: rule26_kill_matrix_namespace_found

    - name: Report a first launch, with no namespace yet, as drift
      ansible.builtin.debug:
        msg: "namespace {{ rule26_kill_matrix_namespace }} is absent: the apply creates it, its PVC and the Job"
      when: rule26_kill_matrix_namespace_found.stdout | length == 0
      changed_when: true

    - name: Diff the rendered kill-matrix manifest against the cluster
      ansible.builtin.command:
        argv: [kubectl, diff, -f, "-"]
        stdin: "{{ rule26_kill_matrix_manifest.stdout }}"
      environment:
        KUBECONFIG: "{{ rule26_kill_matrix_kubeconfig }}"
      become: true
      check_mode: false
      register: rule26_kill_matrix_diff
      when: rule26_kill_matrix_namespace_found.stdout | length > 0
      # kubectl diff: 0 = no drift, 1 = drift, anything else = the diff failed.
      changed_when: rule26_kill_matrix_diff.rc == 1
      failed_when: rule26_kill_matrix_diff.rc > 1

    - name: Apply the rendered kill-matrix manifest
      ansible.builtin.command:
        argv: [kubectl, apply, -f, "-"]
        stdin: "{{ rule26_kill_matrix_manifest.stdout }}"
      environment:
        KUBECONFIG: "{{ rule26_kill_matrix_kubeconfig }}"
      become: true
      when: >-
        rule26_kill_matrix_namespace_found.stdout | length == 0
        or rule26_kill_matrix_diff.rc == 1
      changed_when: true

    - name: Read the live kill-matrix Job's name back
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ rule26_kill_matrix_namespace }}"
          - get
          - job
          - "rule26-orchestrator-kill-matrix-{{ rule26_kill_matrix_run }}"
          - -o
          - jsonpath={.metadata.name}
      environment:
        KUBECONFIG: "{{ rule26_kill_matrix_kubeconfig }}"
      become: true
      check_mode: false
      changed_when: false
      register: rule26_kill_matrix_live_job
      when: not ansible_check_mode

    - name: Fail unless the live Job is the one this run rendered
      ansible.builtin.assert:
        that:
          - rule26_kill_matrix_live_job.stdout == 'rule26-orchestrator-kill-matrix-' ~ rule26_kill_matrix_run
        success_msg: "launched job/{{ rule26_kill_matrix_live_job.stdout }} in namespace {{ rule26_kill_matrix_namespace }}"
      when: not ansible_check_mode

- name: Remove the kill-matrix namespace
  when: rule26_kill_matrix_state == 'absent'
  block:
    - name: Look for the kill-matrix namespace
      ansible.builtin.command:
        argv: [kubectl, get, namespace, "{{ rule26_kill_matrix_namespace }}", --ignore-not-found, -o, name]
      environment:
        KUBECONFIG: "{{ rule26_kill_matrix_kubeconfig }}"
      become: true
      check_mode: false
      changed_when: rule26_kill_matrix_existing.stdout | length > 0
      register: rule26_kill_matrix_existing

    - name: Delete the kill-matrix namespace
      ansible.builtin.command:
        argv: [kubectl, delete, namespace, "{{ rule26_kill_matrix_namespace }}", --ignore-not-found]
      environment:
        KUBECONFIG: "{{ rule26_kill_matrix_kubeconfig }}"
      become: true
      when: rule26_kill_matrix_existing.stdout | length > 0
      changed_when: true

# job-absent stops ONE run and keeps everything else: it deletes the Job named
# by rule26_kill_matrix_run (and, through foreground cascade, its pod) and
# leaves the namespace and every PVC (one per node), whose generated mutants/
# tree and run logs a stopped run may still be read for. It lists the PVCs
# before and after and fails unless the two lists match, so it never has to
# know which node the run used. `absent` above deletes the PVCs too.
- name: Remove one kill-matrix Job and keep its namespace and PVC
  when: rule26_kill_matrix_state == 'job-absent'
  block:
    - name: Fail unless a run id names the Job to remove
      ansible.builtin.assert:
        that:
          - rule26_kill_matrix_run is match('^[a-z0-9-]{1,40}$')
        fail_msg: pass -e rule26_kill_matrix_run=<lowercase id> naming the Job to remove

    - name: Look for the run's kill-matrix Job
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ rule26_kill_matrix_namespace }}"
          - get
          - job
          - "rule26-orchestrator-kill-matrix-{{ rule26_kill_matrix_run }}"
          - --ignore-not-found
          - -o
          - name
      environment:
        KUBECONFIG: "{{ rule26_kill_matrix_kubeconfig }}"
      become: true
      check_mode: false
      changed_when: rule26_kill_matrix_existing_job.stdout | length > 0
      register: rule26_kill_matrix_existing_job

    - name: List the namespace's PVCs before the delete
      ansible.builtin.command:
        argv: [kubectl, -n, "{{ rule26_kill_matrix_namespace }}", get, pvc, -o, name]
      environment:
        KUBECONFIG: "{{ rule26_kill_matrix_kubeconfig }}"
      become: true
      check_mode: false
      changed_when: false
      register: rule26_kill_matrix_pvcs_before

    - name: Delete the run's kill-matrix Job and its pod
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ rule26_kill_matrix_namespace }}"
          - delete
          - job
          - "rule26-orchestrator-kill-matrix-{{ rule26_kill_matrix_run }}"
          - --ignore-not-found
          - --cascade=foreground
          - --wait=true
          - --timeout=300s
      environment:
        KUBECONFIG: "{{ rule26_kill_matrix_kubeconfig }}"
      become: true
      when: rule26_kill_matrix_existing_job.stdout | length > 0
      changed_when: true

    - name: Read back the run's Job
      ansible.builtin.command:
        argv:
          - kubectl
          - -n
          - "{{ rule26_kill_matrix_namespace }}"
          - get
          - "job/rule26-orchestrator-kill-matrix-{{ rule26_kill_matrix_run }}"
          - --ignore-not-found
          - -o
          - name
      environment:
        KUBECONFIG: "{{ rule26_kill_matrix_kubeconfig }}"
      become: true
      check_mode: false
      changed_when: false
      register: rule26_kill_matrix_after_job_absent
      when: not ansible_check_mode

    - name: List the namespace's PVCs after the delete
      ansible.builtin.command:
        argv: [kubectl, -n, "{{ rule26_kill_matrix_namespace }}", get, pvc, -o, name]
      environment:
        KUBECONFIG: "{{ rule26_kill_matrix_kubeconfig }}"
      become: true
      check_mode: false
      changed_when: false
      register: rule26_kill_matrix_pvcs_after
      when: not ansible_check_mode

    - name: Fail unless the Job is gone and every PVC is kept
      ansible.builtin.assert:
        that:
          - rule26_kill_matrix_after_job_absent.stdout | length == 0
          - rule26_kill_matrix_pvcs_after.stdout_lines == rule26_kill_matrix_pvcs_before.stdout_lines
        success_msg: >-
          removed job/rule26-orchestrator-kill-matrix-{{ rule26_kill_matrix_run }};
          kept {{ rule26_kill_matrix_pvcs_after.stdout_lines | join(', ') }}
      when: not ansible_check_mode
