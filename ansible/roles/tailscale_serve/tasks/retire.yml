---
# tailscale_serve — retire: turn off each tailnet serve port this host names in
# `tailscale_serve_retired_ports`, and nothing else.
#
# WHY A SEPARATE PATH. tasks/main.yml publishes and is additive by design: it
# never turns a mapping off, because hand-made mappings (vps's 8010 and 8443)
# depend on it. A port that has outlived its service is retired only by naming
# it here, per host, so an undeclared mapping is never touched. Added for
# hp-xubuntu (bd-ib-iud52v, the legacy Fabro carrier retirement): it left the
# docker factory role on 2026-11-02, but tailscaled still served its hand-made
# :32276, :32277 and :32278 with no Fabro server behind them, and the fleet host
# guard refuses `tailscale serve ... off` by hand.
#
# A port that is also a declared mapping was already refused by the first task
# of tasks/main.yml, before the publish path ran.
#
# Under --check the status read still runs, so a drift report names each
# retired port the node serves; the off command itself is reported, not run.

- name: Read this node's tailscale serve configuration before retiring ports
  ansible.builtin.command:
    argv: [tailscale, serve, status]
  become: true
  timeout: 30
  register: tailscale_serve_retire_status
  changed_when: false
  check_mode: false

- name: Name each retired port's disposition in the run output
  ansible.builtin.debug:
    msg: >-
      :{{ item }}
      {{ 'is served and will be turned off'
         if (':' ~ item ~ ' ') in (tailscale_serve_retire_status.stdout | default(''))
         else 'is not served; nothing to do' }}
  loop: "{{ tailscale_serve_retired_ports }}"
  loop_control:
    label: ":{{ item }}"

- name: Turn off each retired port this node still serves
  # A port counts as served when the status names it, as `tailscale serve
  # status` renders one: `https://<host>.<tailnet>.ts.net:<port> (tailnet only)`.
  # A port the node no longer serves is left alone, so a re-run changes nothing.
  ansible.builtin.command:
    argv:
      - tailscale
      - serve
      - "--https={{ item }}"
      - "off"
  become: true
  timeout: 30
  loop: "{{ tailscale_serve_retired_ports }}"
  loop_control:
    label: ":{{ item }}"
  when: (':' ~ item ~ ' ') in (tailscale_serve_retire_status.stdout | default(''))
  changed_when: true
