---
# sandbox_driver_kubernetes — the Kubernetes sandbox-driver plugin on a
# Fabro-server host, and the upstream CLI that drives it.
#
# Work-item bd-ib-nmuyjc.3 (livespec-orchestrator-beads-fabro plan
# kubernetes-sandbox-backend, epic bd-ib-nmuyjc). The plugin is
# thewoolleyman/sandbox-driver-kubernetes; it runs BESIDE the Fabro worker on
# this host and reaches the cluster through the `factory` namespace credential
# the factory_kubeconfig role delivers, so this role is ordered after it.
#
# BOTH BINARIES ARE PINNED BY A COMMITTED DIGEST, not by a checksum fetched
# beside the download: a digest fetched from the same release proves only that
# the download is internally consistent, which a replaced release asset also
# is. The plugin's digest is ALSO written into the CLI's profile, because the
# sandbox-driver protocol refuses to launch a plugin whose bytes do not match
# the profile's `sha256` — so the host verifies the plugin at every launch,
# not only at install.
#
# NO MACHINE IS NAMED HERE (livespec-dev-tooling-prdxxe). The account and home
# come from fabro_server's own host_vars, which already state them for every
# sandbox host.

# The plugin release, and the digest of its x86_64 Linux asset. v0.4.0 reports
# the API server and namespace as its resource identity, which a host on the
# Petri #122 stack requires before it creates or recovers a sandbox (measured
# 2026-10-23 on gmktec: v0.3.0 failed every acquire with "the kubernetes
# provider reports no verified resource identity"). v0.4.1 stages each
# command's environment, program and arguments through the exec stdin stream,
# so the exec request URL carries only a fixed wrapper: under v0.4.0 a prepare
# step with a 48 KB inline payload built an ~80 KB URL that the API path
# refused, and credential values travelled in that URL (measured 2026-10-23 on
# gmktec, run 01M5N2W7TNBC; bd-ib-xwqn23). v0.5.0 adds `topology_spread`, which the
# rendered config below now carries; earlier releases reject it as an unknown field.
# v0.6.0 reports the pod's node as K8S_NODE_NAME in sandbox/environment, which
# Fabro's run_turn spans name as k8s.node.name (bd-ib-motuct). v0.7.0 retries a
# request whose API connection is refused, for up to two minutes, so a k3s server
# restart no longer fails every live run's next exec (bd-ib-cakk3c).
#
# PINNED BACK TO v0.5.0 (2026-11-03), the release INSTALLED on gmktec and the one
# every live Fabro instance's settings.toml pins (d93437f0). Fabro verifies the
# plugin's sha256 against the instance's pin at EVERY plugin launch (each scope
# acquire, in every run worker), not only at server start. So replacing this
# binary under a server pinned to another digest fails every launch: measured
# 09:01:10-09:14:51Z, when a v0.7.0 apply killed six runs on main
# ("invalid spec: sha256: checksum mismatch ... pinned d93437f0, found 93ca024d").
# v0.6.0 and v0.7.0 return only through a per-instance versioned install path
# whose binary and pin change together at zero runs; do not bump this default
# alone.
sandbox_driver_kubernetes_version: v0.5.0
sandbox_driver_kubernetes_sha256: d93437f0bcb495e13a3373a4d2578cc0b2dba2c39c1ad5f3fdcf801ce0788b6e
# The upstream CLI (`lithos-sandbox`, crate sandbox-driver-cli), built by the
# plugin's release workflow at the sandbox-driver revision the plugin pins, so
# the CLI and the plugin speak the same protocol revision.
sandbox_driver_kubernetes_cli_rev: 90b0d825767105d4b42e59fdbd116c4d66b87d83
sandbox_driver_kubernetes_cli_sha256: 5c17f37394b858e48cc2a8a4e9ae5744d1a4dbb455509fd3575cb57191464c98
# The lifecycle proof driver, released beside the plugin: it holds one plugin
# process across a control-plane reboot or a node going NotReady, which a
# per-command CLI cannot (bd-ib-ad6dby).
sandbox_driver_kubernetes_proof_sha256: 592288b3524d5e61f5997070cda4418160f3783071045dc1498e24a4e0de0b71
sandbox_driver_kubernetes_release_base_url: >-
  https://github.com/thewoolleyman/sandbox-driver-kubernetes/releases/download
sandbox_driver_kubernetes_release_url: >-
  {{ sandbox_driver_kubernetes_release_base_url }}/{{ sandbox_driver_kubernetes_version }}
sandbox_driver_kubernetes_bin_dir: /usr/local/bin

# Further plugin releases, each installed at its OWN versioned path,
# `<bin_dir>/sandbox-driver-kubernetes-<version>`, beside the shared binary
# above. This is the per-instance versioned install path the 2026-11-03 pin-back
# requires (SPECIFICATION/non-functional-requirements.md, "A plugin binary and
# every pin on it agree": a rollout that needs instances on different versions
# gives each version its own install path). An instance moves to a release by
# naming its path and digest in its own sandbox_providers, at zero runs. No
# other instance's binary or pin changes. Each entry is
# `{version: vX.Y.Z, sha256: <the release asset's digest>}`. The role refuses an
# apply in which any fabro_server_instances provider pins a versioned path with
# a digest other than the one declared here, before it downloads anything.
sandbox_driver_kubernetes_versioned_releases: []
# Derived from the list above: the versioned install path of each release, the
# digest the role installs there, and the pattern that marks a provider path as
# versioned. Not host variables.
sandbox_driver_kubernetes_versioned_digests: >-
  {{ dict(sandbox_driver_kubernetes_versioned_releases
          | map(attribute='version')
          | map('regex_replace', '^', sandbox_driver_kubernetes_bin_dir ~ '/sandbox-driver-kubernetes-')
          | zip(sandbox_driver_kubernetes_versioned_releases | map(attribute='sha256'))) }}
sandbox_driver_kubernetes_versioned_path_pattern: >-
  {{ '^' ~ sandbox_driver_kubernetes_bin_dir ~ '/sandbox-driver-kubernetes-v' }}

# The account the plugin runs as (the Fabro service account) and the homes
# whose configuration it reads. The plugin starts from a scrubbed environment
# and reads $HOME/.config/sandbox-driver-kubernetes/config.toml, so every HOME
# a launcher runs under needs its own copy. Today that is the service
# account's home, which is also the HOME of an operator's ssh session; a Fabro
# instance with its own `home_env` adds its home here when it starts launching
# the plugin.
sandbox_driver_kubernetes_user: "{{ fabro_server_host_user }}"
sandbox_driver_kubernetes_group: "{{ fabro_server_host_group }}"
sandbox_driver_kubernetes_config_homes:
  - "{{ fabro_server_host_home }}"

# The cluster facts, from the factory delivery of plan factory-worker-nodes-gitops
# (livespec-sqvj7p): the namespace and credential of livespec-dev-tooling-sqobqv,
# the RBAC of -pvykv7, and the workspace root of -due2h6.
sandbox_driver_kubernetes_kubeconfig: "{{ factory_kubeconfig_dest | default('/etc/ci-runner/factory.kubeconfig') }}"
# Absolute, because a launcher may pass the plugin no PATH: the sandbox-driver
# protocol clears the plugin's environment and forwards only what it is told.
sandbox_driver_kubernetes_refresh_command:
  - /usr/bin/sudo
  - -n
  - "{{ factory_kubeconfig_bin_dir | default('/usr/local/bin') }}/refresh-factory-kubeconfig"
sandbox_driver_kubernetes_namespace: factory
sandbox_driver_kubernetes_service_account: sandbox-launcher
# The factory class's architecture, read from the one declared per-class list
# (ci-runner/k3s/phase2/workload-arch.conf, the `factory python-agent` line;
# livespec-dev-tooling-ko26ez.6): this provider's python-agent image publishes
# that architecture only, so no sandbox lands on a node of another. A
# per-architecture instance (an arm64 worker's) sets its own value.
sandbox_driver_kubernetes_workload_arch_conf: "{{ role_path }}/../../../ci-runner/k3s/phase2/workload-arch.conf"
sandbox_driver_kubernetes_arch: >-
  {{ (lookup('ansible.builtin.file', sandbox_driver_kubernetes_workload_arch_conf).splitlines()
      | select('match', 'factory python-agent ') | first).split()[2] }}
sandbox_driver_kubernetes_node_selector:
  ci-runner.io/factory: "true"
  kubernetes.io/arch: "{{ sandbox_driver_kubernetes_arch }}"
  # The TEMPORARY fixed factory-vs-CI CPU share (maintainer ruling 2026-11-08): a
  # new sandbox goes only to a node whose factory_pod_budget has room. The
  # factory_budget_reconciler on the k3s server sets this label. ORDER: apply
  # ci-pool.yml --tags factory_budget_admission and confirm that every factory node
  # carries the label BEFORE this file renders it. No Fabro restart is needed: each
  # run spawns its own plugin process, which reads this config at launch, so runs
  # launched after the render are gated
  # (ci-runner/k3s/phase2/factory-budget-admission/README.md). REVERT: delete
  # this entry and apply again; later runs place without the gate.
  ci-runner.io/factory-admit: "true"
# A factory node may carry node-role/ci=factory:NoSchedule; on an untainted
# node the toleration is harmless.
#
# The two NoExecute entries keep a sandbox pod bound to its node through a node
# outage of any length. Without them the DefaultTolerationSeconds admission
# plugin gives every pod not-ready and unreachable tolerations of 300 s, so an
# outage longer than five minutes evicts the pod and the run loses a sandbox
# whose workspace still sits on that node's hostPath. The plugin renders a
# toleration without tolerationSeconds, which Kubernetes reads as "tolerate
# forever"; a node that never returns is bounded by the run's own stage
# timeouts instead. Measured on gmktec 2026-10-17 (bd-ib-ad6dby): through a
# NotReady window the plugin reported the sandbox unavailable but not lost, no
# replacement pod appeared, and exec resumed on the same pod with its marker.
sandbox_driver_kubernetes_tolerations:
  - key: node-role/ci
    operator: Equal
    value: factory
    effect: NoSchedule
  - key: node.kubernetes.io/not-ready
    operator: Exists
    effect: NoExecute
  - key: node.kubernetes.io/unreachable
    operator: Exists
    effect: NoExecute
# Spread each sandbox's first pod across the factory nodes. Without it the
# default scheduler's resource scoring stacked every sandbox on one node: on
# 2026-11-02, 3 of 3 new pods went to the same node while two other factory
# nodes stood idle (orchestrator bd-ib-kogktm). ScheduleAnyway is a
# scoring preference, so it never leaves a pod Pending and never overrides a
# filter: a node a filter excludes still gets no pod, which is how a hard-filter
# defect would show after this lands. Needs plugin v0.5.0 or later, which is
# the first release that knows the field (the plugin rejects unknown fields).
sandbox_driver_kubernetes_topology_spread:
  - topology_key: kubernetes.io/hostname
    max_skew: 1
    when_unsatisfiable: ScheduleAnyway
sandbox_driver_kubernetes_workspace_root: /srv/factory-workspaces
# The node-loaded AppArmor profile every sandbox pod runs under. On these
# kernels an exec'd process is stacked as `cri-containerd.apparmor.d//&unconfined`
# and the runtime default denies signals between a sandbox's own processes, so
# exec could neither finish nor stop. ci-runner-workflow is that default with the
# signal and ptrace peers widened to the stacked label, and the apparmor_profile
# role loads it on every ci_pool node.
sandbox_driver_kubernetes_apparmor_profile: ci-runner-workflow
# The livespec.dispatch.factory label on every sandbox pod.
sandbox_driver_kubernetes_factory: "{{ inventory_hostname_short }}"
