---
# sandbox_driver_kubernetes — install the pinned plugin and CLI, and render
# their configuration for every HOME a launcher runs under. See
# defaults/main.yml for what each value is and where it comes from.

- name: Install the pinned binaries
  # get_url verifies the committed digest before it moves the file into place,
  # so a mismatched download never lands at the destination.
  ansible.builtin.get_url:
    url: "{{ sandbox_driver_kubernetes_release_url }}/{{ item.asset }}"
    checksum: "sha256:{{ item.sha256 }}"
    dest: "{{ sandbox_driver_kubernetes_bin_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - name: sandbox-driver-kubernetes
      asset: "sandbox-driver-kubernetes-{{ sandbox_driver_kubernetes_version }}-x86_64-unknown-linux-gnu"
      sha256: "{{ sandbox_driver_kubernetes_sha256 }}"
    - name: sandbox-driver-kubernetes-proof
      asset: "sandbox-driver-kubernetes-proof-{{ sandbox_driver_kubernetes_version }}-x86_64-unknown-linux-gnu"
      sha256: "{{ sandbox_driver_kubernetes_proof_sha256 }}"
    - name: lithos-sandbox
      asset: "lithos-sandbox-{{ sandbox_driver_kubernetes_cli_rev[:12] }}-x86_64-unknown-linux-gnu"
      sha256: "{{ sandbox_driver_kubernetes_cli_sha256 }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item.0 }}/.config/{{ item.1 }}"
    state: directory
    owner: "{{ sandbox_driver_kubernetes_user }}"
    group: "{{ sandbox_driver_kubernetes_group }}"
    mode: "0755"
  become: true
  loop: "{{ sandbox_driver_kubernetes_config_homes | product(['sandbox-driver-kubernetes', 'sandbox-driver']) | list }}"

- name: Render the plugin configuration
  # 0644: it names a namespace, a path and a label, never a secret. The
  # credential it points at is the factory_kubeconfig role's 0640 file.
  ansible.builtin.template:
    src: plugin-config.toml.j2
    dest: "{{ item }}/.config/sandbox-driver-kubernetes/config.toml"
    owner: "{{ sandbox_driver_kubernetes_user }}"
    group: "{{ sandbox_driver_kubernetes_group }}"
    mode: "0644"
  become: true
  loop: "{{ sandbox_driver_kubernetes_config_homes }}"

- name: Render the CLI's Kubernetes profile
  ansible.builtin.template:
    src: cli-config.toml.j2
    dest: "{{ item }}/.config/sandbox-driver/config.toml"
    owner: "{{ sandbox_driver_kubernetes_user }}"
    group: "{{ sandbox_driver_kubernetes_group }}"
    mode: "0644"
  become: true
  loop: "{{ sandbox_driver_kubernetes_config_homes }}"
