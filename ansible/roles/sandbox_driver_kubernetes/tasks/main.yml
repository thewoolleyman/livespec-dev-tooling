---
# sandbox_driver_kubernetes — install the pinned plugin and CLI, and render
# their configuration for every HOME a launcher runs under. See
# defaults/main.yml for what each value is and where it comes from.

- name: Initialise the conflicting Fabro sandbox-provider pins
  # `fabro_server_instances[].sandbox_providers.<kind>.{path,sha256}` is the
  # one declared pin surface. Gather all conflicts before asserting so an
  # operator sees every server that would reject the shared plugin binary.
  ansible.builtin.set_fact:
    sandbox_driver_kubernetes_pin_conflicts: []

- name: Collect Fabro sandbox-provider pins that conflict with this plugin
  ansible.builtin.include_tasks: collect_pin_conflicts.yml
  loop: "{{ fabro_server_instances | default([]) }}"
  loop_control:
    loop_var: sandbox_driver_kubernetes_pin_instance
    label: "{{ sandbox_driver_kubernetes_pin_instance.unit_name | default('unnamed instance') }}"

- name: Refuse a plugin digest that conflicts with a Fabro instance pin
  ansible.builtin.assert:
    that:
      - sandbox_driver_kubernetes_pin_conflicts | length == 0
    fail_msg: >-
      Refusing to install sandbox-driver-kubernetes sha256
      {{ sandbox_driver_kubernetes_sha256 }} at
      {{ sandbox_driver_kubernetes_bin_dir }}/sandbox-driver-kubernetes: it
      disagrees with Fabro instance pins:
      {% for conflict in sandbox_driver_kubernetes_pin_conflicts %}
      {{ conflict.instance }} (provider {{ conflict.provider }}) pins
      {{ conflict.declared_sha256 }}; installed digest would be
      {{ sandbox_driver_kubernetes_sha256 }}.
      {% endfor %}
      No binary was downloaded, moved, or replaced.
    success_msg: every Fabro instance pin for this plugin path matches the installed digest

- name: Install the pinned binaries
  # get_url verifies the committed digest before it moves the file into place,
  # so a mismatched download never lands at the destination.
  ansible.builtin.get_url:
    url: "{{ sandbox_driver_kubernetes_release_url }}/{{ item.asset }}"
    checksum: "sha256:{{ item.sha256 }}"
    dest: "{{ sandbox_driver_kubernetes_bin_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - name: sandbox-driver-kubernetes
      asset: "sandbox-driver-kubernetes-{{ sandbox_driver_kubernetes_version }}-x86_64-unknown-linux-gnu"
      sha256: "{{ sandbox_driver_kubernetes_sha256 }}"
    - name: sandbox-driver-kubernetes-proof
      asset: "sandbox-driver-kubernetes-proof-{{ sandbox_driver_kubernetes_version }}-x86_64-unknown-linux-gnu"
      sha256: "{{ sandbox_driver_kubernetes_proof_sha256 }}"
    - name: lithos-sandbox
      asset: "lithos-sandbox-{{ sandbox_driver_kubernetes_cli_rev[:12] }}-x86_64-unknown-linux-gnu"
      sha256: "{{ sandbox_driver_kubernetes_cli_sha256 }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item.0 }}/.config/{{ item.1 }}"
    state: directory
    owner: "{{ sandbox_driver_kubernetes_user }}"
    group: "{{ sandbox_driver_kubernetes_group }}"
    mode: "0755"
  become: true
  loop: "{{ sandbox_driver_kubernetes_config_homes | product(['sandbox-driver-kubernetes', 'sandbox-driver']) | list }}"

- name: Render the plugin configuration
  # 0644: it names a namespace, a path and a label, never a secret. The
  # credential it points at is the factory_kubeconfig role's 0640 file.
  ansible.builtin.template:
    src: plugin-config.toml.j2
    dest: "{{ item }}/.config/sandbox-driver-kubernetes/config.toml"
    owner: "{{ sandbox_driver_kubernetes_user }}"
    group: "{{ sandbox_driver_kubernetes_group }}"
    mode: "0644"
  become: true
  loop: "{{ sandbox_driver_kubernetes_config_homes }}"

- name: Render the CLI's Kubernetes profile
  ansible.builtin.template:
    src: cli-config.toml.j2
    dest: "{{ item }}/.config/sandbox-driver/config.toml"
    owner: "{{ sandbox_driver_kubernetes_user }}"
    group: "{{ sandbox_driver_kubernetes_group }}"
    mode: "0644"
  become: true
  loop: "{{ sandbox_driver_kubernetes_config_homes }}"

- name: Report each live Fabro sandbox-provider pin against its installed binary
  # This read-only include runs under --check, which makes ansible-drift show a
  # live settings.toml pin that no longer agrees with the binary it launches.
  ansible.builtin.include_tasks: report_live_pin_drift.yml
  loop: "{{ fabro_server_instances | default([]) }}"
  loop_control:
    loop_var: sandbox_driver_kubernetes_drift_instance
    label: "{{ sandbox_driver_kubernetes_drift_instance.unit_name | default('unnamed instance') }}"
