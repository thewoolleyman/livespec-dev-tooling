---
# sandbox_driver_kubernetes — install the pinned plugin and CLI, and render
# their configuration for every HOME a launcher runs under. See
# defaults/main.yml for what each value is and where it comes from.

- name: Start the list of pins on a versioned plugin path
  ansible.builtin.set_fact:
    sandbox_driver_kubernetes_versioned_pins: []

- name: Collect every Fabro instance's pin on a versioned plugin path
  ansible.builtin.set_fact:
    sandbox_driver_kubernetes_versioned_pins: >-
      {{ sandbox_driver_kubernetes_versioned_pins
         + (item.sandbox_providers | default({}) | dict2items
            | map(attribute='value')
            | selectattr('path', 'defined')
            | selectattr('path', 'match', sandbox_driver_kubernetes_versioned_path_pattern)
            | map('combine', {'unit_name': item.unit_name})
            | list) }}
  loop: "{{ fabro_server_instances | default([]) }}"
  loop_control:
    label: "{{ item.unit_name }}"

- name: Refuse a versioned plugin pin that disagrees with its declared release
  # Before any download. A provider that points at a versioned install path
  # must pin exactly the digest the role installs there, or Fabro refuses its
  # every plugin launch (the 2026-11-03 pin-back, c6791224). The shared
  # path's pins are guarded by test_sandbox_driver_kubernetes_node_name.py.
  ansible.builtin.assert:
    that:
      - item.sha256 == (sandbox_driver_kubernetes_versioned_digests[item.path] | default(''))
    fail_msg: >-
      {{ item.unit_name }} pins {{ item.path }} at {{ item.sha256 }}, but
      sandbox_driver_kubernetes_versioned_releases installs
      {{ sandbox_driver_kubernetes_versioned_digests[item.path] | default('no release at that path') }}
      there. Change the binary and every pin on it together.
    quiet: true
  loop: "{{ sandbox_driver_kubernetes_versioned_pins }}"
  loop_control:
    label: "{{ item.unit_name }} {{ item.path }}"

- name: Install the pinned binaries
  # get_url verifies the committed digest before it moves the file into place,
  # so a mismatched download never lands at the destination.
  ansible.builtin.get_url:
    url: "{{ sandbox_driver_kubernetes_release_url }}/{{ item.asset }}"
    checksum: "sha256:{{ item.sha256 }}"
    dest: "{{ sandbox_driver_kubernetes_bin_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  loop:
    - name: sandbox-driver-kubernetes
      asset: "sandbox-driver-kubernetes-{{ sandbox_driver_kubernetes_version }}-x86_64-unknown-linux-gnu"
      sha256: "{{ sandbox_driver_kubernetes_sha256 }}"
    - name: sandbox-driver-kubernetes-proof
      asset: "sandbox-driver-kubernetes-proof-{{ sandbox_driver_kubernetes_version }}-x86_64-unknown-linux-gnu"
      sha256: "{{ sandbox_driver_kubernetes_proof_sha256 }}"
    - name: lithos-sandbox
      asset: "lithos-sandbox-{{ sandbox_driver_kubernetes_cli_rev[:12] }}-x86_64-unknown-linux-gnu"
      sha256: "{{ sandbox_driver_kubernetes_cli_sha256 }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install each versioned plugin release at its own path
  # A new file per version: the shared binary above, and every instance pinned
  # to it, are untouched.
  ansible.builtin.get_url:
    url: >-
      {{ sandbox_driver_kubernetes_release_base_url }}/{{ item.version
      }}/sandbox-driver-kubernetes-{{ item.version }}-x86_64-unknown-linux-gnu
    checksum: "sha256:{{ item.sha256 }}"
    dest: "{{ sandbox_driver_kubernetes_bin_dir }}/sandbox-driver-kubernetes-{{ item.version }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  loop: "{{ sandbox_driver_kubernetes_versioned_releases }}"
  loop_control:
    label: "sandbox-driver-kubernetes-{{ item.version }}"

- name: Create the configuration directories
  ansible.builtin.file:
    path: "{{ item.0 }}/.config/{{ item.1 }}"
    state: directory
    owner: "{{ sandbox_driver_kubernetes_user }}"
    group: "{{ sandbox_driver_kubernetes_group }}"
    mode: "0755"
  become: true
  loop: "{{ sandbox_driver_kubernetes_config_homes | product(['sandbox-driver-kubernetes', 'sandbox-driver']) | list }}"

- name: Render the plugin configuration
  # 0644: it names a namespace, a path and a label, never a secret. The
  # credential it points at is the factory_kubeconfig role's 0640 file.
  ansible.builtin.template:
    src: plugin-config.toml.j2
    dest: "{{ item }}/.config/sandbox-driver-kubernetes/config.toml"
    owner: "{{ sandbox_driver_kubernetes_user }}"
    group: "{{ sandbox_driver_kubernetes_group }}"
    mode: "0644"
  become: true
  loop: "{{ sandbox_driver_kubernetes_config_homes }}"

- name: Render the CLI's Kubernetes profile
  ansible.builtin.template:
    src: cli-config.toml.j2
    dest: "{{ item }}/.config/sandbox-driver/config.toml"
    owner: "{{ sandbox_driver_kubernetes_user }}"
    group: "{{ sandbox_driver_kubernetes_group }}"
    mode: "0644"
  become: true
  loop: "{{ sandbox_driver_kubernetes_config_homes }}"
