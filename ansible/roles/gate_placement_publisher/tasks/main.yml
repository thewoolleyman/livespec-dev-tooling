---
# gate_placement_publisher: install publish-gate-lane-readings.sh and its
# 30-second timer on this pool node (work item livespec-dev-tooling-gvo7fa).
#
# EVERY ci_pool NODE RUNS IT, with no `when:`: the reconciler derives its lanes
# from the live gates-cq, so a node that joins the pool and gets its gates lane is
# covered by publishing here, with no edit to the mechanism.
#
# NO NEW CREDENTIAL. The script writes a status condition through the
# `nodes/status` subresource, with the scoped node-status kubeconfig that
# node_status_credential delivers on an agent (get+patch on this one node) and
# with k3s's admin kubeconfig on the server. That is why this role runs after
# node_status_credential in ci-pool.yml.

- name: Read this node's committed phase0 profile
  ansible.builtin.set_fact:
    gate_placement_publisher_profile_node: >-
      {{ _gpp_profile_text | regex_findall('^NODE_NAME=(.*)$', multiline=True) | first | default('') }}
    gate_placement_publisher_profile_role: >-
      {{ _gpp_profile_text | regex_findall('^CLUSTER_ROLE=(.*)$', multiline=True) | first | default('') }}
  vars:
    _gpp_profile_text: "{{ lookup('ansible.builtin.file', gate_placement_publisher_profile) }}"

- name: Refuse a profile that does not name this host
  ansible.builtin.assert:
    that:
      - gate_placement_publisher_profile_node == inventory_hostname
      - gate_placement_publisher_profile_role in ['server', 'agent']
    fail_msg: >-
      profile {{ gate_placement_publisher_profile }} must name this host
      (NODE_NAME={{ gate_placement_publisher_profile_node }} vs {{ inventory_hostname }})
      and carry CLUSTER_ROLE server or agent (got '{{ gate_placement_publisher_profile_role }}')

- name: Select this node's k3s unit and its installed profile copy path
  ansible.builtin.set_fact:
    gate_placement_publisher_k3s_unit: >-
      {{ 'k3s.service' if gate_placement_publisher_profile_role == 'server' else 'k3s-agent.service' }}
    gate_placement_publisher_installed_profile: >-
      {{ gate_placement_publisher_lib_dir }}/{{ inventory_hostname }}.gate-placement-publisher.env

- name: Create the pool library and state directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ gate_placement_publisher_lib_dir }}"
    - "{{ gate_placement_publisher_state_dir }}"
  become: true

- name: Install the gate placement publisher script
  ansible.builtin.copy:
    src: "{{ gate_placement_publisher_phase2_dir }}/gate-placement/{{ gate_placement_publisher_script }}"
    dest: "{{ gate_placement_publisher_lib_dir }}/{{ gate_placement_publisher_script }}"
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install this node's profile copy for the publisher
  ansible.builtin.copy:
    src: "{{ gate_placement_publisher_profile }}"
    dest: "{{ gate_placement_publisher_installed_profile }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Check whether the publisher service is already installed
  ansible.builtin.stat:
    path: "{{ gate_placement_publisher_unit_dir }}/{{ gate_placement_publisher_service }}"
  register: gate_placement_publisher_service_present
  become: true

- name: Render the publisher service from the committed unit
  ansible.builtin.set_fact:
    gate_placement_publisher_rendered_unit: >-
      {{ lookup('ansible.builtin.file',
      gate_placement_publisher_phase2_dir ~ '/gate-placement/'
      ~ gate_placement_publisher_service)
      | replace('K3S_UNIT_PLACEHOLDER', gate_placement_publisher_k3s_unit)
      | replace('PROFILE_PATH_PLACEHOLDER', gate_placement_publisher_installed_profile) }}

- name: Refuse a rendered unit that still carries a placeholder
  ansible.builtin.assert:
    that:
      - "'_PLACEHOLDER' not in gate_placement_publisher_rendered_unit"
    fail_msg: the rendered {{ gate_placement_publisher_service }} still contains a _PLACEHOLDER token

- name: Install the publisher service
  ansible.builtin.copy:
    content: |
      {{ gate_placement_publisher_rendered_unit }}
    dest: "{{ gate_placement_publisher_unit_dir }}/{{ gate_placement_publisher_service }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd for the gate placement publisher

- name: Install the publisher timer
  ansible.builtin.copy:
    src: "{{ gate_placement_publisher_phase2_dir }}/gate-placement/{{ gate_placement_publisher_timer }}"
    dest: "{{ gate_placement_publisher_unit_dir }}/{{ gate_placement_publisher_timer }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd for the gate placement publisher

- name: Publish a changed unit before arming it
  ansible.builtin.meta: flush_handlers

- name: Enable and start the publisher timer
  ansible.builtin.systemd_service:
    name: "{{ gate_placement_publisher_timer }}"
    enabled: true
    state: started
  become: true
  when: not ansible_check_mode or gate_placement_publisher_service_present.stat.exists
