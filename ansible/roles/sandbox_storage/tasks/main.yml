---
# sandbox_storage — a Fabro factory host's second disk: a swap partition the
# size of the host's RAM, an ext4 filesystem carrying the docker and containerd
# stores, the two bind mounts that put those stores where the daemons look,
# and the drop-ins that refuse to start either daemon on an empty target.
#
# Three things this role NEVER does on a routine converge, each gated behind
# its own opt-in extra var (defaults/main.yml): it never formats a disk, it
# never stops the container daemons, and it never lays a bind over a directory
# that holds content the new disk does not carry. storage_layout is the model
# for all three refusals, and for the LABEL-keyed, lineinfile-managed fstab.
#
# EVERY MOUNT IS VERIFIED BY DEVICE, NOT BY PRESENCE. The reused mount helper
# accepts whatever is mounted at a target, so after each mount this role reads
# `findmnt` and refuses a target served from anything but the partition it
# resolved — a preseed onto a stray bind from / would otherwise fill the root
# disk and report success (Codex review, 2026-10-12).
#
# WHY lineinfile AND NOT A MOUNT MODULE: the mount module lives in
# ansible.posix, which this tree does not carry. Mounting reuses
# storage_layout's mount_target.yml, which reads the target FIRST because a
# bind line is never refused by util-linux and stacks on every unguarded mount.

- name: Refuse a host that does not name its sandbox storage device
  # The one value that can destroy data; an empty default means "no device",
  # and a role that guessed one would be guessing which disk to wipe.
  ansible.builtin.assert:
    that:
      - sandbox_storage_device | string | length > 0
      - sandbox_storage_device is match('^/dev/disk/by-id/')
    fail_msg: >-
      sandbox_storage_device must name the disk by its /dev/disk/by-id path
      (model and serial) in this host's host_vars; got
      '{{ sandbox_storage_device }}'.
    success_msg: "sandbox storage device: {{ sandbox_storage_device }}"

- name: Refuse a label a filesystem cannot carry
  # ext4 stores at most 16 bytes of label and mke2fs TRUNCATES a longer one
  # silently; the post-format label check would then fail on a disk that had
  # already been wiped, and a retry would find one label and refuse. Caught by
  # the Codex review before any disk was touched (this role's first default
  # was 18 bytes). Checked here, before any destructive command, and under
  # --check too.
  ansible.builtin.assert:
    that:
      - item | length > 0
      - item | length <= 16
      - item is match('^[A-Za-z0-9._-]+$')
    fail_msg: >-
      '{{ item }}' is not a usable filesystem label: at most 16 ASCII bytes of
      [A-Za-z0-9._-]
    success_msg: "'{{ item }}' is a usable label"
  loop:
    - "{{ sandbox_storage_swap_label }}"
    - "{{ sandbox_storage_fs_label }}"

- name: Resolve the device's kernel name
  # by-id is the stable name a host_vars file spells; the kernel name is what
  # lsblk and the mount table report, so both are needed below. A read.
  ansible.builtin.command: readlink -f {{ sandbox_storage_device }}
  register: sandbox_storage_readlink
  changed_when: false
  failed_when: false
  check_mode: false

- name: Refuse a device that is not present on this host
  ansible.builtin.assert:
    that:
      - sandbox_storage_readlink.rc == 0
      - sandbox_storage_readlink.stdout is match('^/dev/')
    fail_msg: >-
      {{ sandbox_storage_device }} does not resolve to a block device on this
      host; the disk is absent, or the by-id name in host_vars is wrong.
    success_msg: "{{ sandbox_storage_device }} -> {{ sandbox_storage_readlink.stdout }}"

- name: Hold the device's kernel name
  ansible.builtin.set_fact:
    sandbox_storage_device_real: "{{ sandbox_storage_readlink.stdout }}"

- name: Enumerate the host's block devices
  # check_mode: false because a registered `command` is skipped under --check,
  # and the label resolution below would then report a prepared disk as
  # unprepared on every drift read. A read.
  ansible.builtin.command: lsblk -rno PATH,TYPE
  register: sandbox_storage_lsblk
  changed_when: false
  check_mode: false
  become: true

- name: Probe each partition's filesystem label
  # `blkid -p` probes the superblock DIRECTLY, bypassing the blkid cache that
  # goes stale after a mkfs — which is exactly what the format path does.
  ansible.builtin.command: blkid -p -s LABEL -o value {{ item }}
  register: sandbox_storage_labels
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  loop: >-
    {{ sandbox_storage_lsblk.stdout_lines
       | map('split', ' ')
       | selectattr(1, 'equalto', 'part')
       | map(attribute=0) | list }}
  loop_control:
    label: "{{ item }}"

- name: Resolve each label to the partitions carrying it
  ansible.builtin.set_fact:
    sandbox_storage_swap_devices: >-
      {{ sandbox_storage_labels.results
         | selectattr('stdout', 'equalto', sandbox_storage_swap_label)
         | map(attribute='item') | list }}
    sandbox_storage_fs_devices: >-
      {{ sandbox_storage_labels.results
         | selectattr('stdout', 'equalto', sandbox_storage_fs_label)
         | map(attribute='item') | list }}

- name: Refuse a label that resolves to more than one partition, or to another disk
  # Two means a media swap is half done: relabel the OLD partition so exactly
  # one carries the role label. A partition on a different disk means the
  # host_vars device and the labelled disk disagree, and nothing below may
  # guess which one the operator meant.
  ansible.builtin.assert:
    that:
      - item.devices | length <= 1
      - item.devices | reject('match', '^' ~ (sandbox_storage_device_real | regex_escape)) | list | length == 0
    fail_msg: >-
      LABEL={{ item.label }} resolves to {{ item.devices | join(', ') | default('nothing', true) }};
      it must be at most one partition of {{ sandbox_storage_device_real }}
    success_msg: "LABEL={{ item.label }} -> {{ item.devices | join(', ') | default('none yet', true) }}"
  loop:
    - label: "{{ sandbox_storage_swap_label }}"
      devices: "{{ sandbox_storage_swap_devices }}"
    - label: "{{ sandbox_storage_fs_label }}"
      devices: "{{ sandbox_storage_fs_devices }}"
  loop_control:
    label: "{{ item.label }}"

- name: Decide whether the disk is already prepared
  # Prepared means BOTH labels resolve. Neither resolving is the unformatted
  # disk and takes the format path; exactly one resolving is a format that
  # died halfway, which is refused below rather than guessed at.
  ansible.builtin.set_fact:
    sandbox_storage_prepared: >-
      {{ sandbox_storage_swap_devices | length == 1 and sandbox_storage_fs_devices | length == 1 }}
    sandbox_storage_unprepared: >-
      {{ sandbox_storage_swap_devices | length == 0 and sandbox_storage_fs_devices | length == 0 }}

- name: Refuse a disk that carries only one of the two labels
  ansible.builtin.assert:
    that:
      - sandbox_storage_prepared | bool or sandbox_storage_unprepared | bool
    fail_msg: >-
      {{ sandbox_storage_device_real }} carries one of LABEL={{ sandbox_storage_swap_label }} /
      LABEL={{ sandbox_storage_fs_label }} and not the other: a format that did not finish.
      Inspect the disk by hand and either complete the layout or wipe both labels.
    success_msg: >-
      {{ sandbox_storage_device_real }} is
      {{ 'prepared' if sandbox_storage_prepared | bool else 'unprepared' }}

- name: Partition and format the unprepared disk
  ansible.builtin.include_tasks: format_device.yml
  when: sandbox_storage_unprepared | bool

- name: Report an unprepared disk, under --check
  # The format path is `command` tasks, which --check skips, so without this a
  # drift read of an unprepared host would show nothing where the one change
  # that matters is owed. Everything below is skipped on this host until a real
  # run with sandbox_storage_allow_format=true has prepared the disk.
  ansible.builtin.debug:
    msg: >-
      DRIFT: {{ sandbox_storage_device_real }} carries neither
      LABEL={{ sandbox_storage_swap_label }} nor LABEL={{ sandbox_storage_fs_label }};
      a real run with -e sandbox_storage_allow_format=true would partition and
      format it, and the rest of this role is skipped until then.
  when:
    - ansible_check_mode
    - sandbox_storage_unprepared | bool

- name: Read the current fstab
  ansible.builtin.slurp:
    src: /etc/fstab
  register: sandbox_storage_fstab_content
  become: true
  when: sandbox_storage_prepared | bool

- name: Hold the source each bind target is currently declared from
  # The migration decision reads THIS, before the lines below are rewritten:
  # a bind target whose fstab source is not the declared store directory is a
  # target whose store still lives somewhere else. Empty when fstab carries no
  # line for the target at all, which the migration reads as "the target
  # directory itself holds the store, on the root filesystem". The pattern
  # tolerates leading whitespace, as fstab(5) does; the role's own keys in
  # defaults use the same shape, so parsing and replacement agree.
  ansible.builtin.set_fact:
    sandbox_storage_containerd_declared: >-
      {{ (sandbox_storage_fstab_lines
          | select('match', '^\s*[^#\s]\S*\s+' ~ (sandbox_storage_containerd_dir | regex_escape) ~ '\s')
          | map('split') | map('first') | list | first | default('')) }}
    sandbox_storage_docker_declared: >-
      {{ (sandbox_storage_fstab_lines
          | select('match', '^\s*[^#\s]\S*\s+' ~ (sandbox_storage_docker_dir | regex_escape) ~ '\s')
          | map('split') | map('first') | list | first | default('')) }}
  vars:
    sandbox_storage_fstab_lines: "{{ (sandbox_storage_fstab_content.content | b64decode).splitlines() }}"
  when: sandbox_storage_prepared | bool

- name: Refuse a mountpoint that fstab already names more than once
  # lineinfile given two matching lines rewrites the LAST and leaves the
  # earlier one in place; the mount that then happens depends on which line
  # systemd's generator won with. Refusing keeps storage_layout's contract.
  ansible.builtin.assert:
    that:
      - >-
        (sandbox_storage_fstab_content.content | b64decode).splitlines()
        | select('match', item.key) | list | length <= 1
    fail_msg: >-
      /etc/fstab carries more than one line matching {{ item.key }}; reconcile
      them by hand before this role rewrites either
    success_msg: "/etc/fstab matches {{ item.key }} at most once"
  loop: "{{ sandbox_storage_fstab }}"
  loop_control:
    label: "{{ item.line }}"
  when: sandbox_storage_prepared | bool

- name: Ensure the swap and filesystem fstab lines
  # The two lines that are safe BEFORE the migration: neither hides anything.
  # The bind lines are written after the stores have moved, further down.
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "{{ item.key }}"
    line: "{{ item.line }}"
    insertafter: EOF
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  loop: "{{ sandbox_storage_fstab[:2] }}"
  loop_control:
    label: "{{ item.line }}"
  notify: Reload systemd for the sandbox storage
  when: sandbox_storage_prepared | bool

- name: Publish the changed fstab as mount units before mounting from it
  ansible.builtin.meta: flush_handlers

# --- swap: FIRST among the live changes, because it is the one that helps a
# loaded host today and the preseed below can run for an hour ----------------

- name: Read which swap devices are active, and at what priority
  # A read, under --check too. --raw gives "NAME PRIO" per line.
  ansible.builtin.command: swapon --show=NAME,PRIO --noheadings --raw
  register: sandbox_storage_swapon
  changed_when: false
  check_mode: false
  become: true
  when: sandbox_storage_prepared | bool

- name: Activate the swap partition at the declared priority
  # `swapon LABEL=` does NOT read the fstab line's pri=; it takes only its own
  # options, so the priority is passed here explicitly or the partition lands
  # BELOW the swap file it is meant to replace (Codex review, 2026-10-12).
  # noqa: command-instead-of-module — no swap module in ansible-core.
  ansible.builtin.command: >-
    swapon --priority {{ sandbox_storage_swap_priority }} LABEL={{ sandbox_storage_swap_label }}
  become: true
  changed_when: true
  when:
    - sandbox_storage_prepared | bool
    - sandbox_storage_swap_devices[0] not in (sandbox_storage_swapon.stdout_lines | map('split') | map('first') | list)

- name: Report an inactive swap partition, under --check
  ansible.builtin.debug:
    msg: >-
      DRIFT: {{ sandbox_storage_swap_devices[0] }} (LABEL={{ sandbox_storage_swap_label }})
      is not an active swap device; a real run would activate it at priority
      {{ sandbox_storage_swap_priority }}
  when:
    - ansible_check_mode
    - sandbox_storage_prepared | bool
    - sandbox_storage_swap_devices[0] not in (sandbox_storage_swapon.stdout_lines | map('split') | map('first') | list)

- name: Report a swap partition active at the wrong priority, under --check
  # The assertion below is skipped under --check (it reads the post-activation
  # state), so this is what makes a wrong priority visible on a drift read.
  ansible.builtin.debug:
    msg: >-
      DRIFT: {{ sandbox_storage_swap_devices[0] }} is active at priority
      '{{ sandbox_storage_swap_check_prio }}', not {{ sandbox_storage_swap_priority }};
      swapoff it by hand and re-run to activate it at the declared priority
  vars:
    sandbox_storage_swap_check_prio: >-
      {{ sandbox_storage_swapon.stdout_lines | map('split')
         | selectattr(0, 'equalto', sandbox_storage_swap_devices[0])
         | map(attribute=1) | first | default('') }}
  when:
    - ansible_check_mode
    - sandbox_storage_prepared | bool
    - sandbox_storage_swap_check_prio | length > 0
    - sandbox_storage_swap_check_prio != sandbox_storage_swap_priority | string

- name: Re-read the active swap devices
  ansible.builtin.command: swapon --show=NAME,PRIO --noheadings --raw
  register: sandbox_storage_swapon_after
  changed_when: false
  become: true
  when:
    - sandbox_storage_prepared | bool
    - not ansible_check_mode

- name: Refuse a swap partition that is not active at the declared priority
  # A partition activated by an earlier hand `swapon`, or by the fstab line at
  # boot, carries whatever priority THAT gave it; the role's number is the one
  # that puts it above the swap file, so a mismatch is drift to fix by hand
  # (`swapoff` it and re-run), never something to leave reported as fine.
  ansible.builtin.assert:
    that:
      - sandbox_storage_swap_active_prio == sandbox_storage_swap_priority | string
    fail_msg: >-
      {{ sandbox_storage_swap_devices[0] }} is active at priority
      '{{ sandbox_storage_swap_active_prio }}', not {{ sandbox_storage_swap_priority }}
    success_msg: "{{ sandbox_storage_swap_devices[0] }} is active at priority {{ sandbox_storage_swap_priority }}"
  vars:
    sandbox_storage_swap_active_prio: >-
      {{ sandbox_storage_swapon_after.stdout_lines | map('split')
         | selectattr(0, 'equalto', sandbox_storage_swap_devices[0])
         | map(attribute=1) | first | default('') }}
  when:
    - sandbox_storage_prepared | bool
    - not ansible_check_mode

# --- the filesystem ----------------------------------------------------------

- name: Check whether the filesystem mountpoint exists
  ansible.builtin.stat:
    path: "{{ sandbox_storage_mount }}"
  register: sandbox_storage_mount_dir
  become: true
  when: sandbox_storage_prepared | bool

- name: Create the filesystem mountpoint
  # Created only when absent: once mounted this path IS the filesystem root.
  ansible.builtin.file:
    path: "{{ sandbox_storage_mount }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  when:
    - sandbox_storage_prepared | bool
    - not sandbox_storage_mount_dir.stat.exists

- name: Mount the sandbox storage filesystem
  ansible.builtin.include_role:
    name: storage_layout
    tasks_from: mount_target
  vars:
    storage_layout_mount_target: "{{ sandbox_storage_mount }}"
  when: sandbox_storage_prepared | bool

- name: Read which device and subtree serve the filesystem mountpoint
  # "DEVICE FSROOT"; rc 1 when nothing is mounted there (a --check on a fresh
  # host). FSROOT too, not SOURCE alone: a bind of a SUBDIRECTORY of the right
  # partition onto the mountpoint has the right device and the wrong root, and
  # the stores would land beneath the wrong subtree.
  ansible.builtin.command: findmnt -rno SOURCE,FSROOT --nofsroot {{ sandbox_storage_mount }}
  register: sandbox_storage_mount_source
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  when: sandbox_storage_prepared | bool

- name: Refuse a filesystem mountpoint served from anything but the sandbox storage partition's root
  # The mount helper accepts ANY existing mount at the target. A stray bind
  # from / or /data there would take the preseed's 190 GB onto the disk this
  # role exists to relieve, and the final presence check would pass.
  ansible.builtin.assert:
    that:
      - sandbox_storage_mount_source.rc == 0
      - (sandbox_storage_mount_source.stdout | split)[0] == sandbox_storage_fs_devices[0]
      - (sandbox_storage_mount_source.stdout | split)[1] == '/'
    fail_msg: >-
      {{ sandbox_storage_mount }} is served from
      '{{ sandbox_storage_mount_source.stdout | default('') | trim }}', not from
      {{ sandbox_storage_fs_devices[0] }} /; unmount whatever is there by hand and re-run
    success_msg: "{{ sandbox_storage_mount }} is served from {{ sandbox_storage_fs_devices[0] }} /"
  when:
    - sandbox_storage_prepared | bool
    - not ansible_check_mode or sandbox_storage_mount_source.rc == 0

- name: Report an unmounted filesystem, under --check
  ansible.builtin.debug:
    msg: "DRIFT: {{ sandbox_storage_mount }} is not mounted; a real run would mount it from its fstab line"
  when:
    - ansible_check_mode
    - sandbox_storage_prepared | bool
    - sandbox_storage_mount_source.rc != 0

- name: Check which store directories exist on the filesystem
  ansible.builtin.stat:
    path: "{{ item }}"
  register: sandbox_storage_store_dirs
  become: true
  loop:
    - "{{ sandbox_storage_containerd_src }}"
    - "{{ sandbox_storage_docker_src }}"
  when:
    - sandbox_storage_prepared | bool
    - sandbox_storage_mount_source.rc == 0

- name: Create the store directories on the filesystem
  # Created only when absent, 0700 as both daemons create their own roots;
  # the migration's rsync then carries the live store's own mode over. Only
  # once the mountpoint is VERIFIED served from the partition: a directory
  # created under an unmounted mountpoint lands on / and is hidden by the
  # mount that follows.
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  become: true
  loop: "{{ sandbox_storage_store_dirs.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - sandbox_storage_prepared | bool
    - sandbox_storage_mount_source.rc == 0
    - not item.stat.exists

# --- the stores --------------------------------------------------------------

- name: Move the live stores onto the sandbox storage disk
  ansible.builtin.include_tasks: migrate_stores.yml
  when:
    - sandbox_storage_prepared | bool
    - sandbox_storage_mount_source.rc == 0

- name: Hold whether this run serves the daemons from the new disk
  # True once the stores are on the disk (moved by this run or an earlier one)
  # and false while the move is deferred or the filesystem is not mounted.
  # Everything that would point a daemon at the new disk — the bind lines, the
  # binds, the drop-ins, the daemon start — is gated on it, so a deferring run
  # leaves the daemons exactly as found.
  ansible.builtin.set_fact:
    sandbox_storage_serving: >-
      {{ sandbox_storage_prepared | bool
         and sandbox_storage_mount_source.rc == 0
         and not (sandbox_storage_migration_deferred | default(true) | bool) }}

- name: Keep a pre-cutover copy of fstab beside it
  # ONE named snapshot taken before the first bind line is rewritten, for the
  # rollback in HOST_VARS.md. lineinfile's own `backup` writes a timestamped
  # copy per edit, and the latest of those can already carry one migrated
  # line — an operator rolling back from it would restore half a cutover.
  # `force: false` keeps the first snapshot across re-runs.
  ansible.builtin.copy:
    src: /etc/fstab
    dest: "{{ sandbox_storage_fstab_snapshot }}"
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0644"
  become: true
  when:
    - sandbox_storage_serving | bool
    - sandbox_storage_pending_migrations | default([]) | length > 0

- name: Ensure the two bind fstab lines
  # AFTER the migration decision, never before: a bind laid over a directory
  # that already holds content HIDES it (storage_layout, 2026-09-07).
  ansible.builtin.lineinfile:
    path: /etc/fstab
    regexp: "{{ item.key }}"
    line: "{{ item.line }}"
    insertafter: EOF
    owner: root
    group: root
    mode: "0644"
    backup: true
  become: true
  loop: "{{ sandbox_storage_fstab[2:] }}"
  loop_control:
    label: "{{ item.line }}"
  notify: Reload systemd for the sandbox storage
  when: sandbox_storage_serving | bool

- name: Publish the bind lines as mount units before mounting from them
  ansible.builtin.meta: flush_handlers

- name: Bind containerd's store onto its new directory
  ansible.builtin.include_role:
    name: storage_layout
    tasks_from: mount_target
  vars:
    storage_layout_mount_target: "{{ sandbox_storage_containerd_dir }}"
  when: sandbox_storage_serving | bool

- name: Bind docker's root onto its new directory
  ansible.builtin.include_role:
    name: storage_layout
    tasks_from: mount_target
  vars:
    storage_layout_mount_target: "{{ sandbox_storage_docker_dir }}"
  when: sandbox_storage_serving | bool

- name: Read which device and subtree serve each bind target
  # "DEVICE FSROOT" per target, e.g. "/dev/sdc2 /containerd"; rc 1 when the
  # target is not a mountpoint.
  ansible.builtin.command: findmnt -rno SOURCE,FSROOT --nofsroot {{ item.dir }}
  register: sandbox_storage_bind_sources
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  loop: "{{ sandbox_storage_bind_targets }}"
  loop_control:
    label: "{{ item.dir }}"
  when: sandbox_storage_serving | bool

- name: Refuse a bind target served from anything but its store on the sandbox storage partition
  # The presence check at the end of this role cannot tell the new bind from
  # the old one; this can. A target still served from /data after the cutover
  # is the cutover having silently not happened.
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | split)[0] == sandbox_storage_fs_devices[0]
      - (item.stdout | split)[1] == item.item.subtree
    fail_msg: >-
      {{ item.item.dir }} is served from '{{ item.stdout | default('') }}', not from
      {{ sandbox_storage_fs_devices[0] }} {{ item.item.subtree }}
    success_msg: "{{ item.item.dir }} is served from {{ sandbox_storage_fs_devices[0] }} {{ item.item.subtree }}"
  loop: "{{ sandbox_storage_bind_sources.results | default([]) }}"
  loop_control:
    label: "{{ item.item.dir }}"
  when:
    - sandbox_storage_serving | bool
    - not ansible_check_mode

- name: Read whether each bound target holds a store
  # Through the TARGET, after the bind, with the same tests the new directory
  # was held to: containerd's metadata database, any entry for docker. A bind
  # verified by device and subtree can still be a bind over nothing if the
  # directory was recreated empty; the daemons must not start on that.
  ansible.builtin.find:
    paths: "{{ item.dir }}"
    file_type: any
    hidden: true
    patterns: "{{ [sandbox_storage_containerd_store_marker] if item.dir == sandbox_storage_containerd_dir else [] }}"
    excludes:
      - lost+found
  register: sandbox_storage_target_entries
  become: true
  failed_when: false
  loop: "{{ sandbox_storage_bind_targets }}"
  loop_control:
    label: "{{ item.dir }}"
  when:
    - sandbox_storage_serving | bool
    - not ansible_check_mode

- name: Refuse to serve a daemon from a bound target that holds no store
  ansible.builtin.assert:
    that:
      - (item.matched | default(0) | int) > 0
    fail_msg: >-
      {{ item.item.dir }} is bound from the new disk but holds no store; the daemons stay
      masked and stopped. Inspect {{ sandbox_storage_mount }} by hand before re-running.
    success_msg: "{{ item.item.dir }} holds a store"
  loop: "{{ sandbox_storage_target_entries.results | default([]) | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.dir }}"

- name: Create each daemon's drop-in directory
  # Explicit, because --check cannot see past a missing parent.
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.unit }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  loop: "{{ sandbox_storage_units }}"
  loop_control:
    label: "{{ item.unit }}"
  when: sandbox_storage_serving | bool

- name: Install the drop-in that refuses to start each daemon on a missing mount
  ansible.builtin.template:
    src: requires-sandbox-storage.conf.j2
    dest: "/etc/systemd/system/{{ item.unit }}.d/{{ sandbox_storage_dropin_name }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  loop: "{{ sandbox_storage_units }}"
  loop_control:
    label: "{{ item.unit }}"
  notify: Reload systemd for the sandbox storage
  when: sandbox_storage_serving | bool

- name: Publish the drop-ins before any daemon is started
  ansible.builtin.meta: flush_handlers

- name: Unmask the container daemons now that the new layout is verified
  # The counterpart of the cutover's mask (migrate_stores.yml): reached only
  # once both binds are mounted from the new partition at the right subtree
  # AND hold stores, with the drop-ins published. On a host that was never
  # masked this is a no-op. Not under --check: unmasking is a real change to
  # the units' state on disk.
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    masked: false
  become: true
  loop:
    - containerd.service
    - docker.socket
    - docker.service
  when:
    - sandbox_storage_serving | bool
    - not ansible_check_mode

- name: Ensure the container daemons are running on the new layout
  # Declarative, not "the ones THIS run stopped": a cutover interrupted after
  # the binds moved but before the start would otherwise leave the daemons
  # down on every later run, the transient fact that remembered the stop gone
  # with the run that set it. Socket first, so the daemon starts as the
  # socket's unit and not as a socket-activated stray; containerd before
  # docker, as docker's After=. Reached only when serving: a deferring run
  # touches no daemon.
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
  become: true
  loop:
    - containerd.service
    - docker.socket
    - docker.service
  when: sandbox_storage_serving | bool

- name: Re-read the host's mount table
  # The play's facts were gathered before this role mounted anything.
  ansible.builtin.setup:
    gather_subset:
      - "!all"
      - mounts
  when:
    - sandbox_storage_prepared | bool
    - not ansible_check_mode

- name: Refuse a managed mountpoint that is not mounted
  # The half-applied state: fstab carrying the lines with nothing mounted and
  # an exit code that said it had worked. While the move is deferred only the
  # filesystem itself is this role's to assert; the bind targets are still the
  # host's old binds, which this run did not touch.
  ansible.builtin.assert:
    that:
      - item in (ansible_facts['mounts'] | map(attribute='mount') | list)
    fail_msg: "{{ item }} is not mounted; the layout is HALF APPLIED"
    success_msg: "{{ item }} is mounted"
  loop: >-
    {{ [sandbox_storage_mount]
       + ([sandbox_storage_containerd_dir, sandbox_storage_docker_dir]
          if sandbox_storage_serving | default(false) | bool else []) }}
  when:
    - sandbox_storage_prepared | bool
    - not ansible_check_mode

- name: Retire the old store copies
  ansible.builtin.include_tasks: reclaim_old_stores.yml
  when:
    - sandbox_storage_allow_reclaim | bool
    - sandbox_storage_serving | bool
