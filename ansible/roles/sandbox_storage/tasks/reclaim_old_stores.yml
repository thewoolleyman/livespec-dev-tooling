---
# Retire the OLD store copies a completed cutover left behind — HOST_VARS.md
# "Cutover" step 6. Reached only with sandbox_storage_allow_reclaim, and only
# on a run that is serving the daemons from the new disk. Deleting the old
# copies ends the rollback in HOST_VARS.md for good, so every precondition is
# re-established on THIS run rather than trusted from the cutover's:
#
#   - the record marks both stores copied, and names absolute old sources
#     that are neither the new disk, nor a bind target, nor a top-level path;
#   - both bind targets are served from their stores on the new partition;
#   - both daemons are active on that layout;
#   - each old source still lives on the filesystem the record names, and
#     nothing on the host uses it: no bind or overlay in any mount namespace,
#     no open file or mapping, no container process older than the cutover
#     (files/sandbox-storage-old-refs).
#
# An old source already gone is skipped, so a re-run is a no-op.

- name: Read the cutover's record
  ansible.builtin.slurp:
    src: "{{ sandbox_storage_mount }}/{{ sandbox_storage_sources_record }}"
  register: sandbox_storage_reclaim_record_raw
  become: true

- name: Hold the record's old sources
  ansible.builtin.set_fact:
    sandbox_storage_reclaim_record: "{{ sandbox_storage_reclaim_record_raw.content | b64decode | from_json }}"

- name: Refuse to reclaim a store the record does not mark copied, or a source that is not an old store
  ansible.builtin.assert:
    that:
      - sandbox_storage_reclaim_record[item] is defined
      - sandbox_storage_reclaim_record[item].copied is defined
      - sandbox_storage_reclaim_record[item].copied is boolean
      - sandbox_storage_reclaim_record[item].copied
      - sandbox_storage_reclaim_record[item].source is match('^/[^/]+/[^/]')
      - sandbox_storage_reclaim_record[item].source is not match('^' ~ (sandbox_storage_mount | regex_escape) ~ '(/|$)')
      - sandbox_storage_reclaim_record[item].source not in [sandbox_storage_containerd_dir, sandbox_storage_docker_dir]
      - sandbox_storage_reclaim_record[item].uuid | default('') | length > 0
    fail_msg: >-
      the record's '{{ item }}' entry ({{ sandbox_storage_reclaim_record[item] | default({}) | to_json }})
      does not name a completed copy from an old store; nothing is deleted
    success_msg: "old {{ item }} store: {{ sandbox_storage_reclaim_record[item].source }}"
  loop: [containerd, docker]

- name: Read which device and subtree serve each bind target, before reclaiming
  ansible.builtin.command: findmnt -rno SOURCE,FSROOT --nofsroot {{ item.dir }}
  register: sandbox_storage_reclaim_binds
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  loop: "{{ sandbox_storage_bind_targets }}"
  loop_control:
    label: "{{ item.dir }}"

- name: Refuse to reclaim while a bind target is served from anything but the new partition
  ansible.builtin.assert:
    that:
      - item.rc == 0
      - (item.stdout | split)[0] == sandbox_storage_fs_devices[0]
      - (item.stdout | split)[1] == item.item.subtree
    fail_msg: "{{ item.item.dir }} is served from '{{ item.stdout }}'; the old stores are kept"
    success_msg: "{{ item.item.dir }} is served from {{ item.stdout }}"
  loop: "{{ sandbox_storage_reclaim_binds.results }}"
  loop_control:
    label: "{{ item.item.dir }}"

- name: Read whether the container daemons are active
  # noqa: command-instead-of-module — one-unit reads, as migrate_stores.yml.
  ansible.builtin.command: systemctl is-active {{ item }}
  register: sandbox_storage_reclaim_daemons
  changed_when: false
  failed_when: false
  check_mode: false
  loop:
    - containerd.service
    - docker.service

- name: Refuse to reclaim while a container daemon is not running on the new layout
  ansible.builtin.assert:
    that:
      - item.stdout | trim == 'active'
    fail_msg: "{{ item.item }} is '{{ item.stdout | trim }}'; the old stores are kept"
    success_msg: "{{ item.item }} is active"
  loop: "{{ sandbox_storage_reclaim_daemons.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check which old sources still exist
  ansible.builtin.stat:
    path: "{{ sandbox_storage_reclaim_record[item].source }}"
  register: sandbox_storage_reclaim_sources
  become: true
  loop: [containerd, docker]

- name: Find anything on the host still using each old source
  # files/sandbox-storage-old-refs: binds and overlays in every mount
  # namespace, open files and mappings, and container processes older than
  # the cutover (an old container's overlay names the same paths a new one
  # does). Prints {"uuid", "count", "refs"}; exits 2 when it could not see
  # everything, which fails this task — the scan fails closed.
  ansible.builtin.script:
    cmd: >-
      sandbox-storage-old-refs
      {{ sandbox_storage_reclaim_record[item.item].source | quote }}
      {{ (sandbox_storage_mount ~ '/' ~ sandbox_storage_sources_record) | quote }}
      {{ sandbox_storage_containerd_dir | quote }}
      {{ sandbox_storage_docker_dir | quote }}
    executable: python3
  register: sandbox_storage_reclaim_refs
  changed_when: false
  check_mode: false
  become: true
  loop: "{{ sandbox_storage_reclaim_sources.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists

- name: Refuse to reclaim an old source that moved filesystems or that something still mounts
  ansible.builtin.assert:
    that:
      - (item.stdout | from_json).uuid == sandbox_storage_reclaim_record[item.item.item].uuid
      - (item.stdout | from_json).count | int == 0
    fail_msg: >-
      {{ sandbox_storage_reclaim_record[item.item.item].source }} reads {{ item.stdout | trim }};
      expected UUID {{ sandbox_storage_reclaim_record[item.item.item].uuid }} and no
      references. Nothing is deleted.
    success_msg: "{{ sandbox_storage_reclaim_record[item.item.item].source }} is unreferenced"
  loop: "{{ sandbox_storage_reclaim_refs.results | rejectattr('skipped', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.item }}"

- name: Report the old sources a --check run would delete
  ansible.builtin.debug:
    msg: "would delete {{ sandbox_storage_reclaim_record[item.item].source }}"
  loop: "{{ sandbox_storage_reclaim_sources.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - ansible_check_mode
    - item.stat.exists

- name: Delete each old source
  # At idle priority and confined to its own filesystem. Async because ~190 GB
  # of small files outlasts ssh's patience; the play waits for it.
  ansible.builtin.command:
    argv:
      - ionice
      - -c3
      - nice
      - -n19
      - rm
      - -rf
      - --one-file-system
      - --
      - "{{ sandbox_storage_reclaim_record[item.item].source }}"
  async: 21600
  poll: 30
  changed_when: true
  become: true
  loop: "{{ sandbox_storage_reclaim_sources.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - not ansible_check_mode
    - item.stat.exists

- name: Delete the host's other leftovers of the move
  # The pre-cutover fstab snapshot names the old binds, which no longer
  # exist: restoring it now would mount nothing and, without nofail, fail the
  # boot. Plus whatever host_vars lists (hp's fpsync scratch).
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  become: true
  loop: "{{ [sandbox_storage_fstab_snapshot] + sandbox_storage_reclaim_extra_paths }}"
