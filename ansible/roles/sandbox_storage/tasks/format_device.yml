---
# Reached only when NEITHER role label resolves anywhere on the host, so a disk
# that is already laid out is never re-formatted whatever the flag says. The
# flag is what authorises destroying what the disk holds today; on hp-xubuntu
# that was an NTFS Steam library the maintainer confirmed re-downloadable
# (work-item smrzsj, 2026-10-12).

- name: Refuse a format that was not authorised for this run
  # Under --check the refusal is not raised: the drift read reports the
  # unprepared disk (main.yml) instead of failing on a change it cannot make.
  ansible.builtin.assert:
    that:
      - sandbox_storage_allow_format | bool
    fail_msg: >-
      {{ sandbox_storage_device_real }} carries neither role label and formatting it
      destroys everything on it. Re-run with -e sandbox_storage_allow_format=true
      to authorise that for this one run.
    success_msg: format authorised for this run
  when: not ansible_check_mode

- name: Refuse to format a disk with a mounted partition
  # Whatever is mounted from it is in use, and a Steam library is not the only
  # thing a disk can hold. The mount table is the play's gathered facts.
  ansible.builtin.assert:
    that:
      - >-
        ansible_facts['mounts'] | map(attribute='device')
        | select('match', '^' ~ (sandbox_storage_device_real | regex_escape)) | list | length == 0
    fail_msg: >-
      a partition of {{ sandbox_storage_device_real }} is mounted:
      {{ ansible_facts['mounts'] | selectattr('device', 'match', '^' ~ (sandbox_storage_device_real | regex_escape))
         | map(attribute='mount') | join(', ') }}. Unmount it by hand first.
    success_msg: "nothing is mounted from {{ sandbox_storage_device_real }}"

- name: Wipe the partition table and write the two partitions
  # --zap-all clears both GPT and MBR structures; the two -n/-t/-c triples lay
  # out swap (type 8200) sized by the role and the filesystem (8300) over the
  # rest. One invocation, so a failure leaves no half-written table behind for
  # the label probe to half-recognise.
  # noqa: command-instead-of-module — no partition module in ansible-core.
  ansible.builtin.command: >-
    sgdisk --zap-all
    --new=1:0:+{{ sandbox_storage_swap_size }} --typecode=1:8200 --change-name=1:{{ sandbox_storage_swap_label }}
    --new=2:0:0 --typecode=2:8300 --change-name=2:{{ sandbox_storage_fs_label }}
    {{ sandbox_storage_device }}
  become: true
  changed_when: true
  when: not ansible_check_mode

- name: Wait for udev to publish the new partitions
  # by-id -partN links are udev's, and sgdisk returns before udev has read the
  # new table; mkswap on a link that is not there yet is the race this closes.
  ansible.builtin.command: udevadm settle
  become: true
  changed_when: false
  when: not ansible_check_mode

- name: Wait for the two partition links
  ansible.builtin.wait_for:
    path: "{{ sandbox_storage_device }}-part{{ item }}"
    timeout: 30
  loop: [1, 2]
  when: not ansible_check_mode

- name: Make the swap partition
  # noqa: command-instead-of-module
  ansible.builtin.command: mkswap -L {{ sandbox_storage_swap_label }} {{ sandbox_storage_device }}-part1
  become: true
  changed_when: true
  when: not ansible_check_mode

- name: Make the ext4 filesystem
  # noqa: command-instead-of-module — the filesystem module is
  # community.general, which this tree does not carry.
  ansible.builtin.command: mkfs.ext4 -q -L {{ sandbox_storage_fs_label }} {{ sandbox_storage_device }}-part2
  become: true
  changed_when: true
  when: not ansible_check_mode

- name: Re-probe the two partitions' labels
  ansible.builtin.command: blkid -p -s LABEL -o value {{ sandbox_storage_device }}-part{{ item }}
  register: sandbox_storage_new_labels
  changed_when: false
  become: true
  loop: [1, 2]
  when: not ansible_check_mode

- name: Hold the freshly formatted partitions as the resolved labels
  # The rest of main.yml reads these as if the probe at the top had found them.
  ansible.builtin.set_fact:
    sandbox_storage_swap_devices: ["{{ sandbox_storage_device_real }}1"]
    sandbox_storage_fs_devices: ["{{ sandbox_storage_device_real }}2"]
    sandbox_storage_prepared: true
    sandbox_storage_unprepared: false
  when: not ansible_check_mode

- name: Refuse a format whose labels did not land
  ansible.builtin.assert:
    that:
      - sandbox_storage_new_labels.results[0].stdout == sandbox_storage_swap_label
      - sandbox_storage_new_labels.results[1].stdout == sandbox_storage_fs_label
    fail_msg: >-
      after formatting, {{ sandbox_storage_device }} carries labels
      {{ sandbox_storage_new_labels.results | map(attribute='stdout') | join(', ') }}
      rather than {{ sandbox_storage_swap_label }}, {{ sandbox_storage_fs_label }}
    success_msg: "{{ sandbox_storage_device }} carries both role labels"
  when: not ansible_check_mode
