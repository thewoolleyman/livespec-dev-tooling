---
# Defaults for sandbox_storage — the SECOND disk a Fabro factory host keeps its
# swap and its container stores on, so the root disk no longer carries the
# sandbox churn as well as the OS and the Fabro servers.
#
# MEASURED ON hp-xubuntu, 2026-10-12, under factory load (livespec-dev-tooling
# work-item smrzsj): one SATA SSD (sda) carried /, /swap.img, /data, and — by
# two hand-written fstab bind lines no role managed — /var/lib/docker and
# /var/lib/containerd. The 8 GB swap file was 100% full. The second SATA SSD
# (sdc, 4 TB) sat idle under a Steam library the maintainer confirmed may be
# wiped. This role declares that disk's layout and brings the two bind lines
# under management.
#
# THE DEVICE IS PER-HOST AND EMPTY HERE ON PURPOSE. A disk is named by its
# /dev/disk/by-id path, which carries the model and serial, so the one value
# that can destroy data is a value a host_vars file has to spell in full; an
# empty default is refused before anything is read.
sandbox_storage_device: ""

# THE TWO PARTITIONS, by GPT position and by the label each filesystem carries.
# Mounted BY LABEL, not by device name, for the reason storage_layout's
# ci-tiers.fstab records: a SATA enumeration order is not a stable name, and a
# label survives a media swap that keeps the data.
# AT MOST 16 BYTES EACH: ext4 stores no more and mke2fs truncates a longer
# label silently, which the role refuses before any destructive command.
sandbox_storage_swap_label: sandbox-swap
sandbox_storage_fs_label: sandbox-stores
# The swap partition's size, an sgdisk size suffix; the filesystem takes the
# rest of the disk. The fleet default is the host's RAM; a factory host whose
# sandboxes carry a per-container swap allowance (docker MemorySwap above
# Memory) sizes it in host_vars to max concurrent runs x that allowance, so
# that the allowance the containers are GIVEN is swap they can actually GET —
# hp-xubuntu was OOM-killing sandboxes against a full 8 GB file while each
# was nominally allowed 8 GB more (2026-10-12).
sandbox_storage_swap_size: 32GiB
# Above the swap file's default -1, so the kernel fills the partition first and
# the old file becomes the overflow rather than the other way round.
sandbox_storage_swap_priority: 10

# Where the filesystem is mounted, and the two store directories on it that
# the bind targets are laid over.
sandbox_storage_mount: /srv/sandbox-storage
sandbox_storage_containerd_src: "{{ sandbox_storage_mount }}/containerd"
sandbox_storage_docker_src: "{{ sandbox_storage_mount }}/docker"
sandbox_storage_containerd_dir: /var/lib/containerd
sandbox_storage_docker_dir: /var/lib/docker

# THE FSTAB LINES THIS ROLE OWNS, byte-exact. Keyed on the mountpoint (the
# bind lines and the filesystem line) or on the source (the swap line, whose
# mountpoint is `none` and shared with the swap file this role does not own),
# so an existing but DIFFERENT line for the same key — hp's hand-written
# `/data/containerd /var/lib/containerd none bind 0 0` — is replaced rather
# than duplicated.
#
# `nofail` ON EVERY LINE, AND THAT IS THE SAFETY, NOT A WEAKENING OF IT. This
# is a headless factory host. Without nofail a dead or unplugged second disk
# at boot fails local-fs.target and drops the machine into emergency mode with
# no ssh — a bricked host for a disk that carries nothing the OS needs. With
# nofail the boot completes, the filesystem and the binds simply fail, and the
# RequiresMountsFor= drop-ins below are what make docker and containerd fail
# LOUDLY by dependency instead of starting on an empty root-filesystem
# directory. The bind lines need it too: a bind whose source is under a
# nofail mount inherits nothing and would fail the boot on its own.
#
# The keys tolerate leading whitespace, as fstab(5) does: an indented existing
# line for a managed mountpoint would otherwise escape both the duplicate
# refusal and the replacement, and `mount <target>` could then pick the old
# line over the new one (Codex review, 2026-10-12).
sandbox_storage_fstab:
  - line: "LABEL={{ sandbox_storage_swap_label }} none swap sw,nofail,pri={{ sandbox_storage_swap_priority }} 0 0"
    key: "^\\s*LABEL={{ sandbox_storage_swap_label }}\\s"
  - line: "LABEL={{ sandbox_storage_fs_label }} {{ sandbox_storage_mount }} ext4 defaults,noatime,nofail 0 2"
    key: "^\\s*[^#\\s]\\S*\\s+{{ sandbox_storage_mount | regex_escape }}\\s"
  - line: "{{ sandbox_storage_containerd_src }} {{ sandbox_storage_containerd_dir }} none bind,nofail 0 0"
    key: "^\\s*[^#\\s]\\S*\\s+{{ sandbox_storage_containerd_dir | regex_escape }}\\s"
  - line: "{{ sandbox_storage_docker_src }} {{ sandbox_storage_docker_dir }} none bind,nofail 0 0"
    key: "^\\s*[^#\\s]\\S*\\s+{{ sandbox_storage_docker_dir | regex_escape }}\\s"

# The two bind targets with the subtree of the filesystem each must be served
# from — what `findmnt` reports as FSROOT — so a mount can be verified by
# device and subtree rather than by presence.
sandbox_storage_bind_targets:
  - dir: "{{ sandbox_storage_containerd_dir }}"
    subtree: "{{ sandbox_storage_containerd_src | regex_replace('^' ~ (sandbox_storage_mount | regex_escape), '') }}"
  - dir: "{{ sandbox_storage_docker_dir }}"
    subtree: "{{ sandbox_storage_docker_src | regex_replace('^' ~ (sandbox_storage_mount | regex_escape), '') }}"

# Where the cutover records, per store, the verified old source, its
# filesystem UUID and whether the copy completed — on the new disk, before it
# stops anything, updated per store under the copy lock as each copy completes. An interrupted cutover resumes from
# it, and a store it marks copied is re-bound and never recopied. And the one
# named pre-cutover snapshot of fstab the rollback restores.
sandbox_storage_sources_record: .sandbox-storage-sources.json
sandbox_storage_fstab_snapshot: /etc/fstab.pre-sandbox-storage
# The host-side flock every copy onto the new disk takes — preseed and cutover
# alike — so no two writers ever share the destination, and a preseed that a
# still-running earlier play launches after the cutover re-reads the record
# under the lock and leaves a completed store alone.
sandbox_storage_lock: .sandbox-storage.lock
# The one program every copy onto the new disk runs through (files/
# sandbox-storage-copy): it holds the lock above across the record read,
# the copy and, for the cutover, the publication of `copied: true`.
sandbox_storage_copy_helper: /usr/local/libexec/sandbox-storage-copy

# The preseed's read ceiling on the SOURCE disk, rsync's --bwlimit form.
# `ionice -c3` is also passed but is a no-op under mq-deadline, Ubuntu's
# default scheduler for a SATA SSD (only bfq honours IO classes), so the
# bandwidth cap is the control that actually keeps the live copy from
# competing with the factory's own reads. 40 MB/s against a disk measured at
# ~150 MB/s sequential under load; ~190 GB takes about 80 minutes.
sandbox_storage_preseed_bwlimit: 40m

# The units that must not start on an empty bind target. Each gets a drop-in
# carrying RequiresMountsFor= its own store, the k3s nodes' pattern
# (storage_layout's 10-requires-storage-mounts.conf): a missing mount fails the
# unit loudly instead of letting the daemon rebuild an empty store on the root
# filesystem and run the host's churn there.
sandbox_storage_units:
  - unit: containerd.service
    path: "{{ sandbox_storage_containerd_dir }}"
  - unit: docker.service
    path: "{{ sandbox_storage_docker_dir }}"
sandbox_storage_dropin_name: 10-requires-sandbox-storage.conf

# The one entry that says a containerd directory IS a store (storage_layout's
# marker, same reasoning): containerd creates its metadata database before
# anything can use the store, so its presence on the new disk means the copy
# landed. Docker's root has no single such file; any entry but lost+found
# counts.
sandbox_storage_containerd_store_marker: io.containerd.metadata.v1.bolt

# ALL THREE OFF BY DEFAULT, AND DELIBERATELY SO. Each authorises ONE run to do
# a thing a routine converge must never reach:
#
#   allow_format        — zap the device's partition table and format both
#                         partitions. Reached only when NEITHER label resolves
#                         anywhere on the host, so a prepared disk is never
#                         re-formatted even with the flag set. Stops nothing.
#   allow_preseed       — copy the LIVE stores onto the new disk at idle IO
#                         priority while the daemons keep running. The copy is
#                         not consistent and is never served; it exists so the
#                         cutover's copy is an incremental of minutes rather
#                         than a full copy of hours. Stops nothing.
#   allow_live_migration — stop docker and containerd, copy the stores onto
#                         the new disk (checksummed), and move the binds. The
#                         run REFUSES while docker carries any container
#                         unless allow_run_loss is also set.
#   allow_run_loss      — with allow_live_migration: accept ending whatever
#                         containers are running, INCLUDING ending the shims
#                         that outlive the daemon stop (TERM, then KILL). The
#                         work-item allows for that choice; this is where it
#                         is spelled. Without it a survivor is a refusal.
#
# Pass each as -e on the apply that is meant to do it. A run that reaches a
# pending store move without allow_live_migration DEFERS it — writes nothing
# that would point a daemon at the new disk, reports what is owed, and still
# completes the parts that are safe (the swap, the filesystem mount, the
# preseed when authorised) — rather than failing.
sandbox_storage_allow_format: false
sandbox_storage_allow_preseed: false
sandbox_storage_allow_live_migration: false
sandbox_storage_allow_run_loss: false
