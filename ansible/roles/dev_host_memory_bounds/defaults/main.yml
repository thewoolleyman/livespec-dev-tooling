# dev_host_memory_bounds — keep the dev host's memory from being exhausted by
# the RAM-backed /tmp and by unbounded fleet Python. See HOST_VARS.md for the
# operator procedure, the live cutover and the rollback.
#
# The 2026-11-13 incident this answers: the dev VPS (94 GiB RAM, no swap) was
# rebooted at 15:53Z at load ~400 after memory exhaustion. The RAM-backed /tmp
# tmpfs held 35-38 GiB, mostly session scratchpads under /tmp/claude-1000;
# Python held 19-26 GiB (per-run dispatcher loops, uncapped reconcile-runs,
# local full-suite gates). The OOM killer fired 130 times on small services
# and killed Dolt at 15:32:41Z. Evidence: the investigation report under
# /var/tmp/livespec-dumps/vps-overload-20261113/ and the scope events of
# 2026-11-13 15:58Z and 16:30Z on epic livespec-dev-tooling-6tgd2z.

# `present` installs every bound below; `absent` removes every file this role
# wrote and returns the host to how it was before the role ran. Two words, not a
# boolean, so a typo fails the assert instead of reading as "not absent".
dev_host_memory_bounds_state: absent

# --- /tmp ------------------------------------------------------------------

# The tmpfs size cap. 8G instead of the systemd default of 50% of RAM (47G on
# the VPS): /tmp is RAM, and with the session scratchpads moved to disk, what is
# left there is sockets, locks and short-lived files.
dev_host_memory_bounds_tmp_size: 8G
dev_host_memory_bounds_tmp_nr_inodes: 2m

# The drop-in that carries the cap. Named `zz-` ON PURPOSE: `Options=` is a
# single-value setting, so the LAST drop-in in lexical order wins, and the host
# already carries a hand-made `override.conf` (size=50%, nr_inodes=100000000).
# Sorting after it lets this role win without rewriting that file, and lets the
# rollback (state absent) restore it exactly by removing only this one.
dev_host_memory_bounds_tmp_dropin_dir: /etc/systemd/system/tmp.mount.d
dev_host_memory_bounds_tmp_dropin: zz-livespec-memory-bounds.conf

# --- session scratchpads onto disk -----------------------------------------

# The login whose Claude Code scratchpads move. Its uid names the directory
# Claude Code creates (`/tmp/claude-<uid>`).
dev_host_memory_bounds_user: ubuntu

# `/tmp/claude-<uid>` becomes a bind mount of this directory on the root disk.
# The PATH does not change, so every reader of it — the dev_host_retention sweep
# of dead sessions' scratch, each live session — keeps working unchanged.
dev_host_memory_bounds_scratch_disk_root: /var/tmp
dev_host_memory_bounds_scratch_ram_root: /tmp


# --- memory slices ----------------------------------------------------------

# Slices live in the USER manager of `dev_host_memory_bounds_user`, not the
# system manager: the dispatcher loops and gates are started by that login's
# sessions, and user@<uid>.service delegates the memory controller (measured
# 2026-11-13: DelegateControllers=cpu memory pids), so a session can launch into
# a slice with `systemd-run --user --scope --slice=<name>` and no sudo.
dev_host_memory_bounds_user_unit_dir: /etc/systemd/user

# ONE slice for every per-run `dispatcher.py loop` and its launcher. Its size
# is DERIVED from four host variables, so a host with a different fleet cap or
# different RAM sets those and nothing else:
#
#   MemoryMax  = loop_cap x loop_steady + concurrent_peaks x (loop_peak - loop_steady)
#   MemoryHigh = 90% of MemoryMax
#
# The per-loop figures were measured on the dev VPS, 2026-11-13 ~16:5xZ, over 13
# running loops:
# - steady RSS 0.23-1.69G, 8.0G in total (the coordinator read 9.7G, ~760M
#   each, minutes earlier);
# - PEAK (VmHWM) 0.46-2.53G per loop, 18.5G summed. Five loops had each peaked
#   at 2.45-2.53G.
# At the VPS's fleet cap of 18 the formula gives 18 x 800M + 4 x 1760M = 21440M.
# The first draft's 12G, agreed from 5 loops at 0.29-0.78G, would have OOM-killed
# loops in ordinary operation.
dev_host_memory_bounds_dispatch_slice: factory-dispatch.slice
dev_host_memory_bounds_dispatch_loop_cap: 18
dev_host_memory_bounds_dispatch_loop_steady_mib: 800
dev_host_memory_bounds_dispatch_loop_peak_mib: 2560
dev_host_memory_bounds_dispatch_concurrent_peaks: 4
dev_host_memory_bounds_dispatch_memory_max: >-
  {{ dev_host_memory_bounds_dispatch_loop_cap | int * dev_host_memory_bounds_dispatch_loop_steady_mib | int
     + dev_host_memory_bounds_dispatch_concurrent_peaks | int
       * (dev_host_memory_bounds_dispatch_loop_peak_mib | int - dev_host_memory_bounds_dispatch_loop_steady_mib | int) }}M
dev_host_memory_bounds_dispatch_memory_high: >-
  {{ ((dev_host_memory_bounds_dispatch_memory_max | regex_replace('M$', '') | int) * 0.9) | int }}M

# The bound EACH launcher puts on its own scope, so one runaway loop cannot take
# the whole slice: the largest measured peak (VmHWM 2532M) plus room for the
# loop's drive and preflight children. The role publishes it in
# `dev_host_memory_bounds_dispatch_loop_memory_max_file` so a launcher reads this
# host's value instead of hard-coding the VPS's.
dev_host_memory_bounds_dispatch_loop_memory_max: 3500M
dev_host_memory_bounds_dispatch_loop_memory_max_file: /etc/livespec/factory-dispatch-loop-memory-max

# SWAP. The dev VPS has none, so above a slice's MemoryHigh the anonymous memory
# of its processes cannot be reclaimed and the slice STALLS until it falls back
# under; MemoryMax is the kill line. On a host WITH swap, MemoryHigh reclaims to
# swap first, so how much of a slice may go to swap is a deliberate choice, made
# here for every slice and the reconcile-runs drop-in. 0 keeps their behaviour
# identical to the no-swap host (stall at High, kill at Max) and keeps a
# runaway from pushing the live ledger or the seats into swap. `infinity`
# removes the bound.
dev_host_memory_bounds_memory_swap_max: "0"

# ONE slice for local full-suite gates. With local_gate_slots_limit at 1, one
# `pytest -n 4 --cov` aggregate runs at a time; the slice bounds what it may hold.
dev_host_memory_bounds_gate_slice: local-gate.slice
dev_host_memory_bounds_gate_memory_high: 9G
dev_host_memory_bounds_gate_memory_max: 10G

# --- reconcile-runs ---------------------------------------------------------

# A host drop-in on the orchestrator's reconcile-runs.service timer unit (the
# unit itself is installed by that repository's install.sh and stays
# untouched). MemoryMax is 6G, not 5G, on legacy-dispatcher-agent's
# measurement: one timer pass sat at 3.7G after 4.5 minutes and was still
# growing, and a pass killed at MemoryMax is wasted until the next tick.
# MemoryHigh is 5G, not the first draft's 4G: with no swap a pass held at High
# STALLS, and a stalled oneshot blocks every later tick, so High sits above the
# measured peak (coordinator grade, 2026-11-13). 6G kills only a runaway.
# MEASURED PEAK: 3.7G RSS (16:3xZ, 4.5 min into a pass) and 3.3G (17:1xZ, 5.5
# min in), both on the dev VPS, 2026-11-13; no pass has yet been read to its end.
# WHAT A KILL DOES: the pass dies, systemd records the oneshot as failed
# (Restart=no), and the next timer tick asks the same inventory question again.
# legacy-dispatcher-agent confirms a pass is retry-safe. The cost is one wasted
# pass, which is the reason MemoryMax sits 2G above the measured peak.
dev_host_memory_bounds_reconcile_unit: reconcile-runs.service
dev_host_memory_bounds_reconcile_memory_high: 5G
dev_host_memory_bounds_reconcile_memory_max: 6G

# The OOM-killer preference for reconcile-runs. Restartable work goes first,
# so a pressure event takes a reconcile pass before it takes Dolt or a seat.
dev_host_memory_bounds_reconcile_oom_score_adjust: 500

dev_host_memory_bounds_system_unit_dir: /etc/systemd/system
dev_host_memory_bounds_reconcile_dropin: 50-livespec-memory-bounds.conf
