---
node_status_credential_phase2_dir: "{{ role_path }}/../../../ci-runner/k3s/phase2"
node_status_credential_profiles_dir: "{{ role_path }}/../../../ci-runner/k3s/phase0-bare-metal/profiles"
node_status_credential_profile: "{{ node_status_credential_profiles_dir }}/{{ inventory_hostname }}.env"
node_status_credential_cluster_role: "{{ cluster_role }}"
# The ci_pool server that mints the credential, under its own become, with the
# admin kubeconfig. Resolved from the inventory, exactly as gates_kubeconfig
# resolves its remote_host: the ci_pool member whose cluster_role is server
# (livespec-dev-tooling-prdxxe). Overridable if the pool ever has more than one.
node_status_credential_server_host: >-
  {{ groups['ci_pool'] | map('extract', hostvars)
     | selectattr('cluster_role', 'defined')
     | selectattr('cluster_role', 'equalto', 'server')
     | map(attribute='inventory_hostname') | first }}
node_status_credential_admin_kubeconfig: /etc/rancher/k3s/k3s.yaml
node_status_credential_namespace: ci-runner-node-status
node_status_credential_sa_prefix: node-status-patcher-
node_status_credential_rbac_template: >-
  {{ node_status_credential_phase2_dir }}/node-status-credential/node-status-patch-rbac.yaml
# The k3s configuration directory — the ONE parent this role will create for the
# delivered kubeconfig, exactly as seed-node-status-kubeconfig.sh's rule. Any
# other missing parent is refused rather than manufactured.
node_status_credential_k3s_config_dir: /etc/rancher/k3s
# THE ONE RENDERER of an agent's node-status kubeconfig, and the one the SERVER's
# boot converge already runs (converge-ci-stack.sh step 10d). This role runs it
# on the server rather than templating a second copy of the same credential; see
# the "Render the node-status kubeconfig" task for what that divergence cost
# (livespec-dev-tooling-psqaav). Its token wait is also why this role no longer
# retries the SA token Secret read itself: the renderer waits up to 60 s for the
# token controller to populate it.
node_status_credential_renderer: >-
  {{ node_status_credential_phase2_dir }}/reconstruct/render-sa-kubeconfig.sh
# The API-server address the rendered credential names, CO-MAINTAINED with
# converge-ci-stack.sh's NODE_STATUS_SERVER (which defaults to its GATES_SERVER).
# The two callers of one renderer must pass one address or the agent's credential
# flips endpoint between an apply and a boot, and the delivery below — idempotent
# by content — reports a change every time it flips. It is the TAILNET name the
# API server holds a `tls-san` for (../../../ci-runner/k3s/phase2/k3s-config/config.yaml),
# which is the address the pool's agent has been authenticating with since the
# boot converge began rendering this file; NOT a loopback, which would name the
# reader's own machine, and not the profile's CLUSTER_JOIN_ADDRESS, which the
# server-side converge cannot know.
# Built from the resolved server's inventory name, which is also its MagicDNS
# name on the tailnet, so no machine is named here (livespec-dev-tooling-prdxxe).
node_status_credential_tailnet_domain: perch-rudd.ts.net
node_status_credential_api_server: >-
  https://{{ node_status_credential_server_host }}.{{ node_status_credential_tailnet_domain }}:6443
# The API server's own wordings for a REFUSED credential, as the drift-report
# probe recognises them. Co-maintained with
# ci-runner/k3s/phase2/node-extended-resource/patch-node-churn-capacity.sh's
# CREDENTIAL_REJECTED_RE (and with ../../gates_kubeconfig/files/with-gates-kubeconfig,
# which matches the same framings for the other credential): it is one API
# server rendering through one kubectl, and a report that recognised a different
# set would disagree with the runtime about whether the credential works.
node_status_credential_rejected_pattern: >-
  Unauthorized|asked for the client to provide credentials|You must be logged in|401
# The runtime refresh tool (livespec-dev-tooling-yj25uj) and where it reads its
# pool facts from. Both must agree with the fallbacks the shipped script carries,
# or an un-provisioned host and a converged one would pull from different places.
node_status_credential_refresh_bin: /usr/local/bin/refresh-node-status-kubeconfig
node_status_credential_refresh_env: /etc/ci-runner/node-status-refresh.env
# Where the SERVER's boot converge re-renders each agent's credential, and so the
# directory the refresh tool pulls from. Co-maintained with
# ci-runner/k3s/phase2/reconstruct/converge-ci-stack.sh step 10d; it is the same
# directory that host renders the gates credential into.
node_status_credential_render_dir: /etc/ci-runner
# That directory and the converge's own filename shape, as the ONE path this role
# renders to, slurps from, and hands the runtime refresh tool in its env-file. One
# variable rather than three compositions of the same parts: a disagreement
# between them is a pull that fetches nothing, and it fails closed and silent.
node_status_credential_render_path: >-
  {{ node_status_credential_render_dir }}/node-status-{{ node_status_credential_node }}.kubeconfig
# The AGENT-side login user whose ssh identity reaches the control-plane node.
# The refresh tool runs as root under the reapply unit, and root on a pool node
# has no tailnet ssh identity, so it drops the FETCH to this user via `sudo -u`
# (the WRITE stays root). A pool fact, delivered in the env-file rather than
# baked into the tool; it is the account ansible/inventory/legacy.yml reaches
# these nodes as.
node_status_credential_ssh_user: cwoolley
# The SERVER's ssh HOST key, named as a path on the server rather than as bytes
# committed here: the trust then follows the machine's own key instead of a copy
# that goes stale the first time the key is rotated. ed25519 because it is the
# type the agent's client prefers, so it is the one a connection will actually
# be authenticated with. The refresh reaches the server over the TAILNET, where
# Tailscale SSH answers and presents the server's /etc/ssh/ssh_host_*_key files
# (it reads exactly those paths, per key type, on every connection). The
# server's OpenSSH does NOT use this key: since role lan_ssh_fallback it listens
# only on the LAN at its own port with its own host key under
# /etc/ssh/lan-fallback. So never delete or rotate these /etc/ssh files as
# "unused by OpenSSH": that would change what Tailscale SSH presents and break
# this pin on every agent.
node_status_credential_server_host_key: /etc/ssh/ssh_host_ed25519_key.pub
node_status_credential_server_host_key_type: ssh-ed25519
# The ssh user's OWN known_hosts — the refresh tool fetches as that account, so
# root's trust store is the one file that cannot help it. `~<user>` rather than a
# bare `~`: the module expands it through the password database, so the path is
# that user's home whoever's HOME the become plugin happened to export.
node_status_credential_known_hosts: "~{{ node_status_credential_ssh_user }}/.ssh/known_hosts"
