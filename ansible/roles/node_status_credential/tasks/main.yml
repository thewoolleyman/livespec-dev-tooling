---
# node_status_credential — an AGENT node's scoped churn-slot credential: the
# per-node RBAC (get/patch on nodes/status for ONE named node) minted on the
# server, and the kubeconfig it authenticates with delivered to the agent.
#
# Absorbs ci-runner/k3s/phase2/node-status-credential/provision-node-status-credential.sh
# (the cluster-side mint) and ci-runner/k3s/secret-reinjection/seed-node-status-kubeconfig.sh
# (the delivery) into the GitOps layer. R5 (livespec-dev-tooling-xa6o) built
# those scripts; this role carries them so `just ansible-apply ansible/ci-pool.yml`
# mints and delivers with no attended 1Password step — the GitOps shape the
# gates_kubeconfig role established: read/mint on the SERVER under its own become,
# write on the AGENT under ours, so no ssh identity straddles two accounts.
#
# THE GRANT IS NEVER WIDENED. The RBAC is get/patch on `nodes/status` for ONE
# named node and nothing else (node-status-patch-rbac.yaml) — not `nodes` (whose
# `spec` could untaint the node), not `list`/`watch` (not restrictable by
# resourceNames), not `delete`. This role renders and applies that file
# unchanged; it adds no verb, resource or node.
#
# THE BOOT STALENESS IS NOW SELF-HEALING, and this role installs the half that
# heals it. poweredge's k3s datastore is tmpfs
# (ci-runner/k3s/phase2/datastore-tmpfs/), so at EVERY poweredge boot the
# ServiceAccount and its token Secret are recreated and a previously delivered
# kubeconfig is REJECTED ("the server has asked for the client to provide
# credentials"). That used to need an operator: re-applying this role WAS the
# re-seed path, and the follow-up this comment promised is
# livespec-dev-tooling-yj25uj. It landed as two halves, neither of which an
# operator drives:
#
#   * the control-plane node's boot converge
#     (ci-runner/k3s/phase2/reconstruct/converge-ci-stack.sh step 10d) re-applies
#     every agent's per-node RBAC and re-renders that agent's kubeconfig to
#     /etc/ci-runner/node-status-<node>.kubeconfig — the half no agent can
#     perform, because the grant deliberately reaches nothing but one node's
#     status;
#   * ./files/refresh-node-status-kubeconfig, installed on the agent below, pulls
#     that render, and ci-runner/k3s/phase2/node-extended-resource/patch-node-churn-capacity.sh
#     invokes it ONCE on a rejection and retries — the gates credential's
#     pull-on-rejection pattern (../../gates_kubeconfig/files/with-gates-kubeconfig).
#
# Re-applying this role is still the ROTATION path and still the first install;
# it is no longer the reboot repair.
#
# AGENT-ONLY. A server patches node status through its own admin kubeconfig and
# needs no narrow credential; minting one for it would be a second long-lived
# token on the machine that holds the unrestricted one. The block below is gated
# on the role, and the asserts restate the seed script's two refusals.

- name: Mint and deliver this agent's node-status credential
  when: node_status_credential_cluster_role == 'agent'
  block:
    - name: Read this agent's committed phase0 profile
      # regex_findall | first, NOT regex_search(..., '\1'): with a group argument
      # regex_search returns a LIST (['x'], not 'x'), so every scalar compare below
      # would fail; a missing key yields '' and still fails the assertion.
      ansible.builtin.set_fact:
        node_status_credential_node: >-
          {{ _nsc_profile_text | regex_findall('^NODE_NAME=(.*)$', multiline=True) | first | default('') }}
        node_status_credential_role: >-
          {{ _nsc_profile_text | regex_findall('^CLUSTER_ROLE=(.*)$', multiline=True) | first | default('') }}
        node_status_credential_api: >-
          {{ _nsc_profile_text | regex_findall('^CLUSTER_JOIN_ADDRESS=(.*)$', multiline=True) | first | default('') }}
        node_status_credential_target: >-
          {{ _nsc_profile_text | regex_findall('^CHURN_KUBECONFIG_FILE=(.*)$', multiline=True) | first | default('') }}
      vars:
        _nsc_profile_text: "{{ lookup('ansible.builtin.file', node_status_credential_profile) }}"

    - name: Refuse a profile that is not this agent, names no target, or names the admin file
      # The seed script's refusals, restated: the profile is this node's and an
      # agent's; CHURN_KUBECONFIG_FILE is non-empty; and it is NOT the server's
      # admin kubeconfig (writing the narrow credential under that name would make
      # cluster-admin and this indistinguishable by path).
      #
      # CLUSTER_JOIN_ADDRESS is asserted as a PROFILE-SHAPE check and nothing more.
      # It used to be the `server:` this role's own template wrote, which is half
      # of why the role and the server's boot converge rendered the same credential
      # differently; the rendered address is now
      # node_status_credential_api_server, co-maintained with the converge's. A
      # profile that names no join address is still not an agent profile.
      ansible.builtin.assert:
        that:
          - node_status_credential_node == inventory_hostname
          - node_status_credential_role == 'agent'
          - node_status_credential_api | length > 0
          - node_status_credential_target | length > 0
          - node_status_credential_target != node_status_credential_admin_kubeconfig
        fail_msg: >-
          profile {{ node_status_credential_profile }} must name this agent, carry a
          non-empty CHURN_KUBECONFIG_FILE and a CLUSTER_JOIN_ADDRESS, and its
          CHURN_KUBECONFIG_FILE must not be the server admin file
          {{ node_status_credential_admin_kubeconfig }}
        success_msg: "{{ inventory_hostname }}: node-status credential target {{ node_status_credential_target }}"

    - name: Probe whether the API server still accepts the delivered node-status credential
      # THE ONE TASK IN THIS ROLE A DRIFT REPORT CAN LEARN ANYTHING FROM, and it
      # is a READ. Everything that re-mints and re-renders this credential is a
      # command, a shell or a script guarded on their results: under `--check`
      # the mint and the render below are SKIPPED (ansible cannot know whether
      # running them would mutate anything), so on a not-yet-converged agent the
      # server holds no rendering to read and the delivery skips on its
      # non-empty-content guard. So
      # `just ansible-drift ansible/ci-pool.yml` reported `changed=0` over an
      # agent whose credential nothing accepted — measured 2026-10-12 at 04:26Z
      # on gmktec-xubuntu (livespec-dev-tooling-ewjby3), while the node
      # advertised no churn-slot capacity at all. Nothing in the play was wrong;
      # nothing in it could speak.
      #
      # `check_mode: false` so the read runs during the report rather than being
      # skipped with the writes it reports for, and `failed_when: false` because a
      # refused credential is the state this role REPAIRS — aborting here would
      # stop the play before the repair it is reporting.
      #
      # THE SAME READ THE RUNTIME MAKES, so the report and the reapply timer
      # agree about what "accepted" means: `get --subresource=status`, never a
      # bare `get node`. The grant reaches `nodes/status` only — deliberately, so
      # it cannot touch `spec` and untaint the node — so a bare read 403s even
      # with a credential the server accepts. See
      # ../../../ci-runner/k3s/phase2/node-extended-resource/patch-node-churn-capacity.sh.
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - --subresource=status
          - node
          - "{{ node_status_credential_node }}"
      environment:
        KUBECONFIG: "{{ node_status_credential_target }}"
      become: true
      register: node_status_credential_probe
      check_mode: false
      failed_when: false
      # MATCHED ON THE MESSAGE, not on the exit status alone, and on the same
      # wording set the runtime patch script matches: a non-zero probe can mean
      # many things and only one of them is the credential being refused. An
      # unreachable API server or a node still registering is not a change this
      # role would make on an apply, and a probe that reported one would replace
      # a report silent about real drift with one noisy about none.
      changed_when: >-
        node_status_credential_probe.rc != 0
        and (node_status_credential_probe.stderr
        | regex_search(node_status_credential_rejected_pattern, ignorecase=True)) is not none

    - name: Select the ServiceAccount and its token Secret name
      ansible.builtin.set_fact:
        node_status_credential_sa: "{{ node_status_credential_sa_prefix }}{{ node_status_credential_node }}"

    - name: Apply the per-node RBAC on the server
      # The fleet converge shape: validate and default LOCALLY first, so a
      # malformed render is rejected before any object reaches the cluster, then
      # apply. Run on the SERVER (delegate_to) under its admin kubeconfig. The
      # rendered RBAC is the committed template with the node name substituted;
      # the grant is not widened. noqa command-instead-of-module: no kubernetes
      # collection is vendored in this tree, and the dry-run|apply pipeline is the
      # exact fleet idempotence shape.
      ansible.builtin.shell:
        cmd: set -o pipefail && kubectl apply --dry-run=client -o yaml -f - | kubectl apply -f -
        executable: /bin/bash
        stdin: >-
          {{ lookup('ansible.builtin.file', node_status_credential_rbac_template)
          | replace('NODE_NAME_PLACEHOLDER', node_status_credential_node) }}
      delegate_to: "{{ node_status_credential_server_host }}"
      become: true
      environment:
        KUBECONFIG: "{{ node_status_credential_admin_kubeconfig }}"
      register: node_status_credential_rbac_apply
      changed_when: >-
        'created' in node_status_credential_rbac_apply.stdout
        or 'configured' in node_status_credential_rbac_apply.stdout

    - name: Render the node-status kubeconfig
      # ONE RENDERER, and it is the one the SERVER's boot converge already runs
      # (../../../ci-runner/k3s/phase2/reconstruct/render-sa-kubeconfig.sh, called
      # from converge-ci-stack.sh step 10d). This task used to be a `set_fact`
      # carrying a SECOND template of the same credential — cluster `ci-runner`,
      # users before contexts, indented lists, and the agent profile's
      # CLUSTER_JOIN_ADDRESS as the `server:` — beside the converge's cluster
      # `k3s`, contexts before users, unindented lists and tailnet address. Its
      # comment claimed to mirror provision-node-status-credential.sh "exactly"
      # and mirrored nothing the pool actually ran.
      #
      # THE DIVERGENCE MADE A CLEAN DRIFT REPORT IMPOSSIBLE. After every
      # poweredge-xubuntu reboot the agent's five-minute timer pulls the SERVER's
      # rendering (./files/refresh-node-status-kubeconfig), so the agent holds the
      # converge's bytes; the delivery below is idempotent by CONTENT, so it then
      # reported a change although the credential was the same one. Measured
      # 2026-10-12 after the 11:58Z reboot: /etc/rancher/k3s/node-status-kubeconfig
      # on gmktec-xubuntu and /etc/ci-runner/node-status-gmktec-xubuntu.kubeconfig
      # on poweredge-xubuntu had the same sha256 and
      # `just ansible-drift ansible/ci-pool.yml` still reported
      # `gmktec-xubuntu changed=1` on that one task (livespec-dev-tooling-psqaav).
      #
      # SO THE ROLE RENDERS NOTHING ITSELF. It runs the converge's renderer on the
      # SERVER, into the SAME path that converge renders to, and delivers THOSE
      # bytes below. `ansible.builtin.script` rather than a copied-then-run file:
      # the script is transferred for this invocation and nothing of it is left
      # behind to go stale against the committed copy.
      #
      # THE RENDERER IS ALSO THE ONE CLUSTER-CA READ NOW. It reads the token
      # Secret's `ca.crt` with the jsonpath escaped (the defect f7dc420f fixed in
      # this role's own copy of that read) and FATALs rather than writing an empty
      # `certificate-authority-data` — the refusal the removed "Refuse an empty
      # cluster CA" assert stated. The kube-root-ca.crt ConfigMap fallback added
      # with that fix was defensive cover for the jsonpath defect and was never
      # reached: the measured Secret carries ca.crt, and the converge has rendered
      # through this single CA source on every boot since.
      ansible.builtin.script:
        cmd: >-
          {{ node_status_credential_renderer }}
          --namespace {{ node_status_credential_namespace }}
          --secret {{ node_status_credential_sa }}
          --user {{ node_status_credential_sa }}
          --dest {{ node_status_credential_render_path }}
          --server {{ node_status_credential_api_server }}
          --group root
          --mode 0600
      delegate_to: "{{ node_status_credential_server_host }}"
      become: true
      environment:
        KUBECONFIG: "{{ node_status_credential_admin_kubeconfig }}"
      # NOT a change of its own. The render re-derives the file from the cluster's
      # live state on every apply, so it writes unconditionally and cannot know
      # whether the BYTES moved; the change an operator can act on is whether the
      # agent's delivered credential differs, which the content-idempotent copy
      # below reports exactly. Reporting this task as changed on every apply would
      # leave the role permanently dirty, and the drift report's whole value is
      # that a clean run means something.
      changed_when: false

    - name: Read the server's rendering of this agent's node-status kubeconfig
      # The gates credential's shape (../../gates_kubeconfig/tasks/main.yml): the
      # read happens on the SERVER under its own become, the write on the AGENT
      # under ours, so no ssh identity straddles two accounts. Delivering THESE
      # bytes rather than re-templating them is what makes the agent's copy and
      # the server's byte-identical by construction instead of by agreement
      # between two renderers.
      #
      # check_mode:false so the drift report reads the server's current rendering
      # rather than skipping it and reporting the delivery against nothing, and
      # failed_when:false because an absent render is the not-yet-converged state
      # this role creates — under `--check` the render above is skipped (a script
      # task cannot run in check mode), so on a first drift report there is no
      # file to read and the delivery must skip rather than crash the play.
      ansible.builtin.slurp:
        src: "{{ node_status_credential_render_path }}"
      delegate_to: "{{ node_status_credential_server_host }}"
      become: true
      register: node_status_credential_rendered
      changed_when: false
      check_mode: false
      failed_when: false
      no_log: true

    - name: Refuse a server rendering that is not a kubeconfig
      # The refresh tool's refusal and the gates role's, restated where the
      # playbook delivers: a truthful-looking but malformed answer is worse than a
      # failure, because it would overwrite a good credential with a useless one
      # and the next rejection would be unrecoverable rather than self-healing.
      ansible.builtin.assert:
        that:
          - "'kind: Config' in (node_status_credential_rendered.content | b64decode)"
          - "'server:' in (node_status_credential_rendered.content | b64decode)"
        fail_msg: >-
          {{ node_status_credential_server_host }}:{{ node_status_credential_render_path }}
          is not a kubeconfig — refusing to overwrite {{ node_status_credential_target }}
        success_msg: >-
          {{ node_status_credential_server_host }} holds a kubeconfig for
          {{ node_status_credential_sa }}
      when: node_status_credential_rendered.content | default('') | length > 0

    - name: Check the delivery parent directory on the agent
      ansible.builtin.stat:
        path: "{{ node_status_credential_target | dirname }}"
      register: node_status_credential_parent
      become: true

    - name: Refuse an arbitrary missing parent for the credential
      # The seed script's rule: the ONLY missing parent this creates is the k3s
      # configuration directory (or a path beneath it). Any other absent parent is
      # a mistyped CHURN_KUBECONFIG_FILE and is refused rather than manufactured.
      ansible.builtin.assert:
        that:
          - >-
            node_status_credential_parent.stat.exists
            or node_status_credential_target | dirname == node_status_credential_k3s_config_dir
            or node_status_credential_target is match(node_status_credential_k3s_config_dir ~ '/')
        fail_msg: >-
          {{ node_status_credential_target }} names parent
          '{{ node_status_credential_target | dirname }}', which is absent and is not the
          k3s configuration directory {{ node_status_credential_k3s_config_dir }} — refusing
          to manufacture a directory tree for a possibly mistyped path
        success_msg: "parent {{ node_status_credential_target | dirname }} is acceptable"

    - name: Create the k3s configuration directory on the agent if absent
      ansible.builtin.file:
        path: "{{ node_status_credential_target | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true
      when: not node_status_credential_parent.stat.exists

    - name: Deliver the node-status kubeconfig to the agent
      # 0600 root:root, the same mode the seed script writes, the renderer gives
      # its own output on the server, and the refresh tool reproduces on a pull —
      # so no path to this file ever widens what another wrote. no_log: bearer
      # token. Idempotent by content, which is now a property worth having: the
      # bytes are the SERVER's rendering verbatim, so an agent whose five-minute
      # timer already pulled them reports no change.
      ansible.builtin.copy:
        content: "{{ node_status_credential_rendered.content | b64decode }}"
        dest: "{{ node_status_credential_target }}"
        owner: root
        group: root
        mode: "0600"
      become: true
      no_log: true
      when: node_status_credential_rendered.content | default('') | length > 0

    - name: Create the credential-tooling directory on the agent
      # Explicit, because --check cannot see past a missing parent: with the
      # directory absent the env-file copy below would be reported as a would-be
      # change and fail only on a real apply. The gates_kubeconfig role creates its
      # own for the same reason.
      ansible.builtin.file:
        path: "{{ node_status_credential_refresh_env | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Install the node-status credential refresh tool on the agent
      # This stays shell because it is a RUNTIME tool, not provisioning: the churn
      # -slot patch script invokes it on a rejection in the middle of a timer fire,
      # long after any playbook has exited. The role owns its installation; it does
      # not own its behaviour. Exactly what gates_kubeconfig does with
      # refresh-gates-kubeconfig.
      ansible.builtin.copy:
        src: refresh-node-status-kubeconfig
        dest: "{{ node_status_credential_refresh_bin }}"
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Install the refresh tool's pool-facts env-file
      # The node's own name, the host that renders its credential, the path that
      # render lands at and the path this node reads are per-node or per-pool DATA,
      # delivered here rather than baked into the shipped script — the same
      # delivery the gates refresh tool's ssh identity takes. Baked in, a second
      # pool node would need a second script.
      #
      # NOT no_log, and mode 0644 on purpose: this file carries node names, a
      # hostname, two paths and a login account, and never a secret. The credential
      # itself is the 0600 file above.
      #
      # NODE_STATUS_REMOTE_KUBECONFIG is the SAME variable the render above writes
      # to and the read above slurps, not a second spelling of that path: the
      # runtime pull and the playbook delivery fetch the one file, so a drift
      # between them cannot be introduced by editing one of two literals.
      ansible.builtin.copy:
        content: |
          # Written by the node_status_credential Ansible role. Read by
          # refresh-node-status-kubeconfig at runtime. Carries no secret.
          NODE_STATUS_NODE_NAME={{ node_status_credential_node }}
          NODE_STATUS_REMOTE_HOST={{ node_status_credential_server_host }}
          NODE_STATUS_REMOTE_KUBECONFIG={{ node_status_credential_render_path }}
          NODE_STATUS_KUBECONFIG={{ node_status_credential_target }}
          NODE_STATUS_SSH_USER={{ node_status_credential_ssh_user }}
        dest: "{{ node_status_credential_refresh_env }}"
        owner: root
        group: root
        mode: "0644"
      become: true

    # THE FETCH ALSO NEEDS THE SERVER TO BE AUTHENTICATED, and nothing provisioned
    # that. The tasks below close the gap livespec-dev-tooling-cehlmt
    # measured on 2026-10-12: on gmktec-xubuntu, as cwoolley, the ssh key and the
    # sudo grant were both in place and `ssh -o BatchMode=yes poweredge-xubuntu`
    # still died with "Host key verification failed". The refresh runs under
    # BatchMode from a root systemd unit mid-timer-fire, so an unknown host key is
    # not a prompt to answer — it is a failure, and it would arrive on the first
    # poweredge reboot after this credential was delivered, which is exactly when
    # the refresh is the repair.

    - name: Read the control-plane node's ssh host key on the server itself
      # DELEGATED, so what becomes trust is the SERVER's own key rather than
      # whatever answered to its name during the apply. The control node already
      # authenticates to both machines, so this read inherits that authentication.
      # The alternative an agent could perform unaided is trust-on-first-use
      # (`ssh-keyscan`, or the client's `StrictHostKeyChecking=accept-new`), which
      # believes the first answer it gets and therefore authenticates nothing on
      # the one run that matters.
      #
      # NO become: an ssh host PUBLIC key is world-readable by design, and asking
      # for privilege a read does not need is how a role acquires a sudo
      # dependency it never had. `changed_when: false` because a read that reports
      # itself as a change leaves the role permanently dirty, and the drift
      # report's whole value is that a clean run means something.
      ansible.builtin.slurp:
        src: "{{ node_status_credential_server_host_key }}"
      delegate_to: "{{ node_status_credential_server_host }}"
      register: node_status_credential_server_host_key_read
      changed_when: false

    - name: Select the server's host-key line
      # Decoded once here rather than in both the refusal and the trust below: two
      # spellings of one decode are two places for the `| trim` to go missing, and
      # a key field carrying a trailing newline is an entry ssh cannot match.
      ansible.builtin.set_fact:
        node_status_credential_host_key: >-
          {{ node_status_credential_server_host_key_read.content | default('') | b64decode | trim }}

    - name: Refuse a host key that is not an ed25519 public key
      # The empty-CA refusal above, pointed at the other thing this role must not
      # deliver silently. A known_hosts line whose key field is empty or
      # wrong-typed is an entry ssh declines to match, so the agent would still
      # fail host-key verification — after a converge that reported success.
      ansible.builtin.assert:
        that:
          - node_status_credential_host_key | length > 0
          - >-
            node_status_credential_host_key.split(' ') | first
            == node_status_credential_server_host_key_type
        fail_msg: >-
          {{ node_status_credential_server_host }}:{{ node_status_credential_server_host_key }}
          did not read back as a {{ node_status_credential_server_host_key_type }} public key —
          refusing to install a known_hosts entry ssh cannot match
        success_msg: >-
          {{ node_status_credential_server_host }} offers a
          {{ node_status_credential_server_host_key_type }} host key

    - name: Create the ssh user's ssh directory on the agent
      # Explicit, for the reason the credential-tooling directory above is
      # explicit and one more: the known_hosts module stages its replacement
      # inside the DESTINATION's own directory and renames it over the
      # destination, so an absent ~/.ssh fails the apply rather than being
      # created. 0700 because ssh ignores the contents of a group- or
      # world-writable ~/.ssh, which would install trust the client declines to
      # read.
      ansible.builtin.file:
        path: "{{ node_status_credential_known_hosts | dirname }}"
        state: directory
        mode: "0700"
      become: true
      become_user: "{{ node_status_credential_ssh_user }}"

    - name: Trust the control-plane node's host key for the refresh tool's ssh user
      # THE SSH USER's known_hosts, never root's: the tool runs as root and drops
      # the fetch to this account via `sudo -u`, so root's trust store is the one
      # file that cannot help it.
      #
      # Under the host NAME, because that is the literal the shipped tool passes
      # to ssh and known_hosts is matched on the name given rather than on
      # anything it resolves to. `key:` opens with that same name because a
      # known_hosts line's FIRST FIELD is the host it authenticates; the module
      # requires the two to agree, and a mismatch installs an entry ssh will never
      # consult.
      #
      # Idempotent by content — the module reconciles the entry rather than
      # appending one, so a re-apply against an unchanged server key reports no
      # change. An appended line would accumulate a duplicate on every apply.
      ansible.builtin.known_hosts:
        name: "{{ node_status_credential_server_host }}"
        key: "{{ node_status_credential_server_host }} {{ node_status_credential_host_key }}"
        path: "{{ node_status_credential_known_hosts }}"
        state: present
      become: true
      become_user: "{{ node_status_credential_ssh_user }}"
