---
# Defaults for codex_config.
#
# USER SCOPE, and the installer it replaces went out of its way to say so: it
# refuses to run under sudo or as any account but the host's Codex operator,
# because ~/.codex/config.toml is that account's file and running it elsewhere
# would silently configure the wrong account.
#
# The operator account is per-host: it is `ubuntu` on the vps and `cwoolley` on
# the other three legacy machines, so HOST_VARS.md carries the value and this
# default exists only so the variable is never undefined.
codex_config_user: ubuntu

# The Codex feature to enable. It exposes Codex's native request_user_input
# picker to interactive Default-mode sessions. A skill can tell Codex to call a
# tool, but cannot make an unavailable tool appear in the model's tool set, so
# the feature has to be on before any Default-mode skill can depend on it.
codex_config_feature: default_mode_request_user_input

# What `codex features list` prints in the final column for an enabled feature.
codex_config_enabled_state: "true"

# The released Codex Driver owns this definition.  Host provisioning copies it
# into the operator's user-unit directory rather than maintaining a second
# ExecStart here, so a Driver update changes one canonical unit definition.
#
# The unit's ExecStart runs the observer from this staged directory
# (%h/.local/share/livespec-driver-codex/dev-tooling/), and nothing else puts
# the Driver's dev-tooling there: ensure-codex-plugins only registers the
# marketplace plugins.  The role therefore stages the Driver's `release` ref
# (the same ref ensure-codex-plugins registers) at that path before it reads
# the unit definition from it.
codex_config_observer_driver_repo: https://github.com/thewoolleyman/livespec-driver-codex.git
codex_config_observer_driver_version: release
codex_config_observer_driver_dir: "{{ ansible_env.HOME }}/.local/share/livespec-driver-codex"
codex_config_observer_unit_name: livespec-codex-hook-cache-observer.service
codex_config_observer_unit_source: "{{ ansible_env.HOME }}/.local/share/livespec-driver-codex/dev-tooling/livespec-codex-hook-cache-observer.service"
codex_config_observer_unit_dir: "{{ ansible_env.HOME }}/.config/systemd/user"
codex_config_observer_unit_dest: "{{ ansible_env.HOME }}/.config/systemd/user/livespec-codex-hook-cache-observer.service"
codex_config_user_runtime_dir: "/run/user/{{ ansible_facts['user_uid'] }}"
