---
# fabro_factory_registry — render `/etc/livespec/fabro-factories.json`, the file
# that tells a natively-running Dispatcher which Fabro server instance answers
# to each logical factory name.
#
# WHY THIS IS A ROLE. The maintainer ruled on 2026-10-15 (plan
# `petri-factory-on-gmktec`, epic `bd-ib-fyozyd`) that no playbook, role or
# committed factory entry may name a machine hostname, and that a factory is
# bound to a machine only in the gitops inventory. A repository's
# `dispatcher.factories` entry may therefore declare `"registry": true` and
# carry no address at all (livespec-orchestrator-beads-fabro `contracts.md`
# §"Factory addresses resolved from a host registry"); the address it resolves
# by name comes from this file. Moving a factory from one instance to another
# is then a change to `fabro_factory_registry` plus this converge, and the
# Kubernetes move that is already planned changes no repository.
#
# THE INVENTORY IS THE SINGLE DECLARATION. The mapping lives once, in
# `ansible/inventory/group_vars/dev_hosts.yml`, and this role resolves it
# through `hostvars`: a factory's instance may live on ANY inventory host, not
# only on a host in the group this role runs on, which is why the entry names
# the host rather than being scanned out of one group's host_vars.
#
# REFUSED BEFORE WRITING, ON EVERY HOST. The validation below is one block with
# `any_errors_fatal`, so a registry no host can resolve ends the play while
# every host's file is still untouched. That ordering is the specification's
# ("MUST refuse, before it writes the registry on any host") and not merely a
# per-host failure: the mapping is declared at the GROUP level, so an
# unresolvable entry is unresolvable everywhere, and a run that wrote it on the
# hosts it reached first would leave the fleet half-converged onto a registry
# the maintainer never meant.

- name: Refuse an unresolvable Fabro factory before any host writes a registry
  any_errors_fatal: true
  block:
    - name: Refuse a Fabro factory whose name is blank
      ansible.builtin.assert:
        that:
          - item.key is string
          - (item.key | trim | length) > 0
        fail_msg: >-
          fabro_factory_registry declares the factory {{ item.key | to_json }},
          whose name is not a string that is non-empty once surrounding
          whitespace is removed. The factory name is what a repository's
          dispatcher.factories entry is resolved BY, so a blank one names
          nothing.
        success_msg: the factory {{ item.key }} has a usable name
      loop: "{{ fabro_factory_registry_entries }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Refuse a Fabro factory whose host is not an inventory host
      ansible.builtin.assert:
        that:
          - (item.value.host | default('')) in groups['all']
        fail_msg: >-
          the factory {{ item.key }} names the host
          {{ item.value.host | default('') | to_json }}, which this inventory
          does not declare. A factory is bound to a machine only in the
          inventory, so its host must be the inventory name of the host that
          serves it.
        success_msg: the factory {{ item.key }} names an inventory host
      loop: "{{ fabro_factory_registry_entries }}"
      loop_control:
        label: "{{ item.key }}"

    # Ordered after the host check on purpose: `hostvars[...]` below is only
    # meaningful once the host is known to exist, and `any_errors_fatal` has
    # already ended the play by the time this task would have resolved it.
    - name: Refuse a Fabro factory whose unit_name matches no instance on its host
      ansible.builtin.assert:
        that:
          - >-
            (hostvars[item.value.host].fabro_server_instances | default([])
             | selectattr('unit_name', 'equalto', item.value.unit_name | default(''))
             | list | length) > 0
        fail_msg: >-
          the factory {{ item.key }} names the unit
          {{ item.value.unit_name | default('') | to_json }} on the host
          {{ item.value.host }}, whose fabro_server_instances declares no
          mapping with that unit_name. A factory names ONE Fabro server
          instance, and that instance is where its address comes from.
        success_msg: the factory {{ item.key }} matches an instance on its host
      loop: "{{ fabro_factory_registry_entries }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Refuse a Fabro factory whose instance has no canonical host
      ansible.builtin.assert:
        that:
          - >-
            (((hostvars[item.value.host].fabro_server_instances
               | selectattr('unit_name', 'equalto', item.value.unit_name)
               | first).canonical_host | default('')) | trim | length) > 0
        fail_msg: >-
          the factory {{ item.key }} matches the unit {{ item.value.unit_name }}
          on the host {{ item.value.host }}, whose canonical_host is not a
          string that is non-empty once surrounding whitespace is removed. The
          server address is https:// followed by that value, so a blank one
          would publish the scheme and nothing else.
        success_msg: the factory {{ item.key }} resolves to a canonical host
      loop: "{{ fabro_factory_registry_entries }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Refuse a Fabro factory whose resolved instance declares no concurrency limit
      ansible.builtin.assert:
        that:
          - >-
            ((hostvars[item.value.host].fabro_server_instances
              | selectattr('unit_name', 'equalto', item.value.unit_name)
              | first).max_concurrent_runs) is defined
        fail_msg: >-
          the factory {{ item.key }} resolves to the unit {{ item.value.unit_name }}
          on {{ item.value.host }}, whose fabro_server_instances mapping declares
          no max_concurrent_runs. The fleet launcher limit must be rendered from
          the same declared value that the Fabro server settings use.
        success_msg: the factory {{ item.key }} resolves to a declared concurrency limit
      loop: "{{ fabro_factory_registry_entries }}"
      loop_control:
        label: "{{ item.key }}"

    - name: Refuse a Fabro factory whose docker_host is blank
      ansible.builtin.assert:
        that:
          - item.value.docker_host is string
          - (item.value.docker_host | trim | length) > 0
        fail_msg: >-
          the factory {{ item.key }} declares the docker_host
          {{ item.value.docker_host | to_json }}, which is not a string that is
          non-empty once surrounding whitespace is removed. docker_host is
          OPTIONAL — a factory whose container daemon has no address declares
          none at all rather than declaring an empty one.
        success_msg: the factory {{ item.key }} declares a usable docker_host
      loop: "{{ fabro_factory_registry_entries }}"
      loop_control:
        label: "{{ item.key }}"
      when: item.value.docker_host is defined

# Accumulated rather than built in one expression because Jinja has no way to
# map a per-entry derivation over a mapping without a loop, and an accumulator
# fed by `combine` keeps the derivation itself a pure expression: each
# iteration re-reads the fact the previous one set and adds exactly one entry.
- name: Start this host's Fabro factory registry empty
  ansible.builtin.set_fact:
    fabro_factory_registry_resolved: {}

- name: Resolve each declared Fabro factory to its instance's address
  ansible.builtin.set_fact:
    fabro_factory_registry_resolved: >-
      {{ fabro_factory_registry_resolved | combine({
           item.key: {
             'server': 'https://' ~ ((hostvars[item.value.host].fabro_server_instances
                                      | selectattr('unit_name', 'equalto', item.value.unit_name)
                                      | first).canonical_host | trim)
           } | combine({'docker_host': item.value.docker_host | trim}
                       if item.value.docker_host is defined else {})
         }) }}
  loop: "{{ fabro_factory_registry_entries }}"
  loop_control:
    label: "{{ item.key }}"

- name: Create the directory this host's Fabro factory registry lives in
  ansible.builtin.file:
    path: "{{ fabro_factory_registry_dest | dirname }}"
    state: directory
    owner: "{{ fabro_factory_registry_owner }}"
    group: "{{ fabro_factory_registry_group }}"
    mode: "0755"
  become: true

# WHOLE-FILE, which is what makes an entry the inventory no longer declares
# disappear: the content is the derived mapping and nothing else, so a converge
# that runs this task leaves the file holding exactly what the inventory says.
# World-readable because the Dispatcher reads it as the operator, and it holds
# no secret — only names and addresses that are already in the inventory.
#
# The dest is `fabro_factory_registry_dest`, defaulting to the path the
# specification names; see `defaults/main.yml` for why it is a variable.
- name: Install this host's Fabro factory registry
  ansible.builtin.copy:
    content: "{{ fabro_factory_registry_resolved | to_nice_json }}\n"
    dest: "{{ fabro_factory_registry_dest }}"
    owner: "{{ fabro_factory_registry_owner }}"
    group: "{{ fabro_factory_registry_group }}"
    mode: "0644"
  become: true

- name: Create the directory this host's Fabro fleet limits live in
  ansible.builtin.file:
    path: "{{ fabro_factory_registry_limits_dir }}"
    state: directory
    owner: "{{ fabro_factory_registry_owner }}"
    group: "{{ fabro_factory_registry_group }}"
    mode: "0755"
  become: true

- name: Install each Fabro factory's fleet limit
  ansible.builtin.template:
    src: max_concurrent_runs.j2
    dest: "{{ fabro_factory_registry_limits_dir }}/{{ item.key }}.max_concurrent_runs"
    owner: "{{ fabro_factory_registry_owner }}"
    group: "{{ fabro_factory_registry_group }}"
    mode: "0644"
  become: true
  loop: "{{ fabro_factory_registry_entries }}"
  loop_control:
    label: "{{ item.key }}"

# THE CLIENT LOGINS. The Dispatcher on this host reads each registered factory's
# board with this host's Fabro client, which needs a dev-token login per server
# in the client user's ~/.fabro/auth.json. Logins used to be made by hand, so a
# newly registered factory (the arm64 container workers' homelab-worker-arm64,
# 2026-11-09) was unreadable until someone remembered to log in, and an
# enrolled, unreadable board fails every launcher closed. Each login is derived
# here from the instance's own FABRO_DEV_TOKEN, an EXISTING secret the
# fabro_server role generated on that instance's host; nothing new is created.
# The token is read on its own host and handed to the merge on stdin, so it is
# in no argv, no environment and no logged variable (no_log on both tasks).
# The entry has the shape `fabro auth login --dev-token` writes, and an entry
# already carrying the current token is left untouched.
- name: Read each registered factory's dev token on its own host
  ansible.builtin.slurp:
    src: >-
      {{ (hostvars[item.value.host].fabro_server_instances
          | selectattr('unit_name', 'equalto', item.value.unit_name)
          | first).home_dir }}/storage/server.env
  delegate_to: "{{ item.value.host }}"
  become: true
  register: fabro_factory_registry_server_envs
  no_log: true
  loop: "{{ fabro_factory_registry_entries }}"
  loop_control:
    label: "{{ item.key }}"
  when: fabro_factory_registry_client_login | bool

- name: Log this host's Fabro client in to each registered factory
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import datetime, json, os, sys, tempfile
        url = os.environ["FABRO_SERVER"]
        tokens = [line.split("=", 1)[1].strip() for line in sys.stdin if line.startswith("FABRO_DEV_TOKEN=")]
        if not tokens:
            raise SystemExit("the instance's server.env carries no FABRO_DEV_TOKEN")
        token = tokens[-1]
        store = os.path.join(os.environ["HOME"], ".fabro", "auth.json")
        data = {"servers": {}}
        if os.path.exists(store):
            with open(store, encoding="utf-8") as current:
                data = json.load(current)
        entry = data.setdefault("servers", {}).get(url) or {}
        if entry.get("kind") == "dev-token" and entry.get("token") == token:
            print("unchanged")
            raise SystemExit(0)
        now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
        data["servers"][url] = {"kind": "dev-token", "logged_in_at": now, "token": token}
        os.makedirs(os.path.dirname(store), mode=0o700, exist_ok=True)
        if os.path.exists(store):
            # The revert: restore this copy (and drop these tasks).
            stamp = now.replace(":", "")
            with open(store, "rb") as current, open(store + ".bak-" + stamp, "wb") as backup:
                backup.write(current.read())
            os.chmod(store + ".bak-" + stamp, 0o600)
        handle, staged = tempfile.mkstemp(dir=os.path.dirname(store))
        with os.fdopen(handle, "w", encoding="utf-8") as out:
            json.dump(data, out, indent=2)
        os.chmod(staged, 0o600)
        os.replace(staged, store)
        print("changed")
    stdin: "{{ item.content | b64decode }}"
  environment:
    HOME: "{{ fabro_factory_registry_client_home }}"
    FABRO_SERVER: "{{ fabro_factory_registry_resolved[item.item.key].server }}"
  become: true
  become_user: "{{ fabro_factory_registry_client_user }}"
  register: fabro_factory_registry_client_logins
  changed_when: fabro_factory_registry_client_logins.stdout == 'changed'
  no_log: true
  loop: "{{ fabro_factory_registry_server_envs.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - fabro_factory_registry_client_login | bool
    - item.content is defined
