---
# homelab_worker_window -- see ansible/homelab-worker-window.yml.
homelab_worker_window_action: ""
homelab_worker_window_confirm: ""
homelab_worker_window_node_confirm: ""
homelab_worker_window_actions: [preflight, snapshot, join, drill, check, revert, remove]

# The delivered release directory (role homelab_worker_scripts).
homelab_worker_window_release_dir: /Users/cwoolley/homelab-worker-release/current
homelab_worker_window_state_dir: /Users/cwoolley/homelab-worker-release/window
homelab_worker_window_node: "{{ inventory_hostname }}-homelab-worker"

# The PATH the scripts need: limactl, kubectl, python3 (Homebrew), and the
# kubectl shim directory the route makes when no kubeconfig is given.
homelab_worker_window_path: /opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

# kubectl route. A non-empty kubeconfig is exported as KUBECONFIG and the
# kubectl on PATH is used. Otherwise `kubectl` is a shim to remote-kubectl.sh,
# which needs the API server node's ssh target.
homelab_worker_window_kubeconfig: ""
homelab_worker_window_remote_kubectl_target: ""

homelab_worker_window_api_server: ""
# The cluster CA for join --server-ca: an inline PEM from inventory, else read
# from the cluster (kubectl config view --raw --minify) through the same route.
homelab_worker_window_server_ca_pem: ""

homelab_worker_window_bound_seconds: 600

# The Mac-side commands the route needs, measured by grep over
# homelab-worker/*.sh and converge-worker-queues.sh. The preflight resolves each
# under the route's own environment and lists every missing one at once. kubectl
# is the remote-kubectl.sh shim unless a kubeconfig is set; tailscale is called
# by remote-kubectl.sh on this side.
homelab_worker_window_required_commands:
  - limactl
  - kubectl
  - python3
  - tailscale
  - ssh
  - openssl
  - base64
  - awk
  - sed
  - grep
  - date
  - mktemp
  - sleep
  - tr
  - sort
  - cut
  - tail
  - head
  - mv
  - cp
  - install
  - chmod
  - dirname
  - basename
  - cat
  - rm
  - mkdir
  - env
  - bash
  - sh
  - uniq
  - wc
  - readlink
  - printf
  - tee
