# Per-uid kernel keyring quota for the hosts that run the 1Password env
# wrappers outside the k3s CI pool: vps (dev-host.yml) and hp-xubuntu
# (fabro-hosts.yml). The CI pool's ceilings are owned by node_sysctl instead.
#
# WHY: /usr/local/bin/with-*-env.sh (the 1Password env wrappers) cache each
# resolved 1Password Environment as a `user` key in the invoking uid's kernel
# PERSISTENT keyring, so a repeated invocation can skip `op run` entirely.
# Without this raise, the wrapper cache CANNOT hold the host's full wrapper set:
#
#   measured 2026-08-22 on vps, uid 1000
#     kernel default maxbytes .......... 20000
#     one cache entry (livespec) ....... 5153 bytes
#     -> only 3 wrappers fit before EDQUOT; vps runs SIX op-based wrappers
#        (~31 KB minimum, more for PEM-shaped values like GitHub App keys)
#
# The failure mode this prevents is SILENT and easy to misread as success:
# on `keyctl padd` EDQUOT the wrapper still runs the command correctly, but
# every call keeps resolving via a full `op run` — which draws on the
# 1Password service account's SHARED, ACCOUNT-WIDE, DAILY quota. It looks
# like a working cache while still rate-limiting the whole fleet.
#
# maxbytes 131072 (128 KiB): CONFIRMED NECESSARY after deployment — with all
# six op-based wrappers cached, uid 1000 holds 6 entries totalling **31775
# bytes**, i.e. 1.6x the old 20000 ceiling. Without this raise the 4th, 5th and
# 6th wrapper would each have hit EDQUOT. 128 KiB leaves ~4x headroom for a
# 7th wrapper or a larger (PEM-shaped) secret.
#
# maxkeys 1000 is deliberate headroom, not a measured need: 74 keys were in use
# post-deploy, and the wrapper's revoked-@s recovery (`keyctl new_session`)
# re-mints a SHARED per-uid keyring rather than allocating one per call —
# measured at +1 key across 10 consecutive wrapper invocations, not +10. An
# earlier design of this recovery did re-exec under a per-invocation session
# keyring, which is what originally motivated a large maxkeys; that design was
# replaced (1password-env-wrapper#11) and the concern largely evaporated with
# it. The ceiling is kept generous anyway, since keys are cheap and the failure
# mode is silent.
#
# maxbytes RAISED to 1048576 (1 MiB), 2026-10-12: the 128 KiB sizing above
# assumed ONE entry per wrapper. Since 1password-env-wrapper#17 each distinct
# caller environment gets its own entry, so one identifier can hold many at
# once. Measured on vps, uid 1000: 12 LIVE entries = 118356 bytes (openbrain
# entries ~13 KB each), with up to 22 seen during busy dispatch stretches.
# Since 1password-env-wrapper#19/#20 the wrapper reaps its own expired entries
# and evicts live ones on EDQUOT, so the cache no longer fails outright, but a
# too-small quota still means eviction churn = extra op runs. 1 MiB holds ~75
# such entries; still negligible kernel memory.
#
# hp-xubuntu ADDED 2026-10-12: it runs with-livespec-env.sh as cwoolley and was
# still at the kernel defaults (maxbytes 20000, maxkeys 200) — room for ~3
# cached entries, so busy dispatch stretches evicted constantly.
#
# These are per-NON-ROOT-uid ceilings (root has its own *_root_* knobs and is
# unaffected). Cost is bounded, unswappable kernel memory per uid; 1 MiB is
# negligible on either host (vps 94 GB, hp-xubuntu 30 GB).
#
# See CLAUDE.md "Host credentials" and the 1password-env-wrapper repo.
kernel.keys.maxbytes = 1048576
kernel.keys.maxkeys = 1000
