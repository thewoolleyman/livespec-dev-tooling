---
sccache_redis_container: sccache-redis
sccache_redis_service: sccache-redis.service
sccache_redis_unit_dir: /etc/systemd/system

# The docker bridge gateway, which is where the cache is published and nowhere
# else: reachable from every sandbox on the host and from nothing on the tailnet.
# 172.17.0.1 is docker's own default for the `bridge` network and is what
# hp-xubuntu measured, so it is a default rather than a required variable — and
# a host whose gateway differs fails the preflight below rather than binding
# somewhere the sandboxes cannot reach.
sccache_redis_bind_addr: 172.17.0.1
sccache_redis_port: 6379

# The pool's pinned redis, by digest (this repository's
# ci-runner/k3s/phase2/sccache/sccache-redis.yaml, read 2026-09-06). Bump both
# places together. Not a host value: one image serves every host.
sccache_redis_image: >-
  docker.io/library/redis:8.8.2-alpine@sha256:96cb544fa0af5aa898d160cffb7dae70c3df117190fc123831c64712cda425ff

# SIZE. sccache ships only an LRU size cap, not age-based eviction, and this
# tier accepts that explicitly: the working set is one lockfile's object set per
# toolchain (~1-2 GB for the console's dependency graph), so 4 GB holds every
# live entry with headroom and allkeys-lru evicts nothing hot in practice. The
# container limit sits above maxmemory for redis's own overhead, as the pool
# does. Both are sized from the host's RAM and belong in host_vars on any host
# with materially less than hp-xubuntu's 30 GiB.
sccache_redis_maxmemory: 4gb
sccache_redis_container_memory: 5g

# How long to wait for the cache to answer after a restart before calling the
# install failed. 30 one-second attempts, as the shell installer's loop did.
sccache_redis_ping_retries: 30
sccache_redis_ping_delay: 1
