---
- name: Restart the sccache-redis cache
  # Restarting DISCARDS the cache: the container is --rm with no persistence, so
  # the next dispatches compile cold. That is why this is a handler and not an
  # unconditional task — the cost is real, and it should be paid only when the
  # unit that defines the cache has actually changed.
  #
  # The `when` is the same check-mode guard the arming task carries: under
  # --check the notifying template wrote nothing, so a unit this host does not
  # already have cannot be restarted, and failing here would blame the host for
  # the dry run's own emptiness.
  ansible.builtin.systemd_service:
    name: "{{ sccache_redis_service }}"
    state: restarted
    daemon_reload: true
  become: true
  when: not ansible_check_mode or sccache_redis_unit_state.stat.exists
