---
# The k3s CI pool's node-local provisioning — poweredge-xubuntu (server),
# gmktec-xubuntu (agent) and hp-xubuntu (a FACTORY-ONLY agent). Migrated from
# ci-runner/k3s/phase2/install-node.sh.
#
# WHY THIS PLAYBOOK EXISTS (livespec-dev-tooling-9btv). Phase 3 of the Ansible
# migration built the k3s-node roles and the `ci_pool` inventory group but NO
# playbook targeted `ci_pool`, so neither `just ansible-drift` nor
# `just ansible-apply` could reach the two k3s nodes and they drifted unnoticed
# at Sep-8 code — including the pre-R5 churn-slot installer that would
# over-admit. This playbook closes that gap and carries R5's per-node churn-slot
# model (PRs #2260/#2261) into the layer that actually deploys.
#
# ROLE ORDER IS install-node.sh's STEP PLAN. The roles below run in the order
# install-node.sh's STEP_IDS run, so the GitOps converge and the retired runbook
# apply the same node-local steps in the same order. Role-awareness is split two
# ways, exactly as install-node.sh splits it:
#   * Roles that read `cluster_role` themselves (k3s_config, node_extended_resource,
#     wedged_runner, runner_pod_lifecycle, arc_log_archive, storage_sweep,
#     node_status_credential) run for every host and self-gate — a server installs
#     the server shape, an agent the agent shape (or no-ops). They carry no `when`
#     here.
#   * Roles with NO cluster_role handling are gated here, matching
#     install-node.sh's STEP_SKIP (server-only: host_thermal, secret_reinjection,
#     ci_converge_unit, datastore_tmpfs) and STEP_SERVER_SKIP (agent-only:
#     agent_rejoin). agent_node_password (server-only) has no install-node.sh
#     step and is gated here the same way.
# Roles that legitimately run on BOTH roles unchanged (node_sysctl, storage_layout,
# host_tools_ci, apparmor_profile, sccache_binary, cache_telemetry, container_hook)
# carry neither a self-gate nor a `when`.
#
# THREE STEPS HAVE NO install-node.sh EQUIVALENT, and their placement is the one
# ordering the runbook does not dictate, so it is stated here:
#   * agent_node_password (server-only) deletes an agent's stale k3s
#     node-password secret, on evidence only, so a refused agent can
#     re-register. It MUST follow agent_rejoin: that role installs the fixed
#     agent-rejoin watchdog, and the pre-2026-10-10 watchdog would re-create the
#     mismatch as soon as the agent registered (the role refuses the delete
#     until the agent runs the committed copy). It sits right after agent_rejoin
#     rather than later so the agent is re-registered before node_status_credential
#     and node_extended_resource need it.
#   * node_status_credential (agent-only) mints and delivers the scoped
#     node-status kubeconfig and MUST precede node_extended_resource, so the
#     agent's reapply timer has a credential to patch its own status.capacity with
#     before it first fires.
#   * node_taints reconciles the live node-role/ci taint to the profile and MUST
#     follow node_extended_resource, so a node is never opened for scheduling
#     before it advertises the churn-slot capacity it can actually serve.
# credential -> capacity -> taint: that is the safe opening order, and it is why
# these two sit where they do rather than at the ends of the list.
#
# TWO MORE STEPS HAVE NO install-node.sh EQUIVALENT, AND THEY GO LAST
# (livespec-dev-tooling-xcscdz). `ci_observability` and `sandbox_image_prune`
# replace two HAND-RUN installers — ci-runner/observability/
# install-observability.sh and ci-runner/k3s/phase2/warm-cache/
# sandbox-image-prune/install-sandbox-image-prune.sh — that this playbook never
# invoked and that the retired runbook never had a step for. Five node-local
# timers of the server's profile therefore reached a rebuilt node only if an
# operator remembered them, and the omission was SILENT: a drift report over a
# playbook that never mentioned the units read zero changes, and an absent
# host-silence heartbeat is indistinguishable from a host that is merely quiet.
# Both are server-only and both are gated here, because neither role reads
# `cluster_role`.
#
# THEY RUN AFTER ci_converge_unit, AND THAT ORDER IS THE WHOLE REASON THEY ARE
# AT THE END rather than beside the other unit installers. Arming a timer that
# is Persistent with an OnBootSec already in the past fires its MISSED tick at
# once, so on a long-running host these two steps do not merely install: the
# Kueue probe and the pool gauges READ THE CLUSTER on the spot, and the prune
# makes a cluster-wide PodSpec read and then REMOVES IMAGES. Reaching them
# before the converge has applied the ClusterQueues and the scale sets would
# make the first read fail-closed — a red unit on a freshly rebuilt node that
# only the next tick heals — and would ask the prune what the cluster needs
# before the cluster says so.
#
# A THIRD AXIS OF GATING, ADDED FOR hp-xubuntu (livespec-dev-tooling-7we6po).
# `cluster_role` answers "server or agent". It cannot answer "does this node
# execute CI jobs at all", and hp-xubuntu is the first node for which the two
# differ: it is a full AGENT that carries none of the pool's CI storage tiers
# and runs no runner pod, because it is a Fabro FACTORY host first. That posture
# is read from the node's own committed profile — `CI_NODE_FACILITIES`, whose
# `none` the parser refuses unless the profile ALSO declares no tier,
# ADMISSION_CAPACITY_C=0 and a node-role/ci taint — and the four roles whose
# whole subject is a CI tier or a CI job's execution environment are gated on
# it below.
#
# A FOURTH AXIS, AND IT IS A DIFFERENT QUESTION AGAIN (livespec-dev-tooling-due2h6).
# `cluster_role` answers "server or agent"; `CI_NODE_FACILITIES` answers "does
# this node execute CI jobs". NEITHER answers "can this node take a FACTORY
# pod", and all three current answers to that are `true` — including
# poweredge-xubuntu, which is the server, carries every CI tier, and runs factory
# pods too (maintainer ruling 2026-10-13). That posture is the profile's own
# `FACTORY_NODE`, the same key the factory node LABEL is rendered from, and
# `factory_workspace_root` is gated on it below: the node that advertises factory
# capacity is exactly the node that must already carry the ONE workspace root the
# kubernetes-sandbox-backend plugin's single `workspace_root` names.
#
# THE GATES LIVE HERE, IN THE ONE PLAY, rather than in a second play or a
# self-gate inside each role (maintainer ruling 2026-10-13). §"Runner-pool node
# rebuild recipe" requires ONE procedure, and a reader asking "what does this
# node get" must be able to answer it from this file plus that node's profile.
# `tests/livespec_dev_tooling/test_ci_pool_factory_only_agent_roles.py` resolves
# exactly that, from exactly those two inputs.
#
# THREE ROLES THAT A CLOSED NODE STILL RUNS, decided explicitly rather than by
# omission, because each one looks skippable and is not:
#   * apparmor_profile loads the `ci-runner-workflow` profile into the KERNEL. It
#     reads no tier and needs no job. hp is a full agent and the
#     kubernetes-sandbox-backend will place pods on it (that is what the factory
#     label is for); a pod that names a confinement profile the node has not
#     loaded fails to start for a reason nothing in the pod explains.
#   * node_status_credential mints and delivers the scoped node-status
#     kubeconfig. It runs at capacity 0 because an ADVERTISED zero and an ABSENT
#     resource are different facts: a ClusterQueue naming a resource no node
#     advertises reports an inactive flavor, where one summing an advertised 0
#     reports the quota it actually has. Closed has to be a positive statement
#     the server can read.
#   * node_extended_resource stamps that 0 and re-stamps it every five minutes,
#     because an extended resource set with `kubectl patch node
#     --subresource=status` is NOT persisted by kubelet. It also refuses a
#     non-numeric capacity, so 0 is a declared measurement here and not a
#     default.
# Running all three is also what makes "opening hp to CI later is a profile edit
# plus an apply" true: nothing has to be minted, loaded or installed first.

- name: K3s CI pool node-local provisioning
  hosts: ci_pool
  gather_facts: true
  vars:
    # The node's own committed profile, and the TWO posture facts read out of it.
    # Read on the CONTROLLER, because the profile lives in this repository and
    # the target has no checkout — the same `lookup` + `regex_findall | first`
    # chain every role in this tree reads a profile with. Each default is the
    # parser's own, so a profile written before the key existed resolves to the
    # posture it already has rather than to an error.
    ci_pool_profile: >-
      {{ playbook_dir }}/../ci-runner/k3s/phase0-bare-metal/profiles/{{ inventory_hostname }}.env
    ci_pool_ci_node_facilities: >-
      {{ lookup('ansible.builtin.file', ci_pool_profile)
      | regex_findall('^CI_NODE_FACILITIES=(.*)$', multiline=True) | first | default('full') }}
    ci_pool_factory_node: >-
      {{ lookup('ansible.builtin.file', ci_pool_profile)
      | regex_findall('^FACTORY_NODE=(.*)$', multiline=True) | first | default('false') }}
  roles:
    # 1/10 — k3s config (server or agent); self-gated.
    - role: k3s_config
      tags: [k3s_config]
    # 1b/10 — agent-only rejoin watchdog (STEP_SERVER_SKIP).
    - role: agent_rejoin
      tags: [agent_rejoin]
      when: cluster_role == 'agent'
    # 1c — server-only, evidence-gated reconcile of each agent's stale
    # node-password secret; after agent_rejoin (see the header).
    - role: agent_node_password
      tags: [agent_node_password]
      when: cluster_role == 'server'
    # 2/10 — inotify + keyring sysctls (one role covers both).
    - role: node_sysctl
      tags: [node_sysctl]
    # 2b/10 — storage layout (mount the LABEL-ed tiers; no-op when live). Gated:
    # this role's whole subject is the three LABEL-keyed tiers and the two binds
    # onto them, and it REFUSES an apply at its first label resolution on a node
    # that carries none — which is the honest refusal, and the reason a
    # factory-only node must not reach it at all.
    - role: storage_layout
      tags: [storage_layout]
      when: ci_pool_ci_node_facilities == 'full'
    # 2c/10 — iDRAC cooling (PowerEdge hardware; server-only, STEP_SKIP).
    - role: host_thermal
      tags: [host_thermal]
      when: cluster_role == 'server'
    # 2d/10 — operator host tools (btop-loop).
    - role: host_tools_ci
      tags: [host_tools_ci]
    # 2e/10 — fpart/fpsync, the fleet's bulk tree-copy tool (every host).
    - role: fpart
      tags: [fpart]
    # 3/10 — AppArmor kernel profile (both roles; the ConfigMap half is the
    # server's converge, not this role).
    - role: apparmor_profile
      tags: [apparmor_profile]
    # Beside it, and for the same reason it runs on a node that executes no CI
    # job: the ONE workspace root a factory pod's `workspace_root` resolves to.
    # A pod whose hostPath root the node has not prepared fails for a reason
    # nothing in the pod explains, exactly as one naming an unloaded confinement
    # profile does — so the directory exists BEFORE the credential -> capacity ->
    # taint chain below opens this node for scheduling. Gated on the THIRD axis
    # (see the header): FACTORY_NODE, not `cluster_role` and not
    # CI_NODE_FACILITIES.
    - role: factory_workspace_root
      tags: [factory_workspace_root]
      when: ci_pool_factory_node == 'true'
    # And the sandbox images those pods run, held in k3s's containerd
    # (bd-ib-kogktm). Same gate and same reason as the workspace root: a node
    # that lacks the current tag loses every placement to a node that has it
    # through the scheduler's image locality, so one factory node took all
    # eleven measured pods. Before the opening chain below, so the node offers
    # the image before it offers capacity.
    - role: factory_sandbox_image_prepull
      tags: [factory_sandbox_image_prepull]
      when: ci_pool_factory_node == 'true'
    # Before 4/10 — mint+deliver the agent's scoped node-status credential, so
    # the reapply timer below has something to authenticate with (agent-only,
    # self-gated).
    - role: node_status_credential
      tags: [node_status_credential]
    # 4/10 — churn-slot extended resource + per-node reapply timer (R5); self-gated.
    - role: node_extended_resource
      tags: [node_extended_resource]
    # After 4/10 — reconcile the node-role/ci taint to the profile, so the node is
    # opened for scheduling only once it advertises its capacity.
    - role: node_taints
      tags: [node_taints]
    # Beside it, and for the same reason it exists: k3s applies --node-label at
    # REGISTRATION only, so the FACTORY label provision-k3s.sh registers at join
    # is gone the next time the cluster's objects are re-created. This reconciles
    # it to the profile's FACTORY_NODE on every apply. EVERY ci_pool node runs it,
    # the server included — poweredge is a factory node AND untainted, which is
    # exactly why the label could not be expressed as "the tainted ones".
    - role: node_labels
      tags: [node_labels]
    # 5/10 — wedged-runner sweep; self-gated.
    - role: wedged_runner
      tags: [wedged_runner]
    # 5b/10 — runner-pod lifecycle scan; self-gated.
    - role: runner_pod_lifecycle
      tags: [runner_pod_lifecycle]
    # 6/10 — ARC log archive; self-gated.
    - role: arc_log_archive
      tags: [arc_log_archive]
    # 7/10 — boot-time secret reinjection units (server-only, STEP_SKIP; enable
    # only, never started).
    - role: secret_reinjection
      tags: [secret_reinjection]
      when: cluster_role == 'server'
    # 7b/10 — pool-provided sccache binary + its cache telemetry. Gated: both
    # install into the directory arc/hook-pod-template.yaml mounts READ-ONLY into
    # every JOB container, and cache_telemetry's spans are about the cache tiers.
    # A node that runs no job has nothing on the other end of either.
    - role: sccache_binary
      tags: [sccache_binary]
      when: ci_pool_ci_node_facilities == 'full'
    - role: cache_telemetry
      tags: [cache_telemetry]
      when: ci_pool_ci_node_facilities == 'full'
    # 7c/10 — fleet-patched ARC container hook + externals extraction. Gated: it
    # extracts the runner image's externals under the local-path root for ARC's
    # container hook, which only a node running RUNNER pods uses.
    - role: container_hook
      tags: [container_hook]
      when: ci_pool_ci_node_facilities == 'full'
    # 8/10 — reconstruct-on-boot converge unit (server-only, STEP_SKIP).
    - role: ci_converge_unit
      tags: [ci_converge_unit]
      when: cluster_role == 'server'
    # Beside it, and AFTER it on purpose: the factory reach proof as a converge
    # artifact (livespec-dev-tooling-jvnqwv, freeze ruling R70 of 2026-10-16).
    # It installs ci-runner/k3s/phase2/factory/verify-factory-reach.sh, its
    # probe and its two configuration files into the same installed tree, and —
    # only when `-e factory_reach_check_run_now=true` is passed on one apply —
    # RUNS the check for every ci_pool node whose profile declares
    # FACTORY_NODE=true, under the `factory` namespace's scoped
    # sandbox-launcher credential rather than the admin kubeconfig.
    #
    # Gated on `cluster_role` and NOT on FACTORY_NODE, which is the one place
    # this role differs from factory_workspace_root above: the artifact set is
    # installed on the node that RUNS the check, and that node reaches every
    # covered node through the API server. An agent gains nothing from a copy of
    # a renderer it holds no credential to submit with — the credential converge
    # step 10e renders lives here, root-only, on the server.
    #
    # After ci_converge_unit because that role's unit is what renders the
    # credential's source and installs the rest of the tree, so ONE apply
    # carrying both run-now switches converges and THEN proves, in that order.
    - role: factory_reach_check
      tags: [factory_reach_check]
      when: cluster_role == 'server'
    # 9/10 — tmpfs datastore mount (server-only, STEP_SKIP; enable only).
    - role: datastore_tmpfs
      tags: [datastore_tmpfs]
      when: cluster_role == 'server'
    # 10/10 — boot-time orphaned-scratch sweep; self-gated.
    - role: storage_sweep
      tags: [storage_sweep]
    # 11 — the four node-local OTLP emitters, the host-silence heartbeat among
    # them (see the header's "TWO MORE STEPS"). Server-only: three of the four
    # read a cluster credential only the server holds or renders, and the
    # server's own tick already covers the whole pool.
    - role: ci_observability
      tags: [ci_observability]
      when: cluster_role == 'server'
    # 11b — and right after it: this node's own OTel Collector, the thing those
    # emitters export to and the only converged carrier of the node's host and
    # kubelet metrics (livespec-dev-tooling-ool6ws). UNGATED, and that is the
    # whole point: §"Runner-pool node telemetry" governs "every node of the
    # self-hosted CI runner pool's k3s cluster — the server, every CI agent, and
    # every factory-only agent — whatever its `cluster_role` or factory posture",
    # so this is the one role here that reads neither axis. A gate would leave
    # exactly the node it excluded indistinguishable from a node that had gone
    # silent, which is the failure its dead-man trigger exists to catch.
    #
    # Each node's SHAPE is its own host_vars' — the configuration file it runs
    # out of the collector repository, the unit's start order, whether its
    # collector holds a scoped cluster identity. The role's defaults are the DEV
    # HOST's, so a host declaring nothing resolves to that host's posture rather
    # than to an error.
    #
    # THE REASON THIS CANNOT STAY A HAND-RUN INSTALLER. The three collectors were
    # placed by `scripts/install-ci-runner-host.sh` and
    # `scripts/install-hp-factory-host.sh` in thewoolleyman/otel-collector, and
    # the fleet host guard refuses any by-hand host change — so those installers
    # can no longer be run at all, and a node rebuilt from empty storage had no
    # path to a collector. This role is now that path, which is what the same
    # section's "A hand-run installer MUST NOT be the deployment path" requires.
    #
    # The apply needs the control node's projected ingest key, so it runs under
    # the credential wrapper; see ../ansible/README.md for the two commands.
    - role: otel_collector
      tags: [otel_collector]
    # 12 — and LAST, because arming its timer prunes this node's containerd on
    # the spot on any host up longer than OnBootSec. Server-only as a hard
    # refusal, not a skip: the prune's central gate is a cluster-wide PodSpec
    # read, and an agent holds no admin kubeconfig to make it with.
    - role: sandbox_image_prune
      tags: [sandbox_image_prune]
      when: cluster_role == 'server'
