---
# gamingpc-xubuntu — the maintainer's dual-boot gaming PC, a k3s pool AGENT
# (plan homelab-k8s-worker-nodes, epic livespec-dev-tooling-ko26ez; maintainer
# direction 2026-11-11 ~00:40Z). Its node facts and the derivation of its
# default split are in
# ci-runner/k3s/phase0-bare-metal/profiles/gamingpc-xubuntu.env; the host
# record is thewoolleyman/gamingpc-xubuntu-info.

# --- otel_collector ---
# The host collector on a k3s agent node, as gmktec-xubuntu's.
otel_collector_config_file: config.k3s-agent-host.yaml
otel_collector_user: otel-collector
otel_collector_group: otel-collector
otel_collector_manage_install: true
otel_collector_hardened: true
otel_collector_unit_description: >-
  otel-collector -- host OTel Collector on a k3s agent node (livespec env)
otel_collector_unit_after: network-online.target
otel_collector_unit_wants: network-online.target
otel_collector_env_from_controller:
  - HONEYCOMB_INGEST_KEY_LIVESPEC

# --- disk_guard ---
disk_guard_threshold_gb: 40

# --- factory_budget_reconciler ---
# Two factory sandbox pods: legacy-coordinator-agent ruling, 2026-11-12
# ~10:12Z, on a STRANDED-CAPACITY read (rule K, the same derivation on every
# factory node). Measured 2026-11-12 ~10:05Z: allocatable 16 cpu / 30.4 GiB;
# the gate lanes pinned here reserve 5 cpu / 8 GiB
# (gates-repro-cq/gates-repro-gamingpc-flavor; gates-gamingpc-flavor is 0); a
# factory sandbox pod requests 3 cpu / 7630Mi. After the lanes and the
# warm-uv-cache pod (500m / 512Mi), cpu fits 3.67 pods and memory
# (30.4 - 8 - 0.5) / 7.45 = 2.94, so 2. Was 1 (an earlier one-third memory
# share read against ~26.5 GiB allocatable).
#
# ONE since 2026-11-12 ~19:4xZ (legacy-coordinator-agent GO, R301; plan
# gate-job-resources). gates-gamingpc-flavor holds TWO gate units, 10 cpu /
# 16 GiB, for priority 1's hand-land burst, while gmktec and poweredge were
# saturated (2.1% and 0.7% idle) and gamingpc was 94% idle. The same
# derivation: memory (30.4 - 16 - 0.5) / 7.45 = 1.86 and cpu
# (16 - 10 - 0.5) / 3 = 1.83, so 1.
# REVERT to 2, with the gate lane back to 5 / 8Gi, when the burst ends (that
# plan archived) and a re-measure shows gate waits under 300 s.
factory_pod_budget: 1

# --- node_status_credential ---
# The agent-side account the refresh tool drops its fetch to is this node's
# operator account, `ubuntu` (there is no `cwoolley` here). It logs in to the
# control-plane node as `cwoolley`, the only account Tailscale SSH maps there.
# Measured 2026-11-11 ~07:10Z from this host as `ubuntu`: `ssh poweredge-xubuntu`
# is refused with "tailscale: failed to look up local user \"ubuntu\"", while
# `ssh cwoolley@poweredge-xubuntu` returns `cwoolley` and passes `sudo -n`.
node_status_credential_ssh_user: ubuntu
node_status_credential_remote_user: cwoolley

# --- controller_known_hosts ---
# This host's Tailscale SSH ed25519 host key, pinned into the control node's
# known_hosts by ansible/dev-host.yml (role controller_known_hosts). Fingerprint
# SHA256:B80TQ80TSdj4j8fef3gQhQtWnafGppS4N817Gh4z33o. Verified 2026-11-11
# against the fingerprint thewoolleyman/gamingpc-xubuntu-info docs/bootstrap.md
# records.
controller_known_hosts_ed25519: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKuej1c3Cw/I995gHVmAjaFfibSxBIKHNznAuNkyYiCV"
