# vps — per-host values for the legacy fleet inventory.
#
# GENERATED by collecting each role's HOST_VARS.md. Do not hand-edit: change
# the owning role's HOST_VARS.md and regenerate, or the next regeneration
# silently discards the edit.
#
# Only values that genuinely vary by machine appear here. Anything the hosts
# agree on stays in the role's defaults/main.yml, so a reader can tell a
# deliberate per-host decision from a fleet default at a glance.

---

# --- arq_smb_source ---
arq_smb_source_tailscale_ip: 100.89.189.118
arq_smb_source_public_listeners:
  - "66.94.121.15:445"

# --- btop_loop ---
btop_loop_expected_hostname: vmi3006760

# --- claude_ntfy ---
claude_ntfy_topic: vps-claude-ready-4267

# --- codex_config ---
codex_config_user: ubuntu

# --- container_reclaim ---
container_reclaim_canonical_host: vps.perch-rudd.ts.net
# NOT the tailnet label. Tailscale serves vps.perch-rudd.ts.net, but
# `hostname -s` on this machine reports the Contabo-assigned vmi3006760. The
# reclaimer compares this value against the running host's own hostname, so a
# value derived from the tailnet name would refuse to run on the host it
# targets.
container_reclaim_system_hostname: vmi3006760

# --- dev_host_retention ---
# The uv cache the retention prunes and the checkouts whose gate runs it sweeps
# are this login's, not root's; a root run would prune root's empty cache and
# leave the 52G one measured on 2026-10-21.
dev_host_retention_user: ubuntu
# systemd runs this role as root, whose PATH does not include ubuntu's mise
# shims. A concrete, version-pinned binary, NOT the mise shim: run from the
# service (cwd /, no project config) the shim fails with "No version is set
# for shim: uv" (measured 2026-11-02), so the prune never ran. Pinned rather
# than mise's installs/uv/latest, which a mise upgrade can move. Re-point this
# when that uv version is uninstalled; the converge refuses a missing path and
# names the installed versions.
dev_host_retention_uv_bin: /home/ubuntu/.local/share/mise/installs/uv/0.11.10/uv-x86_64-unknown-linux-musl/uv

# --- fabro_server ---
fabro_server_host_user: ubuntu
fabro_server_host_group: ubuntu
fabro_server_host_home: /home/ubuntu
fabro_server_host_checkout: /data/projects/livespec-orchestrator-beads-fabro
# vps declares what gmktec-xubuntu declares (plan ci-pool-provisioning-leftovers,
# ruling 2026-11-05): the role writes each instance's settings.toml, which was
# hand-maintained here until livespec-dev-tooling-jxw2ve.
#
# BOTH INSTANCES PARKED 2026-11-12 (livespec-dev-tooling-gxepwl; maintainer,
# relayed by legacy-coordinator-agent: "approved shutting down the fabro on
# vps."). No factory routes here any more: /etc/livespec/fabro-factories.json
# points every factory, mi-homelab included, at gmktec-xubuntu. The fabro-server
# journal, which reaches back to 2026-10-30, holds no run creation. Its only
# traffic was bare `fabro ps` reads hitting the CLI's 127.0.0.1:32276 default,
# which got a stale legacy board back. Parked rather than deleted: each unit is
# stopped and disabled, and its binary, settings.toml and state directory are
# all KEPT. To bring one back, flip its `service_state` to running and re-apply.
# Removing the instances is a later, separate decision.
fabro_server_manage_settings: true
fabro_server_instances:
  - unit_name: fabro-server
    home_dir: /home/ubuntu/.fabro
    port: 32276
    canonical_host: vps.perch-rudd.ts.net:32276
    cli_target_url: http://127.0.0.1:32276
    # vps sets this explicitly in its live, hand-maintained settings.toml.
    max_concurrent_runs: 10
    github_app_id: "3668528"
    # DECIDED 2026-11-05 (plan ci-pool-provisioning-leftovers): vps declares
    # what gmktec declares, so this instance gets the OTLP drop-in too. It was
    # `unmanaged` because installing it newly adds OTLP export from the fleet's
    # fallback factory, a behaviour change rather than a transcription; the
    # pre-apply drift read is what shows whether it changes a live value.
    # REVERT: set `absent` (decides against export) or `unmanaged`.
    otel_dropin: present
    # An empty vault on a rebuilt host must be refused, not discovered by the
    # first run that needs the App key. The role creates only a name the vault
    # lacks and never reads or overwrites a value it holds.
    vault_secrets:
      - name: GITHUB_APP_PRIVATE_KEY
        type: file
        description: GitHub App 3668528 private key
        from_controller_env: GITHUB_PRIVATE_KEY
    # PINNED, so the host PATH client can stop sharing this file (bd-ib-zb2hso
    # step 2, coordinator gitops-fleet-capacity-monitoring ruling 2026-10-23
    # 22:3xZ, option B). Measured 2026-10-23: both instances on this host are
    # active and their units start this path, which ~/.local/bin/fabro also
    # links to, so moving the PATH client by replacing this file would have put
    # both servers on the Petri engine at their next restart. The build is
    # fabro 0.254.0 at 8869e88, the SAME commit these units already run (the
    # 2026-10-01 build), rebuilt 2026-10-16 with NODE_ENV=production; it is
    # byte-identical to the engine hp-xubuntu's fabro-server declares. STAGED,
    # NOT RESTARTED: with fabro_server_restart_allowed false the apply swaps
    # the file atomically under the running servers. A later engine change on
    # either instance is its own recorded step, not part of zb2hso.
    binary_path: /home/ubuntu/.fabro/bin/fabro
    binary_source: /home/ubuntu/.local/state/fabro-web-prod/v0254-8869e88/fabro
    binary_sha256: 199407cec8119735fc0751407272ba3282703bd45ada87d34a89cc8f62a22421
    # PARKED 2026-11-12 (livespec-dev-tooling-gxepwl): see the note above
    # fabro_server_manage_settings. REVERT: set running and re-apply.
    service_state: stopped
  - unit_name: fabro-server-mi-homelab
    home_dir: /home/ubuntu/.fabro-mi-homelab
    port: 32277
    canonical_host: vps.perch-rudd.ts.net:32277
    cli_target_url: http://127.0.0.1:32277
    # Chosen, not observed: vps is a shared box already carrying the fleet
    # instance's 10, and the org factory is the fallback, not the default.
    max_concurrent_runs: 3
    github_app_id: "4688510"
    # Live on the host since 2026-08-23.
    otel_dropin: present
    # The org App key comes from its OWN controller variable, never from
    # GITHUB_PRIVATE_KEY: that one carries the fleet App's key, and a vault
    # filled from it would publish homelab's pull requests as the fleet App.
    # Bind it from homelab's parameter store for the apply:
    #   hl param run --bind MI_HOMELAB_GITHUB_PRIVATE_KEY=/homelab/v1/providers/github/mi-homelab-factory-bot/private-key
    vault_secrets:
      - name: GITHUB_APP_PRIVATE_KEY
        type: file
        description: GitHub App 4688510 (mi-homelab-factory-bot) private key
        from_controller_env: MI_HOMELAB_GITHUB_PRIVATE_KEY
    # The same pin as fabro-server above, and for the same reason: this unit
    # starts the same file, so the two declarations must agree.
    binary_path: /home/ubuntu/.fabro/bin/fabro
    binary_source: /home/ubuntu/.local/state/fabro-web-prod/v0254-8869e88/fabro
    binary_sha256: 199407cec8119735fc0751407272ba3282703bd45ada87d34a89cc8f62a22421
    # PARKED 2026-11-12 (livespec-dev-tooling-gxepwl). mi-homelab's live
    # factory is gmktec-xubuntu:32277. REVERT: set running and re-apply.
    service_state: stopped

# --- gha_runner ---
gha_runner_user: ubuntu
gha_runner_group: ubuntu
gha_runner_home: /home/ubuntu
# A DEDICATED tree, not the operator's home root. (/home/ubuntu/gate-runner
# belonged to the retired gate tier, bd-ib-te4h, and the gate_runner_retired
# role removes it.)
gha_runner_root: /home/ubuntu/gha-runner
gha_runner_dir: /home/ubuntu/gha-runner/actions-runner
gha_runner_work: /home/ubuntu/gha-runner/_work
# What this runner serves: the labels livespec-orchestrator-beads-fabro's
# acceptance-live-golden-master.yml selects on. `self-hosted` is applied by
# the runner itself and listed so this states the whole selector.
gha_runner_repo: thewoolleyman/livespec-orchestrator-beads-fabro
gha_runner_name: vps-livespec-orchestrator
gha_runner_labels: self-hosted,livespec-orchestrator
# PATH for the runner process and every job step: the job wrapper scrubs the
# environment and hard-codes the system secure_path, which does NOT carry
# this host's `fabro`, so the launcher re-exports this. Measured 2026-09-08.
gha_runner_job_path: /home/ubuntu/.local/share/mise/shims:/home/ubuntu/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

# --- honeycomb_mcp ---
honeycomb_mcp_checkout: /data/projects/vps-info

# --- honeycomb_trigger_recipients_check ---
honeycomb_trigger_recipients_check_checkout: /data/projects/vps-info

# --- incident_observer ---
# The account this host's candidates run as; controller.json carries its uid as
# candidate_uid, which the controller refuses to equal its own.
incident_observer_candidate_user: ubuntu

# --- otel_collector ---
# The pressure telemetry service posts OTLP directly and reads the collector's
# managed environment file, so this key must be converged on the dev host just
# as it is on every ci_pool target.
otel_collector_env_from_controller:
  - HONEYCOMB_INGEST_KEY_LIVESPEC

# --- reconcile_runs ---
# Every tenant this host's dispatcher seat tickets, in sweep order (by the seat's
# 7-day launch volume, 2026-11-13). Each wrapper is the tenant's committed
# .livespec.jsonc credential_wrapper. This host stamps the claims it dispatches
# and reconciles only those; it stays enabled until no claim it stamped remains.
reconcile_runs_enabled: true
reconcile_runs_tenants:
  - name: livespec-orchestrator-beads-fabro
    unit: reconcile-runs
    repo: /home/ubuntu/workspace/livespec-orchestrator-beads-fabro
    credential_wrapper: [/usr/local/bin/with-livespec-env.sh, "--"]
  - name: livespec-dev-tooling
    repo: /home/ubuntu/workspace/livespec-dev-tooling
    credential_wrapper: [/usr/local/bin/with-livespec-env.sh, "--"]
  - name: livespec-overseer
    repo: /home/ubuntu/workspace/livespec-overseer
    credential_wrapper: [/usr/local/bin/with-livespec-env.sh, "--"]
  - name: livespec-driver-codex
    repo: /home/ubuntu/workspace/livespec-driver-codex
    credential_wrapper: [/usr/local/bin/with-livespec-env.sh, "--"]
  - name: livespec
    repo: /home/ubuntu/workspace/livespec
    credential_wrapper: [/usr/local/bin/with-livespec-env.sh, "--"]
  - name: livespec-runtime
    repo: /home/ubuntu/workspace/livespec-runtime
    credential_wrapper: [/usr/local/bin/with-livespec-env.sh, "--"]
  - name: livespec-driver-claude
    repo: /home/ubuntu/workspace/livespec-driver-claude
    credential_wrapper: [/usr/local/bin/with-livespec-env.sh, "--"]
  - name: hetzner-xubuntu-info
    repo: /home/ubuntu/workspace/hetzner-xubuntu-info
    credential_wrapper: [./with-hetzner-xubuntu-credentials.sh, "--"]
  - name: livespec-console-beads-fabro
    repo: /home/ubuntu/workspace/livespec-console-beads-fabro
    credential_wrapper: [/usr/local/bin/with-livespec-env.sh, "--"]
  - name: homelab
    repo: /home/ubuntu/workspace/homelab
    credential_wrapper:
      - /usr/local/bin/with-homelab-aws.sh
      - --role
      - homelab-workload
      - /home/ubuntu/.nix-profile/bin/hl
      - param
      - run
      - --bind
      - BEADS_DOLT_PASSWORD=/homelab/v1/services/dolt/production/beads-password
      - --bind
      - GITHUB_APP_ID=/homelab/v1/providers/github/mi-homelab-factory-bot/app-id
      - --bind
      - GITHUB_PRIVATE_KEY=/homelab/v1/providers/github/mi-homelab-factory-bot/private-key
      - --bind
      - CLAUDE_CODE_OAUTH_TOKEN=/homelab/v1/providers/anthropic/claude-code/oauth-token
      - "--"
  - name: livespec-orchestrator-git-jsonl
    repo: /home/ubuntu/workspace/livespec-orchestrator-git-jsonl
    credential_wrapper: [/usr/local/bin/with-livespec-env.sh, "--"]
  - name: dolt-server
    repo: /home/ubuntu/workspace/dolt-server
    credential_wrapper: [/usr/local/bin/with-dolt-server-env.sh, "--"]
  - name: livespec-driver-pi
    repo: /home/ubuntu/workspace/livespec-driver-pi
    credential_wrapper: [/usr/local/bin/with-livespec-env.sh, "--"]
  - name: openbrain
    repo: /home/ubuntu/workspace/openbrain
    credential_wrapper: [/data/projects/1password-env-wrapper/with-openbrain-env.sh, "--"]
# Fourteen passes back to back: a sweep of median passes is about 70 min, so the
# bound allows that, the interval, and one timed-out pass.
reconcile_runs_stale_after_seconds: 14400

