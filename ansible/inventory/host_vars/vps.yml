# --- storage_reclaim ---
storage_reclaim_canonical_host: vps.perch-rudd.ts.net
# NOT the tailnet label. Tailscale serves vps.perch-rudd.ts.net, but
# `hostname -s` on this machine reports the Contabo-assigned vmi3006760. The
# reclaimer compares this value against the running host's own hostname, so a
# value derived from the tailnet name would refuse to run on the host it
# targets.
storage_reclaim_system_hostname: vmi3006760
storage_reclaim_service_user: ubuntu
storage_reclaim_home: /home/ubuntu
# OVERRIDE REQUIRED. The default derives this from the home directory, which
# would give /home/ubuntu/repos; the vps keeps its clones on the data volume.
# A wrong value here does not fail — it reports live worktrees as orphans,
# because orphan detection differences the on-disk worktrees against the
# worktrees registered by the clones under these roots.
storage_reclaim_checkout_roots: /data/projects

# --- tailscale_serve ---
# The tailnet TLS front of the incident observer's loopback listener
# (roles/incident_observer/README.md), and the two Fabro instances' fronts,
# declared like gmktec-xubuntu's (livespec-dev-tooling-jxw2ve). The role is
# additive and touches only the ports declared here, so this host's other
# hand-made mappings (8010, 8443) are left as they are.
tailscale_serve_mappings:
  - https_port: 8765
    backend: http://127.0.0.1:8765
  # The tailnet fronts of the further production observer installations
  # (roles/incident_observer/defaults/main.yml `incident_observer_installations`,
  # livespec-dev-tooling-lqp2qx): each fronts its own installation's loopback
  # listener and no other, for livespec, livespec-orchestrator-beads-fabro and
  # livespec-overseer in turn.
  - https_port: 8770
    backend: http://127.0.0.1:8770
  - https_port: 8771
    backend: http://127.0.0.1:8771
  - https_port: 8772
    backend: http://127.0.0.1:8772
# RETIRED 2026-11-12 (livespec-dev-tooling-gxepwl): the 32276 and 32277 fronts of
# the two Fabro instances parked above. Each port the node still serves is turned
# off with `tailscale serve --https=<port> off`. To bring an instance back, move
# its port from this list back into tailscale_serve_mappings.
tailscale_serve_retired_ports:
  - 32276
  - 32277

# --- vnc_desktop ---
vnc_desktop_tailscale_ip: 100.89.189.118
