# poweredge-xubuntu — per-host values for the legacy fleet inventory.
#
# GENERATED by collecting each role's HOST_VARS.md. Do not hand-edit: change
# the owning role's HOST_VARS.md and regenerate, or the next regeneration
# silently discards the edit.
#
# Only values that genuinely vary by machine appear here. Anything the hosts
# agree on stays in the role's defaults/main.yml, so a reader can tell a
# deliberate per-host decision from a fleet default at a glance.

---

# --- lan_ssh_fallback ---
# OpenSSH binds the WIRED LAN address only (never the tailnet address); the
# client aliases dial it. It is valid_lft forever and the address k3s pins
# (measured 2026-10-15); every run checks the interface still carries it.
lan_ssh_fallback_interface: eno1
lan_ssh_fallback_address: 192.168.1.200
lan_ssh_fallback_must_stay_running:
  - tailscaled.service
  - k3s.service

# --- otel_collector ---
# The CLUSTER-READING collector: the one node whose configuration discovers every
# kubelet from the API server and scrapes it. Transcribed from the hand-run
# `scripts/install-ci-runner-host.sh` and
# `systemd/otel-collector.ci-runner-host.service` in thewoolleyman/otel-collector,
# which the fleet host guard now refuses to let anyone run.
otel_collector_config_file: config.ci-runner-host.yaml
otel_collector_user: otel-collector
otel_collector_group: otel-collector
otel_collector_manage_install: true
otel_collector_hardened: true
otel_collector_cluster_identity: true
otel_collector_unit_description: >-
  otel-collector -- host OTel Collector on the CI-runner host (livespec env)
# The node name and the ingest endpoint, rendered on the host by that installer:
# facts about this node, not values this tree picks. An asserted precondition.
otel_collector_extra_environment_files:
  - /etc/otel-collector/host.env
# Re-rendered at every boot by the identity unit this role converges, because the
# k3s datastore is a tmpfs and the ServiceAccount behind it is wiped each time.
otel_collector_kubeconfig_path: /etc/otel-collector/kubeconfig
# k3s first, then the identity unit that renders the kubeconfig above: a collector
# started before either cannot authenticate to a single kubelet. This host's
# configuration reads no Docker socket, so docker.service is deliberately absent.
otel_collector_unit_after: network-online.target k3s.service otel-collector-identity.service
otel_collector_unit_wants: network-online.target otel-collector-identity.service
otel_collector_env_from_controller:
  - HONEYCOMB_INGEST_KEY_LIVESPEC

# --- k3s_config ---
# system.slice's root-level CPU share against kubepods.slice (2813 on this
# 72-CPU node), so the k3s server is not starved when the node saturates
# (livespec-dev-tooling-cetudy; measured 2026-11-05: datastore p99 7 s at
# 72.98/72 CPUs with system.slice at 100). 1000 entitles system.slice to about
# 17.9 CPUs under full contention. Applied by a daemon-reload, no k3s restart;
# revert by setting it to "" and re-applying --tags k3s_system_slice_cpu_weight.
k3s_config_system_slice_cpu_weight: 1000

# --- pressure_telemetry ---
# The k3s server's own CPU pressure, so its share during a node saturation window
# can be read from Honeycomb afterwards (livespec-dev-tooling-3gm5rb). Revert by
# setting it to [] and re-applying --tags pressure_telemetry.
pressure_telemetry_cgroups:
  - system.slice/k3s.service

# --- factory_budget_reconciler ---
# This node may hold 9 factory sandbox pods: the TEMPORARY fixed factory-vs-CI
# CPU share (maintainer ruling 2026-11-08). The value is MEASURED from the
# 2026-11-08 CI burst. With 29-30 CI pods on the node, 11 sandboxes put CI
# BestEffort cpu.pressure avg60 at 30.53 (18:59:34Z, the tripwire), and 10 put it
# at 17.75 (19:16Z). 9 is one notch below the only measured-safe point. The sum
# is 15, matching fleet 12 + candidate 1 + mi-homelab 2. The budget was raised
# first and the cap after. TRIPWIRE: if avg60 passes 30 at any read, lower the
# fleet cap to 9 FIRST, then set this to 6 (role HOST_VARS.md).
# 2026-11-11: 9 -> 11, a measured STEP (coordinator legacy-coordinator-agent
# 5bf269cf, ~18:03Z; orchestrator bd-ib-nmuyjc). PR check-python and the batch
# checks moved to hosted runners at 16:04:39Z, so this node no longer carries
# all PR CI; the 9 dated from when it did. Meanwhile the overflow path drove
# gmktec-xubuntu (the smaller node, the only one still admitting) to about 4%
# idle and forced the fleet-cap cut 18 -> 16. Before the step (17:53-17:54Z):
# idle 3.09%, CI BestEffort cpu.pressure some avg60 2.17 (avg300 5.81).
# REVERT TRIGGER, at once, back to 9: poweredge idle under 5% AND
# kubepods-besteffort cpu.pressure avg60 over 30 on two consecutive reads, or a
# master or coverage CI p95 job duration rise of more than 20% against the 24 h
# before this change. REVERT: factory_pod_budget: 9
factory_pod_budget: 11

