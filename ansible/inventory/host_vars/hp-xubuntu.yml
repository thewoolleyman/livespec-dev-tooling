# hp-xubuntu — per-host values for the legacy fleet inventory.
#
# GENERATED by collecting each role's HOST_VARS.md. Do not hand-edit: change
# the owning role's HOST_VARS.md and regenerate, or the next regeneration
# silently discards the edit.
#
# Only values that genuinely vary by machine appear here. Anything the hosts
# agree on stays in the role's defaults/main.yml, so a reader can tell a
# deliberate per-host decision from a fleet default at a glance.

---

# hp-xubuntu LEFT `sandbox_hosts` on 2026-11-02 (plan gmktec-factory-placement,
# item livespec-dev-tooling-2yn4yb). Its `fabro_server` and `docker_sandbox_slice`
# sections were removed then. It is now in `former_sandbox_hosts`, and
# ansible/former-sandbox-hosts.yml converges what the sandbox play left on it
# (livespec-dev-tooling-j53hzi). That play keeps sandbox_storage and disk_guard,
# and retires container_reclaim, otel_receiver, sccache_redis and storage_reclaim
# through `<role>_state: absent`. factory_kubeconfig is no longer applied.
# lan_ssh_fallback and otel_collector are reached through lan-ssh-fallback.yml
# and ci-pool.yml.

# --- container_reclaim ---
# RETIRED on this host 2026-11-02 (livespec-dev-tooling-j53hzi), through
# ansible/former-sandbox-hosts.yml.
container_reclaim_state: absent

# --- disk_guard ---
disk_guard_threshold_gb: 40

# --- lan_ssh_fallback ---
# OpenSSH binds the WIRED LAN address only (never the tailnet address); the
# client aliases dial it. It is valid_lft forever and the address k3s pins
# (measured 2026-10-15); every run checks the interface still carries it.
lan_ssh_fallback_interface: enp11s0
lan_ssh_fallback_address: 192.168.1.4
# fabro-server.service left this list on 2026-11-02: hp's legacy Fabro unit is
# stopped, disabled and retained read-only (livespec-dev-tooling-yw7via), so a
# before/after "must stay running" check on it would refuse every apply.
lan_ssh_fallback_must_stay_running:
  - tailscaled.service
  - k3s-agent.service
  - docker.service

# --- otel_collector ---
# The FACTORY host's collector: host metrics plus the Docker engine's container
# stats, which is what the service account's `docker` membership is for.
# Transcribed from the hand-run `scripts/install-hp-factory-host.sh` and
# `systemd/otel-collector.hp-factory-host.service` in
# thewoolleyman/otel-collector, which the fleet host guard now refuses to let
# anyone run. Its start order and its Wants are the role's defaults already.
otel_collector_config_file: config.hp-factory.yaml
otel_collector_user: otel-collector
otel_collector_group: otel-collector
otel_collector_manage_install: true
otel_collector_hardened: true
otel_collector_unit_description: >-
  otel-collector -- host OTel Collector on a Fabro factory host (agent-activity
  env, livespec-host-metrics dataset)
# The engine socket the configuration's docker_stats receiver reads. ProtectSystem
# restricts WRITES to the filesystem hierarchy, not socket I/O a process's group
# already grants it, so the membership and the sandbox coexist.
otel_collector_user_groups:
  - docker
# APPENDED, never rewritten: this host's `/etc/otel-collector/.env` already holds
# the agent-activity key its configuration also reads, placed by hand before the
# converge existed, and that one stays exactly as placed.
otel_collector_env_from_controller:
  - HONEYCOMB_INGEST_KEY_LIVESPEC

# --- otel_receiver ---
# RETIRED on this host 2026-11-02 (livespec-dev-tooling-j53hzi), through
# ansible/former-sandbox-hosts.yml. Its environment file, inside the retained
# read-only ~/.fabro, is left untouched.
otel_receiver_state: absent

# --- sandbox_storage ---
# The former Steam disk (Fanxiang S101 4 TB SATA SSD, was NTFS "4TB SSD"),
# wiped with the maintainer's confirmation on 2026-10-12 (work-item smrzsj).
# By-id so the name carries the serial: this host also has /dev/nvme0n1
# (Windows) and /dev/sdb (the USB backup disk), neither of which may ever be
# touched, and a /dev/sdX name is one SATA re-enumeration away from either.
sandbox_storage_device: /dev/disk/by-id/ata-Fanxiang_S101_4TB_FX233090446
# Sized to the summed per-container SWAP ALLOWANCE, not to RAM — maintainer
# direction of 2026-10-12 after sandboxes were OOM-killed with the 8 GB
# /swap.img full (one run lost ~5 h). Measured on the host: every sandbox runs
# with Memory=8 GB, MemorySwap=16 GB, so each may use 8 GB of swap; the fleet
# instance admits 15 concurrent runs (15 x 8 = 120 GB), and the candidate
# instance's petri containers carry no memory limit at all, so headroom is
# added on top. Unlikely to be used all at once, and that is fine: the volume
# is freshly formatted, the space is free, and the kernel's bookkeeping for
# 160 GB of swap is about 40 MB of RAM.
sandbox_storage_swap_size: 160GiB
# The scratch of the by-hand fpsync copy the maintainer authorised during the
# 2026-10-12 cutover; removed by the reclaim with the old stores.
sandbox_storage_reclaim_extra_paths:
  - /var/tmp/fpsync-containerd
  - /var/tmp/fpsync-containerd.log
  - /var/tmp/fpsync-docker
  - /var/tmp/fpsync-docker.log

# --- sccache_redis ---
# RETIRED on this host 2026-11-02 (livespec-dev-tooling-j53hzi), through
# ansible/former-sandbox-hosts.yml. Nothing reads it: CI pods use the in-cluster
# sccache-redis service.
sccache_redis_state: absent

# --- storage_reclaim ---
# RETIRED on this host 2026-11-02 (livespec-dev-tooling-j53hzi), through
# ansible/former-sandbox-hosts.yml. This host carries no interactive worktrees.
storage_reclaim_state: absent

# --- tailscale_serve ---
# RETIRED legacy Fabro serve ports (bd-ib-iud52v, the legacy Fabro carrier
# retirement). hp's fabro-server stopped on 2026-11-02, but tailscaled still
# served these three hand-made mappings with nothing behind them. hp publishes
# nothing; ansible/former-sandbox-hosts.yml runs the role for it.
tailscale_serve_retired_ports:
  - 32276
  - 32277
  - 32278

# --- factory_budget_reconciler ---
# FACTORY TRIAL, 2026-11-11: at most 1 factory sandbox pod (sandbox pods only,
# no Fabro server). Lowered 2 -> 1 at ~05:15Z on 2026-11-11 under the trial's
# GATES-FIRST rule: legacy-coordinator-agent measured gates-cq with 3 pending
# while gates-hp-flavor held 5 cpu of quota idle (05:08:46Z); hp's requests
# were 11.7 of 14.5 cpu and 21.6 of 27.2Gi, leaving 2.8 cpu / 5.6Gi, below one
# 5 cpu / 6Gi gate, with the 2 sandboxes holding 6 cpu / 14.9Gi. If gates
# still queue on hp at 1, the next step is 0. FACTORY_NODE=true again in the profile for this trial,
# decided by legacy-coordinator-agent consistent with the maintainer's pick
# (epic livespec-dev-tooling-ko26ez); it was 0 since FACTORY_NODE=false on
# 2026-11-03. Memory binds first (7.6 GiB per pod against 27 GiB allocatable).
# Judged on factory runs per hour, green rate and hp CI p95. Revert: 0 here and
# FACTORY_NODE=false in the profile (see the profile's FACTORY TRIAL block).
factory_pod_budget: 1

# --- k3s_config ---
# system.slice's root-level CPU share against kubepods.slice (567 on this 16-CPU
# node, which carries the factory-worker kubelet reservation budget), so
# k3s-agent, containerd and tailscaled are not starved when the node saturates
# (livespec-dev-tooling-cetudy; coordinator ruling 2026-11-08T09:51:16Z, fleet
# scope rule K). Measured 2026-11-08 ~10:05Z: system.slice at 100 was entitled to
# about 1.8 CPUs under full contention. 1000 entitles it to about 9.1 CPUs.
# Applied by a daemon-reload, no k3s restart; revert by removing this key and
# re-applying --tags k3s_system_slice_cpu_weight.
k3s_config_system_slice_cpu_weight: 1000

# --- controller_known_hosts ---
