# known_hosts by ansible/dev-host.yml (role controller_known_hosts). Fingerprint
# SHA256:YEq8NepgBNWE+WKJ4VVuy6ZUXNsySXjVFBYLNvYjJdQ. Verified 2026-11-11: the
# key the control node already trusted (a hand entry) equals the key the host
# presented live; its info repository records no fingerprint.
controller_known_hosts_ed25519: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMV5bdzm23d1z8RlkYoq9Flrx+tn5n5CqyDi8xN1x2FV"
