# hp-xubuntu — per-host values for the legacy fleet inventory.
#
# GENERATED by collecting each role's HOST_VARS.md. Do not hand-edit: change
# the owning role's HOST_VARS.md and regenerate, or the next regeneration
# silently discards the edit.
#
# Only values that genuinely vary by machine appear here. Anything the hosts
# agree on stays in the role's defaults/main.yml, so a reader can tell a
# deliberate per-host decision from a fleet default at a glance.

---

# --- container_reclaim ---
container_reclaim_canonical_host: hp-xubuntu.perch-rudd.ts.net
container_reclaim_system_hostname: hp-xubuntu

# --- disk_guard ---
disk_guard_threshold_gb: 40

# --- fabro_server ---
# The service account is cwoolley, NOT ubuntu: the tailnet ACL rejects the
# ubuntu account on this host, and the checkout root is under $HOME rather
# than /data/projects.
fabro_server_host_user: cwoolley
fabro_server_host_group: cwoolley
fabro_server_host_home: /home/cwoolley
fabro_server_host_checkout: /home/cwoolley/repos/livespec-orchestrator-beads-fabro
fabro_server_instances:
  - unit_name: fabro-server
    home_dir: /home/cwoolley/.fabro
    port: 32276
    canonical_host: hp-xubuntu.perch-rudd.ts.net:32276
    cli_target_url: http://127.0.0.1:32276
    # 15 = the core count minus one, reserved for the server, janitor steps
    # and host overhead. A maintainer instruction of 2026-08-21, not a copy of
    # vps's 10: hp earns a higher over-subscription factor (3.75x against
    # vps's 2.2x) by being a dedicated factory host at load 1.36, where vps is
    # a shared box carrying dozens of user sessions.
    max_concurrent_runs: 15
    github_app_id: "3668528"
    # Live on the host since 2026-08-21.
    otel_dropin: present
  - unit_name: fabro-server-mi-homelab
    home_dir: /home/cwoolley/.fabro-mi-homelab
    port: 32277
    canonical_host: hp-xubuntu.perch-rudd.ts.net:32277
    cli_target_url: http://127.0.0.1:32277
    # A chosen value, not an observation: the host's 16 cores are already
    # over-subscribed by the fleet instance's 15, and the org factory serves
    # one repository. Raise it deliberately, with the fleet instance's number
    # in view, never by copying the entry above.
    max_concurrent_runs: 5
    github_app_id: "4688510"
    # Live on the host since 2026-08-22.
    otel_dropin: present

# --- sccache_redis ---
sccache_redis_bind_addr: 172.17.0.1
sccache_redis_port: 6379
sccache_redis_maxmemory: 4gb
sccache_redis_container_memory: 5g

# --- storage_reclaim ---
storage_reclaim_canonical_host: hp-xubuntu.perch-rudd.ts.net
storage_reclaim_system_hostname: hp-xubuntu
storage_reclaim_service_user: cwoolley
storage_reclaim_home: /home/cwoolley
# storage_reclaim_worktree_root defaults to /home/cwoolley/.worktrees, which
# DOES NOT EXIST on this host and is not expected to. hp is a dedicated factory
# running sandboxed dispatches rather than interactive sessions, so the worktree
# layer that dominates the vps has never appeared here. The reclaimer treats a
# missing root as an empty inventory, and the role reports it rather than
# failing, so the mechanism is armed and reporting if the layer ever appears.
# storage_reclaim_checkout_roots defaults to /home/cwoolley/repos, which is
# correct here: 3 clones, measured 2026-08-22.
