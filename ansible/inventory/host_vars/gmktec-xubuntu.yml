# gmktec-xubuntu — per-host values for the legacy fleet inventory.
#
# GENERATED by collecting each role's HOST_VARS.md. Do not hand-edit: change
# the owning role's HOST_VARS.md and regenerate, or the next regeneration
# silently discards the edit.
#
# Only values that genuinely vary by machine appear here. Anything the hosts
# agree on stays in the role's defaults/main.yml, so a reader can tell a
# deliberate per-host decision from a fleet default at a glance.

---

# --- lan_ssh_fallback ---
# OpenSSH binds the WIRED LAN address only (never the tailnet address); the
# client aliases dial it. It is valid_lft forever and the address k3s pins
# (measured 2026-10-15); every run checks the interface still carries it.
lan_ssh_fallback_interface: eno1
lan_ssh_fallback_address: 192.168.1.156
lan_ssh_fallback_must_stay_running:
  - tailscaled.service
  - k3s-agent.service
  - local-homelab-llama-server.service

# --- docker_engine ---
# Measured read-only on gmktec-xubuntu 2026-10-18 ~02:05Z (role HOST_VARS.md,
# "The audit"). /etc/dpkg/dpkg.cfg.d is empty. Every apt hook in
# /etc/apt/apt.conf.d is the stock Ubuntu one (esm, packagekit, snapd,
# appstream, command-not-found, debconf preconfigure, synaptic); the guard's
# package step runs dpkg -i directly, so apt's hooks never run inside it.
docker_engine_must_stay_running:
  - local-homelab-llama-server.service
docker_engine_llm_health_url: http://100.79.195.82:8080/health
docker_engine_dpkg_config_digests:
  /etc/apt/apt.conf.d/01autoremove: 35b4360d9126e5e5efc1ce42cea8a957ba42921de749ad8502922d536c9f385c
  /etc/apt/apt.conf.d/01-vendor-ubuntu: 364d5eeac5475b7dddfd629899ea88b91ed8d8e8e319c29bb9dbd6772e87ed55
  /etc/apt/apt.conf.d/20apt-esm-hook.conf: f7ab45bab1355711fcd031d78299cc3c7767654e7bf3f66a716ee3f2eae93733
  /etc/apt/apt.conf.d/20auto-upgrades: b81a3a01864d5ed7f8d023f3fa86d65087ad6b85706d399dc229a60b1c784807
  /etc/apt/apt.conf.d/20packagekit: b4b98908ac8561a4823b23c724e65cc4c98f2067eb961a80816b3d15427522b4
  /etc/apt/apt.conf.d/20snapd.conf: 4f1a710936d83d53caa575af269db4311d7b461bdb1bb94ced5b1d331b0886ac
  /etc/apt/apt.conf.d/50appstream: 8e89df0e4cfa24c7db4a165e776f40af7e0477f0d290bea4334edf6655db72bd
  /etc/apt/apt.conf.d/50command-not-found: 3a6f9f5244e49bee66ce65101fb73e16ba90f7a6cbd19befeefdf2c63209e2f1
  /etc/apt/apt.conf.d/50unattended-upgrades: 88fb5cc2a1bbe749468213f6a9d351a8b668760d8a4c94eef5ad7f4723f19a6e
  /etc/apt/apt.conf.d/70debconf: db749e19baf3b72ca2c157c70c52522cae23d94bc8b2dc5793fd43d427445367
  /etc/apt/apt.conf.d/99synaptic: 44a9572816592bff7858122ec224d8e7e53c198035faca54c94b1fed9ab02c98
  /etc/dpkg/dpkg.cfg: fead43b89af3ea5691c48f32d7fe1ba0f7ab229fb5d230f612d76fe8e6f5a015
# The k3s control plane the observer's DNS-placement probe asks, reached the
# way node_status_credential's route is proven (guard child 9).
docker_engine_k3s_server: poweredge-xubuntu
docker_engine_k3s_server_argv: [sudo, -u, cwoolley, -H, ssh, -o, BatchMode=yes, poweredge-xubuntu, sudo]

# --- docker_sandbox_slice ---
# Coordinator ruling R138 (2026-10-18, on livespec-dev-tooling-dfixhe). The
# model lives in the GPU's own memory, not the 62 GB of OS RAM; system.slice
# holds ~21 GB steady (llama-server 10.2 GB, k3s-agent 7.2 GB) and
# kubepods.slice peaked at 27.4 GB for the 12 CI churn slots, leaving ~13.6 GB
# at CI peak. hp's 24G would oversubscribe the host by ~10 GB. CPU is
# plentiful, and a quota caps only the factory.
# Coordinator ruling R196 as amended (2026-10-18, on livespec-dev-tooling-jc5noe)
# raised it one step, 14G to 18G, for two concurrent runs (two 8 GB sandboxes plus
# 2 GB), once gmktec became the Petri-era factory's home. It is sized against the
# CI-churn PEAK, not a quiet reading: system.slice ~21 GB + kubepods.slice peak
# 27.4 GB + 18G = 66.4 of 62 GiB only if both peaks coincide with full slices,
# and one run measured 10.3 GB at its own peak. 22G is allowed only if the k3s
# owner caps the CI churn slots so it fits. The next step, three runs, is
# pre-approved once gmktec has run a day at two with this slice's memory.peak
# under 20 GB, /proc/pressure/memory full avg300 at 0, AND system + kubepods peak
# + the new slice under 62 GiB with swap untouched.
# MAINTAINER DIRECTIVE R259 (2026-10-19, on livespec-dev-tooling-dfixhe)
# supersedes the R138/R196 sizing above: EIGHT concurrent runs, slice 36G high /
# 40G max, cpu quota 2800%. Measured basis (petri capacity sampler, fabro 0.382,
# 2026-10-19): every run's sandbox ANON peaked at 2.61-2.64G; the earlier 10.3 GB
# memory.peak was mostly page cache, which memory.high reclaims under pressure.
# So 8 runs is about 21G anon. The 40G max can still oversubscribe the host if
# system.slice (~21 GB), the kubepods.slice CI peak (27.4 GB) and a full slice all
# coincide, so memory.high, not memory.max, is the working limit. Any sandbox OOM
# on this host is an INFRASTRUCTURE ending (R235).
docker_sandbox_slice_memory_high: 36G
docker_sandbox_slice_memory_max: 40G
docker_sandbox_slice_cpu_quota: "2800%"

# --- container_reclaim ---
container_reclaim_canonical_host: gmktec-xubuntu.perch-rudd.ts.net
container_reclaim_system_hostname: gmktec-xubuntu

# --- disk_guard ---
# hp's threshold. gmktec's root filesystem is 458G with 365G free (measured
# 2026-10-18), and it is the only disk the container stores can use.
disk_guard_threshold_gb: 40

# --- sandbox_storage ---
# OPTED OUT: gmktec-xubuntu has one disk (nvme0n1, Lexar NM790 2TB; measured
# 2026-10-18), so there is no second disk to put swap and the container stores
# on. ansible/fabro-hosts.yml skips the role on this word alone.
sandbox_storage_enabled: false

# --- sandbox_image_warm ---
# gmktec's catalog also declares livespec-ci-rust, so the warm pulls the
# python-rust-agent layer as well as python-agent. While gmktec is docker-backed,
# a tag the host lacks must be pulled before the first run needs it, or two runs
# race each other's first pull (livespec-dev-tooling-dq3km7). Coordinator rulings
# R668 and R671 (2026-10-22).
sandbox_image_warm_tag_prefixes:
  - python-agent
  - python-rust-agent

# --- sccache_redis ---
# Half of hp's figures. The redis container runs under Docker's cgroup-parent,
# inside the sandbox slice (40G since maintainer directive R259), so every byte it
# holds is a byte a sandbox cannot.
sccache_redis_bind_addr: 172.17.0.1
sccache_redis_port: 6379
sccache_redis_maxmemory: 2gb
sccache_redis_container_memory: 3g

# --- storage_reclaim ---
storage_reclaim_canonical_host: gmktec-xubuntu.perch-rudd.ts.net
storage_reclaim_system_hostname: gmktec-xubuntu
storage_reclaim_service_user: cwoolley
storage_reclaim_home: /home/cwoolley

# --- otel_receiver ---
# The receiver every Fabro instance on this host exports to on the Docker bridge
# gateway, as on hp. The ingest-key file is RENDERED from the control node's
# credential wrapper when absent, so nothing on this host is placed by hand.
otel_receiver_enabled: true
otel_receiver_user: cwoolley
otel_receiver_group: cwoolley
otel_receiver_home: /home/cwoolley
otel_receiver_env_file: /home/cwoolley/.fabro/storage/otel-receiver.env
otel_receiver_env_from_controller: HONEYCOMB_INGEST_KEY_LIVESPEC

# --- factory_kubeconfig ---
# cwoolley is the only login account on this host (measured 2026-10-18).
factory_kubeconfig_ssh_user: cwoolley

# --- fabro_server ---
# The current Fabro server (plan petri-factory-on-gmktec): the Petri-era v0.382
# carrier adeefec, production web UI, the same build hp's fabro-server-candidate
# runs. One instance, on the fleet port, under the account's own ~/.fabro.
fabro_server_host_user: cwoolley
fabro_server_host_group: cwoolley
fabro_server_host_home: /home/cwoolley
fabro_server_host_checkout: /home/cwoolley/repos/livespec-orchestrator-beads-fabro
# The host has no checkout (measured 2026-10-18), so the role clones it. Public.
fabro_server_host_checkout_remote: https://github.com/thewoolleyman/livespec-orchestrator-beads-fabro.git
# A fresh instance has no settings.toml to preserve, so the role writes it.
fabro_server_manage_settings: true
fabro_server_instances:
  - unit_name: fabro-server
    home_dir: /home/cwoolley/.fabro
    port: 32276
    canonical_host: gmktec-xubuntu.perch-rudd.ts.net:32276
    cli_target_url: http://127.0.0.1:32276
    # EIGHT (maintainer directive R259, superseding R196's two). Each livespec-ci
    # sandbox has an 8GB hard limit and measured anon peaks of about 2.6G, so eight
    # fit the 36G-high / 40G-max sandbox slice above. Change it only together with
    # the slice.
    max_concurrent_runs: 8
    github_app_id: "3668528"
    otel_dropin: present
    binary_source: /home/ubuntu/.local/state/fabro-web-prod/v0389-bf5a2dc35/fabro
    binary_sha256: b70c2ec605985344d1fbc83d371b57673a2c391b0b5e8dd3413d3a3fa5ffb853
    # The tag the orchestrator workflow pins today
    # (.claude-plugin/.fabro/workflows/implement-work-item/workflow.toml,
    # python-agent-v1.114.1). On this engine the catalog, not the workflow
    # table, decides the image, so the two must be bumped together.
    environments:
      - id: livespec-ci
        image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-agent-v1.114.1
        cpu: 4
        memory: 8GB
      # Serves repositories whose workflow pins the python-rust-agent layer:
      # livespec-console-beads-fabro, which builds Rust (R622). Its tag FOLLOWS
      # THAT repository's pin (.fabro/workflows/implement-work-item/workflow.toml,
      # python-rust-agent-v1.126.0), not the orchestrator's; bump the two
      # together. Coordinator ruling R668 (2026-10-22).
      - id: livespec-ci-rust
        image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-rust-agent-v1.126.0
        cpu: 4
        memory: 8GB
    # Created in the instance's vault only when it lacks the name, never
    # overwritten (roles/fabro_server/tasks/vault.yml). The App key comes from
    # the control node's credential wrapper. OPENAI_API_KEY is NOT a key: an
    # ACP-only graph fails admission with fabro.model.no_ready_provider unless
    # some provider is configured, which is why hp's candidate carries the same
    # placeholder (fabro-currency research 007).
    vault_secrets:
      - name: GITHUB_APP_PRIVATE_KEY
        type: file
        description: GitHub App 3668528 private key
        from_controller_env: GITHUB_PRIVATE_KEY
      - name: OPENAI_API_KEY
        type: token
        description: placeholder so ACP-only graphs pass fabro.model.no_ready_provider admission; not a real key
        value: placeholder-not-a-real-key
    service_state: running

  # The registered-provider carrier CANARY (plan kubernetes-sandbox-backend,
  # bd-ib-n7zj4a and bd-ib-nmuyjc.1 in the livespec-orchestrator-beads-fabro
  # tenant; coordinator rulings R668, R670, R673). It runs the next carrier
  # beside the fleet instance above, which this entry never touches: its own
  # unit, port, state root and build. Its runs prove the build before the
  # fleet instance's binary_source moves to it: an ordinary livespec-ci run
  # in Docker, a livespec-ci-k8s run in a pod, and both driven by the fleet's
  # pinned v0.382 client, which is the client/server compatibility check.
  # Two runs at most, because they share this host with the fleet's eight.
  # Retire it (service_state: stopped) once the fleet instance carries this
  # build.
  - unit_name: fabro-server-candidate
    home_dir: /home/cwoolley/.fabro-candidate
    port: 32278
    canonical_host: gmktec-xubuntu.perch-rudd.ts.net:32278
    cli_target_url: http://127.0.0.1:32278
    max_concurrent_runs: 2
    github_app_id: "3668528"
    otel_dropin: present
    binary_path: /home/cwoolley/.fabro-candidate/bin/fabro
    home_env: /home/cwoolley/.fabro-candidate
    # thewoolleyman/fabro carrier-candidate-registered-20261023: upstream main
    # 9d9cbe9f4, Fabro's registered-provider wiring, the bd-ib-6vhgqg telemetry
    # carries, and Petri built from thewoolleyman/petri
    # fabro-integration-registered-20261023 (Petri main with #122 and the
    # registered-provider resources change). Provenance is in BUILD_INFO.
    binary_source: /home/ubuntu/.local/state/fabro-web-prod/v0393-9b8ee43d8/fabro
    binary_sha256: 03ecd21735f270f60f4e78f49e5f2e02670e2405c12433ea1f18e17cd2fb55a0
    environments:
      - id: livespec-ci
        image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-agent-v1.114.1
        cpu: 4
        memory: 8GB
      # The Kubernetes twin of livespec-ci: the same envelope, run by the
      # kubernetes provider below. It declares NO image: a registered provider's
      # sandboxes are built from the provider's process_spec, which carries
      # livespec-ci's image, and Petri refuses a run whose environment names
      # one. Fabro's 8GB is decimal, so the pod carries 7629Mi.
      - id: livespec-ci-k8s
        cpu: 4
        memory: 8GB
        provider: kubernetes
    # The plugin the sandbox_driver_kubernetes role installs, at that role's
    # pinned digest. The protocol clears a plugin's environment, so HOME and
    # PATH are passed through; this instance's HOME is its own root, which is
    # why sandbox_driver_kubernetes_config_homes below lists it. The
    # process_spec is the sandbox every kubernetes sandbox is built from
    # (Petri #122's registered provider); a run's environment resources replace
    # its size, so it equals livespec-ci-k8s.
    sandbox_providers:
      kubernetes:
        path: /usr/local/bin/sandbox-driver-kubernetes
        sha256: acd90b1560e4950ef81ab17a618230412fb026b2dbb2cc412e73e9b17b2f0714
        inherit_env:
          - HOME
          - PATH
        process_spec:
          image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-agent-v1.114.1
          cpu_cores: 4
          memory_mb: 7629
    vault_secrets:
      - name: GITHUB_APP_PRIVATE_KEY
        type: file
        description: GitHub App 3668528 private key
        from_controller_env: GITHUB_PRIVATE_KEY
      - name: OPENAI_API_KEY
        type: token
        description: placeholder so ACP-only graphs pass fabro.model.no_ready_provider admission; not a real key
        value: placeholder-not-a-real-key
    service_state: running

# The kubernetes plugin reads $HOME/.config/sandbox-driver-kubernetes/config.toml,
# so every HOME that launches it needs a copy: the account home (operators and
# the fleet instance) and the canary instance's own root.
sandbox_driver_kubernetes_config_homes:
  - /home/cwoolley
  - /home/cwoolley/.fabro-candidate

# tailscale_serve: publish the fabro-server instance's loopback port on the
# tailnet, so the Dispatcher reaches https://gmktec-xubuntu.perch-rudd.ts.net:32276.
# hp-xubuntu and vps made theirs by hand and declare nothing (roles/tailscale_serve/HOST_VARS.md).
tailscale_serve_mappings:
  - https_port: 32276
    backend: http://127.0.0.1:32276
  # The registered-provider canary instance above.
  - https_port: 32278
    backend: http://127.0.0.1:32278
