---
# Group variables for `dev_hosts` — the maintainer's workstation/VPS, which is
# also this tree's control node and the only place the Dispatcher runs natively
# today. Values here apply to every host of the group; a value that is true of
# ONE machine belongs in `host_vars/<host>.yml` instead.

# --- fabro_factory_registry ---
#
# Which Fabro server instance answers to each logical factory name.
# `ansible/fabro-hosts.yml` renders this into `/etc/livespec/fabro-factories.json`
# on every host of this group, and a repository whose `dispatcher.factories`
# entry declares `"registry": true` resolves its address from that file by name.
#
# THE ONE PLACE A FACTORY IS BOUND TO A MACHINE (maintainer ruling 2026-10-15,
# plan `petri-factory-on-gmktec`, epic `bd-ib-fyozyd`). Moving a factory is a
# change to the two keys below plus a converge; no play, role or committed
# factory entry names the machine. See
# `ansible/roles/fabro_factory_registry/HOST_VARS.md`.
#
# A factory name names the INSTANCE, never its role, and stays the same for that
# instance's whole life: `legacy` is the 0.254 engine, which only retires,
# `petri` is the current Fabro server, and `mi-homelab` is the second Fabro
# server on `gmktec-xubuntu` — the one the `mi-homelab` organisation's GitHub App
# publishes as. Which one a repository dispatches to by default is carried by its
# own `dispatcher.default_factory`, so the fleet cutover between `legacy` and
# `petri` renames nothing and leaves no item's recorded factory orphaned. The
# Kubernetes move adds a further name and retires `petri`.
#
# `mi-homelab` NAMES THE UNIT, NOT THE PORT. Its instance is the host's second
# one, so the entry's `unit_name` is `fabro-server-mi-homelab` and not
# `fabro-server`: the two live on the same machine and are told apart only by
# that key, and an entry naming the wrong one resolves to a perfectly valid
# address that routes the organisation's dispatches onto the fleet factory.
# Declared here so the repository it serves can resolve its factory by name and
# stop committing the machine address (work-item `livespec-dev-tooling-r6kagr`;
# coordinator ruling R318, 2026-10-20). The registry publishes where a factory
# IS, never whether it is running.
#
# No entry declares a `docker_host`: no repository's committed factory table
# declares one today, and publishing one would newly turn on the Dispatcher's
# remote container sweep.
fabro_factory_registry:
  # `legacy` (the 0.254 engine on hp-xubuntu) is RETIRED and its name deleted:
  # its instance is stopped and no repository's committed factory table names
  # it, so nothing can resolve it and keeping the name would leave hp-xubuntu
  # carrying a factory role. Do not reuse the name for another instance.
  petri:
    host: gmktec-xubuntu
    unit_name: fabro-server
  # Re-pointed from hp-xubuntu to gmktec-xubuntu (work-item bd-ib-tavof6;
  # coordinator ruling R669(1)). This is the one exception to the
  # name-for-life rule above, and it is safe because no repository's committed
  # table named mi-homelab before the move, so no item can have recorded it as
  # its factory. homelab's own ratified Factory routing clause requires its
  # default to name mi-homelab.
  mi-homelab:
    host: gmktec-xubuntu
    unit_name: fabro-server-mi-homelab
  # `candidate` is gmktec's fabro-server-candidate (:32278): the permanent
  # mirror of `petri` and its hot fallback, owned by plan fabro-currency as its
  # dogfood factory (maintainer ruling 2026-11-02T19:22:32Z). Its runs share
  # gmktec, and the shared fleet cap, with `petri`.
  candidate:
    host: gmktec-xubuntu
    unit_name: fabro-server-candidate
  # The arm64 homelab workers' instance: its sandboxes run only on workers of
  # that architecture. Nothing selects it by default; a repository opts in with one committed
  # dispatcher.factories entry and names it per dispatch with --factory.
  homelab-worker-arm64:
    host: gmktec-xubuntu
    unit_name: fabro-server-homelab-worker-arm64

# --- fabro_client ---
#
# The pinned Fabro CLIENT builds this group's hosts stage for a Dispatcher
# running natively on them. `ansible/dev-host.yml` places each one at its `path`
# from the control-node `source`, verified against `sha256`; see
# `ansible/roles/fabro_client/HOST_VARS.md` for every key and the operator
# procedure, and SPECIFICATION/non-functional-requirements.md §"Dev host Fabro
# client builds" for the obligation.
#
# WHY TWO FAMILIES AND NOT ONE (work-item `livespec-dev-tooling-lirki2`,
# requested by plan `fabro-currency` at the fleet coordinator's direction,
# gitops-fleet-capacity-monitoring ruling, 2026-10-23). A Dispatcher here reaches
# two factories whose engines need incompatible client families. `legacy` is the
# 0.254 fork engine on hp-xubuntu; `petri` is the Petri-era engine on
# gmktec-xubuntu, and since the Kubernetes canary of 2026-10-23 that one holds a
# run with a `kubernetes` sandbox the 0.254 client cannot decode at all — so a
# 0.254 reader of it is blind rather than merely old. Neither client can serve
# both, and the R668 rollback to `legacy` stays usable through the bd-ib-iud52v
# soak, so BOTH are declared and each factory names its own.
#
# THE ORIGINAL TWO SOURCES ARE ALREADY STAGED ON THE CONTROL NODE, and that is not a
# coincidence: they are the same two builds `ansible/inventory/host_vars/hp-
# xubuntu.yml` carries as that host's `fabro_server` `binary_source` values —
# fabro 0.254.0 at 8869e88 and the v0.382 carrier at adeefec4c, both rebuilt
# 2026-10-16 with `NODE_ENV=production`. One staged tree, one digest per build,
# read by the server role for hp's units and by this role for this host's
# clients. A second copy of either build under a second name would be a second
# thing to keep current.
#
# THE PETRI PATH IS NOT A FREE CHOICE. It is byte-for-byte the `bin` this
# repository's own root `.livespec.jsonc` commits for the `petri` factory, which
# `check-dev-host-fabro-client-bins-declared` asserts: the file was staged BY
# HAND before this role existed, and declaring the path it already has is what
# brings it under GitOps without moving the file every repository's committed
# `bin` names. Its mode was reported as 0775 when the entry was filed, so the
# first converge tightens it to 0755. WHETHER THAT CONVERGE ALSO REWRITES THE
# FILE IS NOT KNOWN FROM HERE, and both answers are correct: the hand-staged
# copy either already hashes to the digest below, in which case its bytes are
# left untouched, or it does not, in which case the role stages the declared
# build and renames it into place atomically. Read the drift report before the
# first apply — it says which.
#
# THE LEGACY PATH IS A SIBLING OF IT, deliberately: `fabro-currency` is the tree
# the pinned client carriers already live in, so an operator listing one
# directory sees every build this host stages and which engine each is for. It
# is NOT under `~/.fabro/bin`, where the `fabro_server` role stages and RETAINS
# its own builds — the role refuses a declared path that denotes any server
# instance's `binary_path`, and on this host the PATH client is a symbolic link
# to exactly that file.
#
# No repository commits a `bin` for `legacy` yet; bd-ib-zb2hso step 1 is each
# repository committing one that names this path. Declaring the build before any
# `bin` names it is the right order — a committed `bin` naming a path nothing
# stages is the state this whole section exists to forbid.
fabro_client_builds:
  # fabro 0.254.0 (8869e88) — the legacy fork-engine client family.
  - path: /home/ubuntu/.local/state/fabro-currency/carrier-legacy-v0.254-8869e88/fabro
    source: /home/ubuntu/.local/state/fabro-web-prod/v0254-8869e88/fabro
    sha256: 199407cec8119735fc0751407272ba3282703bd45ada87d34a89cc8f62a22421
  # fabro 0.382.0-nightly.0 (adeefec4c) — the Petri-era carrier client family.
  - path: /home/ubuntu/.local/state/fabro-currency/carrier-petri-v0.382-adeefec4c/fabro
    source: /home/ubuntu/.local/state/fabro-web-prod/v0382-adeefec/fabro
    sha256: 26872440c75c50edfd59a0d33f1401baf70a9e5de81fb65192a1f7042817f7c1
  # R301 homelab rollout: fabro 0.393.0-nightly.1 (613add1 2026-11-02),
  # source thewoolleyman/fabro 613add19ca15ee0e05a92f688d559dace0e64b36,
  # Petri e92b191. The same owned staged artifact serves main Petri :32276.
  # Retain the earlier clients for repositories and live jobs that name them.
  - path: /home/ubuntu/.local/state/fabro-currency/carrier-petri-v0.393-613add19c/fabro
    source: /home/ubuntu/.local/state/fabro-web-prod/v0393-613add19c/fabro
    sha256: def1dc89890c0481f8e733016ab78481dd2f26d8cab9248eb6b4b1fec5f6a344
  # fabro 0.393.0-nightly.1 (85af354 2026-11-04), source thewoolleyman/fabro
  # 85af3547ebbc9c0b7f6947d7959f2d0b892d7432, Petri d25a6c15. Every gmktec
  # instance serves it since 2026-11-05 (main :32276 from 16:40:11Z); it carries
  # the dispatch-push retry (bd-ib-uctbct), the tail events read (bd-ib-dmjsmd)
  # and the board-read compression (bd-ib-xoh477). Plan fabro-currency.
  - path: /home/ubuntu/.local/state/fabro-currency/carrier-petri-v0.393-85af3547e/fabro
    source: /home/ubuntu/.local/state/fabro-web-prod/v0393-85af3547e/fabro
    sha256: d6fcfafab6da1bfd32c3b96b4153f93367fe8a5b4fc18b0efecacad80b1e5711
  # fabro 0.393.0-nightly.1 (bbe6938 2026-11-06), source thewoolleyman/fabro
  # bbe693847, Petri c6bfd5e3 (the post-exit output drain that waits out a
  # stalled consumer, bd-ib-aqcgxz). Every gmktec instance serves it since
  # 2026-11-07 (main :32276 from 03:43Z, candidate and mi-homelab from 14:33Z).
  # Its only runtime difference from 85af3547e is that server-side step change,
  # so the 85af3547e entry above stays for the repositories that still name it.
  # Plan fabro-currency.
  - path: /home/ubuntu/.local/state/fabro-currency/carrier-petri-v0.393-bbe693847/fabro
    source: /home/ubuntu/.local/state/fabro-web-prod/v0393-bbe693847/fabro
    sha256: 1529aa9f86b5bf346ae20a731bdf1cb433bc678825c8a43d0c21f513dac0ab1f

# --- local_gate_slots ---
#
# How many fleet gate test runs this group's hosts execute at once, across every
# repository and worktree on them. `ansible/dev-host.yml` writes it to
# `/etc/livespec/local-gate-slots`, which the `livespec_dev_tooling`
# pytest plugin reads; every fleet repository loads that plugin because every
# fleet repository depends on the package. See
# `ansible/roles/local_gate_slots/HOST_VARS.md` and
# SPECIFICATION/non-functional-requirements.md section "Local gate concurrency
# limit".
#
# THREE, DERIVED FROM A MEASUREMENT RATHER THAN CHOSEN. The host has 18 cores.
# At 2026-10-24 01:34Z it ran 95.8% busy (mpstat), PSI cpu some avg60 69%, load
# 78, with four to five concurrent `pytest -n 4 --cov` gate aggregates — each
# measured at about four cores. Three bounds local test runs at about 12 cores
# and leaves about 6 for agent sessions, the Fabro servers and Dolt.
#
# IT IS A STOPGAP AND THE SPEC SAYS SO. Plan `delegated-gate-fleet-rollout`
# (epic `livespec-dev-tooling-mvalxq`) moves the heavy gates onto the cluster;
# once livespec, livespec-overseer and livespec-console-beads-fabro delegate
# theirs, this line SHOULD be deleted. Deleting it is the whole rollback: the
# role default is zero, which is no limit.
local_gate_slots_limit: 3
