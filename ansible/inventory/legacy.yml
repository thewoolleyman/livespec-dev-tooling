# ---------------------------------------------------------------------------
# LEGACY-ONLY inventory — the pre-Talos Ubuntu machines, and ONLY those.
#
# A TALOS NODE MUST NEVER APPEAR IN THIS FILE. Talos exposes an API and no
# shell, the homelab specification forbids anything depending on shell access
# to a Talos node, and that fleet's desired state is owned by Omni and Flux.
# An entry here for a machine those own would give it two declared owners,
# which is the one interference risk this tree has to fence. Ansible cannot
# reach a Talos node even by accident; this header is what stops someone
# adding one on purpose.
#
# These four machines "remain independent and manually managed while their
# workloads migrate" (homelab `docs/talos-omni-architecture-and-rollout.md`).
# They are a sunset substrate. When a machine's workload moves to the Talos
# fleet, delete its entry here rather than porting anything.
#
# Group meanings:
#   dev_hosts     — the maintainer's workstation/VPS; also the control node.
#   ci_pool       — the k3s cluster's nodes. `cluster_role` selects the
#                   server-only steps, replacing install-node.sh's STEP_SKIP.
#   sandbox_hosts — the Fabro sandbox machines.
#   usb_backup_hosts — machines with a committed local USB backup volume
#                   (ansible/poweredge-backup.yml).
#   home_lab      — the machines on the maintainer's home LAN.
#
# A play names one of these GROUPS, never a host: a machine is bound only here
# and in host_vars (livespec-dev-tooling-prdxxe; `just
# check-ansible-hostname-free` refuses a regression).
#
# hp-xubuntu LEFT `sandbox_hosts` on 2026-11-02 (plan gmktec-factory-placement,
# item livespec-dev-tooling-2yn4yb). It had been a Fabro FACTORY host that also
# joined the k3s pool as a factory-only agent (livespec-dev-tooling-7we6po).
# What changed:
# - Every repository now dispatches to the Fabro server on gmktec-xubuntu.
# - hp's three Fabro instances are stopped and disabled, and their binaries and
#   state are kept on disk read-only (livespec-dev-tooling-yw7via).
# - Its Docker sandbox slice was retired through the role.
# hp is now ONLY in `ci_pool`, where ansible/ci-pool.yml reaches it, and it is
# being reworked into a Kubernetes factory worker (bd-ib-nmuyjc). Its kubelet
# reservation budget is recorded with the k3s_config role, in
# ansible/roles/k3s_config/HOST_VARS.md. ansible/fabro-hosts.yml no longer
# reaches hp. To return it as a Fabro host, re-add it here, restore its
# `fabro_server_instances` from git history, and re-apply.
# ---------------------------------------------------------------------------
all:
  children:
    legacy:
      children:
        dev_hosts:
          hosts:
            vps:
              # The control node manages itself over a local connection, so a
              # run needs no ssh credential toward this machine and no inbound
              # reachability to it.
              ansible_connection: local
        ci_pool:
          hosts:
            poweredge-xubuntu:
              ansible_user: cwoolley
              cluster_role: server
            gmktec-xubuntu:
              ansible_user: cwoolley
              cluster_role: agent
            # A FACTORY-ONLY agent: it joins the pool and executes no CI job.
            # The posture is its committed profile's, not this file's — the play
            # reads CI_NODE_FACILITIES=none out of
            # ci-runner/k3s/phase0-bare-metal/profiles/hp-xubuntu.env and gates
            # the tier and job-execution roles off it. It left `sandbox_hosts` on
            # 2026-11-02; see the header.
            hp-xubuntu:
              ansible_user: cwoolley
              cluster_role: agent
        # Hosts that LEFT `sandbox_hosts` and still carry what its play
        # installed. ansible/former-sandbox-hosts.yml converges them: it keeps the
        # sandbox-play roles a host still needs, and retires the rest through each
        # role's `<role>_state: absent` (livespec-dev-tooling-j53hzi).
        former_sandbox_hosts:
          hosts:
            hp-xubuntu:
              ansible_user: cwoolley
        sandbox_hosts:
          hosts:
            # The current Fabro server's host (plan petri-factory-on-gmktec). An
            # untainted CI node too, so it is in ci_pool, sandbox_hosts and
            # docker_engine_hosts; its Docker must be confirmed by
            # ansible/docker-engine.yml before fabro-hosts.yml installs a server.
            gmktec-xubuntu:
              ansible_user: cwoolley
        usb_backup_hosts:
          hosts:
            poweredge-xubuntu:
        # The machines on the maintainer's home LAN, which reach one another
        # by direct OpenSSH as a fallback that does not depend on Tailscale
        # (ansible/lan-ssh-fallback.yml, role lan_ssh_fallback). The control
        # node `vps` is a cloud host and is NOT a member: it reaches these
        # through a jump over one of them.
        home_lab:
          hosts:
            poweredge-xubuntu:
            hp-xubuntu:
            gmktec-xubuntu:
        # Where the docker_engine role's disposable acceptance VMs run
        # (ansible/docker-engine-acceptance.yml): a KVM host, as the
        # inventory's own user with no become. Coordinator ruling R59
        # (2026-10-16, on livespec-dev-tooling-dfixhe) ruled it usable, with a
        # bound of 8 VMs, 32 vCPU and 64 GiB. hp-xubuntu, which runs live
        # factory work, and gmktec-xubuntu, the converge target, must never be
        # added here.
        docker_engine_acceptance_hosts:
          hosts:
            poweredge-xubuntu:
        # The hosts the guarded Docker engine install (ansible/docker-engine.yml)
        # converges. A host joins deliberately and only once: hp-xubuntu, whose
        # Docker was installed by hand, must never be added.
        docker_engine_hosts:
          hosts:
            gmktec-xubuntu:
