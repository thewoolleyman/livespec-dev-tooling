# ---------------------------------------------------------------------------
# LEGACY-ONLY inventory — the pre-Talos Ubuntu machines, and ONLY those.
#
# A TALOS NODE MUST NEVER APPEAR IN THIS FILE. Talos exposes an API and no
# shell, the homelab specification forbids anything depending on shell access
# to a Talos node, and that fleet's desired state is owned by Omni and Flux.
# An entry here for a machine those own would give it two declared owners,
# which is the one interference risk this tree has to fence. Ansible cannot
# reach a Talos node even by accident; this header is what stops someone
# adding one on purpose.
#
# These four machines "remain independent and manually managed while their
# workloads migrate" (homelab `docs/talos-omni-architecture-and-rollout.md`).
# They are a sunset substrate. When a machine's workload moves to the Talos
# fleet, delete its entry here rather than porting anything.
#
# Group meanings:
#   dev_hosts     — the maintainer's workstation/VPS; also the control node.
#   ci_pool       — the k3s cluster's nodes. `cluster_role` selects the
#                   server-only steps, replacing install-node.sh's STEP_SKIP.
#   sandbox_hosts — the Fabro sandbox machines.
#   usb_backup_hosts — machines with a committed local USB backup volume
#                   (ansible/poweredge-backup.yml).
#   home_lab      — the machines on the maintainer's home LAN.
#   interactive_claude_hosts — machines where the maintainer runs interactive
#                   Claude Code sessions; ansible/claude-messaging.yml forces
#                   SendMessage over pane typing there (plan
#                   distributed-sendmessage), and ansible/claude-memory-guard.yml
#                   installs the managed memory-write guard there
#                   (livespec-dev-tooling-pik7f2). hetzner-xubuntu is one too,
#                   but its own repository, hetzner-xubuntu-info, converges it.
#
# A play names one of these GROUPS, never a host: a machine is bound only here
# and in host_vars (livespec-dev-tooling-prdxxe; `just
# check-ansible-hostname-free` refuses a regression).
#
# hp-xubuntu LEFT `sandbox_hosts` on 2026-11-02 (plan gmktec-factory-placement,
# item livespec-dev-tooling-2yn4yb). It had been a Fabro FACTORY host that also
# joined the k3s pool as a factory-only agent (livespec-dev-tooling-7we6po).
# What changed:
# - Every repository now dispatches to the Fabro server on gmktec-xubuntu.
# - hp's three Fabro instances are stopped and disabled, and their binaries and
#   state are kept on disk read-only (livespec-dev-tooling-yw7via).
# - Its Docker sandbox slice was retired through the role.
# hp is now ONLY in `ci_pool`, where ansible/ci-pool.yml reaches it, and it is
# being reworked into a Kubernetes factory worker (bd-ib-nmuyjc). Its kubelet
# reservation budget is recorded with the k3s_config role, in
# ansible/roles/k3s_config/HOST_VARS.md. ansible/fabro-hosts.yml no longer
# reaches hp. To return it as a Fabro host, re-add it here, restore its
# `fabro_server_instances` from git history, and re-apply.
# ---------------------------------------------------------------------------
all:
  children:
    # Dispatch hosts that this tree reaches ONLY to log their Fabro client in
    # to every registered factory (ansible/fabro-hosts.yml's dispatch-client
    # play; group_vars/fabro_dispatch_clients.yml). They are deliberately NOT
    # under `legacy`: they are not sunset machines, and their own provisioning
    # lives in their own repository. Any later dispatch host joins here
    # (livespec-dev-tooling-yyadq6).
    fabro_dispatch_clients:
      hosts:
        # The Hetzner interactive AI host that takes the dispatch seats off
        # the VPS, governed by hetzner-xubuntu-info (its hxi-3euehs). It is
        # reached over the tailnet's OpenSSH as `ubuntu`, per the
        # tailscale-admin record.
        hetzner-xubuntu:
          ansible_user: ubuntu
    # The maintainer's Macs that run interactive Claude Code sessions
    # (livespec-dev-tooling-i76rv2). The one non-Ubuntu group in this tree, and
    # converged ONLY for claude_memory_write_guard by
    # ansible/claude-memory-guard-macs.yml: no other play may select it. Each
    # is named by its full tailnet name and reached by ORDINARY ssh as
    # cwoolley, never Tailscale SSH (the macOS GUI client hosts none); see
    # group_vars/interactive_claude_macs.yml.
    interactive_claude_macs:
      hosts:
        chads-macbook-pro.perch-rudd.ts.net:
        macbook-air.perch-rudd.ts.net:
        macbook-m4-max.perch-rudd.ts.net:
        macmini.perch-rudd.ts.net:
    # The homelab worker hosts (livespec-dev-tooling-qpmzxa, plan
    # homelab-k8s-worker-nodes): macOS hosts that run a homelab worker VM and
    # receive the committed homelab-worker scripts at a release tag from
    # ansible/homelab-worker-scripts.yml. Its OWN group: a host also in
    # interactive_claude_macs stays there for the memory-write guard, and no
    # play selects this group for anything but this delivery. The inventory
    # name is the short host name the worker's own name derives from; it is
    # reached by ORDINARY ssh as cwoolley, never Tailscale SSH.
    homelab_workers:
      hosts:
        macbook-m4-max:
          ansible_host: macbook-m4-max.perch-rudd.ts.net
    # The credential-rotation ROLE HOLDER (livespec-overseer plan
    # central-credential-service): the one host that runs caam-delivery-push and pushes
    # credentials to the listed hosts. THE ONE PLACE the role is bound to a machine;
    # ansible/caam-role-holder.yml selects this group, never a host name, so moving the
    # role is a change to this membership plus a converge. The host keeps every variable
    # its other groups give it (the vps's control-node connection guard included).
    caam_role_holder:
      hosts:
        vps: {}
    # THE STAGED NEXT ROLE HOLDER (plan central-credential-service, epic overseer-iyfjbo;
    # contracts.md "Moving the role"). It is deliberately NOT a member of
    # `caam_role_holder`: that group must resolve to exactly ONE holder and stays `vps`
    # until the cutover PR, which moves this entry into it and deletes `vps` from it
    # in one change. `ansible/caam-role-holder.yml` reaches this group only when run
    # with `-e caam_role_holder_group=caam_role_holder_next` (the `dev_host_group`
    # pattern), so the default play still selects exactly `vps`. Its group_vars is a
    # symlink to caam_role_holder.yml so the two never diverge on the pinned ref.
    #
    # The entry is an alias keyed by hetzner-xubuntu's machine-id: its connection is
    # `local`, valid only where the controller's /etc/machine-id equals
    # caam_role_holder_machine_id. On any other controller (the vps included) the play
    # REFUSES for this entry before its first task and names both machine-ids, exactly
    # as the `vps` and `control-node` entries do. So neither staged selection can
    # converge the wrong machine: the default group's only entry is valid on the vps
    # alone, this group's only entry on hetzner-xubuntu alone.
    caam_role_holder_next:
      hosts:
        caam-role-holder-hetzner:
          caam_role_holder_machine_id: 0cba40e2d13946e8a1605ab5f0236046
          caam_role_holder_identity_found: >-
            {{ lookup('ansible.builtin.file', control_node_identity_file | default('/etc/machine-id')) | trim }}
          ansible_connection: >-
            {{ 'local' if caam_role_holder_identity_found == caam_role_holder_machine_id
            else undef(hint='REFUSED: the caam_role_holder_next entry uses a local connection, which is valid'
            ~ ' only on hetzner-xubuntu (machine-id ' ~ caam_role_holder_machine_id
            ~ '), and this controller has machine-id ' ~ caam_role_holder_identity_found
            ~ '. Run the play selecting caam_role_holder_next from hetzner-xubuntu.') }}
    # THE CONTROL-NODE ROLE (livespec-dev-tooling bd-ib-voazyv S3, with ctete5's
    # converge trigger, on the maintainer's 2026-11-18 VPS migration ruling: the VPS
    # keeps only overseerd and caam-anthropic-loop-runner). The control node is the
    # machine `ansible-apply` runs from and that runs the coordinators; today that is
    # hetzner-xubuntu. THE ONE PLACE the role is bound to a machine is the
    # control_node_machine_id below: plays select this GROUP, never a host name,
    # and the group holds exactly ONE entry (tests/livespec_dev_tooling/
    # test_control_node_role_group.py). Moving the role is one change here, the new
    # control node's `cat /etc/machine-id`, plus a converge from that machine.
    #
    # The entry is an alias, not a hostname: its connection is `local`, valid only
    # where the controller's machine-id equals control_node_machine_id. On any other
    # controller a play that selects the group REFUSES at its first task and names
    # both machine-ids, exactly as the `vps` entry below does, so an accidental run
    # from another seat never converges that seat as if it were the control node.
    # `control_node_identity_file` exists for the guard's own test; passing it as an
    # extra var also bypasses the guard, which is deliberate (a guard against an
    # accidental run, not a security boundary against an operator who sets it).
    control_node_role:
      hosts:
        control-node:
          control_node_machine_id: 0cba40e2d13946e8a1605ab5f0236046
          control_node_identity_found: >-
            {{ lookup('ansible.builtin.file', control_node_identity_file | default('/etc/machine-id')) | trim }}
          ansible_connection: >-
            {{ 'local' if control_node_identity_found == control_node_machine_id
            else undef(hint='REFUSED: the control_node_role entry uses a local connection, which is valid'
            ~ ' only on the control node (machine-id ' ~ control_node_machine_id
            ~ '), and this controller has machine-id ' ~ control_node_identity_found
            ~ '. Run plays that select control_node_role from the control node.') }}
    # THE REMOTE ALIAS OF THE VPS DEV HOST (livespec-dev-tooling bd-ib-voazyv S3). It
    # lets the control node (hetzner-xubuntu) run ansible/dev-host.yml against the VPS
    # over ssh, to drift-check and apply the dev-host roles while they move off it.
    # It is in NO `dev_hosts` group: a play that selects `dev_hosts` still reaches
    # exactly `vps`, and `dev-host.yml` reaches this alias only when run with
    # `-e dev_host_group=dev_hosts_remote`, so exactly one of `vps` and `vps-remote`
    # is selected per controller. Its host_vars and group_vars are symlinks to the
    # vps's and dev_hosts', so the two never diverge. The account is `ubuntu`, per
    # the tailscale-admin record (a bare ssh uses the caller's own account).
    dev_hosts_remote:
      hosts:
        vps-remote:
          ansible_host: vps.perch-rudd.ts.net
          ansible_user: ubuntu
    legacy:
      children:
        dev_hosts:
          hosts:
            vps:
              # The control node manages itself over a local connection, so a
              # run needs no ssh credential toward this machine and no inbound
              # reachability to it.
              #
              # A local connection runs on WHATEVER machine launched ansible,
              # so it is guarded by the controller's identity
              # (livespec-dev-tooling-fy6ip4). It resolves to `local` only
              # when the controller's machine-id is the control node's
              # (vmi3006760.contaboserver.net). On any other controller, a
              # hetzner-xubuntu seat for instance, every play that selects
              # `vps` fails for it before its first task and names both
              # machine-ids, rather than converging that controller as if it
              # were the VPS. A rebuilt VPS gets a new machine-id: re-measure
              # `cat /etc/machine-id` on it and update this value.
              # `control_node_identity_file` exists for the guard's own test.
              # Passing it as an extra var (`-e control_node_identity_file=…`)
              # also bypasses the guard. That is deliberate: this is a guard
              # against an ACCIDENTAL run from the wrong controller, not a
              # security boundary against an operator who sets it on purpose.
              control_node_machine_id: 22d4402d76894de4843c054c6c47ecbe
              # The machine-id of the controller running this ansible: a lookup
              # always runs on the controller, never on the target.
              control_node_identity_found: >-
                {{ lookup('ansible.builtin.file', control_node_identity_file | default('/etc/machine-id')) | trim }}
              ansible_connection: >-
                {{ 'local' if control_node_identity_found == control_node_machine_id
                else undef(hint='REFUSED: the vps inventory entry uses a local connection, which is valid'
                ~ ' only on the control node vmi3006760.contaboserver.net (machine-id '
                ~ control_node_machine_id ~ '), and this controller has machine-id '
                ~ control_node_identity_found ~ '. Run plays that select vps from the control node.') }}
        ci_pool:
          hosts:
            poweredge-xubuntu:
              ansible_user: cwoolley
              cluster_role: server
            gmktec-xubuntu:
              ansible_user: cwoolley
              cluster_role: agent
            # A FACTORY agent that also takes CI runner pods without carrying a
            # storage tier (since 2026-11-03, livespec-dev-tooling-zreev4). The
            # posture is its committed profile's, not this file's — the play
            # reads CI_NODE_FACILITIES=runner-only out of
            # ci-runner/k3s/phase0-bare-metal/profiles/hp-xubuntu.env and gates
            # the tier role off it. It left `sandbox_hosts` on
            # 2026-11-02; see the header.
            hp-xubuntu:
              ansible_user: cwoolley
              cluster_role: agent
            # The maintainer's dual-boot gaming PC, a k3s AGENT since 2026-11-11
            # (plan homelab-k8s-worker-nodes, epic livespec-dev-tooling-ko26ez).
            # Runner-only CI, one gate lane and one factory sandbox pod, per its
            # profile ci-runner/k3s/phase0-bare-metal/profiles/gamingpc-xubuntu.env.
            # No Fabro server, so it is in no fabro-hosts or sandbox_hosts group.
            # Its operator account is `ubuntu`. Not yet in `home_lab`: its
            # lan-ssh-fallback host_vars are a separate change.
            gamingpc-xubuntu:
              ansible_user: ubuntu
              cluster_role: agent
        # Hosts that LEFT `sandbox_hosts` and still carry what its play
        # installed. ansible/former-sandbox-hosts.yml converges them: it keeps the
        # sandbox-play roles a host still needs, and retires the rest through each
        # role's `<role>_state: absent` (livespec-dev-tooling-j53hzi).
        former_sandbox_hosts:
          hosts:
            hp-xubuntu:
              ansible_user: cwoolley
        sandbox_hosts:
          hosts:
            # The current Fabro server's host (plan petri-factory-on-gmktec). An
            # untainted CI node too, so it is in ci_pool, sandbox_hosts and
            # docker_engine_hosts; its Docker must be confirmed by
            # ansible/docker-engine.yml before fabro-hosts.yml installs a server.
            gmktec-xubuntu:
              ansible_user: cwoolley
        usb_backup_hosts:
          hosts:
            poweredge-xubuntu:
        # Interactive Claude Code hosts (ansible/claude-messaging.yml,
        # ansible/claude-memory-guard.yml).
        interactive_claude_hosts:
          hosts:
            vps:
            gamingpc-xubuntu:
        # Hosts whose session account holds a CLUSTER-ADMIN kubeconfig
        # (ansible/admin-kubeconfig.yml, role admin_kubeconfig,
        # livespec-dev-tooling-uf2pgj), so kubectl works there with no ssh to the
        # control-plane node. Add a host only after a second look at the credential
        # path: the file can do anything in the cluster. hetzner-xubuntu joins when
        # hetzner-xubuntu-info's hxi_kubeconfig consumes this role and drops its copy.
        cluster_admin_hosts:
          hosts:
            vps:
        # The machines on the maintainer's home LAN, which reach one another
        # by direct OpenSSH as a fallback that does not depend on Tailscale
        # (ansible/lan-ssh-fallback.yml, role lan_ssh_fallback). The control
        # node `vps` is a cloud host and is NOT a member: it reaches these
        # through a jump over one of them.
        home_lab:
          hosts:
            poweredge-xubuntu:
            hp-xubuntu:
            gmktec-xubuntu:
        # Where the docker_engine role's disposable acceptance VMs run
        # (ansible/docker-engine-acceptance.yml): a KVM host, as the
        # inventory's own user with no become. Coordinator ruling R59
        # (2026-10-16, on livespec-dev-tooling-dfixhe) ruled it usable, with a
        # bound of 8 VMs, 32 vCPU and 64 GiB. hp-xubuntu, which runs live
        # factory work, and gmktec-xubuntu, the converge target, must never be
        # added here.
        docker_engine_acceptance_hosts:
          hosts:
            poweredge-xubuntu:
        # The hosts the guarded Docker engine install (ansible/docker-engine.yml)
        # converges. A host joins deliberately and only once: hp-xubuntu, whose
        # Docker was installed by hand, must never be added.
        docker_engine_hosts:
          hosts:
            gmktec-xubuntu:
