---
- name: Install cluster access for the delegated pre-push gate
  hosts: dev_hosts
  gather_facts: true
  roles:
    # THE CREDENTIAL ONLY. This play installed a `gate_renderer` role too — the
    # Job renderer the gate client fell back to when the consuming repository
    # carried none of its own (livespec-dev-tooling-saxz's host leg, 2026-10-17)
    # — and that role is GONE on purpose (livespec-dev-tooling-vurvjl).
    #
    # Nothing re-converges this playbook: no timer, unit or release hook runs it
    # on the dev host. So the renderer it installed moved only when an operator
    # remembered, while the client that drives that renderer moved with every
    # package release. On 2026-10-20 the gap bit the whole fleet — a client
    # released with `--gate-ref` met a 2026-10-18 renderer that rejected it, and
    # every delegated push from every other repository was refused for a day
    # (stop-the-line R283). The renderer now ships INSIDE the wheel beside the
    # client, so writer and reader move as one artifact and there is no host
    # copy left to go stale.
    #
    # ⛔ Do NOT re-add a renderer install here. A renderer a release cannot
    # reach is the defect, not the remedy;
    # `tests/livespec_dev_tooling/test_gate_renderer_on_delegating_hosts.py`
    # fails if one comes back.
    - gates_kubeconfig
