# Ansible configuration for the LEGACY-ONLY fleet tree.
#
# Read the header of inventory/legacy.yml before adding a host. This tree
# manages the pre-Talos Ubuntu machines only, and nothing here may ever
# target a Talos node.
[defaults]
inventory = inventory/legacy.yml
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
# Skipped tasks are SHOWN, deliberately, even though it makes a run noisier.
# Suppressing them hid a real finding during Phase 2: a task that a dry run
# skips vanishes from the output entirely rather than appearing as a would-be
# change, so the drift report read clean over a service that had never been
# provisioned at all. A report whose value is completeness must not be allowed
# to omit the very lines that say "this was not evaluated".
display_skipped_hosts = True
# Diff on by default: the drift report IS `--check --diff`, so making diff
# the default removes a flag from the one command an operator must remember.
nocows = True

[ssh_connection]
pipelining = True
