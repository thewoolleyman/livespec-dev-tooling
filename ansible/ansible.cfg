# Ansible configuration for the LEGACY-ONLY fleet tree.
#
# Read the header of inventory/legacy.yml before adding a host. This tree
# manages the pre-Talos Ubuntu machines only, and nothing here may ever
# target a Talos node.
[defaults]
inventory = inventory/legacy.yml
roles_path = roles
host_key_checking = False
interpreter_python = auto_silent
display_skipped_hosts = False
# Diff on by default: the drift report IS `--check --diff`, so making diff
# the default removes a flag from the one command an operator must remember.
nocows = True

[ssh_connection]
pipelining = True
