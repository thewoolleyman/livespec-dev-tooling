---
# factory-sandbox-loss-drill.yml — the committed, consent-gated route for
# deleting one named Fabro factory sandbox pod.  It never creates or deletes a
# namespace, node, NetworkPolicy, or any other object.

- name: Delete exactly one named Fabro sandbox pod
  hosts: ci_pool
  gather_facts: false
  become: true
  vars:
    factory_sandbox_loss_drill_namespace: factory
    factory_sandbox_loss_drill_namespaces: [factory, factory-mi-homelab]
    factory_sandbox_loss_drill_admin_kubeconfig: /etc/rancher/k3s/k3s.yaml
    factory_sandbox_loss_drill_run_repository: https://github.com/thewoolleyman/livespec-orchestrator-beads-fabro.git
    factory_sandbox_loss_drill_default_branch: master
    factory_sandbox_loss_drill_checkout_root: /tmp
    factory_sandbox_loss_drill_wait_interval: 2
    factory_sandbox_loss_drill_wait_retries: 30
    factory_sandbox_loss_drill_named: >-
      {{ factory_sandbox_loss_drill_confirm | default('') == inventory_hostname
         and cluster_role | default('') == 'server'
         and factory_sandbox_loss_drill_run_id | default('') | length > 0 }}
    factory_sandbox_loss_drill_bad_run_id: >-
      {{ factory_sandbox_loss_drill_run_id | default('') is not match('^[A-Za-z0-9]([A-Za-z0-9_.-]{0,61}[A-Za-z0-9])?$') }}
  environment:
    KUBECONFIG: "{{ factory_sandbox_loss_drill_admin_kubeconfig }}"
  tasks:
    - name: Report an unconsented or unnamed drill without reading the cluster
      ansible.builtin.debug:
        msg: >-
          Not drilling {{ inventory_hostname }}: confirmation must name this k3s
          server and `factory_sandbox_loss_drill_run_id` must be non-empty.
          Nothing was read and nothing was changed.
      when: not (factory_sandbox_loss_drill_named | bool)

    - name: Refuse an invalid run label before kubectl
      ansible.builtin.fail:
        msg: >-
          Refusing factory sandbox loss drill: run id
          `{{ factory_sandbox_loss_drill_run_id | default('<unset>') }}` is not a
          valid Kubernetes label value. Nothing was read and nothing was changed.
      when:
        - factory_sandbox_loss_drill_named | bool
        - factory_sandbox_loss_drill_bad_run_id | bool

    - name: Refuse a namespace outside the factory namespaces before kubectl
      ansible.builtin.fail:
        msg: >-
          Refusing factory sandbox loss drill: namespace
          `{{ factory_sandbox_loss_drill_namespace }}` is not one of
          {{ factory_sandbox_loss_drill_namespaces | join(', ') }}. Nothing was
          read and nothing was changed.
      when:
        - factory_sandbox_loss_drill_named | bool
        - factory_sandbox_loss_drill_namespace not in factory_sandbox_loss_drill_namespaces

    - name: Refuse an absent preserved ref before any cluster write
      ansible.builtin.fail:
        msg: >-
          Refusing factory sandbox loss drill: no preserved ref was named.
          Nothing was changed in the cluster.
      when:
        - factory_sandbox_loss_drill_named | bool
        - not (factory_sandbox_loss_drill_bad_run_id | bool)
        - factory_sandbox_loss_drill_namespace in factory_sandbox_loss_drill_namespaces
        - factory_sandbox_loss_drill_preserved_ref | default('') | length == 0

    - name: Read the named preserved ref from the run repository origin
      ansible.builtin.command:
        argv:
          - git
          - ls-remote
          - --exit-code
          - "{{ factory_sandbox_loss_drill_run_repository }}"
          - "{{ factory_sandbox_loss_drill_preserved_ref }}"
      register: factory_sandbox_loss_drill_ref_read
      changed_when: false
      failed_when: false
      when:
        - factory_sandbox_loss_drill_named | bool
        - not (factory_sandbox_loss_drill_bad_run_id | bool)
        - factory_sandbox_loss_drill_namespace in factory_sandbox_loss_drill_namespaces
        - factory_sandbox_loss_drill_preserved_ref | default('') | length > 0

    - name: Refuse an unavailable named preserved ref before any cluster write
      ansible.builtin.fail:
        msg: >-
          Refusing factory sandbox loss drill: origin read access is the missing
          precondition, or origin does not hold preserved ref
          `{{ factory_sandbox_loss_drill_preserved_ref }}`. Nothing was changed
          in the cluster.
      when:
        - factory_sandbox_loss_drill_ref_read is defined
        - factory_sandbox_loss_drill_ref_read.rc | default(0) != 0

    - name: Verify preservation, select one sandbox pod, and observe its UID
      when:
        - factory_sandbox_loss_drill_named | bool
        - not (factory_sandbox_loss_drill_bad_run_id | bool)
        - factory_sandbox_loss_drill_namespace in factory_sandbox_loss_drill_namespaces
        - factory_sandbox_loss_drill_preserved_ref | default('') | length > 0
        - factory_sandbox_loss_drill_ref_read.rc == 0
      block:
        - name: Make a local checkout for the preserved-ref comparison
          ansible.builtin.tempfile:
            state: directory
            path: "{{ factory_sandbox_loss_drill_checkout_root }}"
            prefix: factory-sandbox-loss-drill.
          register: factory_sandbox_loss_drill_checkout

        - name: Clone the run repository origin for preservation verification
          ansible.builtin.command:
            argv:
              - git
              - clone
              - --quiet
              - --no-checkout
              - "{{ factory_sandbox_loss_drill_run_repository }}"
              - "{{ factory_sandbox_loss_drill_checkout.path }}"
          register: factory_sandbox_loss_drill_clone
          changed_when: false
          failed_when: false

        - name: Refuse when the control node cannot read the run repository origin
          ansible.builtin.fail:
            msg: >-
              Refusing factory sandbox loss drill: control-node read access to
              origin `{{ factory_sandbox_loss_drill_run_repository }}` is the
              missing precondition for preserved ref
              `{{ factory_sandbox_loss_drill_preserved_ref }}`.
          when: factory_sandbox_loss_drill_clone.rc != 0

        - name: Fetch the named preserved ref without using FETCH_HEAD
          ansible.builtin.command:
            argv:
              - git
              - -C
              - "{{ factory_sandbox_loss_drill_checkout.path }}"
              - fetch
              - --quiet
              - origin
              - "+{{ factory_sandbox_loss_drill_preserved_ref }}:refs/remotes/origin/factory-sandbox-loss-drill-preserved"
          register: factory_sandbox_loss_drill_fetch
          changed_when: false
          failed_when: false
          when: factory_sandbox_loss_drill_clone.rc == 0

        - name: Refuse a preserved ref that origin cannot provide to the control node
          ansible.builtin.fail:
            msg: >-
              Refusing factory sandbox loss drill: origin read access is the
              missing precondition, or origin does not hold preserved ref
              `{{ factory_sandbox_loss_drill_preserved_ref }}`.
          when:
            - factory_sandbox_loss_drill_clone.rc == 0
            - factory_sandbox_loss_drill_fetch.rc != 0

        - name: Find the preserved ref merge base with the default branch
          ansible.builtin.command:
            argv:
              - git
              - -C
              - "{{ factory_sandbox_loss_drill_checkout.path }}"
              - merge-base
              - refs/remotes/origin/factory-sandbox-loss-drill-preserved
              - "origin/{{ factory_sandbox_loss_drill_default_branch }}"
          register: factory_sandbox_loss_drill_merge_base
          changed_when: false
          failed_when: false
          when:
            - factory_sandbox_loss_drill_clone.rc == 0
            - factory_sandbox_loss_drill_fetch.rc == 0

        - name: Refuse a ref that has no readable merge base with the default branch
          ansible.builtin.fail:
            msg: >-
              Refusing factory sandbox loss drill: preserved ref
              `{{ factory_sandbox_loss_drill_preserved_ref }}` has no merge base
              with default branch `{{ factory_sandbox_loss_drill_default_branch }}`.
          when:
            - factory_sandbox_loss_drill_clone.rc == 0
            - factory_sandbox_loss_drill_fetch.rc == 0
            - factory_sandbox_loss_drill_merge_base.rc != 0

        - name: Read whether the preserved ref has a non-empty diff
          ansible.builtin.command:
            argv:
              - git
              - -C
              - "{{ factory_sandbox_loss_drill_checkout.path }}"
              - diff
              - --quiet
              - "{{ factory_sandbox_loss_drill_merge_base.stdout | trim }}"
              - refs/remotes/origin/factory-sandbox-loss-drill-preserved
          register: factory_sandbox_loss_drill_diff
          changed_when: false
          failed_when: false
          when:
            - factory_sandbox_loss_drill_merge_base.rc == 0

        - name: Refuse an empty preserved ref before any cluster write
          ansible.builtin.fail:
            msg: >-
              Refusing factory sandbox loss drill: preserved ref
              `{{ factory_sandbox_loss_drill_preserved_ref }}` has an empty diff
              against its merge base with
              `{{ factory_sandbox_loss_drill_default_branch }}`.
          when:
            - factory_sandbox_loss_drill_merge_base.rc == 0
            - factory_sandbox_loss_drill_diff.rc == 0

        - name: Read pods selected by the exact Fabro run id
          ansible.builtin.command:
            argv:
              - kubectl
              - get
              - pods
              - --namespace
              - "{{ factory_sandbox_loss_drill_namespace }}"
              - --selector
              - "petri.run={{ factory_sandbox_loss_drill_run_id }}"
              - --output
              - json
          register: factory_sandbox_loss_drill_pods_read
          changed_when: false

        - name: Refuse zero or multiple pods selected by the run label
          ansible.builtin.fail:
            msg: >-
              Refusing factory sandbox loss drill: petri.run={{ factory_sandbox_loss_drill_run_id }}
              selected {{ (factory_sandbox_loss_drill_pods_read.stdout | from_json)['items'] | length }} pods.
          when: (factory_sandbox_loss_drill_pods_read.stdout | from_json)['items'] | length != 1

        - name: Record the one selected pod identity and labels
          ansible.builtin.set_fact:
            factory_sandbox_loss_drill_pod_name: "{{ ((factory_sandbox_loss_drill_pods_read.stdout | from_json)['items'])[0].metadata.name }}"
            factory_sandbox_loss_drill_pod_uid: "{{ ((factory_sandbox_loss_drill_pods_read.stdout | from_json)['items'])[0].metadata.uid }}"
            factory_sandbox_loss_drill_has_sandbox_label: >-
              {{ 'sandbox-driver-kubernetes/sandbox' in
                 ((factory_sandbox_loss_drill_pods_read.stdout | from_json)['items'])[0].metadata.labels }}

        - name: Refuse a selected pod that is not a Kubernetes sandbox
          ansible.builtin.fail:
            msg: >-
              Refusing factory sandbox loss drill: selected pod
              `{{ factory_sandbox_loss_drill_pod_name }}` lacks label
              `sandbox-driver-kubernetes/sandbox`.
          when: >-
            not (factory_sandbox_loss_drill_has_sandbox_label | bool)

        - name: Read UTC time immediately before the one UID-preconditioned delete
          ansible.builtin.command:
            argv: [date, -u, +%Y-%m-%dT%H:%M:%SZ]
          register: factory_sandbox_loss_drill_delete_time
          changed_when: false

        # `kubectl delete` has no UID-precondition flag, so the one delete is a
        # DELETE through `kubectl proxy` carrying DeleteOptions.preconditions.uid.
        - name: Delete only the selected sandbox pod with its resolved UID precondition
          ansible.builtin.command:
            argv:
              - sh
              - -c
              - |
                set -eu
                namespace=$1; name=$2; uid=$3
                work=$(mktemp -d)
                kubectl proxy --unix-socket="$work/proxy.sock" >"$work/proxy.log" 2>&1 &
                proxy=$!
                trap 'kill "$proxy" 2>/dev/null || true; rm -rf "$work"' EXIT
                tries=0
                until test -S "$work/proxy.sock"; do
                  tries=$((tries + 1))
                  if test "$tries" -gt 50 || ! kill -0 "$proxy" 2>/dev/null; then
                    cat "$work/proxy.log" >&2
                    echo 'kubectl proxy did not come up; no delete was issued' >&2
                    exit 1
                  fi
                  sleep 0.2
                done
                body=$(printf '{"kind":"DeleteOptions","apiVersion":"v1","preconditions":{"uid":"%s"}}' "$uid")
                status=$(curl --silent --show-error --max-time 60 \
                  --unix-socket "$work/proxy.sock" --request DELETE \
                  --header 'Content-Type: application/json' --data "$body" \
                  --output "$work/response" --write-out '%{http_code}' \
                  "http://localhost/api/v1/namespaces/$namespace/pods/$name") || {
                  echo 'delete request could not be completed' >&2
                  exit 1
                }
                case "$status" in
                  2??) exit 0 ;;
                esac
                cat "$work/response" >&2
                echo >&2
                echo "delete answered HTTP $status" >&2
                exit 1
              - sh
              - "{{ factory_sandbox_loss_drill_namespace }}"
              - "{{ factory_sandbox_loss_drill_pod_name }}"
              - "{{ factory_sandbox_loss_drill_pod_uid }}"
          register: factory_sandbox_loss_drill_delete
          changed_when: true
          failed_when: false

        - name: Refuse a delete the API server did not accept
          ansible.builtin.fail:
            msg: >-
              Factory sandbox loss drill delete was not accepted for resolved
              UID {{ factory_sandbox_loss_drill_pod_uid }}; API reports UID
              {{ factory_sandbox_loss_drill_delete.stderr | regex_findall('UID in object meta: ([^",\\s]+)') | first | default('unreported') }};
              no further delete was issued. Delete output:
              {{ factory_sandbox_loss_drill_delete.stderr | trim }}
          when: factory_sandbox_loss_drill_delete.rc != 0

        # Listing by name with a field selector makes "the UID is gone" a
        # successful read: only an error-free list without the UID ends the wait,
        # so a transport or authorization error can never pass for a deletion.
        - name: Wait until the API server lists no pod with the selected UID
          ansible.builtin.command:
            argv:
              - kubectl
              - get
              - pods
              - --namespace
              - "{{ factory_sandbox_loss_drill_namespace }}"
              - --field-selector
              - "metadata.name={{ factory_sandbox_loss_drill_pod_name }}"
              - --output
              - json
          register: factory_sandbox_loss_drill_wait_read
          changed_when: false
          failed_when: false
          retries: "{{ factory_sandbox_loss_drill_wait_retries }}"
          delay: "{{ factory_sandbox_loss_drill_wait_interval }}"
          until: >-
            factory_sandbox_loss_drill_wait_read.rc != 0
            or (factory_sandbox_loss_drill_pod_uid
                not in ((factory_sandbox_loss_drill_wait_read.stdout | from_json)['items']
                        | map(attribute='metadata.uid') | list))

        - name: Refuse a failed read of the pod list while waiting
          ansible.builtin.fail:
            msg: >-
              Factory sandbox loss drill could not read the pod list while waiting
              for UID {{ factory_sandbox_loss_drill_pod_uid }} to disappear, so it
              cannot say the UID is gone: {{ factory_sandbox_loss_drill_wait_read.stderr | trim }}
          when: factory_sandbox_loss_drill_wait_read.rc != 0

        - name: Refuse a UID that remains listed after the wait timeout
          ansible.builtin.fail:
            msg: >-
              Factory sandbox loss drill timed out: UID
              {{ factory_sandbox_loss_drill_pod_uid }} remains listed;
              no second delete was issued.
          when: >-
            factory_sandbox_loss_drill_pod_uid
            in ((factory_sandbox_loss_drill_wait_read.stdout | from_json)['items']
                | map(attribute='metadata.uid') | list)

        - name: Report that a same-named replacement has a different UID
          ansible.builtin.debug:
            msg: >-
              Factory sandbox loss drill run {{ factory_sandbox_loss_drill_run_id }}
              observed same-named replacement pod
              {{ factory_sandbox_loss_drill_pod_name }} with new UID
              {{ ((factory_sandbox_loss_drill_wait_read.stdout | from_json)['items'])[0].metadata.uid }};
              no delete was issued for it.
          when: (factory_sandbox_loss_drill_wait_read.stdout | from_json)['items'] | length > 0

        - name: Read UTC time when the selected UID was first absent
          ansible.builtin.command:
            argv: [date, -u, +%Y-%m-%dT%H:%M:%SZ]
          register: factory_sandbox_loss_drill_gone_time
          changed_when: false

        - name: Report the deletion and the API-observed UID disappearance
          ansible.builtin.debug:
            msg: >-
              Factory sandbox loss drill run {{ factory_sandbox_loss_drill_run_id }}
              pod {{ factory_sandbox_loss_drill_pod_name }} UID
              {{ factory_sandbox_loss_drill_pod_uid }} delete issued
              {{ factory_sandbox_loss_drill_delete_time.stdout }} UID gone
              {{ factory_sandbox_loss_drill_gone_time.stdout }}
      always:
        - name: Remove the local preserved-ref comparison checkout
          ansible.builtin.file:
            path: "{{ factory_sandbox_loss_drill_checkout.path }}"
            state: absent
          when: factory_sandbox_loss_drill_checkout is defined
