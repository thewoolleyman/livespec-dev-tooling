---
# The committed teardown of the scratch-branch incident observer that
# ansible/incident-observer-scratch.yml installs. livespec-dev-tooling-32qdja.
#
# Stops and disables the scratch observer unit and its reference fetch timer,
# removes their unit files, the scratch controller.json and the scratch
# manifest, and reads production's unit, controller.json and manifest back
# byte-identical. The scratch root (receipts and reference clone) is kept as
# evidence unless `-e incident_observer_scratch_teardown_purge=true`.
#
#   /usr/local/bin/with-livespec-env.sh -- just ansible-drift ansible/incident-observer-scratch-teardown.yml
#   /usr/local/bin/with-livespec-env.sh -- just ansible-apply ansible/incident-observer-scratch-teardown.yml
- name: Tear down the scratch-branch incident observer
  hosts: dev_hosts
  gather_facts: false
  vars_files:
    - roles/incident_observer/vars/scratch.yml
  pre_tasks:
    - name: Refuse this scratch playbook without scratch mode, a scratch name and a scratch branch
      # The FIRST task, outside the role and its conditionals: `-e
      # incident_observer_scratch=false` (or no, 0, False) would otherwise send
      # this play down production's path. livespec-dev-tooling-32qdja.
      ansible.builtin.assert:
        that:
          - incident_observer_scratch | bool
          - incident_observer_scratch_name is defined
          - incident_observer_scratch_name | string | length > 0
          - incident_observer_target_branch is defined
          - incident_observer_target_branch is string
          - incident_observer_target_branch is match('incident-scratch/[a-z0-9]')
        fail_msg: >-
          this playbook converges only the scratch instance: it needs
          incident_observer_scratch true, a scratch name and a branch under
          incident-scratch/. Nothing has been written, stopped or removed.
        success_msg: scratch mode is on for {{ incident_observer_scratch_name }}
  tasks:
    - name: Remove every scratch artifact and leave production byte-identical
      ansible.builtin.include_role:
        name: incident_observer
        tasks_from: scratch_teardown
