---
# The Fabro sandbox-host services, migrated from the `fabro-hosts` repository.
#
# Two plays because the two machines carry different sets: `hp-xubuntu` is a
# dedicated sandbox host and takes everything, while the VPS is the maintainer's
# dev host and takes only the services it actually runs. The split is measured
# from the live machines, not assumed from the presence of a `hosts/<host>.env`
# file — `storage-reclaim` ships one for `hp-xubuntu` and is not installed
# there, which the drift report surfaces as a whole service missing.
#
# `fabro_server` is included rather than listed, because a host runs more than
# one Fabro instance and the role installs exactly one per invocation. Looping
# in the play keeps every task's `when`, `notify` and handler scoped to a single
# unit; a `roles:` entry would run it once per host and silently install only
# whichever instance happened to be resolved.

- name: Fabro sandbox host
  hosts: sandbox_hosts
  gather_facts: true
  roles:
    - role: container_reclaim
      tags: [container_reclaim]
    # Declared for this host and never installed on it. Tagged so an operator
    # can converge everything else without arming a timer that deletes build
    # artifacts on a machine where it has never run.
    - role: storage_reclaim
      tags: [storage_reclaim]
    - role: disk_guard
      tags: [disk_guard]
    - role: host_tools
      tags: [host_tools]
    - role: sccache_redis
      tags: [sccache_redis]
    # The per-uid keyring ceilings the 1Password env wrapper cache needs; this
    # host runs with-livespec-env.sh and was at the kernel defaults.
    - role: keyring_quota
      tags: [keyring_quota]
    # The aggregate resource envelope around this host's sandbox containers,
    # interim until the Kubernetes sandbox backend restores per-run limits. Its
    # own tag converges the envelope and restarts NOTHING; the separate
    # `docker_sandbox_slice_drained_restart` tag is the operator's restart, taken
    # inside a drained window. See the role's HOST_VARS.md.
    - role: docker_sandbox_slice
      tags: [docker_sandbox_slice]
    # The second disk this host's swap and container stores live on, so the
    # root disk no longer carries the sandbox churn too. Formatting the disk
    # and moving the live stores are each one opt-in run (-e flags named in
    # the role's HOST_VARS.md); a plain converge never formats and never stops
    # docker or containerd.
    - role: sandbox_storage
      tags: [sandbox_storage]
    # The `factory` namespace credential the Kubernetes sandbox backend
    # launches a run's pod with (livespec-dev-tooling-sqobqv). Reached through
    # this GROUP play rather than named per host, so a machine that joins the
    # group inherits it. Its own tag converges the credential alone, which is
    # the repair an operator wants after a control-plane rebuild. Ordered last
    # because it depends on nothing above it and the fetch reaches off-host.
    - role: factory_kubeconfig
      tags: [factory_kubeconfig]
    # The Kubernetes sandbox-driver plugin and the CLI that drives it, both
    # pinned by digest (bd-ib-nmuyjc.3). After factory_kubeconfig, whose
    # credential the plugin is configured to read.
    - role: sandbox_driver_kubernetes
      tags: [sandbox_driver_kubernetes]
  tasks:
    - name: Install every Fabro instance on this host
      ansible.builtin.include_role:
        name: fabro_server
      loop: "{{ fabro_server_instances }}"
      loop_control:
        loop_var: fabro_server_instance
        label: "{{ fabro_server_instance.unit_name }}"

- name: Fabro services on the dev host
  hosts: dev_hosts
  gather_facts: true
  roles:
    - role: container_reclaim
      tags: [container_reclaim]
    - role: storage_reclaim
      tags: [storage_reclaim]
    # The self-hosted Actions runner that serves
    # livespec-orchestrator-beads-fabro's live golden-master tier: only this
    # host carries the orchestrator runtime and the operator wrapper the job
    # needs (livespec-ifwnqj.2).
    - role: gha_runner
      tags: [gha_runner]
  tasks:
    - name: Install every Fabro instance on this host
      ansible.builtin.include_role:
        name: fabro_server
      loop: "{{ fabro_server_instances }}"
      loop_control:
        loop_var: fabro_server_instance
        label: "{{ fabro_server_instance.unit_name }}"
