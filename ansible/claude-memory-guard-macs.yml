---
# Refuse writes into local agent memory on the maintainer's Macs, through the
# macOS managed-settings location /Library/Application Support/ClaudeCode/.
# The Mac half of ansible/claude-memory-guard.yml: the same role, the same
# vendored hook, applied to interactive_claude_macs. Work item
# livespec-dev-tooling-i76rv2 (plan no-local-agent-memory).
#
#   just ansible-drift ansible/claude-memory-guard-macs.yml
#   just ansible-apply ansible/claude-memory-guard-macs.yml
#
# ROLLBACK, removing the guard from a Mac: delete
# "/Library/Application Support/ClaudeCode/managed-settings.d/40-memory-write-guard.json",
# take the Mac out of interactive_claude_macs in the same change, and restart
# the Claude Code sessions on it. Do it as a committed change, never by hand.
# KEEP "/Library/Application Support/ClaudeCode/memory-write-guard/" until every
# session started before the rollback has restarted: such a session still runs
# the cached hook, and `python3 <missing file>` exits 2, which BLOCKS every
# Bash and file-tool call.
#
# Run from the control node (the dev host); no checkout exists on a Mac. A
# session already running is guarded only once restarted.
#
# The first play is the START-OF-RUN PRECONDITION: any_errors_fatal stops the
# run before the converge play when any Mac is unreachable over ssh as
# cwoolley, has no Python interpreter Ansible can use, or cannot obtain root,
# and the failure names that Mac. Nothing has changed a host by then.
- name: Mac preconditions for the memory-write guard
  hosts: interactive_claude_macs
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Reach the Mac over ssh with a usable Python interpreter
      ansible.builtin.ping:

    - name: Obtain root without a prompt
      ansible.builtin.command: /usr/bin/true
      become: true
      changed_when: false

- name: Claude Code memory-write guard on the Macs
  hosts: interactive_claude_macs
  gather_facts: false
  roles:
    - role: claude_memory_write_guard
      tags: [claude_memory_write_guard]
