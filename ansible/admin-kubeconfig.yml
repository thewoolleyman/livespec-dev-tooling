---
- name: Install a cluster-admin kubeconfig for the session account
  hosts: cluster_admin_hosts
  gather_facts: false
  roles:
    # A host that runs a coordinator, dispatcher or converge gets `kubectl` with no
    # ssh to the control-plane node (livespec-dev-tooling-uf2pgj). The hosts are an
    # inventory GROUP, never a name here. This is a CLUSTER-ADMIN credential: apply
    # `just ansible-drift admin-kubeconfig.yml` first, and read the credential path
    # again before adding a host to the group.
    - admin_kubeconfig
