---
# Authorize the credential-rotation role key on every host the role holder pushes to:
# the ci_pool hosts and the dev host (the vps; livespec-overseer plan central-credential-service,
# gap G2). The key's public half is declared as caam_role_key_public in
# ansible/inventory/group_vars/all.yml by its own PR, after hetzner-xubuntu-info's
# hxi_credential_role generates it; until then this play changes nothing.
#
#   just ansible-drift ansible/credential-role-key.yml
#   just ansible-apply ansible/credential-role-key.yml
#
# ROLLBACK: set caam_role_key_state: absent in group_vars by a committed change and apply;
# that removes the managed block. Emptying caam_role_key_public only stops managing it.
# Run from the control node: the vps entry uses a local connection valid only there.
- name: Credential-rotation role key
  hosts: dev_hosts:ci_pool
  gather_facts: false
  roles:
    - role: caam_role_key
      tags: [caam_role_key]
