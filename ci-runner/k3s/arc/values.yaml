# values.yaml — Helm values for the gha-runner-scale-set chart (Actions
# Runner Controller, chart version 0.14.2), installed by ../install-arc.sh.
#
# Labels: every runner MUST carry both a shared pool label and a
# host-unique label, per livespec repo SPECIFICATION/
# non-functional-requirements.md section "Self-hosted CI runner host
# requirements" ("Every runner MUST carry both a shared pool label and a
# host-unique label"). This scale set's labels are DELIBERATELY DISTINCT
# from the existing podman pool's labels (self-hosted, local-ci — see
# livespec-dev-tooling .github/workflows/ci.yml
# select-ci-runner.local-runner-labels), confirmed by reading that
# workflow directly rather than re-guessing:
#
#   shared pool label (this k3s+ARC pool):  local-ci-k3s
#   host-unique label (this host):          poweredge-xubuntu-k3s
#
# ARC's gha-runner-scale-set model has no free-form "labels list" the way
# the classic self-hosted registration API does: one Helm release installs
# one AutoscalingRunnerSet, and `runnerScaleSetName` (below) is the single
# name workflows select via `runs-on:`. This release realizes the SHARED
# pool label (`local-ci-k3s`); the host-unique label
# (`poweredge-xubuntu-k3s`) is realized the same way multi-host pool
# growth already works in this repo's spec (SPECIFICATION/
# non-functional-requirements.md "self-hosted capacity is a POOL, and it
# MAY span more than one host"): a SECOND, separately-named
# AutoscalingRunnerSet release, `values-host-unique.yaml`, installed
# alongside this one on the same node with runnerScaleSetName
# `poweredge-xubuntu-k3s` and minRunners: 0 — additive capacity under a
# name that lets one host be addressed on its own (to validate this host
# before it takes shared traffic, or to drain it), never a substitute for
# the shared release. See install-arc.sh step 2.
#
# Phase 1 scope: zero repository workflow targets these labels yet. This
# scale set exists so a manual, non-gating proof job (../test-job/
# proof-job.yml) can exercise the path end-to-end. Cutting real traffic
# to `local-ci-k3s` is phase 3 of the migration (per the ledger epic
# livespec-s43svm and its research record
# plan/fleet-ci-runner-pool/research/k3s-arc-kueue-migration.md in the
# livespec repo), not this change.

# githubConfigUrl is REPOSITORY-scoped, not account-root. `thewoolleyman`
# is a personal GitHub User account (confirmed live via
# `gh api users/thewoolleyman --jq .type` -> "User"), and GitHub's
# org-level self-hosted-runner registration API
# (POST /orgs/{org}/actions/runners/registration-token, which the
# account-root form https://github.com/thewoolleyman routes ARC to) does
# not exist for personal accounts at all — this is architectural, not a
# permissions gap, and granting the GitHub App's installation the
# "Self-hosted runners: read & write" ORGANIZATION permission (done live
# 2026-08-16) cannot fix it, confirmed by the ARC controller still
# getting a 404 from that exact endpoint after the grant (see
# livespec-s43svm.14). Self-hosted runners for a personal account MUST
# be registered per-REPOSITORY
# (https://github.com/{owner}/{repo}/actions/runners/registration-token),
# matching how the existing podman pool's JIT runners have always
# registered (CI_RUNNER_LABELS + per-repo JIT config — see
# ../../supervisor/mint-jitconfig.sh). Scoped here to
# livespec-dev-tooling itself so phase 1's proof job
# (../test-job/proof-job.yml) — which already lives in THIS repo's own
# .github/workflows/ — can validate end-to-end without needing
# multi-repo ARC scope-fanout, which is out of scope for phase 1 (the
# per-repo cutover sequencing is phase 3 / livespec-s43svm.16). DO NOT
# revert this to the account-root form.
githubConfigUrl: "https://github.com/thewoolleyman/livespec-dev-tooling"
# githubConfigSecret is intentionally NOT set here — provisioning
# instructions in install-arc.sh create it out-of-band from the fleet's
# least-privilege GitHub App installation token so the secret is never
# committed. See README.md "Credential separation" for the exact source.
githubConfigSecret: arc-github-app-installation

runnerScaleSetName: "local-ci-k3s"

# Runner pod template. containerMode "kubernetes" is the ARC default and
# schedules the JOB CONTAINER as its own pod (via a dind-less
# kubernetes-container-hooks sidecar), so the containment property
# required by the host-requirements contract ("a rootless engine ...
# in-container root maps to a non-root host identity ... no privileged
# mode") is satisfied by k3s's own containerd + the pod securityContext
# below, with no bespoke dockershim/sanitize-hook equivalent needed.
containerMode:
  type: "kubernetes"
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: "local-path"  # k3s's bundled default StorageClass
    resources:
      requests:
        storage: 5Gi

template:
  spec:
    # Host-unique label lives on the runner registration (the set below),
    # matching how the existing podman pool's runner@.service registers
    # its labels — NOT as a Kubernetes node label (that's provision-k3s.sh's
    # separate k3s-role=arc-runner-host node label, an orthogonal concept).
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest  # pinned at the runner-release layer by ARC itself, not this chart
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]

# minRunners: 0 — scale to zero when idle. This host serves zero real
# traffic in phase 1 (per the ledger acceptance criteria); a manual proof
# job triggers a single ephemeral runner pod that ARC tears down after
# the one job completes (ephemeral registration, matching the existing
# host-requirements "each registration serves at most one job" clause).
minRunners: 0
maxRunners: 2
