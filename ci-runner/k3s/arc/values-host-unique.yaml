# values-host-unique.yaml — Helm values for the gha-runner-scale-set chart
# (0.14.2) release named for the HOST-UNIQUE label, `poweredge-xubuntu-k3s`,
# installed by ../install-arc.sh step 2.
#
# History: phase 1 installed this as the SECOND of two releases, after a
# shared-pool-label release `local-ci-k3s` (values.yaml, installed first),
# the pair together satisfying "every runner MUST carry both a shared pool
# label and a host-unique label" per livespec repo
# SPECIFICATION/non-functional-requirements.md section "Self-hosted CI
# runner host requirements". ARC's gha-runner-scale-set model has no
# free-form labels list — one Helm release installs one
# AutoscalingRunnerSet, and `runnerScaleSetName` is the single name a
# workflow selects via `runs-on:` — so each "label" is realized as its own
# separately-named release. The shared-pool release `local-ci-k3s` served
# only the phase-1 proof, was never routed to by any workflow, and was
# uninstalled (and values.yaml deleted) under livespec-s43svm.28; the
# shared-pool role is now carried by the per-repository scale sets under
# ../phase2/arc/. This host-unique release remains because this repo's
# `.github/workflows/k3s-arc-proof-job.yml` still targets it.
#
# minRunners: 0 here too — this exists to let a workflow address THIS
# host specifically (reproduce a failure on one host, validate a newly
# joined host, drain by routing away from it), not to serve default
# traffic. Phase 1's proof job (../test-job/proof-job.yml) targets this
# label, matching the host-requirements "a host is proven by EXECUTING a
# job... a non-gating job addressed to the host-unique label satisfies
# both" clause.

# REPOSITORY-scoped, not account-root — see ../README.md "GitHub
# registration scope" for the full architectural rationale (thewoolleyman
# is a personal GitHub User account; org-level self-hosted-runner
# registration does not exist for personal accounts, so ARC's controller
# gets a 404 from the account-root form). Scoped to livespec-dev-tooling
# because the proof workflow this release serves lives in THIS repo's own
# .github/workflows/. DO NOT revert this to the account-root form.
githubConfigUrl: "https://github.com/thewoolleyman/livespec-dev-tooling"
githubConfigSecret: arc-github-app-installation  # same secret, same least-privilege token — see README.md

runnerScaleSetName: "poweredge-xubuntu-k3s"

containerMode:
  type: "kubernetes"
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: "local-path"
    resources:
      requests:
        storage: 5Gi

template:
  spec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]

minRunners: 0
maxRunners: 1
