# 50-embedded-etcd.yaml — the k3s SERVER's datastore selection: EMBEDDED ETCD,
# not kine over SQLite (plan k3s-embedded-etcd-datastore, epic
# livespec-dev-tooling-qql3lo, child livespec-dev-tooling-qy2nzf).
# k3s reads it from /etc/rancher/k3s/config.yaml.d/ and merges it over
# ../config.yaml.
#
# WHY. kine's post-compaction `PRAGMA wal_checkpoint(FULL)` stalled every
# datastore write for 30.0 s (2026-11-10T14:20Z) and 25.3 s (2026-11-11T02:31Z),
# and each stall cost the ci-runner scheduler its leader lease. etcd is chosen
# for control-plane stability under write churn, not for speed.
#
# WHY A DROP-IN, AND WHY IT IS INSTALLED ONLY ON REQUEST. On the first k3s start
# that carries `cluster-init` over an existing SQLite datastore, k3s converts it
# to embedded etcd in place. The k3s docs say: "If you have an existing cluster
# using the default embedded SQLite database, you can convert it to etcd by
# simply restarting your K3s server with the `--cluster-init` flag"
# (k3s-io/docs ha-embedded.md, commit 2936f007, quoted in plan note 003).
# These keys were first committed in ../config.yaml, which EVERY
# `ansible/ci-pool.yml` apply installs on the server. Any seat's routine apply
# would then have armed the conversion, and any later k3s restart would have
# run it outside the plan's window. So the k3s_config role installs this file
# ONLY when `k3s_config_embedded_etcd` is true. It defaults to false, and only a
# server can set it. The window applies with `-e k3s_config_embedded_etcd=true`.
# The host_vars/poweredge-xubuntu.yml flip that commits the same value merges in
# the SAME window, right after verification, as a required step.
#
# EVERY LATER BOOT starts on an EMPTY tmpfs (../../datastore-tmpfs/), so
# `cluster-init` there initializes a fresh single-member etcd, and
# converge-ci-stack.service rebuilds the cluster onto it, exactly as it rebuilds
# onto an empty kine today. That is why the drop-in must STAY after the cut-over,
# and why an apply with the flag false leaves an existing drop-in in place.
#
# ROLLBACK (note 003, as amended by qy2nzf): revert the host_vars flip, apply
# ansible/ci-pool.yml --tags k3s_config with
# `-e k3s_config_embedded_etcd_rollback=true`, which REMOVES this drop-in, then
# do a sanctioned reboot (ansible/reboot-ci-server.yml). The reboot empties the
# tmpfs, so k3s comes up on SQLite again. k3s ignores every datastore argument
# while an etcd directory exists, so only an emptied tmpfs reverts cleanly.
cluster-init: true

# Snapshots OFF. The datastore lives on a tmpfs that every reboot empties, and
# the cluster is rebuilt from this repository, so a snapshot has nothing to
# restore. k3s's default snapshot cron would also write under the data dir.
etcd-disable-snapshots: true

# The etcd backend quota: 2 GiB. The tmpfs is sized to hold it, a full
# defragmentation copy beside it, and the WAL (see the mount unit). The kine
# datastore this replaces held ~370 MB with its WAL on 2026-11-11.
etcd-arg:
  - "quota-backend-bytes=2147483648"

# The API server compacts etcd's revision history every 5 minutes. This is the
# upstream default, stated here so the plan's compaction interval is committed
# and read back from the live server rather than assumed. The periodic
# defragmentation that reclaims the compacted space is the k3s_etcd_defrag
# role's timer. ../config.yaml sets no kube-apiserver-arg or etcd-arg, so these
# lists are the whole value (a drop-in key REPLACES a key of the same name).
kube-apiserver-arg:
  - "etcd-compaction-interval=5m"
