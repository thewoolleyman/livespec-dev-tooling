# 99-ci-runner-inotify.conf — per-user inotify INSTANCE budget for the k3s
# CI-runner pool. Installed to /etc/sysctl.d/ by
# node-inotify-budget/install-inotify-sysctl.sh; systemd-sysctl re-applies
# every file under /etc/sysctl.d/ at boot, so this value survives a reboot,
# a k3s restart, and a k3s upgrade with no reconciliation loop.
#
# WHY: containerd opens per-container inotify INSTANCES — a healthy
# containerd-shim holds ~2 (the cgroup v2 memory.events OOM watch), plus
# ~21 for kubelet/cadvisor's cgroup-tree watcher. Those instances are
# charged against a PER-USER ceiling (fs.inotify.max_user_instances), and
# the whole pool's containers run under one uid, so the ceiling has to cover
# the pool's peak concurrent containers x the instances each opens. The
# kernel default is 128 — reached at roughly 50 healthy shims' worth of
# containers, well below this pool's peak. On 2026-09-01 the default 128 was
# exhausted at ~100 containers: containerd logged `failed to create inotify
# fd: too many open files`, shim/ttrpc streams broke, container create/kill
# calls timed out, PVCs never bound, and fleet CI queued with nothing
# starting (livespec plan `ci-runner-pod-lifecycle-reliability`, epic
# `livespec-ifwnqj`, research/002; carrier `livespec-a6lxuv`). The relation
# is ratified as a host requirement in livespec core
# non-functional-requirements.md §"Self-hosted CI runner host requirements"
# (v216): the per-user watch budget MUST cover peak container concurrency x
# per-container watch instances, with headroom.
#
# VALUE: at C = 64 churn-slots a full pool holds ~2C = 128 runner+workflow
# containers plus transient provisioner helper containers; at ~2 instances
# per shim that is a few hundred instances. 8192 is deliberate headroom
# (~60x the old default, far above any realized peak) rather than a tight
# fit — the failure mode is a hard pool-wide stall, so this budget is set to
# never be the limiter. Re-check only if C rises by an order of magnitude.
# (fs.inotify.max_user_watches is a DIFFERENT budget, raised long ago and not
# managed here.)
fs.inotify.max_user_instances = 8192
