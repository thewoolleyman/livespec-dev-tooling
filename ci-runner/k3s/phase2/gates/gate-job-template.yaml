# gate-job-template.yaml — the Job a delegated pre-push gate run instantiates
# (R4.S5, livespec-dev-tooling-sk8f; plan livespec k3s-on-gmktec-for-vps-usage,
# epic livespec-sab5gn; design in that plan's research/003 section D and
# corrections 2, 5 and 6).
#
# NOT APPLIED BY CONVERGE. Unlike every other manifest in this tree, this file is
# a TEMPLATE: ./render-gate-job.sh substitutes its placeholder markers and the gate client
# submits the result. Converge only ships it. Applying this file as it stands
# would fail — @@IMAGE@@ is not a resolvable image reference — and that is the
# intended failure mode for anyone who tries.
#
# EVERY TOKEN IS REQUIRED. render-gate-job.sh refuses to emit a manifest that
# still carries an unsubstituted placeholder marker, so a token added here without a
# matching substitution is caught at render time rather than by the API server.
#
# WHY suspend: true — Kueue admits a Job by UNSUSPENDING it. A Job created
# unsuspended bypasses the queue entirely and runs immediately against no quota,
# which would defeat gates-cq. Kueue sets this back to false on admission.
apiVersion: batch/v1
kind: Job
metadata:
  name: @@JOB_NAME@@
  namespace: gates
  labels:
    app.kubernetes.io/part-of: livespec-ci-gates
    app.kubernetes.io/managed-by: livespec-ci-runner-gates
    livespec.gate/repo: @@REPO@@
    livespec.gate/tree-hash: @@TREE_HASH@@
    # Requirement 6: the LocalQueue in this namespace, bound to gates-cq.
    kueue.x-k8s.io/queue-name: gates-lq
    # Admission order within gates-cq. gate-priority never preempts; gates-cq
    # keeps the pool's three `Never` preemption settings.
    kueue.x-k8s.io/priority-class: gate-priority
spec:
  suspend: true
  # Requirement 8: finished gate Jobs are collected rather than accumulating as
  # control-plane objects. The pool is under a ratified clause to bound the
  # pending work it materialises on the control plane, and a gate Job is a new
  # object on that same bounded plane. One hour is long enough to read a failed
  # gate's logs by hand and short enough that a day of pushes cannot pile up.
  ttlSecondsAfterFinished: @@TTL_SECONDS@@
  # A gate verdict is a measurement, not a workload to retry: a re-run on the
  # same tree must be a new, separately-identified gate, never a silent second
  # attempt whose failure the first attempt's success would mask.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: livespec-ci-gates
        livespec.gate/repo: @@REPO@@
    spec:
      restartPolicy: Never
      # Requirement 7, half one. R3 tainted gmktec `node-role/ci=pending:NoSchedule`
      # to keep CI RUNNER pods off it until R5 derived its capacity; a gate was
      # deliberately the first workload allowed there, which is why this toleration
      # exists. R5 (livespec-dev-tooling-xa6o) has since opened the node and removed
      # that taint, so the toleration is now a harmless no-op (it tolerates a taint
      # no longer present) rather than the load-bearing thing that lands the Job on
      # gmktec — the hostname nodeSelector below is what pins it there.
      tolerations:
        - key: node-role/ci
          operator: Equal
          value: pending
          effect: NoSchedule
      # Requirement 7, half two. PREFERRED rather than required: gates-flavor
      # already selects gmktec by `kubernetes.io/hostname`, so Kueue will not
      # admit this Job against any other node's quota. This affinity expresses
      # the same intent to the SCHEDULER, and keeping it preferred means a
      # future flavor change does not leave an unschedulable Job behind.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["gmktec-xubuntu"]
      # The executor holds NO cluster authority: it runs a check aggregate over a
      # tree and has no business reading the API. Nothing here mounts a
      # ServiceAccount token.
      automountServiceAccountToken: false
      initContainers:
        # Fetches the exact tree under test from the in-cluster read-only mirror
        # (research/003 section E; built by R4.S4, livespec-dev-tooling-2hno).
        # The ref is named after the tree hash, so one value identifies the tree,
        # the ref and this Job — a gate cannot run against content other than
        # what was pushed.
        - name: fetch-tree
          image: @@IMAGE@@
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              git init --quiet /workspace
              cd /workspace
              git remote add origin "@@SOURCE_URL@@"
              # NOT `--depth 1`. Eight members of `just check` judge a COMMIT
              # RANGE — `origin/master..HEAD` — rather than a tree, and a single
              # shallow commit gives them neither ancestry nor a base: they fail
              # STRUCTURALLY (the shipped-path release guard reports
              # `range_base_unresolvable`) instead of judging the tree under
              # test, which is the same class of defect as gating a subset of
              # the checks. So both refs are fetched in full.
              #
              # THE `.base` COMPANION REF carries the client's own
              # `origin/master` and lands here as `refs/remotes/origin/master`,
              # which is the name every one of those members resolves. It is
              # written by the SAME `git push --atomic` that writes the gate ref
              # (`livespec_dev_tooling.gate_remote_client`, whose
              # `GATE_BASE_REF_SUFFIX` is this `.base`), so a gate ref without
              # its companion cannot exist — and a fetch that cannot find one
              # fails the Job here rather than letting the aggregate run against
              # an unresolvable base.
              if ! git fetch --quiet origin \
                   "+refs/gates/@@TREE_HASH@@:refs/gates/@@TREE_HASH@@" \
                   "+refs/gates/@@TREE_HASH@@.base:refs/remotes/origin/master"; then
                echo "FATAL: cannot fetch refs/gates/@@TREE_HASH@@ and its .base companion from @@SOURCE_URL@@" >&2
                exit 1
              fi
              git checkout --quiet --detach "refs/gates/@@TREE_HASH@@"
              actual="$(git rev-parse 'HEAD^{tree}')"
              if [ "${actual}" != "@@TREE_HASH@@" ]; then
                echo "FATAL: fetched tree ${actual} is not the requested @@TREE_HASH@@" >&2
                exit 1
              fi
              # Present is not the same as USABLE: two refs with no common
              # ancestor would satisfy every check above and still leave every
              # range member without a diff base. Assert the merge-base the
              # aggregate is about to take, here, where the failure names its
              # cause.
              if ! git merge-base HEAD origin/master >/dev/null; then
                echo "FATAL: git merge-base HEAD origin/master does not resolve in the fetched history" >&2
                exit 1
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      containers:
        - name: gate
          # Requirement 1: resolved by render-gate-job.sh from the GATED
          # repository's own .github/workflows/ci.yml container block, never a
          # constant. Measured 2026-09-07 the two repos ran different tags, and
          # by 2026-09-08 both had moved again — a baked tag would gate against a
          # different toolchain than CI uses.
          image: @@IMAGE@@
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          # Requirement 2: the gated repository's own PRE-PUSH aggregate,
          # nothing else — preceded ONLY by the repository bootstrap two of its
          # members read. The command is `just hook_gate=1 check`, NOT bare
          # `just check`: a delegated gate is a surrogate for the LOCAL pre-push,
          # which runs `just hook_gate=1 check` (scripts/just/check-pre-push.sh),
          # and `hook_gate` adds the `hook_gate_skips` set to the skip list —
          # today just `check-fleet-conformance-admin`, which needs a user-class
          # admin credential no pre-push host (or gate pod) holds and which
          # credential-reading-targets.md records as never running in the gate.
          # Bare `just check` here ran it and failed the gate on a target the
          # pre-push it stands in for never runs.
          #
          # `/workspace` is a `git init` + fetch, not a bootstrapped clone, so
          # the worktree-discipline pack and the commit-refuse hooks are simply
          # absent: `check-primary-checkout-commit-refuse-hook-installed` fails
          # on the missing hooks and `check-no-workflow-edits` has no
          # `dev-tooling/check-no-workflow-edits.sh` to run at all. Neither is a
          # verdict about the tree under test.
          #
          # THE PACK INSTALL MUST BE ITS OWN `just` INVOCATION, and that is not
          # a style choice: the root justfile reaches the pack through
          # `import? 'dev-tooling/worktree.just'`, which `just` resolves when it
          # PARSES the file. A `just install-worktree-pack check` would parse
          # once, before the pack existed, and run the aggregate against a
          # justfile that never imported it.
          #
          # The two narrow recipes rather than `just bootstrap`: bootstrap walks
          # the whole local-obligation partition — mise trust/install, plugin
          # registration, the beads-runtime probes — none of which a gate pod
          # has or needs, and each of which is a way for a gate to fail for a
          # reason that is not the tree.
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              just install-worktree-pack
              just install-commit-refuse-hooks
              just warm-typecheck
              just hook_gate=1 check
          env:
            # R4.S6 (livespec-dev-tooling-ul61): declares to the check aggregate
            # that this run is a delegated gate authorising a push, so a check
            # that cannot read its credential FAILS here instead of warning and
            # exiting 0. The signal is explicit and set in exactly this one
            # place: guessing the context from the environment is what would
            # make the strict disposition fire on a contributor's machine.
            - name: LIVESPEC_GATE_CONTEXT
              value: "1"
            # R4.S7 slice B (livespec-dev-tooling-rwmo.2): WHAT this run is
            # gating, which the pod cannot work out for itself. Both
            # credential-reading targets name their repository from the clone —
            # `check-branch-protection-alignment` parses `origin` against a
            # github.com-only pattern, `check-master-ci-green` hands `gh` the
            # `{owner}`/`{repo}` placeholders it expands from that same remote —
            # and this clone's origin is the in-cluster git-daemon URL, which is
            # not github.com and carries no owner segment at all. So a TOKEN
            # ALONE does not arm those two checks; without this they fail here
            # having never identified the repository they were judging.
            #
            # NOT a rewritten origin, because origin is load-bearing for the
            # initContainer's `.base` fetch into refs/remotes/origin/master —
            # the name eight range-judging aggregate members resolve.
            #
            # Read ONLY where LIVESPEC_GATE_CONTEXT is set, so the variable is
            # inert everywhere else and cannot silently repoint a contributor's
            # checks at another repository. An EMPTY value (render-gate-job.sh
            # could not derive the identity) reads as "no repository named",
            # which fails those two targets the same way a missing token does.
            - name: LIVESPEC_GATE_REPOSITORY
              value: "@@GATED_REPOSITORY@@"
            # Requirement 4. The local lane derives nproc / 4, and `nproc` inside
            # a container reports the NODE's 32 threads regardless of this
            # container's cpu request — so an unset value would start 8 workers
            # under a 5 cpu request and oversubscribe the gate's own quota.
            - name: LIVESPEC_TEST_PARALLELISM
              value: "@@PARALLELISM@@"
            # Requirement 5: the cache environment is REUSED from
            # ../arc/hook-pod-template.yaml rather than re-invented, so the two
            # cannot drift. Keep these in step with that file's container env.
            - name: UV_CACHE_DIR
              value: /__w/_warm/uv
            - name: CI_CACHE_KILL_SWITCH
              value: ""
            - name: SCCACHE_REDIS_ENDPOINT
              value: redis://sccache-redis.ci-sccache.svc.cluster.local:6379
            - name: SCCACHE_REDIS_RW_MODE
              value: READ_ONLY
            - name: CI_CACHE_CANARY_N
              value: "20"
            # The forge credential the two credential-reading targets need
            # (R4.S6). OPTIONAL: where the Secret is absent the pod still starts
            # and the check fails with a message naming what is missing, which
            # tells an operator more than a pod that never starts. Declared and
            # provisioned per ./gate-credentials.yaml.
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gate-forge-credential
                  key: GH_TOKEN
                  optional: true
            - name: CI_RUNNER_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            # Requirement 3. Runner pods request only ci-runner.io/churn-slot, so
            # the scheduler bin-packs on that alone and a request-less gate would
            # not be placed sanely. These are also the terms gates-cq quotas:
            # 15 cpu / 24Gi admits three concurrent gates at exactly these
            # numbers (../kueue/cluster-queue-gates.yaml).
            requests:
              cpu: "@@CPU@@"
              memory: "@@MEMORY@@"
            limits:
              # No cpu limit, deliberately: a cpu limit throttles rather than
              # bin-packs, and the quota above is what bounds concurrency. The
              # memory limit equals the request so the gate is Guaranteed-class
              # for memory and cannot be evicted under node pressure mid-run,
              # which would read as a gate failure rather than as an eviction.
              memory: "@@MEMORY@@"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
      volumes:
        - name: workspace
          emptyDir: {}
