# gate-job-template.yaml — the Job a delegated pre-push gate run instantiates
# (R4.S5, livespec-dev-tooling-sk8f; plan livespec k3s-on-gmktec-for-vps-usage,
# epic livespec-sab5gn; design in that plan's research/003 section D and
# corrections 2, 5 and 6).
#
# NOT APPLIED BY CONVERGE. Unlike every other manifest in this tree, this file is
# a TEMPLATE: ./render-gate-job.sh substitutes its placeholder markers and the gate client
# submits the result. Converge only ships it. Applying this file as it stands
# would fail — @@IMAGE@@ is not a resolvable image reference — and that is the
# intended failure mode for anyone who tries.
#
# EVERY TOKEN IS REQUIRED. render-gate-job.sh refuses to emit a manifest that
# still carries an unsubstituted placeholder marker, so a token added here without a
# matching substitution is caught at render time rather than by the API server.
#
# WHY suspend: true — Kueue admits a Job by UNSUSPENDING it. A Job created
# unsuspended bypasses the queue entirely and runs immediately against no quota,
# which would defeat gates-cq. Kueue sets this back to false on admission.
apiVersion: batch/v1
kind: Job
metadata:
  name: @@JOB_NAME@@
  namespace: gates
  labels:
    app.kubernetes.io/part-of: livespec-ci-gates
    app.kubernetes.io/managed-by: livespec-ci-runner-gates
    livespec.gate/repo: @@REPO@@
    livespec.gate/tree-hash: @@TREE_HASH@@
    # Requirement 6: the LocalQueue in this namespace, bound to gates-cq.
    kueue.x-k8s.io/queue-name: gates-lq
    # Admission order within gates-cq. gate-priority never preempts; gates-cq
    # keeps the pool's three `Never` preemption settings.
    kueue.x-k8s.io/priority-class: gate-priority
spec:
  suspend: true
  # Requirement 8: finished gate Jobs are collected rather than accumulating as
  # control-plane objects. The pool is under a ratified clause to bound the
  # pending work it materialises on the control plane, and a gate Job is a new
  # object on that same bounded plane. One hour is long enough to read a failed
  # gate's logs by hand and short enough that a day of pushes cannot pile up.
  ttlSecondsAfterFinished: @@TTL_SECONDS@@
  # A gate verdict is a measurement, not a workload to retry: a re-run on the
  # same tree must be a new, separately-identified gate, never a silent second
  # attempt whose failure the first attempt's success would mask.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: livespec-ci-gates
        livespec.gate/repo: @@REPO@@
    spec:
      restartPolicy: Never
      # Requirement 7, half one. R3 tainted gmktec `node-role/ci=pending:NoSchedule`
      # to keep CI RUNNER pods off it until R5 derived its capacity; a gate was
      # deliberately the first workload allowed there, which is why this toleration
      # exists. R5 (livespec-dev-tooling-xa6o) has since opened the node and removed
      # that taint, so the toleration is now a harmless no-op (it tolerates a taint
      # no longer present) rather than the load-bearing thing that lands the Job on
      # gmktec — the hostname nodeSelector below is what pins it there.
      tolerations:
        - key: node-role/ci
          operator: Equal
          value: pending
          effect: NoSchedule
      # Requirement 7, half two. PREFERRED rather than required: gates-flavor
      # already selects gmktec by `kubernetes.io/hostname`, so Kueue will not
      # admit this Job against any other node's quota. This affinity expresses
      # the same intent to the SCHEDULER, and keeping it preferred means a
      # future flavor change does not leave an unschedulable Job behind.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["gmktec-xubuntu"]
      # The executor holds NO cluster authority: it runs a check aggregate over a
      # tree and has no business reading the API. Nothing here mounts a
      # ServiceAccount token.
      automountServiceAccountToken: false
      initContainers:
        # Fetches the exact tree under test from the in-cluster read-only mirror
        # (research/003 section E; built by R4.S4, livespec-dev-tooling-2hno).
        # The ref is named after the tree hash, so one value identifies the tree,
        # the ref and this Job — a gate cannot run against content other than
        # what was pushed.
        - name: fetch-tree
          image: @@IMAGE@@
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              git init --quiet /workspace
              cd /workspace
              git remote add origin "@@SOURCE_URL@@"
              # NOT `--depth 1`. Eight members of `just check` judge a COMMIT
              # RANGE — `origin/master..HEAD` — rather than a tree, and a single
              # shallow commit gives them neither ancestry nor a base: they fail
              # STRUCTURALLY (the shipped-path release guard reports
              # `range_base_unresolvable`) instead of judging the tree under
              # test, which is the same class of defect as gating a subset of
              # the checks. So both refs are fetched in full.
              #
              # THE `.base` COMPANION REF carries the client's own
              # `origin/master` and lands here as `refs/remotes/origin/master`,
              # which is the name every one of those members resolves. It is
              # written by the SAME `git push --atomic` that writes the gate ref
              # (`livespec_dev_tooling.gate_remote_client`, whose
              # `GATE_BASE_REF_SUFFIX` is this `.base`), so a gate ref without
              # its companion cannot exist — and a fetch that cannot find one
              # fails the Job here rather than letting the aggregate run against
              # an unresolvable base.
              if ! git fetch --quiet origin \
                   "+refs/gates/@@TREE_HASH@@:refs/gates/@@TREE_HASH@@" \
                   "+refs/gates/@@TREE_HASH@@.base:refs/remotes/origin/master"; then
                echo "FATAL: cannot fetch refs/gates/@@TREE_HASH@@ and its .base companion from @@SOURCE_URL@@" >&2
                exit 1
              fi
              git checkout --quiet --detach "refs/gates/@@TREE_HASH@@"
              actual="$(git rev-parse 'HEAD^{tree}')"
              if [ "${actual}" != "@@TREE_HASH@@" ]; then
                echo "FATAL: fetched tree ${actual} is not the requested @@TREE_HASH@@" >&2
                exit 1
              fi
              # Present is not the same as USABLE: two refs with no common
              # ancestor would satisfy every check above and still leave every
              # range member without a diff base. Assert the merge-base the
              # aggregate is about to take, here, where the failure names its
              # cause.
              if ! git merge-base HEAD origin/master >/dev/null; then
                echo "FATAL: git merge-base HEAD origin/master does not resolve in the fetched history" >&2
                exit 1
              fi
          volumeMounts:
            - name: workspace
              mountPath: /workspace
        # livespec CORE, for the consumer whose aggregate runs
        # `check-doctor-static` (freeze-driver ruling R92, 2026-10-17, part ii).
        # Core ships that checker and the recipe resolves it through
        # `LIVESPEC_CORE_PLUGIN_ROOT` or, locally, the installed plugin cache.
        # The pod has NEITHER: /workspace is a `git init` + fetch and no plugin
        # is installed, so the target failed with core's own "livespec core not
        # found" on a tree that was green in CI. This is the same resolution the
        # consumer's OWN CI job makes — check core out at the ref its
        # `.livespec.jsonc` `compat.pinned` names, then point the recipe at that
        # tree's `.claude-plugin` — so the gate and CI judge the tree against
        # the same core build rather than two.
        #
        # NO CREDENTIAL IS PASSED IN FOR IT, and this container's lack of an env
        # block is that statement: livespec core is public, the remote is the
        # anonymous https form, and there is nothing here to leak or rotate. The
        # two credential-reading aggregate members still read GH_TOKEN from the
        # gate container's own optional Secret reference below.
        #
        # SHALLOW IS CORRECT HERE AND WRONG ABOVE, which is why only the
        # fetch-tree container is held to a full fetch: nothing reads core's
        # HISTORY — doctor's out-of-band-edits arm walks the GATED repository's
        # history, in /workspace, which is fetched in full — and a full clone of
        # core is two orders of magnitude more bytes on a pod whose cache is
        # cold every run.
        - name: fetch-livespec-core
          image: @@IMAGE@@
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              git init --quiet /livespec-core
              cd /livespec-core
              git remote add origin "@@LIVESPEC_CORE_URL@@"
              # `git fetch <ref>` rather than `clone --branch`: the pinned value
              # is a TAG for a consumer that pins a release and a BRANCH for one
              # that pins nothing, and this one form resolves either.
              if ! git fetch --quiet --depth 1 origin "@@LIVESPEC_CORE_REF@@"; then
                echo "FATAL: cannot fetch livespec core ref @@LIVESPEC_CORE_REF@@ from @@LIVESPEC_CORE_URL@@ — this is the ref the gated repository's .livespec.jsonc compat.pinned names" >&2
                exit 1
              fi
              git checkout --quiet --detach FETCH_HEAD
              # Fetched is not the same as USABLE. A ref that resolves to a tree
              # without a plugin root leaves LIVESPEC_CORE_PLUGIN_ROOT pointing
              # at nothing, and the consumer's own recipe would then report
              # "livespec core not found" — the exact message this container
              # exists to prevent, with no indication that the PIN is what is
              # wrong. Fail here, where it names the ref.
              if [ ! -d .claude-plugin ]; then
                echo "FATAL: livespec core at @@LIVESPEC_CORE_REF@@ carries no .claude-plugin directory, so there is no plugin root to resolve" >&2
                exit 1
              fi
          volumeMounts:
            - name: livespec-core
              mountPath: /livespec-core
      containers:
        - name: gate
          # Requirement 1: resolved by render-gate-job.sh from the GATED
          # repository's own .github/workflows/ci.yml container block, never a
          # constant. Measured 2026-09-07 the two repos ran different tags, and
          # by 2026-09-08 both had moved again — a baked tag would gate against a
          # different toolchain than CI uses.
          image: @@IMAGE@@
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          # Requirement 2: THE GATED REPOSITORY'S OWN check recipes, nothing
          # else. Both blocks below are substituted by render-gate-job.sh from
          # that repository's `gate_check_suite` declaration — or, when it
          # declares none, from the shared pre-push SEQUENCE its local
          # fall-through runs: the worktree-pack install, the
          # commit-refuse-hook install, and the one recipe that hook calls,
          # `check-pre-push` (freeze-driver rulings R92 and R100, 2026-10-17; a
          # single `check` was that default before R92, and the two missing
          # installs reddened members on a tree green in CI, while R92's own
          # `hook_gate=1 check` spelling then died in every consumer that does
          # not declare that `just` variable).
          # They are NOT a constant here, and that is the
          # whole point of the slice that rewrote this block
          # (livespec-dev-tooling-saxz): the command used to be a fixed list of
          # livespec-dev-tooling's OWN recipes — the worktree-pack install, the
          # commit-refuse-hook install, the typecheck warm-up and its
          # hook-gated aggregate. The typecheck warm-up exists in no other
          # repository, so every consuming repository's Job failed and its gate
          # was red on every green tree. Measured 2026-10-16 against
          # livespec-orchestrator-beads-fabro, whose post-merge janitor shipped
          # `venue = host_local` rather than use a gate that could not pass.
          #
          # THE PREFLIGHT IS WHAT MAKES A MISSING RECIPE LEGIBLE. Without it a
          # consumer that does not provide its declared recipe gets `just`'s own
          # "Justfile does not contain recipe" at whatever point the suite
          # reached, which reads exactly like a red tree. With it the Job stops
          # before running ANYTHING, names the recipe on stderr and in the pod's
          # termination message — which the client lifts into the verdict an
          # operator reads — and exits non-zero. It never reports green and it
          # never falls back to a recipe the repository did not declare.
          #
          # WHY THE TERMINATION-LOG WRITE IS BEST-EFFORT: the message is
          # EVIDENCE, not the verdict. The exit status is the verdict, and a
          # cluster or a shell that cannot write that file must not be able to
          # turn a red gate into something else — nor, in a test harness that
          # runs this script outside a pod, into a different failure than the
          # one being asserted.
          #
          # THE TWO INSTALLS RUN FIRST IN EVERY GATE — livespec-dev-tooling's
          # own declaration and, since ruling R92, the default every consumer
          # that declares nothing gets. The reasons are worth keeping because
          # they are the ones a consumer authoring its own suite will meet,
          # and because they are why a bare `check` could never stand in for
          # the local fall-through. `/workspace` is a
          # `git init` + fetch, not a bootstrapped clone, so the
          # worktree-discipline pack and the commit-refuse hooks are simply
          # absent: `check-primary-checkout-commit-refuse-hook-installed` fails
          # on the missing hooks and `check-no-workflow-edits` has no
          # `dev-tooling/check-no-workflow-edits.sh` to run at all. Neither is a
          # verdict about the tree under test. THE PACK INSTALL MUST BE ITS OWN
          # `just` INVOCATION, and that is not a style choice: the root justfile
          # reaches the pack through `import? 'dev-tooling/worktree.just'`, which
          # `just` resolves when it PARSES the file, so a combined invocation
          # would parse once, before the pack existed. And the narrow recipes
          # rather than `just bootstrap`: bootstrap walks the whole
          # local-obligation partition — mise trust/install, plugin
          # registration, the beads-runtime probes — none of which a gate pod
          # has or needs, and each of which is a way for a gate to fail for a
          # reason that is not the tree.
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              # THE CORE RESOLUTION, SAID OUT LOUD WHERE A VERDICT'S READER IS.
              # The init container above fetches livespec core at the consumer's
              # pin and this container is handed the path to it, but until this
              # line nothing in the gate's own output said so: the client
              # streams THIS pod's logs as the verdict stream, so the resolution
              # was a fact of the MANIFEST rather than an observable of the RUN,
              # and "was core resolved?" could not be answered from a gate's
              # output at all (freeze-driver ruling R100, 2026-10-17).
              #
              # BEFORE THE PREFLIGHT, deliberately: a Job that refuses a missing
              # recipe still reports whether core was there. An EMPTY or absent
              # value prints as such rather than tripping `-u`, because "core
              # was not resolved" is the answer a reader needs most — it is the
              # cause behind core's own "livespec core not found" from a
              # consumer's `check-doctor-static`.
              echo ":: gate: livespec core ref @@LIVESPEC_CORE_REF@@ -> LIVESPEC_CORE_PLUGIN_ROOT=${LIVESPEC_CORE_PLUGIN_ROOT:-<unset>}"
              # THE CROSS-REPO SIBLINGS this consumer's own checks READ, cloned
              # from github.com and pointed at through
              # LIVESPEC_SIBLING_CLONES_ROOT — exactly as that consumer's CI
              # does it (livespec-dev-tooling-s35dcb). Substituted by
              # render-gate-job.sh from the gated repository's own
              # `.livespec.jsonc` `cross_repo_targets`, and EMPTY for a
              # repository that registers none, whose command is then the one it
              # has always had.
              #
              # WHY A MISSING CLONE IS A SILENT WRONG ANSWER, which is the whole
              # reason this is a step rather than a nicety. livespec core's
              # cross-repo readers resolve a cited sibling at
              # `$LIVESPEC_SIBLING_CLONES_ROOT/<sibling>` when that variable is
              # set and at the manifest's `local_clone` otherwise —
              # `/data/projects/<sibling>`, a fleet-host path no pod has. An
              # absent path does not ERROR there: it reads as an EMPTY heading
              # set, so every allowlist entry for that sibling is dropped and a
              # correctly allowlisted citation is reported "not allowlisted".
              # Measured 2026-10-18 on gate-livespec-e0a55a1a58f6:
              # `doctor-no-cross-spec-reference` failed livespec
              # SPECIFICATION/constraints.md:298 on a tree whose master CI was
              # green and which passes that check locally.
              #
              # BEFORE THE PREFLIGHT, for the same reason the core report above
              # is: provisioning the environment the suite judges in is not part
              # of judging it, and a clone that fails must be the verdict rather
              # than one red member of a run that may not have reached it.
              #
              # ANONYMOUS, so no credential is passed in for them — the same
              # property that lets the livespec core init container above carry
              # no env block at all.
              @@GATE_SIBLING_CLONES@@
              for recipe in @@GATE_RECIPE_NAMES@@; do
                if just --show "${recipe}" > /dev/null 2>&1; then
                  continue
                fi
                missing="FATAL: the tree under test does not provide the gate check recipe '${recipe}' this repository declares for its delegated gate (gate_check_suite in its [tool.livespec_dev_tooling] block, or the check recipe its local pre-push fall-through runs). No recipe was run; this gate is RED."
                echo "${missing}" >&2
                { printf '%s\n' "${missing}" > /dev/termination-log; } 2> /dev/null || true
                exit 1
              done
              @@GATE_RECIPES@@
          env:
            # R4.S6 (livespec-dev-tooling-ul61): declares to the check aggregate
            # that this run is a delegated gate authorising a push, so a check
            # that cannot read its credential FAILS here instead of warning and
            # exiting 0. The signal is explicit and set in exactly this one
            # place: guessing the context from the environment is what would
            # make the strict disposition fire on a contributor's machine.
            - name: LIVESPEC_GATE_CONTEXT
              value: "1"
            # R4.S7 slice B (livespec-dev-tooling-rwmo.2): WHAT this run is
            # gating, which the pod cannot work out for itself. Both
            # credential-reading targets name their repository from the clone —
            # `check-branch-protection-alignment` parses `origin` against a
            # github.com-only pattern, `check-master-ci-green` hands `gh` the
            # `{owner}`/`{repo}` placeholders it expands from that same remote —
            # and this clone's origin is the in-cluster git-daemon URL, which is
            # not github.com and carries no owner segment at all. So a TOKEN
            # ALONE does not arm those two checks; without this they fail here
            # having never identified the repository they were judging.
            #
            # NOT a rewritten origin, because origin is load-bearing for the
            # initContainer's `.base` fetch into refs/remotes/origin/master —
            # the name eight range-judging aggregate members resolve.
            #
            # Read ONLY where LIVESPEC_GATE_CONTEXT is set, so the variable is
            # inert everywhere else and cannot silently repoint a contributor's
            # checks at another repository. An EMPTY value (render-gate-job.sh
            # could not derive the identity) reads as "no repository named",
            # which fails those two targets the same way a missing token does.
            - name: LIVESPEC_GATE_REPOSITORY
              value: "@@GATED_REPOSITORY@@"
            # WHERE livespec core is, for a consumer whose aggregate runs
            # `check-doctor-static` (ruling R92, part ii). The value is the
            # `.claude-plugin` directory of the tree the init container above
            # fetched, which is what this variable means everywhere else in the
            # fleet: the consumer's own `just-check-doctor-static.sh` resolves
            # `$LIVESPEC_CORE_PLUGIN_ROOT/scripts/bin/doctor_static.py`, and its
            # CI job sets it to a core checkout's `.claude-plugin` the same way.
            # Set unconditionally and inert for a consumer that runs no
            # doctor-static target.
            - name: LIVESPEC_CORE_PLUGIN_ROOT
              value: "/livespec-core/.claude-plugin"
            # Requirement 4. The local lane derives nproc / 4, and `nproc` inside
            # a container reports the NODE's 32 threads regardless of this
            # container's cpu request — so an unset value would start 8 workers
            # under a 5 cpu request and oversubscribe the gate's own quota.
            - name: LIVESPEC_TEST_PARALLELISM
              value: "@@PARALLELISM@@"
            # Requirement 5: the cache environment is REUSED from
            # ../arc/hook-pod-template.yaml rather than re-invented, so the two
            # cannot drift. Keep these in step with that file's container env.
            - name: UV_CACHE_DIR
              value: /__w/_warm/uv
            - name: CI_CACHE_KILL_SWITCH
              value: ""
            - name: SCCACHE_REDIS_ENDPOINT
              value: redis://sccache-redis.ci-sccache.svc.cluster.local:6379
            - name: SCCACHE_REDIS_RW_MODE
              value: READ_ONLY
            - name: CI_CACHE_CANARY_N
              value: "20"
            # The forge credential the two credential-reading targets need
            # (R4.S6). OPTIONAL: where the Secret is absent the pod still starts
            # and the check fails with a message naming what is missing, which
            # tells an operator more than a pod that never starts. Declared and
            # provisioned per ./gate-credentials.yaml.
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gate-forge-credential
                  key: GH_TOKEN
                  optional: true
            - name: CI_RUNNER_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            # Requirement 3. Runner pods request only ci-runner.io/churn-slot, so
            # the scheduler bin-packs on that alone and a request-less gate would
            # not be placed sanely. These are also the terms gates-cq quotas:
            # 15 cpu / 24Gi admits three concurrent gates at exactly these
            # numbers (../kueue/cluster-queue-gates.yaml).
            requests:
              cpu: "@@CPU@@"
              memory: "@@MEMORY@@"
            limits:
              # No cpu limit, deliberately: a cpu limit throttles rather than
              # bin-packs, and the quota above is what bounds concurrency. The
              # memory limit equals the request so the gate is Guaranteed-class
              # for memory and cannot be evicted under node pressure mid-run,
              # which would read as a gate failure rather than as an eviction.
              memory: "@@MEMORY@@"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            # The core tree the init container fetched, at the path
            # LIVESPEC_CORE_PLUGIN_ROOT above names. Without this mount that
            # variable names an empty path and the checks that read it fail
            # exactly as they did with no variable at all.
            - name: livespec-core
              mountPath: /livespec-core
      volumes:
        - name: workspace
          emptyDir: {}
        - name: livespec-core
          emptyDir: {}
