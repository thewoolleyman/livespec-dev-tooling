# gate-credentials.yaml — the NON-SECRET half of the forge credential a gate pod
# needs (R4.S6, livespec-dev-tooling-ul61; plan livespec
# k3s-on-gmktec-for-vps-usage, epic livespec-sab5gn; design research/003 H).
#
# WHAT IS AND IS NOT HERE. This declares the Secret's SHAPE — its name, its
# namespace and the key the gate reads — so the requirement is recreatable from
# source, exactly as ../../observability/kueue-webhook-probe-rbac.yaml declares
# the probe's identity without its token. NO CREDENTIAL VALUE IS HERE AND NONE
# EVER MAY BE. The bytes are supplied out of band by an operator; see below.
#
# NOT APPLIED BY CONVERGE, deliberately. Applying this would create an EMPTY
# Secret, and an empty forge token is worse than an absent one: it looks
# provisioned. Converge ships the file; the real Secret's value is never in it.
#
# RECONSTRUCTED ON BOOT FROM THE HOST CREDSTORE (the durable path). Because the
# k3s datastore is tmpfs (../datastore-tmpfs/), a reboot wipes this Secret, and
# for a long time it was recreated BY HAND once per cluster rebuild — so a
# reboot silently broke the delegated gate until an operator noticed. That gap
# is now closed: ../../secret-reinjection/inject-gate-forge-secret.service
# reconstructs gates/gate-forge-credential from the host systemd credstore on
# every boot, with no manual step and no network, exactly as its sibling does
# for ARC's App secret. The token is seeded into the credstore ONCE (attended,
# from 1Password) via ../../secret-reinjection/seed-gate-forge-cred.sh — once
# per HOST rebuild, not per reboot. The `TO CREATE IT` recipe below remains the
# manual bootstrap / break-glass path.
#
# WHY A GATE POD NEEDS ONE AT ALL. Two check targets in the pre-push aggregate
# read a forge credential and, without one, USED TO warn and exit 0 —
# check-branch-protection-alignment and check-master-ci-green. Since R4.S6 they
# FAIL inside a gate instead, keyed on LIVESPEC_GATE_CONTEXT. That converts a
# false green into a loud failure, which is the right default, but it also means
# an unprovisioned gate pod cannot pass. This file is how it gets provisioned.
# The full enumeration and the reasoning are in
# ../../../../livespec_dev_tooling/checks/credential-reading-targets.md.
#
# THE SCOPE THIS NEEDS, AND WHAT IT COSTS. check-branch-protection-alignment
# requires a credential that can READ BRANCH PROTECTION, which is an ADMIN-scoped
# read — the default Actions GITHUB_TOKEN cannot do it. research/003 section H
# prescribes projecting "the least-privilege, read-scoped ones as Secrets", which
# does NOT cover that scope. So this is a deliberate cost, named here rather than
# discovered: either the executor holds a credential able to read branch
# protection, or that target is removed from the gate recipe. Grant nothing
# beyond what these two verifications need — no write scope, no org
# administration, no packages, no workflow scope.
#
# A TOKEN ALONE IS NOT SUFFICIENT. Both checks resolve the repository from their
# clone's `origin` remote, and branch_protection_alignment matches it against a
# github.com-only pattern; research/003 section E has the gate pod fetch from an
# in-cluster git daemon whose URL is not github.com. A pod given this Secret and
# nothing else still cannot resolve the repository it is gating. That is R4.S7's
# problem to close, and it is recorded here so nobody reads this file as the
# whole provisioning story.
#
# TO CREATE IT (never committed, never echoed, one line, no shell history):
#
#   read -rs GH_GATE_TOKEN            # paste; nothing is printed
#   kubectl -n gates create secret generic gate-forge-credential \
#     --from-literal=GH_TOKEN="${GH_GATE_TOKEN}"
#   unset GH_GATE_TOKEN
#
# TO VERIFY IT WITHOUT REVEALING IT — presence and size only, never the value:
#
#   kubectl -n gates get secret gate-forge-credential \
#     -o jsonpath='{.data.GH_TOKEN}' | wc -c
#
# The gate Job consumes it as an OPTIONAL secretKeyRef (see
# gate-job-template.yaml). Optional is deliberate: with it, a pod on a cluster
# where the Secret is missing STARTS and then fails at the check with a message
# naming the missing credential. Without it the pod would fail to start, which is
# also fail-closed but tells an operator far less.
---
apiVersion: v1
kind: Secret
metadata:
  name: gate-forge-credential
  namespace: gates
  labels:
    app.kubernetes.io/managed-by: livespec-ci-runner-gates
    livespec.workitem: ul61
  annotations:
    livespec.io/provisioning: >-
      Created out of band by an operator, never by converge and never from a
      committed value. See this file's header for the create and verify
      commands. The only key is GH_TOKEN, scoped to read branch protection and
      check-run status for the gated repositories and nothing else.
type: Opaque
# `data` and `stringData` are ABSENT on purpose. A committed key with a value —
# even a placeholder — is a credential in version control, and a placeholder that
# reaches a cluster is an empty token that reads as provisioned.
