# sccache-redis.yaml — the pool's shared Rust COMPILATION cache (B1 of plan
# ci-runner-cache-tiers; SPECIFICATION/non-functional-requirements.md
# §"Runner-pool build cache tiers", v054): a RAM-resident redis on the CI host
# that sccache (../sccache/install-sccache-binary.sh, mounted into every job
# container by ../arc/hook-pod-template.yaml) reads compiled dependency
# artifacts from. One host service, two consumers: workflow pods over cluster
# DNS, and off-node consumers (the fabro factory host) over hostPort 6379.
#
# WHY THIS AND NOT A COPIED target/ TREE: the console's merge-gating matrix
# runs ten concurrent jobs that each cold-rebuild the SAME dependency graph
# (883 s on this host vs 427 s hosted-with-cache; livespec-dev-tooling-9mp).
# sccache keys on compiler inputs, so one populator build serves every job's
# dependency compiles, adds ZERO per-job start writes (a hit writes the same
# artifact a compile would have), and the same endpoint serves fabro sandboxes.
# A copied target tree is rejected on the array by the start-burst knee
# (research/004) and deferred to the NVMe (livespec-dev-tooling-c5byjh).
#
# TRUST BY CONSTRUCTION, server-side: the ACL file (rendered by
# converge-sccache-redis.sh into the `sccache-redis-acl` Secret) gives the
# unauthenticated `default` user READ-ONLY commands (+@read +@connection,
# nothing else), which is what every job pod connects as; the ONE writer user
# (`sccache-writer`, password generated on the host and held only by the
# populator's namespace) has @write. A job additionally runs sccache with
# SCCACHE_REDIS_RW_MODE=READ_ONLY so it never even attempts a write, but the
# refusal a job would get is redis's own NOPERM, not the client's good
# manners. A job's own compilation output is therefore never written back to
# the shared cache; the populator builds ONLY each routed repository's default
# branch. Entries are content-addressed, so sharing across repositories is
# sound (the spec permits it for the compilation cache).
#
# MEMORY CEILING — sized against the concurrency cap (the spec's rule that
# cache memory and job memory must not compete): allocatable RAM 188 GiB; the
# original derivation (plan research/006) took the churn-slot cap C=32 at a
# 4 GiB per-job envelope (128 GiB for jobs), ~8 GiB for k3s + containerd +
# host services, ~20 GiB of page cache for the warm trees and the crates
# proxy's store, and gave redis 16 GiB (`maxmemory 16gb`, allkeys-lru), limit
# 18 GiB for redis's own overhead. C is 64 since 2026-09-06 (PR #1751), so
# that arithmetic no longer closes on paper (a 256 GiB envelope); it closes
# in practice because jobs do not all peak together — the cap is
# throughput-derived (.ai/ci-node-capacity-reads.md) and the node measured
# ~143 GiB free at C=64 with every cache resident (livespec-dev-tooling-
# efqeip.3). The 16 GiB ceiling therefore stands on measured headroom, not
# on the envelope sum; re-derive against observed job RSS if it is ever
# raised, and raise `--maxmemory` and the limit together. The console's
# full dependency graph across four profiles measured well under the
# ceiling; the headroom is for PR-lockfile variants and a second Rust
# repository.
#
# SNAPSHOT PERSISTENCE ON THE ci-cache TIER (livespec-dev-tooling-efqeip.3;
# measured in plan research/011 §3). The cache is regenerable, and the first
# design kept it RAM-only on the argument that one populate run refills it
# after a restart. That holds only for a reboot into an IDLE pool: after the
# 2026-09-06 01:59Z proving reboot CI was restored into a busy pool, the
# populator's busy-pool guardrail skipped every refill, and for hours every
# Rust job recompiled its dependency graph — sccache hit ratio 59.3% ->
# 0.35%, cargo clippy P50 20.2 s -> 43.0 s, cargo nextest 13.1 s -> 24.7 s,
# the console matrix P90 370 s -> 661 s, the hit-floor trigger firing. So
# redis now writes an RDB snapshot (`--save "300 1 60 10000"`: every five
# minutes with any change, every minute with 10k changes), one on SIGTERM,
# and one when the populator asks for BGSAVE after each build (+bgsave on the
# writer ACL, ../warm-cache/warm-cache-populate.sh), all
# into a hostPath on the `ci-cache` tier (/var/cache/ci-runner/sccache-redis,
# created 999:1000 by converge-sccache-redis.sh, which REFUSES when the tier
# is not mounted so a dump can never land on the root disk), and a restart
# or reboot restores the last snapshot in seconds. The populator's marker
# key comes back with it, so an unchanged branch costs nothing and a stale
# snapshot (toolchain bump, new default-branch SHA) is rebuilt on the next
# idle tick exactly as before. Cost: an RDB is a compact point-in-time dump
# written by a forked child (copy-on-write; the 18 GiB limit against the
# 16 GiB `maxmemory` is that child's headroom), not the per-write load an
# AOF would be — `--appendonly` stays `no`. `--stop-writes-on-bgsave-error
# no` keeps the populator writing if a dump ever fails (the cache gauges and
# the hit-floor trigger are the alarm, not a refused SET). The
# terminationGracePeriodSeconds of 300 lets the shutdown save of a full
# 16 GiB set finish before k3s kills the pod on a reboot. To flush the cache
# deliberately: scale the Deployment to 0, remove the dump, scale back to 1
# (README "Operating it").
#
# NODE PINNING (two-node precondition; plan k3s-on-gmktec-for-vps-usage,
# carrier R3): the pod spec below carries
# `nodeSelector: ci-runner.io/cache-tier-carrier: "true"`. The snapshot is a
# hostPath on ONE node's `ci-cache` tier, so a pod that lands anywhere else
# mounts an empty directory, loads no dump, and silently serves a cold cache
# behind a healthy-looking rollout. The pin is NOT on `k3s-role=arc-runner-host`
# because that is the RUNNER role: every node that joins the pool to execute
# workflow pods carries it, including the second node this pin exists for.
# Carrying a storage tier is a storage fact, not a runner-role fact, so it has
# its own key. ../../provision-k3s.sh labels the node it provisions and
# ../reconstruct/converge-ci-stack.sh re-asserts the label on every boot, for
# the node whose `ci-cache` tier is actually mounted and only that node.
apiVersion: v1
kind: Namespace
metadata:
  name: ci-sccache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sccache-redis
  namespace: ci-sccache
  labels:
    app.kubernetes.io/name: sccache-redis
spec:
  replicas: 1
  # One hostPort on one node; Recreate so two pods never race for it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sccache-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sccache-redis
    spec:
      # The node that carries the `ci-cache` tier this pod's hostPath lives on
      # (header, "NODE PINNING"). Unschedulable is the correct failure here:
      # a pending pod is visible, an empty cache on the wrong node is not.
      nodeSelector:
        ci-runner.io/cache-tier-carrier: "true"
      # No Kueue queue-name label and no ci-runner.io/churn-slot request:
      # not a CI job, must never occupy a runner slot.
      # The shutdown save of a full set must finish before the kill (header,
      # "SNAPSHOT PERSISTENCE").
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # Pinned by tag AND digest (k3s README "Pinned versions — nothing
          # floats `latest`"). Bump both together.
          image: docker.io/library/redis:8.8.2-alpine@sha256:96cb544fa0af5aa898d160cffb7dae70c3df117190fc123831c64712cda425ff
          imagePullPolicy: IfNotPresent
          command: ["redis-server"]
          args:
            - "--bind"
            - "0.0.0.0"
            # protected-mode only guards a redis with NO auth configured; the
            # ACL file below is the guard here, and the default user is
            # read-only by it.
            - "--protected-mode"
            - "no"
            - "--aclfile"
            - "/etc/redis/users.acl"
            - "--maxmemory"
            - "16gb"
            - "--maxmemory-policy"
            - "allkeys-lru"
            # RDB snapshots on the ci-cache tier; see the header. One
            # argument string is how redis-server takes multiple save points.
            - "--save"
            - "300 1 60 10000"
            - "--dir"
            - "/data"
            - "--dbfilename"
            - "dump.rdb"
            - "--stop-writes-on-bgsave-error"
            - "no"
            - "--appendonly"
            - "no"
            - "--maxclients"
            - "10000"
            - "--tcp-keepalive"
            - "60"
          ports:
            - name: redis
              containerPort: 6379
              hostPort: 6379
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              memory: "18Gi"
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 30
          volumeMounts:
            - name: acl
              mountPath: /etc/redis
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: acl
          secret:
            secretName: sccache-redis-acl
            defaultMode: 0440
        - name: data
          # The snapshot directory on the ci-cache tier. `Directory`, not
          # `DirectoryOrCreate`: the kubelet would create it root-owned and
          # the non-root redis could not write its dump; the converge script
          # creates it 999:1000 after checking the tier is mounted.
          hostPath:
            path: /var/cache/ci-runner/sccache-redis
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: sccache-redis
  namespace: ci-sccache
spec:
  selector:
    app.kubernetes.io/name: sccache-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
