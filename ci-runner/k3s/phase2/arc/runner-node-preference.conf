# runner-node-preference.conf — the one declared fill order for ARC runner pods
# (plan gate-job-resources, livespec-dev-tooling-ukoeah; maintainer rule
# FOCUS-TWO-LEVERS, lever 2).
#
# ../arc/render-arch-overlay.sh renders each line into a SOFT node preference
# (preferredDuringSchedulingIgnoredDuringExecution) on every scale set's runner
# pod, so an idle slot on a faster node is filled before a slot on a slower one.
# It is a preference, never a requirement: capacity is unchanged (each node's
# churn-slot count still bounds it), only the fill order moves, and the slow
# nodes still take overflow.
#
# Format, one entry per line (# starts a comment):
#   <kubernetes.io/hostname> <weight 1-100> <what the weight rests on>
#
# MEASURED 2026-11-17 (check-per-file-coverage, livespec-dev-tooling, 21 jobs,
# 2 h; Honeycomb k8s.pod.* joined to the Actions jobs API): median minutes
# gamingpc 12.0 (n=3), gmktec 15.8 (n=8), poweredge 26.0 (n=10), hp none
# completed (one job unfinished at 58+ min). The ranges do not overlap. The
# slowness is per-core speed: poweredge is Xeon E5-2696 v3 (Haswell, 2.3 GHz
# base, 3.8 max), against Ryzen 9800X3D (5.27 GHz) and Ryzen AI MAX+ 395 (5.19
# GHz); BestEffort CPU pressure on poweredge sat at 0-13, so contention with
# factory pods does not explain a 2x gap.
#
# REVERT: delete this file's entries (an empty file renders no preference).
# Triggers: gamingpc BestEffort full avg60 above 30, or gamingpc's median
# check-per-file-coverage above 18.0 min, or queue wait rising with no
# throughput gain on a +2 h read.
# MEASURED 2026-11-18 (same job, last 7 days, 1103 successful jobs on k3s
# runners, Honeycomb k8s.pod.name -> k8s.node.name joined to the Actions jobs
# API; livespec-dev-tooling-ukoeah): median / p90 minutes, n. gamingpc 14.1 /
# 18.1 (152), gmktec 22.6 / 36.1 (383), hp 29.6 / 45.7 (123), poweredge 36.2 /
# 60.4 (445). hp's earlier weight of 1 rested on no completed sample; its one
# 58+ min job was CANCELLED, not slow. Weights follow the measured median:
# 100, 60, 40, 20. The 11-17 figures above are the 2 h sample and are kept as
# the record of what the first weights rested on.
# REVERT hp to 1 (throughput-plans-coordinator ruling 2026-11-18): hp's median
# over 1.5x poweredge's after 5 post-change samples, OR hp's p90 over
# poweredge's p90 after 20 post-change samples. +2 h read: gmktec's churn-slot
# fill and node CPU should fall.
gamingpc-xubuntu 100 median 12.0 min on check-per-file-coverage
gmktec-xubuntu 60 median 15.8 min
poweredge-xubuntu 20 median 26.0 min, Haswell Xeon
hp-xubuntu 40 median 29.6 min (n=123, 2026-11-12..18), between gmktec and poweredge
