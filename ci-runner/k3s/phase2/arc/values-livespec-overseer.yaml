# values-livespec-overseer.yaml — the per-repository AutoscalingRunnerSet for
# `livespec-overseer`, derived from values-livespec.yaml per README.md
# "Deriving a new repository's ClusterQueue". Read that file first: it carries
# the rationale for repository-scoped `githubConfigUrl` (a personal GitHub
# account has no org or enterprise runner scope at all), for the churn-slot
# extended resource, and for why `maxRunners` and the ClusterQueue's
# nominalQuota are two enforcement points holding two DIFFERENT numbers.
#
# This file was the FIRST to carry the WORKFLOW-POD AppArmor wiring, because
# `livespec-overseer` is the repo whose suite actually exercises the affected
# operations. It is no longer the only one: livespec-s43svm.25 rolled the same
# wiring out to every other live scale set on 2026-08-19, since a scale set
# whose suite does not exercise intra-pod ptrace/signal today is latent-broken
# rather than unaffected. This file remains the reference implementation and
# carries the full root-cause comment; the sibling files point back here.
githubConfigUrl: "https://github.com/thewoolleyman/livespec-overseer"
githubConfigSecret: arc-github-app-installation  # same secret as phase 1 — see ../../README.md "Credential separation"

runnerScaleSetName: "livespec-overseer-k3s"

containerMode:
  type: "kubernetes"
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: "local-path"
    resources:
      requests:
        # NOT a quota and NOT a reservation. `local-path` is a mkdir-only
        # provisioner with no size enforcement, so this request neither bounds
        # nor reserves the work volume: one job's volume can grow to the whole
        # ci-workvols tier (measured on the console lane, its plan
        # optimize-console-builds research/002). It is here only because a PVC
        # spec requires a storage request; the actual bound is the tier's
        # capacity and the ephemeral volume's deletion with the runner pod.
        storage: 5Gi

template:
  metadata:
    labels:
      # Routes this scale set's runner pods through Kueue's per-repo LocalQueue
      # rather than straight to the Kubernetes scheduler.
      kueue.x-k8s.io/queue-name: livespec-overseer-lq
  spec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      # OnRootMismatch, not the default Always: the work volume is born with
      # the warm uv cache already in it as ~190k REFLINK COPIES (the
      # local-path provisioner's setup script, ../local-path-provisioner/;
      # hardlinks until 2026-09-06), and Always would have the kubelet
      # chgrp+chmod every one of them on this pod's mount -- a per-start
      # walk of the whole cache. The setup script leaves the
      # volume root exactly as Always would (gid 1000, mode 2777), so the
      # kubelet sees no mismatch and skips the walk (livespec-lvtu).
      fsGroupChangePolicy: OnRootMismatch
    volumes:
      # Carries ../apparmor/../arc/hook-pod-template.yaml into the runner pod so
      # the container hook can read it. Additive: the chart appends its own
      # `work` volume for kubernetes mode, and declaring this one does not
      # displace it (verified on the rendered AutoscalingRunnerSet).
      - name: hook-pod-template
        configMap:
          name: arc-hook-pod-template
    containers:
      - name: runner
        # Pinned tag + digest (livespec-s43svm handoff finding, 2026-08-25;
        # was `latest`; see the k3s README's "Pinned versions — nothing floats
        # `latest`").
        # The digest is the image the pool was verified on: its container
        # hook has no fs-init init container and merges the hook template
        # the way its header documents (see ../hook-pod-template.yaml or
        # the phase2 copy). Bump BOTH tag and digest together, re-read the
        # hook's initContainers behaviour, then helm upgrade + recycle.
        image: ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
          # THE WORKFLOW-POD FIX. In kubernetes container mode the job's
          # `container:` image runs in a SEPARATE pod the hook creates, whose
          # securityContext is empty and which nothing in this values file
          # otherwise reaches. This env var is the hook's one supported seam for
          # extending that pod's spec; it pins the pod to the node-loaded
          # `ci-runner-workflow` AppArmor profile.
          #
          # Without it, containerd's default profile denies intra-container
          # `signal` and `ptrace` on this host — Ubuntu's
          # kernel.apparmor_restrict_unprivileged_userns=1 stacks the task label
          # to `cri-containerd.apparmor.d//&unconfined`, which the default's
          # bare `peer=cri-containerd.apparmor.d` rules do not match. That broke
          # `os.killpg` (EACCES) and tmux `#{pane_current_path}` (empty, because
          # tmux readlinks /proc/<pgrp>/cwd and that is a ptrace-read), which is
          # what reverted this repo's 2026-08-17 cutover. Full root cause:
          # ../apparmor/ci-runner-workflow.
          - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
            value: /home/runner/hook-template/hook-pod-template.yaml
        volumeMounts:
          - name: hook-pod-template
            mountPath: /home/runner/hook-template
            readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        resources:
          # Exactly ONE churn-slot per runner pod — see values-livespec.yaml.
          requests:
            ci-runner.io/churn-slot: "1"
          limits:
            ci-runner.io/churn-slot: "1"

# This repo's per-repository ceiling term of the admission formula
# (`doubled repository logical ceiling`). It is NOT the same number as the
# `livespec-overseer-cq` ClusterQueue's nominalQuota, which is this repo's share of the
# host's finite churn-slot capacity -- a different term of the same min().
# See README.md "Two enforcement points, two DIFFERENT numbers" and
# ../kueue/DERIVATION.md; the relation to hold is nominalQuota <= maxRunners.
#
# The value below is this repo's podman-era demand weight (65), inherited as a
# proxy because nobody has measured its actual matrix width. Harmless at the
# current capacity (C=16), where no repo can approach it; re-derive from a real
# matrix-width measurement before raising capacity far enough for it to bind.
# See ../kueue/DERIVATION.md "Observation: ARC maxRunners still carries the
# podman-era numbers".
#
# BOUNDED 2026-09-06 (maintainer decision, livespec plan
# poweredge-raid-array-maintenance / epic livespec-g52yrb): maxRunners is now
# max(2 x this repo's Kueue nominalQuota, 6) = 8 (nominalQuota 4 at C = 32),
# no longer the doubled matrix width or the podman-era weight described above.
# Every runner ARC creates past the quota is a GATED pod that does no work but
# costs control-plane writes every reconcile: at the 2026-09-06 07:38Z backlog
# the ten ceilings summed to 574, 122 gated runner objects sat in the cluster
# while 25-30 ran, and kine logged 11 Slow SQL in ten minutes at C = 32.
# Bounded, the ten ceilings sum to 76, so a fleet-wide backlog holds at most
# 44 gated objects and the rest of the queue waits on GitHub's side at no cost.
# The 2x keeps cohort borrowing reachable; the floor of 6 lets a small-quota
# repo drain a lone matrix in a few waves instead of one job at a time.
# Recompute whenever C or this repo's quota changes. See ../kueue/DERIVATION.md
# "Bounding maxRunners to the quota (2026-09-06)".
minRunners: 0
maxRunners: 8
