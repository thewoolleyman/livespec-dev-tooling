# hook-pod-template.yaml — the ARC Kubernetes-mode hook's pod-spec extension.
#
# In `containerMode: kubernetes`, a job's `container:` image does NOT run in the
# runner pod. The runner's container hook (`/home/runner/k8s/index.js`) creates
# a SEPARATE "workflow" pod per job, and that pod's spec is built by the hook,
# not by the Helm values — which is why a securityContext set in
# `values-<repo>.yaml` reaches the runner pod only and leaves the pod the tests
# actually execute in with an EMPTY securityContext.
#
# `ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE` is the one supported seam. The hook
# reads this file with an untyped YAML load and merges its `spec` into the
# generated pod spec key by key (`mergePodSpecWithOptions`), so a field is
# passed through verbatim rather than being dropped by a typed deserializer.
# Merge semantics that this file depends on (hook source, packages/k8s/src/
# k8s/utils.ts): `volumes` is MERGED by name with the hook's own; a container
# named `$job` is merged INTO the hook-generated job container, where `env`
# and `volumeMounts` are merged by name and every other key (here
# `lifecycle`) is assigned; every other pod-spec key (here `securityContext`)
# is assigned WHOLESALE. Two keys this file deliberately does NOT set, for
# exactly that reason: `initContainers` (the hook's newer releases add their
# own `fs-init` init container, which a wholesale assignment would silently
# replace and break every job on the next image pull), and the job
# container's `command`/`image` (the hook owns them; image is refused).
#
# Three things are set here.
#
# 0. A USER NAMESPACE (`hostUsers: false`). The workflow pod's job container
#    runs the repo's `container:` image as its default user -- root, because
#    the fabro sandbox image keeps uv, CPython, mise, and cargo under /root --
#    and without this key that root was HOST root (`/proc/self/uid_map` read
#    `0 0 4294967295` inside a live workflow pod, 2026-08-23), violating the
#    host-requirements clause "the in-container root identity MUST map to a
#    non-root host identity" (livespec-s43svm.44). With `hostUsers: false` the
#    kubelet gives the pod its own 65536-id range (observed `0 2709127168
#    65536`): the job's processes run on the host as an unprivileged high uid,
#    while the volumes the pod mounts are idmapped so file ownership keeps
#    the SAME ids inside and outside the pod (a file the job writes as uid 0
#    is uid 0 on the work volume, as before) -- which is what keeps the
#    runner pod (uid 1000, no user namespace) and this pod able to exchange
#    files over the shared work volume exactly as they did. Verified live
#    before this change shipped: a runner-written 0644 file-command is
#    appendable by the job, a job-written file is readable and removable by
#    the runner, the read-only warm lower copies and uv reads the copy.
#    Requires kubelet UserNamespacesSupport (GA, on by default in the
#    installed k3s v1.36.2+k3s1), containerd 2.x (2.3.2 installed) and a
#    kernel with idmapped-mount support for the volumes' filesystems (ext4
#    here; kernel 7.0). `hostUsers` is a pod-spec key, assigned wholesale
#    by the hook's merge like every other pod-spec key here.
#
# 1. AppArmor. Pins the workflow pod to the `ci-runner-workflow` profile — see
#    ../apparmor/ci-runner-workflow for the full root cause. `type: Localhost`
#    fails pod admission on a node where the profile is absent, so a node that
#    skipped ../apparmor/install-apparmor-profile.sh surfaces as a pod that
#    will not start rather than as a silently unconfined job. `securityContext`
#    is assigned wholesale, not deep merged; that is safe only because the
#    hook-generated pod's own securityContext is `{}`. Anything else this file
#    needs to set at pod level must be added to that block.
#
# 2. The warm uv cache (tier 1 of the cache tiers; ../warm-cache/README.md).
#    The host volume /var/cache/ci-runner/warm — populated ONLY by the
#    ci-warm-cache CronJob — is mounted READ-ONLY into the job container.
#    uv refuses a read-only cache outright, and an unprivileged pod cannot
#    mount an overlay to give it a writable upper the way the deleted podman
#    lane did, so the job container's `postStart` copies the current
#    generation (a relative symlink inside the mount) into its own ephemeral
#    work volume, and UV_CACHE_DIR points uv at that copy. The kubelet does
#    not mark the container Running until postStart returns, and the hook
#    waits for Running before exec'ing any step, so the copy is complete
#    before the first step (verified live on this cluster 2026-08-23: a
#    12 s postStart held the pod Pending for 12 s). The copy is FAIL-SOFT in
#    every direction: no lower present (a node that never ran the installer)
#    or a copy error leaves no cache at all and uv resolves cold, exactly
#    today's behaviour; the script always exits 0 so a cache problem can
#    never fail a job. The copy is on the work volume so uv's hardlink
#    install into the job's .venv stays on one filesystem. Measured
#    2026-08-23 against the livespec lockfile: cold `uv sync` 7.9 s; copying
#    the 379 MB fleet-wide lower 0.8 s; warm sync from the copy 0.5 s.
#    Constraint this imposes on every `container:` image routed to this pool:
#    it must carry /bin/sh and cp (a postStart exec that cannot start kills
#    the container). Every fleet `container:` is the fabro sandbox image,
#    which does; a distroless job image would need its own template.
#    `--no-preserve=ownership` so the copy is owned by whatever uid the job
#    container runs as (root today) rather than by the populator's uid.
apiVersion: v1
kind: PodTemplate
spec:
  hostUsers: false
  securityContext:
    appArmorProfile:
      type: Localhost
      localhostProfile: ci-runner-workflow
  volumes:
    - name: warm-cache
      hostPath:
        path: /var/cache/ci-runner/warm
        # DirectoryOrCreate, not Directory: a node without the warm root
        # degrades to a cold cache (an empty mount), never to a pod that
        # cannot start.
        type: DirectoryOrCreate
  containers:
    - name: $job
      env:
        - name: UV_CACHE_DIR
          value: /__w/_warm/uv
      volumeMounts:
        - name: warm-cache
          mountPath: /var/cache/ci-runner/warm
          readOnly: true
      lifecycle:
        postStart:
          exec:
            command:
              - sh
              - -c
              - |
                src=/var/cache/ci-runner/warm/uv
                dst=/__w/_warm/uv
                if [ -d "$src" ]; then
                  mkdir -p "$dst"
                  if ! cp -rp --no-preserve=ownership "$src/." "$dst"; then
                    rm -rf "$dst"
                  fi
                fi
                exit 0
