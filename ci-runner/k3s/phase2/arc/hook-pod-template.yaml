# hook-pod-template.yaml — the ARC Kubernetes-mode hook's pod-spec extension.
#
# In `containerMode: kubernetes`, a job's `container:` image does NOT run in the
# runner pod. The runner's container hook (`/home/runner/k8s/index.js`) creates
# a SEPARATE "workflow" pod per job, and that pod's spec is built by the hook,
# not by the Helm values — which is why a securityContext set in
# `values-<repo>.yaml` reaches the runner pod only and leaves the pod the tests
# actually execute in with an EMPTY securityContext.
#
# `ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE` is the one supported seam. The hook
# reads this file with an untyped YAML load and merges its `spec` into the
# generated pod spec key by key (`mergePodSpecWithOptions`), so a field is
# passed through verbatim rather than being dropped by a typed deserializer.
# Merge semantics that this file depends on (hook source, packages/k8s/src/
# k8s/utils.ts): `volumes` is MERGED by name with the hook's own; a container
# named `$job` is merged INTO the hook-generated job container, where `env`
# and `volumeMounts` are merged by name and every other key (here
# `lifecycle`) is assigned; every other pod-spec key (here `securityContext`)
# is assigned WHOLESALE. Two keys this file deliberately does NOT set, for
# exactly that reason: `initContainers` (the hook's newer releases add their
# own `fs-init` init container, which a wholesale assignment would silently
# replace and break every job on the next image pull), and the job
# container's `command`/`image` (the hook owns them; image is refused).
#
# Three things are set here.
#
# 0. A USER NAMESPACE (`hostUsers: false`). The workflow pod's job container
#    runs the repo's `container:` image as its default user -- root, because
#    the fabro sandbox image keeps uv, CPython, mise, and cargo under /root --
#    and without this key that root was HOST root (`/proc/self/uid_map` read
#    `0 0 4294967295` inside a live workflow pod, 2026-08-23), violating the
#    host-requirements clause "the in-container root identity MUST map to a
#    non-root host identity" (livespec-s43svm.44). With `hostUsers: false` the
#    kubelet gives the pod its own 65536-id range (observed `0 2709127168
#    65536`): the job's processes run on the host as an unprivileged high uid,
#    while the volumes the pod mounts are idmapped so file ownership keeps
#    the SAME ids inside and outside the pod (a file the job writes as uid 0
#    is uid 0 on the work volume, as before) -- which is what keeps the
#    runner pod (uid 1000, no user namespace) and this pod able to exchange
#    files over the shared work volume exactly as they did. Verified live
#    before this change shipped: a runner-written 0644 file-command is
#    appendable by the job, a job-written file is readable and removable by
#    the runner, and (under the then-current postStart copy) the read-only
#    warm lower copied and uv read the copy.
#    Requires kubelet UserNamespacesSupport (GA, on by default in the
#    installed k3s v1.36.2+k3s1), containerd 2.x (2.3.2 installed) and a
#    kernel with idmapped-mount support for the volumes' filesystems (ext4
#    here; kernel 7.0). `hostUsers` is a pod-spec key, assigned wholesale
#    by the hook's merge like every other pod-spec key here.
#
# 1. AppArmor. Pins the workflow pod to the `ci-runner-workflow` profile — see
#    ../apparmor/ci-runner-workflow for the full root cause. `type: Localhost`
#    fails pod admission on a node where the profile is absent, so a node that
#    skipped ../apparmor/install-apparmor-profile.sh surfaces as a pod that
#    will not start rather than as a silently unconfined job. `securityContext`
#    is assigned wholesale, not deep merged; that is safe only because the
#    hook-generated pod's own securityContext is `{}`. Anything else this file
#    needs to set at pod level must be added to that block.
#
# 2. The warm uv cache (tier 1 of the cache tiers; ../warm-cache/README.md).
#    Two env vars. UV_CACHE_DIR points uv at /__w/_warm/uv, a directory
#    that ALREADY holds the current warm generation when this pod starts:
#    the local-path provisioner's `setup` script
#    (../local-path-provisioner/local-path-provisioner.yaml, ConfigMap
#    `local-path-config`) seeds it into the work volume while the volume is
#    being provisioned -- inside the provisioner's busybox helper pod, as
#    root, on the volume's parent mount; with WaitForFirstConsumer that is
#    after the runner pod is scheduled and before it starts, so the runner
#    pod's volume wait absorbs the ~2 s seed -- as HARDLINKS of the
#    generation's files. The warm root lives on the same filesystem as the
#    volumes (`/var/lib/rancher/k3s/storage/.warm`, a hidden sibling of the
#    pvc-* directories) for exactly that reason: link() across two bind
#    mounts is EXDEV, which is why no pod could ever do this itself and why
#    the earlier realization was a byte copy in this container's postStart.
#    The seed costs inode links, not bytes: measured on the live 1,388 MB /
#    159k-file generation, cp -al 2.3 s and 269 MB of metadata writes,
#    against 6.8 s and 2,153 MB for the copy on the same tree (livespec plan
#    `ci-runner-pod-lifecycle-reliability`, research/005) -- and the ~9 s
#    ContainerCreating hold the copy put on THIS container per start is
#    gone. Because the files are shared inodes, a job's uv must leave them
#    as found, and it does -- by uv's own write discipline (a new entry to
#    a temporary path, then rename; never a rewrite in place), NOT by
#    enforcement: this pod's volume is idmapped so its root is uid 0 there,
#    and the root-owned generation inodes ARE writable from a job. Owning
#    them as a uid no pod maps was tried on 2026-09-04 and broke every job
#    (uv's cache init writes CACHEDIR.TAG; the kernel refuses write-open,
#    unlink and rename-over on unmapped-owner inodes). The mechanical
#    closure the specification's "Runner-pool build cache tiers" clause
#    requires is an open maintainer decision (../warm-cache/README.md "The
#    hazard"), and ../isolation/cache-negative-tests.sh case 1 reports the
#    violation on its timer until it lands. The seed's DIRECTORIES are fresh
#    per-volume inodes opened to 0777 and uv's lock files are fresh
#    per-volume 0666 files, so a job's additions and its flocks stay in its
#    own volume. FAIL-SOFT by absence: a node with no
#    warm root, no published generation, or a seed that failed has NO
#    /__w/_warm/uv; uv creates a cold cache there and the job runs. There is
#    deliberately no fallback copy, here or in the provisioner -- a
#    per-start byte copy is the cost this replaced (../warm-cache/README.md
#    "Lesson"). This tier therefore mounts nothing from the host; the
#    postStart below serves the cargo and compilation tiers only and copies
#    no bytes for any tier.
#    UV_LINK_MODE=copy is the ENFORCED companion of the seed, not a lever:
#    uv's default link mode hardlinks cache files into the job's .venv, so
#    with a seeded cache a venv file would BE a generation inode, and a
#    test that rewrites an installed package in place would rewrite the
#    fleet-wide generation. Copy mode gives the venv private copies, so the
#    one place a job routinely writes installed files touches nothing
#    shared. Its cost is the venv's own bytes per job (livespec-lvtu's
#    acceptance run: the job wrote ~630 MB after the seed, checkout and
#    venv together).
#
# 3. The warm CARGO cache (the cargo half of the same tier; ../crates-proxy/),
#    HOST-SERVED rather than copied: the postStart probes the crates proxy
#    and, if it answers within 3 s, writes /.cargo/config.toml — the ROOT of
#    cargo's config hierarchy, so every cargo invocation in the job reads it
#    whatever its working directory, and a repository's own checked-in
#    [source] config still overrides it. Cargo's [source] tables are NOT
#    settable from the environment (cargo reference, config chapter), which
#    is why this is a file write and not an env entry above. ZERO bytes are
#    copied per start — cargo, unlike uv, can be pointed at a registry URL,
#    so this half never needed a lower in the volume at all. Fail-soft the
#    same way: no proxy (or a proxy not yet Ready) means no file, and cargo
#    fetches from crates.io directly, exactly today's behaviour. The proxy has
#    no write surface (non-GET refused), so the trust tiering holds without a
#    read-only mount. Verified live 2026-09-04, plan ci-runner-cache-tiers
#    research/005: Cargo.lock byte-identical, every locked crate served.
#
# 4. The fleet-wide KILL SWITCH. CI_CACHE_KILL_SWITCH on the $job container:
#    empty (default) enables every tier; `operator` makes the postStart turn
#    every tier off for every job — it removes the provisioner's warm uv seed
#    from this job's volume (a few hundred thousand unlinks of per-volume
#    links, never a write to a generation) so uv runs cold, and writes no
#    cargo config — with no deploy of any routed repository (converge this
#    ConfigMap, recycle idle runners). The cache-telemetry children of the
#    plan add the deterministic cold canary on the same seam and tag both on
#    every cache span.
#
# 5. The shared COMPILATION cache (B1 of the same plan; ../sccache/). The
#    pool PROVIDES sccache — the node-local binary under
#    /usr/local/lib/ci-runner-k3s/bin, mounted READ-ONLY at /opt/ci-runner/bin
#    — so no routed repository bumps its `container:` pin to get the tier. The
#    same postStart appends `[build] rustc-wrapper = /opt/ci-runner/bin/sccache`
#    and `incremental = false` (sccache cannot cache incremental compiles) to
#    /.cargo/config.toml, only when the binary is present AND the redis
#    endpoint answers a TCP probe; the SCCACHE_REDIS_* env below points sccache
#    at the host redis as the unauthenticated READ-ONLY user, with
#    SCCACHE_REDIS_RW_MODE=READ_ONLY so it never attempts a write (the server
#    refuses one anyway: the ACL is the trust boundary, not this env). A job's
#    dependency compiles are served from what the populator built for the
#    default branch; a job's own output is never written back. FAIL-SOFT IS
#    THE PROBE, not sccache: sccache 0.17 refuses to start its server when
#    the backend is unreachable, and cargo then fails (measured 2026-09-04:
#    exit 101 against a dead endpoint) — so the stanza is written only after
#    redis answered, and a job whose redis dies AFTER its sccache server
#    started sees cache errors counted as misses (sccache's own stats
#    contract), not failures. Scaling the redis Deployment to 0 is therefore
#    safe for new jobs and the kill switch covers the rest. Two more facts
#    the populator's header explains: sccache hashes every CARGO_* env var
#    into the key, so this template sets NONE and carries `incremental` in
#    the config file; and it hashes absolute paths, so the populator builds
#    at the job's own checkout path and cargo home.
#    Constraint items 3-5 impose on every `container:` image routed to this
#    pool: it must carry /bin/sh (a postStart exec that cannot start kills
#    the container). Every fleet `container:` is the fabro sandbox image,
#    which does; a distroless job image would need its own template.
apiVersion: v1
kind: PodTemplate
spec:
  hostUsers: false
  securityContext:
    appArmorProfile:
      type: Localhost
      localhostProfile: ci-runner-workflow
  volumes:
    - name: ci-runner-bin
      hostPath:
        # The pool-provided binaries (today: sccache, from
        # ../sccache/install-sccache-binary.sh). DirectoryOrCreate: a node
        # without them degrades to no compilation cache, never to a pod that
        # cannot start.
        path: /usr/local/lib/ci-runner-k3s/bin
        type: DirectoryOrCreate
  containers:
    - name: $job
      env:
        # The work volume's hardlink-seeded warm uv cache (header item 2).
        # The path exists only when the provisioner's setup script seeded
        # it; otherwise uv creates a cold cache there.
        - name: UV_CACHE_DIR
          value: /__w/_warm/uv
        # Copy, never hardlink, from that cache into the job's .venv: the
        # cache's files are the fleet-wide generation's inodes, and a
        # hardlinked venv file would be one of them -- a copied one is the
        # job's own (header item 2). Cost: the venv's own bytes per job.
        - name: UV_LINK_MODE
          value: copy
        # Fleet-wide kill switch (header item 4): "" = tiers on; "operator" = off.
        - name: CI_CACHE_KILL_SWITCH
          value: ""
        # Compilation cache (header item 5): the host redis, as the
        # unauthenticated read-only user, and never a write attempt.
        - name: SCCACHE_REDIS_ENDPOINT
          value: redis://sccache-redis.ci-sccache.svc.cluster.local:6379
        - name: SCCACHE_REDIS_RW_MODE
          value: READ_ONLY
      volumeMounts:
        - name: ci-runner-bin
          mountPath: /opt/ci-runner/bin
          readOnly: true
      lifecycle:
        postStart:
          exec:
            command:
              - sh
              - -c
              - |
                # Every path below is fail-soft: this script always exits 0.
                # No tier copies bytes here: the warm uv cache is already in
                # the volume as the provisioner's hardlink seed (header item 2).
                if [ -n "${CI_CACHE_KILL_SWITCH:-}" ]; then
                  # Header item 4: the switch turns the uv tier off by removing
                  # this volume's seed (per-volume links; the generation is
                  # untouched) and the cargo/compilation tiers off by writing
                  # nothing.
                  rm -rf /__w/_warm/uv 2>/dev/null
                  exit 0
                fi
                # Tiers: warm cargo cache (header item 3) and compilation cache
                # (header item 5) — one /.cargo/config.toml, each stanza only
                # if its backend answers, and only if the image carries no
                # /.cargo/config.toml of its own.
                proxy=http://crates-proxy.ci-crates-proxy.svc.cluster.local:3080
                redis_host=sccache-redis.ci-sccache.svc.cluster.local
                if [ ! -e /.cargo/config.toml ] && mkdir -p /.cargo 2>/dev/null; then
                  tmp=/.cargo/.config.toml.tmp
                  : > "$tmp"
                  if command -v curl >/dev/null 2>&1 \
                     && curl -fsS --max-time 3 "$proxy/index/config.json" >/dev/null 2>&1; then
                    printf '%s\n' \
                      '# crates.io served from the host-local crates proxy; Cargo.lock is unaffected.' \
                      '[source.crates-io]' \
                      'replace-with = "ci-runner-pool"' \
                      '' \
                      '[source.ci-runner-pool]' \
                      "registry = \"sparse+$proxy/index/\"" \
                      '' >> "$tmp"
                  fi
                  if [ -x /opt/ci-runner/bin/sccache ] \
                     && command -v bash >/dev/null 2>&1 \
                     && timeout 2 bash -c "exec 3<>/dev/tcp/$redis_host/6379" >/dev/null 2>&1; then
                    printf '%s\n' \
                      '# Dependency compiles served from the host-shared sccache (read-only for jobs).' \
                      '[build]' \
                      'rustc-wrapper = "/opt/ci-runner/bin/sccache"' \
                      'incremental = false' \
                      '' >> "$tmp"
                  fi
                  if [ -s "$tmp" ]; then
                    { printf '%s\n' \
                        '# Written by the runner pool (ci-runner/k3s/phase2/arc/hook-pod-template.yaml).' \
                        ''; cat "$tmp"; } > /.cargo/config.toml || rm -f /.cargo/config.toml
                  fi
                  rm -f "$tmp"
                fi
                exit 0
