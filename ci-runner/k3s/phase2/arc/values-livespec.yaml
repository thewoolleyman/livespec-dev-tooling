# values-livespec.yaml — ONE WORKED EXAMPLE of the per-repository
# AutoscalingRunnerSet pattern this design introduces, narrowing phase
# 1's original account-root `githubConfigUrl` (the since-retired
# ../../arc/values.yaml, livespec-s43svm.28:
# "https://github.com/thewoolleyman") to exactly the repo scope this
# fleet REQUIRES, not merely prefers.
#
# CORRECTNESS, not just design preference: `thewoolleyman` is a
# personal GitHub User account, not an Organization — confirmed live
# (livespec-s43svm.14, 2026-08-16: the account-root URL parsed to
# GitHubScopeOrganization regardless, per ARC's own URL parser
# (github/actions/actions.go in actions/actions-runner-controller,
# which recognizes only Enterprise/Organization/Repository — there is
# no User scope), and 404'd calling POST /orgs/thewoolleyman/... since
# no such org exists). GitHub's self-hosted-runner model has EXACTLY
# three scopes, and a personal account structurally has access to only
# ONE of them: repository. There is no account-wide or "user-level"
# self-hosted runner pool at all — see README.md "Personal account:
# repository is the only valid scope" for the full implication this has
# for `.16`'s per-repo cutover shape.
#
# Independently, ARC's maxRunners is also the ONE place the doubled-
# logical-ceiling half of the admission formula is enforced as a hard
# cap Kueue cannot be configured to exceed, and a per-repo
# runnerScaleSetName is what lets a workflow's `runs-on:` route to ONE
# repo's own capacity — this was this design's ORIGINAL rationale for
# per-repo scoping, and it still holds; it turned out to also be the
# only structurally valid choice.
#
# For every other fleet repository, copy this file to
# values-<repo>.yaml and replace every <repo>/livespec occurrence with
# that repo's own values — see any sibling ../kueue/cluster-queue-*.yaml
# for the paired ClusterQueue shape and README.md "Deriving a new
# repository's ClusterQueue" for the exact steps. The ClusterQueue's
# nominalQuota is a DIFFERENT number from this file's maxRunners — a
# different term of the same min(); see README.md "Two enforcement
# points, two DIFFERENT numbers" and ../kueue/DERIVATION.md.
githubConfigUrl: "https://github.com/thewoolleyman/livespec"
githubConfigSecret: arc-github-app-installation  # same secret as phase 1 — see ../../README.md "Credential separation"

runnerScaleSetName: "livespec-local-ci-k3s"

containerMode:
  type: "kubernetes"
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: "local-path"
    resources:
      requests:
        storage: 5Gi

template:
  metadata:
    labels:
      # Routes every runner pod this scale set creates through Kueue's
      # per-repo LocalQueue (../kueue/cluster-queue-livespec.yaml) rather
      # than being admitted directly by the Kubernetes scheduler — this
      # label is what makes ARC's pod creation Kueue-gated at all.
      kueue.x-k8s.io/queue-name: livespec-lq
  spec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    volumes:
      # Carries ../arc/hook-pod-template.yaml into the runner pod so the
      # container hook can read it. Additive: the chart appends its own `work`
      # volume for kubernetes mode, and declaring this one does not displace it.
      - name: hook-pod-template
        configMap:
          name: arc-hook-pod-template
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
          # THE WORKFLOW-POD FIX -- see values-livespec-overseer.yaml for the
          # full root cause. In kubernetes container mode the job's `container:`
          # image runs in a SEPARATE pod the hook creates, whose securityContext
          # is empty and which nothing else in this values file reaches. This env
          # var is the hook's one supported seam for extending that pod's spec;
          # it pins the pod to the node-loaded `ci-runner-workflow` AppArmor
          # profile (../apparmor/ci-runner-workflow).
          - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
            value: /home/runner/hook-template/hook-pod-template.yaml
        volumeMounts:
          - name: hook-pod-template
            mountPath: /home/runner/hook-template
            readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        resources:
          # Exactly ONE churn-slot per runner pod — this is what makes
          # the extended resource (../node-extended-resource/) a real
          # per-pod admission constraint rather than a label. requests
          # == limits: churn-slot is a COUNTING resource (like a device),
          # not a compressible one, so there is no meaningful "burst"
          # value distinct from the reservation.
          requests:
            ci-runner.io/churn-slot: "1"
          limits:
            ci-runner.io/churn-slot: "1"

# This repo's per-repository ceiling term of the admission formula
# (`doubled repository logical ceiling`). It is NOT the same number as the
# `livespec-cq` ClusterQueue's nominalQuota, which is this repo's share of the
# host's finite churn-slot capacity -- a different term of the same min().
# See README.md "Two enforcement points, two DIFFERENT numbers" and
# ../kueue/DERIVATION.md; the relation to hold is nominalQuota <= maxRunners.
#
# The value below is this repo's podman-era demand weight (75), inherited as a
# proxy because nobody has measured its actual matrix width. Harmless at the
# current capacity (C=16), where no repo can approach it; re-derive from a real
# matrix-width measurement before raising capacity far enough for it to bind.
# See ../kueue/DERIVATION.md "Observation: ARC maxRunners still carries the
# podman-era numbers".
minRunners: 0
maxRunners: 36
