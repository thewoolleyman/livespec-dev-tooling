# values-EXAMPLE-repo.yaml — TEMPLATE, not applied as-is. See
# values-livespec.yaml for the fully-worked example and its comments;
# copy this file to values-<repo>.yaml and replace every <PLACEHOLDER>:
#   <REPO>             — the repo's short name
#   <DOUBLED_CEILING>  — that repo's own matrix width, doubled. NOT the
#                        same number as its
#                        ../kueue/cluster-queue-<repo>.yaml nominalQuota,
#                        which is its share of the host's finite
#                        churn-slot capacity — a different term of the
#                        same min(). See ../kueue/DERIVATION.md.
githubConfigUrl: "https://github.com/thewoolleyman/<REPO>"
githubConfigSecret: arc-github-app-installation

runnerScaleSetName: "<REPO>-local-ci-k3s"

containerMode:
  type: "kubernetes"
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: "local-path"
    resources:
      requests:
        storage: 5Gi

template:
  metadata:
    labels:
      kueue.x-k8s.io/queue-name: <REPO>-lq
  spec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    volumes:
      # Carries ../arc/hook-pod-template.yaml into the runner pod so the
      # container hook can read it. Additive: the chart appends its own `work`
      # volume for kubernetes mode, and declaring this one does not displace it.
      - name: hook-pod-template
        configMap:
          name: arc-hook-pod-template
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
          # THE WORKFLOW-POD FIX -- see values-livespec-overseer.yaml for the
          # full root cause. In kubernetes container mode the job's `container:`
          # image runs in a SEPARATE pod the hook creates, whose securityContext
          # is empty and which nothing else in this values file reaches. This env
          # var is the hook's one supported seam for extending that pod's spec;
          # it pins the pod to the node-loaded `ci-runner-workflow` AppArmor
          # profile (../apparmor/ci-runner-workflow).
          - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
            value: /home/runner/hook-template/hook-pod-template.yaml
        volumeMounts:
          - name: hook-pod-template
            mountPath: /home/runner/hook-template
            readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            ci-runner.io/churn-slot: "1"
          limits:
            ci-runner.io/churn-slot: "1"

minRunners: 0
maxRunners: <DOUBLED_CEILING>
