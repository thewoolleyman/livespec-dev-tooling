# values-livespec-console-beads-fabro.yaml — livespec-s43svm.16's chosen
# first NON-GATING cutover lane.
#
# Repo selection rationale (livespec-s43svm.16, 2026-08-16): every fleet
# repository carries continuous automated PR traffic, so "non-gating" here
# means STRUCTURAL, not low-traffic — no other fleet repo's CI or merge
# path depends on this repo's CI passing (unlike livespec-dev-tooling,
# consumed as the enforcement-suite pin by every sibling, or livespec-runtime,
# consumed as a library). livespec-console-beads-fabro is a standalone
# console app; nothing in the fleet depends on it. It is also the SMALLEST
# repo by measured slot width (see nominalQuota note below), so it doubles
# as the lowest-blast-radius choice by capacity too.
#
# IMPORTANT CORRECTION to this design's own worked example
# (values-livespec.yaml): that file's "18 measured slots * 2 = 36"
# doubled-ceiling comment is STALE. The live poweredge-xubuntu
# ci-runner-supervisor unit (systemctl cat ci-runner-supervisor,
# read 2026-08-16) currently runs:
#
#   --repos "thewoolleyman/livespec:75 thewoolleyman/livespec-dev-tooling:63 \
#     thewoolleyman/livespec-driver-codex:67 thewoolleyman/livespec-driver-claude:66 \
#     thewoolleyman/livespec-orchestrator-git-jsonl:66 thewoolleyman/livespec-overseer:65 \
#     thewoolleyman/livespec-runtime:64 thewoolleyman/livespec-console-beads-fabro:16"
#
# Those eight per-repo slot counts SUM TO EXACTLY 482 (75+63+67+66+66+65+64+16),
# the physical host-wide cap — i.e. the live config apportions the FIXED
# 482 budget across repos by observed demand, it does NOT give every repo
# an independent "doubled logical ceiling" that could itself sum past 482.
# RECONCILED 2026-08-19 by livespec-s43svm.15 — see ../kueue/DERIVATION.md.
# Those eight values are DEMAND WEIGHTS, and each repo's ClusterQueue
# nominalQuota is now its largest-remainder share of the host's registered
# churn-slot capacity, apportioned by them. This repo's weight is 16, the
# smallest in the fleet, which at the current capacity C=16 gives it a
# nominalQuota of 1 — a guaranteed floor, not a cap: cohort borrowing lets
# it burst well above 1 whenever its peers are idle.
githubConfigUrl: "https://github.com/thewoolleyman/livespec-console-beads-fabro"
githubConfigSecret: arc-github-app-installation  # same secret as phase 1 — see ../../README.md "Credential separation"

# SHORT NAME, deliberately: livespec-s43svm.22 root-caused a hard Kubernetes
# constraint via actions/actions-runner-controller#4368 (closed won't-fix) --
# the runner-container-hooks k8s hook truncates the per-job "workflow" pod
# name at 63 characters total, and does so on the FULL runner-pod name
# (`<scaleset>-<ephemeralrunnerset-suffix>-runner-<pod-suffix>`), not just the
# scale-set portion. A scale-set name over ~35 characters truncates away the
# per-runner unique suffix entirely, so every CONCURRENTLY running runner
# produces the byte-identical workflow-pod name and every job but the first
# fails with `pods "..." already exists` -- deterministic under any 2+-job
# matrix, invisible to a single-job proof-of-life dispatch. The original
# `livespec-console-beads-fabro-local-ci-k3s` (41 chars) hit this live on the
# first real-traffic cutover attempt (PR #662, 2026-08-17). Fleet-wide naming
# convention (maintainer-directed 2026-08-17): drop the "-local-ci-k3s" suffix
# to "-k3s" and keep every scale-set name <=30 characters total (5-char margin
# below the hard 35-char boundary); truncate the repo-name portion at a hyphen
# boundary, mechanically, rather than inventing a per-repo abbreviation (this
# fleet already bans ambiguous hand-picked abbreviations elsewhere -- see
# livespec/AGENTS.md "the bare word `beads-fabro` is BANNED"). This repo's
# name (29 chars alone) does not fit the 26-char budget after "-k3s", so it is
# truncated at the last hyphen that fits: "livespec-console-beads".
runnerScaleSetName: "livespec-console-beads-k3s"

containerMode:
  type: "kubernetes"
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: "local-path"
    resources:
      requests:
        storage: 5Gi

template:
  metadata:
    labels:
      kueue.x-k8s.io/queue-name: livespec-console-beads-fabro-lq
  spec:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
    volumes:
      # Carries ../arc/hook-pod-template.yaml into the runner pod so the
      # container hook can read it. Additive: the chart appends its own `work`
      # volume for kubernetes mode, and declaring this one does not displace it.
      - name: hook-pod-template
        configMap:
          name: arc-hook-pod-template
    containers:
      - name: runner
        # Pinned tag + digest (livespec-s43svm handoff finding, 2026-08-25;
        # was `latest`; see the k3s README's "Pinned versions — nothing floats
        # `latest`").
        # The digest is the image the pool was verified on: its container
        # hook has no fs-init init container, the premise of the
        # warm-cache postStart choice (see ../hook-pod-template.yaml or
        # the phase2 copy). Bump BOTH tag and digest together, re-read the
        # hook's initContainers behaviour, then helm upgrade + recycle.
        image: ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
        command: ["/home/runner/run.sh"]
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
          # THE WORKFLOW-POD FIX -- see values-livespec-overseer.yaml for the
          # full root cause. In kubernetes container mode the job's `container:`
          # image runs in a SEPARATE pod the hook creates, whose securityContext
          # is empty and which nothing else in this values file reaches. This env
          # var is the hook's one supported seam for extending that pod's spec;
          # it pins the pod to the node-loaded `ci-runner-workflow` AppArmor
          # profile (../apparmor/ci-runner-workflow).
          - name: ACTIONS_RUNNER_CONTAINER_HOOK_TEMPLATE
            value: /home/runner/hook-template/hook-pod-template.yaml
        volumeMounts:
          - name: hook-pod-template
            mountPath: /home/runner/hook-template
            readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            ci-runner.io/churn-slot: "1"
          limits:
            ci-runner.io/churn-slot: "1"

# This repo's per-repository ceiling term of the admission formula
# (`doubled repository logical ceiling`). It is NOT the same number as the
# `livespec-console-beads-fabro-cq` ClusterQueue's nominalQuota, which is this repo's share of the
# host's finite churn-slot capacity -- a different term of the same min().
# See README.md "Two enforcement points, two DIFFERENT numbers" and
# ../kueue/DERIVATION.md; the relation to hold is nominalQuota <= maxRunners.
#
# The value below is this repo's podman-era demand weight (16), inherited as a
# proxy because nobody has measured its actual matrix width. Harmless at the
# current capacity (C=16), where no repo can approach it; re-derive from a real
# matrix-width measurement before raising capacity far enough for it to bind.
# See ../kueue/DERIVATION.md "Observation: ARC maxRunners still carries the
# podman-era numbers".
minRunners: 0
maxRunners: 16
