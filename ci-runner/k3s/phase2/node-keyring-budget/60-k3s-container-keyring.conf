# 60-k3s-container-keyring.conf — the per-user kernel keyring quota for the
# k3s CI runner pool, shipped as a /etc/sysctl.d/ drop-in by
# ./install-keyring-sysctl.sh (applied by systemd-sysctl at every boot).
#
# WHY: every container start allocates a session keyring against the
# invoking uid — under k3s that is containerd/runc as uid 0, for every
# container on the node (runner pods, workflow pods, provisioner helper
# pods, system pods). The kernel default (maxkeys=200) is a per-uid ceiling,
# and it was exhausted on this host on 2026-08-13 at 178/200 keys by the
# combined concurrency of just two repositories, failing a real job with
# "create keyring ...: Disk quota exceeded" (misleading text — the keyring
# quota, not disk space). Like the inotify instance budget
# (../node-inotify-budget/), this is a kernel limit that scales with the
# pool's peak concurrent containers, and at C = 64 the node runs
# ~2C + helpers + system ≈ 165 pods (../kueue/DERIVATION.md "The
# pod-capacity constraint") — well past the default.
#
# HISTORY: the value was first applied on 2026-08-13 for the pool's earlier
# runner lane and survived on the host as an untracked sysctl drop-in after
# that lane's source was deleted. The 2026-09-02 gitops audit (livespec plan
# ci-runner-pod-lifecycle-reliability) found it with no git source; it is
# shipped here under its current name, and the installer removes the old
# untracked file it replaces.
#
# SIZING: 2000 keys gives ~10x the pod cap for keyrings that outlive their
# container briefly, retries, and per-container extras. maxbytes scales with
# maxkeys at the kernel default's own ratio (20000/200 = 100 bytes/key) —
# a session keyring's payload is tiny, so this is generous, not tight.
kernel.keys.maxkeys = 2000
kernel.keys.maxbytes = 200000
