# workload-arch.conf — the one declared per-class architecture list
# (plan homelab-k8s-worker-nodes, livespec-dev-tooling-ko26ez.6).
#
# Every workload class the fleet schedules selects nodes by a
# kubernetes.io/arch value its workload images publish, read from THIS file
# and never from a per-host value, so a node whose architecture a class's
# images do not publish (an arm64 homelab worker, today) never receives that
# class. ../arc/render-arch-overlay.sh renders a line into the selection a
# scale set, the gate job or a factory provider carries.
#
# Format, one entry per line (# starts a comment):
#   <kind> <name> <arches> <what the other architectures lack>
# kind: `release` (an ARC scale-set release, as converge-ci-stack.sh names it),
# `gate` or `factory`; arches: comma-separated kubernetes.io/arch values.
#
# Today every class publishes amd64 only, so every entry is amd64 and this
# file moves no pod. A class becomes arm64-eligible by adding arm64 here in the
# same change that makes its images publish it.

release fabro-k3s amd64 arm64: the fabro fork's Rust CI images are built for amd64 only
release livespec-local-ci-k3s amd64 arm64: the repository's CI container pin (python-v1.183.0) is amd64-only; python-v1.183.1 and later are multi-arch
release livespec-console-beads-k3s amd64 arm64: the repository's CI container pin is an amd64-only sandbox tag
release livespec-orchestrator-git-k3s amd64 arm64: the repository's CI container pin is an amd64-only sandbox tag
release livespec-orchestrator-k3s amd64 arm64: the repository's CI container pin is an amd64-only sandbox tag
release livespec-dev-tooling-k3s amd64 arm64: the python-rust and fuzz images are amd64-only (check-python, on the multi-arch python-v1.183.1 pin, reaches arm64 through livespec-dev-tooling-arm64-k3s)
release livespec-dev-master-k3s amd64 arm64: the python-rust and fuzz images are amd64-only
release livespec-driver-claude-k3s amd64 arm64: the repository's CI container pin is an amd64-only sandbox tag
release livespec-driver-codex-k3s amd64 arm64: the repository's CI container pin is an amd64-only sandbox tag
release livespec-driver-pi-k3s amd64 arm64: the repository's CI container pin is an amd64-only sandbox tag
release livespec-overseer-k3s amd64 arm64: the repository's CI container pin is an amd64-only sandbox tag
release livespec-runtime-k3s amd64 arm64: the repository's CI container pin is an amd64-only sandbox tag
release livespec-dev-tooling-arm64-k3s arm64 amd64: an arm64-only set; its jobs' image is the multi-arch python tag and amd64 jobs use livespec-dev-tooling-k3s
release poweredge-xubuntu-k3s amd64 arm64: a host-unique amd64 set; its jobs use the amd64-only sandbox tags
gate gate amd64 arm64: the gate image is the gated repository's CI container pin, amd64-only today
# A factory line names ONE image and its ONE architecture: a provider renders it
# as a single node_selector value. An arm64 agent layer is its own line.
factory python-agent amd64 arm64: the python-agent and python-rust-agent layers are amd64-only (livespec-dev-tooling-a3brdf)
