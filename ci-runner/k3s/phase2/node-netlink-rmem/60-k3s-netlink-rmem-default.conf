# 60-k3s-netlink-rmem-default.conf — the default socket RECEIVE buffer on
# every k3s CI pool node, raised so flannel's vxlan link-subscription netlink
# socket does not overrun under interface churn. Installed to /etc/sysctl.d/
# by the `node_sysctl` Ansible role (ansible/ci-pool.yml); systemd-sysctl
# re-applies it at every boot.
#
# WHY: k3s v1.36.2+k3s1 bundles flannel v0.28.4, whose vxlan backend
# (pkg/backend/vxlan/vxlan_network.go, watchVXLANDevice) subscribes to link
# updates with the plain netlink.LinkSubscribe of vishvananda/netlink v1.3.1.
# That call passes rcvbuf=0, so the socket is never given SO_RCVBUF and the
# kernel sizes it from net.core.rmem_default (212992 bytes on these hosts;
# `ss -f netlink -a -p -m` read every k3s-server rtnl socket at rb212992 on
# 2026-11-02). A burst of veth create/delete events overruns that buffer, the
# receive fails with ENOBUFS, the library closes the update channel without a
# callback, and flannel's single-value receive then dereferences a zero
# LinkUpdate at vxlan_network.go:138. The k3s process panics and the API is
# gone until systemd restarts it.
#
# INCIDENTS: 2026-09-06 06:07:03Z at churn-slot 64 (livespec-n5eudb, which
# recorded this buffer as rung 4 of its mitigation ladder, "held in reserve
# until the crash recurs at cap 32"), and 2026-11-02 13:01:13Z at churn-slot
# 32 (bd-ib-v7h3az): ~150 veth transitions on poweredge-xubuntu between 12:57Z
# and 13:01Z with 45 ARC, 4 factory and 1 gates pods running. The churn-slot
# cap counts ARC runner pods only, so it does not bound this churn.
#
# VALUE: 4194304 bytes (4 MiB), the hosts' existing net.core.rmem_max — about
# 20x the old default. It raises the DEFAULT only; nothing here lifts the
# ceiling an application may request. It is host-wide: every socket that does
# not size its own buffer (netlink, UDP, unix datagram) may now queue up to 4
# MiB before dropping, which costs memory only while data is actually queued.
#
# EFFECT NEEDS A RESTART: a socket's buffer is fixed when it is created, so
# applying this file changes nothing for the already-running k3s. It takes
# effect at the next k3s start on each node.
#
# UPSTREAM: flannel-io/flannel#2549 (the panic). The durable fix is the
# two-value receive in watchVXLANDevice (return when the channel closes); a
# nil guard alone busy-loops on the closed channel.
net.core.rmem_default = 4194304
