# 10-requires-storage-mounts.conf — k3s MUST NOT start unless the storage
# tiers it writes to are mounted. Installed to
# /etc/systemd/system/k3s.service.d/ by storage-layout/install-storage-layout.sh
# (livespec-dev-tooling ci-runner/k3s/phase2/).
#
# WHY: containerd's store and every runner work volume live on dedicated
# tiers reached through two bind mounts. Every path exists whether or not
# the binds are mounted, so a k3s that starts with a bind missing runs the
# whole pool's churn on the root filesystem — silently, until `/` fills.
# RequiresMountsFor= turns that into a k3s that refuses to start, which the
# reconstruct chain reports (every After=k3s oneshot fails by dependency).
# First kept by hand on poweredge-xubuntu on 2026-09-04 during the NVMe
# attempt; from git since livespec-el5y.
#
# The datastore's tmpfs mount is required by the SEPARATE drop-in
# ../datastore-tmpfs/20-requires-datastore-mount.conf, installed only where
# the datastore is made volatile.
[Unit]
RequiresMountsFor=/var/lib/rancher/k3s/agent/containerd /var/lib/rancher/k3s/storage
