# gate-mirror.yaml — the in-cluster READ-ONLY git daemon that serves the bare
# gate mirror (./ensure-gate-mirror.sh) to gate pods, and the CronJob that
# sweeps `refs/gates/*` (./prune-gate-refs.sh). Applied by
# ./converge-gate-mirror.sh, which ALSO generates the `gate-mirror-prune`
# ConfigMap from the sweep script on disk — that ConfigMap is deliberately a
# placeholder here, because a `kubectl apply -f` of this file alone must leave
# the CronJob unable to start rather than running a stale copy of the sweep.
#
# WHY A DAEMON AT ALL. The mirror is a directory on ONE node's ci-cache tier,
# and a gate Job is admitted onto the OTHER pool node (../kueue/DERIVATION.md
# "The gates quota on gmktec-xubuntu"). A hostPath cannot cross that gap. A
# ClusterIP Service in front of `git daemon` can: any pod on any node fetches
# `git://gate-mirror.gates.svc.cluster.local/gate-mirror.git`, and the mirror
# stays on the tier it belongs on.
#
# READ-ONLY, THREE WAYS, because this daemon is reachable from every pod in the
# cluster including workflow pods, and a WRITABLE one would let any of them
# forge the tree a gate is about to bless:
#   1. `--disable=receive-pack` / `--disable=upload-archive` — restated although
#      both are already git-daemon's defaults, so the posture is visible in the
#      object rather than only in git's documentation. Same reasoning as
#      ../kueue/cluster-queue-gates.yaml restating its three `Never`s.
#   2. `--forbid-override=` for the same two, which is the half that is NOT a
#      default: without it a `daemon.receivepack = true` written into the
#      mirror's own config would turn writes back on, from inside the very
#      directory the SSH receive path can write.
#   3. the mount itself is `readOnly: true`, so even a git that ignored both
#      flags would fail on the kernel.
#
# EXPORT-ALL IS OFF: no `--export-all` flag, so git-daemon serves only a
# repository carrying a `git-daemon-export-ok` marker, and the trailing
# directory argument restricts it further to this one path. ./ensure-gate-mirror.sh
# writes that marker. A second repository appearing beside the mirror on the
# tier is therefore not served by accident.
---
apiVersion: v1
kind: Namespace
metadata:
  name: gates
  labels:
    # Byte-identical to ../kueue/cluster-queue-gates.yaml's declaration of this
    # same Namespace, on purpose: both files are applied by the boot converge
    # and a different label here would make the two applies flip it back and
    # forth on every run. That file's header already records that re-declaring
    # the namespace in a sibling gates manifest is harmless.
    app.kubernetes.io/part-of: livespec-ci-gates
---
# The daemon and the sweep both read a mirror OWNED BY THE RECEIVE PATH's
# account (./README.md "The receive path"), while the pods run as their image's
# uid. Git refuses to operate on a repository owned by another user — "detected
# dubious ownership" — and `safe.directory` is honoured ONLY from a system or
# global config file, never from `-c` on the command line or from the
# repository's own config. So it is mounted as a global config file and pointed
# at with GIT_CONFIG_GLOBAL. This decouples the pods from whatever uid the
# receive account happens to have on the node, which is a host fact this
# repository does not get to pin.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-mirror-gitconfig
  namespace: gates
data:
  gitconfig: |
    [safe]
    	directory = /srv/gate-mirror.git
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gate-mirror-prune
  namespace: gates
data:
  prune-gate-refs.sh: |
    # REPLACED AT APPLY TIME by converge-gate-mirror.sh with the contents of
    # ./prune-gate-refs.sh (kubectl create configmap --from-file). This
    # placeholder exists so `kubectl apply -f` of this file alone leaves the
    # CronJob unable to start rather than running a stale sweep.
    echo "gate-mirror-prune ConfigMap not converged by converge-gate-mirror.sh" >&2
    exit 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gate-mirror-daemon
  namespace: gates
  labels:
    app.kubernetes.io/name: gate-mirror-daemon
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gate-mirror-daemon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gate-mirror-daemon
    spec:
      # The node whose ci-cache tier actually carries the mirror. Same key and
      # same reasoning as the other hostPath singletons (../warm-cache/,
      # ../sccache/, ../crates-proxy/): an unpinned pod that lands elsewhere
      # mounts a different node's filesystem and serves an empty repository
      # while reporting Ready. NOT `k3s-role=arc-runner-host`, which every pool
      # node carries including the one gates run on.
      nodeSelector:
        ci-runner.io/cache-tier-carrier: "true"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: daemon
          # The same tag ../warm-cache/warm-cache-cronjob.yaml pins, chosen so
          # this daemon adds NO image pull on the node that already holds it.
          # git lives in the base layer, so any layer of this image would do;
          # tracking the warm cache's tag is what keeps it resident.
          image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-rust-fuzz-v1.46.0
          imagePullPolicy: IfNotPresent
          command: ["git"]
          args:
            - daemon
            - --verbose
            - --reuseaddr
            - --listen=0.0.0.0
            - --port=9418
            # The repository is served as `/gate-mirror.git` under this base
            # path. No --export-all (header); the trailing argument is the one
            # directory this daemon will consider at all.
            - --base-path=/srv
            - --disable=receive-pack
            - --disable=upload-archive
            - --forbid-override=receive-pack
            - --forbid-override=upload-archive
            - /srv/gate-mirror.git
          env:
            - name: GIT_CONFIG_GLOBAL
              value: /gitconfig/gitconfig
          ports:
            - name: git
              containerPort: 9418
          readinessProbe:
            tcpSocket:
              port: 9418
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              # A fetch of one tree is cheap and bounded; this ceiling exists
              # so a pathological client cannot make the daemon compete with
              # the jobs it shares the node with.
              cpu: "2"
              memory: "1Gi"
          volumeMounts:
            - name: mirror
              mountPath: /srv/gate-mirror.git
              readOnly: true
            - name: gitconfig
              mountPath: /gitconfig
              readOnly: true
      volumes:
        - name: mirror
          hostPath:
            path: /var/cache/ci-runner/gate-mirror.git
            # `Directory`, NOT `DirectoryOrCreate`: the mirror is created by
            # ./ensure-gate-mirror.sh, and an auto-created empty directory is
            # not a git repository — the daemon would come up Ready and serve
            # nothing, which is the failure that looks like success. Refusing
            # to start until the converge has run is the honest behaviour.
            type: Directory
        - name: gitconfig
          configMap:
            name: gate-mirror-gitconfig
---
apiVersion: v1
kind: Service
metadata:
  name: gate-mirror
  namespace: gates
spec:
  # ClusterIP, deliberately: a gate pod on the other node reaches this through
  # the cluster network. No hostPort and no NodePort — the mirror is served to
  # POD workloads, and the node-side writer already has the filesystem.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gate-mirror-daemon
  ports:
    - name: git
      port: 9418
      targetPort: 9418
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gate-mirror-prune
  namespace: gates
spec:
  # Hourly. The cutoff is a DAY (./prune-gate-refs.sh), so the sweep's period
  # only bounds how long a ref outlives it; hourly keeps that overshoot under
  # an hour at a cost of one short-lived pod per hour.
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: gate-mirror-prune
        spec:
          # Same pin as the daemon, for the same reason, plus one more: this
          # pod mounts the mirror READ-WRITE, and a run on the wrong node would
          # sweep an empty directory and report a clean zero.
          nodeSelector:
            ci-runner.io/cache-tier-carrier: "true"
          restartPolicy: Never
          # No Kueue queue-name label and no ci-runner.io/churn-slot request:
          # this is not a CI job and must never occupy a runner slot. It is
          # also not a GATE and so carries no gates-lq label — admission
          # latency on a janitor would only delay the sweep behind the very
          # gates it cleans up after.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune
              image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-rust-fuzz-v1.46.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/prune-gate-refs.sh", "/srv/gate-mirror.git"]
              env:
                - name: GIT_CONFIG_GLOBAL
                  value: /gitconfig/gitconfig
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "50m"
                  memory: "64Mi"
                limits:
                  cpu: "1"
                  memory: "512Mi"
              volumeMounts:
                - name: mirror
                  mountPath: /srv/gate-mirror.git
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: gitconfig
                  mountPath: /gitconfig
                  readOnly: true
          volumes:
            - name: mirror
              hostPath:
                path: /var/cache/ci-runner/gate-mirror.git
                type: Directory
            - name: scripts
              configMap:
                name: gate-mirror-prune
                defaultMode: 0555
            - name: gitconfig
              configMap:
                name: gate-mirror-gitconfig
