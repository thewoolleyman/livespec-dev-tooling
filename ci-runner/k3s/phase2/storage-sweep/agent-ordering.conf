# agent-ordering.conf — the ordering sweep-runner-scratch.service takes on a
# k3s AGENT node. Installed as
# /etc/systemd/system/sweep-runner-scratch.service.d/10-agent-ordering.conf by
# ../storage-sweep/install-storage-sweep.sh when the role it resolves is
# `agent`, and by nothing else: a SERVER node gets no drop-in and runs the base
# unit exactly as it did before this file existed.
#
# WHY A DROP-IN AND NOT A SECOND UNIT. The mechanism is the same on both roles —
# the same sweep script, the same "before k3s starts" ordering, the same
# requirement that the storage root be mounted. Only two things differ, and each
# is a consequence of the role rather than a different design: the k3s unit on
# an agent is named `k3s-agent.service`, and an agent has no server datastore
# mount to be ordered after. Stating exactly those two differences here keeps the
# base unit byte-identical, so the server's install cannot drift when the
# agent's does — and it keeps the difference DATA in a committed file rather than
# a transformation the installer applies to a unit at install time.
#
# HOW SYSTEMD READS THIS: an EMPTY assignment RESETS the list the key has
# accumulated so far, and the line after it is the agent's value. That is why
# `Before=` appears twice and why `After=` appears alone — the base unit's
# `After=var-lib-rancher-k3s-server-db.mount` names a mount unit that does not
# exist on this role, so the agent's After list is empty rather than wrong.
#
# NOT RESET, on purpose:
#   * RequiresMountsFor=/var/lib/rancher/k3s/storage — that path is an fstab bind
#     mount on an agent too (phase2/storage-layout/ runs on both roles), and the
#     sweep must never run against the unmounted directory underneath it.
#   * ConditionPathExists=!/var/lib/rancher/k3s/server/db/state.db — on an agent
#     that path never exists, so the condition always holds and the datastore
#     gate is structurally UNAVAILABLE on this role. It is left in place because
#     removing it would buy nothing and would make the two roles' units differ in
#     a way that is not about ordering. See ./sweep-runner-scratch.sh's header,
#     "ON AN AGENT NODE", for what the agent's safety actually rests on.
[Unit]
Before=
Before=k3s-agent.service
After=
