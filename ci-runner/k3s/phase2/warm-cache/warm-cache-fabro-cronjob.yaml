# warm-cache-fabro-cronjob.yaml — the dedicated writer pass for the
# thewoolleyman/fabro fork. It is intentionally separate from
# warm-cache-cronjob.yaml: that manifest owns exactly one cache-tier-pinned
# hostPath singleton, and this independent pass has a longer deadline so the
# fork's large Rust workspace cannot starve the regular 3600-second warm.
#
# NODE PINNING: this job uses the ci-cache Redis writer endpoint and the
# host-mounted sccache binary, both on the cache-tier carrier. The key is a
# storage fact, not the k3s runner-role label every ARC node carries.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: warm-cache-populate-fabro
  namespace: ci-warm-cache
spec:
  schedule: "5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 14400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: warm-cache-populate-fabro
        spec:
          nodeSelector:
            ci-runner.io/cache-tier-carrier: "true"
          restartPolicy: Never
          serviceAccountName: warm-cache-populate
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: populate-fabro
              image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-rust-fuzz-v1.46.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/warm-cache-fabro-populate.sh"]
              env:
                - name: SCCACHE_FABRO_MIN_FREE_BYTES
                  value: "4294967296"
                - name: CRATES_PROXY_URL
                  value: http://crates-proxy.ci-crates-proxy.svc.cluster.local:3080
                - name: POPULATE_ADMITTED_JOB_THRESHOLD
                  value: "16"
                - name: SCCACHE_REDIS_ENDPOINT
                  value: redis://sccache-redis.ci-sccache.svc.cluster.local:6379
                - name: SCCACHE_REDIS_WRITER_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: sccache-redis-writer
                      key: username
                - name: SCCACHE_REDIS_WRITER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sccache-redis-writer
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "6"
                  memory: "12Gi"
              volumeMounts:
                - name: ci-runner-bin
                  mountPath: /opt/ci-runner/bin
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: warm-cache-populate
                defaultMode: 0555
            - name: ci-runner-bin
              hostPath:
                path: /usr/local/lib/ci-runner-k3s/bin
                type: DirectoryOrCreate
