# warm-cache-cronjob.yaml — the trusted writer of the warm uv cache lower
# (tier 1 of the cache tiers; see warm-cache-populate.sh's header and
# README.md for the design). Applied by converge-warm-cache.sh (and so by
# install-warm-cache.sh and the boot converge), which ALSO generates the
# `warm-cache-repos` ConfigMap this CronJob reads — that ConfigMap is
# deliberately not in this file, because its content is DERIVED from
# ../arc/values-*.yaml at install time (the live set of routed repositories)
# rather than maintained by hand as a second list that drifts — and the
# `warm-cache-populate` script ConfigMap (the populator plus
# verify-uv-cache.py). The `warm-cache-budget` ConfigMap IS in this file: the
# budget is a reviewed number, not a derived one (README.md "Budget").
#
# Since livespec-41w4 every generation is built FROM EMPTY through the PyPI
# files proxy (./pypi-proxy/, same namespace, applied by the same converge),
# verified against the routed locks, and refused over budget; the populator's
# header carries that control flow.
#
# Runs in its own namespace so the ONE mount of the warm root is not a
# capability anything in arc-runners carries. Nothing else mounts it at all:
# the local-path provisioner's setup script reflink-copies it into each new
# runner work volume at volume creation (../local-path-provisioner/), and a
# workflow pod only ever sees its own seed (../arc/hook-pod-template.yaml).
#
# Same image the fleet's CI jobs run in, so the cache is populated by the
# same uv (version and cache layout) that reads it — the python-RUST layer
# since 2026-09-04, because the populator also pre-warms the crates proxy
# (../crates-proxy/) with `cargo fetch` for every routed Cargo.lock, and that
# needs cargo and the console's pinned toolchain (the same image the console's
# `container:` runs) — and the python-rust-FUZZ leaf of that layer since
# 2026-09-06, because the populator also builds the console's warmed ASAN fuzz
# tree (`cargo +nightly fuzz build`; README "Target generations"), which needs
# the nightly toolchain, cargo-fuzz and a C++ compiler that only that leaf
# bakes. It is a superset of python-rust, so everything else here is unchanged.
# The tag is overridable by install-warm-cache.sh's WARM_CACHE_IMAGE; bump it
# in lockstep with the fleet's `container:` pin (same version, fuzz prefix).
apiVersion: v1
kind: Namespace
metadata:
  name: ci-warm-cache
---
# The populator's identity, for ONE read: the pool's admitted-job count
# (Kueue ClusterQueue status.admittedWorkloads, summed) before each
# compilation-cache writer build — the v054 populator-guardrails clause
# ("MUST NOT start a build while the pool's admitted-job count is above a
# configured threshold"). Cluster-scoped because ClusterQueues are; get/list
# on that one resource and nothing else, so the populator can observe load
# but touch no workload.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: warm-cache-populate
  namespace: ci-warm-cache
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: warm-cache-populate-kueue-reader
rules:
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["clusterqueues"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: warm-cache-populate-kueue-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: warm-cache-populate-kueue-reader
subjects:
  - kind: ServiceAccount
    name: warm-cache-populate
    namespace: ci-warm-cache
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: warm-cache-populate
  namespace: ci-warm-cache
data:
  warm-cache-populate.sh: |
    # REPLACED AT APPLY TIME by install-warm-cache.sh with the contents of
    # ./warm-cache-populate.sh (kubectl create configmap --from-file). This
    # placeholder exists so `kubectl apply -f` of this file alone leaves the
    # CronJob unable to start rather than running a stale script.
    echo "warm-cache-populate ConfigMap not converged by install-warm-cache.sh" >&2
    exit 2
---
# THE BUDGET (livespec-41w4; README.md "Budget"). Fixed numbers, NOT a
# multiple of the last build: a ratchet is self-referential, and the point is
# an alarm when the union of the routed locks drifts — re-deriving these is a
# reviewed commit against the measured union in README.md's cost table.
# 1,000,000,000 bytes / 20,000 files is ~2.5x the 2026-09-04 nine-lock union
# (379 MB / 8,070 files); the runaway hardlink-seeded generation that
# motivated the rebuild was 1,388 MB / 159,409 files, so BOTH axes trip well
# before that shape recurs. Injected into the populator as WARM_BUDGET_BYTES
# / WARM_BUDGET_FILES; the populator records the values in effect in every
# generation's manifest and in last-run.json, which the host sweep emits as
# livespec.ci_warm.budget_*. A generation over EITHER number is not
# published (previous generation stays live, exit 3).
apiVersion: v1
kind: ConfigMap
metadata:
  name: warm-cache-budget
  namespace: ci-warm-cache
data:
  bytes: "1000000000"
  files: "20000"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: warm-cache-populate
  namespace: ci-warm-cache
spec:
  # A run with no lock change is a fetch, a hash and a verify of the live
  # generation (seconds); a rebuild is a from-empty build through the PyPI
  # files proxy (~15 s for the nine-lock union, measured 2026-09-04) — plus
  # the sccache-writer build of each routed Rust repository ONLY when its
  # default branch or toolchain changed since the last build (a marker key
  # in redis; see the populator's header). Half-hourly keeps the lower
  # within one merge-cycle of every default branch's lockfile at negligible
  # cost; a generation older than a day is rebuilt regardless, so the
  # from-empty path is exercised at least once per 24 h.
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 0
      # Room for one full sccache-writer build of the console (four cargo
      # invocations at the repo's own build.jobs cap) on top of the uv sync.
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: warm-cache-populate
        spec:
          restartPolicy: Never
          serviceAccountName: warm-cache-populate
          # No Kueue queue-name label and no ci-runner.io/churn-slot request:
          # this is not a CI job and must never occupy a runner slot.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: populate
              image: ghcr.io/thewoolleyman/livespec-fabro-sandbox:python-rust-fuzz-v1.46.0
              imagePullPolicy: IfNotPresent
              command: ["bash", "/scripts/warm-cache-populate.sh"]
              env:
                - name: WARM_ROOT
                  value: /warm
                - name: REPOS_FILE
                  value: /config/repos.txt
                - name: KEEP_GENERATIONS
                  value: "2"
                # The budget both axes (the warm-cache-budget ConfigMap above);
                # the populator refuses to start without them.
                - name: WARM_BUDGET_BYTES
                  valueFrom:
                    configMapKeyRef:
                      name: warm-cache-budget
                      key: bytes
                - name: WARM_BUDGET_FILES
                  valueFrom:
                    configMapKeyRef:
                      name: warm-cache-budget
                      key: files
                # The PyPI files proxy (./pypi-proxy/) every rebuild fetches
                # through; probed at /health, a miss degrades to a direct build.
                - name: PYPI_FILES_PROXY
                  value: http://pypi-proxy.ci-warm-cache.svc.cluster.local:8081
                # The proxy's flat object store, read-only, for the hit ratio
                # (pypi-proxy.yaml's header: why flat, why countable).
                - name: PROXY_STORE
                  value: /proxy-store
                # The image installs uv and its CPython under /root (its
                # build-time HOME), which is why this container runs as the
                # image's default user (root) rather than a non-root uid: as
                # any other uid those paths are unreadable. Root here holds
                # no capability — all dropped, no escalation — and its only
                # writable host surface is the warm root below.
                - name: UV_HTTP_RETRIES
                  value: "5"
                # The crates proxy the cargo pre-warm fetches through
                # (../crates-proxy/). NO CARGO_* variable may be set on this
                # container: sccache hashes them into every cache key, and a
                # value the jobs do not carry keys the compilation cache away
                # from every job (the populator's header). Retries and
                # incremental live in the cargo config the script writes.
                - name: CRATES_PROXY_URL
                  value: http://crates-proxy.ci-crates-proxy.svc.cluster.local:3080
                # The admitted-job gate for the compilation-cache writer build
                # (the populator's header): no build starts while the sum of
                # Kueue ClusterQueue admittedWorkloads is above this. Half the
                # churn-slot cap (C=32 -> 16): a build capped at the
                # repository's own build.jobs (the console: 4 cores of 72)
                # under nice/ionice alongside up to 16 jobs is the load the
                # array and the cores absorb without moving job latency;
                # above that the pool is in a fan-out and the cache can wait a
                # tick (a skipped tick costs nothing — the marker key makes the
                # next idle tick build). Re-derive with C (kueue/DERIVATION.md).
                - name: POPULATE_ADMITTED_JOB_THRESHOLD
                  value: "16"
                # The shared compilation cache (../sccache/): this populator is
                # its ONE writer. The credential is projected only into this
                # namespace by converge-sccache-redis.sh; `optional` so a
                # populate without it still refreshes uv and the crates proxy
                # and logs the skip rather than failing to start.
                - name: SCCACHE_REDIS_ENDPOINT
                  value: redis://sccache-redis.ci-sccache.svc.cluster.local:6379
                - name: SCCACHE_REDIS_WRITER_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: sccache-redis-writer
                      key: username
                      optional: true
                - name: SCCACHE_REDIS_WRITER_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: sccache-redis-writer
                      key: password
                      optional: true
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  # The sccache-writer build runs at the repo's own build.jobs
                  # cap (the console: 4) under nice/ionice; this CPU limit is
                  # the hard ceiling the populator can never exceed on the
                  # node the jobs share (guardrails: livespec-dev-tooling-osmzo4).
                  cpu: "6"
                  memory: "8Gi"
              volumeMounts:
                - name: warm
                  mountPath: /warm
                - name: ci-runner-bin
                  mountPath: /opt/ci-runner/bin
                  readOnly: true
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: proxy-store
                  mountPath: /proxy-store
                  readOnly: true
          volumes:
            - name: warm
              hostPath:
                # A hidden sibling of the pvc-* directories on the ci-workvols
                # tier (the local-path provisioner's node path), NOT on the
                # ci-cache volume it started on: the provisioner's setup
                # script reflink-copies this into each new work volume's
                # _warm/uv, and a reflink is legal only within one filesystem
                # (livespec-lvtu, livespec-dev-tooling-hmv2bo; README.md
                # "Where it lives, and why it moved"). The tier is mounted by fstab
                # (../storage-layout/); the boot-time storage sweep
                # (../storage-sweep/) removes only pvc-* entries and keeps
                # this one.
                path: /var/lib/rancher/k3s/storage/.warm
                # DirectoryOrCreate: the kubelet creates the subtree (0755
                # root) on this CronJob's first run after a rebuild rather
                # than by hand. Until the first populate publishes a
                # generation the seed finds no `uv` link and every job runs
                # cold, by design.
                type: DirectoryOrCreate
            - name: scripts
              configMap:
                name: warm-cache-populate
                defaultMode: 0555
            - name: ci-runner-bin
              hostPath:
                # The pool-provided sccache (../sccache/install-sccache-binary.sh).
                path: /usr/local/lib/ci-runner-k3s/bin
                type: DirectoryOrCreate
            - name: config
              configMap:
                name: warm-cache-repos
            - name: proxy-store
              hostPath:
                # The PyPI files proxy's store (pypi-proxy/pypi-proxy.yaml),
                # the same path it mounts read-write; counted, never written.
                path: /var/cache/ci-runner/pypi-proxy
                type: DirectoryOrCreate
