# local-path-provisioner.yaml — the FLEET-OWNED local-path provisioner for the
# CI runner pool, applied on every boot by ../reconstruct/converge-ci-stack.sh
# (step 3) in place of k3s's bundled copy.
#
# WHY FLEET-OWNED: k3s ships this same provisioner as a packaged component
# (/var/lib/rancher/k3s/server/manifests/local-storage.yaml) and re-writes
# that file on every start. The tuning the pool needs (the `args:` below) was
# first applied as a live `kubectl patch` on 2026-09-01 and survived one k3s
# restart, then REVERTED on the 2026-09-02 12:14Z reboot onto the empty tmpfs
# datastore — k3s re-applied its bundled manifest and the args came back
# empty (livespec plan `ci-runner-pod-lifecycle-reliability`, epic
# `livespec-ifwnqj`, child `livespec-sernfh`). The only durable shape is to
# DISABLE the packaged component (`disable: [local-storage]` in
# ../k3s-config/config.yaml, plus the `local-storage.yaml.skip` marker its
# installer writes) and apply THIS file from the reconstruct-on-boot path.
#
# CONTENT: byte-for-byte the k3s v1.36.2+k3s1 bundled manifest (image
# rancher/local-path-provisioner:v0.0.36, path /var/lib/rancher/k3s/storage,
# default StorageClass `local-path`, WaitForFirstConsumer) plus TWO additions —
# the container `args:` and the warm-cache seed in the ConfigMap's `setup`
# script. Keep the image pin in lockstep with the k3s version in
# ../../provision-k3s.sh: a k3s upgrade that bumps the bundled provisioner is
# the moment to re-diff this file against the new bundled copy.
#
# THE WARM-CACHE SEED (livespec plan `ci-runner-pod-lifecycle-reliability`,
# research/005, carrier `livespec-lvtu`; made private per volume under
# `livespec-dev-tooling-hmv2bo`): every runner work volume is born with
# `_warm/uv` already holding the current warm uv cache generation, as a
# REFLINK COPY (`cp -a --reflink=always`: every file a new inode of this
# volume whose data blocks are shared copy-on-write with the generation's
# until either side writes), made by the `setup` script below while the
# volume is provisioned — with WaitForFirstConsumer that is after the runner
# pod is scheduled and before it starts, so the runner pod's volume wait
# absorbs the seed and the workflow container's ContainerCreating hold
# disappears. It replaces the hook template's per-start byte copy
# (../arc/hook-pod-template.yaml, ../warm-cache/README.md), which had grown
# with the cache to 1.9 GB / 160k files / ~9 s per job start, and the
# hardlink seed of 2026-09-04, whose inodes WERE the generation's and so were
# writable from every job (research/006 of that plan; README.md "The
# hazard"). The reflink copy is what closes that: a job owns every inode it
# sees, its writes land in its own volume, and the generation is reachable
# from no pod at all. It requires the `ci-workvols` tier to be a reflink
# filesystem — XFS with reflink=1 since 2026-09-06, decided per role in
# ../storage-layout/migrate-tier.sh `role_fstype` — and the helper image to
# carry GNU cp (busybox's has no --reflink): helperPod.yaml below pins
# docker.io/library/ubuntu:24.04 by digest. On a filesystem without reflink
# the cp fails and the volume gets NO seed (cold, never a byte copy).
# Facts the script rests on, read from the provisioner's v0.0.36 source
# (provisioner.go, createHelperPod) rather than assumed:
#   - The helper pod hostPath-mounts the PARENT of the volume directory (the
#     node path, /var/lib/rancher/k3s/storage/, DirectoryOrCreate) at that
#     SAME absolute path, because this file's helperPod.yaml declares no
#     `data` volumeMount of its own; VOL_DIR is <that path>/<pvc dir>. So the
#     warm root, a hidden sibling of the pvc-* directories (`.warm`, written
#     only by the ../warm-cache/ CronJob), is reachable from the helper as
#     `${VOL_DIR%/*}/.warm`, under the ONE mount VOL_DIR is under. That is
#     what made link() legal for the hardlink seed and what keeps the reflink
#     on one filesystem: FICLONE fails with EXDEV across filesystems, which
#     is why the warm root had to move from the ci-cache tier onto
#     ci-workvols beside the volumes (README "Storage layout"), and the
#     workflow pod sees no path of the warm root at all.
#   - The script runs as root, from the ConfigMap's `setup` key mounted at
#     /script/setup, as `/bin/sh /script/setup`, with VOL_DIR, VOL_MODE and
#     VOL_SIZE_BYTES in the environment; a non-zero exit fails the volume.
#   - The helper image is docker.io/library/ubuntu:24.04 (GNU coreutils 9.4:
#     `cp -a --reflink=always`; `find -exec ... {} +`; /bin/sh is dash),
#     pinned by digest, present on the node (verified by running it there
#     2026-09-06). It replaced rancher/mirrored-library-busybox:1.37.0, whose
#     `cp` has `-l` but no `--reflink`.
#   - Every seeded inode is this volume's own, so nothing about it is shared
#     with another volume or the generation: uv's lock files need no
#     per-volume re-creation (flock() locks the inode, and each volume's
#     lock inode is now its own), and a write from a job — including the
#     CACHEDIR.TAG uv writes at cache init — lands in the volume. The
#     hardlinks uv itself keeps INSIDE a cache (archive <-> wheels entries)
#     are preserved by `cp -a` as hardlinks within the copy; every link of
#     such an inode is under the seed, which is what
#     ../isolation/cache-negative-tests.sh case 1 asserts.
#   - Ownership stays the generation's (uid 0): the workflow pod's volume is
#     idmapped so its root is uid 0 there and owns the copy outright; the
#     uid-1000 matrix legs that cannot init a root-owned cache keep their
#     private UV_CACHE_DIR (../arc/values-livespec-orchestrator-beads-fabro.yaml).
# Measured on the node 2026-09-06 on the live 2.1 GB / 191k-file generation
# (XFS reflink=1, the second SN8100): cp -a --reflink=always 13.3 s and
# 165 MB of metadata writes, plus 0.8 s for the directory chmod pass —
# against 3 s / 135-282 MB for the hardlink seed on ext4 (research/006) and
# 6.8 s / 2,153 MB for the byte copy. A per-file FICLONE plus inode create
# is ~70 us; splitting the copy across top-level entries in parallel gained
# only ~25% because 83% of the files sit in archive-v0, so the copy is kept
# serial. The cost scales with the file count: the from-empty generation
# build (livespec-41w4, that plan's F2) is the lever, and the provisioner's
# 120 s helper-pod ceiling is far above it even under a start burst.
#
# THE TUNING (measured 2026-09-01, research/001 and research/002 of the plan
# above), against k3s's bundled defaults of 4 workers / QPS 5 / burst 10:
#   --worker-threads 8    Four workers fell ~11 minutes behind under pod
#                         churn; 32 workers (tried 14:19Z) multiplied helper
#                         pods into the then-exhausted inotify instance cap
#                         and made containerd worse; 8 (from 14:23Z) is the
#                         measured-good middle and has stayed so since the
#                         cap was raised (../node-inotify-budget/). Each
#                         worker is one concurrent helper pod, i.e. one more
#                         container against that budget — see
#                         ../kueue/DERIVATION.md "The pod-capacity constraint".
#   --kube-client-qps 50  The defaults produced 25 client-side throttling
#   --kube-client-burst 100  waits (~1.2 s each) in 20 minutes; 50/100 took
#                         that to zero with no API-server pressure observed.
#
# HELPER-POD TIMEOUT POSTURE: v0.0.36 hard-codes the per-volume helper pod's
# 120 s ceiling (no flag). It is NOT tuned here on purpose: with the inotify
# budget in place a helper pod's whole lifecycle is ~10-25 s, and a 120 s
# overrun is a symptom of the host condition ../wedged-runner/'s sibling scan
# (livespec-nhjpai) exists to alarm on, not a number to widen.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
- apiGroups: [""]
  resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["endpoints", "persistentvolumes", "pods"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
- kind: ServiceAccount
  name: local-path-provisioner-service-account
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  revisionHistoryLimit: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      priorityClassName: "system-node-critical"
      serviceAccountName: local-path-provisioner-service-account
      tolerations:
          - key: "CriticalAddonsOnly"
            operator: "Exists"
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: local-path-provisioner
        image: "rancher/local-path-provisioner:v0.0.36"
        imagePullPolicy: IfNotPresent
        command:
        - local-path-provisioner
        - start
        - --config
        - /etc/config/config.json
        # The fleet's tuning — the ONLY divergence from the bundled manifest.
        # Derivation in this file's header.
        args:
        - --worker-threads
        - "8"
        - --kube-client-qps
        - "50"
        - --kube-client-burst
        - "100"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config/
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    defaultVolumeType: "local"
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap":[
      {
        "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
        "paths":["/var/lib/rancher/k3s/storage"]
      }
      ]
    }
  setup: |-
    #!/bin/sh
    # See the file header ("THE WARM-CACHE SEED") for what this runs as and
    # where. Everything after the chmod 700 is the fleet's addition.
    set -eu
    mkdir -m 0777 -p "${VOL_DIR}"
    chmod 700 "${VOL_DIR}/.."
    # Leave the volume root exactly as the kubelet's fsGroup handling would
    # (gid 1000 = the runner pod's fsGroup in every ../arc/values-*.yaml;
    # mode 2777 = 0777 plus setgid). The runner pods carry
    # fsGroupChangePolicy OnRootMismatch, so the kubelet then finds no
    # mismatch and skips walking the seeded tree on the runner's mount; with
    # the default Always it would chgrp+chmod every one of the ~190k seeded
    # inodes per start (this volume's own since the reflink seed, so a cost,
    # no longer a mutation of shared inodes). A mismatch is slow, not
    # broken.
    chgrp 1000 "${VOL_DIR}"
    chmod 2777 "${VOL_DIR}"
    # Seed the warm uv cache as a REFLINK COPY of the current generation:
    # every file a new inode of this volume sharing the generation's data
    # blocks copy-on-write, so a job's write lands here and never in the
    # generation (header). `--reflink=always` means a filesystem without
    # reflink FAILS the copy rather than falling back to bytes. The `uv`
    # link is resolved ONCE, so a populate publishing mid-seed cannot mix
    # two generations (the populator keeps the previous one for a cycle).
    # New directories become 0777 so a non-root reader can add entries;
    # every file keeps the generation's owner and mode. A missing root,
    # link or generation, or any failure, leaves NO cache (uv resolves
    # cold, and the job still runs): never a byte copy, which is the
    # per-start cost this replaced. The rm first makes a re-run on an
    # already-prepared path (a retried helper pod) start clean rather than
    # keep a half-made seed.
    warm="${VOL_DIR%/*}/.warm"
    rm -rf "${VOL_DIR}/_warm"
    if [ -L "${warm}/uv" ]; then
      gen="$(readlink "${warm}/uv")"
      case "${gen}" in /*) src="${gen}" ;; *) src="${warm}/${gen}" ;; esac
      if [ -d "${src}" ]; then
        if ! ( mkdir -m 0777 "${VOL_DIR}/_warm" \
               && cp -a --reflink=always "${src}/." "${VOL_DIR}/_warm/uv" \
               && find "${VOL_DIR}/_warm/uv" -type d -exec chmod 0777 {} + ); then
          echo "warm-cache seed from ${src} failed; leaving a cold cache" >&2
          rm -rf "${VOL_DIR}/_warm"
        else
          # Stamp the generation NAME beside the seed for the cache spans
          # (../arc/hook-pod-template.yaml header item 6): the name is the
          # populator's %Y%m%dT%H%M%SZ publish time, so it is the age too.
          printf '%s\n' "${src##*/}" > "${VOL_DIR}/_warm/.uv-generation" 2>/dev/null || true
        fi
      fi
    fi
    # Seed every published warm TARGET generation the same way (the warmed
    # `target/` trees the populator builds per <repo>/<key>; today the console's
    # ASAN fuzz tree, ../warm-cache/README.md "Target generations"). One reflink
    # copy per published link under <volume>/_warm/target/<repo>/<key>, its
    # generation name stamped in `.generation` beside the tree and manifest;
    # a failure leaves NO seed for that key (the job builds cold). Independent
    # of the uv seed above: either can be absent.
    if [ -d "${warm}/target" ]; then
      for link in "${warm}"/target/*/*; do
        [ -L "${link}" ] || continue
        repo="${link%/*}"; repo="${repo##*/}"; key="${link##*/}"
        gen="$(readlink "${link}")"
        case "${gen}" in /*) src="${gen}" ;; *) src="${link%/*}/${gen}" ;; esac
        [ -d "${src}/tree" ] || continue
        dest="${VOL_DIR}/_warm/target/${repo}/${key}"
        if ( mkdir -m 0777 -p "${VOL_DIR}/_warm" "${dest%/*}" \
             && cp -a --reflink=always "${src}/." "${dest}" \
             && find "${dest}" -type d -exec chmod 0777 {} + ); then
          printf '%s\n' "${src##*/}" > "${dest}/.generation" 2>/dev/null || true
        else
          echo "warm target seed ${repo}/${key} from ${src} failed; leaving none" >&2
          rm -rf "${dest}"
        fi
      done
    fi
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "${VOL_DIR}"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        # GNU coreutils for `cp --reflink=always` (header, "THE WARM-CACHE
        # SEED"); busybox's cp cannot reflink. Pinned by digest; present on
        # the node.
        image: "docker.io/library/ubuntu:24.04@sha256:33ceb71981b602c1a7443a53469e4dba065f7503eab3078a2d7a57a2ab987517"
        imagePullPolicy: IfNotPresent
