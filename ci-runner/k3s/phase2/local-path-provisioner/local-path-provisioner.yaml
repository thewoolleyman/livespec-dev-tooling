# local-path-provisioner.yaml — the FLEET-OWNED local-path provisioner for the
# CI runner pool, applied on every boot by ../reconstruct/converge-ci-stack.sh
# (step 3) in place of k3s's bundled copy.
#
# WHY FLEET-OWNED: k3s ships this same provisioner as a packaged component
# (/var/lib/rancher/k3s/server/manifests/local-storage.yaml) and re-writes
# that file on every start. The tuning the pool needs (the `args:` below) was
# first applied as a live `kubectl patch` on 2026-09-01 and survived one k3s
# restart, then REVERTED on the 2026-09-02 12:14Z reboot onto the empty tmpfs
# datastore — k3s re-applied its bundled manifest and the args came back
# empty (livespec plan `ci-runner-pod-lifecycle-reliability`, epic
# `livespec-ifwnqj`, child `livespec-sernfh`). The only durable shape is to
# DISABLE the packaged component (`disable: [local-storage]` in
# ../k3s-config/config.yaml, plus the `local-storage.yaml.skip` marker its
# installer writes) and apply THIS file from the reconstruct-on-boot path.
#
# CONTENT: byte-for-byte the k3s v1.36.2+k3s1 bundled manifest (image
# rancher/local-path-provisioner:v0.0.36, path /var/lib/rancher/k3s/storage,
# default StorageClass `local-path`, WaitForFirstConsumer) plus TWO additions —
# the container `args:` and the warm-cache seed in the ConfigMap's `setup`
# script. Keep the image pin in lockstep with the k3s version in
# ../../provision-k3s.sh: a k3s upgrade that bumps the bundled provisioner is
# the moment to re-diff this file against the new bundled copy.
#
# THE WARM-CACHE SEED (livespec plan `ci-runner-pod-lifecycle-reliability`,
# research/005, carrier `livespec-lvtu`): every runner work volume is born
# with `_warm/uv` already holding the current warm uv cache generation, as
# HARDLINKS, made by the `setup` script below while the volume is provisioned
# — with WaitForFirstConsumer that is after the runner pod is scheduled and
# before it starts, so the runner pod's volume wait absorbs the ~2 s seed and
# the workflow container's ContainerCreating hold disappears. It replaces the
# hook template's per-start
# byte copy (../arc/hook-pod-template.yaml, ../warm-cache/README.md), which
# had grown with the cache to 1.9 GB / 160k files / ~9 s per job start.
# Facts the script rests on, read from the provisioner's v0.0.36 source
# (provisioner.go, createHelperPod) rather than assumed:
#   - The helper pod hostPath-mounts the PARENT of the volume directory (the
#     node path, /var/lib/rancher/k3s/storage/, DirectoryOrCreate) at that
#     SAME absolute path, because this file's helperPod.yaml declares no
#     `data` volumeMount of its own; VOL_DIR is <that path>/<pvc dir>. So the
#     warm root, a hidden sibling of the pvc-* directories (`.warm`, written
#     only by the ../warm-cache/ CronJob), is reachable from the helper as
#     `${VOL_DIR%/*}/.warm`, under the ONE mount VOL_DIR is under. That is
#     what makes link() legal: a hardlink across two bind mounts of the same
#     filesystem fails with EXDEV, which is why the seed cannot run inside
#     the workflow pod and why the warm root had to move from the ci-cache
#     tier onto ci-workvols beside the volumes (README "Storage layout").
#   - The script runs as root, from the ConfigMap's `setup` key mounted at
#     /script/setup, as `/bin/sh /script/setup`, with VOL_DIR, VOL_MODE and
#     VOL_SIZE_BYTES in the environment; a non-zero exit fails the volume.
#   - The helper image is busybox 1.37.0, whose `cp` has `-a` (= -dpR) and
#     `-l` (hardlink instead of copy) and whose `find` has `-perm` and
#     `-exec ... {} +` (verified by running that image).
#   - uv's lock files (the only world-writable files in a generation; uv
#     flocks them and never writes content) are re-created empty per volume
#     after linking. A hardlinked lock file is ONE inode shared by every
#     seeded volume and the generation itself, and flock() locks the inode:
#     two jobs, or a job and the populator, would serialize on each other's
#     cache locks. Fresh per-volume lock files keep every job's locking
#     private to its own volume.
#   - What the seed does NOT do: make the shared inodes unwritable to the
#     job. The workflow pod's volume is idmapped and its root is uid 0
#     there, so the root-owned generation files are writable from a job;
#     uv never writes one in place, but nothing enforces that. An owner no
#     pod maps was tried on 2026-09-04 and broke every job (uv's cache init
#     writes CACHEDIR.TAG; the kernel refuses write-open, unlink and
#     rename-over on unmapped-owner inodes and creates in unmapped-owner
#     directories). The mechanical closure is an open maintainer decision:
#     ../warm-cache/README.md "The hazard".
# Measured on the live 1,388 MB / 159k-file generation, same filesystem:
# cp -al 2.3 s and 269 MB of metadata writes, against 6.8 s and 2,153 MB
# for the byte copy; after the separate generation-trim item the target is
# under 1 s and under 100 MB per start. The provisioner's 120 s helper-pod
# ceiling is far above that even under a start burst.
#
# THE TUNING (measured 2026-09-01, research/001 and research/002 of the plan
# above), against k3s's bundled defaults of 4 workers / QPS 5 / burst 10:
#   --worker-threads 8    Four workers fell ~11 minutes behind under pod
#                         churn; 32 workers (tried 14:19Z) multiplied helper
#                         pods into the then-exhausted inotify instance cap
#                         and made containerd worse; 8 (from 14:23Z) is the
#                         measured-good middle and has stayed so since the
#                         cap was raised (../node-inotify-budget/). Each
#                         worker is one concurrent helper pod, i.e. one more
#                         container against that budget — see
#                         ../kueue/DERIVATION.md "The pod-capacity constraint".
#   --kube-client-qps 50  The defaults produced 25 client-side throttling
#   --kube-client-burst 100  waits (~1.2 s each) in 20 minutes; 50/100 took
#                         that to zero with no API-server pressure observed.
#
# HELPER-POD TIMEOUT POSTURE: v0.0.36 hard-codes the per-volume helper pod's
# 120 s ceiling (no flag). It is NOT tuned here on purpose: with the inotify
# budget in place a helper pod's whole lifecycle is ~10-25 s, and a 120 s
# overrun is a symptom of the host condition ../wedged-runner/'s sibling scan
# (livespec-nhjpai) exists to alarm on, not a number to widen.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-path-provisioner-service-account
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-path-provisioner-role
rules:
- apiGroups: [""]
  resources: ["nodes", "persistentvolumeclaims", "configmaps", "pods/log"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["endpoints", "persistentvolumes", "pods"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
- apiGroups: ["storage.k8s.io"]
  resources: ["storageclasses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-path-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-path-provisioner-role
subjects:
- kind: ServiceAccount
  name: local-path-provisioner-service-account
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-path-provisioner
  namespace: kube-system
spec:
  revisionHistoryLimit: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: local-path-provisioner
  template:
    metadata:
      labels:
        app: local-path-provisioner
    spec:
      priorityClassName: "system-node-critical"
      serviceAccountName: local-path-provisioner-service-account
      tolerations:
          - key: "CriticalAddonsOnly"
            operator: "Exists"
          - key: "node-role.kubernetes.io/control-plane"
            operator: "Exists"
            effect: "NoSchedule"
      nodeSelector:
        kubernetes.io/os: linux
      containers:
      - name: local-path-provisioner
        image: "rancher/local-path-provisioner:v0.0.36"
        imagePullPolicy: IfNotPresent
        command:
        - local-path-provisioner
        - start
        - --config
        - /etc/config/config.json
        # The fleet's tuning — the ONLY divergence from the bundled manifest.
        # Derivation in this file's header.
        args:
        - --worker-threads
        - "8"
        - --kube-client-qps
        - "50"
        - --kube-client-burst
        - "100"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/config/
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
      volumes:
        - name: config-volume
          configMap:
            name: local-path-config
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    defaultVolumeType: "local"
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: local-path-config
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap":[
      {
        "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
        "paths":["/var/lib/rancher/k3s/storage"]
      }
      ]
    }
  setup: |-
    #!/bin/sh
    # See the file header ("THE WARM-CACHE SEED") for what this runs as and
    # where. Everything after the chmod 700 is the fleet's addition.
    set -eu
    mkdir -m 0777 -p "${VOL_DIR}"
    chmod 700 "${VOL_DIR}/.."
    # Leave the volume root exactly as the kubelet's fsGroup handling would
    # (gid 1000 = the runner pod's fsGroup in every ../arc/values-*.yaml;
    # mode 2777 = 0777 plus setgid). The runner pods carry
    # fsGroupChangePolicy OnRootMismatch, so the kubelet then finds no
    # mismatch and skips walking the seeded tree on the runner's mount; with
    # the default Always it would chgrp+chmod every one of the ~160k
    # hardlinks per start, mutating the inodes the generations share. A
    # mismatch is slow, not broken.
    chgrp 1000 "${VOL_DIR}"
    chmod 2777 "${VOL_DIR}"
    # Seed the warm uv cache by HARDLINK from the current generation. The
    # `uv` link is resolved ONCE, so a populate publishing mid-seed cannot
    # mix two generations (the populator keeps the previous one for a
    # cycle). New directories become 0777 so the job's uid can add cache
    # entries; every world-writable file (uv's lock files, the only ones)
    # is replaced by a fresh empty per-volume file so a job's flocks never
    # share an inode with another job's or the populator's (header); every
    # other file keeps the generation's inode, owner and mode. A
    # missing root, link or generation, or any failure, leaves NO cache (uv
    # resolves cold, and the job still runs): never a byte copy, which is
    # the per-start cost this replaced. The rm first makes a re-run on an
    # already-prepared path (a retried helper pod) start clean rather than
    # keep a half-made seed.
    warm="${VOL_DIR%/*}/.warm"
    rm -rf "${VOL_DIR}/_warm"
    if [ -L "${warm}/uv" ]; then
      gen="$(readlink "${warm}/uv")"
      case "${gen}" in /*) src="${gen}" ;; *) src="${warm}/${gen}" ;; esac
      if [ -d "${src}" ]; then
        if ! ( mkdir -m 0777 "${VOL_DIR}/_warm" \
               && cp -al "${src}/." "${VOL_DIR}/_warm/uv" \
               && find "${VOL_DIR}/_warm/uv" -type d -exec chmod 0777 {} + \
               && find "${VOL_DIR}/_warm/uv" -type f -perm -0002 -exec sh -c \
                    'for f; do rm -f "$f" && : > "$f" && chmod 0666 "$f" || exit 1; done' sh {} + ); then
          echo "warm-cache seed from ${src} failed; leaving a cold cache" >&2
          rm -rf "${VOL_DIR}/_warm"
        else
          # Stamp the generation NAME beside the seed for the cache spans
          # (../arc/hook-pod-template.yaml header item 6): the name is the
          # populator's %Y%m%dT%H%M%SZ publish time, so it is the age too.
          printf '%s\n' "${src##*/}" > "${VOL_DIR}/_warm/.uv-generation" 2>/dev/null || true
        fi
      fi
    fi
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "${VOL_DIR}"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: "rancher/mirrored-library-busybox:1.37.0"
        imagePullPolicy: IfNotPresent
