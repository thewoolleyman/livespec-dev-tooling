# The committed per-node CPU budget of the self-hosted pool, in machine-readable form.
#
# NODE-CPU-BUDGET.md beside this file explains every value and the measurement it
# comes from. Plan gate-job-resources (livespec-dev-tooling-ukoeah) owns it, and
# work item livespec-dev-tooling-wirn53 owns the change that arms the checks.
#
# NOTHING READS THIS FILE YET. The checks that will read it are spec-first under
# the pending proposal per-node-cpu-budget-honest-requests. They are armed only in
# the change that commits caps satisfying the node CPU fit on every pool node:
#   - gate lanes equal to gate_cpu;
#   - the hook pod template's job-container request equal to ci_job_cpu;
#   - factory_pod_budget in ansible/inventory/host_vars equal to the values below.
#
# Per node, churn_slots, gate_cpu and factory_pod_budget are the values the
# budget derives. Each cap's own committed file must equal them:
#   - phase0-bare-metal/profiles/<node>.env ADMISSION_CAPACITY_C;
#   - kueue/cluster-queue-gates.yaml;
#   - ansible/inventory/host_vars/<node>.yml.
# The fit check reads those files, and this file records what they must say.
# An other_workloads entry gains a `manifest:` key in the arming change wherever
# this repository commits that workload.
#
# Units are CPU cores. Each node's fit, with every churn slot in use, is:
#   churn_slots * ci_job_cpu
#   + gate_cpu
#   + factory_pod_budget * factory_sandbox_cpu
#   + sum(other_workloads[].cpu)
#   <= allocatable_cpu

# The CI job's workflow-pod CPU request. Measured mean per workflow pod is 1.40 /
# 1.69 / 1.78 cores on poweredge / gmktec / hp (pod-weighted fleet value 1.54),
# Honeycomb query FLoxCmwxT76, 2026-11-12 19:00Z to 11-13 01:00Z.
ci_job_cpu: 1.5

# The largest committed factory sandbox CPU request (kubernetes-sandbox-backend's
# template). Measured per-pod p50 is 2.03-2.94 cores; p95 is limit-bound at 6.
factory_sandbox_cpu: 3

# The gate placement reconciler's saturation threshold on CI-job cpu.pressure some
# avg60. It starts at 30, the threshold set against the BestEffort slice. The
# arming change re-derives it from a 24-hour side-by-side reading.
saturation_pressure_threshold: 30

nodes:
  gmktec-xubuntu:
    allocatable_cpu: 32
    churn_slots: 6          # ADMISSION_CAPACITY_C; 8 -> 6 under livespec-dev-tooling-6e5pyj
    gate_cpu: 9             # gates-flavor; 3 gates at the 3-CPU default
    factory_pod_budget: 4   # was 7
    other_workloads:        # live CPU requests read 2026-11-13 ~20:5xZ
      - {workload: ci-warm-cache, cpu: 0.5}
      - {workload: kueue-system/kueue-controller-manager, cpu: 0.5}
      - {workload: kube-system, cpu: 0.1}
    # fit: 6*1.5 + 9 + 4*3 + 1.1 = 31.1 <= 32
  poweredge-xubuntu:
    allocatable_cpu: 72
    churn_slots: 17
    gate_cpu: 21            # gates-poweredge-flavor; was 30
    factory_pod_budget: 8   # was 9
    other_workloads:
      - {workload: kueue-system/kueue-controller-manager, cpu: 0.5}
      - {workload: kube-system, cpu: 0.3}
      - {workload: ci-sccache, cpu: 0.25}
      - {workload: ci-crates-proxy, cpu: 0.1}
      - {workload: ci-registry-mirror, cpu: 0.1}
      - {workload: ci-warm-cache, cpu: 0.05}
    # fit: 17*1.5 + 21 + 8*3 + 1.3 = 71.8 <= 72
  hp-xubuntu:
    allocatable_cpu: 14.5
    churn_slots: 4          # 5 -> 4 under livespec-dev-tooling-6e5pyj
    gate_cpu: 3             # gates-hp-flavor; was 5
    factory_pod_budget: 1   # was 2
    other_workloads:
      - {workload: ci-warm-cache, cpu: 0.5}
      - {workload: kube-system, cpu: 0.1}
    # fit: 4*1.5 + 3 + 1*3 + 0.6 = 12.6 <= 14.5
  gamingpc-xubuntu:
    allocatable_cpu: 12     # kubelet reserves already taken out
    churn_slots: 3          # 1 -> 3 under livespec-dev-tooling-6e5pyj
    gate_cpu: 3             # gates-gamingpc-flavor; was 5
    factory_pod_budget: 1
    other_workloads: []
    # fit: 3*1.5 + 3 + 1*3 + 0 = 10.5 <= 12
  macbook-m4-max-homelab-worker:
    allocatable_cpu: 12     # kubelet reserves already taken out
    churn_slots: 1          # arm64 worker flavor
    gate_cpu: 3             # enrolled by converge-worker-queues.sh: one gate unit
    factory_pod_budget: 1   # the homelab-worker-arm64 instance's sandbox
    other_workloads:
      - {workload: kube-system, cpu: 0.1}
    # fit: 1*1.5 + 3 + 1*3 + 0.1 = 7.6 <= 12
