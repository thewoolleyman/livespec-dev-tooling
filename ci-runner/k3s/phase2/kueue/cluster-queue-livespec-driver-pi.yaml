# cluster-queue-livespec-driver-pi.yaml — the per-repository Kueue ClusterQueue and
# LocalQueue for `livespec-driver-pi`.
#
# GENERATED BY HAND from the derivation in DERIVATION.md, which maps
# SPECIFICATION/non-functional-requirements.md section "Adaptive JIT runner
# admission budget" onto ARC and Kueue. Read that file before changing any
# number here. There is deliberately no generator script — see DERIVATION.md
# "Is a generator worth building?" for why, and for the recomputation steps
# when the host's churn-slot capacity changes.
#
# The pi per-agent-runtime Driver plugin repo, and the NINTH repository in the
# cohort — added 2026-08-20, after the eight-repo cutover sequence had closed.
# See DERIVATION.md "Recomputation on the ninth repository (2026-08-20)" for the
# full arithmetic; the summary is below.
#
# nominalQuota derivation for THIS repo:
#   demand weight w = 13 (this repo's MEASURED CI-matrix width — see the note
#                         below, it is not a podman-era inheritance)
#   fleet weight sum W = 516 (482 podman-era + livespec-driver-pi's 13 + livespec-orchestrator-beads-fabro's 21)
#   pool churn-slot capacity C = 44 (per-node: poweredge 32 + gmktec 12; churn-slot capacity is per-node while the Kueue cohort quota is cluster-wide, so it sums to both nodes -- see DERIVATION.md "The derivation at C = 44 -- the two-node pool (2026-09-11)")
#   exact share = C * w / W = 1.1085  ->  floor 1, no leftover = 1
#
# AT C = 44 THE OLD C = 16 COHORT-SUM EXCEPTION IS STILL GONE. At the old C = 16
# this repo's share rounded to zero and the rule's `max(1, ...)` floor lifted it
# to 1, forcing the committed quotas to sum to 17 (one above C). At the two-node
# C = 44 its exact share is 1.1085: it earns a floor of 1 outright with no
# leftover unit, so its quota is 1 by the apportionment itself and the ten quotas
# sum to exactly C = 44 with no forced excess. See DERIVATION.md "The derivation
# at C = 44 -- the two-node pool (2026-09-11)".
#
# WHY THE DEMAND WEIGHT IS 13 AND IS NOT IN THE 63-67 BAND. The other Drivers'
# weights are podman-era apportionment numbers that happen to approximate their
# matrix widths, and ../arc/values-livespec-driver-codex.yaml says outright that
# its maxRunners is "inherited as a proxy because nobody has measured its actual
# matrix width". This repo's 13 IS a measurement: run 32420185191 on
# thewoolleyman/livespec-driver-pi#64 dispatched exactly 13 jobs. It is low
# because that repo's ci.yml deliberately collapses its ~69 check targets into
# batch jobs (check-python-batch, check-metadata-batch) instead of running one
# job per check slug. Do NOT "correct" it upward to match its siblings.
#
# nominalQuota is this repo's GUARANTEED FLOOR, not its ceiling. Unused quota
# anywhere in the `fleet-ci-runner-pool` cohort is borrowable automatically,
# so this repo can burst well above 2 when its peers are idle — observed live
# on the cutover run, which burst to 4 concurrent runners. The per-repo
# ceiling is a SEPARATE number — ../arc/values-livespec-driver-pi.yaml's
# maxRunners. The two are different terms of the same min() and are correctly
# UNEQUAL; see DERIVATION.md "The four terms and where each one lives".
#
# API version confirmed live against the pinned Kueue v0.19.1 install on
# poweredge-xubuntu: v1beta2's `spec.cohortName`, NOT v1beta1's `spec.cohort`
# (accepted but deprecated).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: livespec-driver-pi-cq
spec:
  cohortName: fleet-ci-runner-pool
  namespaceSelector: {}
  fairSharing:
    # Deliberately neutral. The demand weighting lives in nominalQuota above.
    # Kueue's fairSharing.weight only influences PREEMPTION, and every queue in
    # this cohort sets preemption to Never, so a non-1 weight here would look
    # meaningful while changing nothing. See DERIVATION.md
    # "fairSharing.weight is deliberately left at 1, and is currently inert".
    weight: 1
  resourceGroups:
    - coveredResources: ["ci-runner.io/churn-slot"]
      flavors:
        - name: churn-slot-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              # C = 44 (2026-09-11, plan k3s-on-gmktec-for-vps-usage / epic livespec-sab5gn R5, resolving livespec-dev-tooling-xa6o): churn-slot capacity is now PER-NODE and the Kueue cohort quota is cluster-wide, so the ten nominalQuotas sum to the TWO-NODE total poweredge 32 + gmktec 12 = 44; W = 516; poweredge stays at its 2026-09-06 soak-measured 32, gmktec is the derived first value 12 (plan research/001 §3.5); see DERIVATION.md "The derivation at C = 44 -- the two-node pool (2026-09-11)".
              nominalQuota: 1
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: livespec-driver-pi-lq
  namespace: arc-runners  # phase 1's shared namespace for every ARC release
spec:
  clusterQueue: livespec-driver-pi-cq
