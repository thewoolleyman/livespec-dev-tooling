# cluster-queue-livespec-overseer.yaml — the per-repository Kueue ClusterQueue and
# LocalQueue for `livespec-overseer`.
#
# GENERATED BY HAND from the derivation in DERIVATION.md, which maps
# SPECIFICATION/non-functional-requirements.md section "Adaptive JIT runner
# admission budget" onto ARC and Kueue. Read that file before changing any
# number here. There is deliberately no generator script — see DERIVATION.md
# "Is a generator worth building?" for why, and for the recomputation steps
# when the host's churn-slot capacity changes.
#
# nominalQuota for THIS repo: 2, the churn-slot-flavor value below, which is
# the authority. The cohort's churn-slot-flavor quotas sum to 30, equal to the
# pool's registered churn-slot capacity: poweredge 17 + gmktec 6 + hp 4 +
# gamingpc 3 (DERIVATION.md "Per-node CPU budget cut: cohort 30 (2026-11-13)").
# The demand-weight apportionment at C = 44 that set the earlier values was
# superseded by the measured re-derivations from 2026-10-22 on, and each change
# since is a dated DERIVATION.md section. To change a quota, follow
# DERIVATION.md "Recomputing at another C" and keep the cohort's sum equal to
# the registered capacity: a sum above it promises slots no node has, and a sum
# below it idles capacity.
#
# nominalQuota is this repo's GUARANTEED FLOOR, not its ceiling. Unused quota
# anywhere in the `fleet-ci-runner-pool` cohort is borrowable automatically,
# so this repo can burst well above 1 when its peers are idle. The per-repo
# ceiling is a SEPARATE number — ../arc/values-livespec-overseer.yaml's maxRunners, which
# models the formula's "doubled repository logical ceiling" term. The two are
# different terms of the same min() and are correctly UNEQUAL; see
# DERIVATION.md "The four terms and where each one lives".
#
# API version confirmed live against the pinned Kueue v0.19.1 install on
# poweredge-xubuntu: v1beta2's `spec.cohortName`, NOT v1beta1's `spec.cohort`
# (accepted but deprecated).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: livespec-overseer-cq
spec:
  cohortName: fleet-ci-runner-pool
  namespaceSelector: {}
  fairSharing:
    # Deliberately neutral. The demand weighting lives in nominalQuota above.
    # Kueue's fairSharing.weight only influences PREEMPTION, and every queue in
    # this cohort sets preemption to Never, so a non-1 weight here would look
    # meaningful while changing nothing. See DERIVATION.md
    # "fairSharing.weight is deliberately left at 1, and is currently inert".
    weight: 1
  resourceGroups:
    - coveredResources: ["ci-runner.io/churn-slot"]
      flavors:
        - name: churn-slot-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              # Measured-job-hours re-derivation, 2026-10-22: see DERIVATION.md.
              nominalQuota: 2
        # The arm64 container workers' churn slots (livespec-dev-tooling-eorpen), listed AFTER
        # the fleet flavor at nominalQuota 0: this repository reaches a worker only by borrowing
        # once the fleet flavor, its own quota and what it can borrow, has no slot left. Listed
        # because this repository's release line in ../workload-arch.conf includes arm64.
        - name: churn-slot-worker-arm64-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              nominalQuota: 0
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: livespec-overseer-lq
  namespace: arc-runners  # phase 1's shared namespace for every ARC release
spec:
  clusterQueue: livespec-overseer-cq
