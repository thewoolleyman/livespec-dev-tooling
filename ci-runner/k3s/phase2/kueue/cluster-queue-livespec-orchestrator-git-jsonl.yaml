# cluster-queue-livespec-orchestrator-git-jsonl.yaml — the per-repository Kueue ClusterQueue and
# LocalQueue for `livespec-orchestrator-git-jsonl`.
#
# GENERATED BY HAND from the derivation in DERIVATION.md, which maps
# SPECIFICATION/non-functional-requirements.md section "Adaptive JIT runner
# admission budget" onto ARC and Kueue. Read that file before changing any
# number here. There is deliberately no generator script — see DERIVATION.md
# "Is a generator worth building?" for why, and for the recomputation steps
# when the host's churn-slot capacity changes.
#
# nominalQuota derivation for THIS repo:
#   demand weight w = 66 (podman-era ci-runner-supervisor apportionment)
#   fleet weight sum W = 516 (482 podman-era + livespec-driver-pi's 13 + livespec-orchestrator-beads-fabro's 21)
#   host churn-slot capacity C = 32 (as registered on the node; stepped back 2026-09-06 after the one-hour soak at 64)
#   exact share = C * w / W = 4.0930  ->  largest-remainder apportionment = 4
#
# The ten repositories' nominalQuota values sum to exactly 32 = C = 32
# (increase-ci-runners raise, 2026-08-30; livespec epic livespec-zec4mz). At
# C = 64 every repository's exact share exceeds 1, so the apportionment sums
# to exactly C with NO `max(1, ...)` excess — the one-slot over-reservation
# that existed at C = 16 is gone. Cohort borrowing is bounded by the summed
# nominal quota, so a sum below it wastes capacity; keep the nine values
# summing to exactly C. See DERIVATION.md "The derivation at C = 64
# (2026-08-30)".
#
# nominalQuota is this repo's GUARANTEED FLOOR, not its ceiling. Unused quota
# anywhere in the `fleet-ci-runner-pool` cohort is borrowable automatically,
# so this repo can burst well above 8 when its peers are idle. The per-repo
# ceiling is a SEPARATE number — ../arc/values-livespec-orchestrator-git-jsonl.yaml's maxRunners, which
# models the formula's "doubled repository logical ceiling" term. The two are
# different terms of the same min() and are correctly UNEQUAL; see
# DERIVATION.md "The four terms and where each one lives".
#
# API version confirmed live against the pinned Kueue v0.19.1 install on
# poweredge-xubuntu: v1beta2's `spec.cohortName`, NOT v1beta1's `spec.cohort`
# (accepted but deprecated).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: livespec-orchestrator-git-jsonl-cq
spec:
  cohortName: fleet-ci-runner-pool
  namespaceSelector: {}
  fairSharing:
    # Deliberately neutral. The demand weighting lives in nominalQuota above.
    # Kueue's fairSharing.weight only influences PREEMPTION, and every queue in
    # this cohort sets preemption to Never, so a non-1 weight here would look
    # meaningful while changing nothing. See DERIVATION.md
    # "fairSharing.weight is deliberately left at 1, and is currently inert".
    weight: 1
  resourceGroups:
    - coveredResources: ["ci-runner.io/churn-slot"]
      flavors:
        - name: churn-slot-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              # C = 32 (2026-09-06, maintainer decision, livespec plan poweredge-raid-array-maintenance / epic livespec-g52yrb): stepped back from the 2026-09-06 restore to 64 after the tiered-host soak showed CPU saturated at 35-46 running jobs (91-98 % busy, Slow SQL, p95 job duration 1.9x the C = 32 baseline); the ten-repository C = 32 table of 2026-09-04 re-instated, W = 516; see DERIVATION.md "The step back to C = 32 on the tiered host (2026-09-06)".
              nominalQuota: 4
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: livespec-orchestrator-git-jsonl-lq
  namespace: arc-runners  # phase 1's shared namespace for every ARC release
spec:
  clusterQueue: livespec-orchestrator-git-jsonl-cq
