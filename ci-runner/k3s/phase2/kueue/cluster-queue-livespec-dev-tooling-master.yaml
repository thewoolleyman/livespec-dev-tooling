# cluster-queue-livespec-dev-tooling-master.yaml — the Kueue ClusterQueue and
# LocalQueue for `livespec-dev-tooling`'s MASTER-PUSH CI slice.
#
# GENERATED BY HAND from the derivation in DERIVATION.md, which maps
# SPECIFICATION/non-functional-requirements.md section "Adaptive JIT runner
# admission budget" onto ARC and Kueue. Read DERIVATION.md "The master-push
# slice for livespec-dev-tooling (2026-11-03)" before changing any number here.
#
# THE ELEVENTH cohort member, and the FIRST that is not a whole repository.
# It is one repository's master-push events, split off onto their own scale set
# (../arc/values-livespec-dev-tooling-master.yaml) so that a master push no
# longer waits in the same GitHub assignment queue, behind the same 12-runner
# ARC ceiling, as that repository's pull-request CI. Work-item
# livespec-dev-tooling-lzkzwb, plan ci-runtime-and-cost (epic
# livespec-dev-tooling-ib3oe3), measurement in
# plan/ci-runtime-and-cost/research/003-master-push-ci-queue-time-2026-11-03.md.
# The pull-request queue, livespec-dev-tooling-cq, is unchanged at 6.
#
# nominalQuota derivation for THIS slice:
#   NOT a Hamilton share of job-hours. It is a RULED reservation
#   (legacy-coordinator-agent, 2026-11-03): 3 churn slots, MOVED from
#   livespec-orchestrator-beads-fabro-cq (29 -> 26) so the cohort still sums to
#   exactly C = 44. dev-tooling's own 6 was the first donor and was withdrawn:
#   see DERIVATION.md for the re-ruling and why.
#
# lendingLimit: 0 — the one cohort member that lends NOTHING. Every other
# queue lends its whole unused floor (Kueue's default). Reclaim is Never in this
# cohort (DERIVATION.md "NEVER EVICT A HEALTHY RUNNING JOB"), so a lent master
# slot would be borrowed by a pull-request backlog and only come back when that
# borrower's job finished — exactly the wait this slice exists to remove. With
# lendingLimit 0 the 3 slots sit idle when no master run is queued (3 of 44,
# 7 %), which is the ruled price. This queue may still BORROW above its 3 from
# idle peers, up to its scale set's maxRunners (6). lendingLimit is beta and
# enabled by default at the pinned Kueue v0.19.1 (see the v1beta2
# ClusterQueue CRD in core/upstream-manifests-v0.19.1.yaml).
#
# API version confirmed live against the pinned Kueue v0.19.1 install on
# poweredge-xubuntu: v1beta2's `spec.cohortName`, NOT v1beta1's `spec.cohort`.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: livespec-dev-tooling-master-cq
spec:
  cohortName: fleet-ci-runner-pool
  namespaceSelector: {}
  fairSharing:
    # Neutral like every sibling: the weight only influences preemption, and
    # preemption is Never below. See DERIVATION.md
    # "fairSharing.weight is deliberately left at 1, and is currently inert".
    weight: 1
  preemption:
    # The pool's three settings, restated EXPLICITLY (the per-repo queues rely
    # on the identical API defaults), because this is the queue a future reader
    # will reach for when they want master to jump the line. The answer is the
    # reserved slice above, never eviction: DERIVATION.md
    # "NEVER EVICT A HEALTHY RUNNING JOB" is a standing maintainer directive.
    reclaimWithinCohort: Never
    borrowWithinCohort:
      policy: Never
    withinClusterQueue: Never
  resourceGroups:
    - coveredResources: ["ci-runner.io/churn-slot"]
      flavors:
        - name: churn-slot-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              # Ruled reservation, 2026-11-03: see DERIVATION.md.
              nominalQuota: 3
              lendingLimit: 0
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: livespec-dev-tooling-master-lq
  namespace: arc-runners  # phase 1's shared namespace for every ARC release
spec:
  clusterQueue: livespec-dev-tooling-master-cq
