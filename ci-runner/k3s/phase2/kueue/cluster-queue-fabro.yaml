# cluster-queue-fabro.yaml — the Kueue ClusterQueue and LocalQueue for
# `thewoolleyman/fabro`, the fleet's Rust fork of Fabro.
#
# GENERATED BY HAND from the derivation in DERIVATION.md, which maps
# SPECIFICATION/non-functional-requirements.md section "Adaptive JIT runner
# admission budget" onto ARC and Kueue. Read DERIVATION.md "The fabro fork
# scale set (2026-11-05)" before changing any number here.
#
# THE TWELFTH cohort member (eleven whole repositories plus livespec-dev-tooling's
# master-push slice), and the first that is not a livespec repository. Work item
# bd-ib-dqxcsh, part (a). Its scale set is ../arc/values-fabro.yaml
# (`fabro-k3s`).
#
# nominalQuota derivation for THIS repo:
#   NOT a Hamilton share of job-hours: the fork has never run on this pool, so
#   it has no `cache.job-summary` job-hours to apportion from (DERIVATION.md
#   "Measured job-hours re-derivation at C = 44 (2026-10-22)"). Like the
#   master-push slice it is a DONATION: 1 churn slot MOVED from
#   livespec-orchestrator-beads-fabro-cq (26 -> 25), the cohort's largest quota
#   and the queue the apportionment rule's excess-deduction step takes from, so
#   the cohort still sums to exactly C = 44 (the 450-point JIT startup budget
#   caps the summed node capacity at 45; it cannot rise to make room).
#   Why 1 and not 0: the apportionment rule's step 5 gives no repository a
#   floor of zero, because a borrow-only queue under a saturated cohort starves
#   indefinitely (reclaim is Never here). Why not more: the scale set's ceiling
#   is 2 (a recorded exception, DERIVATION.md "Recorded exceptions to the
#   rule"), and a floor reserves capacity whether or not the fork is pushing.
#
# lendingLimit: NOT set, so this queue lends its whole unused floor like every
# member but the master slice. The fork is not a fleet merge gate; reserving
# its slot (lendingLimit: 0) would idle 1 of 44 slots whenever the fork is
# quiet, which is most of the time. The cost is that a lent slot comes back
# only when its borrower's job finishes.
#
# nominalQuota is this repo's GUARANTEED FLOOR, not its ceiling. The per-repo
# ceiling is a SEPARATE number — ../arc/values-fabro.yaml's maxRunners (2) —
# and the two are different terms of the same min(), correctly UNEQUAL; see
# DERIVATION.md "The four terms and where each one lives".
#
# API version confirmed live against the pinned Kueue v0.19.1 install on
# poweredge-xubuntu: v1beta2's `spec.cohortName`, NOT v1beta1's `spec.cohort`.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: fabro-cq
spec:
  cohortName: fleet-ci-runner-pool
  namespaceSelector: {}
  fairSharing:
    # Deliberately neutral. Kueue's fairSharing.weight only influences
    # PREEMPTION, and every queue in this cohort leaves preemption at Never
    # (the API default), so a non-1 weight would look meaningful while
    # changing nothing. See DERIVATION.md
    # "fairSharing.weight is deliberately left at 1, and is currently inert".
    weight: 1
  resourceGroups:
    - coveredResources: ["ci-runner.io/churn-slot"]
      flavors:
        - name: churn-slot-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              # 1, donated by livespec-orchestrator-beads-fabro-cq (26 -> 25)
              # on 2026-11-05. See DERIVATION.md "The fabro fork scale set
              # (2026-11-05)".
              nominalQuota: 1
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: fabro-lq
  namespace: arc-runners  # phase 1's shared namespace for every ARC release
spec:
  clusterQueue: fabro-cq
