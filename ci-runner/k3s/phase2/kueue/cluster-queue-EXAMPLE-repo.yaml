# cluster-queue-EXAMPLE-repo.yaml — TEMPLATE, not applied as-is.
#
# Copy to cluster-queue-<repo>.yaml for every OTHER fleet repository
# routed to local-ci (the fleet membership list lives in the livespec
# repo's .livespec-fleet-manifest.jsonc — this design pass deliberately
# ships ONE fully-worked example, livespec, per its "design half only"
# scope; rolling this pattern out to the rest of the fleet is
# incremental per-repo cutover work, livespec-s43svm.16).
#
# Replace EVERY <PLACEHOLDER> below:
#   <REPO>            — the repo's short name, e.g. "livespec-dev-tooling"
#   <MEASURED_SLOTS>   — that repo's own measured matrix width (read from
#                        its own ci-runner-supervisor.service ExecStart
#                        --slots value if it runs on the podman pool
#                        today, or its actual GitHub Actions matrix job
#                        count if not yet on local-ci at all — never
#                        guessed)
#   <DOUBLED_CEILING>  — <MEASURED_SLOTS> * 2, per SPECIFICATION/
#                        non-functional-requirements.md section
#                        "Adaptive JIT runner admission budget"
apiVersion: kueue.x-k8s.io/v1beta1
kind: ClusterQueue
metadata:
  name: <REPO>-cq
spec:
  cohort: fleet-ci-runner-pool
  namespaceSelector: {}
  fairSharing:
    weight: 1
  resourceGroups:
    - coveredResources: ["ci-runner.io/churn-slot"]
      flavors:
        - name: churn-slot-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              nominalQuota: <DOUBLED_CEILING>
---
apiVersion: kueue.x-k8s.io/v1beta1
kind: LocalQueue
metadata:
  name: <REPO>-lq
  namespace: arc-runners
spec:
  clusterQueue: <REPO>-cq
