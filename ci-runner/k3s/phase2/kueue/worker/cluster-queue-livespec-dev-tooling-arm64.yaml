# The arm64 container-worker queue for livespec-dev-tooling's Python CI
# (plan homelab-k8s-worker-nodes, livespec-dev-tooling-ko26ez.7).
#
# A TEMPLATE, outside ../cluster-queue-*.yaml on purpose: its quota is not a
# committed per-profile number but the sum of every enrolled arm64 container
# worker's derived ci-runner.io/churn-slot capacity, read from the Nodes when
# ../converge-worker-queues.sh renders @WORKER_CHURN_SLOTS@ (SPECIFICATION/
# non-functional-requirements.md, "Homelab worker nodes": a worker's derived
# churn-slot capacity counts in the cohort quota, and enrolling or removing a
# worker reconciles it). It joins the same cohort, so the committed
# profile-sum quotas stay exactly as they are.
#
# borrowingLimit 0: this queue never borrows the cohort's x86 churn slots. An
# arm64 runner cannot schedule on an x86 node, so a borrowed slot would be held
# by a pod that can never start, starving the x86 queues that lent it. With no
# arm64 worker enrolled (quota 0) the queue admits nothing, which is the
# intended fail-closed state (coordinator ruling, 2026-11-08, R301).
#
# lendingLimit 0: for the same reason in the other direction, this queue never
# lends its arm64 slots to the cohort. A slot lent to an x86 queue would be held
# by an x86 runner pod that cannot schedule on the arm64 worker advertising it
# (coordinator ruling, 2026-11-08, R301).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: livespec-dev-tooling-arm64-cq
spec:
  cohortName: fleet-ci-runner-pool
  namespaceSelector: {}
  fairSharing:
    weight: 1
  resourceGroups:
    - coveredResources: ["ci-runner.io/churn-slot"]
      flavors:
        - name: churn-slot-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              nominalQuota: @WORKER_CHURN_SLOTS@
              borrowingLimit: 0
              lendingLimit: 0
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: livespec-dev-tooling-arm64-lq
  namespace: arc-runners
spec:
  clusterQueue: livespec-dev-tooling-arm64-cq
