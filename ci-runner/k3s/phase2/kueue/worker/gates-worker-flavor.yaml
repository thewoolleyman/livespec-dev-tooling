# gates-worker-flavor.yaml — the gates-cq ResourceFlavor for the container
# workers of ONE architecture (livespec-dev-tooling-ko26ez.7), rendered per
# architecture by ../converge-worker-queues.sh, which places it FIRST in
# gates-cq's flavors with a quota of whole gates summed over the enrolled
# workers' gate shares. First means a worker takes its own share of the gates
# its architecture can run before the fleet's nodes, not only their overflow.
#
# nodeLabels select the class and the architecture, so Kueue never assigns this
# flavor to a gate whose required kubernetes.io/arch affinity (the gated
# repository's line in ../../workload-arch.conf) excludes @ARCH@, and it injects
# them as the admitted pod's node selector. The toleration is the one each
# enrolled class owes the permanent worker class taint (v154). No host is named.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gates-worker-taint-@ARCH@-flavor
spec:
  nodeLabels:
    homelab-worker.livespec.dev/class: worker
    kubernetes.io/arch: @ARCH@
  # nodeTaints, NOT tolerations. Kueue INJECTS a flavor's tolerations into every
  # pod it assigns, so a flavor carrying the class-taint toleration admitted any
  # gate that did not itself exclude arm64. A gate rendered by a repository's
  # older vendored renderer carries no arch rule, so console's python-rust gates
  # (amd64-only) were placed here and died with exec format error (2026-11-09
  # 22:29Z). With nodeTaints, Kueue assigns this flavor only to a pod that
  # ALREADY tolerates the class taint, which only the current gate template
  # does; its required kubernetes.io/arch affinity still keeps an amd64-only gate
  # off an arm64 worker.
  # RENAMED from gates-worker-@ARCH@-flavor for this change: Kueue refuses to
  # change a flavor's tolerations once topologyName is set, so the old flavor
  # cannot be edited in place. converge-worker-queues.sh drops every
  # gates-worker-*-flavor entry from gates-cq before adding the current ones,
  # so the old name leaves the queue in the same patch. The orphaned
  # gates-worker-arm64-flavor ResourceFlavor is then unused; deleting it is a
  # recorded follow-up on plan homelab-k8s-worker-nodes.
  nodeTaints:
    - key: homelab-worker.livespec.dev/class
      value: worker
      effect: NoSchedule
  topologyName: gates-hostname
