# cluster-queue-livespec-dev-tooling.yaml — the per-repository Kueue ClusterQueue and
# LocalQueue for `livespec-dev-tooling`.
#
# GENERATED BY HAND from the derivation in DERIVATION.md, which maps
# SPECIFICATION/non-functional-requirements.md section "Adaptive JIT runner
# admission budget" onto ARC and Kueue. Read that file before changing any
# number here. There is deliberately no generator script — see DERIVATION.md
# "Is a generator worth building?" for why, and for the recomputation steps
# when the host's churn-slot capacity changes.
#
# nominalQuota derivation for THIS repo:
#   demand weight w = 63 (podman-era ci-runner-supervisor apportionment)
#   fleet weight sum W = 516 (482 podman-era + livespec-driver-pi's 13 + livespec-orchestrator-beads-fabro's 21)
#   pool churn-slot capacity C = 44 (per-node since the 2026-11-03 rebalance: poweredge 24 + gmktec 12 + hp 8; poweredge 32 + gmktec 12 from R5; churn-slot capacity is per-node while the Kueue cohort quota is cluster-wide, so it sums to both nodes -- see DERIVATION.md "The derivation at C = 44 -- the two-node pool (2026-09-11)")
#   exact share = C * w / W = 5.3721  ->  floor 5, no leftover = 5
#
# The ten repositories' nominalQuota values sum to exactly 44 = C = 44 (plan
# k3s-on-gmktec-for-vps-usage / epic livespec-sab5gn R5, 2026-09-11). C is now
# the pool total — poweredge 24 + gmktec 12 + hp 8 since 2026-11-03, poweredge 32 + gmktec 12 from R5 — because churn-slot capacity is
# per-node while the Kueue cohort quota is cluster-wide, so the ten values sum to
# the pool's whole capacity across both nodes. Every repository's exact share
# exceeds 1, so the apportionment carries NO `max(1, ...)` excess. Cohort
# borrowing is bounded by the summed nominal quota, so a sum below it wastes
# capacity; keep the ten values summing to exactly C. See DERIVATION.md "The
# derivation at C = 44 -- the two-node pool (2026-09-11)".
#
# nominalQuota is this repo's GUARANTEED FLOOR, not its ceiling. Unused quota
# anywhere in the `fleet-ci-runner-pool` cohort is borrowable automatically,
# so this repo can burst well above 10 when its peers are idle. The per-repo
# ceiling is a SEPARATE number — ../arc/values-livespec-dev-tooling.yaml's maxRunners, which
# models the formula's "doubled repository logical ceiling" term. The two are
# different terms of the same min() and are correctly UNEQUAL; see
# DERIVATION.md "The four terms and where each one lives".
#
# API version confirmed live against the pinned Kueue v0.19.1 install on
# poweredge-xubuntu: v1beta2's `spec.cohortName`, NOT v1beta1's `spec.cohort`
# (accepted but deprecated).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: livespec-dev-tooling-cq
spec:
  cohortName: fleet-ci-runner-pool
  namespaceSelector: {}
  fairSharing:
    # Deliberately neutral. The demand weighting lives in nominalQuota above.
    # Kueue's fairSharing.weight only influences PREEMPTION, and every queue in
    # this cohort sets preemption to Never, so a non-1 weight here would look
    # meaningful while changing nothing. See DERIVATION.md
    # "fairSharing.weight is deliberately left at 1, and is currently inert".
    weight: 1
  resourceGroups:
    - coveredResources: ["ci-runner.io/churn-slot"]
      flavors:
        - name: churn-slot-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              # Measured-job-hours re-derivation, 2026-10-22: see DERIVATION.md.
              # UNCHANGED by the 2026-11-03 master-push slice: this repo's
              # master pushes moved to livespec-dev-tooling-master-cq, whose 3
              # slots came from the orchestrator, not from here (DERIVATION.md
              # "The master-push slice for livespec-dev-tooling (2026-11-03)").
              # 6 -> 9 on 2026-11-08 (R301, after the 6e5pyj step-4 KEEP): 3 slots from
              # livespec-orchestrator-beads-fabro-cq; the cohort stays 30. See DERIVATION.md.
              nominalQuota: 9
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: livespec-dev-tooling-lq
  namespace: arc-runners  # phase 1's shared namespace for every ARC release
spec:
  clusterQueue: livespec-dev-tooling-cq
