# cluster-queue-livespec-orchestrator-beads-fabro.yaml — the per-repository
# Kueue ClusterQueue and LocalQueue for `livespec-orchestrator-beads-fabro`.
#
# GENERATED BY HAND from the derivation in DERIVATION.md, which maps
# SPECIFICATION/non-functional-requirements.md section "Adaptive JIT runner
# admission budget" onto ARC and Kueue. Read that file before changing any
# number here. There is deliberately no generator script — see DERIVATION.md
# "Is a generator worth building?" for why, and for the recomputation steps
# when the host's churn-slot capacity changes.
#
# The Beads/Dolt + Fabro reference orchestrator, and the TENTH repository in
# the cohort — added 2026-09-04 (livespec plan
# `ci-runner-pod-lifecycle-reliability`, Carrier G1, `livespec-ifwnqj.1`). See
# DERIVATION.md "Recomputation on the tenth repository (2026-09-04)" for the
# full arithmetic; the summary is below.
#
# nominalQuota derivation for THIS repo:
#   demand weight w = 21 (this repo's MEASURED CI-matrix width: master CI run
#                         33893048859 dispatched exactly 21 jobs; not a
#                         podman-era inheritance)
#   fleet weight sum W = 516 (the 495 of nine repositories plus this 21)
#   pool churn-slot capacity C = 44 (per-node: poweredge 32 + gmktec 12; churn-slot capacity is per-node while the Kueue cohort quota is cluster-wide, so it sums to both nodes -- see DERIVATION.md "The derivation at C = 44 -- the two-node pool (2026-09-11)")
#   exact share = C * w / W = 1.7907  ->  floor 1, +1 leftover unit
#                                     (1st-largest remainder) = 2
#
# This repo held the leftover unit that codex lost when it joined as the tenth
# repository at C = 32 (`livespec-driver-codex` 5 -> 4). At the R5 two-node
# re-derivation (C = 44, 2026-09-11) its exact share 1.7907 earns a floor of 1
# PLUS the LARGEST leftover remainder in the whole cohort, so its quota rises
# 1 -> 2; the ten quotas sum to exactly C = 44 with no forced `max(1, ...)`
# excess.
#
# nominalQuota is this repo's GUARANTEED FLOOR, not its ceiling. Unused quota
# anywhere in the `fleet-ci-runner-pool` cohort is borrowable automatically,
# so this repo can burst well above 2 when its peers are idle. The per-repo
# ceiling is a SEPARATE number — ../arc/values-livespec-orchestrator-beads-fabro.yaml's
# maxRunners (6). The two are different terms of the same min() and are
# correctly UNEQUAL; see DERIVATION.md "The four terms and where each one lives".
#
# API version confirmed live against the pinned Kueue v0.19.1 install on
# poweredge-xubuntu: v1beta2's `spec.cohortName`, NOT v1beta1's `spec.cohort`
# (accepted but deprecated).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: livespec-orchestrator-beads-fabro-cq
spec:
  cohortName: fleet-ci-runner-pool
  namespaceSelector: {}
  fairSharing:
    # Deliberately neutral. The demand weighting lives in nominalQuota above.
    # Kueue's fairSharing.weight only influences PREEMPTION, and every queue in
    # this cohort sets preemption to Never, so a non-1 weight here would look
    # meaningful while changing nothing. See DERIVATION.md
    # "fairSharing.weight is deliberately left at 1, and is currently inert".
    weight: 1
  resourceGroups:
    - coveredResources: ["ci-runner.io/churn-slot"]
      flavors:
        - name: churn-slot-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              # C = 44 (2026-09-11, plan k3s-on-gmktec-for-vps-usage / epic livespec-sab5gn R5, resolving livespec-dev-tooling-xa6o): churn-slot capacity is now PER-NODE and the Kueue cohort quota is cluster-wide, so the ten nominalQuotas sum to the TWO-NODE total poweredge 32 + gmktec 12 = 44; W = 516; poweredge stays at its 2026-09-06 soak-measured 32, gmktec is the derived first value 12 (plan research/001 §3.5); see DERIVATION.md "The derivation at C = 44 -- the two-node pool (2026-09-11)".
              nominalQuota: 2
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: livespec-orchestrator-beads-fabro-lq
  namespace: arc-runners  # phase 1's shared namespace for every ARC release
spec:
  clusterQueue: livespec-orchestrator-beads-fabro-cq
