# cluster-queue-livespec-orchestrator-beads-fabro.yaml — the per-repository
# Kueue ClusterQueue and LocalQueue for `livespec-orchestrator-beads-fabro`.
#
# GENERATED BY HAND from the derivation in DERIVATION.md, which maps
# SPECIFICATION/non-functional-requirements.md section "Adaptive JIT runner
# admission budget" onto ARC and Kueue. Read that file before changing any
# number here. There is deliberately no generator script — see DERIVATION.md
# "Is a generator worth building?" for why, and for the recomputation steps
# when the host's churn-slot capacity changes.
#
# The Beads/Dolt + Fabro reference orchestrator, and the TENTH repository in
# the cohort — added 2026-09-04 (livespec plan
# `ci-runner-pod-lifecycle-reliability`, Carrier G1, `livespec-ifwnqj.1`). See
# DERIVATION.md "Recomputation on the tenth repository (2026-09-04)" for the
# full arithmetic; the summary is below.
#
# nominalQuota for THIS repo: 7, the churn-slot-flavor value below, which is
# the authority. The cohort's churn-slot-flavor quotas sum to 30, equal to the
# pool's registered churn-slot capacity: poweredge 17 + gmktec 6 + hp 4 +
# gamingpc 3 (DERIVATION.md "Per-node CPU budget cut: cohort 30 (2026-11-13)").
# The demand-weight apportionment at C = 44 that set the earlier values was
# superseded by the measured re-derivations from 2026-10-22 on, and each change
# since is a dated DERIVATION.md section. To change a quota, follow
# DERIVATION.md "Recomputing at another C" and keep the cohort's sum equal to
# the registered capacity: a sum above it promises slots no node has, and a sum
# below it idles capacity.
#
# nominalQuota is this repo's GUARANTEED FLOOR, not its ceiling. Unused quota
# anywhere in the `fleet-ci-runner-pool` cohort is borrowable automatically,
# so this repo can burst well above 7 when its peers are idle (except into the
# master-push slice, which lends nothing). The per-repo
# ceiling is a SEPARATE number — ../arc/values-livespec-orchestrator-beads-fabro.yaml's
# maxRunners (50). The two are different terms of the same min() and are
# correctly UNEQUAL; see DERIVATION.md "The four terms and where each one lives".
#
# API version confirmed live against the pinned Kueue v0.19.1 install on
# poweredge-xubuntu: v1beta2's `spec.cohortName`, NOT v1beta1's `spec.cohort`
# (accepted but deprecated).
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: livespec-orchestrator-beads-fabro-cq
spec:
  cohortName: fleet-ci-runner-pool
  namespaceSelector: {}
  fairSharing:
    # Deliberately neutral. The demand weighting lives in nominalQuota above.
    # Kueue's fairSharing.weight only influences PREEMPTION, and every queue in
    # this cohort sets preemption to Never, so a non-1 weight here would look
    # meaningful while changing nothing. See DERIVATION.md
    # "fairSharing.weight is deliberately left at 1, and is currently inert".
    weight: 1
  resourceGroups:
    - coveredResources: ["ci-runner.io/churn-slot"]
      flavors:
        - name: churn-slot-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              # Measured-job-hours re-derivation, 2026-10-22: see DERIVATION.md.
              # 29 -> 26 on 2026-11-03: three slots DONATED to the
              # livespec-dev-tooling master-push slice
              # (cluster-queue-livespec-dev-tooling-master.yaml) so the cohort
              # still sums to C = 44. See DERIVATION.md "The master-push slice
              # for livespec-dev-tooling (2026-11-03)".
              # 26 -> 25 on 2026-11-05: one more slot DONATED, to the fabro
              # fork's queue (cluster-queue-fabro.yaml), so the cohort still
              # sums to C = 44. See DERIVATION.md "The fabro fork scale set
              # (2026-11-05)".
              # 25 -> 17 on 2026-11-07: the cohort drops 44 -> 36 with gmktec-xubuntu's
              # churn slots 12 -> 4, and all 8 come from this queue, which held exactly
              # 17 admitted and 0 borrowed when ci-runtime-and-cost decided it. See
              # DERIVATION.md "gmktec to 4, cohort to 36 (2026-11-07)".
              # 17 -> 12 on 2026-11-08 (6e5pyj step 4): poweredge 23 -> 17 drops the cohort
              # 36 -> 30; this queue gives 5 and livespec-cq 1. See DERIVATION.md.
              # 12 -> 9 on 2026-11-08 (R301, after the 6e5pyj step-4 KEEP): 3 slots move to
              # livespec-dev-tooling-cq, the only queue holding waiting jobs at window end;
              # the cohort stays 30. See DERIVATION.md.
              # 9 -> 8 on 2026-11-12: the dedicated orchestrator master-push
              # lane receives the other slot, leaving dev-tooling master intact.
              # 8 -> 7 on 2026-11-13: the per-node CPU budget cuts gmktec 8 -> 6 and
              # hp 5 -> 4 and raises gamingpc 1 -> 3, so the cohort falls 31 -> 30.
              # legacy-coordinator-agent ruled the unit leaves this queue, with
              # dev-tooling-cq kept at 10. Its scale set's maxRunners follows the
              # bounded-multiple rule to max(2 x 7, 6) = 14 (was 16). See DERIVATION.md
              # "Per-node CPU budget cut: cohort 30 (2026-11-13)".
              nominalQuota: 7
        # The arm64 container workers' churn slots (livespec-dev-tooling-eorpen), listed AFTER
        # the fleet flavor at nominalQuota 0: this repository reaches a worker only by borrowing
        # once the fleet flavor, its own quota and what it can borrow, has no slot left. Listed
        # because this repository's release line in ../workload-arch.conf includes arm64, which
        # it does since check-metadata-batch's installer selects fabro's asset by `uname -m`
        # (livespec-orchestrator-beads-fabro 57bfd4a2, bd-ib-jjmywv).
        - name: churn-slot-worker-arm64-flavor
          resources:
            - name: "ci-runner.io/churn-slot"
              nominalQuota: 0
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: livespec-orchestrator-beads-fabro-lq
  namespace: arc-runners  # phase 1's shared namespace for every ARC release
spec:
  clusterQueue: livespec-orchestrator-beads-fabro-cq
