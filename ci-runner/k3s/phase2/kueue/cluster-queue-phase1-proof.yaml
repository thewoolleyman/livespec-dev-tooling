# cluster-queue-phase1-proof.yaml — the PHASE-1 proof ClusterQueue and
# LocalQueue, captured from the live cluster 2026-08-19 (livespec-s43svm.27)
# so every live Kueue object is regenerable from this repository.
#
# This pair is NOT part of the fair-share design and deliberately does not
# join the `fleet-ci-runner-pool` cohort: it has no `cohortName`, so it
# borrows from nobody and lends to nobody, and it is quota'd on plain
# cpu/memory over its own `phase1-proof-flavor` rather than on the
# `ci-runner.io/churn-slot` extended resource. It exists only to serve the
# phase-1 proof scale set (../arc/values-poweredge-xubuntu-k3s.yaml; its
# sibling `local-ci-k3s` was retired under livespec-s43svm.28), which is
# likewise not Kueue-gated on churn-slot.
#
# It is therefore excluded from DERIVATION.md's apportionment, and its quota
# is NOT counted toward the eight-repository sum that must equal the node's
# churn-slot capacity. Because it reserves cpu/memory rather than churn-slot,
# it cannot consume a churn-slot unit and cannot breach the physical cap.
#
# Retiring it together with the remaining phase-1 proof scale set, once phase 1
# has no remaining diagnostic value, is reasonable follow-up work — captured here
# rather than deleted, so the decision is made deliberately rather than by a
# `kubectl delete` nobody wrote down.
# Its own ResourceFlavor is carried here rather than in resource-flavor.yaml,
# which is the churn-slot flavor the eight fair-share queues share. Same node
# selector, different resources.
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: phase1-proof-flavor
spec:
  nodeLabels:
    k3s-role: arc-runner-host
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: phase1-proof-cq
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: ["cpu", "memory"]
      flavors:
        - name: phase1-proof-flavor
          resources:
            - name: "cpu"
              nominalQuota: 2
            - name: "memory"
              nominalQuota: 4Gi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: phase1-proof-lq
  namespace: arc-runners
spec:
  clusterQueue: phase1-proof-cq
