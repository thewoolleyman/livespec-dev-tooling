# 20-requires-datastore-mount.conf — k3s MUST NOT start unless the kine
# datastore directory is on its tmpfs mount. Installed to
# /etc/systemd/system/k3s.service.d/ by datastore-tmpfs/install-datastore-tmpfs.sh,
# i.e. only on a host whose datastore is deliberately volatile.
#
# WHY (2026-09-04, livespec-el5y): the directory UNDER the mount is not a
# rollback copy any more — after the array rebuild it holds a stale
# 2026-08-27 backup restore. A k3s that starts on it would run an old
# cluster state against live containers. Failing loud is the honest
# outcome; the reconstruct chain then reports the failed boot.
#
# ROLLBACK to an on-disk datastore therefore needs three steps, not two:
# stop k3s; `systemctl disable --now` the mount unit; REMOVE THIS FILE and
# `systemctl daemon-reload`; start k3s. With this file in place,
# `systemctl start k3s` pulls the (even disabled) mount unit back in.
#
# STOP ORDERING: a RequiresMountsFor= dependency also orders k3s's STOP
# before the mount's — stopping or failing this mount unit stops k3s.
# With this file, k3s's lifetime hangs off one more mount unit than the
# storage-layout drop-in alone; never stop the mount under a running k3s.
[Unit]
RequiresMountsFor=/var/lib/rancher/k3s/server/db
