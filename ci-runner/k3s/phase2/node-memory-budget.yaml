# Per-node memory budget for the execution pool.  This is deliberately a
# sibling of node-cpu-budget.yaml: runner-memory-slot owns the CPU file's
# runner-slot derivation, while this report reads those committed inputs without
# making the two capacity authorities contend for one file.
#
# The report is report-only until the fleet adopts this budget.  In particular,
# gmktec-xubuntu remains over-committed on its committed seven-pod ceiling; do
# not lower that ceiling here to make the report quiet.
#
# Gate and repro allocations are read from the named Kueue ResourceFlavors.
# Factory pod counts are read from each x86 node's host_vars
# `factory_pod_budget`; the sandbox request is read from the factory provider's
# committed process_spec.  Thus neither quantity is copied into this file.
#
# CI-runner memory is each x86 node's churn-slot capacity
# (phase0-bare-metal/profiles/<node>.env ADMISSION_CAPACITY_C) times the
# slot-weighted mean of the committed runner memory requests (arc/values-*.yaml,
# weighted by each queue's churn-slot quota in kueue/cluster-queue-*.yaml), so
# gmktec's zero slots claim no runner memory.  The macbook worker's slots are
# rendered at converge from the node, not committed, so its entry states 0.

nodes:
  gmktec-xubuntu:
    allocatable_memory_gib: 62.43
    system_memory_gib: 1.10
    gate_flavor: gates-flavor
    repro_flavor: gates-repro-gmktec-flavor
  poweredge-xubuntu:
    allocatable_memory_gib: 377.0
    system_memory_gib: 1.10
    gate_flavor: gates-poweredge-flavor
    repro_flavor: gates-repro-poweredge-flavor
  hp-xubuntu:
    allocatable_memory_gib: 27.2
    system_memory_gib: 0.60
    gate_flavor: gates-hp-flavor
    repro_flavor: gates-repro-hp-flavor
  gamingpc-xubuntu:
    allocatable_memory_gib: 92.38
    system_memory_gib: 16.0
    gate_flavor: gates-gamingpc-flavor
    repro_flavor: gates-repro-gamingpc-flavor
  macbook-m4-max-homelab-worker:
    allocatable_memory_gib: 64.0
    system_memory_gib: 10.0
    factory_pod_budget: 0
    gate_memory_gib: 0
    repro_memory_gib: 0
    runner_memory_gib: 0
