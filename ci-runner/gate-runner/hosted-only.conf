# hosted-only.conf — systemd drop-in for gate-runner-supervisor.service.
#
# This file is the COMPENSATING CONTROL for the fleet's hosted-only posture:
# the privileged gate-runner supervisor may not start at boot, only after an
# explicit operator opt-in (`touch /run/livespec-local-ci-enabled`, root). It
# was hand-applied on the live factory host on 2026-08-03 and committed here
# under livespec-s43svm.43 so that re-running provision-gate-runner.sh
# recreates the posture instead of converging a host where the supervisor
# auto-starts with no gate. The original drop-in body is kept VERBATIM below.
#
# "reboot-ephemeral" below is NOT a bound on a long-uptime host (44+ days of
# uptime observed on the live host at commit time); livespec-s43svm.43 tracks
# giving the opt-in a real expiry, and the separate question of whether this
# tier belongs on the factory host at all.
#
# Hosted-only fleet posture: local CI may start only after an explicit,
# reboot-ephemeral operator opt-in. Remove this drop-in when a later spec
# revision restores self-hosted CI.
[Unit]
ConditionPathExists=/run/livespec-local-ci-enabled
